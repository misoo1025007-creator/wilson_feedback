e08\ubc29 \ub5a8\uc5b4\uc9c4\ub2e4\ub294 \uc758\uacac\ub4e4\ub3c4 \uc788\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc544\uc9c1\uae4c\uc9c0\ub294 \uc2e0\ubc1c\uc740 \ud070 \ubc18\uc751 \uc5c6\uc2b5\ub2c8\ub2e4. \ud14c\ub2c8\uc2a4\ud654\uc758 \uc911\uc694\uc131\uc744 \ub9ce\uc774 \uc124\uba85\ub4dc\ub9ac\uace0, \uc65c \ud14c\ub2c8\uc2a4\ud654\ub97c \uc2e0\uc5b4\uc57c \ud558\ub294\uc9c0\uc758 \uc911\uc694\uc131\uc744 \ub9d0\uc500\ub4dc\ub9ac\uc9c0\ub9cc \uc62c\ucf54\ud2b8\ud654\ub85c\ub294 \ucda9\uc871\uc774 \uc880 \uc548\ub418\uc2dc\ub294\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc9c1\uc811 \uc9c1\uc6d0\ub4e4\uc774 \ud14c\ub2c8\uc2a4\ud654\ub85c \uacbd\ud5d8\ud574\ubcf4\uace0 \uacbd\ud5d8\uc18c\ube44\ub97c \ud574\ub4dc\ub9ac\uace0 \uc788\uc2b5\ub2c8\ub2e4\ub9cc, \ud14c\ub9b0\uc774\ubd84\ub4e4\ud55c\ud14c\ub9cc \ud310\ub9e4\uac00 \ub418\ub294\uac70 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud504\ub85c \uc2a4\ud399\uc744 \ucc3e\uc73c\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ud6e8\uc52c \ub9ce\uace0, \uac00\ubcbc\uc6b4 \ubb34\uac8c\ub294 \uc544\uc9c1 \ubc18\uc751\uc774 \uc880 \ub354\ub518\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uadf8\ub9ac\uace0 \uac00\ubcbc\uc6b4 \ubb34\uac8c\ub294 \ud640\uc138\uc77c\uc774\ub791 \uac19\uc740\ub0a0 \ucd9c\uc2dc\ub97c \ud574\uc11c \uadf8\ucabd\uc73c\ub85c \ub354 \uc3e0\ub9b0\uac70 \uac19\uc2b5\ub2c8\ub2e4. \ud310\ub9e4\ud558\ub294\ub370 \uc5b4\ub824\uc6c0\uc774 \uc788\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uacf5\ub3d9\uc0ac\uc740\ub3c4 \uc8fc\ub9d0\uc5d0 \uc9c4\ud589\ud558\uc9c0 \uc54a\uc558\uace0, \uc5f0\ud734 \uae30\uac04\uc73c\ub85c \uc778\ud574 \ub9e4\ucd9c \uc804\uccb4\uc801\uc73c\ub85c \ub2e4 \uac10\uc18c\ud558\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uae08\uc694\uc77c \uc5ed\uc2e0\uc7a5 \ub9e4\uc7a5\ub4e4 \ub9e4\uc7a5\uc5d0\uc11c \uac04\ub2e8\ud55c \ubbf8\ud305 \ud558\uc600\uc2b5\ub2c8\ub2e4. \uc804\ub144\ub3c4 \uc628\ub77c\uc778 \ub9e4\ucd9c\uc774 \ub192\uc558\uc5b4\uc11c \ub0a8\uc740 \ud558\ubc18\uae30 \ub300\uccb4\ud560 \ub9e4\ucd9c \ub9cc\ub4e4\uc5b4 \ub2ec\ub77c\uace0 \ud558\uc168\uc2b5\ub2c8\ub2e4."}],"8\uc6d43W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\ub9e4\ub2c8\uc800\uac00 \uc18c\uc18d\ub418\uc5b4\uc788\ub294 \uc0ac\ud68c\uc778\uc57c\uad6c\ud300\uc5d0\uc11c \ud4e8\uc5b4\ub4dc\ub77c\uc774 10\uc7a5 \ud310\ub9e4\ub418\uc5b4, \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \ud2f0\uc154\uce20 \ud310\ub9e4\uc728\uc774 \uc81c\uc77c \uc88b\uc558\uc2b5\ub2c8\ub2e4. \uc2e0\uc0c1\ud488 \uc5ec\uc131 \ub77c\uc778\ub4e4\ub3c4 \ud310\ub9e4 \uc88b\uc558\ub294\ub370 \uc544\uc9c1 \ub0a0\uc528\uac00 \uc560\ub9e4\ud574\uc11c \ubc18\ud314,\uc2a4\ucee4\ud2b8 \ub77c\uc778\ub4e4\ub9cc \ud310\ub9e4 \uc88b\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc544\uc9c1 \ub0a0\uc528\uac00 \uc560\ub9e4\ud558\uae30\ub3c4 \ud558\uace0, \uc880 \ub354 \uc120\uc120\ud574\uc838\uc57c FW \uc0c1\ud488\ub4e4\uc744 \ub9ce\uc774 \ucc3e\uc744\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc8fc\uc704\uc5d0 \uac19\uc774 \ud14c\ub2c8\uc2a4\uce58\uc2dc\ub294\ubd84\ub4e4\uacfc \uc598\uae30\ub97c \ub9ce\uc774 \ub098\ub204\ub294\ub370, \uc544\uc9c1 FW \uc790\ucf13\ub958\ub098 \uc0b4\uc9dd \ub450\uaebc\uc6b4 \uc544\uc774\ud15c\ub4e4\uc740 \uc0ac\uae30\uc5d0 \uc560\ub9e4\ud558\ub2e4\uace0 \ud558\uc2ed\ub2c8\ub2e4. \uadf8\ub807\ub2e4\uace0 \ubc18\ud314\ub958\uc758 \uc544\uc774\ud15c\uc744 \uc0ac\uae30\uc5d4 \uae30\uc874\uc5d0 \uc788\ub294\uac78\ub85c \ub300\uccb4\ud558\ub294 \ubd84\uc704\uae30 \uc785\ub2c8\ub2e4. FW\uc774 SS\ubcf4\ub2e4 \ub9e4\ucd9c\uc774 \uc880 \ub0ae\uae30 \ub54c\ubb38\uc5d0 3~5\uac1c\uc758 \uc544\uc774\ud15c\ub4e4\uc774 \uc785\uc18c\ubb38\uc73c\ub85c \ud310\ub9e4\ub418\uba74\uc11c \uc790\uc5f0\uc2a4\ub808 \ub9e4\uc7a5\uc73c\ub85c \uc785\uc810\ub418\uae38 \ubc14\ub784 \ubfd0\uc785\ub2c8\ub2e4. \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8, \ube45\uc560\ud50c \ub77c\uc778\uc5c5\ub4e4 \ud130\uce58\uc728 \uc88b\uace0 \ubc18\uc751\ub3c4 \uc88b\uc740\ub370 \uad6c\ub9e4\uc728\uc740 \uc870\uae08 \ub5a8\uc5b4\uc84c\ub358\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc8fc\ub9d0\uc5d0 \ub9ce\uc774 \ucc29\uc6a9\ud574\ubcf4\uc2dc\uace0 \uac00\uc168\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ubaa8\uc790,\uc591\ub9d0,\uc544\ub300\ub958\ub4e4\uc740 \uafb8\uc900\ud788 \ud310\ub9e4 \uc88b\uc2b5\ub2c8\ub2e4. \uad6c\ub9e4\ud558\uc2e4\ub54c \uaf2d 1\uac1c\ub85c \ub05d\ub098\uc9c0\uc54a\uace0 \uc5f0\uacc4\ud310\ub9e4 \ud558\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc774\ubc88\uc8fc\ub294 \ud1a0\ud2b8\ubc31,\uc9d0\ubc31\ub958\ub4e4\uc774 \ubc18\uc751 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \ubc31\ud329\uc774 \ud310\ub9e4\uc728\uc774 \uc88b\uc9c0 \ubabb\ud588\ub358 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud14c\ub9b0\uc774\ubd84\ub4e4\uc774 \ub9ce\uc774 \ubc29\ubb38\ud558\uc154\uc11c, \ubcfc\ud2b8\ud504\ub85c\ub77c\uc778\ub4e4\ub85c \ucd94\ucc9c \ub4dc\ub838\uc2b5\ub2c8\ub2e4. \ud14c\ub2c8\uc2a4\ud654\ub294 \uc5ec\ub7ec\uac00\uc9c0 \uc2e0\uc5b4\ubcf4\uc2dc\uba74\uc11c \ubcf8\uc778\ud55c\ud14c \ub9de\ub294 \uc2a4\ud0c0\uc77c\uc744 \ucc3e\uc544 \ub098\uac00\uc154\uc57c \ud55c\ub2e4\uace0 \uc124\uba85\ud569\ub2c8\ub2e4. \uc774\uc720\ub97c \uba85\ud655\ud788 \uc124\uba85 \ud6c4\uc5d0 \ub2e4\uc74c\uc5d0 \ub610 \ubc29\ubb38\ud560\uc218 \uc788\ub3c4\ub85d \ubaa8\ub450 \uc751\ub300 \uc911\uc785\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub514\ud30c\uc774\uc5b4 98PRO \ubb38\uc758\uac00 \ub9ce\uc2b5\ub2c8\ub2e4. 10\uc6d4\ub2ec \uc785\uace0 \uc548\ub0b4 \ub4dc\ub9ac\uace0 \uc788\uc2b5\ub2c8\ub2e4. 280g \ubb34\uac8c\uc758 \uc218\uc694\uac00 \uc810\ucc28 \ub298\uc5b4\ub098\uace0 \uc788\uc2b5\ub2c8\ub2e4. \ub77c\ucf13 \uc218\uc8fc\ud560\ub54c 260g \ubb34\uac8c\ubcf4\ub2e4 280g \ubb34\uac8c\uc758 \uc218\ub7c9\uc744 \ub298\ub9ac\ub294\uac8c \uc88b\uc544 \ubcf4\uc785\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"8\uc6d4 \uc785\uc810\uc774 \ubab8\uc18c \ub290\uaef4\uc9c8\uc815\ub3c4\ub85c \uc785\uc810\uac1d\uc774 \uc904\uc5c8\uc2b5\ub2c8\ub2e4. \ub0b4\uad6d\uc778 \uace0\uac1d\ub2d8\ub4e4\uc774 \ud2b9\ud788 \ub9ce\uc774 \uac10\uc18c\ud558\uc600\uc2b5\ub2c8\ub2e4. \ud734\uac00\uae30\uac04 \ubc0f \ub0a0\uc528\uc758 \uc601\ud5a5\uc774 \uaf64 \ud070\uac70 \uac19\uc2b5\ub2c8\ub2e4. 9\uc6d4\ubd80\ud130 \ubb54\uac00 \ub2e4\uc2dc \ud14c\ub2c8\uc2a4\ub97c \uc2dc\uc791\ud558\ub294 \ub290\ub08c\uc785\ub2c8\ub2e4. \ub9e4\uc7a5\uc5d0 \uc785\uc810\ud558\uba74\uc11c \ub9e4\ucd9c\uc774 \ubc1c\uc0dd\ud560\ub54c \uc0dd\uac01\ubcf4\ub2e4 \ud14c\ub9b0\uc774\ubd84\ub4e4 \uc544\ub2c8\uba74 \ucc98\uc74c \ubc29\ubb38\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \ub354 \ud310\ub9e4\uc728\uc774 \uc88b\uc740\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc790\uc8fc \uc624\uc2dc\ub294 \ubd84\ub4e4\ub3c4 \ub9ce\uc740 \uad6c\ub9e4 \ud574\uc8fc\uc2dc\ub294\ub370 \uae08\uc561\uc774 \uc0dd\uac01\ubcf4\ub2e4 \ub9ce\uc774 \ub0ae\uc2b5\ub2c8\ub2e4. \uc0c8\ub85c\uc6b4 \uace0\uac1d\ub2d8\ub4e4\uc758 \ubc29\ubb38\uc774 \ub9ce\uc544\uc57c \ub9e4\ucd9c\uc740 \ub354 \uc624\ub97c\uac70 \uac19\uc2b5\ub2c8\ub2e4."}],"8\uc6d44W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uc2a4\ucee4\ud2b8\ub958\ub4e4\uc774 \uc544\uc9c1\ub3c4 \ud310\ub9e4 \uc88b\uc740\uac70 \uac19\uc2b5\ub2c8\ub2e4. \ub514\uc790\uc778 \ub9cc\uc871\ub3c4\ub294 \uc88b\uc9c0\ub9cc \uacc4\uc808\uc2dc\uae30\uac00 \uc544\uc26c\uc6b4\uac70 \uac19\uc2b5\ub2c8\ub2e4. 30,40\ub300 \uc5ec\uc131\ubd84\ub4e4\uc758 \ubc29\ubb38\uc774 \ub9ce\uc558\ub358 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc720\ub2c8 \ub77c\uc778\uc911\uc5d0 \ud50c\ub808\uc774 \uc2a4\ud14c\uc774\ud2b8 \ubc18\ud314/\uae34\ud314 \ubaa8\ub450 \ubc18\uc751 \uc88b\uc558\ub358\uac70 \uac19\uc2b5\ub2c8\ub2e4. \ubc31\ud504\ub9b0\ud305\uc774 \uaf64 \ub9ce\uc774 \ub4e4\uc5b4\uac00\uc11c \ud638\ubd88\ud638\uac00 \uc788\ub294\uacbd\uc6b0\ub3c4 \uc788\uc9c0\ub9cc \uadf8\ub798\ub3c4 \ucd94\ucc9c\ub4dc\ub9ac\uba74 \uad6c\ub9e4\ub85c \uc774\ub8e8\uc5b4\uc9c0\ub294\uac70 \uac19\uc2b5\ub2c8\ub2e4. FW \uc544\uc774\ud15c\ub4e4\uc774 \uaf2d \uacc4\uc18d \ub450\uaebc\uc6cc\uc57c \ud55c\ub2e4\ub294\uac74 \uc544\ub2cc\uac70 \uac19\uc2b5\ub2c8\ub2e4. \ubc18\ubc14\uc9c0\uc758 \uacbd\uc6b0\ub3c4 \ub9e4\uc7a5\uc5d0\uc11c \uace0\uac1d\ub2d8\ub4e4\uc774 \ub290\ub07c\uc2dc\uae30\uc5d4 FW \uc0c1\ud488\ub4e4\uc740 \ub450\uaecd\ub2e4\ub294 \uc758\uacac\ub4e4\uc774 \ub9ce\uc2b5\ub2c8\ub2e4. \ucc28\ub77c\ub9ac \ub450\uaed8\uac10\uc740 \uac70\uc758 \ud070 \ucc28\uc774 \uc5c6\uac8c \ub9cc\ub4e4\uc5b4\ub3c4 \uc88b\uc744\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc2e0\uc0c1\ud488\ub4e4\uc774 \uc544\uc9c1 \ubc18\uc751\uc774 \uc5c6\ub294 \uc774\uc720\ub294 \ub0a0\uc528\uc758 \uc601\ud5a5\uc774 \ud070\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uae30\uc628\uc774 \uc880 \ub5a8\uc5b4\uc9c0\uba74 \uc790\uc5f0\uc2a4\ub808 \uc790\ucf13,\uae34\ubc14\uc9c0\ub958\ub4e4\uc758 \uc544\uc774\ud15c\ub4e4\uc774 \uacc4\uc18d \ud310\ub9e4 \ub420\uac70 \uac19\uc740\ub370, \uc544\uc9c1\uc740 \uc6b4\ub3d9\ud558\uae30\uc5d4 \ub354\uc6b4 \ub0a0\uc528\uc785\ub2c8\ub2e4. \uadf8\ub798\ub3c4 \uc8fc\ub9d0\uc5d0 \uae34\ud314\ud2f0,\uc790\ucf13,\uae34\ubc14\uc9c0 \ucc3e\uc73c\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uaf64 \ub9ce\uc774 \uc624\uc168\uc5c8\uc2b5\ub2c8\ub2e4. \uc5ec\uc131\ub77c\uc778\ub4e4\uc740 \ub0a0\uc528\ub9cc \uc880 \ub2ec\ub77c\uc9c0\uba74 \ud310\ub9e4\uc728 \uc62c\ub77c\uac08\uac70 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud654\uc774\ud2b8 \uc544\uc774\ubcf4\ub9ac \uceec\ub7ec\ub294 \uad6d\ub0b4\uc678 \ubaa8\ub450 \ubc18\uc751 \uc88b\uc740 \uc0c1\ud488\uc73c\ub85c \uc7ac\uace0\uac00 \uc5c6\uc5b4\uc11c \ub9e4\ucd9c \uac10\uc18c\uc5d0 \uc601\ud5a5\uc740 \uc788\ub294\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uad6d\ub0b4 \uace0\uac1d\ub2d8\ub4e4\uc740 \ub77c\uc774\ud2b8\uadf8\ub808\uc774 \uceec\ub7ec\ub85c \ub300\uccb4 \ud310\ub9e4\uac00 \ub418\ub294 \ud3b8\uc778\ub370, \ud551\ud06c,\ub808\ub4dc\ub85c\ub294 \uad6c\ub9e4 \ud558\uc2dc\ub294\uac70 \uac19\uc9c0\ub294 \uc54a\uc2b5\ub2c8\ub2e4. \uad6d\uc678 \uace0\uac1d\ub2d8\ub4e4\uc740 \ud654\uc774\ud2b8,\uc544\uc774\ubcf4\ub9ac \uceec\ub7ec\uc5d0 \uaf64 \uc88b\uc740 \ubc18\uc751\uc774 \uc788\uc2b5\ub2c8\ub2e4. \ud1a0\ud2b8\ubc31 \uac19\uc740 \uc544\uc774\ud15c\ub4e4 \ud310\ub9e4\uac00 \uc88b\uc740\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc5ec\uc131\ubd84\ub4e4\uc774 \uc4f0\uae30 \uc88b\uc740 \ud1a0\ud2b8\ubc31\uc5d0 \uc0ac\uc774\uc988\ub294 \ub77c\ucf13\uae4c\uc9c0\ub3c4 \uc218\ub0a9\ub418\ub294 \uc2a4\ud0c0\uc77c\uc774 \ud544\uc694\ud574\ubcf4\uc785\ub2c8\ub2e4. \uc608\uc0c1\ub300\ube44 \ud310\ub9e4 \uc804\ud658 \uc5b4\ub824\uc6b4 \uc2a4\ud0c0\uc77c\uc740 \ubaa8\uc790\ub77c\uace0 \uc0dd\uac01\ud558\ub294\ub370 \ubaa8\uc790\uac00 \uaf64 \ub9ce\uc740 \ub514\uc790\uc778\uc774 \ub098\uc624\ub294\ub370 \uc368\ubcf4\uc2dc\uace0 \uad6c\ub9e4\ub85c\uae4c\uc9c0 \uc774\ub8e8\uc5b4 \uc9c0\ub294 \uacbd\uc6b0\uac00 \uc0dd\uac01\ubcf4\ub2e4 \uc801\uc2b5\ub2c8\ub2e4. \uc544\ub2c8\uba74 \uae30\uc874\uc5d0 \uc788\uc5c8\ub358 \ubaa8\uc790\ub4e4\uc774\ub791 \ud070 \ucc28\uc774\uac00 \uc5c6\uc5b4\uc11c \uad6c\ub9e4 \uc8fc\uc800\ud558\uc2dc\ub294 \ubd80\ubd84\ub3c4 \uc788\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc5d0\uc5b4\ub9ac \ud551\ud06c \uceec\ub7ec \uc628\ub77c\uc778 \uc120\uacf5\uac1c \ud6c4 \ub9e4\uc7a5\uc73c\ub85c \uc785\uace0\ub418\uc5b4\uc11c \uc778\uc2a4\ud0c0\ub098 \uacf5\ud648 \ubcf4\uc2dc\uace0 \ubc29\ubb38 \uc8fc\uc168\ub358 \uace0\uac1d\ub2d8\ub4e4 \uaf64 \uc788\uc5c8\uc2b5\ub2c8\ub2e4. \ud14c\ub2c8\uc2a4 \uc2e0\ubc1c \uac00\uaca9\ub300\uac00 \ub2e4 \ub192\uc544\uc11c \ud14c\ub9b0\uc774\ubd84\ub4e4\uc774 \uc0ac\uc2dc\uae30\uc5d0 \ubd80\ub2f4\ub418\uc5b4 \ub0a8\uc131\ubd84\ub4e4 \ud14c\ub2c8\uc2a4\ud654 \ud310\ub9e4\uac00 \uc880 \uc5b4\ub835\uc2b5\ub2c8\ub2e4. \ubcfc\ud2b8\ud504\ub85c,\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c\ub85c\ub9cc \ud310\ub9e4 \uc9c4\ud589 \uc911\uc785\ub2c8\ub2e4. \ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8 \uacc4\uc18d \ud070\ubc18\uc751\uc740 \uc5c6\ub294\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uc5ec\uc131\ubd84\ub4e4\uaed8 \ucd94\ucc9c\ub4dc\ub9ac\uba74 \ucf54\ub514\uc5d0 \uc5b4\ub824\uc6c0\uc774 \uc788\uc744\uac70 \uac19\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \uaf64\ub098 \ub9ce\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud55c\uc815\ud310 \ub77c\ucf13 \uaf64 \ub9ce\uc774 \uc8fc\uc2dc\ub294\ub370 \uc5c6\uc5b4\uc11c \ud310\ub9e4 \uc5b4\ub824\uc6e0\uc2b5\ub2c8\ub2e4. \ube14\ub808\uc774\ub4dc\ub3c4 \uc778\uae30 \uc2a4\ud399\uc740 \uc7ac\uace0\uac00 \uc880 \ubd80\uc871\ud569\ub2c8\ub2e4. \ub514\ud30c\uc774\uc5b4\ub3c4 100UL 1\uadf8\ub9bd\uc740 \ub9e4\uc7a5\uc5d0 \uc5c6\uc5b4\uc11c \uc8fc\ubb38\uc73c\ub85c \ud310\ub9e4 \uc911\uc785\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uc804\uc8fc\ub300\ube44 \ub9e4\uc7a5 \uc785\uc810\uc740 10% \uc815\ub3c4 \ub354 \uac10\uc18c\ud55c\uac70 \uac19\uc2b5\ub2c8\ub2e4. \uae08\uc8fc \uc0ac\uc740\ud589\uc0ac\ub85c \uc778\ud574 \ub9e4\ucd9c\uc740 \uc18c\ud3ed \uc0c1\uc2b9\ud558\uc600\uc2b5\ub2c8\ub2e4."}]},"\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4":{"8\uc6d41W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\ub0a8\uc131 \uace0\uac1d \ube44\uc911\uc774 \ub298\uc5b4\ub09c \ub9cc\ud07 d6c\ub9e4 \uace0\uac1d\ub3c4 \ub298\uc5b4\ub0ac\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc544\uc9c1\uae4c\uc9c0 \ud070 \ubc18\uc751\uc740 \uc5c6\uc9c0\ub9cc, \ubcfc\ud2b8 \uc2a4\uce74\uc774\ube14\ub8e8\ub294 \ucd94\ud6c4 \uc88b\uc740 \ubc18\uc751\uc774 \uc788\uc744\uac70\ub77c \uc608\uc0c1\ud569\ub2c8\ub2e4. \ub0b4/\uc678\uad6d\uc778 \ubaa8\ub450 \uc7a1\uc744\uc218\uc788\uc744\ub9cc\ud55c \uceec\ub7ec\uc774\uace0 \ubb34\ub09c\ud558\uac8c \uac00\uc744\uae4c\uc9c0 \uac08\uac70\ub77c \ubcf4\uc5ec\uc9d1\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub77c\ucf13\uc740 \ube14\ub808\uc774\ub4dc \ud310\ub9e4 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \uadf8\ub9cc\ud07c \ub0a8\uc131 \uace0\uac1d\uc758 \ube44\uc911\uc774 \ub9ce\uc558\uace0, 1\ub144\uc774\uc0c1\uc758 \uace0\uac1d\ub4e4\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ucee4\ub9ac,\ube14\ub799,\ud654\uc774\ud2b8 \ud310\ub9e4 \uc88b\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ud734\uac00\uc2dc\uc98c \uc601\ud5a5\uc740 \ud56d\uc0c1 \uc788\ub294 \uc2dc\uae30\uc778\uac70\uac19\uc2b5\ub2c8\ub2e4. \uadf8\ub807\ub2e4\uace0 \uc810\ud3ec\ub0b4 \uc720\ub3d9\uc778\uad6c\uac00 \uc904\uc9c4 \uc54a\uc558\uc2b5\ub2c8\ub2e4. \ub2e8 \uc791\ub144\uacfc \ub2e4\ub978\uc810\uc740 \uc0ac\ub78c\ub4e4\uc758 \ucd08\uc810\uc774 \ud750\ub824\uc84c\uc2b5\ub2c8\ub2e4. \ubb34\ub354\uc6b4 \ub0a0\uc528\uc640 \ub354\ubd88\uc5b4 \ub9e4\uc7a5\uc73c\ub85c \uc720\uc785\uc2dc \uc9c0\uac11\uc740 \uc27d\uac8c \uc5f4\uc0dd\uac01\uc740 \ud558\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4. \uc194\uc9c1\ud788 \uc791\ub144 \uc6b8\ud2b8\ub77c, \uc0b0\ub9ac\uc624\uac00 \uc788\uc5c8\ub2e4\uace0 \ud558\ub354\ub77c\ub3c4 \ub9e4\ucd9c\uc758 \uc5c4\uccad\ub09c \uc601\ud5a5\uc744 \uc904\ub9cc\ud07c\uc758 \ubb3c\ub7c9\uc740 \uc544\ub2c8\ub77c\uace0 \uc0dd\uac01\ud569\ub2c8\ub2e4. \uadf8\ub9ac\uace0 \uc758\ub958\ucabd\uc5d0\uc11c \uc218\uc785\uc744 \ub9ce\uc774 \ud560\uac70\ub77c\uace0 \uc54c\uace0\uc788\ub294\ub370, \uc6d0\ud53c\uc2a4 \uc2a4\ud050 \ub108\ubb34 \ub9ce\uc2b5\ub2c8\ub2e4. \uc6d0\ud53c\uc2a4 \uc904\uc774\uace0 \uc2a4\ucee4\ud2b8 \ube0c\ub77c\ud0d1 \ub298\ub824\uc57c\ud569\ub2c8\ub2e4."}],"8\uc6d42W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\ud53c\ud305\uc740 \uc218\uc785\uc81c\ud488\uc774 \ub9ce\uc558\uc73c\ub098, \uc0ac\uc774\uc988 \uc774\uc288(\uc6d0\ub2e8\uc774 \ub72c\ub2e4\uac70\ub098)\ub85c \uc778\ud574 \uad6d\ub0b4 \uc81c\ud488\uc73c\ub85c \uc2a4\uc704\uce58\ud558\uc600\uc2b5\ub2c8\ub2e4. \ub2e8 \uae30\uc7a5\uc774 \uc9e7\uc740 \uc2a4\ud0c0\uc77c\ubcf4\ub2e4 \uae30\ubcf8 \uae30\uc7a5\uc744 \ub9ce\uc774 \uc120\ud638\ud558\uc600\uc73c\uba70, \uc544\uc9c1\uae4c\uc9c0\ub294 FW \uc81c\ud488\uc758 \ud130\uce58\ub294 \ub9ce\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud6c4\ub4dc\ubc14\ub9c9\uc744 \ub9ce\uc774 \ucc3e\uc558\uc2b5\ub2c8\ub2e4. \ubb3c\ub860 \ud3ed\ubc1c\uc801\uc778 \ubb38\uc758\uac00 \uc788\ub294\uac74 \uc544\ub2c8\uc9c0\ub9cc, FW\uc81c\ud488 \ubb38\uc758\uc911\uc5d0\uc11c \ud53c\ub4dc\ubc31\uc785\ub2c8\ub2e4. \ub9e8\ud22c\ub9e8\uc774\ub098 \ub450\uaed8\uac10\uc774 \uc788\ub294 \uc81c\ud488\uc740 \uac70\uc758 \ud130\uce58\uac00 \uc5c6\uc73c\uba70 \uba74\uc885\ub958\uc5d0\uc11c\ub294 \ucb49\ub514, \uc790\ucf13\uc740 \ubc14\ub9c9\uc815\ub3c4\uc758 \ub450\uaed8\uac00 \ud544\uc694\ud569\ub2c8\ub2e4. \ub2f9\uc7a5\uc758 \uc218\uc694\uac00 \uc544\ub2c8\uc5ec\ub3c4 \uc6b0\ub9ac\uac00 \uc774\ub7f0\uac78 \uac00\uc9c0\uace0\uc788\ub2e4\ub77c\ub294\uac78 \uc778\uc9c0\ud560\uc218\uc788\uac8c \ud574\uc57c \ud569\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\u c874\uc5d0 \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc5d0\uac8c \uc778\uae30\uac00 \ub9ce\uc558\ub358 \ub4dc\ub85c\uc6b0 \uc2a4\ud2b8\ub9c1 \ubc31\ud329\uc774 \ubcf4\uc628\ubcf4\ub0c9\uc6d0\ub2e8\uacfc \uac00\ubcbc\uc6b0\uba74\uc11c \uc218\ub0a9\uc774 \uc6a9\uc774\ud558\ub2e4\ub294 \ubd80\ubd84\uc5d0\uc11c \uc5b4\ud544\ub418\uc5b4 \uc77c\ubc18 \uace0\uac1d\ub4e4\uc758 \uad6c\ub9e4\ub3c4 \ub9ce\uc774 \uc774\ub8e8\uc5b4\uc84c\uc2b5\ub2c8\ub2e4. (\uae30\uc874 \ud14c\ub2c8\uc2a4 \uace0\uac1d 100% / \uae08\uc8fc \uc77c\ubc18\uace0\uac1d 60% \ud14c\ub2c8\uc2a4\uace0\uac1d 40%)"},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \uae00\ub85c\uc6b0 \ud2f0\uc154\uce20 W\uc758 \uc778\uae30\uac00 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \uae30\uc7a5\uac10\ub3c4 \uae38\uace0 \ub108\ubb34 \ubd99\uc9c0 \uc54a\ub294 \uc2a4\ud0c0\uc77c\ub85c, \uc2dc\uc6d0\ud558\uace0 \ud3b8\ud558\uac8c \uc785\uc744 \uc218 \uc788\ub2e4\ub294 \uc810\uc5d0 \uc77c\ubc18 \uc5ec\uc131 \uace0\uac1d\ub4e4\uc5d0\uac8c \uc120\ud638\ub3c4\uac00 \ub192\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc5f0\ud734\uae30\uac04\ub3d9\uc548 \ubaa8\uc790 \ubc18\uc751\uc774 \uc800\uc870\ud588\uc2b5\ub2c8\ub2e4. \uc2e0\uc0c1 \ubaa8\uc790\uc758 \ub514\uc790\uc778, \uceec\ub7ec\uac10\uacfc \uc18c\uc7ac\uac00 \ub370\uc77c\ub9ac\uc6a9\uc5d0 \uc801\ud569\ud574\uc11c  \uc77c\ubc18 \uace0\uac1d\ub4e4\uc5d0\uac8c \ud130\uce58\uac00 \uc788\uc5c8\uc9c0\ub9cc, \ud14c\ub2c8\uc2a4\ubb34\ub4dc\uac00 \uac15\ud55c \ub514\uc790\uc778 \ub54c\ubb38\uc5d0  \uad6c\ub9e4\ub97c \ub9dd\uc124\uc774\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \ubc18\uba74 \ud14c\ub2c8\uc2a4 \uace0\uac1d\ub4e4\uc740 \ubaa8\uc790\uc758 \ud1b5\uae30\uc131\uacfc  \uac00\ubcbc\uc6c0\uc744 \uc911\uc694\uc2dc\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc544 \uc544\uc9c1\uae4c\uc9c0\ub294 \ub77c\uc774\ud2b8 \ubaa8\uc158 \ucea1\uacfc \uac19\uc740  \uc2dc\uc6d0\ud55c \uc6b0\ube10 \uc6d0\ub2e8 \uc81c\ud488\ub4e4\uc744 \uc120\ud638\ud569\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ubcfc\ud2b8 \ud504\ub85c 1.5 \uc2a4\uce74\uc774\ube14\ub8e8\uc5d0 \ube44\ud574 \uae30\uc874 \ud654\uc774\ud2b8\ube14\ub8e8\ub098 \ud654\uc774\ud2b8\uadf8\ub9b0\uc774 \uc778\uae30\uac00 \uc88b\uc2b5\ub2c8\ub2e4. \uc608\uc0c1\ubcf4\ub2e4 \uc2a4\uce74\uc774\ube14\ub8e8\uc758 \ud130\uce58\ub294 \uc5c6\ub294 \ud3b8 \uc785\ub2c8\ub2e4.  \ub9ac\uc2a4\ud3f0\uc2a4 \ud504\ub85c 1.5 \ud130\ud504\ub3c4 \uc544\uc9c1 \uad6c\ub9e4\uc728\uc774 \ub192\uc9c0 \uc54a\uc9c0\ub9cc,  \ud130\uce58\ub294 \ub9ce\uc544\uc11c \ucd94\ud6c4 \ud14c\ub2c8\uc2a4\uace0\uac1d\uc758 \uc785\uc810\uc774 \ub9ce\uc544\uc9c0\uba74 \uc634\ub2c8\ucf54\ud2b8 \ubc0f \ud074\ub808\uc774\ud654\ub97c \ucc3e\ub294 \uace0\uac1d\ub4e4\uc5d0\uac8c  \uc5b4\ud544\ud558\uae30 \uc88b\uc744 \uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud14c\ub2c8\uc2a4 \uace0\uac1d \ub300\ube44 \uc77c\ubc18 \uace0\uac1d\uc758 \uc785\uc810\uc774 \uc99d\uac00\ud558\uba74\uc11c \ub77c\ucf13\uc758 \ud310\ub9e4\uc728\uc774 \uae09\uaca9\ud788 \ub5a8\uc5b4\uc84c\uc2b5\ub2c8\ub2e4. \ub514\ud30c\uc774\uc5b4\uc758 \uc7ac\uc785\uace0 \ubb38\uc758\ub294 \uc5ec\uc804\ud788 \ub9ce\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub18d\uad6c\uacf5\uacfc \uae00\ub7ec\ube0c\ub294 \uafb8\uc900\ud788 \ud130\uce58\uac00 \ub9ce\uc2b5\ub2c8\ub2e4. \uc5f0\ud734\ub3d9\uc548 \uac00\uc871\ub2e8\uc704\ub85c \ubc29\ubb38\ud558\ub294 \uace0\uac1d\ub4e4\uc774 \uc120\ubb3c\uc6a9\uc73c\ub85c \uad6c\ub9e4\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc544\uc84c\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ubcf8\uaca9\uc801\uc778 \ud734\uac00\uc2dc\uc98c\uc774 \uc2dc\uc791\ub418\uba74\uc11c \uc810\ud3ec\uc5d0 \uc785\uc810\ud558\ub294 \uace0\uac1d\uc758 \uc218\ub294 \ub298\uc5c8\uc9c0\ub9cc \ube0c\ub79c\ub4dc \uc785\uc810 \uace0\uac1d\uc218\ub294 \ubc18\ub300\ub85c \uc904\uc5c8\uc2b5\ub2c8\ub2e4. \ud3ed\uc5fc\uc774 \uc9c0\uc18d\ub418\uba74\uc11c \ud14c\ub2c8\uc2a4 \uace0\uac1d\ub4e4\ub3c4 \ucf54\ud2b8\uc5d0 \ub098\uac00\uae30 \uaebc\ub824\ud558\ub294 \ubd84\uc704\uae30\uc774\uba70, \uadf8\ub85c\uc778\ud574 \ub9e4\uc7a5\uc73c\ub85c \uc785\uc810\uc774 \ub9ce\uc774 \ub0ae\uc544\uc9c4 \uac83 \uac19\uc2b5\ub2c8\ub2e4. \uc810\ud3ec\uc5d0 \uc785\uc810\ud558\ub294 \ub9ce\uc740 \uace0\uac1d\ub4e4\uc911\uc5d0 \uc1fc\ud551\ubc31\uc744 \ub4e4\uace0\ub2e4\ub2c8\ub294 \uace0\uac1d\uc758 \ube44\uc911\uc774 30%\uc774\ub0b4\ub85c \uc18c\ube44\ub97c \ud558\uae30\uc704\ud574 \uc785\uc810\ud558\ub294 \ub290\ub08c\uc774\uc544\ub2c8\ub77c \ud53c\uc11c\ub97c \uc990\uae30\uae30\uc704\ud574 \uac00\uc871\ub2e8\uc704\ub85c \ubc29\ubb38\ud558\ub294 \ub290\ub08c\uc774 \ud07d\ub2c8\ub2e4. \uc18c\ube44\uc5d0 \uad49\uc7a5\ud788 \uc18c\uadf9\uc801\uc778 \ubd84\uc704\uae30 \uc785\ub2c8\ub2e4.  \uc804\ub144\uc5d0\ub294 \ud558\ub0a8\uc810\uc758 \uc624\ud508 \uc2dc\uae30\uc5ec\uc11c \ube0c\ub79c\ub4dc \uc785\uc810\uc774 \uc5c4\uccad \ub9ce\uc558\uc2b5\ub2c8\ub2e4."}],"8\uc6d42W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8\uc0c1\ud488\uc740 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc \uc154\ub9c1 \ud2f0\uc154\uce20 W'\uc640  '\ucee4\ube0c\ub77c\uc778 \ud2b8\ub799 \uc2a4\ucee4\ud2b8 W' \uc14b\uc5c5 \uc785\ub2c8\ub2e4.  \uc154\ub9c1 \ud2f0\uc154\uce20\uc758 \uae30\uc7a5\uac10\uc774 \uae34 \ud3b8\uc774\ub77c\ub294 \uc810\uc5d0 \ub300\ud55c \ubc18\uc751\uc774 \uc88b\uc558\uc73c\uba70, \uc0ac\uc774\ub4dc \ucabd \uc154\ub9c1 \ub514\ud14c\uc77c \ud3ec\uc778\ud2b8 \ub355\ubd84\uc5d0  \uc606 \ub77c\uc778\uc744 \uc870\uc808\ud574\uc11c \uc785\uc744 \uc218 \uc788\ub2e4\ub294 \uc810\uc5d0 \ub9cc\uc871\ub3c4\uac00 \ub192\uc558\ub358 \uc81c\ud488\uc785\ub2c8\ub2e4.  '\ucee4\ube0c\ub77c\uc778 \ud2b8\ub799 \uc2a4\ucee4\ud2b8'\uc640 \uac19\uc774 \ub9e4\uce58\ud558\uba74 \uc2a4\ud3ec\uce20 \uce90\uc8fc\uc5bc \ub290\ub08c\uc73c\ub85c,  \ud14c\ub2c8\uc2a4 \uace0\uac1d\ubfd0\ub9cc \uc544\ub2cc \uc77c\ubc18 \uace0\uac1d\uc5d0\uac8c\ub3c4 \uc120\ud638\ub3c4\uac00 \ub192\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc774\ubc88 FW \uc0c1\ud488\ub4e4 \uc911 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ud06c\ub8e8' \ud558\ud504\uc9d1\uc774  \ud130\uce58\uac00 \ub9ce\uc740 \ud3b8 \uc785\ub2c8\ub2e4. \uc77c\uad50\ucc28\uac00 \uc2ec\ud55c \ucd08\uac00\uc744\uc778 \ud604\uc7ac \ub0a0\uc528\uc5d0 \ud3b8\ub9ac\ud558\uac8c \uc785\uace0 \ubc97\uc744 \uc218 \uc788\uac8c \ud480\uc9d1\uc5c5\uc73c\ub85c \ub098\uc654\uc73c\uba74 \uc88b\uc558\uc744 \uac83 \uac19\ub2e4\ub294 \ubc18\uc751\uc774 \uc788\uc5c8\uc73c\ub098, \ub514\uc790\uc778\uc774 \uc608\uc058\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc544 \ub0a0\uc528\uac00 \uc120\uc120\ud574\uc9c0\uace0 \ub09c \uc774\ud6c4\uc5d0\ub294 \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8  \ud558\ud504\uc9d1\uacfc \ub9e8\ud22c\ub9e8 \uc2a4\ud0c0\uc77c\uc758 \ubc18\uc751\uc774 \ub354 \uc62c\ub77c\uac08 \uac83 \uac19\uc2b5\ub2c8\ub2e4.  \ud0c0\ube0c\ub79c\ub4dc \ub300\ube44 \uac00\uc744 \uc2dc\uc98c\uc758 \ud6c4\ub4dc \ud480\uc9d1\uc5c5 \uc2a4\ud0c0\uc77c\uc774  \ub9ce\uc9c0 \uc54a\uc740 \uac83 \uac19\uc2b5\ub2c8\ub2e4. \ub0a8\ub140\ub178\uc18c \ub298 \ub9ce\uc774 \ucc3e\ub294 \uc2a4\ud0c0\uc77c\ub85c, \ub2e4\uc591\ud55c \ud6c4\ub4dc \ud480\uc9d1\uc5c5\uc774 \ucd9c\uc2dc\ub41c\ub2e4\uba74 \ubc18\uc751\uc774 \uc88b\uc744 \uac83\uc73c\ub85c \uc608\uc0c1\ub429\ub2c8\ub2e4.  \uc804\uc8fc\ubd80\ud130 \ub0a0\uc528\uac00 \uc120\uc120\ud574\uc9c0\uba74\uc11c \uae34\ud314\uc758 \ud130\uce58\uac00 \uc99d\uac00\ud588\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \ud314 \ud0c8\ubd80\ucc29 \uc544\ub178\ub77d\uacfc \ud53c\uc2a4\ud14c\uc758 \ubc18\uc751\uc774 \uac00\uc7a5 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \uc694\uc998 \uac19\uc740 \uc77c\uad50\ucc28\uac00 \ud070 \ub0a0\uc528\uc5d0 \ubc18\ud314\uacfc \uae34\ud314 \ub458 \ub2e4 \ud65c\uc6a9\ud560 \uc218 \uc788\ub2e4\ub294 \uc810\uc774 \uac00\uc7a5 \ud06c\uac8c \uc5b4\ud544\uc774 \ub418\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2e0\uc0c1 \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 W\uc758 \ub514\uc790\uc778\uacfc \uceec\ub7ec\uac00  \uc608\uc058\ub2e4\ub294 \ubc18\uc751\uc774 \ub9ce\uc2b5\ub2c8\ub2e4.  \ud65c\uc6a9\ub3c4\ub97c \uace0\ub824\ud588\uc744 \ub54c \uacb0\uad6d \uad6c\ub9e4\ub294 \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329\uc73c\ub85c  \uc774\ub8e8\uc5b4\uc9c0\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc9c0\ub9cc, \ub514\uc790\uc778\uc758 \ubc18\uc751\uc774 \uc88b\uc544\uc11c \ucd94\ud6c4\uc758 \ubc18\uc751\uc774 \uae30\ub300\ub418\ub294 \uc0c1\ud669\uc785\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2e0\uc0c1 \uc218\uc785\ud654\uc758 \ud130\uce58\uac00 \ub9ce\uc740 \ud3b8 \uc785\ub2c8\ub2e4. \ub808\ub4dc \ud3ec\uc778\ud2b8 \uceec\ub7ec\uac00 \uc608\uc058\ub2e4\ub294 \ubc18\uc751\uc774 \ub9ce\uc73c\uba70,  \ud2b9\ud788 \ub7ec\uc26c\ud22c\uc5b4\uc640 \uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4\uc758 \ubc18\uc751\uc774 \uc88b\uc2b5\ub2c8\ub2e4. \uc5f0\ud734 \uae30\uac04\ub3d9\uc548 \ud14c\ub2c8\uc2a4 \uc785\uc810\uac1d\uc774 \uc904\uc5b4  \uc544\uc9c1 \ud310\ub9e4\uc728\uc774 \ub192\uc740 \uc0c1\ud669\uc740 \uc544\ub2c8\uc9c0\ub9cc, \uc774\ud6c4\uc5d0 \ud14c\ub2c8\uc2a4 \uace0\uac1d\ub4e4\uc5d0\uac8c \ubc18\uc751\uc774 \uc88b\uc744 \uac83\uc73c\ub85c \uc608\uc0c1\ub429\ub2c8\ub2e4.  \ubcfc\ud2b8\ud504\ub85c 1.5 W\uc758 \uceec\ub7ec\uc5d0 \ub300\ud55c \uae0d\uc815\uc801\uc778 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc558\uc9c0\ub9cc,  \uc544\uc9c1\uae4c\uc9c4 \uae30\uc874 WED, WGN \uc0c9\uc0c1\uacfc \uac19\uc740  \ud3ec\uc778\ud2b8 \uceec\ub7ec\uac00 \uc788\ub294 \uc81c\ud488\ub4e4\uc758 \ud130\uce58\uac00 \ub354 \ub9ce\uc2b5\ub2c8\ub2e4.   \ud074\ub808\uc774\uc640 \uc634\ub2c8\ucf54\ud2b8 \uc804\uc6a9\ud654\ub97c \ucc3e\ub294 \ud14c\ub2c8\uc2a4 \uace0\uac1d\ub4e4\uc774 \ub9ce\uc558\uc5c8\uae30 \ub54c\ubb38\uc5d0, \ub9ac\uc2a4\ud3f0\uc2a4 \ud504\ub85c 1.5 \ud130\ud504\ub3c4 \ucd94\ud6c4\uc5d0 \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc758 \uc785\uc810\uc774 \uc99d\uac00 \ud6c4  \uc5b4\ud544\ud558\uba74 \ubc18\uc751\uc774 \uc88b\uc744 \uac83\uc73c\ub85c \uc608\uc0c1\ub429\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub514\ud30c\uc774\uc5b4\uc758 \uc5ec\uc131 \uc2a4\ud399\uc774 \ub0a8\uc131 \uc2a4\ud399\uc5d0 \ube44\ud574 \ud310\ub9e4\uac00 \ub9ce\uc774 \ub418\uc5c8\uc2b5\ub2c8\ub2e4. \ub514\ud30c\uc774\uc5b4 \ub0a8\uc131 \uc2a4\ud399 \ucd9c\uc2dc \ub54c \ub0ae\uc740 \ubb34\uac8c\ub97c \ubb38\uc758\ud558\ub294  \uc5ec\uc131\uace0\uac1d\ub4e4\uc5d0\uac8c \uc0ac\uc804\uc608\uc57d\uc744 \ubc1b\uc558\uc73c\uba70, \ud558\ub0a8\uc2a4\ud0c0\uc988 \uc120\uc218\ubd84\ub4e4\uc758 \uc0ac\uc804\uc608\uc57d\ub3c4 \ub9ce\uc558\uae30\uc5d0  \uc774\ubc88 \uc5ec\uc131 \uc2a4\ud399\uc758 \ud310\ub9e4\uac00 \ube68\ub9ac \uc774\ub8e8\uc5b4\uc84c\uc2b5\ub2c8\ub2e4. \uc785\uc810 \uace0\uac1d\ub4e4\uc5d0\uac8c\ub3c4 \ub514\ud30c\uc774\uc5b4\uc758 \uc7a5\uc810\ub4e4\uc774 \uc798 \uc5b4\ud544\uc774 \ub418\uc5b4  \uc774\ubc88 \uc5ec\uc131 \uc2a4\ud399 \ucd9c\uc2dc\uc758 \ubc18\uc751\uc774 \ub354 \uc88b\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc5f0\ud734\uae30\uac04\ub3d9\uc548 \uae00\ub7ec\ube0c\uc640 \ub18d\uad6c\uacf5\uc758 \ud310\ub9e4\uac00 \uc99d\uac00\ud588\uc2b5\ub2c8\ub2e4.  \uac00\uc871\ub2e8\uc704\ub85c \ubc29\ubb38\ud558\ub294 \ubd84\ub4e4\uc5d0\uac8c \uc778\uae30\uac00 \uc88b\uc73c\uba70,  \uc120\ubb3c\uc6a9\uc73c\ub85c \uad6c\ub9e4\ud558\ub294 \ubd84\ub4e4\ub3c4 \ub9ce\uc544\uc84c\uc2b5\ub2c8\ub2e4."},{"cat":"\uc0c1\uc124","topic":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669","fb":"\u3131"},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uc804\uc8fc \ub300\ube44 \uace0\uac1d \uc785\uc810\uc774 \ub9ce\uc774 \ub5a8\uc5b4\uc84c\uc2b5\ub2c8\ub2e4.  \uc5f0\ud734 \uc2dc\uc98c\uc774 \ub418\uba74\uc11c \uc1fc\ud551\ubab0 \uc785\uc810\uc5d0 \ube44\ud574  \ub9e4\uc7a5 \uc785\uc810\uc774 \uc804\uccb4\uc801\uc73c\ub85c \ub9ce\uc774 \uc904\uc5c8\uc73c\uba70, \uae08\uc8fc\ub294 \uc1fc\ud551\ubab0 \uc785\uc810\ub3c4 \uc804\uc8fc\uc5d0 \ube44\ud574 \ub9ce\uc774 \uc904\uc5c8\uc2b5\ub2c8\ub2e4. \uac00\uc871\ub2e8\uc704\ub85c \ubc29\ubb38\ud558\ub294 \uace0\uac1d\ub4e4\uc740 \uc18c\ube44\uac00 \ubaa9\uc801\uc774 \uc544\ub2cc,  \ub354\uc704\ub97c \ud53c\ud558\uae30 \uc704\ud574 \ubc29\ubb38\ud558\ub294 \ub290\ub08c\uc774 \uac15\ud569\ub2c8\ub2e4. \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc758 \uc785\uc810\uc774 \uac10\uc18c\ud55c\uac83\uc740 \ub354\uc704\uc758 \uc601\ud5a5\uc774 \ud070 \uac83 \uac19\uc2b5\ub2c8\ub2e4."}],"8\uc6d43W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8\ub294 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \ud2f0\uc154\uce20 W' \uc785\ub2c8\ub2e4. \uc154\ub9c1\uc744 \uc870\uc808\ud574\uc11c \uccb4\ud615\ub9c8\ub2e4, \ub610\ub294 \ud558\uc758 \uc2a4\ud0c0\uc77c\uc5d0 \ub530\ub77c \ub9de\ucdb0\uc11c \uc785\uc744 \uc218 \uc788\ub2e4\ub294 \uc810 \ub54c\ubb38\uc5d0 \ub2e4\uc591\ud55c \uccb4\ud615\uc758 \uace0\uac1d\ub4e4\uc5d0\uac8c \ubaa8\ub450 \ub9cc\uc871\ub3c4\uac00 \ub192\uc558\uc2b5\ub2c8\ub2e4. \ucd08\uac00\uc744\uc778 \ud604\uc7ac \ub354\uc6b8\ub550 \ub2e8\ub3c5\uc73c\ub85c \ud3b8\ud558\uac8c \uc785\ub294 \uc6a9\ub3c4\ub85c,  \uc2dc\uc6d0\ud560\ub550 \ubc14\ub78c\ub9c9\uc774 \uc548\uc5d0 \ub808\uc774\uc5b4\ub4dc \ud558\ub294 \uc6a9\ub3c4\ub85c\ub3c4 \uc778\uae30\uac00 \uc88b\uc740 \uc544\uc774\ud15c \uc785\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc5f0\ud734 \uae30\uac04\ub3d9\uc5d0\ub294 \uac00\uc871\ub2e8\uc704\uc758 \ubc29\ubb38\uace0\uac1d\uc774 \ub9ce\uc558\ub358 \ubc18\uba74, \uc5f0\ud734\uac00 \ub05d\ub09c \uc2dc\uc810\ubd80\ud130\ub294 \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc758 \uc785\uc810\uc774 \uc99d\uac00\ud588\uc2b5\ub2c8\ub2e4. '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \ud2f0\uc154\uce20'\uc640 \uac19\uc740 \uae30\uc874 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ub77c\uc778\uc740 \uafb8\uc900\ud788 \uc778\uae30\uac00 \ub9ce\uc9c0\ub9cc, '\uc0ac\uc774\ub4dc \ud50c\ub9ac\uce20 \uc2a4\ucee4\ud2b8' \ub610\ub294 '\ud50c\ub808\uc774 \uc2a4\ud14c\uc774\ud2b8' \uc544\ub178\ub77d\uacfc \uac19\uc740 \uc2e0\uc0c1 \uc758\ub958\uc758 \ubc18\uc751\uc774 \ub354 \uc88b\uc740 \ud3b8 \uc785\ub2c8\ub2e4. \uad6c\ub9e4\ud558\ub294 \uace0\uac1d\ub4e4\uc740 \ub300\ubd80\ubd84 \ud14c\ub2c8\uc2a4 \uace0\uac1d\ub4e4\uc774\uba70, \uac00\uc744\uc744 \ub300\ube44\ud558\ub294 \uc6a9\ub3c4\ub85c,  \ub610\ub294 \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\uc810 \uc778\uc2a4\ud0c0 \ud53c\ub4dc \ubc0f \uc2a4\ud1a0\ub9ac\uc5d0 \uc62c\ub9ac\ub294 \uc2e0\uc0c1 \uc0ac\uc9c4\uc73c\ub85c \uc720\uc785\ub418\uc5b4 \uad6c\ub9e4\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc2b5\ub2c8\ub2e4. \uace0\uac1d\ub4e4\uc758 \ubbf8\uad6c\ub9e4 \uc774\ud0c8\uc740 \ucc3e\ub294 \uc0ac\uc774\uc988\uac00 \ud488\uc808\uc778 \uacbd\uc6b0\uc5d0 \uac00\uc7a5 \ub9ce\uc774 \ubc1c\uc0dd\ud569\ub2c8\ub2e4. \ub300\ubd80\ubd84 \ub9e4\uc7a5\uc758 \uc785\uc810\uac1d\ub4e4\uc740 \ubc29\ubb38\ud55c \uae40\uc5d0 \ub9e4\uc7a5\uc5d0 \uc788\ub294 \uc0c1\ud488\uc73c\ub85c \ubc14\ub85c \uad6c\ub9e4\ub97c \uc6d0\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc544, \uc8fc\ubb38\uc73c\ub85c \uc548\ub0b4\ub4dc\ub9ac\uba74 \uc774\ud0c8\ub85c \uc774\uc5b4\uc9c0\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc2b5\ub2c8\ub2e4. \uc804\uc8fc\uc5d0 \ube44\ud574 \uc624\uc804/\uc57c\uac04 \uc11c\ub298\ud55c \ub0a0\uc528\ub85c \uc778\ud574 W/B \ud0c8\ubd80\ucc29(\ud558\uc774\ube0c\ub9ac\ub4dc) \uae34\ud314 \uc885\ub958\ub97c \ucc3e\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc544\uc84c\uc9c0\ub9cc,  \ub0ae\uc5d0\ub294 \ub354\uc6b4 \ub0a0\uc528\uac00 \uc774\uc5b4\uc838 \uc544\uc9c1\uae4c\uc9c0\ub294 S/S \uc0c1\ud488\ub4e4\uc774 \ub354 \ub9ce\uc774 \ud310\ub9e4\ub418\uace0 \uc788\uc2b5\ub2c8\ub2e4.  \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc544\ub178\ub77d\uc758 \ud130\uce58\uac00 \ub9ce\uc740 \ud3b8 \uc785\ub2c8\ub2e4. \uceec\ub7ec\uac10\uc5d0 \ub300\ud55c \ubc18\uc751\ub3c4 \uc88b\uc73c\uba70  \ubc31 \ubd80\ubd84\uc5d0 \ud1b5\ud48d\uc744 \uc704\ud574 \ucd94\uac00\ub41c \uba54\uc26c \ub514\uc790\uc778\uc774 \uae30\ub2a5\uc801\uc778 \ubd80\ubd84 \ubfd0\ub9cc \uc544\ub2c8\ub77c \ub514\uc790\uc778\uc801\uc73c\ub85c\ub3c4 \uc608\uc058\ub2e4\ub294 \ubc18\uc751\uc774 \ub9ce\uc2b5\ub2c8\ub2e4. \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc911\uc5d0 \uae34\ud314\ub958\uc758 \ud130\uce58\ub294 \uc788\uc5c8\uc73c\ub098 \uc544\uc9c1\uae4c\uc9c0\ub294 \ub354\uc6b4 \ub0a0\uc528\ub85c \uad6c\ub9e4\uae4c\uc9c0 \uc774\uc5b4\uc9c0\uc9c0\ub294 \uc54a\uc558\uc2b5\ub2c8\ub2e4. \ub514\uc790\uc778\uc774\ub098 \ub514\ud14c\uc77c\uc5d0 \ub300\ud55c \ub9cc\uc871\ub3c4\ub294 \ub192\uc558\uc2b5\ub2c8\ub2e4.  \ube45\uc560\ud50c \ub77c\uc778\uc5c5\uc5d0\uc120 \uc5ec\uc131, \uadf8\ub9ac\uace0 \ub0a8\uc131 \ud30c\uc778\ucf54\ud2bc \ud2f0\uc154\uce20\uc758 \ud130\uce58\uac00 \uc788\ub294 \ud3b8 \uc785\ub2c8\ub2e4. \ud2b9\ud788 \ub0a8\uc131 '\ube45\uc560\ud50c \ud30c\uc778\ucf54\ud2bc \ud2f0\uc154\uce20'\uc758 \ud130\uce58\uac00 \ub9ce\uc9c0\ub9cc \uc544\uc9c1\uae4c\uc9c4  \uae30\uc874 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \ud2f0\uc154\uce20'\uc758 \uc778\uae30\uac00 \ub354 \uc88b\uc2b5\ub2c8\ub2e4. \ube45\uc560\ud50c \ub77c\uc778\uc5c5\uc758 \ub514\uc790\uc778\uc774 \uc608\uc058\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc544 \uc55e\uc73c\ub85c\uc758 \ubc18\uc751\uc774 \uae30\ub300\ub418\ub294 \uc0c1\ud669\uc785\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31W\uc758 \ud130\uce58\uac00 \ub9ce\uc2b5\ub2c8\ub2e4. \uc5ec\uc720\uc788\ub294 \uc218\ub0a9\uacf5\uac04\uacfc \uacbd\ub7c9\uc131\uc774 \uc5b4\ud544\uc774 \ub418\uc5b4 \ud14c\ub2c8\uc2a4 \uace0\uac1d \ubfd0\ub9cc \uc544\ub2c8\ub77c \uc77c\ubc18 \uace0\uac1d\uc5d0\uac8c\ub3c4 \ubc18\uc751\uc774 \uc88b\uc2b5\ub2c8\ub2e4. \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31\uc740 \uc5ec\uc131\ubd84\ub4e4\uc5d0\uac8c \ud130\uce58\uac00 \ub9ce\uc9c0\ub9cc \uc218\ub0a9\uacf5\uac04\uacfc \ub514\uc790\uc778\uc744 \ube44\uad50\ud574\ubcf4\uc558\uc744 \ub54c \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\uc758 \uce90\uc8fc\uc5bc\ud55c \ub514\uc790\uc778\uacfc \ub113\uc740 \uc218\ub0a9\ub825\uc758 \ud65c\uc6a9\ub3c4\ub97c \uace0\ub824\ud574 \uad6c\ub9e4\ub294 \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\uc73c\ub85c \uc774\uc5b4\uc9c0\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2e0\uc0c1 \ub7ec\uc26c \ud22c\uc5b4\ub791 \uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4\uc758 \ud130\uce58\ub294 \uafb8\uc900\ud788 \uc788\uc2b5\ub2c8\ub2e4. \uc804\uc8fc\ub294 \ud310\ub9e4\uac00 \ub418\uc5c8\uc9c0\ub9cc \uc774\ubc88\uc8fc\ub294 \ubcfc\ud2b8\ud504\ub85c\uc640 \uc5d0\uc5b4\ub9ac\uc758 \ubc18\uc751\uc774 \ub354 \uc88b\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub514\ud30c\uc774\uc5b4 100UL, 100L\uc758 \ubc18\uc751\uc774 \uc5ec\uc804\ud788 \uc88b\uc73c\uba70, \ub0a8\uc131\uc2a4\ud399 \ubb38\uc758\uac00 \ub9ce\uc740 \uc0c1\ud669\uc785\ub2c8\ub2e4. US OPEN \ub77c\ucf13\uc758 \ubc18\uc751\uc774 \uc62c\ub77c\uc624\uace0 \uc788\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub18d\uad6c\uacf5 \uc57c\uad6c\uacf5\uc758 \ud310\ub9e4\uac00 \ub9ce\uc774 \ub418\uc5c8\uc2b5\ub2c8\ub2e4. \ub18d\uad6c\ud654\ub97c \ucc3e\uc73c\uc2dc\uac70\ub098 \uc57c\uad6c \ubc30\ud2b8 \ubc0f \uae30\ud0c0 \uc6a9\ud488\uc758 \ubb38\uc758\uac00 \uc788\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\uc0c1\uc124","topic":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669","fb":"\u3131"},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ub0b4\uad6d\uc778\uc758 \ube44\uc911\uc740 4~5\uc6d4 \ub300\ube44 \ub0ae\uc544\uc84c\uc2b5\ub2c8\ub2e4. \uc678\uad6d\uc778\uc758 \ube44\uc911\uc740 \ube44\uc2b7\ud569\ub2c8\ub2e4.  \uc785\uc810\ud558\ub294 \uace0\uac1d\ub4e4\uc758 \ucd94\uc138\ub294 \uc804\uc8fc\ubcf4\ub2e4 \uae08\uc8fc\uc758 \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc758 \uc785\uc810\uc740 \uc870\uae08 \ub298\uc5c8\uc73c\ub098, 6~8\uc6d4 \uc804\uccb4\uc801\uc73c\ub85c\ub294 \uc774\uc804(\uc804\ub144\ud3ec\ud568)\ubcf4\ub2e4 \ud604\uc800\ud788 \ub0ae\uc544\uc84c\uc2b5\ub2c8\ub2e4. \uc77c\ubc18 \uace0\uac1d\uc758 \uc785\uc810\uc740 \uc774\uc804\uacfc \ub3d9\uc77c\ud569\ub2c8\ub2e4."}],"8\uc6d44W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8\ub294 '\uc0ac\uc774\ub4dc \ud50c\ub9ac\uce20 \uc2a4\ucee4\ud2b8 W' \uc785\ub2c8\ub2e4. \uae30\uc7a5\uac10\uc774 \uae34 \ud3b8\uc774\ub77c\ub294 \uc810\uc5d0 \ub300\ud55c \ub9cc\uc871\ub3c4\uac00 \ub9e4\uc6b0 \ub192\uc558\uc73c\uba70, \uc606\ucabd \ud50c\ub9ac\uce20 \ub514\ud14c\uc77c\uacfc A \ub77c\uc778\uc73c\ub85c \uc7a1\ud600\uc788\ub294  \uc2e4\ub8e8\uc5e3\uc774 \uc608\uc058\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uac00\uc744\uc774 \ub2e4\uac00\uc624\uba70 \ub2e4\uc591\ud55c \uae34 \ud314 \uc0c1\uc758\uc640 \ub9e4\uce58\ud558\uae30  \uc801\ud569\ud55c \uc2a4\ucee4\ud2b8\ub77c\ub294 \uc758\uacac\uc774 \ub9ce\uc2b5\ub2c8\ub2e4.  \uc544\uc9c1\uc740 \uacc4\uc808\uc2dc\uae30\uac10 \ub54c\ubb38\uc5d0 \uc2e0\uc0c1 \uc758\ub958 \uc911 \uae34\ud314 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc678\uc5d4 \ud310\ub9e4\uac00 \uc800\uc870\ud55c \ud3b8\uc774\uc9c0\ub9cc, \uac00\uc744 \uc2e0\uc0c1\uc758\ub958\uc5d0 \ub300\ud55c \ubc18\uc751\uc774 \ub9e4\uc6b0 \uc88b\uc544 \ub0a0\uc528\uac00 \ud480\ub9b0 \uc774\ud6c4\uc5d0 \ubc18\uc751\uc774 \uc62c\ub77c\uc62c \uac83\uc73c\ub85c \uc608\uc0c1\ub429\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud604\uc2dc\uc810 \ubc18\ud314\ud2f0 \uc911\uc5d0\uc120 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \ud2f0\uc154\uce20'\uc758 \ubc18\uc751\uc774, \uae34\ud314\ud2f0 \uc911\uc5d0\uc120 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \uae34\ud314 \ud2f0'\uc758  \ubc18\uc751\uc774 \uc88b\uc2b5\ub2c8\ub2e4. \ub2e4\ub9cc, \ub450\uac00\uc9c0 \uc911\uc5d0\uc11c\ub294 \uc544\uc9c1\uae4c\uc9c0\ub294  \ubc18\ud314\ud2f0\uac00 \uc870\uae08 \ub354 \ub9ce\uc774 \ud310\ub9e4\ub429\ub2c8\ub2e4.  '\ud50c\ub808\uc774 \uc2a4\ud14c\uc774\ud2b8 \uc544\ub178\ub77d W'\uc774 \ud604\uc7ac  \uac00\uc744\uc2e0\uc0c1 \uc911 \ubc18\uc751\uc774 \uac00\uc7a5 \uc88b\uc2b5\ub2c8\ub2e4. \ubc31 \ub514\ud14c\uc77c\uc758 \uae30\ub2a5\uc801\uc778,  \uadf8\ub9ac\uace0 \ub514\ud14c\uc77c\uc801\uc778 \ub9cc\uc871\ub3c4\uac00 \uad49\uc7a5\ud788 \ub192\uc9c0\ub9cc, \ubc11\ub2e8\uc758 \uc2a4\ud2b8\ub9c1\uc744 \uc7a1\uace0 \ucc29\uc6a9\ud588\uc744 \uc2dc \uc785\uccb4 \uc8fc\ub984 \ubd80\ubd84\uc774 \ub4e4\ub5a0\uc11c \uc637 \ubcf8\ud310\uacfc  \uacf5\uac04\uc774 \ub9ce\uc774 \ub0a8\uc544 \uc5b4\uc0c9\ud558\ub2e4\ub294 \ud53c\ub4dc\ubc31\ub3c4 \uc788\uc2b5\ub2c8\ub2e4. \uc8fc\ub984 \ub514\ud14c\uc77c \ubd80\ubd84\uc758 \uae30\uc7a5\uc744 \ucd95\uc18c\ud558\uac70\ub098 \ud558\ub2e8\uc5d0 \ubb34\uac8c\uac10\uc774 \ucd94\uac00\ub41c\ub2e4\uba74  \ubcf8\ud310\uacfc \uc5f0\uacb0\ub418\ub294 \ub290\ub08c\uc758 \uc790\uc5f0\uc2a4\ub7ec\uc6b4 \ud54f\uc774  \uc644\uc131\ub420 \uac83 \uac19\uc2b5\ub2c8\ub2e4.  \ub0a8\uc131 \ub77c\uc778 \uc911\uc5d0\uc120 '\ud50c\ub808\uc774 \uc2a4\ud14c\uc774\ud2b8 \ud14c\ub2c8\uc2a4 \uc790\ucf13'\uc5d0  \ub300\ud55c \ubc18\uc751\uc774 \uc88b\uc2b5\ub2c8\ub2e4. \ub4f1\ud310\uc758 \ud504\ub9b0\ud2b8\uc640 \uc785\uccb4 \uc8fc\ub984 \ub514\ud14c\uc77c\uc774  \uc608\uc058\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uae54\ub054\ud55c \ud54f\uc758 \uc2a4\ud0e0\ub4dc\ub125 \uc2a4\ud0c0\uc77c\uc774\ub77c\uc11c  \ub300\ubd80\ubd84 4-50\ub300\uc5d0\uac8c \ubc18\uc751\uc774 \uc88b\uc740 \ud3b8\uc73c\ub85c, \ube44\uc2b7\ud55c \uc2a4\ud0c0\uc77c\uc758 \ud6c4\ub4dc \ubc14\ub78c\ub9c9\uc774 \uc885\ub958\uac00 \uc788\uc5c8\ub2e4\uba74  \uc80a\uc740 \uce35\uc758 \ub0a8\uc131\ub4e4\uc5d0\uac8c \uc778\uae30\uac00 \ub9ce\uc558\uc744 \uac83 \uac19\ub2e4\ub294  \uc544\uc26c\uc6c0\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.  \uae30\uc874 '\ucee4\ube0c\ub77c\uc778 \ud2b8\ub799 \uc2a4\ucee4\ud2b8 W'\uc5d0 \uc774\ub108\ud32c\uce20\uac00 \ucd94\uac00\ub41c\ub2e4\uba74  \ub354\uc6b1 \ubc18\uc751\uc774 \uc88b\uc744 \uac83\uc73c\ub85c \uc608\uc0c1\ub429\ub2c8\ub2e4. \uacc4\uc808\uac10\uc744 \ud0c0\uc9c0 \uc54a\ub294 \uc2a4\ud3ec\ud2f0 \uce90\uc8fc\uc5bc \uc2a4\ud0c0\uc77c\ub85c,  \ud14c\ub2c8\uc2a4 \uace0\uac1d\ubfd0\ub9cc \uc544\ub2c8\ub77c \uc77c\ubc18 \uace0\uac1d\uc5d0\uac8c\ub3c4  \uc778\uae30\uac00 \uc88b\uc740 \uc0c1\ud488\uc774\uc9c0\ub9cc, \uc774\ub108\ud32c\uce20\uc758 \ubd80\uc7ac\ub85c \uad6c\ub9e4\ub97c \ub9dd\uc124\uc774\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc2b5\ub2c8\ub2e4.  \ud14c\ub2c8\uc2a4 \uace0\uac1d\ub4e4\uc5d0\uac90 \uc774\ub108\ud32c\uce20\ub97c \ub530\ub85c \uc785\uc5b4\uc57c\ud55c\ub2e4\ub294 \uac83\uc774 \ubc88\uac70\ub86d\ub2e4\ub294 \uc758\uacac\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \ud310\ub9e4\uc6a9 \uc774\ub108\ud32c\uce20\ub97c \uc5f0\uacc4\ud558\ub824\uace0 \uc2dc\ub3c4\ud574\ubcf4\uba74 \uac00\uaca9\uc800\ud56d\uc774 \ucef8\uc2b5\ub2c8\ub2e4..!!  \ub354\uc6b4 \ub0a0\uc528\uac00 \uc774\uc5b4\uc9c0\uba70 \uc544\uc9c1 \uac00\uc744 \uc758\ub958\uc5d0 \ub300\ud55c \uad6c\ub9e4 \uc218\uc694\uac00 \ub0ae\uc544  \ub9e4\ucd9c \uc0c1\uc2b9\uc5d0 \ud55c\uacc4\uac00 \uc788\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329 V2 WHT\uc640 BLK\uc758 \uc7ac\uace0 \uc18c\uc9c4\uc73c\ub85c \uc778\ud574  \ub9e4\ucd9c \uac10\uc18c 15\ud504\ub85c \uc815\ub3c4 \uc788\uc2b5\ub2c8\ub2e4. \uae30\ubcf8 \uceec\ub7ec\ub97c \ucc3e\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc544 \ub2e4\ub978 \uceec\ub7ec\ub85c  \ud310\ub9e4 \uc804\ud658\ub418\ub294 \uacbd\uc6b0\ub294 \ub4dc\ubb3c\uc9c0\ub9cc, '\ub4c0\uc624 \ud50c\ub7a9 \ubc31\ud329'\uc73c\ub85c \uc2a4\ud0c0\uc77c \uad00\uc2ec\uc774  \uc804\ud658\ub418\ub294 \uacbd\uc6b0\ub294 \uac04\ud639 \uc788\uc2b5\ub2c8\ub2e4.   \ubc31\ud329 \uc678\uc5d0 \ub9ce\uc774 \ucc3e\ub294 \uc2a4\ud0c0\uc77c\uc740 '\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31' \ub610\ub294  '\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31'\uacfc \uac19\uc740 \uce90\uc8fc\uc5bc\ud558\uc9c0\ub9cc \uc218\ub0a9\uacf5\uac04\uc774 \uc5ec\uc720\ub85c\uc6b0\uba70 \ubb34\uac8c\uac00  \uac00\ubcbc\uc6b4 \uc81c\ud488\ub4e4 \uc785\ub2c8\ub2e4.  \ubc18\uba74 \uc608\uc0c1\ub300\ube44 \ud310\ub9e4 \uc804\ud658\uc774 \uc5b4\ub824\uc6b4 \uc2a4\ud0c0\uc77c\uc740  '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31'\uacfc '\ub450 \uc62c \ud1a0\ud2b8\ubc31' \uc785\ub2c8\ub2e4. \ub450 \uc0c1\ud488 \ub2e4 \ub514\uc790\uc778\uc801\uc73c\ub85c \uae0d\uc815\uc801\uc778 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc9c0\ub9cc,  \uc218\ub0a9\ub825\uc774 \ubd80\uc871\ud560 \uac83 \uac19\ub2e4 \ub77c\ub294 \uc758\uacac\uc774 \ub9ce\uc544 \uad6c\ub9e4\ub85c \uc774\ub8e8\uc5b4\uc9c0\uc9c0 \uc54a\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"2-30\ub300 \uc5ec\uc131 \ubd84\ub4e4\uc5d0\ua uc774 \uac01\uc778 \ub418\uc5b4\uc788\ub294 \ubbf8\ub4dc\ub098\uc787 \uc81c\ud488\uc744 \ub9ce\uc774 \uc0ac\uac00\uc2ed\ub2c8\ub2e4."},{"cat":"\uc0c1\uc124","topic":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669","fb":"\uc678\uad6d\uc778\ub4e4\uc758 \uacbd\uc6b0\ub3c4 \uac19\uc740 \uc0ac\ub78c\uc785\ub2c8\ub2e4 \uc2f8\uac8c \uc0ac\ub7ec \uc628\uc0ac\ub78c\ub4e4\uc740 \ud560\uc778\uc5d0 \ub300\ud574\uc11c \ubbfc\uac10\ud558\uace0 \uc70c\uc2a8 \uc790\uccb4\ub97c \uc88b\uc544\ud558\uace0 \uc608\uc058\uba74 \ub41c\ub2e4\ub294 \uae30\uc900\uc758 \uc0ac\ub78c\ub4e4\uc740 \uadf8\ub0e5 \uc0ac\uac00\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc2b5\ub2c8\ub2e4 \uc544\ubb34\ub798\ub3c4 \uc5ec\ud589\uc744 \uc624\ub294\uacbd\uc6b0\uace0 \uadf8\ub9ac\uace0 \ube44\uc2fc\uac70\uc5ec\ub3c4 \uc6b0\ub9ac\ub098\ub77c\uc5d0\uc11c \uadc0\ud558\uac8c \uc0b0\ub2e4\ub294 \uae30\uc900\uc73c\ub85c\uc368 \uac00\uaca9\uc774 \ub192\ub354\ub77c\ub3c4 \uc678\uad6d\uc778\ub4e4\uc740 \uc880 \uc0ac\uac00\ub294 \uacbd\ud5a5\uc774 \ub9ce\uc774 \ubcf4\uc785\ub2c8\ub2e4. \uc6b0\ub9ac \ub098\ub77c \uc0ac\ub78c\ub4e4\uc774 \uac00\uaca9\uc800\ud56d\uc774 \uad49\uc7a5\ud788 \uc325\ub2c8\ub2e4 \uadf8\ub798\ub3c4 \ub2e4\ub978 \ubcf5\ud569\ub9e4\uc7a5\ubcf4\ub2e4\ub294 \ub610 \ub35c\ud558\ub2e4\uace0 \ubcf4\uae34 \ud558\ub294 \uc0c1\ud669\uc785\ub2c8\ub2e4. \uadf8\ub9ac\uace0 \ub77c\ucf13\ub3c4 \uc2a4\ud399\uc774\ub098 \uc885\ub958\ub9cc \uc788\ub2e4\uba74 \uac70\uc758 \uc0ac\uac08 \uacbd\uc6b0\uac00 \ub9ce\uc740\ub370 \uc885\ub958\uac00 \ub9ce\uc774 \ubd80\uc871\ud558\uc5ec \ud310\ub9e4\ub85c\uc2a4\uac00 \uad49\uc7a5\ud788 \ub9ce\uc774 \ub098\ub294 \ud3b8\uc785\ub2c8\ub2e4. \uc2e0\ubc1c \uac19\uc740\uacbd\uc6b0\ub294 \ub300\ubd80\ubd84 \uc608\uc058\uba74 \uc0ac\uac04\ub2e4\uac00 \uc880 \ub354 \ub192\uc2b5\ub2c8\ub2e4. \ud560\uc778 \ud558\ub294 \uc0c1\ud488\uc758 \uc885\ub958\uac00 \ub9ce\uc9c0\ub3c4 \uc54a\uace0 \uc2e0\uc0c1\ud488\ub4e4\uc774 \ud655\uc2e4\ud788 \ube44\uad50\ud588\uc744 \ub584 \uc608\uc058\ub2e4\ub294 \uc0dd\uac01\uc744 \ub9ce\uc774 \ud558\uc2dc\ub098 \ubd05\ub2c8\ub2e4. \uad6c\ub825\uc774 \uc624\ub798 \ub418\uc2e0 \ubd84\ub4e4\uc740 \uac00\uaca9\uc5d0 \uad49\uc7a5\ud788 \ube44\uc911\uc744 \ub192\uc774\ub294\ub370 \ud14c\ub9b0\uc774 \uace0\uac1d\ub2d8 \uac19\uc740 \uacbd\uc6b0\uc5d0\ub294 \uac00\uaca9\ubcf4\ub2e8 \ub514\uc790\uc778\uc5d0 \uc880 \ub354 \ub9ce\uc740 \uce58\uc911\uc774 \ub418\uc5b4 \uc788\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ud734\uac00\uae30\uac04\uc774\ub77c\uc11c \uad49\uc7a5\ud788 \uc904\uc5b4\ub4e0 \ub290\ub08c\ub3c4 \uc788\uc9c0\ub9cc \uacbd\uae30\uac00 \uc2ec\uc0c1\uce58 \uc54a\uc740 \ubd80\ubd84\ub3c4 \ub9ce\uc774 \ub290\uaef4\uc9d1\ub2c8\ub2e4 \ud604\uc7ac \uc1fc\ud551\ubab0\uc5d0\uc11c \uc1fc\ud551\ud558\ub294 \uace0\uac1d\ub4e4\uc740 \ub300\ub2e4\uc218\uac00 \uc678\uad6d\uc778\uc774\uba70 \ub0b4\uad6d\uc778\uc740 \uac00\uaca9\uacfc \ub514\uc790\uc778\uc5d0 \ub300\ud574\uc11c \ud6e8\uc52c \uae4c\ub2e4\ub86d\uac8c \uccb4\ud06c \ud558\uace0 \uc788\ub294\uac83\ub3c4 \uc788\uc2b5\ub2c8\ub2e4. \uc774\ubc88\uc5d0\ub294 \uc804\ub840\uac00 \uc5c6\ub358 \ub86f\ub370\uc6d4\ub4dc\uc5d0\uc11c \uc6cc\ud130\ubc24\uc744 \uac1c\ucd5c \ud558\uc600\uc5b4\uc11c \uc8fc\ub9d0\uc5d0\ub294 \uc5ec\uae30\uac00 \ubd90\ube4c\uac70\ub77c\ub294\uac8c \uc5d0\uce21\uc774 \ub418\uc5c8\ub294\uc9c0 \uc1fc\ud551\ubab0\ub85c \ub4e4\uc5b4\uc624\ub294 \uc190\ub2d8\uc774 \uc815\ub9d0 \ub9ce\uc774 \uc5c6\uc5c8\uc2b5\ub2c8\ub2e4. \ub514\ud30c\uc774\uc5b4\uc5d0 \ub300\ud55c \ubb38\uc758\ub3c4 \ucc3e\uc544\uc11c \uc624\uc2dc\uae30\ubcf4\ub2e8 \uc804\ud654\ub85c \ubaa8\ub4e0\uac78 \ud574\uacb0 \uc9c0\uc5b4\uc11c \ubc29\ubb38\uc774 \ub354 \uc5c6\uc5b4\ubcf4\uc785\ub2c8\ub2e4."}],"8\uc6d42W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uc2a4\ud53c\ub4dc \ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 \ucf54\ud2b8\ub77c\uc778 7\uc778\uce58 \ub0a8\uc790       +'<span class="cchev" style="transform:rotate(180deg)">&#x25BC;</span></div>'
      +'<div class="cbody">';
    if(key==='즉시체크'){
      h+='<div style="padding:16px 18px;overflow-x:auto"><table class="clt"><tr>'
        +'<th style="width:70px">\uad6c\ubd84</th><th>\ub0b4\uc6a9</th><th style="width:155px">\ud574\ub2f9 \ub9e4\uc7a5</th><th style="width:95px">\uc0c1\ud0dc</th><th>\uc870\uce58</th></tr>';
      (sec.items||[]).forEach(function(r){
        var st=r['\uc0c1\ud0dc']||'';
        var sc=st.indexOf('\u274c')>-1?'red':st.indexOf('\u2705')>-1?'green':st.indexOf('\ud83d\udccc')>-1?'blue':'gray';
        h+='<tr><td><strong>'+esc(r['\uad6c\ubd84']||'')+'</strong></td>'
          +'<td>'+esc(r['\ub0b4\uc6a9']||'')+'</td>'
          +'<td style="font-size:11px;color:var(--muted)">'+esc(r['\ub9e4\uc7a5']||'')+'</td>'
          +'<td><span class="st '+sc+'">'+esc(st)+'</span></td>'
          +'<td style="font-size:12px">'+esc(r['\uc870\uce58']||'')+'</td></tr>';
      });
      h+='</table></div>';
    }else{
      (sec.items||[]).forEach(function(item){
        var tag=item.tag||'';
        var isW=tag.indexOf('\u26a0')>-1||tag.indexOf('\uc989\uc2dc')>-1||tag==='warn';
        var tc=isW?'warn':tag.indexOf('\ubcc0\ud654')>-1?'change':tag.indexOf('\uc81c\uc548')>-1||tag.indexOf('\uae30\ud68d')>-1?'proposal':tag.indexOf('\ubca0\uc2a4\ud2b8')>-1?'best':tag.indexOf('\ud2b8\ub80c\ub4dc')>-1||tag.indexOf('\ub3d9\ud5a5')>-1?'insight':'normal';
        var tl=esc(tag).replace('warn','&#x26A0;&#xFE0F; \uc989\uc2dc \uccb4\ud06c');
        var txt=esc(item.text||'')
          .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
          .replace(/(&#x26A0;[^<]*)/g,'<span class="wt">$1</span>');
        h+='<div class="sitem">'+(tag?'<span class="stag '+tc+'">'+tl+'</span>':'')+'<div class="stxt">'+txt+'</div></div>';
      });
    }
    h+='</div></div>';
  });
  main.innerHTML=h;
}
function toggleSec(hd){
  var sec=hd.closest('.csec');sec.classList.toggle('open');
  hd.querySelector('.cchev').style.transform=sec.classList.contains('open')?'rotate(180deg)':'';
}
function renderStoreBtns(){
  var all={};
  Object.keys(STORE_DATA_RAW).forEach(function(s){all[s]=1;});
  Object.values(weekStore).forEach(function(w){Object.keys(w.storeData||{}).forEach(function(s){all[s]=1;});});
  document.getElementById('slist').innerHTML=Object.keys(all).sort().map(function(s){
    return '<button class="sbtn" onclick="showStore(\''+s+'\')">'+esc(s)+'</button>';
  }).join('');
}
function filterS(q){document.querySelectorAll('.sbtn').forEach(function(b){b.style.display=b.textContent.indexOf(q)>-1?'':'none';});}
function showStore(name){
  document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.sbtn').forEach(function(b){if(b.textContent===name)b.classList.add('on');});
  var r=document.getElementById('sres');r.className='sres on';
  var ch=STORE_CH[name]||'';
  var h='<div class="sres-name">&#x1F3EA; '+esc(name)+'<span class="sres-ch">'+esc(ch)+'</span></div>';
  var wks=WEEK_ORDER.filter(function(w){return weekStore[w]&&weekStore[w].storeData[name];});
  if(!wks.length){h+='<div class="no-s">\uc774 \ub9e4\uc7a5\uc758 \ud53c\ub4dc\ubc31\uc774 \uc5c6\uc2b5\ub2c8\ub2e4</div>';}
  else{
    wks.forEach(function(w){
      var fbs=(weekStore[w].storeData[name]||[]).filter(function(f){return f.topic.indexOf('\u203b')===-1;});
      if(!fbs.length)return;
      h+='<div class="swblock"><span class="swlabel">'+w+'</span>';
      fbs.forEach(function(f){h+='<div class="sfitem"><div class="sfcat">'+esc(f.cat)+'</div>'+esc(f.fb)+'</div>';});
      h+='</div>';
    });
  }
  r.innerHTML=h;
}
var bdCurWeek=null;
var ESC_STORE_LABEL='\uD83C\uDFEA \uB9E4\uC7A5\uBCC4';
var ESC_CAT_LABEL='\uD83D\uDCC1 \uCE74\uD14C\uACE0\uB9AC\uBCC4';
var ESC_NODATA='\uC6D0\uBCF8 \uB370\uC774\uD130\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4';
var ESC_RAWDATA_LABEL='\uC6D0\uBCF8 \uD53C\uB4DC\uBC31 \uBC31\uB370\uC774\uD130';
var ESC_NOCAT_SUFFIX=' \uCE74\uD14C\uACE0\uB9AC\uC758 \uD53C\uB4DC\uBC31\uC774 \uC5C6\uC2B5\uB2C8\uB2E4';
var ESC_STORE_COUNT_SUFFIX='\uAC1C \uB9E4\uC7A5 \uD53C\uB4DC\uBC31';
var bdViewMode='store';
var bdCurCat=null;
var BD_CATS=['\uC758\uB958','\uC6A9\uD488','\uC2E0\uBC1C','\uB77C\uCF13','\ud300\uc2a4\ud3ec\uce20'];
function bdSetView(mode){bdViewMode=mode;if(mode==='category'&&!bdCurCat)bdCurCat=BD_CATS[0];renderBD();}
function bdSetCat(cat){bdCurCat=cat;renderBD();}

function openBD(){
  bdCurWeek = WEEK_ORDER.filter(function(w){return weekStore[w];}).slice(-1)[0];
  renderBD();
  document.getElementById('bdMbg').classList.remove('hidden');
}
function renderBD(){
  var body=document.getElementById('bdBody');
  var weeks=WEEK_ORDER.filter(function(w){return weekStore[w];});
  var tabsHtml='<div class="bd-tabs">'+weeks.map(function(w){
    return '<button class="bd-tab '+(w===bdCurWeek?'on':'')+'" onclick="bdSwitchWeek(\''+w+'\')">'+w+'</button>';
  }).join('')+'</div>';

  var toggleHtml='<div class="bd-toggle">'
    +'<button class="bd-toggle-btn '+(bdViewMode==='store'?'on':'')+'" onclick="bdSetView(\'store\')">'+ESC_STORE_LABEL+'</button>'
    +'<button class="bd-toggle-btn '+(bdViewMode==='category'?'on':'')+'" onclick="bdSetView(\'category\')">'+ESC_CAT_LABEL+'</button>'
    +'</div>';

  if(bdViewMode==='category'){
    toggleHtml+='<div class="bd-cat-tabs">'+BD_CATS.map(function(c){
      return '<button class="bd-cat-tab '+(c===bdCurCat?'on':'')+'" onclick="bdSetCat(\''+c+'\')">'+c+'</button>';
    }).join('')+'</div>';
  }

  var wd=weekStore[bdCurWeek];
  var contentHtml='';
  if(!wd || !wd.storeData){
    contentHtml='<div class="no-s">'+ESC_NODATA+'</div>';
  } else {
    contentHtml+='<div class="bd-week-hd2"><span class="bd-week-pill">'+bdCurWeek+'</span>'+(wd.date?'<span class="bd-week-dt">'+esc(wd.date)+'</span>':'')+'<span style="font-size:11px;color:var(--muted);margin-left:auto">'+ESC_RAWDATA_LABEL+'</span></div>';

    if(bdViewMode==='store'){
      var storeNames=Object.keys(wd.storeData).sort();
      if(!storeNames.length){
        contentHtml+='<div class="no-s">'+ESC_NODATA+'</div>';
      } else {
        storeNames.forEach(function(store){
          var fbs=(wd.storeData[store]||[]).filter(function(f){return f.topic.indexOf('\u203b')===-1;});
          if(!fbs.length) return;
          contentHtml+='<div class="bd-store-block">';
          contentHtml+='<div class="bd-store-name">\uD83C\uDFEA '+esc(store)+'</div>';
          fbs.forEach(function(f){
            contentHtml+='<div class="bd-fb-item"><div class="bd-fb-cat">['+esc(f.cat)+'] '+esc(f.topic)+'</div><div class="bd-fb-text">'+esc(f.fb)+'</div></div>';
          });
          contentHtml+='</div>';
        });
      }
    } else {
      var catEntries=[];
      Object.keys(wd.storeData).sort().forEach(function(store){
        (wd.storeData[store]||[]).forEach(function(f){
          if(f.cat===bdCurCat) catEntries.push({store:store, f:f});
        });
      });
      if(!catEntries.length){
        contentHtml+='<div class="no-s">'+esc(bdCurCat)+ESC_NOCAT_SUFFIX+'</div>';
      } else {
        contentHtml+='<div class="bd-store-block">';
        contentHtml+='<div class="bd-store-name">\uD83D\uDCC1 '+esc(bdCurCat)+' &mdash; '+catEntries.length+ESC_STORE_COUNT_SUFFIX+'</div>';
        catEntries.forEach(function(e){
          contentHtml+='<div class="bd-fb-item"><div class="bd-fb-cat">\uD83C\uDFEA '+esc(e.store)+' &mdash; '+esc(e.f.topic)+'</div><div class="bd-fb-text">'+esc(e.f.fb)+'</div></div>';
        });
        contentHtml+='</div>';
      }
    }
  }
  body.innerHTML=tabsHtml+toggleHtml+'<div class="bd-content">'+contentHtml+'</div>';
}
function bdSwitchWeek(w){bdCurWeek=w;renderBD();}
function closeBD(e){
  if(!e||e.target===document.getElementById('bdMbg')){
    document.getElementById('bdMbg').classList.add('hidden');
  }
}
function openMod(){document.getElementById('mbg').classList.remove('hidden');document.getElementById('msrch').focus();}
function closeMod(e){
  if(!e||e.target===document.getElementById('mbg')){
    document.getElementById('mbg').classList.add('hidden');
    document.getElementById('sres').className='sres';
    document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on');});
  }
}
function handleUpload(input){
  var file=input.files[0];if(!file)return;
  document.getElementById('loverlay').classList.remove('hidden');
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var sn=wb.SheetNames[wb.SheetNames.length-1];
      var ws=wb.Sheets[sn];
      var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var hr=raw[2]||[];
      var stores={};
      for(var i=3;i<hr.length;i++){if(hr[i]&&String(hr[i]).trim())stores[i]=String(hr[i]).trim();}
      var sd={};var rows=[];
      for(var ri=3;ri<raw.length;ri++){
        var row=raw[ri];
        var topic=String(row[1]||'').trim();
        var cat=String(row[2]||'').trim();
        if(!topic&&!cat)continue;
        var fbs={};
        Object.keys(stores).forEach(function(ci){
          var v=String(row[parseInt(ci)]||'').trim().replace(/[\r\n]+/g,' ');
          if(v&&['x','X','-','\\'].indexOf(v)===-1){
            fbs[stores[ci]]=v;
            if(!sd[stores[ci]])sd[stores[ci]]=[];
            sd[stores[ci]].push({cat:cat,topic:topic.slice(0,80),fb:v});
          }
        });
        if(Object.keys(fbs).length)rows.push({topic:topic,cat:cat,feedbacks:fbs});
      }
      var txt='\uc8fc\ucc28: '+sn+'\n\n';
      rows.forEach(function(r){
        if(r.cat==='\uacf5\ud1b5'&&r.topic.indexOf('\u203b')>-1)return;
        txt+='['+r.cat+'] '+r.topic.slice(0,60)+'\n';
        Object.keys(r.feedbacks).forEach(function(st){txt+='  '+st+': '+r.feedbacks[st].slice(0,200)+'\n';});
        txt+='\n';
      });
      callAI(txt,function(summary){
        weekStore[sn]={date:summary.date||'',summary:summary,storeData:sd};
        Object.keys(sd).forEach(function(st){if(!STORE_DATA_RAW[st])STORE_DATA_RAW[st]={};STORE_DATA_RAW[st][sn]=sd[st];});
        cur=sn;renderAll();
        document.getElementById('loverlay').classList.add('hidden');
      });
    }catch(err){alert('\uc624\ub958: '+err.message);document.getElementById('loverlay').classList.add('hidden');}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
function callAI(text,cb){
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,system:_SYS,messages:[{role:'user',content:text}]})
  }).then(function(r){return r.json();}).then(function(d){
    var raw=(d.content||[]).map(function(c){return c.text||'';}).join('');
    var clean=raw.replace(/\u0060\u0060\u0060json/g,'').replace(/\u0060\u0060\u0060/g,'').trim();
    cb(JSON.parse(clean));
  }).catch(function(e){alert('AI \uc624\ub958: '+e.message);document.getElementById('loverlay').classList.add('hidden');});
}
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){
  e.preventDefault();
  var f=e.dataTransfer&&e.dataTransfer.files[0];
  if(f&&(f.name.endsWith('.xlsx')||f.name.endsWith('.xls')))handleUpload({files:[f],value:''});
});
renderAll();
</script>
