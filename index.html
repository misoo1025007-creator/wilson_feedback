장 '아직 큰 반응 없음'."},{"tag":"⚠️즉시체크","text":"⚠️ 신세계강남 리스폰스프로 판매율 지속 하락 → 판매 전략 검토"}]},"라켓":{"title":"라켓 특이사항 (디파이어 출시일 앞당겨짐)","items":[{"tag":"디파이어","text":"100L·100UL 출시일 앞당겨짐 — 현대스페이스원·롯데기흥·스타필드고양 예약 연락처 등록 多. 신세계대전 '100L·100UL 입고일·예약 문의 매우 많음'. US오픈 에디션 신세계강남 폭발적 반응."},{"tag":"⚠️즉시체크","text":"⚠️ 디파이어 출시 일정 및 스펙 공유 필요 — 여성 스펙 출시 일정 즉시 공유"},{"tag":"이슈","text":"블레이드 V10 꾸준 판매. 사이먼여주 여성 290g 이하 재고 전무 판매 불가 → 입고 시급."}]},"팀스포츠":{"title":"팀스포츠 특이사항","items":[{"tag":"트렌드","text":"에볼루션·퓨어샷 안정적 판매. 신세계강남 '여성 농구 동호인·학생 농구붐, 에볼루션만 고집'. 스타필드수원 '농구공 판매 굉장히 좋음'. 아이파크 '인스타 릴스 통한 DM 문의 증가'."}]},"상설":{"title":"상설 판매 현황","items":[{"tag":"트렌드","text":"커넥트청주 '가격 저항 없음, 할인 명분만 있으면 구매'. 현대스페이스원 '사이즈 부족으로 정상 상품 유도'. 롯데의왕 '의류 구매 후 사이즈 없으면 정상 연계 구매'."},{"tag":"⚠️즉시체크","text":"⚠️ 현대스페이스원·롯데기흥·롯데의왕 상설 사이즈 공백 지속 → 추가 배분 검토"}]},"고객동향":{"title":"고객 입점 동향","items":[{"tag":"동향","text":"📉 폭염+휴가철+소비심리 위축 복합 감소. 신세계대전 '전년 대비 30~40% 감소'. 스타필드코엑스 '지갑 안 열리는 상황'. 📈 더현대서울 '전년 동기 대비 목적구매 증가, 아이돌 콘서트 효과'. 롯데부산 '포켓몬팝업·런던베이글 팝업으로 일반 고객 유입'. 롯데인천 '크루즈 셔틀버스 8월 시범운행으로 외국인 급증'."}]},"경쟁사":{"title":"경쟁사 동향","items":[{"tag":"경쟁사","text":"갤러리아센터시티 '타 브랜드 행사로 할인 문의 증가'. 롯데기흥 '상설 할인율 40~70%로 높아지며 고객 추가 할인 기다리며 구매 미룸'. 신세계대전 '이슈 아이템 부재로 구매 동기 제공 어려움'."}]},"즉시체크":{"title":"⚠️ 즉시 체크 리스트","items":[{"구분":"의류","내용":"남성 M·L 사이즈 공백 지속","매장":"사이먼부산·사이먼여주","상태":"❌ 미해결","조치":"재고 보충 필요"},{"구분":"의류","내용":"여성 스커트 기장 짧음 피드백 반복","매장":"다수 매장","상태":"📌 안내필요","조치":"차기 기장 다양화 기획 반영"},{"구분":"용품","내용":"남성 투어백 문의 증가","매장":"갤러리아센터시티","상태":"❌ 미해결","조치":"재고 확인"},{"구분":"신발","내용":"리스폰스프로 판매율 지속 하락","매장":"신세계강남","상태":"🔄 모니터링","조치":"판매 전략 검토"},{"구분":"라켓","내용":"디파이어 여성 스펙 출시 일정 즉시 공유 필요","매장":"다수 매장","상태":"📌 안내필요","조치":"여성 100L·100UL 출시 일정 공유"},{"구분":"라켓","내용":"사이먼여주 여성 라켓 재고 전무","매장":"사이먼여주","상태":"❌ 미해결","조치":"입고 시급"},{"구분":"상설","내용":"상설 인기 사이즈 공백 지속","매장":"현대스페이스원·롯데기흥·롯데의왕","상태":"❌ 미해결","조치":"추가 배분 검토"}]}},"8월2W":{"date":"08/10~08/16","전체요약":"퓨어드라이 사이드셔링 반팔 전 매장 공통 1위, 플리에 토트백 신규 입고 여성 반응 폭발적. 디파이어 여성 스펙(100L·100UL) 런칭 — 매장별 편차 있으나 사전예약 고객 중심 판매 호조. 플레이스테이트 자켓 초반 터치율 상승, 가을 전환 기대감 시작. 상설 추가 할인 효과로 연계판매·객단가 상승. 연휴·폭우·휴가 막바지 복합으로 입점 혼재, 테니스 고객 수요 둔화 지속.","판매베스트":{"title":"금주 판매 베스트","items":[{"tag":"베스트","text":"**퓨어드라이 사이드셔링 반팔** 전 매장 공통 1위. 신세계대전 '전연령대 무난하게 입을 수 있어 반응 유독 좋음, WHT 컬러 가장 인기'. 스타필드하남 '기장 길고 셔링 포인트로 옆 라인 조절 가능 — 만족도 최고'. 신세계강남 '셔링 포인트 FW 상품 중 판매 단연 1위'."},{"tag":"베스트","text":"**플리에 토트백 W** 신규 입고 폭발적 반응. 신세계강남 '올어라운드 짐백 판매 떨어질 정도로 플리에 토트백 독주, 외국인·내국인 모두 폭발적'. 스타필드고양 '보냉기능·수납공간·여성스러운 디자인 삼박자'. 신세계대전 '필라테스·요가·발레 고객까지 어필 성공'."},{"tag":"특이","text":"신세계강남 '디파이어 여성 스펙 + 투어가 미끼상품 역할 → 의류·신발 연계 판매 월등히 상승'. 롯데잠실 '플리에 토트백 핑크·아이보리 커플 구매 반응 좋음, FW 신상품 전반 판매 좋음'. 스타필드하남 '연휴 글러브·농구공 선물용 구매 증가, 가족단위 구매 활성화'."}]},"전주대비":{"title":"전주 대비 변화","items":[{"tag":"변화","text":"📈 **플리에 토트백 신규 입고** — 여성 고객 반응 폭발적. 올어라운드 짐백 수요를 넘어서는 매장도 등장. 📈 **디파이어 여성 스펙(100L·100UL) 런칭** — 사전예약 고객 방문 활성화. 📈 **플레이스테이트 자켓 초반 터치 상승** — 일교차 시작으로 가을 전환 기대감. 📈 **상설 추가 할인** — 연계판매·객단가 상승 효과. 📉 **연휴·폭우·휴가 막바지** 복합으로 테니스 목적 입점 감소. 신세계대전 '주말 폭우로 입점 현저히 감소'."}]},"의류":{"title":"의류 특이사항 (FW 신상·플레이스테이트 자켓 반응)","items":[{"tag":"플레이스테이트 자켓","text":"**현대판교 '초반 반응 너무 좋음 — 여성 스테이트 자켓 판매 강세'**. 신세계대전 '플레이스테이트 자켓 터치·반응 좋음, 여성 퍼플 아이캐칭 多'. 롯데부산 '주말 바람막이 판매 이루어짐'. 반면 스타필드고양 '아직 터치 전혀 없음, 테니스 고객은 10월까지 반팔', 커넥트청주 '스탠다드 제품이라 기온 내려가야 구매 발생'."},{"tag":"FW 전환 기대감","text":"긴바지·바람막이·피스테 문의 전반적 상승 — 아이파크 '공홈 아노락 문의 증가, 입고 시기 문의'. 스타필드수원 '얇은 풀집업·바람막이, 여유 일자형 긴바지 문의 많음'. 스타필드하남 '플레이스테이트 크루 하프집업 터치 많으나 풀집업 요청'. 롯데의왕 '얇은 바람막이로 터치 넘어옴'."},{"tag":"⚠️즉시체크","text":"⚠️ **남성 셋업 아이템 부족** (아이파크) — '남성 셋업 종류 너무 적다는 피드백' → 차기 기획 반영 필요"},{"tag":"⚠️즉시체크","text":"⚠️ **SS 아이템 사이즈 공백으로 신상 유도 전환** (롯데잠실·아이파크) — '인기 상품 사이즈 깨져 신상으로 안내, 신상 재고 적극 활용 중' → 신상 재고 현황 확인"},{"tag":"이슈","text":"퓨어드라이 사이드셔링 일상복 겸용 구매 급증 — 신세계대전 '타 스포츠 고객 구매도 많음'. 스타필드코엑스 '수입제품 피팅 후 사이즈 이슈로 국내 제품으로 스위치'. 신세계강남 '라코스테식 피케티셔츠·와펜 로고 아이템 제안'."},{"tag":"제안","text":"신세계광주 '초가을 얇은 긴바지 문의 급증, 타 브랜드 가을 구성 증가 중'. 롯데동부산 '여성용 XS·S 사이즈 긴바지 기획 필요'. 사이먼여주 '루즈핏 팬츠 선호도 높음 — 조거 외 와이드·루즈핏 기획 필요'."}]},"용품":{"title":"용품 특이사항 (플리에 토트백·니삭스 반응)","items":[{"tag":"플리에 토트백","text":"**전 매장 공통 폭발적 반응** — 성공 요인: ① 여성스러운 컬러(핑크·크림·라벤더) ② 보냉기능 수납 공간 ③ 공 키링 포인트 ④ 비테니스 고객까지 어필. 신세계강남 '올어라운드 짐백 독주 끝내고 플리에 토트백이 주인공'. 롯데잠실 '발레 동호인 집단 구매 발생'. 구매 전환은 아직 지켜봐야 하는 매장도 있으나 전반 긍정."},{"tag":"플리에 토트백","text":"한계: 롯데부산 '크기 부담스럽다는 의견 多'. 신세계의정부 '짐백 라인(라켓 수납) 선호로 전환'. 롯데동부산 '아직 가을 분위기 아니라 크림·핑크 컬러 어필 제한적, 가을에 더 반응 기대'. 아이파크 '라벤더 추가 리오더 요청'."},{"tag":"니삭스","text":"신상 니삭스 반응 긍정적이나 리본 니삭스 메쉬 내구성 클레임 — 롯데잠실 '메쉬 부분 너무 빨리 떨어진다는 의견'. 사이먼파주 '날씨 선선해지며 모자·니삭스 터치·판매 동반 상승'. 현대중동 '두꺼운 니삭스 선호'."},{"tag":"⚠️즉시체크","text":"⚠️ **리본 니삭스 메쉬 내구성 클레임** (롯데잠실) — '너무 빨리 떨어진다' → 품질 확인 필요"},{"tag":"이슈","text":"롯데인천 '플레이 토트백 입고 즉시 폭발적 반응, 기존 스퀘어 짐백과 다른 여성 니즈 충족'. 스타필드코엑스 '캡 모자 기능성 위주 판매, 바이저 거의 판매 없음'. 나인원한남 '엘리트 모션 바이저 이번 주 판매 1위'."}]},"신발":{"title":"신발 특이사항 (수입화 신상·볼트프로 동향)","items":[{"tag":"수입화 신상","text":"**러쉬투어5·인트리그 투어 화이트+레드 컬러 아이캐칭 긍정적** — 신세계강남 '신발 터치율 8월 중 최고, 신상 출시로 판매 월등히 상승'. 스타필드하남 '러쉬투어·인트리그 터치 가장 많음'. 커넥트청주 '남녀 커플로 신기 좋은 흰+빨 조합'. 단, 다수 매장 '착화 후 볼트프로·에어리로 전환'."},{"tag":"볼트프로","text":"**볼트프로 여전히 판매 강세** — 아이파크 '볼트프로 W 컬러 어울릴 의류 애매해 인트리그·에어리로 전환'. 스타필드고양 '볼트프로·터프 모두 반응 크지 않음 — 디자인 피로감'. 현대판교 '리스폰스 판매 다소 저조'. 롯데부산 '볼트프로 꾸준한 판매, 터프는 컬러 어두워 선호 낮음'."},{"tag":"⚠️즉시체크","text":"⚠️ **현대무역 입고 스타일 자체 적어 신발 다양성 부족** — '리스폰스 빼고 판매 나쁘지 않으나 구성 부족' → 입고 확인"},{"tag":"이슈","text":"스타필드코엑스 '내수 테린이 고객 세트 구매로 신발 단가 높았음'. 신세계센텀 '리스폰스 터프 클레이·인조잔디 고객 니즈 정확히 충족'. 롯데동부산 'CTC 흰+레드+메탈실버 컬러 남녀 모두 터치 유발'."}]},"라켓":{"title":"라켓 특이사항 (디파이어 여성 스펙 100L·100UL 런칭)","items":[{"tag":"디파이어 여성스펙","text":"**전반 긍정적이나 남성 스펙 대비 확실히 느린 반응** — 성공 매장: 스타필드하남 '하남스타즈 선수 사전예약 + 입점 고객 어필 성공, 여성 스펙이 남성보다 판매 많았음'. 신세계대전 '100UL 1그립 가장 많이 판매, 사전예약:워크인 5:5'. 현대스페이스원 '런칭 첫날 판매 높았으나 관심 있는 분 위주'."},{"tag":"디파이어 여성스펙","text":"느린 매장 원인: ① 남성 바이럴 위주 정보 확산 → 여성 인지도 낮음 ② 여성 고객 신중한 구매 성향 ③ 컬러 쨍함 부담 (더현대서울 '컬러 너무 쨍해서 다른 라켓 선택'). 아이파크 '홀세일·동대문 대비 가격 비싸다는 피드백 多'. 롯데잠실 '가벼운 무게가 홀세일과 같은 날 출시돼 홀세일로 쏠림'."},{"tag":"⚠️즉시체크","text":"⚠️ **아이파크 즉시 스트링 불가 → 아랫층 테니스 매트로 이탈 지속** — 근본 해결 필요"},{"tag":"이슈","text":"US오픈 에디션 꾸준한 판매 — 나인원한남 '여성 클래시·울트라 US오픈 인기'. 블레이드 V10 꾸준 강세 — 현대판교 '이번 주 블레이드 판매 월등히 좋음'. 상설 라켓 — 사이먼부산 '상설 라켓 입고 문의 多, 여성 문의 증가'."}]},"팀스포츠":{"title":"팀스포츠 특이사항","items":[{"tag":"트렌드","text":"에볼루션 수요 강세 유지 — 신세계강남 '학생들 에볼루션만 고집, FW에 에볼루션 재고 더 많이 필요'. 아이파크 '인스타 릴스 통한 DM 문의 증가, 가족·학생 구매 꾸준'. 스타필드수원 '에볼루션·커리·퓨어샷 순 문의'."},{"tag":"이슈","text":"연휴 효과 — 스타필드하남·롯데기흥 '공휴일 가족단위 글러브·농구공 선물용 구매 증가'. 더현대서울 '에볼루션·사인볼 판매율 높음'. 커넥트청주 '야구글러브 문의 증가, 낮아진 트래픽에 비해 글러브 찾는 고객 多'. 사이먼파주 '레트로 아웃도어 농구공 이번 주 판매 주도'."}]},"상설":{"title":"상설 판매 현황 (추가 할인 효과)","items":[{"tag":"추가할인효과","text":"**추가 10% 할인 효과 전 매장 공통 긍정적** — 커넥트청주 '베이직 NJK71 60% 할인 후 호불호 없이 터치 증가'. 롯데기흥 '연휴 할인 겹쳐 양말·모자·가방 연계 구매 활성화, 선물용 추가 구매까지'. 사이먼파주 '머무는 시간 증가 → 모자·양말 판매 상승'. 사이먼여주 '추가 금액 할인이 고객 반응 가장 좋음, 객단가 상승'."},{"tag":"⚠️즉시체크","text":"⚠️ **현대스페이스원 추가 할인 덕 연계판매 수월** → 캠프·컨버젼 높이기 성공 사례 공유 필요"},{"tag":"이슈","text":"롯데동부산 '현재 25FW 상품 없어 티셔츠 단가 낮아 20만원 채우기 지쳐 포기하는 고객 多, 자켓류 부족'. 현대대전 '추가 할인 진행 중이나 행사장으로 입점 감소'. 롯데의왕 '추가 할인에 FW 상설 상품도 원활 판매'."}]},"고객동향":{"title":"고객 입점 동향","items":[{"tag":"동향","text":"📊 **혼재** — 연휴·폭우로 주말 감소 / 더현대서울·신세계강남 팝업 효과로 상승. 더현대서울 '라이엇게임즈·K리그 팝업으로 외국인·내국인 모두 급증, 사이즈 깨진 상품 입고로 판매 활성화'. 신세계강남 '날씨 좋아지며 테니스복 구매 목적 방문 급증, 샤넬·티파니 팝업 외국인 유입'."},{"tag":"동향","text":"📉 감소 매장: 신세계대전 '전년 동기 대비 30~40% 감소, 주말 폭우'. 스타필드고양 '전년 헬로키티 콜라보 이슈 대비 올해 임팩트 부족'. 롯데잠실 '연휴로 전체 매출 감소, 공동 사은 미진행'. 현대무역 '외국인(중국·인도네시아) 유입 급증 — 한국말 못하는 날도'."},{"tag":"동향","text":"나인원한남 '전주 대비 입점·구매 모두 증가'. 현대판교 '여행·운동 목적 구매 고객 多'. 롯데기흥 '주말 전주 대비 +20% 증가'. 사이먼파주 '내국인 입객 증가, 외국인 구매율 상승'."}]},"경쟁사":{"title":"경쟁사 동향","items":[{"tag":"경쟁사","text":"신세계광주 '타 브랜드 가을 상품으로 매장 구성 전환 가속'. 커넥트청주 '무신사스탠다드·HDEX 등 20대 선호 브랜드 제외 전반 입점 부진'. 스타필드고양 '타 브랜드 대비 가을 옷 구성 빠른 매장이 입점 유리'. 롯데기흥 '상설 할인율 40~70%로 높아지며 기존 고객 추가 할인 기다리며 구매 미룸'."}]},"즉시체크":{"title":"⚠️ 즉시 체크 리스트","items":[{"구분":"의류","내용":"남성 셋업 아이템 종류 부족","매장":"아이파크","상태":"📌 안내필요","조치":"차기 기획 반영"},{"구분":"의류","내용":"SS 사이즈 공백 — 신상 재고로 유도 전환 중","매장":"롯데잠실·아이파크","상태":"🔄 모니터링","조치":"신상 재고 현황 확인"},{"구분":"용품","내용":"리본 니삭스 메쉬 내구성 클레임","매장":" 는 있었으나 남성 고객은 여전히 100·98PRO 등 높은 스펙을 먼저 찾는 경우가 많았습니다. 여성 고객은 무게뿐 아니라 디자인·가격·기존 라켓과의 차이를 충분히 비교해 구매 결정이 다소 느렸습니다. 한정판과 낮은 무게의 클래시·울트라 문의도 꾸준해 선택 가능한 재고 구성이 중요했습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"가족 및 학생 고객 중심으로 농구공 수요가 꾸준했으며 에볼루션·커리·퓨어샷 순으로 문의가 많았습니다. 볼타워에서 터치 후 새상품 재고를 확인하는 고객이 많아 주요 모델의 판매용 재고 확보가 필요합니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 대비 스타필드 유동인구는 휴가 막바지와 공휴일 영향으로 시간대별 편차가 컸습니다. 가족·젊은 커플의 자연유입은 있었지만 더위를 피하거나 구경하는 방문이 많아 입점 대비 구매 전환은 낮았습니다. 테니스 목적 고객은 기온이 내려가는 시간대에 조금씩 늘었고, 일반 고객은 일상 겸용 의류와 농구공·가방에서 반응이 있었습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주에도 퓨어드라이와 스피드드라이 위주로 관심과 판매가 이어졌습니다. 입점 고객의 남녀 비중은 비슷했으나 실제 구매로 이어지는 비중은 남성 고객이 더 높은 편이었습니다. 의류 외에는 드로우스트링 백팩이 컬러별로 고른 인기를 보였으며, 커플 단위의 구매 반응도 좋았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"습한 날씨의 영향으로 통기성과 빠른 건조 기능을 갖춘 반팔 제품의 수요가 지속되었습니다. 남성 고객은 기본 기능성 상의를 중심으로 구매했으며, 여성 고객은 컬러감과 셋업 구성, 일상 활용도를 함께 살펴보는 경향이 있었습니다. 신상품에 대한 관심과 터치감은 있었으나, 실제 구매는 기존 인기 컬러와 기본 디자인에 조금 더 집중되는 모습이었습니다. 긴팔 찾으시는 몇몇 고객님들께서는 퓨어드라이 디럭스 긴팔티를 터치 많이 하셨습니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"금주에는 가방류의 구매 비중이 전반적으로 높았습니다. 신상 모자 중에서는 캠프캡과 바이저의 판매 반응이 상대적으로 좋았으며, 코튼 볼캡은 운동용보다 일상 착용 목적으로 구매하는 고객이 있었습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상 컬러는 터치감과 색상에 대한 반응이 좋았으나, 실제 판매와 선호는 아직 기존 컬러가 더 높은 편입니다. 새로운 컬러에 대한 관심은 있었지만 구매 단계에서는 익숙하고 코디하기 쉬운 기존 컬러를 선택하는 고객이 많았습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어와 블레이드 문의는 꾸준했으며, 남성 고객은 300g 전후의 스펙을 먼저 비교하는 경우가 많았습니다. 여성 고객은 가벼운 스펙과 한정판 디자인을 함께 살펴보는 경향이 있었고, 원하는 무게와 그립 사이즈의 재고 유무가 구매 결정에 큰 영향을 주었습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공은 가족 및 학생 고객을 중심으로 꾸준한 터치가 있었습니다. 특정 모델에 집중되기보다는 사용 목적과 가격대를 비교하는 고객이 많았으며, 주요 모델의 판매용 재고 유무가 실제 구매 전환에 영향을 주는 편이었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"금주 입점 고객은 내국인 비중이 높았으며 외국인 방문은 4~5월 대비 감소한 흐름이 이어졌습니다. 가족과 커플 고객의 자연 유입이 있었고, 6~8월에는 기존 고객의 재방문과 신규 고객 방문이 줄어진거 같습니다. 입점 고객의 남녀 비중은 유사했으나 실제 구매는 남성 고객이 조금 더 높은 편이었습니다."}]},"신세계사우스시티":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이의 판매율은 꾸준히 높은편이고, 날씨가 너무 덥다보니 남여 공통으로 스피드드라이 반팔의 선호도와 만족도가 높았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"남성 스피드드라이 터레인 티셔츠의 시원한 원단과 과하지않은 컬러감 등으로 반응이 좋으며, 같이 매치할 수 있는 코트라인 7인치 쇼츠의 판매도 좋았습니다. 더운여름이라 퓨어드라이소재나 다른 상의를 구매하시면서 셋업 연출가능한 쇼츠를 많이 보시는 터라 권해드리기에 너무 좋은 것 같습니다. 그리고 여성 더블메쉬옴브레와 같이 매치 가능한 스피드드라이W  반응 또한 너무 좋았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"기능성위주의 모자를 많이 찾으셨고, 에어모션 캠프캡이나 바이저위주의 구매가 많았습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트프로 1.5의 경우엔 화이트/블루, 라이트퍼플의 반응이 좋은 편이고, 리스폰스 프로1.5터프 오렌지의 경우에는 롤랑클래시 V3 의 소지 여성고객들의 구매가 많았습니다. 라켓컬러와  조화롭게 매치가 가능해서 반응이 좋습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"블레이드와 클래시의 반응이 좋았습니다. 그리고 꾸준히 디파이어 남성/여성 스펙 문의가 많은 편입니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공을 구경오시는 고객님들의 방문은 꾸준한 편이고, 퓨어샷과 6호볼의 판매가 좋았습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"구매가 또렷한 고객님들의 방문이 있는 편이며, 폭염/휴가철로 인해 많이 분산된 것 같습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"얇고 가벼운 스피드드라이 라인이 남/여 공통으로 반응이 좋은편이고, 남성반바지 코트라인 7인치 쇼츠의 판매가 좋은편입니다. 다양한 컬러감과 퓨어드라이소재와 같이 셋업해서 입으시기 좋다며 만족도가 높습니다. 그리고 사이드셔링W의 경우 여성쇼츠와 매치 했을때 넉넉한 핏과 옆라인 핏조절이 가능하다보니, 소재+디자인 너무 만족해 하셨습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"운동고객님들의 방문이 많다보니 반팔,반바지기능성위주의 상품을 보러오시는 편이고, 현재까지는 신상 자켓의 터치감 정도 있었습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백은 들어보시고 예쁘다는 평이 많긴하지만, 올어라운드 짐백L랑 비교해보시고, 여성라인보다는 스포티한 짐백라인으로 구매를 하시는 편입니다. 그리고 신상모자의 경우 상품이 다양해서 판매가 고루 잘되고 있고, 오버니삭스의 입고로 기본 용품들과 함께 판매가 좋은 편입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"다양하게 판매가 되고있지만, 현재까지는 가벼운 볼트프로의 선호도가 큰 편입니다. 수입화의 신상컬러는 여성분들의 반응이 좀 있었습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 100UL 예약분들의 방문이 있었고, 무게 낮춰서 보시는 남성분들의 100L구매까지 다양했습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"저가형 글러브와 농구공의 판매가 꾸준하고, 선물용으로 올 팀 레트로 볼의 반응이 좋았습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가철로 분산되었던 입점객이 조금 늘은 편이고, 라켓고객님들 위주의 방문이 많았던 한 주 였습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"기능성위주로 상의 제품을 많이 보셨고, 퓨어드라이라인 재구매와 신규고객님들의 일상용 구매가 많았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"기존고객님들의 신상품 구경목적으로 방문이 있었고, 신상 + 기존 입으시던 소재의 다른 컬러나 가방 등의 구매가 있었습니다. 평일대비 주말저녁엔 선선해지다보니 얇은 바람막이나 긴팔 얇은제품들도 같이 찾아보시는 편입니다. 그렇기에 전 주 대비 자켓상품들의 판매가 올라오고 있습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"퍼포먼스라인보다는 여성라인을 추구하시는 고객님들께 플리에,드로우스트링 토트백의 반응이 좋습니다. 드로우스트링토트의 경우엔 많이 크지도 않고 적당한 크기에 라켓수납도 가능하다보니 심플한 라켓가방을 보시는 고객님들께는 만족도가 있는 편이고 , 플리에 토트는 테니스 + 일상,여행겸용 으로도 사용가능할만큼 넉넉한 수납이 반응이 좋은 것 같습니다. 그렇기에 현재 백팩 + 보여드릴수있는 라인들이 많아서 판매에 많은 도움이 되고 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬투어는 아직 기존컬러의 선호도가 큰 편이고, 인트리그 투어 레드는 판매가 꾸준한 편입니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어,블레이드,클래시의 판매가 좋았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"퓨어샷 ,에볼루션 의 꾸준한 판매가 있으며, 6호볼 문의도 종종 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"고정고객들의 방문이 많은 편이고, 외국인 비중은 아주 적습니다. 8월은 휴가 + 장마 의 영향도 매우 컸던지라, 점내 고객이 많이 분산되었던 것 같습니다."}]},"신세계대전":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"여성- 1. 퓨어드라이 사이드셔링 :터치율, 판매율이 가장 좋았음. 기존 버전대비 좀 더 여유있는 핏감과 옆라인을 조절할 수 있어 다양한 연령대의 고객들에게 어필하기 좋았음. 테니스가 아닌 데일리로 입기에도 좋다는 반응이 많았으며 전반적으로 화이트의 아이캐칭 및 터치, 판매율이 가장 좋았음 나머지 컬러 또한 고객들의 만족도가 높음 2. 더블메쉬스커트 옴브레 : 두가지 컬러 모두 터치율이 굉장히 높음 판매의 경우 좀 더 부담스럽지 않은 색감인 블랙의 판매율이 좀 더 높았음 / 남성- 전연령대 모두 플레이 스테이트의 판매율이 가장 좋았음, 신상 코트라인 쇼츠와 연계하여 판매하는 경우도 많았고 티셔츠 단품 구매도 많았음. 기존 퓨어드라이 디자인감이 비슷하여 피로감을 느끼던 고객들이 매우 만족하는 편임. 또한 테니스 고객이 아닌 일반 고객의 구매도 많았음."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"무더위가 지속되어 남녀 모두 퓨어드라이 신상버전의 터치율, 판매율이 가장 높았음. 두가지 모두 기존버전 대비 뚜렷한 디자인의 차이점이 나타나는 상품이라 기존 디자인에 대해 피로감을 느끼던 고객들의 만족도가 높았음 . 전반적으로 신상버전의 디자인적 요소나 원단감 등 모두 고객들의 반응이 좋음. 다만 여성 스커트의 경우 여전히 너무 짧다는 의견이 많았으며 스커트 길이가 좀 더 다양하게 출시되었으면 좋겠다는 의견이 많았음 / 일교차와 날씨로 인해 얇은 바람막이를 찾는 고객들이 늘었음"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"금주는 모자나 밴드류의 판매율이 많지않아 뚜렷한 피드백은 없었지만 모자나 밴드 모두 디자인적 요소나 핏에 대해 만족하는 편임 가을 느낌의 소재감이 많아 날씨가 좀 더 풀린다면 훨씬 판매율이 오를것으로 보임."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"1. 볼트프로 W 의 경우 대전점 주고객연령층에겐 다소 영해보인다는 의견이 많았음 오히려 다른 컬러를 선택하거나 에어리W 로 고르는 등 눈에 띄는 판매나 터치율이 있는편은 아닌것 같음 2. 리스폰스 터프의 경우 디자인적 요소보단, 아웃솔의 특징으로 인한 터치율이 있는편임 색감자체는 FW시즌에 맞게 배색도 고급스럽고 전연령대 모두 어필하기 좋을듯 날씨가 좀 더 풀린다면 판매율이 더욱 상승할것으로 보임 / 두 버전 모두 아직까진 입점객수가 너무 적어 좀 더 지켜봐야 할것같음."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"금주는 디파이어 100L, 100UL 의 입고일 문의와 예약문의가 매우 많았음. 또한 US OPEN 에디션의 경우 클래시 버전의 판매가 있었으며 블레이드 버전의 터치율도 많았음 두가지버전 색감 모두 기존버전 대비 훨씬 깔끔하고 고급스럽다는 의견이 많았음."},{"cat":"기타","topic":"고객 입점 동향","fb":"인수인계로 인해 전년 점포의 상황을 전달받았을때 입점객수 부터 대폭 줄었다고함 (전년대비 동기간 입점객 평균 3-40%정도 감소 ) 경기침체 및 악화로 인한 소비심리 위축의 영향도 어느정도 있는듯함. 입점객 자체도 너무 없었지만 유독 가격저항이 심한 한주였음 또한 작년의 경우 이슈아이템 (드로우스트링백팩, 쉴드백팩 등) 등의 다량판매가 있었지만 금년의 경우 주력용품의 디자인이 전년과 너무 비슷하여 피로감을 느끼는 고객들이 많았음. 라켓의 경우도 현시점 가장 이슈인 디파이어의 수요대비 물량부족이 이어져 너무 아쉬움. 지방권의 경우 테니스 인구가 많지 않아 극여름 비수기등의 매출을 커버하려면 어느정도 라이프의 비중을 좀 더 늘릴 필요가 있다고 생각함. 매장에서도 더 힘쓰겠음."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"1. 여성 상의 : 퓨어드라이셔링의 터치율과 판매율이 가장 좋았음, 테니스가 아닌 일상복이나, 타 스포츠 고객들의 구매도 많았음 전연령대 모두 무난하게 입을 수 있어서 좋다고 하시며 기존 디자인에서 포인트가 딱 잡혀있어 고객들의 반응이 유독 좋은것 같음. 특히 WHT 컬러의 반응이 가장 좋음. 또한 플레이스테이트재킷의 입고로 바람막이 아이캐칭과 터치율이 상승함. 긴팔상품 빠른 입고가 필요할것같음. 2. 여성 하의 : 하의의 경우 골고루 다양하게 판매가 되었음. 더블메쉬옴브레 블랙컬러의 반응이 특히 좋았으며 골프나 다른 스포츠등의 고객들에게도 판매가 되었음. 또한 일교차가 커지다보니 나일론소재등의 얇은 롱팬츠 문의가 늘어남 / 3.남성 상의 : 남성의 경우 플레이스테이트 티셔츠가 아이캐칭도 많았고 판매율이 가장 높았음. 3-40대 구매력이 높은 고객들의 반응이 가장 좋았으며 일상용으로 입으려 구매하는 고객들도 꽤 많았음, 그 외엔 스피드드라이자가드의 터치율과 판매율이 상승하였고 일교차로 인해 아침과 저녁기온이 하락하며 가을까지 코디하기 편한 카키컬러가 가장 반응이 좋았음. +바람막이 터치율과 문의가 늘어남에따라 피스테종류등의 빠른 입고가 필요할것같음. 4.남성하의 : 코트라인 7인치 쇼츠가 매장 내 모든 상품과 코디하기 좋아 가장 많이 연계판매가 이루어졌음 또한 볼 포인트 7인치 쇼츠도 착용시 라인이 너무 길지않아 스피드드라이자가드와 연계판매가 이루어졌음. / 금주는 디파이어, 엔코드, 클래시 USOPEN 등 이슈라켓의판매가 원활이 이루어졌으며 볼트프로, 리스폰스 등 용품등의 판매도 원활하였음 날씨가 좀 더 풀린다면 더 판매율이 높아질것같음."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"1. 플레이스테이트자켓 반응: 남/녀 디자인 모두 터치율도 높고 특히 여성 퍼플컬러의 아이캐칭이 많았음. 일교차가 커치며 얇은소재의 긴팔을 찾는 고객들이 늘어났는데 디자인도 깔끔하여 호불호없이 입기좋아 원활히 판매가 이루어짐. 특히나 여성의 경우 기존 브라탑만 입기 부담스러웠던 고객들에게 함께 코디하여 어필하고 있음. 2.FW상품반응 : 아직까진 FW상품들이 반팔이 주로 많은 상태라 명확한 반응은 애매하지만 현재 출시된 바람막이 등 보았을때 디자인적인 요소나 핏감, 원단감에 대한 만족도가 굉장히 높으며 이로인해 타 스포츠 고객들의 유입이 늘어나고 있음 (댄스스포츠, 라인댄스, 필라테스, 러닝, 특히 골프의 경우가 많아짐 타사대비 원단감이나 색감에 대해 만족하는 경우가 많았음. 3. 가을상품터치 : 터치율 매우 상승함. 대전점 고객의 경우 날씨에 민감하여 체감기온이 내려가면 바로 바람막이나 가을상품을 찾는 경우가 많았음, 또한 긴바지에 대한 문의가 굉장히 많았기에 빠른 입고가 필요하다고 생각함. 4. 부족감 있는 아이템 : 재킷에 함께 매치할 아이템이 반팔 제외하고, 이너탑이 다소 부족하다는 생각이 듬, 브라탑이 아닌 알로의 리브드탱크탑처럼 기본길이나 골반위까지 내려오는 기본 이너 나시가 있으면 브라탑이 부담스러운 고객, 또는 테니스가 아닌 일반 일상용 등으로 구매하는 고객에게 연계로 판매하거나 단품등으로 판매하기에도 좋을것 같음. 특히나 여름에서 초가을로 넘어갈때는 반팔을 이너로 입기보단 기본 나시를 매치하는 경우가 많으니 추후 꼭 출시가 된다면 판매에 많은 도움이 될것같음. 스커트의 경우  좀 더 다양한 기장감이 출시되었으면 좋겠음. FW시즌엔 롱스커트의 수요가 어느정도 있는데 전반적으로 기장감이 짧다는 의견이 항상 있었음 기존 버전대비 좀 더 다양하게 출시된다면 일상용등에도 어필하기 좋을것 같음. 테니스의 유입이 적어지는 만큼 라이프웨어의 비율이 어느정도 꼭 필요하다고 생각함."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"1. 플리에 토트백 : 색감과 디자인으로 여성고객 모두 터치율 및 반응이 굉장히 좋음 핑크,아이보리 모두 반응은 좋으며 도트백의 경우 꼭 테니스가 아닌 타 스포츠 (필라테스나 요가, 발레 등) 고객들에게 어필하기도 좋아 매장에서도 꾸준히 어필중임. 아직까진 원단감이 다소 무거워 보일수도 있어 날씨가 더 풀린다면 더 많은 판매가 이루어질것 같음. 2. 니삭스류 : 니삭스의 경우 터치율이 많지는 않음. 디자인적으로는 너무 예쁘다며 터치도 하지만 니삭스가 다소 부담스럽다며 오히려 일반 크루삭스가 훨씬 많은 판매가 이루어짐. 3. 모자: 금주 모자의 많은 판매가 이루어짐. 전 라인 골고루 판매가 이어졌으며 아직까진 다소 더운 날씨로 인해 나일론 소재의 캡종류가 반응이 좋았고 선물용으로 구매하시는 고객들도 많았음. 도톰한 소재의 모자들도 터치가 많았으나 날씨로 인해 망설임. 해당사항도 날씨가 더 풀리면 일반고객등에게 원활하게 판매가 이루어질것으로 보임. / 금주는 올어라운드짐백L 그린, 레드등의 판매가 많았고, 드로우스트링 백팩은 골고루 무난하게 판매되었음."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"수입라인 : 레드컬러 색감으로 인해 아이캐칭도 잘 되고 터치율도 높음 러쉬프로의 경우 꾸준히 다른컬러를 찾으시던 고객님들이 꽤 있기에 좀 더 지켜보면 더 많은 판매가 이루어질것으로 예상됨./ 볼트프로W : 여성고객들이 금주는 볼트프로보단 에어리W의 터치율이 많았기에 아직까지 큰 반응이 있지않았음. 오히려 남성고객의 문의가 더 많았음/ 리스폰스프로 터프: 날씨가 풀리며 클레이코트용을 찾는 고객들이 늘어남 착화시 무게감도 가볍고 발목을 잘 잡아주는 느낌으로 고객들의 만족도가 높음 날씨가 더 풀린다면 더욱 많은 판매가 이루어질것으로 보임."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"남성 스펙의 경우 자체 바이럴이 출시전부터 이루어지기도 했고 여성고객들의 경우 테린이의 비율이 더 많기에 여성고객들의 반응이 더딜수 도 있다고 생각듬. 대전점의 경우 UL 모델 1그립이 가장 많이 판매되었으며 사전예약 고객50% 워크인고객 50% 비율로 판매되었음. 반응이 좋기에 빠른 재입고가 필요함. 100L도 남성고객들의 판매가 이루어졌으나 여전히 98PRO 와 100 재입고에 대한 문의가 많았으며 입고예약을 하는 고객이 많았음./ US OPEN의 경우 클래시 100UL 1그립의 판매가 가장 많았음 쨍한 컬러를 찾는 여성고객에게 어필하였을때 반응이 모두 좋았음. 남성고객의 경우 기본모델을 선호하는 경향이 있지만 여성고객의 경우 기본클래시보단 에디션 모델을 훨씬 선호하는것 같음. /엔코드의 터치율이 많았고 원활하게 판매가 이루어짐 아직 출시된지 모르는 고객들도 꽤 많아서 차주쯤 본격적으로 많은 판매가 이루어질것으로 예상됨./ 금주는 이슈라켓등의 입고로 인해 라켓의 판매가 원활하게 이루어졌음. 스트링 당일작업을 원하는 경우가 많았으나 증정등으로 커버하였음."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"해당사항 없음"},{"cat":"기타","topic":"고객 입점 동향","fb":"전년동기간 대비 고객유입은 현저히 적은편임 금주의 경우 평일 유입고객이 어느정도 있었고, 객단가가 높은편이라 어느정도 상쇄되었으나 주말의 경우 폭우 등으로 인해 입점객이 현저히 감소하였음."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"여성 : 퓨어드라이 상의, 올코트3쇼츠 의 판매가 가장 많았음. 상의의 경우 폴로티가 전연령층 모두 구매율이 높았고, 플레이스테이트의 경우 아이캐칭과 터치는 굉장히 많았으나 전주대비 갑자기 덥고 습해진 날씨로 인해 구매까지 이어지진 않았음. 남성 : 퓨어드라이 폴로티, 플레이스테이트 자켓, 코트라인 쇼츠가 가장 많은 판매가 이어졌음. 여성과 마찬가지로 전주대비 날씨로 인해 자켓류의 아이캐칭과 터치가 많았지만 구매로 이어지진 않는 경우가 많았음 두가지 모두 날씨가 좀 더 풀린다면 구매율이 훨씬 상승할것으로 보임."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"1. 신규 상품 구매 비율이 더 높은 편. 특히 플레이스테이트 퓨어드라이 반팔 라인. 아노락이나 바막도 많이 보긴 하나 다시 더워진 날씨로 구매를 망설임 2. 기존4:신규6 비율로 테니스나 골프 고객들이 윌슨 브랜드를 알게 되어 구매하거나, 기존 고객들이 신상품을 구매하기 위해 방문. 일반 고객들이 라이프스타일로 구매하는 비중도 점점 늘어나고 있음. 기존에 엄브로를 구매하던 구매력이 있는 30-40대 남성 고객들도 입점이나 구매율이 높아지고 있음. 라이프로 입더라도 기능성이면서 라이프스타일로 활용 가능한 디자인을 많이 찾으시는 편 3. 여성라인의 경우 바지나 치마 길이가 너무 짧아 부담스러워 구매로 이뤄지지 않는 경우가 많았음. 남성의 경우 아이템이 한정적이라 기존 고정 고객들이 추가로 구매할만한 스타일 부족 4. 대부분 FW신상품을 찾는 고객들의 비중이 높았음. 지난 주 바막이나 긴팔을 구매하려는 고객이 늘어났으나 다시 더워진 날씨로 인해 줄어듬."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"1. 작년에 비해 백팩 스타일 보단 다른 형태의 테니스 가방을 찾는 고객들이 늘어남. 특히 커플, 부부 고객들의 경우 같이 테니스를 시작하는 경우가 많아 라켓 2자루 정도가 들어가는 백팩 형태가 아닌 스타일을 많이 찾는 편 2. 테니스를 처음 시작하는 고객들이 가방까지 구매하는 경우가 많음. 기존 고객들은 투어백이나 라켓이 여러자루 들어가는 형태의 가방들을 선호하는 편이며 예전보다 컴팩트한 느낌의 투어백을 많이 찾으심 3. 드로우스트링백팩의 경우 지인이나 다른 회원이 가지고 있는 경우가 많아 스타일이 겹쳐 구매를 안함 4. 플리에, 드로우 반응 좋은 편. 너무 캐주얼하거나 백팩 스타일을 선호하지 않는 고객들의 구매 비중이 높음."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬투어,프로 모두 아이캐칭 및 터치율이 전주대비 상승하였음. / 인트리그투어 의 경우 착화시 전반적인 안정감에 만족하여 여성분들의 구매가 이어졌음. / 에어리W 핑크 입고일의 문의가 있었음./ 슈즈의 경우는 재구매고객이 가장 많았으며, 기존 구매 고객의 추천으로 신규고객들이 점차 추가적으로 유입중임."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"금주는 평일에 엔코드의 많은 판매가 이어졌고, 나머지 라켓의 경우 디파이어의 터치와 문의가 가장 많았음. 특히나 남성스펙 입고일의 문의가 많았으며 시타평이나 후기가 좋아 기다린다는 고객들이 있었음. 타이거 에디션의 경우 터치가 소폭 있었으나 아직까진 반응이 크진않음 좀 더 지켜봐야 할것같음. (외국인 고객, 국내고객의 클래시 롤랑가로스 문의가 많았음. 품절로 US OPEN 으로 유도하였으나 꼭 해당 디자인을 찾으시며 아쉬워하셨음) 점 자체 운영중인 블로그를 통해 이슈라켓등의 판매가 꾸준히 이루어지고 있음."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주도 입점이 적은 편이였는데, 휴가막바지와 기온상승으로 인해 입점이 더더욱 줄었음. 1) 내국인 85% 외국인 15% 대전점의 경우 외국인 고객들이 많은 지점은 아니라 내국인 (타지역 거주) 위주의 방문이 많은편임. 4-5월에도 외국인 방문이 많진 않았지만 점포 옆 DCC 행사등으로 유입이 있었으나 요즘은 좀 더 감소한 추세임. 2) 기존 40%/ 신규60% 의 비율임 6-8월의 경우 4-5월 대비 점 내 입점이 전반적으로 많이 줄어듬. 기존 방문고객들은 꾸준히 방문하고 있지만 이미 보유하고 있거나 비슷한 디자인들이라 피로감을 느끼는 경우가 있었음 또한 신규고객 대비 객단가가 크게 높지는 않은 경우가 많았음./ 신규고객의 경우 테린이나 입문고객들의 객단가가 높았음 또한 타 스포츠 ( 대부분 골프 ) 또는 타브랜드 충성고객 ( 주로 엄브로, 코닥, 데상트 등 라이프웨어로 입는 ) 의 구매율이 점차 상승하고 있음. 테니스 고객, 라이프고객 두가지 모두 잡을 수 있도록 노력하겠음."},{"cat":"경쟁사","topic":"타 브랜드 프로모션","fb":"라코스테 30% 시즌오프"}]},"신세계센텀":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"시원한 느낌의 스피드드라이 제품들의 반응이 좋았습니다. 몇일째 계속되는 폭염에 좀더 기능성을 원하는 고객들이 매장와서 선택할수있는 최고의 아이템이었습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"신상품반응은 전체적으로 좋은편입니다. 특히 날이 너무 더워서 기능성원단을 원하는고객들에게 딱 권해줄수 있는 스피드드라이제품들이 타이밍좋게 신상품으로 들어와서 판매도 아주 잘되었습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"지금 너무 심한 더위와 폭염으로 바이저제품들의 반응이 가장 좋았습니다. 신상밴드류는 아직 크게 반응은 없는상태입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"클레이코트용으로 신고싶어하는 고객들에게 적극 추천으로 판매가 좋았습니다. 색상도 클레이색감과 비슷해 스트링백팩v2 아이보리 컬러랑도 같이 연계판매도 할수있었습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"테린이분들은 클래시로 추천을 받아 매장으로 오셔서 저희와 상담후 구매로 이어진건들이 몇몇있었습니다. 그리고 이번주도 대부분 외국인고객들이 라켓터치율이 좋았는데 US open 라켓과 RF라켓의 반응이 가장좋았습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전년과 비슷한 입점과 매출이었습니다. 그러나 달라진점이있다면 작년 휴가철에서 타지역 관광객들이 부산으로 휴가를 오면서 휴가차 온김에 매장으로 방문해서 많이 구매들 해주었는데 올해는 거의 타지역관광객 고객들은 없었습니다. 이제 지역별로 윌슨매장이 많아지고 있어서 자연스러운 것이라고 보고있습니다. 그래도 작년보다도 몇배로 오른 외국인관광객들이 그 빠진 매출을 커버를 해주고 있습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"라이트모션캡과 TTS73,TTS75 퓨어드라이 상품들이 반응이 가장좋았습니다. 아직까지 무더운 여름날씨가 계속되고 있어서 반팔 반바지류 제품들의 좋은 반응이 계속이어지고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"전주보다는 확실히 선선해졌지만 결국 30도가 넘는 더위가 계속되면서 가을상품의 터치는 아직 크게 없었습니다. 아직 고객들도 반팔, 반바지류 제품을 찾고있습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백은 외국인 고객들에게 반응이 더 좋았습니다. 크림, 핑크 컬러로 외국인 여성고객들의 시선을 사로잡았고 테니스라켓말고도 그냥 데일리짐백으로도 사용할려고 구매하는 고객도 있었습니다. 그리고 신상모자가 많이 들어오면서 모자판매율도 전체적으로 상승했습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"현재 신상수입화 보다는 리스폰스1.5터프의 판매가 가장좋았습니다. 인조잔디나 클레이 코트용 신발을 찾는 고객들이 많았는데 그 고객에게는 편안한 착화감이 좋은 리스폰스신발이 니즈가 맞았던거 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"아직까지도 98프로나 300g의 무게 디파이어를 찾는 고객들이 많았고 L,UL 무게도 간혹 테니스 경력자분들의 여성고객이 문의가 있었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주보다는 백화점입점객은 상승했습니다. 주말동안 부산지역에 많은 비로인해 백화점으로 고객들이 많이 몰렸었습니다만 매장으로의 입점은 전주대비 좀 낮았습니다. 휴가막바지로 소비보다는 구경하는 고객이 많았고 외국인고객들의 입점은 좀 줄었습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이제품들의 반응이 가장좋았고 2LPS72 폴로 퓨어드라이 티셔츠가 그중에 가장 반응이 좋았습니다. 아직까지 무더운 날씨가 계속되고 있어서 반팔 반바지위주의 판매가 계속되고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"저희점은 관광객이 많은 지역중에 하나로 신규고객이 엄청나게 많습니다. 외국인들도 마찬가지구요. 그래서 부산인근 거주자 말고는 재구매가 크게 일어나고 있지는 않습니다. 그리고 테니스를 치는 대부분의 고객들이 저희 브랜드에 입점해서 구매하고 있고 매장에서 상품디자인보고 매우 긍정적으로 원단이나 디자인적인부분에 만족하며 구매를 하고 있습니다. 다만 일부고객들이 가격적인 부분에 부담을 느껴 이탈하는 분들이 있습니다. 마지막으로 아직 무더운 날씨가 계속되고있어 FW상품보다는 여름상품의 컨택이 현재로서는 많습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백w 같은경우는 딱 여성고객들을 위해 만들어진제품답게 여성고객들에게 인기가 상당했습니다. 너무 테니스가방느낌보다는 일상용으로도 충분히 활용가능한 그런 디자인때문에 드로우스트링토트백보다는 플리에 토트백이 반응이 더 좋았던거 같습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"대부분 안정적인 착화감과 접지력을 원하시는 분들께 수입화들을 추천해드리는데 가격적인 이슈말고는 전부 만족감을 보여주었습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어, 블레이드, 클래시등 골고루 라켓판매가 잘되었고 특히 외국인들 라켓판매율이 계속해서 높아지고 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"확실히 8월들어서 외국인 비중이 조금 하락세를 보이고 있습니다. 봄부터 대만고객들이 정말 많았는데 8월들어서는 많이 줄어든게 체감상 보이고 있고 6-8월의 경우 신규고객이 정말 많았습니다."}]},"신세계강남":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주의 상품 베스트는 남성 퓨어드라이 셋업과 여성용 탑스핀폴로(같은구성의 원피스) , 요즘들어 태풍의 영향으로 굉장히 더운날이 지속되어 여성고객님들과 남성고객님들 말할것도 없이 매장에 오시면 \"시원한거 있어요?\"라고 이야기 하시는 고객님들이 굉장히 많습니다. 특히 20대~30대 남성고객님들이 스피드드라이소재의 티셔츠상품을 계속해서 구매하시고 좋아하셨는데 이는 한여름에는 퓨어드라이 소재가 주는 약간의 답답함이 스피드드라이의 라이트한 재료에서 오는 시원한 느낌이 더 좋았던 것 같습니다. 가장 매출이 많이 몰렸던 여성30~40대 고객님들께서는 중기장의 브라탑과 컬러매칭이 이쁜 하의류를 많이 찾으셨고, 스커트류와 반바지르가 ss시즌이 거의 종료되면서 fw의 신상이라도 있냐고 계속해서 물어보시는 고객님들이 많았습니다. fw시즌의 브라탑이나 sl종류는 다음주부터라도 빨리 들어와야 될것 같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"이번주 여성 수입류의 신상품의 반응이 굉장히 좋았습니다. 미드타운스커트류의 저조한 판매률로 벨로시티상품들의 판매가 급증했고, 이는 더 얇고 시원한 소재를 원하시는 \"극여름 테니서\"들의 픽이 었는데 이번주에 들어온 신상 미드타운스커트는 상의가 같이 엄청얇은 니트?소재로 입고되어서 테니스입문자분들 뿐만 아니라 구력이 높은 고객님들에게 굉장히 인기가 많았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"아직까지 용품신상의 반응이 확올라오지는 않는것 같습니다. 이는 이번주부터 본격적인 2차휴가철을 맞이하려 매장에 입점하시는 고객님들이 많이 적었고 이때문에 매장에서 용품류는 거의 가방류만 판매가 좋았고, 두꺼운 양말도 생각보다 판매가 조금 저조 했습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"리스폰스 프로의 판매율이 계속해서 떨어지고 있습니다. 이는 신발류의 가장 강세인 \"러쉬 시리즈\"와 \"인트리그 시리즈\"의 반품으로 고객님들은 수입상품과 국내 상품의 비교군이 축소되어 선택지가 줄어든 탓에 정작 \"리스폰스프로\"는 \"볼트프로\"와 경쟁을 해야 하는 판매과정이 생기게 되었습니다. 이는 내구성과 안정성 그리고 가격적인 부분에서 상당히 판매율이 좋은 리스폰스 프로였는데 이건 오히려 가장 고가금액의 \"러쉬투어\"와 비교하여 다운셀링을 하는 목적에서도 판매율이 아주좋았습니다. 하지만 \"리스폰스프로\"와 \"볼트프로\"를 착화시는 고객님들은 1만원을 더 지불하고 볼트프로를 구매하시는게 더 러닝화같은 편안한 착용감이라고 착단하고 볼트프로를 구매하시는 분들이 더 많아지고 있습니다. 리스폰스프로의 컬러는 지금 충분히 좋은리뷰를 드릴 수 있습니다. 하지만 운영에 있어서 추가적인 비교군까지 거의모든 수입상품이 같이 운영되지 않는다면, 좀 더 많은 비교군을 만들어 주시는 것도 좋을것 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"요즘 us에디션상품의 판매가 계속해서 호조를 보이고 있습니다. 이는 us오픈 상품의 밝고 예쁜디자인으로 여성고객님들의 아이캐칭이 굉장히 좋으며, 남성분들은 블레이드v10을 구매하러 오셨지만 희소성으로 구매하시고 싶다고 하시는분들이 하나씩 구매하시는 것 같습니다. 특히 블레이드상품만큼의 좋은 라켓이 없다는 반응이 요즘 테니스고객님들 사이에서 좋은 평가를 받고 있어서 블레이드는 계속해서 꾸준하게 베스트셀러로 자리를 잡아가고 있습니다. 특히 이번주에는 rf의 판매가 굉장히 저조한데 이는 고객님들이 매장에 오셔서 \"rf라켓 어려워요?\"이렇게 물어보시는 고객님들이 생길정도로 요즘 rf라켓의 사용난이도가 높다는 의견들이 많습니다. 울트라와 클레쉬는 늘 베이직한 판매를 보이고 있으며, 디파이어로 인해서 매장에 문의 주시는 고객님들의 답변을 최대한 빠르게 해드리고는 있는데 계속해서 매장에 엄청나게 문의가 많습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"요즘에 여성농구동호인들이 굉장히 많이 늘어나고 있는 추세입니다. 최근 학생들사이에서 \"농구 붐\"이 일어낫을 정도로 학생분들이 농구를 많이 하고 있는데 , 이는 요즘 농구시장의 접근성이 상당히 많이 발달했다고 볼 수 있습니다. 특히 여성분들이 손쉽게 즐길 수 있는 스포츠로 농구를 많이 선택하는데 이는 야구나 축구처럼 꼭 몇명이서 모이지 않아도 1대1로도 스포츠를 할 수 있다는게 가장 장점이고, 어디에서 공을 가지고 놀아도 모든 코드가 거의 공짜라는 이미지가 잘 자리잡혀서 앞으로도 계속해서 농구에 대한 수요가 늘어날것으로 전망합니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"이번주에 입점객들의 수요는 지난주와 비슷하거나 많았습니다. 최근 신상품의 입고가 더딘데도 불구하고 8~9월 테니스복을 구입하시려는 고객님들의 수요가 계속해서 급증하였고 이추세가 계속 이어지면서 주말에는 국내 평일에는 해외고객님들의 수요가 많이 늘어서 굉장히 매장이 붐비고 있습니다. 곧 출시되는 디파이어 라켓으로 아직 답변도 못드린 고객님들이 많을 정도로 요즘 윌슨의 인기가 뜨거운것 같습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주의 베스트도 늘 브라탑과 스커트 위주의 셋트구성이었습니다. 남성분들은 라켓종류와 가방을 구매하면서 무조건 의류를 많이 구매하셨으면서 용품매출이 굉장히 올랏으며 특히 신발류의 판매가 월등하게 올라가고 있습니다. 이는 인상으로 들어온 투어가 미끼상품이 되어주면서 다른 상품들도 판매가 아주 잘되었습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"이번주 fw상품들은 특히 셔링이 들어가있는 상품이 너무 디자인이 좋았습니다. 최근에 디자인위주로 나온 퓨어드라이 소재는 판매가 계속 좋은데 이는 고객님들이 좋은 원단은 먼저 알아보기때문에 특히한?감성이나 톡득한 감성의 제품들을 많이 찾아서 구매하신다고 보시면 될것 같습니다. 라코스테에서 나오는 피케티셔츠 처럼 로고를 와펜화 하여서 제품이 제작될 수 있으면 좋겠고, 또한 디아도라처럼 예능이나 유튜브에 출연하는 인기모델들에게 ppl이 많이 나갔으면 좋겠습니다. 중요한건 부족한 아이템이나 상품력이기 이전에 브랜드 노출에 대한 고민도 중요하게 생각해주시면 너무 좋을 것 같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백은 매장 전면의 마네킨 2대가 모두 색상별로 들고 있는데 외국인들과 국대 고객님들께 반응이 굉장히 좋습니다. 기존에 올어라운드짐백이 판매가 굉장히 좋았는데 토트백이 출시되고 판매가 떨어질 정도로 이번주에는 플리에 토트백을 정말 많이 찾으십니다. 니삭스와 모자류는 신상컬러가 내츄럴하게 제작되어서 지난시즌과 동일하게 판매가 잘되고 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"이번주에 신발 터치율이 8월들어서 가장 좋았습니다. 진작에 신상이 빨리 출시가 되었어야 하는데 신발은 출시일이나 입고일이 정해져있지않아서 매장에서 급하게 많이 필요했는데 fw핵심상품이 출시되면서 걱정을 한시름 덜었고 실제 신발판매도 월등히 잘되었습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"남성분들이 굉장히 디파이어라켓을 많이 찾으시는건 사실입니다. 여성분들같은경우에도 디파이어와 디파이어 범퍼?같은 개조품까지 세세하게 엄청 물어보시면서 디아파이어를 구매하시는 고객님들이 계신데, 사실 100L같은 경우에는 최소 1년이상구력이 있으신 고객님들이 전부 다 구매하셨고, 100ul같은 경우에는 매장에 처음 오시는 고객님들이 구매해주신거라서 매장에서 세일즈로 판매하는 경우가 훨씬 많습니다. 남성스팩이 입고되면 일단 지금도 정신없지만 더욱더 정신없을 것 같습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공을 구매하시는 분들은 보통 초~고등학생분들이 많았는데 이분들은 오로지 매장에 오시면 에볼루션만 고집하시는것 같습니다. 매장에 있는 볼타워에 진열할 수 있는 상품은 한계가 있지만, 그 많은 농구공중에서도 에볼루션만 찾으니, fw에는 에볼루션이 재고가 훨씬더 많아졌으면 좋겠습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"확실히 이번주에 고객입점이 엄청 많았습니다. 지난주에는 날씨가 너무 덥거나 장마가 심했는데, 이번주는 날씨가 좋다보니 테니스복을 구매해야한다는 고객님들이 인식이 엄청 강해서 매장에 오시는 고객님들이 많았고, 특히 샤넬 악세라리 , 티파니팝업까지 지금 해외 외국인들이 신세계강남에 오면 볼거리 살거리들이 많아서 백화점에 오시는 테니스를 치는 외국인고객님들은 꼭 윌슨에 들려서 제품을 넉넉하게 사가시는 것 같습니다. 특히 이번주는 남성외국인들의 방문이 많았고 남성고객님들의 선물을 사는 여성고객님들이 많아서 넘성제품들의 판매가 전주대비 많이 올랐습니다. 특히 브로큰난 싸이즈의 제품들을 찾으시는 분들은 예전처럼 그냥 나가는게 아니라 무조건 가방은 하나씩 구매하시니까 매장에 오시는 고객님들의 니즈는 제품이 아니라 윌슨이라고 생각되는 한주였습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"지난주와 동일하게 20~40대 고객님들의 브라탑과 스커트류의 셋업판매가 정말 많았습니다. 아직 날씨가 덥기 때문에 여성고객님들의 브라탑문의가 굉장히 많은상태이며, 남성30~40대 고객님들은 아노락류를 엄청 많이 찾습니다. 특히 피스테반팔원단인데 굉장히 가볍고 시원한 트리코트를 선호했습니다. 퓨어드라이는 계속해서 판매순위가 1등이라고 보시면 되며, 여성고객님들은 스커트를 구매하면서 무조건 셋트이너를 사야하기때문에 이점을 고려 했을때 내년에는 브라탑의수입이 굉장히 중요할 것 같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"1. 확실히 플레이스테이트같은 신형라인업을 고객님들이 많이 선호합니다. 이유는 입으면 뭔가 쎄보인다?테니스를 잘칠것같아 보이는 퍼포먼스한 디자인을 많이 선호하며 혁시나 빅애플처럼 면소재로 나온상품은 라이프스타일용으로 구매하시는 분들이 많았습니다. 2. 고매하시는 고객님들은 굉장히 다양한데 여성고객님들은 남성용 퓨어드라이소재의 반팔티 xs를 굉장히 많이 물어보셨고 요즘은 진짜 갑자기 신규고객님들이 많이 늘어서 한번 매장을 방문하시면 대량으로 구매하시는 분들이 많습니다. 3. 미구매하시는 고객님들보다 싸이즈가 없거나 생각했던 상품들이 없으면 구매를 하지 않습니다. 특히 디파이어처럼 라켓은 너무 확실히 구매의사가 명확하고, 의류는 재고소진이 빠르기때문에 좋아하는 색상이 없다면 미탈되는 경우가 종종 있습니다. 하지만 이번주에는 색상종류가 워낙많았어서 여성고객니들의 이탈이 없었습니다. 4. 현재 아직도 너무 더운날씨로 fw상품을 고객님들이 구매할 엄두를 못느끼고 있습니다. 이건 정확하게 날씨풀리면 의류는 훨씬 쭉쭉 잘팔릴 것 같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백은 지난번 \"그로브\"시즌때 구매를 못했던 고객님들이 유사 비슷하다고 이미 인스타에서나 공홈에서 보고 오시는분들이 엄청 많았고, 실제로 고객님들이 플리에상품을 백팩을 포기하고 구매할 정도로 엄청 좋아하는 상품이라는 건 확실합니다. 실재 플리에 제품덕에 하루는 백팩보다 크로스백종류들이 더 많이 팔린날도 있었고 , 드로우 토트백은 드로우스드링처럼 귀엽게 만들수 있는 유니크한 점 때문에 디자인하나만 보고 구매하시는 분들이 많습니다. 사실 제품을 구매해서 보면 실제로 사용하는 포켓이 많지않다는걸을 고객님들도 인지하고 있어서 무조건 \"외관\"만 이쁜 상품을 선택한다고 보시면 됩니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상으로 들어온 상품이 생각보다 판매가 확올라오지는 않는것 같습니다. 고객님들이 이번 여름에 신발을 너무 많이 구매하셨다면서 , 오히려 fw에 나온게 러쉬투어/인트리스 1종류식만 나와서 아직까지는 좀더 기달렸다가 신상품이 나오면 나오면 같이 한번더 구경하고 구입하고 싶다고 하셨습니다. 1종류만 입고되어서 신상품의 반응을 보기 어렵기때문에 빠른 fw시즌상품의 입고가 중요할 것 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 라켓 100L문의가 끊이지 않습니다. 사실상 디파이어를 사용하시려면 테니스를 아예 모르는 입문자분들이 사용하기에 어려운라켓이라서 구력이 많은 고객님들 "상설","topic":"상설 판매 현황","fb":"추가할인및 25년도 추가할인상품으로 인해 객단가 상승이 높았습니다. 확실히 할인율도 좋지만 추가금액할인이 고객분들한테는 반응이 가장 좋은거 같습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"사이먼여주점은 방문객및 전체적으로 유입고객분들이 많으시지만 빌리지점은 계속 트래픽이 빠지는중입니다. 대부분 프리미엄으로 가시다보니 빌리지점은 폐점하는 매장도 많아지고 있습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 소재의 반팔 제품을 가장 많이 찾아보셨고, 최근에는 얇은 재킷이나 두께감 있는 스커트를 찾는 분들도 점차 늘고 있습니다. 다만 아직까지는 반팔과 반바지 위주의 제품이 주로 판매되고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"8월 윌슨 고객은 기존 고객의 재방문이 증가하면서 FW 준비를 위한 상품 탐색이 시작되고 있으며, 여성 고객을 중심으로 디자인과 소재에 대한 선호를 바탕으로 구매가 이루어지고 있습니다. 신규 고객은 클럽·동호회 활동을 통해 주변 착용자를 접하면서 유입되는 경우가 많고, 미구매 고객의 경우 관심 부족보다는 사이즈 결품이나 원하는 상품 부재로 구매가 이뤄지지 않는 경우가 많습니다. 현재 상품 수요는 여름 반팔·반바지를 중심으로 유지되고 있으나, 남성은 셋업, 여성은 재킷 등 FW 상품에 대한 구체적인 탐색도 함께 나타나고 있습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"라켓 상품 종류가 전반적으로 부족하고, 무게 및 그립 사이즈별 선택지가 없어 고객 니즈를 충족하기 어려운 상황입니다. 특히 여성 고객의 라켓 문의가 많지만 적합한 제품이 없어 상담 및 상품 제안 자체가 어렵고, 실제 판매로도 전혀 연결되지 않고 있습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"24FW 입고 상품은 기존 할인 상품 대비 가격이 높아져 가격 부담을 느끼거나 아쉬워하시는 고객이 많습니다. 반면 25FW 추가 할인 상품에 대한 고객 반응은 매우 좋아, 가격 경쟁력이 있는 상품으로 수요가 집중되는 경향이 있습니다. 이로 인해 상대적으로 가격이 높은 24년 재고 상품의 판매에는 다소 어려움이 있는 상황입니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"최근 외국인 고객의 방문 비중이 증가하고 있으며, 특히 동남아 고객의 유입이 눈에 띄게 늘고 있습니다. 일부 고객은 윌슨 제품을 구매하기 위해 일부러 매장을 찾아올 정도로 동남아 지역에서의 윌슨 인지도가 높은 편으로 보입니다. 또한 3~4월에 방문했던 기존 고객들의 재방문도 최근 증가하고 있어, 기존 고객의 재구매와 함께 외국인 신규 고객 유입도 함께 확대되고 있는 상황입니다."}]},"아이파크":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주도 전주와 비슷하게 폭염이 이어지면서 시원한 소재를 찾는 분들이 많이 계셨습니다. 시어아이스 판매가 다시 올라오고 남성 고객들은 특히나 엘리트, 스피드 라인 터치가 높았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 셔링 터치 및 구매가 있었으며 1020 고객들의 높은 선호도를 보였습니다. 여성 스피드 드라이는 기장이 다소 길다거나 애매하다는 피드백이 있어 기본 퓨어드라이로 구매전환 이루어집니다. 올코트 3인치 숏츠& 커브라인 트랙스커트 등 여성 고객들 두께감있는 밴딩 디자인 불호가 너무 많습니다. 넣어입는 건 물론 빼입어도 핏이 애매한 경우가 정말 많습니다. 올드한 느낌이 있어 매치하기가 어렵습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"신상으로 입고된 아대와 헤드밴드의 컬러가 세일즈 포인트가되어  테니스 고객의 반응이 좋습니다. 양말도 동일한 반응으로 용품과 연계하여 판매하고 있습니다. 여름 시즌인만큼 바이저의 터치가 많으며, 기본 볼캡도 디자인에서 만족도가 높습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"스카이 블루 반응 저조하며, 리스폰스 1.5 터프 또한 컬러 선호도가 낮습니다.  드로우스트링 v2 아이보리와 연계하여 어필하고 있지만 인트리그,  볼트프로로 이탈되고 있어 현장에서도 아쉽습니다.  출시된지 얼마 되지 않아 조금 더 지켜봐야 할 거 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"금주는 라켓 판매가 저조하였습니다. 아직까지 남성 고객들 디파이어 문의가 지속적으로 있으며, 여성 스펙 문의는 없었습니다. 라켓을 보러 오신 고객들이 확연히 줄었습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"날씨에 맞게 야외활동이 줄어들면서 농구공 판매도 저조합니다. 구경만 하시고 발길 돌리시는 고객님들이 많습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"기존 고객들의 방문이 지속적으로 꾸준히 있으나 매번 말씀주시는 게 상품이 비슷하다 라는 의견이 많고, 인기 상품들의 재고는 빨리 깨져 판매로스가 너무 아쉽습니다. 휴가가 길게 이어지면서 유동인구는 늘었으나 내수 고객들은 소비하는 걸 꺼려하시고 브랜드 자체 피로도가 높아보임을 체감할 수 있는 한주였습니다. 외국인도 줄었으나 간혹 오셔서 한국의 상품들을 좋아해주시고 객단가 높게 구매해가십니다. 매번 느끼는 거지만 신상품 입고 시기가 아쉬우며 리오더 일정이 늦춰짐에 따라 판매가 저조한 것도 당연한 부분이라 아쉽게 생각합니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"피키셋업& 시어아이스 판매와 터치가 여전히 높습니다. 낮에도 더운 날씨에 가벼운 소재를 찾는 고객들이 대부분이셨고 입점 고객들 연령대 또한 2030으로 젊은 고객들 소비가 많습니다. 공홈을 보시고 아노락 문의주시는 분들이 증가하였고 언제 입고되는지 궁금해하시는 분들이 계신 한주였습니다. 남성 고객들 셋업 종류가 너무 적다는 피드백이 있고 퓨어드라이 반팔 반바지 구매해가십니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"피스테 및 반집업, 풀집업 스타일이 적습니다. 스포츠 브랜드 대부분이 가을 셋업을 착용하고 있고 바람막이 후드집업 등 판매되고 있는데, 판매호조 아이템들은 사이즈가 대부분 깨져있어 응대하기 어려운 한주였습니다. 바람막이 터치가 전주보다 올라왔고 기존 고객들이 방문해주셔서 가을 상품 입고 시기를 물어보시는 분들이 계셨습니다. 아노락&피스테 입고 시기를 더 빨리 당겨도 대응해드리기에 좋을 거 같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백 컬러가 예쁘다고 구매해가시는 20고객님들이 계시며 컬러별로 사고 싶다는 피드백을 정말 많이 듣습니다. 여성 고객님들이 라벤더(연보라) 컬러도 좋아해주셔서 추가 리오더 진행하게 되면 좋을 거 같습니다. 니삭스는 꾸준히는 아니지만 찾는 분들이 계시며, 캡보다는 바이저 구매도가 더 높습니다.(80%이상 여성 고객)"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"인트리그 라서 구매해가시는 고객님들 계시며, 디자인에 대한 피드백이 좋습니다. 볼트프로 여성 컬러는 터치는 있으나 매치할 의류가 애매하다는 피드백이 있어 인트리그나 에어리로 구매전환 됩니다. 터프도 클레이&인조잔디 유저분들께 추천드리고 있으나 올코트로 구매해가십니다. 컬러가 아쉽다는 반응이 있었습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 여성 스펙은 홀세일 뿐만 아니라 동대문 언급을 많이 하시며 금액이 너무 비싸다는 피드백이 많았습니다. 한정판 라켓을 물어보시는 분들이 많이 계십니다. 즉시 스트링 가능한 점포 아랫층 테니스 매트로로 이탈이 많으며, 기본 모델은 판매 저조합니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공 판매는 꾸준히 좋습니다. 가족단위나 학생 고객들이 구매해가시며, 자점 인스타 릴스를 보시고 디엠으로 문의주시는 분들도 계십니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"패션파크 쪽은 한가하며 붐비는 느낌이 없습니다. 평일과 비슷한 입점객수로 오히려 평일 목적구매로 객단가가 더 높습니다. 가족단위 보단 2030 젊은 커플/부부 단위가 많고 외국인 고객이 줄었습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주는 기온이 선선해지면서 fw 아이템 터치가 늘었습니다. 아노락 및 자캣 골고루 판매되었는데 특히, 플레이 스태이트 셋업 판매가 좋았습니다. 두께가 여름에도 착용 가능한 부분이 큰 매리트가 있었고 커플 단위 방문이 있었는데 긴팔 위주로 트래픽이 늘었습니다. 컬러 및 디자인이 예쁘다는 피드백이 있었습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"재구매 고객들은 의류나 용품이 가장 많습니다. 시즌이 바뀌면서 가을 테니스 의류를 준비하시는 분들이 많습니다. 특히나 윌슨 브랜드의 애정을 가지고 신상을 기대하시는 고객님들이 많습니다. 베스트 상품 구매시기를 놓쳐 구매 못하시느 분들이 재방문 해주시는 경우도 있고, 이미 가지고 계신 고객님들은 기존과 다른 스타일을 기대하시며 방문해주십니다. fw 상품들로 매장 환기가 되면서 입점이 늘었고, 여름옷은 f1 의류를 제외히고는 사실 비슷한 스타일이 많아 피로도 느끼시는 분들이 많이 계십니다. 애플은 가족단위, 학생 고객층이 구매로 이어지는데 소재 뿐만 아니라 디자인이 예뻐서 구매해가십니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에는 국내 고객 문의보다 외국인 고객 문의가 많습니다. 드로우스트링 토트백은 아예 반응 없습니다. 너무 정사각형 디자인이라 투박해보인다는 피드백이 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬투어/인트리그는 꾸준히 인기가 좋으나 큰 사이즈 입고 부재가 너무 아쉬운 상황입니다. 점포 특성상 외국인 고객 유입도 있는 편이라 285,290 사이즈는 너무나 필요합니다. 여유있는 수량이면 좋으 거 같습니다. 경량 테니스화 보다 8~90% 고객님들꼐서 인트리그,러쉬투어만 보십니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"힌정판 에디션 라인 찾는 고객들이 대부분입니다. 기존 라켓들은 점포 5층 테니스 매트로에 저렴하게 구매 가능한 점에서 에디션 라인만 보러 오시는 내/외국인 고객님들이 8~90% 입니다. 디파이어 문의는 적습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"자점 인스타그램 릴스를 통해 재고 문의 및 구매하시는 고객님들이 증가하였습니다. 판매가 많진 않지만 학생 고객이 많습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"내수 4, 외국 6정도의 비중이며 객단가가 대략4~50인 편입니다. 외국 고객은 신규가 많고, 내수 고객들은 재방문이 더 많습니다. 주기가 2주에서 한달 반 정도 텀입니다. 특히나 중국 고객들이 줄었으며, 점포 혜택을 보고 방문하시는 분들이 많습니다. 5~6월 대비 7~8월은 외국인 방문이 줄었으며, 내국 고객들 또한 함께 줄었습니다. 장마가 길게 이어지면서 입점 자체가 크게 줄었고 기존 고객들은 FW 신상이 더 많이 나오면 방문하러 오겠다 하신 분들도 계셨습니다. 또한 3주전 방문하신 외국 고객님이 환율이 올라서 구매 못 한다는 반응도 더러 있었습니다."}]},"현대스페이스원":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주 폭염으로 인해 면소재나 롱실루엣보단 퓨어드라이 숏슬리브나 쇼츠 위주로 판매가 많이 이루어 졌습니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"기능성과 탄탄함 둘다 잡은 퓨어드라이 소재의 숏슬리브가 제일 판매량이 높았습니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"신상 모자와 밴드 아직 입고시기가 얼마 지나지 않아 조금더 지켜봐야 할 것 같습니다 터치감은 많지만 판매까지 이어지지는 않았습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트프로 스카이블루는 자주 방문해주시는 고객님들의 피드백을 들었을때 유아틱하다는 피드백을 받았습니다. 색감이 20대 층에겐 흥미있는 컬러이지만 20대 후반 30대 이후부터는 조금 냉소적인 반응이였습니다  리스폰스 프로 1.5 터프는 현재 기온이 폭염과 열대야로 야외 플레이어보단 다들 실내 하드코트를 이용하시는 중이시라 올코트용을 많이 찾고 계셔서 반응이 미지근 합니다"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"클래시와 블레이드 균일하게 판매되었고 디파이어 100UL, 100L 출시일 앞당겨지면서 고객님들께서 많은 관심을 보이고 계십니다"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션볼의 판매량이 많이 높던 한 주 였습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"갸격은 많이 합리적이라 가격적으로 들어오는 부정적인 시선은 없습니다. 다만 사이즈가 없어서 정상제품으로 판매가 이루어지고 상설제품은 푸쉬하여 판매를 하지 못하는 상태입니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주대비 고객입점량 비슷합니다.  휴가시즌과 여의도 한강 수영장 등 다양한 야외에서 할수있는 더위 날리기 행사가 증가해 입점량이 전년도 대비 조금 줄었습니다"}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"남녀 구분없이 퓨어드라이 제품이 제일 인기가 많았습니다, 다만 점점여름이 지나고 가을을 준비하시는 분들의 긴팔을 구매하시는 비율이 늘어났습니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"전체적으로 터치감과 반응 모두 타브랜드 대비 밀리지는 않다고 보이지만 긴바지보단 쇼츠위주로 있는 점이 다소 아쉽게 느껴졌습니다. 날씨가 점점 선선해지면서 긴바지를 찾으시는 분들이 증가 하셨습니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리애 토트백과 fw모자들은 터치감이 좋았지만 니삭스류는 터치감이 많이 저조했습니다"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"여성분들은 수입보단 볼트 w나 에어리 시리즈를 많이 보셨고 남성분들은 반대로 러쉬 프로나 투어 위주로 터치감이 높았습니다"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"여성스펙도 인기가 많았고 런칭 첫날부터 판매 높았지만 기존부터 관심 있으신 분들이 대부분이였고 현장 방문 테린이 여성분들은 따로 큰 관심을 보이시지 않으셨습니다. 여성분들은 무난무난한 라켓을 원하시는 성향이 남성분들보다 조금  많으셨고 남성분들의 재출시 관심은 아직까지도 끊임없이 이어지고 있습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션 및 퓨어샷의 터치가 항상 높습니다"},{"cat":"상설","topic":"상설 판매 현황","fb":"추가할인 덕분에 일정금액 이상을 도달시키기가 많이 편했고 그로인해 연계판매 높여 canp나 컨버젼 높이기 수월했습니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"금주는 전주 대비, 전년도 대비 입점률이 많이 떨어졌습니다. 연휴와 갑자기 풀린 날씨 덕분에 많은 분들이 도시보단 휴식 및 여행을 즐기려 외각으로 많이 빠지시는 추세 같습니다,"}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"날씨가 점점 풀리고 있으나 아직까지는 퓨어드라이 소재의 숏슬리브가 제일 판매 비중이 높았습니다. 다만 아노락과 트랙자켓도 터치감이 많아졌고 구매비율 또한 증가 했습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"의류의 경우 신규 유형 상품의 구매비중이 많이 높습니다 또한 구매 고객은 기존 윌슨 충성고객과 신규 고객님의 비율이 50:50 이였습니다. 윌슨의 퓨어드라이 소재의 탄탄함이 타브랜드 대비 강점으로 다가왔다는 피드백이 많았습니다. 미구매고객님들의 이탈 원인은 타 스포츠 브랜드 대비 상한선의 가격이 가장 큰 이유였습니다. 아직까지는 SS시즌의 숏슬리브가 수요가 높지만 반대로 하의는 롱팬츠를 찾으시는분들이 많이 증가 하였습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백과 드로우스트링 토트백이 터치감은 많았지만 아직까지 구매로 이어지지는 않았습니다. 올인원으로 들고다니기엔 무리가 있다고 생각하시는 분들이 많으셨습니다"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"흰빨에 예쁜 디자인으로 고객님들의 시선을 사로잡기까지는 아주 좋았지만 복합매장 특성상 가성비를 원하시는 분들이 많아 높은가격때문에 판매량이 높게 이어지지는 않았습니다"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 100, 98프로 문의 꾸준히 있었고 블레이드 100L에 대한 문의도 증가하고있습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"금주는 농구공의 판매량이 저조 했지만 퓨어샷과 에볼루션은 꾸준히 터치감이 좋았습니다"},{"cat":"상설","topic":"상설 판매 현황","fb":"터치감과 반응은 좋았지만 추가할인 제품으로만 편향적으로 시선이 쏠리는 경향이 많아졌습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"내/외국인 모두 감소한 수치로 나타났고 감소되는 수치도 점점 증가하고 있습니다. 4~5월 대비 20~30% 감소한 것 같습니다. 4~5월 대비 6~8월에 신규로 입점하시는 분들도 종종 있지만 대부분 재방문 고객님들이 많았습니다"}]},"현대중동":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이  소재의 반팔티가 여전히 인기가 많습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"tts83이 인기가 가장 많았고 lts72가 셔링 디자인이 귀엽다며 칭찬하셨습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"가을이 다가오고 있는 만큼 브라운 컬러 모자에 대한 반응이 뜨거워지고있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트프로 화이트블루 색상이 꾸준히 사랑 받고 있습니다. 스카이블루와 리스폰스 프로는 좀 더 지켜봐야 될 것 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"여전히 블레이드를 많이 구매하시고 디파이어 재입고 일정을 많이 물어보십니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가 시즌과 무더위로 인해 입점 고객님들이 감소하였습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"드로우스트링라인이 신발을 넣을 수 있는 곳과 라켓공간 외에 수납공간이 좋아 인기가 가장 많았음"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 소재의 반팔들이 운동할 때나 일상복으로도 입기 좋다며 인기가 가장 많았고 자켓의 경우는 피팅은 해보시지만 지금 입기엔 더우시다고 반팔을 더 찾으심 긴바지는 언제 들어오는지 문의가 많았음"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"디자인이 귀엽다고 하시지만 복조리 형식의 끈이 불편하다고 하시는 분들이 있으셨고, 살짝 더 두꺼운 니삭스를 찾으시는 분들도 있었음"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"색상이 레드라 예쁘다고는 하시지만 기존에 있던 색상들을 더 많이 찾으셨고, 볼트프로 1.5 W도 신어는 보시지만 기존에 있던 색상들을 더 많이 보셨음"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"프로라인이나 100을 찾으시는 고객님이 더 많으심"},{"cat":"기타","topic":"고객 입점 동향","fb":"전주대비 입점 고객님이 현저히 감소"}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"아직은 퓨어드라이 소재의 반팔티가 인기가 많았다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"시어아이스 소재의 의류를 재구매하시는 고객님이 있었고, 살짝 선선해딘 날씨에 긴팔을 구매하는 경우도 있었지만 다시 더워진탓에 반팔을 다시 구매하십니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"드로우스트링 토트백 반응이 좋았고 플리에 토트백 반응은 좀 더 지켜봐야 할 것 같다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"색상도 좋고 디자인도 예쁘다고 하시지만 터치에 비해 구매가 많지는 않다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"스트링을 따로 매주지를 않아서 그런지 구매가 전보다 많지는 않았고, 디파이어의 경우 재입고가 된 후 반응이 줄어들었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"외국인 비중은 없고, 신규고객님들이 더 많은 편이고 대비 변화 줄었음"},{"cat":"경쟁사","topic":"타 브랜드 프로모션","fb":"데상트 신규가입 15% , 라코스테 30만원 구매시 만원 상품권과 반다나"}]},"현대판교":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어 드라이 제품과 시어아이스 제품의 판매가 많았습니다. 지속적으로 판매가 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"더블메쉬 스커트 새로 입고된 블랙 컬러와 라임컬러에 대한 반응이 굉장히 좋습니다. 사이드셔링 티셔츠들도 터치가 많고 반응이 좋습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"에어모션 캠프캡은 지속적으로 판매가 너무 좋고, 헤어밴드, 손목보호대는 기존에 구매 하셨던 분들도 재구매로 계속 이어지고 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"리스폰스 프로 터프 컬러 반응이 좋고, 볼트 프로 1.5 화이트블루 컬러와 여성용 스카이블루 컬러가 반응이 좋습니다. 골드 컬러도 반응이 좋습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"블레이드, 클래시, 울트라 라켓은 반응이 꾸준히 좋고 디파이어라켓 문의가 많았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션, 퓨어샷 판매가 꾸준히 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전 주와 비슷한 입점객수 였고, 고정 고객님들의 방문이 많았던 한 주 였습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"드로우스트링 라인과 퓨어드라이 제품 판매가 좋았습니다. 가방 디자인에 제일 만족했고, 공간별로 분리되어 있는 점을 만족해 하며, 라켓구매 및 신발 구매 후 연계 판매가 좋았던 한주 였습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"플레이 스테이트 자켓 초반 반응이 너무 좋습니다. 남성 제품도 디자인에 터치가 좋았으며, 여성 스테이트 자켓 판매가 좋았습니다. 가을 상품 터치율이 늘면서 착용해보고 만족하며 구매 했습니다. 초반 반응 너무 좋습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백 W 반응 여성 고객에게 아주 좋습니다. 테니스 이외에도 활용도가 높을 것 같다는 평이 많았고, 터치율 또한 높습니다. 모자류 제품은 목적 구매로 오신 고객님이 많으셨고 대체로 디자인이 괜찮다고 많이 들었습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트 프로 제품은 꾸준히 판매와 반응이 좋습니다. 신상 러쉬 투어 인트리그 제품도 직원 추천으로 신어보시면 착화감 만족 합니다. 리스폰스 제품이 판매가 조금 저조합니다. 터프 판매가 많이 이루어 지지 않습니다. 목적구매로 오시는 고객님들께 보여드릴 제품이 많지는 않지만 충분히 하는데 구성이 좋다고 생각합니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"기존 첫 런칭대비 반응이 낮습니다. 오히려 이번 한 주는 블레이드 판매가 월등히 좋았습니다. 라켓 찾으러 남성고객 유입이 많았으나 높은 스펙을 찾아 구매가 이루어지지 못했고, 아직 초반이라서 더디다고 생각합니다. 차주 지켜봐야 할 것 같습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공 판매가 조금 더딘 한 주 였습니다. 하지만 농구공 찾아서 오는 고객님들이 간간히 있었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 대비 고객 입점 수가 늘었습니다. 여행과 운동을 위해 구매 목적으로 찾아오신 고객이 많았습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 제품들의 판매가 꾸준히 좋습니다. 스피드드라이 제품들도 터치가 많았던 한 주 였고, 조금씩 가을 신상품들 긴팔티셔츠에도 터치가 많아지고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"편하게 입을 운동복을 찾는 테니스 고객님들이 많습니다. 소재에 대한 만족도가 높아서 재구매로 이어지는 경우가 많고, 여름옷 뿐만 아니라 날씨가 풀릴것을 대비해 얇은 긴팔 상품을 찾는 고객분들도 많이 있습니다. 플레이스테이트 제품은 반응이 굉장히 좋습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"드로우스트링 토트백 제품은 고객님들 반응이 좋습니다. 투어백 보시는 분들의 경우 테니스 트렁크 백 제품으로 응대 해드렸을때 기존에 없었던 디자인이다보니 신선함에 고객님 반응이 굉장히 좋았습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬투어, 인트리그 투어, 볼트프로, 리스폰스 프로 제품들 신발 전반적으로 반응이 좋습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"여성 분들보다는 남성분들이 디파이어 라켓에 관심도가 좀 더 높은 편으로 보입니다. 클래시, 울트라, 블레이드에 대한 판매는 꾸준히 있습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"퓨어샷, 에볼루션, 에보넥스트 농구공에 대한 수요는 꾸준히 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"기존에도 외국인 비중은 많지 않았지만, 4~5월 대비 7~8월은 외국인 비중이 눈에띄게 줄어들었습니다. 기존에 오시던 고정 고객님들은 지속적인 방문을 해주시고, 신규 유입도 꾸준히 있습니다."}]},"롯데인천":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 신상라인들 반응이 계속 좋고 무더운날씨 이어져 슈퍼드라이도 반응이 있지만 아무래도 원단 얇아서 비침 부담있으신분들이 퓨어드라이를 꾸준히 찾아주시는것같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"이번신상 들어온 2LTS72 반응이 좋았고, 해당상품 입고로 인하여 조금 주츰했던 2TSK35 레드/핑크 의 터치도 이어져 셋업판매로 이어졌습니다. 싱상품들 입고로인하여 단품으로 나가는 부분도 좋지만 기존에 주춤하던 하의 상품들도 매칭이 더 유연하게 되어 좋았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"드로우스트링 반응이 아직도 계속 좋고, TBC82 같은경우 원단부분에 아쉬움 있으셨지만 디자인과 사이즈 콤펙트하여 반응 올라오고 있습니다. 모자류들 같은경우는 조금 더 지켜봐야할것같습니다. (면원단 디자인들은 딱데일리 고객님들에게만 반응있음)"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬프로 5 와 에어리 위주의 반응이 좋았던것같습니다. 리스폰스프로 터프와 스카이블루는 아직조금더 지켜봐야할것같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 문의가 가장많았고 많이는 아니지만 US오픈 라켓 문의주셧던분들 종종 계셨습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"6호사이즈외에 크게 반응없었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"입객은 전주와 비슷했던 한주였습니다. 다만 테니스고객님들은 꾸준히 방문해주셨지만 테린이고객님들 방문은 조금 줄었습니다. (산리오 미입고매장)"}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"드로우스트링 ivy/wht 여전히 반응 좋은가운데 금주는 lgr컬러도 반응이 늦게나마 올라오는것같습니다. 항상 퓨어드라이 상품들의 반응이 좋음과 동시에 타브랜드들 조금씩 자켓류들 꺼내놓으면서 의류보다는 용품이 더많이 나갔던 것같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 및 반바지류들 신상 입고는 되었지만 온라인 공홈에서 메인으로 착용하고있는 여자 긴팔 아노락/스커트 ( 레드 셋업) 류들이 조금더 빨리 들어왔으면 하는 부분있습니다. 타사 같은경우 대부분 자켓류들 조금씩 볼륨 올리는추세입니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플레이 토트백같은경우 입고 하자마자 반응이 너무좋았고 여성분들이 원하시는 숄더 또는 토트 백 무드이면서 TBO72  처럼 스퀘어 짐백 느낌이 덜하고 원단감 여성분들에게 너무 니즈파악 잘들어간것같습니다. 모자류는 여전히 스트링부분 불편하다고 하시는 분들 많고 디자인, 컬러 전시즌 상품들의 반응이 좀더 좋은것같습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"착화감에는 확실히 만족도가 좋은데에 반하여 시각적으로 디자인컬러감에 있어서는 조금 더 화려하거나 아예 깔끔하거나 한디자인들을 찾으시는것같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 100 / 98 같은경우 바이럴이 해당스팩으로 되어서 인지 체감상 엄청 빠르게 소진된느낌에 반하여 100UL/ L 더디기는하지만 단순하게 100UL/L 로만 봤을떄는 충분히 반응 좋은것같습니다.  더딘부분은 확실히 유튜브등등 인플로언서 바이럴 남자스펙위주로 올라간부분이지않을까싶습니다"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션/퓨어샷 판매위주였습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주와 비슷한 입객 이었던것같고 외국인들이 조금씩 늘어나고있습니다.(크루즈셔틀시범운영)"}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"플리에 토트백 핑크라인 반응이 좋았고, 전주와 같은이유로 짐백느낌이 안나는 무드로 라켓 넣을수있는부분에 메리트를 많이느끼시는것같습니다. 의류는 아직도 퓨어드라이 상품들 위주가 반응이 좋고 간절기때에도 이너웨어로 입을수있는장점때문인것같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"1. 소모품의 특성이 강한 상품들은 베스트상품의 재구매로 이어지지만 대부분 의류같은경우와 가방류들은 신규 상품들의 구매가 압도적으로 많았습니다. 2.대부분 테니스를 치시는분들이고, 테니스브랜드 인지도상 테린이고객님들은 인지도를 보고 구매하시고, 테니스 구력고객님들은 인지도도 한몫하겠지만, 코트에서 타브랜드와 비교하였을때 그라데이션 컬러라던지 라코스테등등 보다 케주얼한 무드가 반응이 좋은것같습니다. 3. 여성고객님들같은경우 짧은기장감이 대부분이었고 공용은커서 여성 L 사이즈들이 많이 있었으면좋겠습니다.(반팔티한정) 4. FW로 넘어가더라도 피스테, 셋업류 자켓정도이고, 여름옷 찾으시는분들은 피로도 문제가 많은것같습니다. 애플라인은 너무 윌슨과 개연성없는 로고플레이가 고객님들의 반응을 못끌어낸것같습니다. 그와동시에 개연성이없더라도 포인트가 아이캐칭이 크게되지않아 메리트 못느끼시는것같고 , 신상 자켓,집업라인들 소매 난해하여 판매로스된부분 상당히 많습니다. 손등이 길게나온부분떄문에"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에토트백은 짐백느낌이 덜하고 라켓넣을수있는공간 명확하여 좋고, 드로우스트링같은경우는 플리에 나오기전에는 반응이 좋았지만 플리에 출시후 조금 주춤한추세인것같습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"뉴욕에디션컬러도 나쁘지않지만 올해같은경우는 파스텔톤 신발들의 반응이 더좋은것같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 반응이 좋지만 아무래도 남자고객님들 300G 이상대 문의가 훨씬더 많았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션, 퓨어셧 판매위주입니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"8월 크루즈 셔틀운행 시범운영으로 외국인들 입객은 확실히 많았고, 내국인고객님들은 휴가 기간으로 인하여 타지역으로 나가신분들이 많았던것같은 한주였습니다. 입객 고객님들 기존 고객님들 위주가 많지만 외국인같은경우는 사람이 바뀌어서 돌아다니시는 분들이 많아졌습니다."}]},"롯데의왕":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주는 정상, 상설 모두 퓨어드라이소재의 판매가 좋았으며 입문자들의 방문도 많아 가격이 저렴한 상설신발과 함께 백팩의 판매도 좋았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"기온이 더워지면서 기능성소재인 퓨어드라이와 스피드드라이 티셔츠가 가장 많은 터치가 이루어졌습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"자점의 경우 넓은크기의 밴드보다는 기본디자인의 밴드를 더 선호하셨으며 모자는 THC83 라이트모션캡이 판매가 좋았습니다. 일상에서도 착장하기 좋은 디자인과 운동시에도 가볍고 관리하기 쉬운 소재의 상품이라 구매가 많았습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"여성컬러로 추가입고 되었지만 여성고객들에게는 따로 어필이 되지 않았습니다. 오히려 여성고객들께서는 SS시즌에 출시된 그라데이션 컬러처럼 여성스러운 컬러감에 더 터치가 많았던것같습니다. 리스폰스프로 1.5터프의 입고는 안되었지만 인조잔디용 테니스화를 찾으시는 고객들이 많이 계십니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"금주는 블레이드의 판매가 많이 되었습니다. 디파이어 입고 문의하시는 여성고객들의 방문이 꾸준히 있었으며 입고시 안내문자 원하시는 고객들도 계셨습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"키즈와 인접해있어 3호볼의 터치가 가장많았고 재입고로 판매도 잘되고있습니다. 따로 특정 판매가 좋은 모델 없이 더운날씨이지만 꾸준하게 판매가 되고있습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"가격저항은 있지만 고객님이 원하시거나 구매를 원하는 상품에서는 가격이 있어도 구매를 하시고 의류는 상설상품 구매를 하시면서 사이즈가 없으면 컬러매치나 세트처럼 코디를 하시며 정상상품과 함께 구매를 하십니다. 신발은 상설상품의 가격이 정상상품보다 확연하게 차이가 있고 금방 닳는 점때문에 상설상품위주로 구매가 이루어지고 있습니다. 의류보다 신발에서 가격저항으로 인해 구매가 안되는 경우가 더 컸습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"평일, 주말 입점객은 전주대비 비슷하였으며 평일은 목적구매자분들의 방문이 많았고 전주 주말은 구매목적이 강한 고객들의 입점이 많았던거에비해 금주는 구매목적보다는 더위를 피하러 입점한 느낌이 많이 들었고 휴가기간이 끝나가면서 점자체 고객이 유입이 빨리 끝났습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주는 여성 사이드셔링 티셔츠가 소량 판매되었고 퓨어드라이 소재의 일상생활에서도 편하게 입을수있는 디자인과 허리끈 포인트로 여성고객님들께서 착장하시고 만족도 좋았습니다 컬러톤이 낮아서 다른의류에 맞춰입기도 편하다고 하셨습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"반팔이나 여름시즌의 상품들의 터치가 아직도 많지만 날씨가 선선해지면서 위에 걸칠만한 얇은 바람막이 상품으로 터치가 조금 넘어왔습니다. 플레이스테이자켓상품은 여성고객들에게 터치가 없었지만 남성고객들은 간혹 터치가 있었지만 시즌이 아직은 이른감이 있고 가격저항이 있는 듯 하였습니다. 플레이스테이트자켓에 세트로 착장 할 수 있는 같은 원단의 플레인한 긴바지가 있다면 가을철에도 같이 세트 연계판매에 도움이 될 것같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에토드백 반응이 좋았지만 구매로 이어지진않았고 최근 출시된 가방종류중 가장 많은 터치가 있었고 컬러톤에 대한 말씀들을 많이 해주셨지만 관리면에서는 많이 어려울거같다고도 생각하시는분들이 조금 계셨습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"이번 테니스화 비쥬얼 교체로 고객들에게 아이캐칭이 되어 터치는 있지만 구매로까지는 이어지지 않았습니다. 상설상품의 가격과도 비교가 많이 되어 저항이 있는듯하지만 고객들에게 눈길을 끄는점이 있습니다. 터프의 입고는 되지 않았으며 볼트프로1.5W 초반 입고되었을때는 고객들의 터치가 있었지만 고객들의 관심이 떨어졌습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"런칭일이 변경되어 신규스펙 런칭일에는 많은분들이 방문하진 않았지만 바로 다음날부터 디파이어라켓을 보러 오시는분들이 점점 많아졌습니다 주변지인들의 실사용피드백을 듣고 오시는분들이 대부분이었고 만족도가 많이 높다고하셨습니다 몇몇분들은 신규스펙 런칭일이 변경된지 모르는분들이 계셔서 의류나 테니스화를 구매하러오셨다가 신규스펙의 디파이어를 구매하시는분도 계셨고 아직 초반이라 조금 더 지켜봐야할거같습니다"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"볼타워 터치는 많았지만 구매로 이어지진않았고 일주일단위 3~4개정도 판매되고있습니다"},{"cat":"상설","topic":"상설 판매 현황","fb":"추가할인에 대한 반응이 좋았습니다 기존 할인금액에서 추가10%는 소비자분들에게 큰 만족도를 줄수있고 연계판매에도 도움이됬으며 지난시즌 아주약간의 금액저항이 있었던  FW상품들도 원활하게 판매되었습니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"이번 여름 폭염이 생각보다 길어져 다소 기복이 많았던거 같습니다 평일에는 더위를 피하려고 입점하시는분들이 대부분이었고 전년대비 입점객은 많이 감소하였습니다"}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"스피드드라이,퓨어드라이 소재의 티셔츠를 많이 보시는편이고 간절기전 얇은자켓안에 입으실 의류를 많이 찾으셨습니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"일반고객보다는 테니스고객 입점이 주이며 기존 윌슨의류를 이용해보셨거나 테니스동호회에서 지인분들의 착장을 보시고 입점하시는 고객들이 대부분이십니다. 신상품을 보시러 오시는 고객들보다는 기존 착용하시는 상품들의 타컬러나 다른 디자인을 보시러 오시는 고객들이 많았으며 가격정항도 이탈원인이지만 여성고객들은 긴기장의 상품들의 부재로 이탈되는 모습을 많이 보았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에토드백의 경우 디자인선호도에서는 좋았지만 아주 약간의 금액저항이 있었으며 이번주는 대체적으로 손목밴드,헤어밴드가 많이 판매되었습니다"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"정상상품보다는 상설상품의 판매가 많고 입문자분들의 구매가 많아 디자인이나 신발의 기능보다는 할인이 많이 들어가 가격이 저렴한 상품 위주로만 보시고 구매하십니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"전주보다 라켓을 보러오시는분들이 조금 줄었고 디파이어 문의는 이전보다는 많지 않았고 블레이드와 비교를 하시는분들이 많았습니다"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"볼타워터치율은 매주 비슷하고 주마다 3~4개정도 판매되고있습니다"},{"cat":"상설","topic":"상설 판매 현황","fb":"최초할인이 들어간 상품에서는 터치는 있지만 금액저항이 있는지 쉽게 구매로 이어지지는 않았지만 추가할인이 들어가면서 구매저항이 줄어든듯보였습니다. 기온이 좀 낮아지긴 했지만 아직은 덥기때문에 쉽게 두께감이 있는 FW 상품들로 터치가 넘어가지 않았고 FW 상품중에서도 얇은 상품 위주로 구매가 이루어지고있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"자점의 경우 4~5월 대비 내국인의 비중은 비슷하지만 외국인의 비중이 줄어들었으며 아울렛이다보니 단골고객이나 똑같은 고객의 입점보다는 신규고객들의 입점이 많습니다."}]},"신세계광주":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"오버핏렐리티셔츠와 드로우스트링백팩 V2 반응이 가장 좋았습니다 드우로스트링 백팩에 경우 입소문을 타면서 테니스 유저들에게 각황받고있는 상품이며 특히나 여성 유저들에게 반응이 좋았습니다 오버핏렐리티셔츠의 경우 시원한 소재감을 찾으시는 고객들과 오버핏스타일을 좋아하는 젊은고객층에서 반응이 좋았습니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"테니스유저들의 방문이 많이 이루어 지지 않아 퍼포먼스보다는 주로 라이프스타일에구매력이 이어졌습니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"신상밴드 컬러에대해 반응이 좋습니다 더군다나 전에 구매후 사용해보셧던 고객님들이 재방문 하셔서 새로운 컬러감에 재구매가 이루어졌습니다 폭염이 계속 이어지고 있어서 가변운 소재를 많이 문의하시고 원하시는 관계로 아직 신상모자의 큰 반응은 없습니다"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"ㅣ"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"간간히 디파이어에 문의가 있었고 테니스 입문후 2~3개월된 유저들은 코치 및 강사의 추천으로 블레이드 를 구매하는 고객이 있었습니다 ^^"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"이번주는 농구공이 판매가 이루어지지 않았습니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"입점은 확실히 줄어든 현상입니다  먼저 너무 더워진 날씨 관계로 테니스유저들의 야외활동이 줄어들엇고 거기에 휴가시즌까지 겹쳐 입점이 현저히 줄어 들었습니다 그리고 새로 출시된 디파이어가 조기 품절로 인해 블레이드만큼 고객들의이슈몰이를 끌고 가지 못한것도 하나의 이유라고 생각합니다"}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"이번주도 퓨어드라이 소재의 제품들이 가장많이 판매 되었습니다 그리고 더위가 잠시 주춤해서 인지 더블메쉬스커트도 판매되었습니다 아침저녁으로는 야외활동할수 있는정도에 기온이여서 테니스유저들의 활동이 늘어나고 있습니다 그리고 정점이였던 휴가기간이 거즘 마무리로 접어들어 앞으로 테니스유저들의 구매활동이 더 활발히 이루어질것이라 생각됩니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"아직까지 가을상품을 찾는 고객은 많지는 않습니다 그러나 타브랜드의 경우 가을상품으로 매자이 구성되어지고 있습니다  현재 늦여름 초가을에 입을수 있는 얇은 긴바지를 많이 문의 하십니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"여성스런 컬러감에 여성고객님들의 시선을 사로잡고 여러가지 용도로 사용할수 있어 반응이 좋습니다 꼭 테니스용품보다는 여러가지 스포츠백이지만 여성미를 표현할수있어서 더욱 반응이 좋은것 같습니다"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상 러쉬투어5, 프로5, 인트리그 투어에 색감에대해서 호응적인 반응이였습니다 1,2개정도가 판매 되었고 인트리그투어는 아직 판매로 이루지지 않았습니다 다만 심플한 화이트 슈즈를 원하는 고객이라면 충분히 어필할수 있는 제품이라 생각되어집니다  리스폰스 와 볼트 소량으로 판매 되었지만 아직 테니스할수 있는 기온과 휴가철이 겹쳐 있어서인지 판매량이 많이 늘지는 않았습니다"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"현재까지의 반응은 여성고객보다는 남성고객의 니즈가 많았습니다 다만 지금 현재 테니스 유저들이 대부분 8월달의 여러가지 이슈로 인해 관심이 덜하다고는 느껴집니다 하지만 날씨가 좋아지고 여러가지 이슈가 마무리되는 8월말 9월달이 되면 확실히 반응은 올라갈것이라 생각되어집니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"이번달 내내 입점은 크게 늘지 않은 상황입니다 고정고객으로 판매 객단가가 높아 유지할수 있었습니다 야외활동 할수있는 날씨가 점점 다가오면서 유입이나 입점도 늘어갈거라 생각합니다"}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"액티브폴로W , 사이드 셔링 티셔츠 , 드로우스트링백팩 V2, 플리에 토드백W 가 가장 핫한 반응이였습니다 전반적인 여성고객들이 지배하였고 무더워진 날씨로인해 테니스목적구매보다는 윌슨브랜드 의류를 입어보시고 재구매로 방문하시는 고객들이 많았습니다 그로인해 라이프스타일에 옷들을 많이 선택하셧고 구매로 이어졌습니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"1.신규유형상품구매가 좀 더 많이 이루어지고 있습니다 2. 보통재방문고객들이 많으시고 실내테니스유저들의 새로운고객들이 유입이 됩니다 재방문고객들은 착용해보고 우수한 소재감과 색감 디자인으로 찾는 경우가 많앗고 새로유입된 테니스유저들은 공간에 어울릴만한 브랜드 인지후 매장방문으로 이어졌습니다 3. 여성고객의 체형과 사이즈가 맞지 않은 상품들이 많아서 눈요기만 하고 가시는 분들이 꽤 있습니다 4. 가을의류라기보다는 여름과 가을 사이 입을수 있는 간절기 제품들에 니즈가 있고 피로도의 문제는 아닌것 같습니다 다만 쇼팬츠로 만 이루어진 구성에 고객들이 많이 아쉬워 했습니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백 이 압도적으로 인기가 많고 여성고객의 니즈파악이 잘된 상품인것 같습니다 올라운드짐백으로 사용 가능하여 국한되지 않은 디자인과 용도 그리고 컬러가 많이 어필된것 같습니다"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"폭발적이지는 않지만 고객의 터치가 늘었고 그로인해 판매량도소폭 상승하였습니다"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"블레이드는 꾸준히 판매가 나 판매가 있고, 기존에 있던 스타일도 지속적으로 판매율이 있습니다.  다만, 기존 스타일중에 사이즈가 깨진 상품군이 있어 신상품으로 안내를 드리면 신상품으로 바로 구매를 하는편입니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"금주에 기본적으로 가방을 많이 구매하고 있습니다. 신상 모자중 캠프캡과 바이저의 판매율이 좀 더 높은편이며, 코튼 볼캡은 주로 운동보다는 일상용으로 구입하시는  고객분들이 있었습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"아직 기존 컬러에 판매가 높은편입니다. 신상 컬러도 터치가 있고, 러쉬 투어와 인트리그 그리고 에어리가 주로 터치율이 높았습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어는 우선 남성분이 훨씬 더 많이 찾고 있습니다. 주로 98프로를 찾았습니다. 여성 고객님의 경우, 컬러가 너무 쨍해서 오히려 다른 라켓을 찾았습니다.  그리고 아직 초반이라 더딘것 같습니다. 다만 주로 디파이어는 사전에 유튜브나 블로그 SNS등 정보를 많이 보신 고객분들에게는 반응이 있었습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션과 사인볼이 금주 판매율이 높았습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 대비 정휴가 끼고, 백화점의 다양한 팝업들(라이엇게임즈, k리그 및 의류 팝업등) 휴가 막바지에 접어들면서  국내 고객 및 외국 고객까지 많은 분들이 백화점에 많이 입점 했습니다. 저희 매장에도 많이 입점하여 의류와 다양한 용품 그리고 라켓을 구매하시고,  외국인 고객분들도 많았지만 내수고객도 많이 늘었습니다. 그리고 사이즈 깨졌던 상품들이 입고가 되면서 판매로스가 많이 없어졌던 한 주 였습니다.  그리고 전년 대비하여 윌슨 매장 위치나 의류 스타일등 많은것들이 공유 되고 고객분들에게 인식이 되면서 많이 늘어난것 같습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주 NTS, LTS, TTS 등 반팔과 TJK등 자켓류 판매가 높았습니다. 아직 더운날씨가 지속되기도 하고 기본티로도 구매를 많이 하는 편입니다. 그리고 점점 가까워지는 가을 날씨를 맞아 자켓류의 터치나 구매도 이뤄지고 있는중입니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"① 기존 베스트 상품 재구매도 있지만 계절이 바뀌면서 신규 유형 상품도 많이 구매하시는 편입니다. 대체적으로 골고루 매장을 전체를 보는 편입니다. ② 주로 테니스 고객층이 높고 일반 운동이나 골프 고객층도 작은 비율로 존재 합니다. 아직은 날씨가 덥긴하지만 운동하기엔 무리되지 않고, 요즘은 실내 체육관도 많이 있어서 윌슨 제품을 많이 구매하는것 같고, 디자인도 20-40에 맞는듯 하여 많은 젊은 층을 찾는것 같습니다. ③ 큰 원인으로는 사이즈가 없거나 컬러가 없거나 사이즈가 많이 깨진 의류 쪽에서 많이 이탈이 발견되며 부족하다 보니 이탈이 높은것 같습니다. 다만 재입고가 될경우, 흐름이 한번 2-3개월이 끊이게 되면 다시 찾는 고객들의 비중도 많이 낮아지는것 같습니다. ④ 지금 계절이 변화 하는 시기이기때문에 s/s,f/w둘 다 찾는것 같습니다 그래도 아직은 s/s비중이 높습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"외국 고객층에게는 드로우 스트링 백팩이 인기가 많고, 구매도 많이 하는 편이며 모자와 양말도 판매가 지속적으로 많이 존재하는 편입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬 프로 혹은 투어와 인트리그를 많이 찾고, 발이 편한 신발을 찾을때는 리스폰스 프로나 글라이드 신발을 많이 찾는 편입니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"이전 쉬프트 처럼 화이트 색상이나 블랙(느와르)를 찾는 고객층이 아직 많이 있습니다.(주로 외국인 고객층) 그래도 기존 라인들은 꾸준하게 판매가 지속 되고 있고 타이거 에디션은 아직 터치감은 많이 없습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션 그리고 퓨어샷을 많이 찾고 구매하는 편이며, 최근 야구공도 터치나 구매가 조금 있었습니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"4-5월 보다는 입점 하는 고객들은 줄어들어 비중은 거의 비슷합니다 더현대 같은 경우 매번 다른 고객분들이 방문을 많이 하는편입니다. 6-8월에도 입점하는 고객들의 추세도 대부분 새로운 고객분들이 많으며 방문한 김에 상품이 다양한것과 (외국인 기준) 환율 대비 상품이 괜찮을 경우 구매를 많이 하는 편입니다. 내국인기준으로는 새로운 고객층도 많지만 동일한 고객분들도 꽤 많이 있습니다. 아무래도 전체적으로 더현대 백화점이 매번 새로운 팝업 혹은 다양한 행사(아이돌, 게임사등) 다양하게 하고있어 매번 백화점에 새로운 고객층들이 많이 입점을 하는것 같습니다."},{"cat":"경쟁사","topic":"타 브랜드 프로모션","fb":"뉴발란스 B2 팝업 행사"}]},"롯데잠실":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"신상품 아이템들 반응이 좋았던거 같습니다. 테니스 고객님들이 새로운 아이템이 나오면 꼭 착용 해보시는데 괜찮은 아이템들이 있으시면 바로 구매로 이루어지는거 같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"전반적인 반응 좋은데 아직 SKU가 적다고 생각하시는거 같습니다. 아예 새로운 아이템 디자인은 많은 관심 보이시는데 새로운컬러로 출시된 상품들은 적당한 반응인거 같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"신상 모자들은 캐주얼 스타일들이 많아서 아직까진 큰 반응 없었습니다. 밴드류들은 수입 품번이였는데 디자인 때문에 터치율 구매율 높았습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트프로 스카이블루가 판매율 좋았지만, 리스폰스 프로1.5 터프는 아직 큰 반응 없습니다. 그래도 옴니코트화를 찾으시는분들이 계셔서 아웃솔을 보여드리면서 설명하면서 판매중입니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"골고루 라켓이 나갔던 한주였습니다. 생각보다 US OPEN 반응이 없어서 아쉽긴했습니다. 블레이드 판매율이 그래도 제일 좋았습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가철로 인해 전년보다 입점객이 줄어든거 같습니다. 작년에 울트라,산리오콜라보로 매장 입점객이 꽤 있던건 전년이였는데 아쉽게 느껴지긴 합니다. 디파이어 예약건 고객님들 연락돌렸고, 시타회때 전 스펙 쳐본 느낌으로 고객님들께 설명드려 판매하도록 하겠습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"플리에 토트백 반응 좋았습니다. 저희 시니어직원이 발레 운동을 하는데, 거기 회원분들께서 많은 구매 해주셨습니다. 핑크 컬러가 인기 많았는데, 너무 겹치실수도 있어서 아이보리도 같이 구매 좋았던거 같습니다. FW 신상품들 전체적으로 판매 좋았고 30,40대 여성분들 입점이 많았던 한주였습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 사이드셔링 아이템 판매 좋았습니다. 기존에 잘나가는 퓨어드라이의 디자인에 옆라인 포인트로 되어 있어서, 만족도 좋은 아이템입니다. 신상품들이 더 터치율,판매율 좋았던거 같습니다. SS아이템들은 사이즈가 전반적으로 없어서 판매할때 어려움이 있는데 신상품들은 재고가 있으니 더 적극 판매하기 좋았습니다. 가을 상품 터치율 많이 늘었습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"모자,양말 선물용으로 구매하시는 고객님들이 꽤 많았습니다. 모자는 꼭 테니스 고객님들만 구매하셨던건 아니고 골프나 다른 운동 즐겨 하시는 분들도 구매로 이루어졌습니다. 니삭스의 판매도 좋았는데 리본 니삭스에 메쉬 부분이 너무 금방 떨어진다는 의견들도 있었습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"아직까지는 신발은 큰 반응 없습니다. 테니스화의 중요성을 많이 설명드리고, 왜 테니스화를 신어야 하는지의 중요성을 말씀드리지만 올코트화로는 충족이 좀 안되시는거 같습니다. 직접 직원들이 테니스화로 경험해보고 경험소비를 해드리고 있습니다만, 테린이분들한테만 판매가 되는거 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"프로 스펙을 찾으시는 고객님들이 훨씬 많고, 가벼운 무게는 아직 반응이 좀 더딘거 같습니다. 그리고 가벼운 무게는 홀세일이랑 같은날 출시를 해서 그쪽으로 더 쏠린거 같습니다. 판매하는데 어려움이 있었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"공동사은도 주말에 진행하지 않았고, 연휴 기간으로 인해 매출 전체적으로 다 감소하고 있습니다. 금요일 역신장 매장들 매장에서 간단한 미팅 하였습니다. 전년도 온라인 매출이 높았어서 남은 하반기 대체할 매출 만들어 달라고 하셨습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"매니저가 소속되어있는 사회인야구팀에서 퓨어드라이 10장 판매되어, 퓨어드라이 에이스 티셔츠 판매율이 제일 좋았습니다. 신상품 여성 라인들도 판매 좋았는데 아직 날씨가 애매해서 반팔,스커트 라인들만 판매 좋았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"아직 날씨가 애매하기도 하고, 좀 더 선선해져야 FW 상품들을 많이 찾을거 같습니다. 주위에 같이 테니스치시는분들과 얘기를 많이 나누는데, 아직 FW 자켓류나 살짝 두꺼운 아이템들은 사기에 애매하다고 하십니다. 그렇다고 반팔류의 아이템을 사기엔 기존에 있는걸로 대체하는 분위기 입니다. FW이 SS보다 매출이 좀 낮기 때문에 3~5개의 아이템들이 입소문으로 판매되면서 자연스레 매장으로 입점되길 바랄 뿐입니다. 플레이스테이트, 빅애플 라인업들 터치율 좋고 반응도 좋은데 구매율은 조금 떨어졌던거 같습니다. 주말에 많이 착용해보시고 가셨습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"모자,양말,아대류들은 꾸준히 판매 좋습니다. 구매하실때 꼭 1개로 끝나지않고 연계판매 하고 있습니다. 이번주는 토트백,짐백류들이 반응 좋았습니다. 백팩이 판매율이 좋지 못했던 한주였습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"테린이분들이 많이 방문하셔서, 볼트프로라인들로 추천 드렸습니다. 테니스화는 여러가지 신어보시면서 본인한테 맞는 스타일을 찾아 나가셔야 한다고 설명합니다. 이유를 명확히 설명 후에 다음에 또 방문할수 있도록 모두 응대 중입니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 98PRO 문의가 많습니다. 10월달 입고 안내 드리고 있습니다. 280g 무게의 수요가 점차 늘어나고 있습니다. 라켓 수주할때 260g 무게보다 280g 무게의 수량을 늘리는게 좋아 보입니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"8월 입점이 몸소 느껴질정도로 입점객이 줄었습니다. 내국인 고객님들이 특히 많이 감소하였습니다. 휴가기간 및 날씨의 영향이 꽤 큰거 같습니다. 9월부터 뭔가 다시 테니스를 시작하는 느낌입니다. 매장에 입점하면서 매출이 발생할때 생각보다 테린이분들 아니면 처음 방문하시는 분들이 더 판매율이 좋은거 같습니다. 자주 오시는 분들도 많은 구매 해주시는데 금액이 생각보다 많이 낮습니다. 새로운 고객님들의 방문이 많아야 매출은 더 오를거 같습니다."}]},"스타필드코엑스":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"남성 고객 비중이 늘어난 만큼 퓨어드라이 랠리 티셔츠 터치 많았습니다. 새로 들어온 신상 반바지의 다양한 컬러로 코디 가능하였습니다. 우먼스쪽에서는 수입라인은 지난주대비 50%이상 터치가 감소하였고, 우먼스쪽에서는 특정 상품의 판매가 좋다기보단 상의 위주로 초이스가 많았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"신상품 전반적으로 여성쪽보단 남성쪽에서 반응이 더 좋스니다. 특히 반바지가 많은 스타일은 아니지만 컬러가 좀더 늘어났다는 이유만으로 많은 터치가 생겼습니다. 여전히 남녀모두 퓨어드라이 소재를 선호하고있습니다. 예전과는 다르게 요즘은 원단을 선택후 컬러를 보는거 같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"밴드류의 터치는 많지 않습니다. 예전만큼 바이저의 반응은 없으나, 캡모자에서는 반응이 나쁘지 않습니다. 테니스 고객의 구매율이 당연 높지만, 라이프스타일로 구매 고객도 늘어났습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"아직까지 큰 반응은 없지만, 볼트 스카이블루는 추후 좋은 반응이 있을거라 예상합니다. 내/외국인 모두 잡을수있을만한 컬러이고 무난하게 가을까지 갈거라 보여집니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"라켓은 블레이드 판매 좋았습니다. 그만큼 남성 고객의 비중이 많았고, 1년이상의 고객들이 많았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"커리,블랙,화이트 판매 좋습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가시즌 영향은 항상 있는 시기인거같습니다. 그렇다고 점포내 유동인구가 줄진 않았습니다. 단 작년과 다른점은 사람들의 초점이 흐려졌습니다. 무더운 날씨와 더불어 매장으로 유입시 지갑은 쉽게 열생각은 하지 않았습니다. 솔직히 작년 울트라, 산리오가 있었다고 하더라도 매출의 엄청난 영향을 줄만큼의 물량은 아니라고 생각합니다. 그리고 의류쪽에서 수입을 많이 할거라고 알고있는데, 원피스 스큐 너무 많습니다. 원피스 줄이고 스커트 브라탑 늘려야합니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"피팅은 수입제품이 많았으나, 사이즈 이슈(원단이 뜬다거나)로 인해 국내 제품으로 스위치하였습니다. 단 기장이 짧은 스타일보다 기본 기장을 많이 선호하였으며, 아직까지는 FW 제품의 터치는 많지 않았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"후드바막을 많이 찾았습니다. 물론 폭발적인 문의가 있는건 아니지만, FW제품 문의중에서 피드백입니다. 맨투맨이나 두께감이 있는 제품은 거의 터치가 없으며 면종류에서는 쭉디, 자켓은 바막정도의 두께가 필요합니다. 당장의 수요가 아니여도 우리가 이런걸 가지고있다라는걸 인지할수있게 해야 합니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"양말 터치는 많이 없었으며, 모자중 바이저는 거의 판매없다고 보여집니다. 캡모자는 기능성 위주로 판매되었으며, 토트백의 반응은 한주만 더 지켜보도록 하겠습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"지난주대비 슈즈 매출은 상승 하였습니다, 특히 내수고객들의 테린이 고객들이 단가가 높았습니다. 라켓부터 시작하여 세트로 구매를 하였습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"라켓 판매 부진했습니다. 찾고 문의하는 라켓은 그들에게 정해져있습니다. 전화 문의는 내수들이 매장 방문은 외국인들이 한정판 라켓을 찾았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공은 커리,에볼루션 판매 잘되고 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주대비 점포 유동인구는 큰 이슈는 없으나 매장으로 유입되는 고객은 감소하였습니다. 단 평일에는 감소하였지만, 주말에는 지난주대비 늘었습니다. 가족다위는 전혀 볼수없었으며, 30대평균 고객들이 많았습니다."}]},"스타필드고양":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"피키 시리즈와 옴브레 더블메쉬 라인 스커트가 메인 반응이 좋았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"컬러감이 화려했던 신상품들 입고가 줄어들면서 최근 이슈화 되는상품은 옴브레 더블메쉬 스커트 라인밖에없습니다. 확실히 신상품 입고에대한 고객반응이 예민하고 신상품또한 예쁘고 화려한 상품들이 큰인기를 끌고있는거같습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"모자와 밴드류 디자인은 예쁘게나왔지만 아직 날씨가 많이 더워서 가을컬러감들의 상품터치감이 많지 않습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"아직까지 스카이블루와 프로 1.5 터프 모델의 반응이 크진 않습니다. 아직까지도 wht/black과 wht/gold 상품의 터치감과 구매율이 더높은편입니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"다음주 출시될 디파이어 라켓 예약구매 고객들과 블레이드 구매고객 클래시까지 종종 판매되고있습니다. 여전히 이슈는 디파이어가 가장 큽니다.\\"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공 판매는 날씨가 뜨거워지면서 점점 줄어들고있는 추세입니다. 이제 날씨가 선선해지면서 점점늘것으로 예상하고있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가철 점포내의 입점고객(스타필드 특성상 먼곳으로 휴가를 가지않는분들은 스타필드로 아이쇼핑 많이옵니다)은늘었으나 매장내로 입점하는 고객이 크게줄었습니다(테니스를 치기에 너무더운날씨가 영향이큽니다) 또한 저년대비 8월 이슈상품 부제가 좀있습니다 (산리오)"}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 사이드 셔링 티셔츠 판매와. 더블메쉬 옴브레 스커트 판매율이 좋았습니다. 셔링티셔츠는 귀여운 기장감과 셔링포인트로 여자분들에게 아이캐칭이 매우좋고 또한 깔끔한 로고플레이로 부담없이 입기 좋은아이템입니다.더믈메쉬 옴브레는 기존에 피로감이있던 더블메쉬 색감을떠나 화사하고 예쁜 새로운컬로도입으로 고객들의 선택을 많이 받는거같습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"아직가지 가을상품은 전혀 터치감이 없습니다. 무더위가 아직 다끝나지 않았고 또한 시기상 가을걸 준비하는 분들에겐 너무더운날씨라서 (테니스 고객들은 10월까지도 반팔입고 테니스합니다.) 플레이 스케이트 자켓또한 아직까진 터치감이 전혀없습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백은 반응이 있는편입니다. 보냉기능 수납함과 넓직한 그외 수납공간 그리고 무엇보다 여자분들이 좋아할만한 디자인이라서 고객들에게 반응이 매우좋습니다. 모자는 아직까진 미비한편입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬투어와 ,인트리그 투어,러쉬프로 상품은 반응이 좀 있는편이지만 볼트프로와 리스폰스 터프 모두 아직 고객들에게 반응이 크진않습니다. (디자인피로감도 한몫하고있음)"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어는 확실히 남자분들 선호도가 매우 높아 남자 런칭전과 여자런칭 전후 모두 비교했을때 전화문의및 매장 방문빈도가 낮은편입니다. 아마 남자 스펙들이 퍼져나가면서 여자분들껏도 고객을 잡아올거같습니다. (남성 스펙 정식입고및 판매가 원활하게 진행된후 반응이 올듯)"},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션,에보넥스트,퓨어샷판 만매가 되고있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 전년대비 유입이 매우 낮습니다. 첫번째로 이슈화가 되는 상품들이 출시가 되지않아 고개들의 방문 횟수가 줄었고 또한 디파이어 신상 남성스펙 부제로 고객들이 찾아와서 구매할만한 포인트요소들이 없는 느낌입니다. 저년에는 헬로키티 콜라보및 그에따른 예쁜신상들 입고로인해 매장 방문목적 및이슈가 있었지만 올해는 그에비해 임팩트가 부족한거같습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"아직까진 판매되는건 피키쇼츠 나 셔링 티셔츠와 같은 여름느낌이 많이나는 상품들입니다. 하지만 고개들이 서서히 가을 상품들 아이캐칭이 많아지고있는 추세긴합니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"여름 상품에대한 피로감이 좀있는 편입니다. 이미 삿던모델들은 피하시고 색감만 바뀐상품들도 좀 피하는 경향이있습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백은 예쁜디자인과 안쪽 넓은 수납공간(라켓보관함이 크고 두자루 수납 및 양쪽 라켓 고정 벨크로)이 가장 큰장점이여서 고객님들이 예쁜 라켓토트백으로 쓰기 좋다고 생각하십니다. 하지만 그에비해 드로우스트링 토트백은 용량도 작고 딱히 디자인에대해서도 크게 좋아하는 편이아니라 플리에에 비해 아이캐칭이 떨어집니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"투어 모델은 과 프로모델은 여전히 테니스화 구매고객들에게 좋은반응이지만 요즘 테니스 화목적구매고객들이 감소하는편이라 크게반응이 없는거처럼 보일수있습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"라켓은 여전히 디파이어가 가장 인기가 많고 문의도 많은편입니다.하지만 출시했던 7월초에비해 줄어가는 편입니다. 그이유는 7월 남성 물량이 너무 소량이라 관심갖던 고객들이 구매로스로 이어져 여성고객들또한 재고가 입고됬지만 선뜻 구매하지 않는 추세입니다. 아무래도 라켓은 남성고객들이 먼저 쓰고 주위에 홍보를해야 동호회 내에서도 여성고객들까지 더욱쉽게 구매할수잇는 경향이있어서 현재 디파이어 여성 라켓 반응이 더저조한거같습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"주력상품인 에보넥스트,에볼루션 ,3호볼,주니어볼이 판매가 좋습니다. (전에있던 트렉커상품도 더필요합니다)"},{"cat":"기타","topic":"고객 입점 동향","fb":"1) 외국인 비중은 여전히 매우 저조한편입니다. 국내고객들은 4~5월대비 많이 줄었습니다. 가을로넘어가는 계절변화가 확실히 고객들에게 민감하고 여름에 샀던 상품들을 더입고싶어하는 심리가 강합니다. 2) 대부분 목적구매고객들은 4~ 5월사이에 많이 구매하셨고 요새는 문의하러 오시는분이나 혹은 실물을보고싶어하는분들위주의 고객입점이 높습니다."}]},"LF광양":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"무더운 날씨가 지속되면서 냉감 기능이 있는 퓨어드라이와 스피드드라이 냉감 티셔츠의 판매율이 높게 나타났으며,  특히 더운 날씨에 시원하고 쾌적하게 착용할 수 있는 기능성 제품에 대한 고객 선호도가 높았습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 재입고 문의가 종종 발생하고 있으며, 재입고 일정에 대해 고객에게 안내하였습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"점내 유동인구는 전주 대비 꾸준한 수준을 유지했으나, 무더운 날씨로 인해 매장 내 소비 목적보다는 더위를 피하기 위해 방문한 고객이 많은 것으로 나타났습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 라인의 판매율이 꾸준히 높게 나타나고 있으며, 냉감 및 쾌적한 착용감에 대한 고객 선호가 지속되고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"현재까지 높은 빈도는 아니지만, 간절기 시즌을 앞두고 긴팔 제품의 터치율이 점차 증가하고 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 대비 유동인구가 감소했습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"점차 기온이 떨어지며 선선해지면서 피스테 터치율이 높게 나타나고 있으며, 긴팔 상품을 찾는 고객도 점차 증가하고 있습니다. 다만 여전히 높은 기온이 지속되고 있어 FW 상품과 SS 상품 모두 구매하기에는 다소 애매한 시기로 보입니다. 이에 따라 점내 유동인구가 감소했으며, 타 브랜드 역시 전반적으로 매출이 하락하는 모습을 보이고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"8월 입점 고객은 현재 기존 고객의 비중이 상당히 높게 나타나고 있습니다. 다만 월말로 갈수록 입문자 및 테린이 고객의 방문 빈도가 점차 높아지고 있어, 가을 FW 시즌에는 신규 고객 유입과 함께 매출 상승을 기대해볼 수 있을 것으로 보입니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"라켓 터치율은 꾸준한 편으로 관심도는 유지되고 있으나, 실제 구매로 이어지는 비율은 낮은 편입니다. 동일한 정상제품이 시내 체육사에서 더 저렴한 가격에 판매되고 있어 가격 경쟁력 측면에서 부담이 있는 것으로 보이며, 이로 인해 라켓 판매율이 저조한 것으로 판단됩니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"24FW보다 25FW 상품에 대한 고객 반응이 비교적 높게 나타나고 있습니다. 특히 할인율이 높은 상품에 대한 반응이 좋으며, 단순히 판매 금액 자체보다는 높은 할인율에 더욱 긍정적으로 반응하는 고객이 많은 것으로 보입니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"현재 외국인 고객의 방문 비중은 거의 없으며, 대부분 내국인 고객으로 구성되고 있습니다. 6~8월에는 기존 고객의 방문 비중이 비교적 높은 편이었으나, 월말로 갈수록 신규 유입 고객도 점차 증가하는 모습을 보이고 있어 향후 신규 고객 유입 및 매출 상승을 기대해볼 수 있을 것으로 보입니다."}]},"커넥트청주":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"신상품 위주로 판매가 잘 일어나고 있습니다.  여성은 랩스커트의 판매율이 높았고  신상 퓨어드라이 셔링티의 터치율도 높았습니다.  남성 라인 역시 플레이스테이트 반팔이 터치율이 굉장히 높고  판매까지 수월하게 일어났습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"신상의류들은 매주 판매율이 높습니다.  전반적으로 고객들의 니즈들을 잘 파악했다고 생각하고  너무 과한 컬러나 디자인도 있지만 도전적이라고 생각을 하고  실제로 고객들도 새로운 느낌을 받고 역시 윌슨이라고 생각 하시는 고객들이  많으며 만족을 하시는 경우가 많습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"밴드는 조금 더 지켜보아야 피드백 전달 가능할 거 같습니다.  모자의 판매는 좋았습니다 현장에서도 의류와 매치하기도 좋고  단품으로도 충분히 이쁜 디자인입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"클레이화의 부재가 있었는데  신상 리스폰스1.5 터프가 부족한 부분을 잘채워줬고  클레이가 아닌 하드코트에서 운동을 하시는 분들도  디자인을 보고 구매욕이 올라오는 고객들도 종종 계셨습니다.  반응 좋습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"블레이드,디파이어에 대해 궁금해 하는 고객들이 많습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션,에보넥스트 위주로 판매가 잘 되었습니다.  농구공은 기복없이 판매가 잘 되고 있습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"가격저항 없습니다. 윌슨에 오시는 고객들은 기본적인 단가를 알고 계시기에  할인이 들어갔다는 명분만 있으시면 구매를 잘하십니다. 특히 현재 단가 자체가  워낙 낮기 때문에 가격이 비싸서 사가지 않는 경우는 거의 없고  항상 봐왔던 제품들이고 스큐 자체가 많이 없기 때문에 정상에 비해  판매량이 더딘 부분은 있으나 신규고객들에게는 계속해서 권해드리며  상설라인도 있다는 것을 어필하고 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"작년 8월은 그랜드오픈 이슈가 있었기에 전년비를 잡지는 못하고 있으나  단골고객 라인을 확실하게 잡아놓았고 여러 테니스레슨장에 방문하여  제휴를 맺어 최대한 브랜드 이탈이 일어나지 않도록  힘 쓰고 있습니다.  점포가 힘든 만큼 현장에서도 가만히 있을 수는 없기 때문에  인스타,블로그,대형레슨장과 제휴 등 현실적으로 할 수 있는 방안을 계속해서  찾고 있기에 타 스포츠브랜드에 비해 역신장률이 크지 않다고 보고있습니다.  충성고객은 점점 늘어날 것이고 길지 않은 시간내에 신장까지도 바라보고 있습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"휴가 가서 테니스를 치는 진성 고객님들이  브라탑을 보는 경우가 많은 주였습니다. 다음으로는 역시 퓨어드라이가  메인으로 판매가 되었고 신상품라인들도 터치나 반응이 좋았습니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"플레이 스테이트 자켓 아직 반응은 없습니다.  아직 계절감이 이르기도 하고 디자인이 이색적이거나  포인트가 있다면 판매가 조금씩 될 수도 있지만  굉장히 스탠다드적인 제품이기에 기온이 내려가고  필요로 인해 구매가 이루어질 것으로 보여집니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백,니삭스,모자 의류에 비해 용품의 판매는 더뎠습니다.  금주는 트래픽도 워낙 낮았기 때문에 조금 더 지켜보아야 할 것 같습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상 수입화 반응 좋습니다.  여성 남성 커플로 신기에도 좋고 컬러감 자체가  윌슨을 좋아하시면 누구나 좋아할만한 흰+빨 조합이기 때문에  추후에도 판매량이 올라갈 것으로 보여집니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"남성고객들은 궁금한 라켓이 있다면 시원시원하게 구매하는 경향이 있다면 여성 고객들은 비교적 소극적이고  비교를 하며 신중하게 구매를 하는 타입이기 때문에  디파이어 자체가 바이럴이 충분이 된 후 판매량이 올라갈 것으로 보여집니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"트래픽이 낮아진 만큼 농구공의 판매율이 내려갔습니다.  트래픽이 낮은 거에 비해 야구글러브를 찾는 고객들이 많았습니다"},{"cat":"상설","topic":"상설 판매 현황","fb":"25fw 추가세일 반응 좋았습니다.  작년 NJK71은 큰 반응 없이 판매가 더뎠던 제품이였는데  테니스인들에게 정가를 주고 구매할 큰 메리트가 없는  베이직한 제품 이였지만  올해 60%할인율로 바뀐 뒤에는 베이직함이 오히려 장점으로  작용하여 호불호 없이 터치가 일어나고 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"트래픽이 굉장히 저조해지고 있습니다.  휴가철이기도 하고 3,40대 주요 고객층이  타점포로 이탈이 많이 된 것으로 보여지며  무신사스탠다드,HDEX와  같은 20대 젊은 연령대가 선호하는  브랜드를 제외하고는 전체적으로 힘든 상황입니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 메인으로 판매 되었는데 신상품 플레이 스테이트, 파인코튼 라인 판매량이 높았습니다. 현재 3분기 신상품들 대부분 반응이 좋으며 구매율도 굉장히 뛰어납니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"기존 베스트 상품 재구매보다는 신규 유형 상품의 구매율이 높으며 더위가 조금씩 풀리며 야외테니스를 다시 시작하려는 고객들이 많았습니다. 미구매고객들의 이탈 원인은 소비여력 부족 또는, 디자인이나 컬러감에서 부담감을 느끼시는 경우입니다 피로도의 문제가 더욱 큰 것으로 보고 있습니다. 하지만 입추가 지났다는 명분 하에 구매를 하시고 현장에서도 같은이유로 적극적으로 권해드리고 있습니다"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백이 반응 정말 좋습니다. 목적구매보다는 충동구매 대다수인 것으로 보아 디자인에 혹해서 구매를 하십니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"러쉬,인트리그 라인 모두 판매율이 높으며 윌슨 고객들은 역시 레드를 호불호 없이 좋아하십니다. 특히 인트리그투어 레드가 두각을 드러내고 있으며 사이즈가 없어 완불까지 자주 이루어지고 있습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"테린이 고객들의 방문이 늘었으며 라켓과 가방까지 수월하게 판매가 되었습니다. 클래시의 판매가 가장 판매율이 높았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"주기적으로 판매가 되고 중고등학생들이 구경만 하고 갈 때도 많지만 재방문을 해서 용돈을 받고 구매를 하는 경우가 정말 많습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"미끼상품으로 고객에게 접근하기가 정말 좋습니다. 많은 유닛을 타겟으로 추가할인을 적용하는 것보다는 신상품 입고와 같이 조금씩 라인을 나누어서 추가세일을 하는 것이 고객들에게도 새롭고 재방문고객들에게 판매율이 올라갈 것으로 생각됩니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"내국인 100%입니다 4,5월 대비 현재로서는 이제 여름이 막 끝나가는 추세이기 때문에 소비욕구가 2월말정도로 보여지기에 기온이 조금 더 내려가면 고객들의 신상의류를 구매하러 트래픽이 올라갈 것 같습니다. 3~5월이 신규 고객이 늘어나는 시기이며 6~8월은 조금 더 욕심이 있는 단골고객들의 비중이 높은 시기입니다."}]},"스타필드하남":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"휴가 기간으로 점포에 입점하는 일반(가족단위)고객의 비중이 높습니다. 기존에 테니스 고객에게 인기가 많았던 드로우 스트링 백팩이 보온보냉원단과 가벼우면서 수납이 용이하다는 부분에서 어필되어 일반 고객들의 구매도 많이 이루어졌습니다. (기존 테니스 고객 100% / 금주 일반고객 60% 테니스고객 40%)"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 에이스 글로우 티셔츠 W의 인기가 좋았습니다. 기장감도 길고 너무 붙지 않는 스타일로, 시원하고 편하게 입을 수 있다는 점에 일반 여성 고객들에게 선호도가 높았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"연휴기간동안 모자 반응이 저조했습니다. 신상 모자의 디자인, 컬러감과 소재가 데일리용에 적합해서  일반 고객들에게 터치가 있었지만, 테니스무드가 강한 디자인 때문에  구매를 망설이는 경우가 많았습니다. 반면 테니스 고객들은 모자의 통기성과  가벼움을 중요시하는 경우가 많아 아직까지는 라이트 모션 캡과 같은  시원한 우븐 원단 제품들을 선호합니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트 프로 1.5 스카이블루에 비해 기존 화이트블루나 화이트그린이 인기가 좋습니다. 예상보다 스카이블루의 터치는 없는 편 입니다.  리스폰스 프로 1.5 터프도 아직 구매율이 높지 않지만,  터치는 많아서 추후 테니스고객의 입점이 많아지면 옴니코트 및 클레이화를 찾는 고객들에게  어필하기 좋을 것 같습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"테니스 고객 대비 일반 고객의 입점이 증가하면서 라켓의 판매율이 급격히 떨어졌습니다. 디파이어의 재입고 문의는 여전히 많습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공과 글러브는 꾸준히 터치가 많습니다. 연휴동안 가족단위로 방문하는 고객들이 선물용으로 구매하는 경우가 많아졌습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"본격적인 휴가시즌이 시작되면서 점포에 입점하는 고객의 수는 늘었지만 브랜드 입점 고객수는 반대로 줄었습니다. 폭염이 지속되면서 테니스 고객들도 코트에 나가기 꺼려하는 분위기이며, 그로인해 매장으로 입점이 많이 낮아진 것 같습니다. 점포에 입점하는 많은 고객들중에 쇼핑백을 들고다니는 고객의 비중이 30%이내로 소비를 하기위해 입점하는 느낌이아니라 피서를 즐기기위해 가족단위로 방문하는 느낌이 큽니다. 소비에 굉장히 소극적인 분위기 입니다.  전년에는 하남점의 오픈 시기여서 브랜드 입점이 엄청 많았습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주 판매 베스트상품은 '퓨어드라이 사이드 셔링 티셔츠 W'와  '커브라인 트랙 스커트 W' 셋업 입니다.  셔링 티셔츠의 기장감이 긴 편이라는 점에 대한 반응이 좋았으며, 사이드 쪽 셔링 디테일 포인트 덕분에  옆 라인을 조절해서 입을 수 있다는 점에 만족도가 높았던 제품입니다.  '커브라인 트랙 스커트'와 같이 매치하면 스포츠 캐주얼 느낌으로,  테니스 고객뿐만 아닌 일반 고객에게도 선호도가 높았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"이번 FW 상품들 중 '플레이스테이트 크루' 하프집이  터치가 많은 편 입니다. 일교차가 심한 초가을인 현재 날씨에 편리하게 입고 벗을 수 있게 풀집업으로 나왔으면 좋았을 것 같다는 반응이 있었으나, 디자인이 예쁘다는 피드백이 많아 날씨가 선선해지고 난 이후에는 플레이스테이트  하프집과 맨투맨 스타일의 반응이 더 올라갈 것 같습니다.  타브랜드 대비 가을 시즌의 후드 풀집업 스타일이  많지 않은 것 같습니다. 남녀노소 늘 많이 찾는 스타일로, 다양한 후드 풀집업이 출시된다면 반응이 좋을 것으로 예상됩니다.  전주부터 날씨가 선선해지면서 긴팔의 터치가 증가했습니다. 특히 팔 탈부착 아노락과 피스테의 반응이 가장 좋았습니다. 요즘 같은 일교차가 큰 날씨에 반팔과 긴팔 둘 다 활용할 수 있다는 점이 가장 크게 어필이 되었습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"신상 플리에 토트백 W의 디자인과 컬러가  예쁘다는 반응이 많습니다.  활용도를 고려했을 때 결국 구매는 드로우스트링 백팩으로  이루어지는 경우가 많았지만, 디자인의 반응이 좋아서 추후의 반응이 기대되는 상황입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상 수입화의 터치가 많은 편 입니다. 레드 포인트 컬러가 예쁘다는 반응이 많으며,  특히 러쉬투어와 인트리그 투어의 반응이 좋습니다. 연휴 기간동안 테니스 입점객이 줄어  아직 판매율이 높은 상황은 아니지만, 이후에 테니스 고객들에게 반응이 좋을 것으로 예상됩니다.  볼트프로 1.5 W의 컬러에 대한 긍정적인 피드백이 많았지만,  아직까진 기존 WED, WGN 색상과 같은  포인트 컬러가 있는 제품들의 터치가 더 많습니다.   클레이와 옴니코트 전용화를 찾는 테니스 고객들이 많았었기 때문에, 리스폰스 프로 1.5 터프도 추후에 테니스 고객의 입점이 증가 후  어필하면 반응이 좋을 것으로 예상됩니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어의 여성 스펙이 남성 스펙에 비해 판매가 많이 되었습니다. 디파이어 남성 스펙 출시 때 낮은 무게를 문의하는  여성고객들에게 사전예약을 받았으며, 하남스타즈 선수분들의 사전예약도 많았기에  이번 여성 스펙의 판매가 빨리 이루어졌습니다. 입점 고객들에게도 디파이어의 장점들이 잘 어필이 되어  이번 여성 스펙 출시의 반응이 더 좋았습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"연휴기간동안 글러브와 농구공의 판매가 증가했습니다.  가족단위로 방문하는 분들에게 인기가 좋으며,  선물용으로 구매하는 분들도 많아졌습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"ㄱ"},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 대비 고객 입점이 많이 떨어졌습니다.  연휴 시즌이 되면서 쇼핑몰 입점에 비해  매장 입점이 전체적으로 많이 줄었으며, 금주는 쇼핑몰 입점도 전주에 비해 많이 줄었습니다. 가족단위로 방문하는 고객들은 소비가 목적이 아닌,  더위를 피하기 위해 방문하는 느낌이 강합니다. 테니스 고객의 입점이 감소한것은 더위의 영향이 큰 것 같습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"금주 판매베스트는 '퓨어드라이 사이드셔링 티셔츠 W' 입니다. 셔링을 조절해서 체형마다, 또는 하의 스타일에 따라 맞춰서 입을 수 있다는 점 때문에 다양한 체형의 고객들에게 모두 만족도가 높았습니다. 초가을인 현재 더울땐 단독으로 편하게 입는 용도로, 시원할땐 바람막이 안에 레이어드 하는 용도로도 인기가 좋은 아이템 입니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"연휴 기간동에는 가족단위의 방문고객이 많았던 반면, 연휴가 끝난 시점부터는 테니스 고객의 입점이 증가했습니다. '퓨어드라이 에이스 티셔츠'와 같은 기존 퓨어드라이 라인은 꾸준히 인기가 많지만, '사이드 플리츠 스커트' 또는 '플레이 스테이트' 아노락과 같은 신상 의류의 반응이 더 좋은 편 입니다. 구매하는 고객들은 대부분 테니스 고객들이며, 가을을 대비하는 용도로, 또는 스타필드하남점 인스타 피드 및 스토리에 올리는 신상 사진으로 유입되어 구매하는 경우가 많습니다. 고객들의 미구매 이탈은 찾는 사이즈가 품절인 경우에 가장 많이 발생합니다. 대부분 매장의 입점객들은 방문한 김에 매장에 있는 상품으로 바로 구매를 원하는 경우가 많아, 주문으로 안내드리면 이탈로 이어지는 경우가 많습니다. 전주에 비해 오전/야간 서늘한 날씨로 인해 W/B 탈부착(하이브리드) 긴팔 종류를 찾는 분들이 많아졌지만, 낮에는 더운 날씨가 이어져 아직까지는 S/S 상품들이 더 많이 판매되고 있습니다. 플레이스테이트 아노락의 터치가 많은 편 입니다. 컬러감에 대한 반응도 좋으며 백 부분에 통풍을 위해 추가된 메쉬 디자인이 기능적인 부분 뿐만 아니라 디자인적으로도 예쁘다는 반응이 많습니다. 플레이스테이트 중에 긴팔류의 터치는 있었으나 아직까지는 더운 날씨로 구매까지 이어지지는 않았습니다. 디자인이나 디테일에 대한 만족도는 높았습니다. 빅애플 라인업에선 여성, 그리고 남성 파인코튼 티셔츠의 터치가 있는 편 입니다. 특히 남성 '빅애플 파인코튼 티셔츠'의 터치가 많지만 아직까진 기존 '퓨어드라이 에이스 티셔츠'의 인기가 더 좋습니다. 빅애플 라인업의 디자인이 예쁘다는 피드백이 많아 앞으로의 반응이 기대되는 상황입니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백W의 터치가 많습니다. 여유있는 수납공간과 경량성이 어필이 되어 테니스 고객 뿐만 아니라 일반 고객에게도 반응이 좋습니다. 드로우스트링 토트백은 여성분들에게 터치가 많지만 수납공간과 디자인을 비교해보았을 때 플리에 토트백의 캐주얼한 디자인과 넓은 수납력의 활용도를 고려해 구매는 플리에 토트백으로 이어지는 경우가 많습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상 러쉬 투어랑 인트리그 투어의 터치는 꾸준히 있습니다. 전주는 판매가 되었지만 이번주는 볼트프로와 에어리의 반응이 더 좋았습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 100UL, 100L의 반응이 여전히 좋으며, 남성스펙 문의가 많은 상황입니다. US OPEN 라켓의 반응이 올라오고 있습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"농구공 야구공의 판매가 많이 되었습니다. 농구화를 찾으시거나 야구 배트 및 기타 용품의 문의가 있었습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"ㄱ"},{"cat":"기타","topic":"고객 입점 동향","fb":"내국인의 비중은 4~5월 대비 낮아졌습니다. 외국인의 비중은 비슷합니다. 입점하는 고객들의 추세는 전주보다 금주의 테니스 고객의 입점은 조금 늘었으나, 6~8월 전체적으로는 이전(전년포함)보다 현저히 낮아졌습니다. 일반 고객의 입점은 이전과 동일합니다."}]},"현대대전":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"신발(할인율이 높아져서 2개씩 구매하시는 고객님이 늘었음)"},{"cat":"기타","topic":"고객 입점 동향","fb":"전주대비 입점고객 절반이상 감소했습니다 휴가기간이라서그런건지 타지역고객님은 없고 지역고객님들만 나들이식으로 점포입점객수는있는데 하물며 요즘 1층에서 동선까지 행사를 깔고있어서 행사하는 매장으로 고객이 몰리고있습니다"}],"8월2W":[{"cat":"상설","topic":"상설 판매 현황","fb":"추가할인으로 기존고객님들 추가구매유도하고있지만 곳곳에 행사장으로인해 매장입점객수가 현저히 떨어짐"},{"cat":"기타","topic":"고객 입점 동향","fb":"입점고객감소 타지역고객유입감소"}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"여성의류 셋업류, 바람막이 여성신발 (여성고객유입늘어남_"},{"cat":"상설","topic":"상설 판매 현황","fb":"추가할인금액을 보고 터치도 좀있고 구매에도 이어지는 것 같습니다 다만 악성재고관련 추가할인보단 균일가 판매가 이루어졌으면 좋겠습니다"},{"cat":"기타","topic":"고객 입점 동향","fb":"외국은 비중은 거의 없었고 8월들어서3~4월 오셨던 고객님들의 재방문이 늘어나고 신규고객님이 줄어들었습니다"},{"cat":"경쟁사","topic":"타 브랜드 프로모션","fb":"일부매장 행사진행, 일부매장 구매수량에따른 추가할인진행중"}]},"현대무역":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"이번주 판매 베스트는 메리미 브라탑 세트와 드로우스트링 백팩이 꾸준히 판매가 잘되는 편."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"US오픈 라켓 판매가 있고, 시어아이스 라인 판매가 아직도 꾸준히 되는 편이라 아직까지 S/S상품이 주로 판매가 된다고 볼 수 있다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"신상 모자 스윙라이트 바이저나 볼캡 등 모자는 셋트 판매가 아니어도 계속 되는 편"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신발은 시즌반품으로 인해 너무 많은 상품으로 반품이 진행되다 보니 DP된 상품 자체가 별로 없어서 사실 신발판매가 이번주는 어려움이 많았음..."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"판매할 수 있는 라켓의 재고가 사실상 많지 않았지만 그래도 US 오픈 라켓이 받쳐줘서 그나마 이번주 라켓 판매를 할 수 있었다...."},{"cat":"기타","topic":"고객 입점 동향","fb":"입점 고객은 오히려 전주보다 늘어났다고 볼 수 있지만, 실구매 고객은 늘어나지 않았고.... 사진을 찍거나 구매로 이어지지 않는 고객이 너무 많아 힘든 한주 였다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"이번주 라켓 판매가 많이 되었고, 한정판 라켓 엔코드가 초반판매량이 좋은 편이라 기대감이 높다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"바람막이자켓이나 아우터가 아직 부족한 상황, 스웻셔츠들도 더 빨리 입고가 되어도 판매가 될거라고 본다. 지금 입고된 아우터들은 아직까지는 터치가 적지만 종류가 다양해지면 그만큼 관심도 생기는 법...시각적으로 가을옷이 많이 보이면 가을옷을 사야된다는 생각이 생기기때문에!"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"모자,양말, 가방들은 대체적으로 판매가 잘되고 목적구매로 유입도 많은 편!"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"지금 입고된 상품들은 리스폰스 빼고는 판매가 나쁘지 않은 편이나, 입고된 스타일 자체가 적어서 신발의 다양성이 부족해보인다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"아무래도 여성고객의 반응이 좀 없다고 보는게 맞을 것 같다. 문의가 거의 없었고...남자 라켓때는 반응이 좋았다..."},{"cat":"기타","topic":"고객 입점 동향","fb":"이번주는 외국인 고객 유입이 많았다. 어떤 날은 한국말을 하지 못하는 날이 있을정도로....중국이나, 인도네시아 쪽 고객의 유입이 많았던 한주이다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이 사이드셔링 티셔츠가 판매베스트이고, 대체적으로 발레코어룩에 가까운 여성스러운 느낌의 아이템들이 판매가 잘되는 편이다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"기존고객들이 주요 고객층이며 신규고객들은 대부분 외국인이다.현재는 여름성이 강한 상품들보다는 신상품들에 터치가 많은 편이지만 시즌이 바뀌어가는 시기라 의류구매 자체를 꺼려하는 느낌이다. 플레이스테이트 자켓은 아직 반응이 많지는 않고 빅애플 티셔츠는 .... 터치 자체가 적은 편이다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백 판매가 아주 잘되는 편!!!!"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"신상 수입화보다는 기존의 볼트라인을 위주로 판매가 되는 편이고, 수입화보다는 내수를 선호하는 편이다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"남성스펙의 디파이어보다 여성스펙의 디파이어가 문의가 적은 편이며, 현재는 기존에 있던 라켓들이 주로 판매가 되는 편이다. 클래스 us오픈이나, 블레이드"},{"cat":"기타","topic":"고객 입점 동향","fb":"신규고객 5 : 기존고객 5 의 비율로 비율은 비슷한 편이며, 신규고객은 외국인이 주를 이룬다."}]},"나인원한남":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"올어라운드 짐백 m사이즈와 드로우 스트링 백팩 v2가 많이 팔렸습니다 이번주는 선물용으로 구매하시는 고객님이 많으셨는데 옷보다는 사이즈 우려가 적고 전체적인 색감과 디자인이 예쁘고 컴팩트하면서 실용적이라고 많이 선호하셨습니다. 코트라인 크루삭스도 함께 많이 구매하셨습니다 컬러감이 예쁘고 부담 없이 함께 선물하기 좋다는 이유였습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"더블메쉬 옴브레 스커트와 피키쇼츠가 가장 반응이 좋았습니다 피키쇼츠와 함께 피키폴로 셔츠도 함께 많이 찾으셨고 더블 메쉬 옴브레 스커트와 함께 매치 할 스튜디오 티 라벤더컬러와 스피드드라이티 라임 컬러도 함께 많이 보셧습니다. 신상 퓨어 드라이 사이드셔링 티 같은 경우 터치감은 없지 않았지만 조금 더 지켜봐야 할 것 같습니다. 자가드 티와 소호 티셔츠도 남성분들이 소재가 좋아 많이 입어보셨습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"모자 디자인이나 컬러감이 예뻐 터치감이 많았습니다 다만 날씨가 아직은 더워서 바이저나 상대적으로 가
