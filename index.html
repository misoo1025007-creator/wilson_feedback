5d0\uc774\uc2a4 \uae00\ub85c\uc6b0 \ud2f0\uc154\uce20 \uac00\uc7a5 \ubc18\uc751 \uc88b\uc558\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc7ac\uad6c\ub9e4 \uace0\uac1d \uae09\uc99d'."},{"tag":"\ubca0\uc2a4\ud2b8","text":"\uc5ec\uc131: **\ud558\ud37c\ud06c\ub86d+\ub808\uc774\uc5b4\ub4dc\uc2a4\ud3ec\uce20\uc1fc\uce20 \uc14b\uc5c5** \ubc18\uc751 \uc88b\uc74c (\ub86f\ub370\ubd80\uc0b0\u00b7\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0). **\ubbf8\ub4dc\ud0c0\uc6b4\uc2a4\ucee4\ud2b8** \ud130\uce58 \u591a \u2014 '\uc9e7\uc740 \uae30\uc7a5 \ud53c\ud558\ub294 \uacbd\ud5a5' (AK\uc6d0\uc8fc\u00b7\ub86f\ub370\ubd80\uc0b0). \uc6a9\ud488: **\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2 WHT/IVY/PNK**, **\uae00\ub85c\uc6b0 \ubc14\uc774\uc800** \ud310\ub9e4 \uac15\uc138 (\ub86f\ub370\uc7a0\uc2e4\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8)."},{"tag":"\ud2b9\uc774","text":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ud14c\ud06c \ud06c\ub8e8 \ud2f0\uc154\uce20\u00b7\ubc18\ubc14\uc9c0 \uc138\ud2b8 \uc678\uad6d\uc778 \uc911\uc2ec \ud310\ub9e4 \uae09\uc99d'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ub77c\ubca4\ub354 \uace0\uac1d\uc5d0\uac8c TBO73 \ub77c\ubca4\ub354 \uc5f0\uacc4 \ud310\ub9e4 \uc131\uacf5, \ub4c0\uc624\ud50c\ub9bd\ubc31\ud329\uae4c\uc9c0 \ub450 \uac1c\uc529 \uad6c\ub9e4'. \ub86f\ub370\uc7a0\uc2e4 '\uc2e0\uc0c1 \uc6a9\ud488 \ud310\ub9e4 \uc88b\uc558\uc74c, \uceec\ub7ec\ud480 \uc190\ubaa9\ubc34\ub4dc \ubc18\uc751 \uc88b\uc74c'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \uc2e0\uaddc \uceec\ub7ec(\ubbfc\ud2b8\u00b7\ub77c\ubca4\ub354) \uc785\uace0** \u2014 \uc5ec\uc131 \ubc18\uc751 \uae0d\uc815\uc801, \uad6c\ub9e4 \uc804\ud658\uc740 \uc9c0\ucf1c\ubd10\uc57c. \ud83d\udcc8 **\ubc14\uc774\uc800 SKU \ub2e4\uc591\ud654** \u2014 \ucc29\uc6a9 \ud6c4 \uad6c\ub9e4\uc728 \ub192\uc74c, \ud130\uce58\uc728 \uc0c1\uc2b9. \ud83d\udcc9 **\uc81c\ud5cc\uc808 \uc5f0\ud734+\ud734\uac00\ucca0+\uc7a5\ub9c8 \ubcf5\ud569**\uc73c\ub85c \uc785\uc810 \ud63c\uc7ac \u2014 \uc77c\ubd80 \ub9e4\uc7a5 \uc99d\uac00, \uc804\ubc18 \ubaa9\uc801\uad6c\ub9e4 \uac10\uc18c. \ud83d\udcc9 **\ub514\ud30c\uc774\uc5b4 \uc7ac\uace0 \ub300\ubd80\ubd84 \uc18c\uc9c4** \u2014 \uc7ac\uc785\uace0 \ub300\uae30 \ubb38\uc758\uac00 \ud310\ub9e4\ub97c \ub300\uccb4\ud558\ub294 \uc0c1\ud669."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac \uc7ac\uad6c\ub9e4\uc728 \ub192\uc74c \u2014 \ub86f\ub370\uc778\ucc9c '\uc5d0\uc2ac\ub808\uc800 \uacb8\uc6a9\uc73c\ub85c \uc6b4\ub3d9 \ud6c4 \uadf8\ub300\ub85c \uadc0\uac00\ud558\ub294 \uace0\uac1d \uc99d\uac00'. \uc2e0\uc138\uacc4\ub300\uc804 '\ucc29\uc7a5 \uc2dc \ube44\uce68\u00b7\ubab8\ub9e4 \ubd80\uac01 \uc801\uace0 \uc6d0\ub2e8 \ub9cc\uc871\ub3c4 \ub192\uc74c, \uc6b4\ub3d9+\uc77c\uc0c1 \uacb8\uc6a9\uc774 \uac00\uc7a5 \ud070 \uc7a5\uc810'. \ud551\ud06c \uadf8\ub77c\ub370\uc774\uc158\u00b7\uc5d0\uc774\uc2a4 \ub77c\uc778 \ubc18\uc751 \uc88b\uc74c."},{"tag":"\uc774\uc288","text":"**\ube14\ub799 \uceec\ub7ec \ubd80\uc7ac \uc544\uc26c\uc6c0** (\ud604\ub300\uc911\ub3d9\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8\u00b7\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0) \u2014 '\uc5ec\uc131 \uc758\ub958 \ube14\ub799 \ubcc4\ub85c \uc5c6\uc5b4 \uc544\uc26c\uc6c0', '\ubb34\ucc44\uc0c9 \uc14b\uc5c5 \ub9e4\uce58 \uc0c1\ud488 \ubd80\uc871'. **\ucee4\ud50c \ub9e4\uce6d \uc544\uc774\ud15c \ubd80\uc871** (\ud604\ub300\ud310\uad50\u00b7\ub86f\ub370\uc7a0\uc2e4) \u2014 '\ud568\uaed8 \uc785\uc744 \ube44\uc2b7\ud55c \uacb0\uc758 \uc81c\ud488 \uc5c6\uc5b4 \uc544\uc26c\uc6c0'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub354\ud604\ub300\uc11c\uc6b8 \uc0ac\uc774\uc988 \uc804\ubc18 \uae68\uc9d0 \u2014 DP \ud310\ub9e4 \u591a, \ud310\ub9e4 \ub85c\uc2a4 \ud07c** \u2014 '\uc2e0\uc0c1 \uc785\uace0\ub97c \uc880 \ub354 \ub2f9\uaca8\uc57c \ud560 \uac83 \uac19\uc74c' \u2192 \uc785\uace0 \uc77c\uc815 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \uc2dc\uc5b4\uc544\uc774\uc2a4 \uc2a4\ucee4\ud2b8/\ubc14\uc9c0 \ud5c8\ub9ac\u00b7\uace8\ubc18 \ud54f \uc774\uc288** \u2014 '\ucc29\uc6a9 \uc2dc \uc606\uc73c\ub85c \ud280\uc5b4\ub098\uc624\ub294 \ud604\uc0c1, \ud310\ub9e4 \uc800\uc870' \u2192 \uc18c\uc7ac\u00b7\ud328\ud134 \uac80\ud1a0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \uc5ec\uc131 \uc2a4\ucee4\ud2b8 \uc18d\ubc14\uc9c0 \uc6d0\ub2e8 \ub108\ubb34 \ub450\uaebc\uc6cc** \u2014 '\ucc29\uc7a5 \uc2dc \ub365\uace0 \ub2f5\ub2f5\ud558\ub2e4\ub294 \ud53c\ub4dc\ubc31 \u591a' \u2192 \uc6d0\ub2e8 \uac1c\uc120 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '\ud551\ud06c \uceec\ub7ec\u00b7\ube0c\ub77c\ud0d1 \uc704\uc8fc \uc804\uac1c\ub85c \uad8c\ud574\ub4dc\ub9b4 \uc218 \uc788\ub294 \ub77c\uc778\uc774 \ud4e8\uc5b4\ub4dc\ub77c\uc774\ubfd0, \ucd94\ucc9c \ud3ed \ub108\ubb34 \uc881\uc74c'. \uc2e0\uc138\uacc4\ub300\uc804 '\ub0a8\uc131 \ub77c\uc6b4\ub4dc \ud2f0\uc154\uce20 \uc885\ub958 \uc911\ubcf5 \u591a, \uc5ec\uc131 \ubc18\uc9d1\uc5c5 \uc544\ub178\ub77d \uac19\uc740 \ucee4\ud50c \uacb8\uc6a9 \uc544\uc774\ud15c \ubd80\uc871'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc2dc\uc5b4\uc544\uc774\uc2a4 \uce74\ub77c\ud2f0 \ub2e4\uc591\ud55c \uceec\ub7ec \uc694\uccad, \ub0b4\ub144 \uc7ac\ucd9c\uc2dc \uac80\ud1a0 \ud544\uc694'."},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uac15\ub0a8: '\ub9ac\uc870\ud2b8\ub8e9\u00b7\ud734\uac00\ub8e9\uc5d0 \ud14c\ub2c8\uc2a4 \ubb34\ub4dc \uc811\ubaa9\ud55c \uc0c1\ud488 \uae30\ud68d \ud544\uc694, \uc5ec\uc131 \uae34\ubc14\uc9c0 \ub0b4\ub144 2\uc885 \ucd94\uac00 \ud544\uc694'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4: '\ube0c\ub77c\ud0d1 \uc120\ud638 \uace0\uac1d \uc99d\uac00 \u2014 \uc218\uc785 \uc81c\ud488 \uc704\uc8fc \ud130\uce58'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80: '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5f0\uacc4 \ubc18\ubc14\uc9c0 \uae30\uc7a5 \ub108\ubb34 \uc9e7\uac70\ub098 \uceec\ub7ec \ud654\ub824\ud574 \uad6c\ub9e4 \uc5f0\uacb0 \uc5b4\ub824\uc6c0, \ube14\ub799\u00b7\ud654\uc774\ud2b8 \uc2a4\ucee4\ud2b8 \ucd94\uac00 \ud544\uc694'."},{"tag":"\uc548\ub0b4\ud544\uc694","text":"\ud83d\udccc \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758 \u2192 FW \uc2e0\uc0c1 S\u00b7M \uc0ac\uc774\uc988 \ud655\ub300 \uc608\uc815 \uc548\ub0b4"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \uc2e0\uaddc\uceec\ub7ec\u00b7\ubc14\uc774\uc800 \ubc18\uc751)","items":[{"tag":"\uc62c\uc5b4\ub77c\uc6b4\ub4dc\uc9d0\ubc31","text":"**\uc2e0\uaddc \uceec\ub7ec(\ubbfc\ud2b8\u00b7\ub77c\ubca4\ub354) \uc5ec\uc131 \ubc18\uc751 \uae0d\uc815\uc801** \u2014 \ub098\uc778\uc6d0\ud55c\ub0a8 '\ubbfc\ud2b8\u00b7\ub77c\ubca4\ub354 \ub458 \ub2e4 \uc5ec\uc131 \ubc18\uc751 \ud2b9\ud788 \uc88b\uc74c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub77c\ubca4\ub354 V2 \ud488\uc808 \uace0\uac1d\uc5d0\uac8c TBO73 \uc5f0\uacc4 \ud310\ub9e4 \uc131\uacf5'. \ub2e8, \uc804\ubc18\uc801\uc73c\ub85c \ud130\uce58\ub294 \uc788\uc73c\ub098 \uad6c\ub9e4 \uc804\ud658\uc740 \uc544\uc9c1 \uc9c0\ucf1c\ubd10\uc57c \u2014 \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ud070 \ubc18\uc751 \uc5c6\uc74c, \ub354 \uc9c0\ucf1c\ubd10\uc57c'."},{"tag":"\ubc14\uc774\uc800","text":"**\ubc14\uc774\uc800 SKU \ub2e4\uc591\ud654 \uae0d\uc815 \ubc18\uc751** \u2014 \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc804\ub144\ubcf4\ub2e4 SKU \ub298\uace0 \uc608\uc05c \uc0c9\uac10 \ub9ce\uc544 \uace0\uac1d \ub9cc\uc871'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\ucc59 \ub113\uace0 \ucc28\ubd84\ud55c \uceec\ub7ec \uc778\uae30'. \ub86f\ub370\ubd80\uc0b0 '\uae00\ub85c\uc6b0\ubca0\uc77c\ucc98\ub7fc \ud070 \ubc34\ub529 \ubc14\uc774\uc800 \uc120\ud638'. \ub2e8, \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ucc59 \uae30\uc7a5 \ub108\ubb34 \uc9e7\ub2e4\ub294 \ud53c\ub4dc\ubc31', \ub098\uc778\uc6d0\ud55c\ub0a8 '\uc2a4\uc719\ubc14\uc774\uc800 \ub4b7\ubc34\ub529 \uc544\uc26c\uc6c0'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 WHT \uc7ac\uace0 \ube60\ub974\uac8c \uc18c\uc9c4** (\uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\ub86f\ub370\uc778\ucc9c) \u2014 '\ud770\uc0c9\ub9cc \uc790\uafb8 \ucc3e\uc544 IVY \ub300\uccb4 \uc5b4\ub824\uc6c0' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\ub300\uc804 '\uc2a4\uc719\ub77c\uc774\ud2b8\ucea1 \uc18c\uc7ac \uac00\ubccd\uace0 \uc88b\uc73c\ub098 \uc2a4\uc719\ubaa8\uc158\ucea1 \uc250\uc785\uc774 \ub354 \uc608\uc058\ub2e4\ub294 \uc758\uacac, \ucc29\uc6a9 \uc2dc \ub531 \uc7a1\ud788\ub294 \ub290\ub08c \uc5c6\uc5b4 \uc6b4\ub3d9 \uc2dc \ubd88\ud3b8'. \ub86f\ub370\uc758\uc655 'FW \uae00\ub85c\uc6b0 \ubc14\uc774\uc800\ubcf4\ub2e4 SS \uae00\ub85c\uc6b0 \ubc14\uc774\uc800 \uc120\ud638'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ubc14\uc774\uc800\ubcf4\ub2e4 \ucea1 \uc120\ud638 \uc99d\uac00, \uc120\ubb3c\uc6a9 \ucea1 \ud130\uce58 \ub9ce\uc74c'."},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc9d0\ubc31 \ud0c0 \ube0c\ub79c\ub4dc \ub300\ube44 \uac00\uaca9 \ube44\uc2f8\ub2e4\ub294 \ud53c\ub4dc\ubc31 \u591a'. \ub86f\ub370\ub3d9\ubd80\uc0b0 'V1 \uc544\uc774\ubcf4\ub9ac \ubb3c\ud1b5 \uc218\ub0a9 \ucc0d\ucc0d\uc774 \ubc29\uc2dd \uace0\uac1d \uc758\ubb38 \uc9c0\uc18d'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 'V1\u00b7V2 \uc0c1\ud488 \ud53c\ub85c\uac10 \uc2ec\ud568, V3 \uac19\uc740 \uc2e0\uaddc \ub514\uc790\uc778 \ud544\uc694 \ubc18\ubcf5 \uc5b8\uae09'."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ubcfc\ud2b8\ud504\ub85c \uac15\uc138","text":"**\ubcfc\ud2b8\ud504\ub85c 1.5** \uc804 \ub9e4\uc7a5 \ud310\ub9e4 1\uc704 \uc720\uc9c0. \ucee4\ub125\ud2b8\uccad\uc8fc '\ubcfc\ud2b8\ud504\ub85c \ud310\ub9e4\uc728 \uc555\ub3c4\uc801, \uadf8\ub9b0\u00b7\ube14\ub8e8 \uc778\uae30'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc2e0\uaddc \uceec\ub7ec \ubaa8\ub450 \uace0\uac1d \ub9cc\uc871'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ubcfc\ud2b8\ud504\ub85c 1.5 \ube14\ub8e8 \uceec\ub7ec \uc778\uae30 \uad49\uc7a5\ud788 \uc88b\uc74c'. \ub86f\ub370\uc7a0\uc2e4 '\ud14c\ub9b0\uc774\uc5d0\uac8c \uc811\uadfc\ud558\uae30 \uc88b\uc740 \ud14c\ub2c8\uc2a4\ud654\ub85c \ucd94\ucc9c'."},{"tag":"\uc5d0\uc5b4\ub9acW","text":"**\uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec(\ub808\ub4dc\u00b7\uc610\ub85c\uc6b0)** \ubc18\uc751. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc2e0\uaddc \uceec\ub7ec \ucc29\uc6a9 \ud6c4 \ub300\ubd80\ubd84 \uad6c\ub9e4\ub85c \uc5f0\uacb0, \uae30\uc874 \uceec\ub7ec\ub97c \uc78a\uac8c \ub9cc\ub4dc\ub294 \uc608\uc05c \uceec\ub7ec'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uc5d0\uc5b4\ub9ac \ub808\ub4dc \uceec\ub7ec \ud310\ub9e4\uc728 \uc88b\uc74c'. \ub2e8, \uc2e0\uc138\uacc4\uc758\uc815\ubd80\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 '\ucc29\ud654\uac10 \uc544\uc26c\uc6c0, \uac00\uc8fd \uc18c\uc7ac \ub2f5\ub2f5\u00b7\ubc11\ucc3d \ub531\ub531\ud558\ub2e4\ub294 \ud53c\ub4dc\ubc31'. \ud604\ub300\uc911\ub3d9 '\uae30\uc874 \uceec\ub7ec\uac00 \ub354 \uc778\uae30'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\ucc3d\uc6d0 \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 265mm \uc774\uc0c1 \uc0ac\uc774\uc988 \ubd80\uc7ac** \u2014 '\ub0a8\uc131 \uc2dc\ucc29 \ubabb\ud558\ub294 \uacbd\uc6b0 \u591a' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\ub3d9\ubd80\uc0b0 \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \uc7ac\uace0 \ubd80\uc871** \u2014 '\uc785\uace0 \uc694\uccad' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \ub7ec\uc26c\ud504\ub85c \ub0b4\uad6c\uc131 \ud074\ub808\uc784** \u2014 '\ucc29\ud654 \uc5bc\ub9c8 \uc548 \ub410\ub294\ub370 \ubc1c\ubcfc \ucabd \uac08\ub77c\uc9d0 \ud604\uc0c1' \u2192 \uc989\uc2dc \ud655\uc778\u00b7\ub300\uc751"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ubcfc\ud2b8\ud504\ub85c \uadf8\ub9b0 \uceec\ub7ec \uc5c6\uc5b4 \ud5db\uac78\uc74c \uace0\uac1d \ubc1c\uc0dd, \uc2e0\uc0c1 \uc778\ud2b8\ub9ac\uadf8(WHT/LIM)\ub85c \ub300\uccb4 \ud310\ub9e4'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ubcfc\ud2b8\ud504\ub85c \uadf8\ub9b0 \uc5ec\uc804\ud788 \uac00\uc7a5 \uc778\uae30, \uc5d0\uc5b4\ub9ac \ud654\uc774\ud2b8 \ud130\uce58 \uac00\uc7a5 \ub9ce\uc74c'. \uc2e0\uc138\uacc4\uad11\uc8fc '\uc5d0\uc5b4\ub9ac \ub274\uceec\ub7ec \uc5ec\uc131 \ud130\uce58\u00b7\uad6c\ub9e4 \uc88b\uc74c, \ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4 \uadf8\ub9b0\u00b7\ud654\uc774\ud2b8 \ub300\ube44 \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751 \uc544\uc9c1 \ubbf8\ud761'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \uc7ac\uace0 \uc18c\uc9c4 \ud6c4 \ubc18\uc751)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4\uc18c\uc9c4\ud6c4","text":"\uc7ac\uace0 \uc18c\uc9c4 \ud6c4\uc5d0\ub3c4 **\ubb38\uc758\u00b7\uc7ac\uc785\uace0 \ub300\uae30 \uace0\uac1d \uc9c0\uc18d** \u2014 \ub86f\ub370\ubd80\uc0b0\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ud604\ub300\uc911\ub3d9\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 '\uc7ac\uace0 \uc5c6\ub294\ub370\ub3c4 \uc804\ud654\u00b7\ubc29\ubb38 \ubb38\uc758 \uacc4\uc18d'. \uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0 '\ubc29\ubb38\uac1d 70%\uac00 \ub514\ud30c\uc774\uc5b4 \uc2e4\ubb3c \ubaa9\uc801'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub514\ud30c\uc774\uc5b4 \ub54c\ubb38\uc5d0 \ub2e4\ub978 \ub77c\ucf13 \uc218\uc694 \uc5c6\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub514\ud30c\uc774\uc5b4 \uc7ac\uc785\uace0 10\uc6d4 \uc77c\uc815 \uc548\ub0b4 \uc911\uc774\ub098 \uc5f4\uae30 \uc720\uc9c0 \uc6b0\ub824** (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591) \u2014 '10\uc6d4\uae4c\uc9c0 \uc5f4\uae30 \uc774\uc5b4\uac08\uc9c0 \uc758\ubb38' \u2192 8\uc6d4\u00b710\uc6d4 \uc2a4\ud399\ubcc4 \ucd9c\uc2dc \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 \uc2a4\ud399(100UL\u00b7100L) \ucd9c\uc2dc \uc77c\uc815 \ubb38\uc758 \uc99d\uac00** (\ub354\ud604\ub300\uc11c\uc6b8\u00b7\ucee4\ub125\ud2b8\uccad\uc8fc\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0) \u2014 \ucd9c\uc2dc \uc77c\uc815 \uacf5\uc720 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc544\uc774\ud30c\ud06c '\uc544\ub798\uce35 \ud14c\ub2c8\uc2a4\uba54\ud2b8\ub85c\uc5d0 \ub514\ud30c\uc774\uc5b4 98PRO \uc7ac\uace0 \u591a, \uc774\ud0c8 \uc2ec\uac01. \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \ubd88\uac00\ub85c \ud55c\uc815\ud310 \ub77c\ucf13 \uc704\uc8fc \ud310\ub9e4 \uc911'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc774\ubc88 \uc8fc \uace8\uace0\ub8e8 \ud310\ub9e4 \u2014 \ucd08\ubcf4 \uc5ec\uc131 \uc6b8\ud2b8\ub77c, \ucd08\ubcf4 \ub0a8\uc131 \ud074\ub798\uc2dc, \ubd80\ub3d9 1\ub4f1 \ube14\ub808\uc774\ub4dc'. \ub86f\ub370\uc778\ucc9c '\ub514\ud30c\uc774\uc5b4 \uc2e0\uc0c1\uc73c\ub85c \uc778\ud574 \uc26c\ud504\ud2b8 \uc7ac\uace0 \uc18c\ud654 \ub354 \uc5b4\ub824\uc6cc\uc9d0'."},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc5ec\uc131 \uc120\ud638 \ub0ae\uc740 \ubb34\uac8c \ud55c\uc815\ud310 \ub77c\ucf13 \uc804\ubd80 \ud488\uc808, \ubc1c\uae38 \ub3cc\ub9ac\ub294 \uace0\uac1d \u591a'. \ub86f\ub370\uae30\ud765 '\ube14\ub808\uc774\ub4dc V10 \uc5d0\ub514\uc158 \ucd9c\uc2dc \uc5ec\ubd80 \ubb38\uc758 \uc885\uc885 \ubc1c\uc0dd'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc720\ub3c4\ud310\ub9e4\ub85c \ube14\ub808\uc774\ub4dc 50% \ud655\ub960 \uc804\ud658 \ud310\ub9e4 \uc131\uacf5'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uc548\uc815\uc801 \ud310\ub9e4 \uc720\uc9c0. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ubcfc\ud0c0\uc6cc \uc55e \uace0\uac1d \uc801\uadf9 \uc720\uc778 \u2014 \uc2dc\ub044\ub7fd\uac8c \ub9cc\ub4e4\uc5b4\uc57c \uc8fc\ubcc0 \uace0\uac1d \ubaa8\uc784, \uc5d0\ubcfc\ub8e8\uc158\u00b7\uc5d0\ubcf4NXT \ub109\ub109\ud55c \uc7ac\uace0\ub85c \ub9e4\ucd9c \ub3c4\uc6c0 \ub428'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc8fc\ub9d0 \ubcfc\ud0c0\uc6cc \uc55e \uc778\uc0b0\uc778\ud574'. \ub86f\ub370\uc758\uc655 '\uc5d0\ubcfc\ub8e8\uc158 \uc7ac\uc785\uace0\ub85c \uc8fc\ubb38 \uc5c6\uc774 \ubc14\ub85c \ud310\ub9e4 \uac00\ub2a5\ud574 \uc88b\uc558\uc74c'."},{"tag":"\uc774\uc288","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '\ub808\ud2b8\ub85c\ubcfc(\uace0\ubb34) \uc2e0\uc0c1 \uc785\uace0\ub410\uc73c\ub098 10\ub300 \uc120\ud638 \uc548 \ud568, \uc544\uc26c\uc6c0'. \ub86f\ub370\uae30\ud765 '\uae00\ub7ec\ube0c A1000 \uc785\uace0 \ubb38\uc758 \uc788\uc74c'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc2dc\ud2f0\ub808\ud2b8\ub85c \uc7ac\uace0 \uc18c\uc9c4, \ucd94\uac00 \uc785\uace0 \ud544\uc694'. \uc2e0\uc138\uacc4\uad11\uc8fc '\uc774\ubc88 \uc8fc \ub18d\uad6c\uacf5 \ucc3e\ub294 \uace0\uac1d \uac70\uc758 \uc5c6\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\ub3d9\ubd80\uc0b0 \uc2dc\ud2f0\ub808\ud2b8\ub85c \uc7ac\uace0 \uc18c\uc9c4** \u2014 \ucd94\uac00 \uc785\uace0 \ud544\uc694"}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669","items":[{"tag":"\uc774\uc288","text":"**\uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31\uc73c\ub85c \ud310\ub9e4 \ub85c\uc2a4 \uc9c0\uc18d** \u2014 LF\uad11\uc591 '\uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31 \ub9ce\uc544 \uad6c\ub9e4 \ud3ec\uae30 \uace0\uac1d \uc9c0\uc18d \ubc1c\uc0dd, \ucd5c\uc18c M~XL \uc0ac\uc774\uc988 \ud480 \uc720\uc9c0 \ud544\uc694'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ub9c8\uc74c\uc5d0 \ub4dc\ub294 \ub514\uc790\uc778 \ud130\uce58\ud574\ub3c4 \uc0ac\uc774\uc988 \uc5c6\ub294 \uacbd\uc6b0 \u591a, 25FW \ud30c\uc0ec\uc785\uace0\ub85c \ud55c \uc8fc \ub9cc\uc5d0 \uc18c\uc9c4'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\uc758\uc655 \ud0c0 \uc810\ud3ec \uc120\ud310\ub9e4 \ud3b8\ubc95 \uc0ac\uc6a9** \u2014 '\uc758\ub8b0 \ud6c4 \ubc18\ud488\uc73c\ub85c \uc7ac\uace0 \uc0b4\ub9ac\ub294 \ud3b8\ubc95 \uc4f0\ub294 \uc810\ud3ec \uc788\uc74c' \u2192 \uc6b4\uc601 \uc815\ucc45 \ud655\uc778 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\ud30c\uc8fc \uc0c1\uc124 \ubd88\ub7c9 \uc81c\ud488 CS \ud504\ub85c\uc138\uc2a4 \ubc88\uac70\ub85c\uc6c0** \u2014 '\ud655\uc2e4\ud55c \ubcc0\uc0c9\u00b7\ubd88\ub7c9\uc740 \ubc14\ub85c \ucc98\ub9ac\ub410\uc73c\uba74 \ud568' \u2192 CS \ud504\ub85c\uc138\uc2a4 \uac1c\uc120 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uae30\ud765 'RT\uc694\uccad \ud55c\ub3c4 20\uac1c \u2192 30~40\uac1c\ub85c \ub298\ub9ac\uba74 \uc8fc\ub825 \uc0c1\ud488 \uc7ac\uace0 \uad00\ub9ac \uc218\uc6d4'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '1\ub144\ucc28\u00b72\ub144\ucc28 \uc0c1\ud488 \uac00\uaca9 \uc5ed\uc804 \ud604\uc0c1 \ubc0f 2\ub144\ucc28 \uac00\uaca9 \uc0c1\uc2b9\uc73c\ub85c \uace0\uac1d \ud074\ub808\uc784 \uac04\ud5d0\uc801 \ubc1c\uc0dd'. \ucee4\ub125\ud2b8\uccad\uc8fc '\uc0c1\uc124 \ub2e8\uac00 \ub0ae\uc544 \uc0c1\uc124 \uba54\uc778 \uc870\ub2dd\uc73c\ub85c \ubcc0\uacbd\ud574 \ud310\ub9e4\uc728 \ub192\uc774\ub294 \ubc29\ud5a5 \uc6b4\uc601 \uc911'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcca **\ud63c\uc7ac** \u2014 \uc81c\ud5cc\uc808 \uc5f0\ud734(\uae08~\uc77c) \ud6a8\uacfc\ub85c \uc77c\ubd80 \ub9e4\uc7a5 \uc99d\uac00, \uc7a5\ub9c8\u00b7\ud734\uac00\ucca0\ub85c \uc804\ubc18 \uac10\uc18c. \ub86f\ub370\uc778\ucc9c '\uc5d0\ube44\ub274\uc5d8 VIP \ud788\ub4e0 \uc0ac\uc740\ud589\uc0ac\ub85c \uace0\uac1d\ub2e8\uac00 \ub192\uc740 \uace0\uac1d \uc18c\ud3ed \ubc29\ubb38'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc785\uc810 \uae09\uc99d \u2014 \ube44 \uc608\ubcf4\uc5d0 \ud14c\ub2c8\uc2a4 \ubabb \uce5c \uace0\uac1d \ub9e4\uc7a5\uc73c\ub85c \uc720\uc785, \uc778\ud50c\ub8e8\uc5b8\uc11c SNS \ud611\uc5c5 \ud6a8\uacfc'."},{"tag":"\ub3d9\ud5a5","text":"\uc678\uad6d\uc778: \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc678\uad6d\uc778\uc774 \uba39\uc5ec\uc0b4\ub9ac\ub358 \uad6c\uc870, \ud734\uac00\ucca0 \ube60\uc9c0\uba70 \ub9e4\ucd9c \ub454\ud654'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc678\uad6d\uc778\u00b7\ub0b4\uad6d\uc778 \ube44\uc911 \uac70\uc758 \ube44\uc2b7\ud574\uc9d0'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc678\uad6d\uc778 \uc791\ub144 \ub300\ube44 \uad49\uc7a5\ud788 \ub9ce\uc774 \uc904\uc5b4\ub4e0 \ub290\ub08c'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ud734\uac00 \uc2dc\uc98c \uc2dc\uc791\uc73c\ub85c \ud14c\ub2c8\uc2a4 \ubaa9\uc801\uad6c\ub9e4 \uace0\uac1d \ud06c\uac8c \uac10\uc18c'."},{"tag":"\ub3d9\ud5a5","text":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc8fc\ub9d0 \uc785\uc810 \ub300\ube44 \uad6c\ub9e4\uc728 \ub108\ubb34 \ub0ae\uc74c, \uc8fc\ub9d0 \uc5f0\ub839\ub300 \ub192\uc544 \uc758\ub958 \uad6c\ub9e4 \ub9dd\uc124\uc774\ub294 50\ub300 \uc774\uc0c1 \u591a'. \ud604\ub300\ub300\uc804 '\uc810\ud3ec \uc785\uc810 \uac1d\uc218 \ud3c9\uade0 \ubabb \ubbf8\uce58\ub098 \uac1d\ub2e8\uac00\ub3c4 \ub9ce\uc774 \ub0ae\uc544\uc9d0'. LF\uad11\uc591 '\ub514\ud30c\uc774\uc5b4\u00b7\uc2e0\uc0c1\ud488 \uad00\uc2ec \uc99d\uac00\ub85c \uace0\uac1d \uc720\uc785 \uc18c\ud3ed \uc99d\uac00'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uc544\uc774\ud30c\ud06c '\uc544\ub798\uce35 \ud14c\ub2c8\uc2a4\uba54\ud2b8\ub85c \ub514\ud30c\uc774\uc5b4 98PRO \uc7ac\uace0 \u591a \u2014 \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \uac00\ub2a5\u00b7\uac00\uaca9 \ube44\uad50\ub85c \uc774\ud0c8 \uc2ec\uac01'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\ub77c\ucf54\uc2a4\ud14c 30% \ud560\uc778 \ud589\uc0ac \ub9e4\ub300 \uc9c0\uc18d'. \ud604\ub300\ub300\uc804 '\ud0c0 \ube0c\ub79c\ub4dc \ud560\uc778 \ud589\uc0ac\ub85c \uac1d\ub2e8\uac00 \ub0ae\uc544\uc9c0\ub294 \uc911'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ub354\ud604\ub300\uc11c\uc6b8 \uc0ac\uc774\uc988 \uc804\ubc18 \uae68\uc9d0 \u2014 DP \ud310\ub9e4\u00b7\ud310\ub9e4 \ub85c\uc2a4 \ud07c","\ub9e4\uc7a5":"\ub354\ud604\ub300\uc11c\uc6b8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc2e0\uc0c1 \uc785\uace0 \uc77c\uc815 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc2a4\ucee4\ud2b8/\ubc14\uc9c0 \ud5c8\ub9ac\u00b7\uace8\ubc18 \ud54f \uc774\uc288","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc18c\uc7ac\u00b7\ud328\ud134 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc5ec\uc131 \uc2a4\ucee4\ud2b8 \uc18d\ubc14\uc9c0 \uc6d0\ub2e8 \ub108\ubb34 \ub450\uaebc\uc6c0","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc6d0\ub2e8 \uac1c\uc120 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0 V2 WHT \uc7ac\uace0 \ube60\ub974\uac8c \uc18c\uc9c4","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\ub86f\ub370\uc778\ucc9c","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 265mm \uc774\uc0c1 \uc0ac\uc774\uc988 \ubd80\uc7ac","\ub9e4\uc7a5":"\ub86f\ub370\ucc3d\uc6d0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \uc7ac\uace0 \ubd80\uc871 \u2014 \uc785\uace0 \uc694\uccad","\u ,"7\uc6d44W":{"date":"07/20~07/26","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\ucfe8\uc2a4\ud504\ub9b0\ud2b8 \ub0c9\uac10 \uc18c\uc7ac \ud310\ub9e4 \uc9c0\uc18d \uac15\uc138, \uc218\uc785 \ube0c\ub77c\ud0d1(TPS51\u00b7TTS81) \uc2e0\uaddc \ubc18\uc751 \uc88b\uc74c. \ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \uc5ec\uc804\ud788 \ub2e4\uc218\uc774\ub098 \uc7ac\uc785\uace0 \uc77c\uc815 \uae38\uc5b4 \ud604\uc7a5 \uc751\ub300 \uc560\ub9e4\ud55c \uc0c1\ud669 \uc9c0\uc18d. \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc2e0\uaddc \uceec\ub7ec(\ud551\ud06c\u00b7\uadf8\ub9b0) \ud130\uce58\uc728 \uc0c1\uc2b9, \uc2e0\uc0c1 \uc591\ub9d0 \ub514\uc790\uc778 \ud638\ud3c9. \ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \uc2e0\uaddc \uceec\ub7ec \uac15\uc138, \uc2e0\uc0c1 \uc2a4\ub2c8\ucee4\uc988 \ubc18\uc751\uc740 \uc544\uc9c1 \ubbf8\ud761. \uc7a5\ub9c8 \uc7a5\uae30\ud654+\ud734\uac00\ucca0 \ubcf5\ud569\uc73c\ub85c \uc804 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 + \ucfe8\uc2a4\ud504\ub9b0\ud2b8 \ub0c9\uac10 \uc18c\uc7ac** \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 1\uc704. AK\uc6d0\uc8fc '\ub0c9\uac10\uc18c\uc7ac\uc778 \ucfe8\uc2a4\ud504\ub9b0\ud2b8 \ud2f0\uc154\uce20\u00b7\ub0a8\uc131 \ubc18\ubc14\uc9c0 \ud310\ub9e4\uc728 \ub192\uc74c'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\uae30\ubcf8 \ud4e8\uc5b4\ud2f0 \uc778\uae30 \uc88b\uc73c\uba70 \uc758\ub958+\uc6a9\ud488(\uc544\ub300\u00b7\ud5e4\uc5b4\ubc34\ub4dc) \uc120\ubb3c \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\ubca0\uc2a4\ud2b8","text":"**\uc218\uc785 \ube0c\ub77c\ud0d1\u00b7\ubc18\ud314** \uc2e0\uaddc \ubc18\uc751 \uc88b\uc74c \u2014 \ub86f\ub370\uc778\ucc9c '2TPS51(\uc218\uc785\ube0c\ub77c\ud0d1) WTA\u00b7NVY \ud310\ub9e4\uc728 \uc88b\uc74c, \ud074\ub798\uc2dd\ud55c \ub514\uc790\uc778+\ub178\ucd9c \ubd80\ub2f4 \uc5c6\uc5b4 \ubc18\uc751 \uc88b\uc74c. 2TTS81(\uc218\uc785\ubc18\ud314) \uc6d0\ub2e8 \uc88b\uc544 \ubc18\uc751 \uc88b\uc74c'. \ub808\uc774\uc5b4\ub4dc\uc2a4\ud3ec\uce20\ud32c\uce20 \uafb8\uc900\ud55c \uc778\uae30 (\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0)."},{"tag":"\ud2b9\uc774","text":"\uc6a9\ud488 \uc120\ubb3c \uc218\uc694 \uc99d\uac00 \u2014 \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ub354\uc704\uc5d0 \uc544\ub300\u00b7\ud5e4\uc5b4\ubc34\ub4dc \uc120\ubb3c \ud310\ub9e4 \uc88b\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\ub514\ud30c\uc774\uc5b4 \uc2dc\ud0c0\ub77c\ucf13 \uc801\uadf9 \ud65c\uc6a9\ud574 \ube14\ub808\uc774\ub4dc V10 \uc720\ub3c4 \ud310\ub9e4 \uc9c4\ud589 \uc911'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc9 **\uc7a5\ub9c8 \uc7a5\uae30\ud654+\ud734\uac00\ucca0 \ubcf5\ud569\uc73c\ub85c \uc804 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c** \u2014 \ub86f\ub370\uc778\ucc9c '\ud734\uac00 40%\u00b7\ud639\uc11c\uae30 \ud14c\ub2c8\uc2a4 \uc704\ucd95 30%\u00b7\uc7a5\ub9c8 20%\u00b7\ubd88\uacbd\uae30 10%'. \ud83d\udcc8 **\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc2e0\uaddc \uceec\ub7ec \ud130\uce58\uc728 \uc0c1\uc2b9** \u2014 \ub86f\ub370\uc778\ucc9c '\uc804\uc8fc\ubcf4\ub2e4 \ud130\uce58\u00b7\ud310\ub9e4\uc728 \ud655\uc2e4\ud788 \uc62c\ub77c\uac10'. \ud83d\udcc9 **\ub514\ud30c\uc774\uc5b4 \uc7ac\uc785\uace0 \uc77c\uc815 \uc560\ub9e4** \u2014 \ud604\uc7a5 \uc751\ub300 \uc5b4\ub824\uc6c0 \uc9c0\uc18d. \ud83d\udcc8 **\uc2e0\uc0c1 \uc591\ub9d0 \ub514\uc790\uc778 \ud638\ud3c9** \ub2e4\uc218 \ub9e4\uc7a5 \uc5b8\uae09."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uae30\ubcf8 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ub77c\uc778 \ud310\ub9e4 \uac15\uc138 \uc9c0\uc18d. \uc18c\ud638\ud2f0\uc154\uce20\ub294 \ub0a8\uc131 \ud130\uce58 \ub9ce\uc73c\ub098 **\uc0ac\uc774\uc988 \uc791\uac8c \ub098\uc640 \uad6c\ub9e4 \uc774\ud0c8** (\ub86f\ub370\uc778\ucc9c). \uc2a4\ud29c\ub514\uc624\ub808\uc774\uc5b4\ub4dc\ub294 \uad6d\ub0b4 \uace0\uac1d \ubc18\uc751 \uc5c6\uace0 \uc678\uad6d\uc778 1~2\uc7a5 \ud310\ub9e4 \uc218\uc900 (\ub86f\ub370\uc778\ucc9c)."},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc218\uc785 \ub77c\uc778 \ud310\ub9e4 \uac15\uc138, \uc18c\ud638 \ud2f0\uc154\uce20\u00b7\uc2a4\ud29c\ub514\uc624 \ub808\uc774\uc5b4\ub4dc \ubc18\uc751 \uc88b\uc74c'. \ud604\ub300\ud310\uad50 '\ucfe8\uc2a4\ud504\ub9b0\ud2b8 \uc18c\uc7ac \uc758\ub958 \uc804\ubc18 \ud130\uce58 \uc88b\uc74c, \uae30\ub2a5\uc131 \uc18c\uc7ac \ub2c8\uc988 \uc5ec\uc804\ud788 \ub192\uc74c'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uc218\uc785 \ube0c\ub77c\ud0d1\u00b7\ubc18\ud314 \uc2e0\uaddc \uc785\uace0 \ud6c4 \uc5ec\uc131 \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc18c\ud638\ud2f0\uc154\uce20 \uc0ac\uc774\uc988 \uc791\uac8c \ub098\uc640 \uad6c\ub9e4 \uc774\ud0c8** (\ub86f\ub370\uc778\ucc9c) \u2014 \uc0ac\uc774\uc988 \uadf8\ub808\uc774\ub529 \uac80\ud1a0 \ud544\uc694"},{"tag":"\uc774\uc288","text":"AK\uc6d0\uc8fc '\uae30\ubcf8 \uc2a4\ud0c0\uc77c(\ud4e8\uc5b4\ub77c\uc778) \uc704\uc8fc, \uc2e0\uc0c1 \uc18c\ud654 \uc5b4\ub824\uc6b4 \uc9c0\uc5ed \ud2b9\uc131'. \ub86f\ub370\ucc3d\uc6d0 '\ub0a8\uc131 \uc218\uc785 \ub77c\uc778 \uad6c\ub9e4 \uace0\uac1d \ub300\ubd80\ubd84, \uc5ec\uc131\uc740 \ubcfc\ud2b8\ud504\ub85c \uac19\uc740 \uac00\ubcbc\uc6b4 \uc2a4\ud0c0\uc77c \uc120\ud638'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud558\ud37c\ud06c\ub86d+\ub808\uc774\uc5b4\ub4dc\uc1fc\uce20 \uc14b\uc5c5 \ud310\ub9e4 \uc9c0\uc18d, FW \uc2e0\uc0c1 \uc785\uace0\ub85c \ubd84\uc704\uae30 \uc804\ud658'."},{"tag":"\uc548\ub0b4\ud544\uc694","text":"\ud83d\udccc \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758 \u2192 FW \uc2e0\uc0c1 S\u00b7M \uc0ac\uc774\uc988 \ud655\ub300 \uc608\uc815 \uc548\ub0b4"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ub4dc\ub85c\uc6b0\uc2e0\uaddc\uceec\ub7ec","text":"**\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc2e0\uaddc \uceec\ub7ec** \ud130\uce58\uc728 \uc0c1\uc2b9. \ub86f\ub370\uc778\ucc9c '\ud551\ud06c>\uadf8\ub9b0 \uc21c\uc11c\ub85c \ubc18\uc751, \uc804\uc8fc\ubcf4\ub2e4 \ud655\uc2e4\ud788 \ud130\uce58\u00b7\ud310\ub9e4\uc728 \uc62c\ub77c\uac10'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751 \uc9c0\uc18d, \uc678\uad6d\uc778 \uc911\uc2ec \uad6c\ub9e4'. \ub2e8, AK\uc6d0\uc8fc '\uc9d0\ubc31 \ud130\uce58 \ub9ce\uc9c0 \uc54a\uc74c'."},{"tag":"\uc2e0\uc0c1\uc591\ub9d0","text":"**\uc2e0\uc0c1 \uc591\ub9d0 \ub514\uc790\uc778 \ud638\ud3c9** \ub2e4\uc218 \ub9e4\uc7a5 \uacf5\ud1b5. AK\uc6d0\uc8fc '\uc2e0\uc0c1 \uc591\ub9d0 \ud310\ub9e4\uc728 \uc88b\uace0 \ub514\uc790\uc778 \ud638\ud3c9'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\uc544\ub300\u00b7\ud5e4\uc5b4\ubc34\ub4dc \ub354\uc704 \uc120\ubb3c \ud310\ub9e4 \uc88b\uc74c'. \ub86f\ub370\uc778\ucc9c '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc5ec\uc804\ud788 \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\uc774\uc288","text":"\ub86f\ub370\ucc3d\uc6d0 '\uc9d0\ubc31 \ud130\uce58 \uc801\uc74c, \uac00\uaca9 \uc800\ud56d \uc788\uc74c'. \ud604\ub300\ud310\uad50 '\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ub77c\ubca4\ub354 \uceec\ub7ec \uc5ec\uc131 \ubc18\uc751 \uc88b\uc73c\ub098 \uad6c\ub9e4 \uc804\ud658 \uc544\uc9c1'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ub4dc\ub85c\uc6b0 V2 WHT \uc7ac\uace0 \uc18c\uc9c4 \ube60\ub984'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 WHT \uc7ac\uace0 \uc18c\uc9c4 \ube60\ub984** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0) \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"**\ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \uc2e0\uaddc \uceec\ub7ec** \uac15\uc138 \uc9c0\uc18d. \ub86f\ub370\ucc3d\uc6d0 '\ub0a8\uc131 \uc218\uc785 \ub77c\uc778 \uc704\uc8fc \uad6c\ub9e4, \uc5ec\uc131\uc740 \ubcfc\ud2b8\ud504\ub85c \uac00\ubcbc\uc6b4 \uc2a4\ud0c0\uc77c \uc120\ud638\u00b7\ud310\ub9e4 \uc798 \ub428'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ubcfc\ud2b8\ud504\ub85c \ube14\ub8e8 \uceec\ub7ec \uc778\uae30 \uc9c0\uc18d'. \uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec\ub294 \uc77c\ubd80 \ub9e4\uc7a5 \ubc18\uc751 \uae0d\uc815\uc801."},{"tag":"\uc774\uc288","text":"**\uc2e0\uc0c1 \uc2a4\ub2c8\ucee4\uc988 \ubc18\uc751 \uc544\uc9c1 \ubbf8\ud761** \u2014 AK\uc6d0\uc8fc '\uc544\uc9c1 \ubc18\uc751 \uc5c6\uc74c, \ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4 \uc2e0\uc0c1 \uceec\ub7ec \uc704\uc8fc \uad00\uc2ec'. \ub86f\ub370\uc778\ucc9c '\uc2dc\uc98c\ubc18\ud488 \uc55e\ub450\uace0 \uc778\ud2b8\ub9ac\uadf8\ud504\ub85c\u00b7\ub7ec\uc26c\ud504\ub85c5 \uceec\ub7ec \ucd94\uac00 \uc785\uace0 \ud544\uc694, \uc778\ud2b8\ub9ac\uadf8\ud22c\uc5b4\ub294 \uc55e\ucf54 \uae38\uc5b4\ubcf4\uc774\uace0 \uac00\uaca9 \ubd80\ub2f4'. \ud604\ub300\ubb34\uc5ed '\uc218\uc785 \uc2e0\ubc1c \ub77c\uc778 \ub0a8\uc131 \uace0\uac1d \uad00\uc2ec \ub192\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\uc778\ucc9c \uc2dc\uc98c\ubc18\ud488 \uc804 \uc778\ud2b8\ub9ac\uadf8\ud504\ub85c\u00b7\ub7ec\uc26c\ud504\ub85c5 \uceec\ub7ec \ucd94\uac00 \uc785\uace0 \ud544\uc694** \u2192 \uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc0ac\uc774\uba3c\ud30c\uc8fc '\ubcfc\ud2b8\ud504\ub85c \uc2e0\uaddc \uceec\ub7ec \uc5ec\uc131 \ubc18\uc751 \uc88b\uc73c\ub098 \uc0ac\uc774\uc988 \uae68\uc9d0'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uc5d0\uc5b4\ub9ac W \ud654\uc774\ud2b8 \uafb8\uc900 \ud310\ub9e4, \uc2e0\uaddc \uceec\ub7ec\ub3c4 \uc18c\ud3ed \uc99d\uac00'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc5ec\uc131 \uc120\ud638 \uceec\ub7ec \ud488\uc808\ub85c \ud310\ub9e4 \ub85c\uc2a4'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \uc9c0\uc18d)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4\ubb38\uc758","text":"**\ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \uc5ec\uc804\ud788 \ub2e4\uc218** \u2014 \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\uc544\uc9c1 \ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \ub9ce\uc740 \ud55c \uc8fc'. \ub86f\ub370\uc778\ucc9c '\uc608\uc57d\ud310\ub9e4 \uc548\ub0b4\ud558\uae30\uc5d4 \ub7f0\uce6d\uc77c \ub108\ubb34 \uae38\uc5b4 \uc560\ub9e4, DP \ubb3c\ub7c9\ub3c4 \uc5c6\uc5b4 \uc544\uc26c\uc6c0'. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\ub514\ud30c\uc774\uc5b4 \uc2dc\ud0c0\ub77c\ucf13 \uc801\uadf9 \ud65c\uc6a9\ud574 \ube14\ub808\uc774\ub4dc V10 \uc720\ub3c4 \ud310\ub9e4 \uc9c4\ud589 \uc911'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub514\ud30c\uc774\uc5b4 \uc7ac\uc785\uace0 \uc77c\uc815 \uc7a5\uae30\ud654\ub85c \ud604\uc7a5 \uc751\ub300 \uc5b4\ub824\uc6c0** \u2014 \uba85\ud655\ud55c \uc548\ub0b4 \ubc29\uce68 \uacf5\uc720 \ud544\uc694"},{"tag":"\uc774\uc288","text":"AK\uc6d0\uc8fc '\uac00\uaca9 \uc774\uc720\ub85c \uad6c\ub9e4 \ub9dd\uc124\uc784 \u591a, \ub77c\ucf13 \uad6c\uacbd\uc740 \ud558\ub098 \uad6c\ub9e4 \uc5f0\uacb0 \uc5b4\ub824\uc6c0'. \ub86f\ub370\ucc3d\uc6d0 '\ube14\ub808\uc774\ub4dc V10 \uafb8\uc900 \ud310\ub9e4, \ud14c\ub9b0\uc774 \ud074\ub798\uc2dc \uacc4\uc18d \ud310\ub9e4'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ube14\ub808\uc774\ub4dc V10 + \ub864\ub791\uac00\ub85c\uc2a4 \ud074\ub798\uc2dc \ud22c\ud0d1 \uc720\uc9c0'."},{"tag":"\uc774\uc288","text":"\ud604\ub300\uc911\ub3d9 '\ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \ud6c4 \ube14\ub808\uc774\ub4dc\u00b7\ud074\ub798\uc2dc \uc720\ub3c4'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc6b8\ud2b8\ub77c V5 \uc9c4\uc5f4 \ud6c4 \ud14c\ub9b0\uc774 \uace0\uac1d \uc785\ubb38 \uad6c\ub9e4 \uc18c\ud3ed \uc99d\uac00'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\ud504\ub85c \uc0ac\uc591 \uc120\ud638 \uace0\uac1d \ub514\ud30c\uc774\uc5b4 \ub300\uae30 \uc911, \uc911\uae09 \uc774\ud558 \ub77c\ucf13 \ud310\ub9e4 \uc704\uc8fc'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uafb8\uc900 \ud310\ub9e4. \ud604\ub300\uc911\ub3d9 '\uc5d0\ubcfc\ub8e8\uc158\u00b7\uc5d0\ubcf4\u00b7\ud4e8\uc5b4\uc0f7 \uc5ec\uc804\ud788 \uc778\uae30, \uc800\ud559\ub144 \uc544\uc774\ub4e4\uc5d0\uac8c \uace0\ubb34\uc7ac\uc9c8 \uc800\ub834\ud55c \uacf5 \uc778\uae30'. \ub86f\ub370\ucc3d\uc6d0 '\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \ub18d\uad6c\uacf5 \ud310\ub9e4 \u591a'."},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uc778\ucc9c 'ICON UV \uc0ac\uc778\ubcfc \uc18c\ud3ed \ud310\ub9e4, \ubcfc\ud0c0\uc6cc \uc5c6\ub294 \ub9e4\uc7a5 \ud2b9\uc131\uc0c1 \ub18d\uad6c\uacf5 \ud310\ub9e4 \ub9ce\uc9c0 \uc54a\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc8fc\ub9d0 \uc678\uad6d\uc778 \ub18d\uad6c\uacf5 \uad6c\ub9e4 \uc18c\ud3ed'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5ec\ub984\ubc29\ud559 \ud2b9\uc218 \uc9c0\uc18d, EVO \uc2dc\ub9ac\uc988 \uc548\uc815\uc801'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669","items":[{"tag":"\uae0d\uc815","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '\uac00\uaca9\uc800\ud56d \uac70\uc758 \uc5c6\uc74c, 25FW \uc0c1\ud488\uc774 \ud560\uc778\ud3ed \uc57d\ud568\uc5d0\ub3c4 \ud310\ub9e4 \uc798 \ub428, \uace8\ud504\ub77c\uc778 \ud310\ub9e4\uc728 \uc88b\uace0 \uc6d0\ub2e8\u00b7\uac00\uaca9 \ub9cc\uc871\ub3c4 \ub192\uc74c'. \ub86f\ub370\uae30\ud765 '\ub2e8\uace8 \uace0\uac1d \uc7ac\ubc29\ubb38 \uc2dc \ud560\uc778\uc728 \uc548\ub0b4\ub85c \ucc29\uc6a9 \uc218\uc6d4, \uc18c\ub7c9\uc7ac\uace0 \uc801\uadf9 \uc5b4\ud544\ub85c \ud310\ub9e4'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 \uc5ec\uc131 \uc0ac\uc774\uc988 \ubd80\uc871\uc73c\ub85c \ud310\ub9e4 \ubbf8\uc5f0\uacb0** \u2014 '\uc2a4\ucee4\ud2b8\u00b7\uc1fc\uce20 L\uc0ac\uc774\uc988\ub9cc \ub0a8\uc74c, \uc544\ub354\uceec\ub7ec\ub3c4 \ub3d9\uc77c' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ub610\ub294 \ubc30\ubd84 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uae30\ud765 '\uc0ac\uc774\uc988 \uae68\uc9c4 \uac8c \ub9ce\uc544 \uad6c\ub9e4 \uc5f0\uacb0 \uc548 \ub418\ub294 \uacbd\uc6b0 \ub300\ub2e4\uc218'. LF\uad11\uc591 '\uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31 \uc9c0\uc18d, \uace0\uac1d \uad6c\ub9e4 \ud3ec\uae30'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\uc7a5\ub9c8 \uc7a5\uae30\ud654 + \uc5ec\ub984 \ud734\uac00\ucca0 \ubcf5\ud569\uc73c\ub85c \uc804 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c**. \ub86f\ub370\uc778\ucc9c '\ud734\uac00 40%\u00b7\ud639\uc11c\uae30 \ud14c\ub2c8\uc2a4 \uc704\ucd95 30%\u00b7\uc7a5\ub9c8 20%\u00b7\ubd88\uacbd\uae30 10% \u2014 \uc791\ub144 \uc5ec\ub984 \ub300\ube44 \ud734\uac00 \uace0\uac1d \ud655\uc2e4\ud788 \ub9ce\uc544\uc9d0'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0\u00b7\uc2e0\uc138\uacc4\uc758\uc815\ubd80\u00b7AK\uc6d0\uc8fc '\ud734\uac00\uc2dc\uc98c \uc785\uc810 \uac10\uc18c'."},{"tag":"\ub3d9\ud5a5","text":"\ud604\ub300\ud310\uad50 '\uc8fc\ub9d0 \ud14c\ub2c8\uc2a4 \ub3d9\ud638\ud68c \ub2e8\uccb4 \ubc29\ubb38\uc73c\ub85c \uc18c\ud3ed \uc0c1\uc2b9'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc678\uad6d\uc778 \ube44\uc911 \uc99d\uac00, \uc911\uad6d\u00b7\ub3d9\ub0a8\uc544 \uace0\uac1d \uc9c0\uc18d \uc720\uc785'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc8fc\ub9d0 \uc678\uad6d\uc778 \uc785\uc810 \uc18c\ud3ed \uc99d\uac00'. LF\uad11\uc591 '\uc7a5\ub9c8\ub85c \ud3c9\uc77c \uc720\ub3d9\uc778\uad6c \uac70\uc758 \uc5c6\uc74c'."},{"tag":"\ub3d9\ud5a5","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '\uafb8\uc900\ud55c \ubc29\ubb38\uac1d \uc720\uc9c0, \uc7a5\ub9c8\ubcf4\ub2e4 \ud734\uac00\ucca0 \uc601\ud5a5 \ub354 \ud07c'. \ub86f\ub370\ucc3d\uc6d0 '\ud639\uc11c\uae30 \ud14c\ub2c8\uc2a4 \uc704\ucd95\uc73c\ub85c \uc785\uc810 \uac10\uc18c'. \ub354\ud604\ub300\uc11c\uc6b8 '\ud31d\uc5c5 \ud589\uc0ac \ud6a8\uacfc\ub85c \uc678\uad6d\uc778 \uc720\uc785 \uc9c0\uc18d'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"AK\uc6d0\uc8fc '\ub098\uc774\ud0a4 2\ud488\ubaa9 \uc774\uc0c1 30%\u00b7\ud720\ub77c \uc288\uc988 30%'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ub77c\ucf54\uc2a4\ud14c 30%\u00b7\uc81d\uc2dc 1+1 \ubc0f 30%\u00b7\uc544\ub514\ub2e4\uc2a4 10~30%'. \uc2e0\uc138\uacc4\ub300\uc804 '\ub9e4\uc7a5 \uc55e \ub300\ud589\uc0ac\uc7a5 \uc544\uc6c3\ub3c4\uc5b4 60% \ud589\uc0ac \uc911'. \uc804\ubc18\uc801\uc73c\ub85c \ud0c0 \ube0c\ub79c\ub4dc \ud560\uc778 \uacf5\uc138 \uc9c0\uc18d, \uac00\uaca9 \ube44\uad50 \ud6c4 \uc774\ud0c8 \uc99d\uac00 \ucd94\uc138."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc18c\ud638\ud2f0\uc154\uce20 \uc0ac\uc774\uc988 \uc791\uac8c \ub098\uc640 \uad6c\ub9e4 \uc774\ud0c8","\ub9e4\uc7a5":"\ub86f\ub370\uc778\ucc9c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc0ac\uc774\uc988 \uadf8\ub808\uc774\ub529 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0 V2 WHT \uc7ac\uace0 \uc18c\uc9c4 \ube60\ub984","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc2dc\uc98c\ubc18\ud488 \uc804 \uc778\ud2b8\ub9ac\uadf8\ud504\ub85c\u00b7\ub7ec\uc26c\ud504\ub85c5 \uceec\ub7ec \ucd94\uac00 \uc785\uace0 \ud544\uc694","\ub9e4\uc7a5":"\ub86f\ub370\uc778\ucc9c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc5ec\uc131 \uc120\ud638 \uceec\ub7ec \ud488\uc808","\ub9e4\uc7a5":"\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ub514\ud30c\uc774\uc5b4 \uc7ac\uc785\uace0 \uc7a5\uae30\ud654 \u2014 \ud604\uc7a5 \uc751\ub300 \uc560\ub9e4","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uba85\ud655\ud55c \uc548\ub0b4 \ubc29\uce68 \uacf5\uc720"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"\uc5ec\uc131 \uc0ac\uc774\uc988 \ubd80\uc871\uc73c\ub85c \ud310\ub9e4 \ubbf8\uc5f0\uacb0","\ub9e4\uc7a5":"\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ub86f\ub370\uae30\ud765\u00b7LF\uad11\uc591","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \ub610\ub294 \ubc30\ubd84 \uac80\ud1a0"}]}},"7\uc6d45W":{"date":"07/27~08/02","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \ubc18\ud314 \uc804 \ub9e4\uc7a5 1\uc704, \ucfe8\uac10 \uc18c\uc7ac \uc218\uc694 \uc815\uc810. \uc634\ube0c\ub808 \uc2a4\ucee4\ud2b8\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \uc2e0\uc0c1 \uc785\uace0\ub410\uc73c\ub098 \uc804\ubc18 \ud130\uce58 \uc704\uc8fc\u00b7\uad6c\ub9e4 \uc804\ud658\uc740 \uc544\uc9c1 \uc9c0\ucf1c\ubd10\uc57c. \uc2e0\uaddc \ub4c0\uc624\ud50c\ub7a9 \ubc31\ud329 \ubc18\uc751 \uae0d\uc815\uc801, \ub4dc\ub85c\uc6b0 V2 \uc5ec\uc804\ud788 \uac15\uc138. \ubcfc\ud2b8\ud504\ub85c \uc5ec\uc131 \uc2a4\uce74\uc774\ube14\ub8e8 \uc2e0\uaddc \uc785\uace0\u00b7\ud50c\ub7ab \uc2a4\ub2c8\ucee4\uc988 \uc785\uace0\ub410\uc73c\ub098 \ubc18\uc751 \ubbf8\ubbf8. \ub514\ud30c\uc774\uc5b4\u00b7US\uc624\ud508 \ub77c\ucf13 \ubb38\uc758 \uc9c0\uc18d, \uc0c1\uc124 25FW \uc2e0\uaddc \uc785\uace0\ub85c \ud310\ub9e4 \ud65c\uc131\ud654. \ud3ed\uc5fc\u00b7\ud734\uac00\ucca0 \ubcf5\ud569\uc73c\ub85c \uc804 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 1\uc704. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc2a4\ud29c\ub514\uc624 \uc14b\uc5c5 \uc5ec\uc131 20~40\ub300 \ubb34\ud55c \uc560\uc815, \ub0a8\uc131 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \ud3ed\ubc1c\uc801 \ud310\ub9e4'. \ub86f\ub370\uc778\ucc9c '\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc288\ud37c\ub4dc\ub77c\uc774 \ud2f0\uc154\uce20 \ub77c\uc778 \ud310\ub9e4 \uc88b\uc74c, \uc218\uc785 \ube0c\ub77c\ud0d1 TPS51 \ubc18\uc751 \uc9c0\uc18d'. \ub86f\ub370\ubd80\uc0b0 '\ub0a8\ub140 \ubd88\ubb38 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \uc798 \ud314\ub9bc'."},{"tag":"\ubca0\uc2a4\ud2b8","text":"**\uc5ec\uc131 \ubc18\ubc14\uc9c0(\uc62c\ucf54\ud2b8 3\uc1fc\uce20\u00b7\ud53c\ud0a4\uc1fc\uce20)** \ud310\ub9e4 \uac15\uc138 \u2014 \uc2e0\uc138\uacc4\ub300\uc804 '\uc62c\ucf54\ud2b8 3\uc1fc\uce20 \uae30\uc874 \ub300\ube44 \uc0b4\uc9dd \ud06c\uac8c \ub098\uc640 \uccb4\uad6c \uc788\ub294 \uc5ec\uc131 \ub2c8\uc988 \ucda9\uc871, \uae38\uc774\uac10\ub3c4 \uc120\ud638'. \ud604\ub300\ud310\uad50 '\ub370\ube14\uba54\uc26c \uc2a4\ucee4\ud2b8\u00b7\ud53c\ud0a4 \uc81c\ud488 \ud310\ub9e4 \uc88b\uc74c'. \ub86f\ub370\uc7a0\uc2e4 'W263002TPH71 \uc2e0\uc0c1 \ubc18\ubc14\uc9c0 \uad6d\ub0b4 \uace0\uac1d \u591a \uad6c\ub9e4'."},{"tag":"\ud2b9\uc774","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ud074\ub798\uc2dc US\uc624\ud508 \ud310\ub9e4 \uc815\ub9d0 \uc88b\uc74c, \uc5ec\uc131 \uadc0\uc5fd\uace0 \uc608\uc05c \uc5d0\ub514\uc158 \uceec\ub7ec \ud3ed\ubc1c\uc801 \ubc18\uc751'. \ud604\ub300\ubb34\uc5ed 'US\uc624\ud508 \ub77c\ucf13 \ub7f0\uce6d, \uc138\ud2b8 \ucc29\uc7a5 \uad6c\ub9e4 \uc6d0\ud558\ub294 \uace0\uac1d \u591a'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329 V2 \ud310\ub9e4\uc728 \ucd5c\uace0, \uae00\ub85c\uc6b0 \ubc14\uc774\uc800 W \uc5ec\uc131 \uc778\uae30'. \ub86f\ub370\uc758\uc655 '\uac00\ubc29 \uad6c\ub9e4 \ubaa9\uc801 \ubc29\ubb38 \uace0\uac1d \uc99d\uac00'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uc2e0\uc0c1 \uc785\uace0 \ud6a8\uacfc** \u2014 \uc634\ube0c\ub808 \uc2a4\ucee4\ud2b8\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\u00b7\uc2e0\uaddc \ub4c0\uc624\ud50c\ub7a9\u00b7\ubcfc\ud2b8\ud504\ub85c \uc5ec\uc131 \uc2a4\uce74\uc774\ube14\ub8e8\u00b7\ud50c\ub7ab \uc2a4\ub2c8\ucee4\uc988 \ub3d9\uc2dc \uc785\uace0\ub85c \uc2e0\uc0c1 \ud130\uce58 \uc99d\uac00. \ud83d\udcc8 **\uc0c1\uc124 25FW \uc785\uace0** \u2014 \uc0ac\uc774\uba3c\uc5ec\uc8fc\u00b7LF\uad11\uc591 \ub4f1 \ud310\ub9e4 \ud65c\uc131\ud654. \ud83d\udcc9 **\ud3ed\uc5fc\u00b7\ud734\uac00\ucca0 \ubcf5\ud569** \uc804 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 -30~40%, \ub86f\ub370\ucc3d\uc6d0 -\ud3ed\uc5fc \uc8fc\uc758\ubcf4 \uc601\ud5a5, \ub2e4\uc218 \ub9e4\uc7a5 \ud3c9\uc77c \uc785\uc810 \uae09\uac10. \ub098\uc778\uc6d0\ud55c\ub0a8\uc740 \uc7a5\ub9c8 \uc885\ub8cc\ub85c \uc624\ud788\ub824 \uc18c\ud3ed \uc0c1\uc2b9."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (\uc634\ube0c\ub808 \uc2a4\ucee4\ud2b8\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \uc2e0\uc0c1 \ubc18\uc751)","items":[{"tag":"\uc634\ube0c\ub808 \uc2a4\ucee4\ud2b8","text":"**\uc544\uc774\uce90\uce6d \uc88b\uc73c\ub098 \uad6c\ub9e4 \uc804\ud658\uc740 \uc544\uc9c1** \u2014 \uc804\ubc18 '\ud130\uce58\u00b7DP \ub208\uae38\uc740 \ub04c\uc9c0\ub9cc \ucc29\uc6a9 \uc2dc \ubd80\ub2f4\uc2a4\ub7fd\ub2e4'\ub294 \ubc18\uc751. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\ub9cc '\uc608\uc05c \uc0c9\uac10 \uc2e0\uc0c1 \ubb34\uc870\uac74 \ud310\ub9e4\ub428, \uc804\ub7c9 \ud310\ub9e4' \uc608\uc678\uc801 \uae0d\uc815. \uacf5\ud1b5 \uc774\uc288: \u2460 \uae30\uc7a5 \uc9e7\uc74c (\ub2e4\uc218 \ub9e4\uc7a5 '40\ub300 \uc774\uc0c1 \ubd80\ub2f4') \u2461 \ucc29\uc6a9 \uc2dc \ud654\ub824\ud568 \ubd80\ub2f4 \u2462 \uac19\uc774 \uc785\uc744 \ub9e4\uce6d \uc544\uc774\ud15c \ubd80\uc871."},{"tag":"\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774","text":"**\ub0a8\uc131 \ubc18\uc751 \ub354 \uc88b\uc74c** \u2014 \uc2e0\uc138\uacc4\ub300\uc804 '\uae30\uc874 \ub300\ube44 \ub0a8\uc131 \ub9cc\uc871\ub3c4 \uad49\uc7a5\ud788 \ub192\uc74c, \uc62c\ub4dc\ud558\uc9c0 \uc54a\uc544 \ub2e4\uc591\ud55c \uc5f0\ub839\ub300 \ubc18\uc751'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0\u00b7\ub86f\ub370\uc7a0\uc2e4\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ubc18\uc751 \uc88b\uc74c'. \uc5ec\uc131\uc740 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac\ub97c \ud6e8\uc52c \ub354 \uc120\ud638'\ud574\uc11c \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \uc804\ud658 \uc5b4\ub824\uc6c0 (\uc2e0\uc138\uacc4\uac15\ub0a8)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2e0\uc138\uacc4\uac15\ub0a8 \uc634\ube0c\ub808 \uc2a4\ucee4\ud2b8 \ub9e4\uce6d \uc544\uc774\ud15c \ubd80\uc871** \u2014 '\uac19\uc774 \uacc1\ub4e4\uc5ec \uc785\uc744 \uc0c1\ud488 \ubd80\uc871, \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\uac00 \ud4e8\uc5b4\ub4dc\ub77c\uc774\uc600\uc73c\uba74 \uc5b4\ub560\uc744\uae4c' \u2192 \uc14b\uc5c5 \uc5f0\uacc4 \uae30\ud68d \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2e0\uc138\uacc4\uc758\uc815\ubd80\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 \uc2a4\ucee4\ud2b8 \uae30\uc7a5 \uc9e7\uc74c \ud53c\ub4dc\ubc31 \ubc18\ubcf5** \u2014 '\uc5f0\ub839\ub300 \uc788\ub294 \uace0\uac1d \uae30\uc7a5 \ubd80\ub2f4' \u2192 \ucc28\uae30 \uae30\uc7a5 \ub2e4\uc591\ud654 \uae30\ud68d \ubc18\uc601"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uc778\ucc9c '3LTS71 \ud558\ub2e8 \ub760 \ud3ec\uc778\ud2b8 \ub108\ubb34 \uac70\uc2ac\ub824 \uad6c\ub9e4 \uc548 \ud558\ub294 \uacbd\uc6b0 \uc885\uc885 \ubc1c\uc0dd'. \uc2e0\uc138\uacc4\uc13c\ud140 '\uc778\uae30 \uc0c1\ud488 \uc0ac\uc774\uc988 \uae68\uc9d0 + \uc2dc\uc98c\ubc18\ud488\uc73c\ub85c \ub9e4\uc7a5 \ube44\uc5b4\uc788\uc5b4 \ud310\ub9e4 \uc5b4\ub824\uc6c0'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud53c\ucf00\ud2f0\uc154\uce20\ub958 \uc218\uc694 \uc0c8\ub85c \uc0dd\uae40, \uc218\uc785 \uc6d0\ub2e8 \uc120\ud638'."},{"tag":"\uc81c\uc548","text":"\uc544\uc774\ud30c\ud06c '\uc2a4\ud29c\ub514\uc624 \ub808\uc774\uc5b4\ub4dc 2\uac00\uc9c0 \uceec\ub7ec \uc544\uc26c\uc6c0, \ubc8c\ub8ec \uc2a4\ud0c0\uc77c \uadf8\ub85c\ube0c \ucf5c\ub77c\ubcf4 \uac19\uc740 \uc81c\ud488 \ucd9c\uc2dc \uc2dc \ub354 \ube60\ub978 \ubc18\uc751 \uc608\uc0c1'. \ucee4\ub125\ud2b8\uccad\uc8fc '3~40\ub300 \uace0\uac1d\ub4e4\uc774 \uceec\ub7ec\u00b7\ud54f \ubd80\ub2f4 \ub290\ub07c\ub294 \uace0\uac1d \ub298\uc5b4\ub098\ub294 \ucd94\uc138 \u2014 \uae30\ubcf8 \uc2a4\ud0c0\uc77c \ube44\uc911 \ud655\ub300 \ud544\uc694'."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ub4dc\ub85c\uc6b0 \uc5d0\uc5b4\u00b7\uc5d0\uc5b4\uc18c\ud504\ud2b8 vs \uc2e0\uaddc \ub4c0\uc624\ud50c\ub7a9 \ubc18\uc751)","items":[{"tag":"\ub4dc\ub85c\uc6b0\uc5d0\uc5b4 vs \uc5d0\uc5b4\uc18c\ud504\ud2b8","text":"**\uc5d0\uc5b4 > \uc5d0\uc5b4\uc18c\ud504\ud2b8 \uc120\ud638** \u2014 \uacf5\ud1b5 \uc758\uacac: '\uac00\uaca9 \ucc28\uc774\uc5d0 \ube44\ud574 \ub514\uc790\uc778 \ucc28\uc774 \uc5c6\uace0, \uc5d0\uc5b4\uc18c\ud504\ud2b8\uac00 \uc5ec\ub984\uc5d0 \ub354 \ubb34\uac81\uace0 \ub205\uc9c4\ud55c \ub290\ub08c'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uace0\uac1d\uc774 \ub450 \uc18c\uc7ac \ud06c\uac8c \uad6c\ubd84 \ubabb\ud568, \uad73\uc774 \ub450 \uac00\uc9c0 \uc18c\uc7ac \uac19\uc774 \ub9cc\ub4e4 \ud544\uc694 \uc5c6\uc744 \uac83 \uac19\uc74c' \uac15\ud55c \uc758\uacac. \uc5d0\uc5b4 8: \uc18c\ud504\ud2b8 2 \ube44\uc911 (\uc544\uc774\ud30c\ud06c)."},{"tag":"\uc2e0\uaddc\ub4c0\uc624\ud50c\ub7a9","text":"**\uc2e0\uaddc \ub4c0\uc624\ud50c\ub7a9 \uae30\uc874 \ub300\ube44 \ubc18\uc751 \ud655\uc2e4\ud788 \uc88b\uc74c** \u2014 \ud575\uc2ec \uc774\uc720: \u2460 \uc2e0\ubc1c \ubd84\ub9ac \uc218\ub0a9 \uacf5\uac04 \ucd94\uac00 \u2461 \uc0c9\uc0c1 \ub2e4\uc591\ud654 \u2462 \uc6d0\ub2e8 \uac1c\uc120. \ub86f\ub370\uc7a0\uc2e4 '\ud14c\ub2c8\uc2a4 \uc2e4 \uad6c\ub9e4 \uace0\uac1d \ub354 \uc88b\ub2e4\ub294 \uc758\uacac, \uceec\ub7ec \ud6e8\uc52c \uc88b\uc74c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31\ub3c4 \ub77c\ucf13 \ub123\uc73c\uba74 \uc774\uc05c \uc250\uc785 \u2014 \ud310\ub9e4 \uc88b\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ub178\ub780\uc0c9 \uc0c9\uc0c1 \uc608\uc058\ub2e4 \ubc18\uc751 \u591a'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 \uc5d0\ubcfc\ub8e8\uc158\u00b7\ucee4\ub9ac \uc7ac\uace0 \ubd80\uc871** \u2014 '\ucee4\ub9ac \ubd80\uc871\ud569\ub2c8\ub2e4' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0 '\uc2e0\uaddc \ub4c0\uc624\ud50c\ub7a9 \uc790\uc11d \uc7a0\uae08 \ubc29\uc2dd \uc57d\ud558\uc9c0 \uc54a\ub098 \uc6b0\ub824\ud558\ub294 \uace0\uac1d \uac04\ud639 \uc788\uc74c'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ub4dc\ub85c\uc6b0 \uc5d0\uc5b4\u00b7\uc5d0\uc5b4\uc18c\ud504\ud2b8 V1\u00b7V2\ub9cc\ud07c \ubc18\uc751 \uc5c6\uc74c, \uc5d0\uc5b4\uc18c\ud504\ud2b8 \uc544\uc9c1 \ubbf8\ubbf8'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc5d0\uc5b4\uc18c\ud504\ud2b8 \uc6d0\ub2e8 \ud750\ubb3c\uac70\ub9b0\ub2e4\ub294 \ud53c\ub4dc\ubc31'."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\ubcfc\ud2b8\ud504\ub85c W \uc2e0\uaddc\u00b7\ud50c\ub7ab \uc2a4\ub2c8\ucee4\uc988 \ubc18\uc751)","items":[{"tag":"\ubcfc\ud2b8\ud504\ub85cW \uc2a4\uce74\uc774\ube14\ub8e8","text":"**\uc785\uace0 \ucd08\uae30\ub77c \ud130\uce58 \uc704\uc8fc, \uad6c\ub9e4 \uc804\ud658 \uc9c0\ucf1c\ubd10\uc57c** \u2014 \uc5b4\ud37c \uceec\ub7ec \ucc28\uc774\ubcf4\ub2e4 \uc804\uccb4 \uc0c9\uac10(\uadf8\ub9b0 vs \ube14\ub8e8)\uc774 \uad6c\ub9e4 \uacb0\uc815\uc5d0 \ub354 \uc601\ud5a5. \ud654\uc774\ud2b8\uadf8\ub9b0 \uc120\ud638 \uc6b0\uc138. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ube14\ub8e8\ub97c \ub0a8\uc131\uc774 \ub354 \uc120\ud638'. \uc2e0\uc138\uacc4\uc13c\ud140 '\uc678\uad6d\uc778 \uc5ec\uc131 \ubc18\uc751 \uc88b\uc74c'. \ub098\uc778\u0010\ud55c\ub0a8 '\uc62c \ud654\uc774\ud2b8\u00b7\uc2ec\ud50c \ub514\uc790\uc778 \ucc3e\ub294 \uace0\uac1d \u591a'."},{"tag":"\ud50c\ub7ab\uc2a4\ub2c8\ucee4\uc988","text":"**\uc804\ubc18 \ubc18\uc751 \ubbf8\ubbf8** \u2014 \ub2e4\uc218 \ub9e4\uc7a5 '\ud130\uce58 \uc5c6\uc74c \ub610\ub294 \uc544\uc8fc \ubbf8\ubbf8'. \uc774\uc720: \u2460 \ud14c\ub2c8\uc2a4\ud654\uac00 \uc544\ub2c8\ub77c\ub294 \uc778\uc2dd \u2461 \uc5ec\ub984\ucca0 \ub354\uc6cc \ubcf4\uc784 \u2462 \uac00\uaca9 \uc800\ud56d. \uc608\uc678: \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud14c\ub2c8\uc2a4\ucf54\uc5b4 \uce90\uc8fc\uc5bc \uace0\uac1d\uce35\uc774 \ub9ce\uc774 \uc548 \uc640\uc11c \uc544\uc26c\uc6c0'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 '\ud130\uce58\ub294 \uc788\uc73c\ub098 \uad6c\ub9e4 \ubbf8\uc5f0\uacb0'. \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uace0\uac1d\uce35\uc5d0\uc11c \uc18c\ud3ed \ubc18\uc751 (\ub354\ud604\ub300\uc11c\uc6b8)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc544\uc774\ud30c\ud06c \ubcfc\ud2b8\ud504\ub85c 1.5 \uadf8\ub9b0 \ubc18\ud488 \ud6c4 \ub300\uccb4 \uc0c1\ud488 \ubd80\uc7ac** \u2014 '\ucf54\ud2b8\uae00\ub77c\uc774\ub4dc\ub85c \ud310\ub9e4 \uc804\ud658 \uc911, \ub0a8\uc131 \uadf8\ub9b0 \uc120\ud638\ub3c4 \ub192\uc544 \uc7ac\uace0 \ud655\ubcf4 \ud544\uc694'"},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ubcfc\ud2b8\ud504\ub85c \uadf8\ub9b0 \uc0ac\uc774\uc988 \uc5c6\uc5b4\uc11c \ubabb \uc0ac\uac00\ub294 \uace0\uac1d \u591a'. \ub86f\ub370\uc778\ucc9c '\ud50c\ub7ab \uc2a4\ub2c8\ucee4\uc988 \ud22c\ud1a4\ubcf4\ub2e4 \uadf8\ub77c\ub370\uc774\uc158 \ud3ec\uc778\ud2b8 \ubc18\uc751 \uc88b\uc74c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub7ec\uc26c\ud22c\uc5b4 \uad6c\ub9e4 \uace0\uac1d \ub9e4\uc7a5 \ubc29\ubb38 \uc9c0\uc18d, \ud14c\ub2c8\uc2a4 \uad6c\ub825 \uc788\ub294 \uace0\uac1d \uc704\uc8fc'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \uc9c0\uc18d\u00b7US\uc624\ud508 \uc2e0\uaddc \uc785\uace0)","items":[{"tag":"US\uc624\ud508 \ub7f0\uce6d","text":"**\ud074\ub798\uc2dc US\uc624\ud508 \ub7f0\uce6d** \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5ec\uc131 \uace0\uac1d \uadc0\uc5fd\uace0 \uc608\uc05c \uc5d0\ub514\uc158 \uceec\ub7ec \ud3ed\ubc1c\uc801 \ubc18\uc751, \ud074\ub798\uc2dc US\uc624\ud508 \ud310\ub9e4 \uc815\ub9d0 \uc88b\uc74c'. \ub354\ud604\ub300\uc11c\uc6b8\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 'US\uc624\ud508 \ud130\uce58\uc728 \uc0dd\uae30\ub294 \uc911'. \ub86f\ub370\uc778\ucc9c '\ubbf8\uc785\uace0\ub85c \ud310\ub9e4 \ub85c\uc2a4 \ubc1c\uc0dd' \u2192 \ubbf8\uc785\uace0 \ub9e4\uc7a5 \ud655\uc778 \ud544\uc694."},{"tag":"\ub514\ud30c\uc774\uc5b4\ubb38\uc758","text":"**\ub514\ud30c\uc774\uc5b4 \uc7ac\uc785\uace0 \ubb38\uc758 \uc5ec\uc804\ud788 \u591a** \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub0a8\uc131 \ub514\ud30c\uc774\uc5b4\ub9cc \uace0\uc9d1, \ube14\ub808\uc774\ub4dc\u00b7RF\ub85c \uc751\ub300 \uc911 \ubbf8\ubd88\uc608\uc57d \uc218\uc2ed \uac74'. \ub86f\ub370\uae30\ud765 '265\u00b7285 \uc785\uace0, 300\u00b7305 \uc7ac\uc785\uace0 \ub300\uae30 \uc5f0\ub77d\ucc98 \ub0a8\uaca8\ub460'. \uc2e0\uc138\uacc4\ub300\uc804 '98PRO\u00b7100 \uc7ac\uc785\uace0\uc77c \ubb38\uc758 1\uc704, \uc5ec\uc131 \uc2a4\ud399 \ubb38\uc758 \uae09\uc99d'. \ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \uac10\uc18c \ub9e4\uc7a5: \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '6\uc6d4\ubcf4\ub2e4 \uc904\uc5b4\ub4e0 \ub290\ub08c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud074\ub798\uc2dc US\uc624\ud508 \ubbf8\uc785\uace0 \ub9e4\uc7a5 \ud310\ub9e4 \ub85c\uc2a4** (\ub86f\ub370\uc778\ucc9c\u00b7\uc544\uc774\ud30c\ud06c) \u2014 \uc785\uace0 \uc77c\uc815 \ud655\uc778 \ubc0f \ubc30\ubd84 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc0ac\uc774\uba3c\ud30c\uc8fc '\uc0c1\uc124 \ub77c\ucf13 \ud310\ub9e4 \uc88b\uc74c, \ube14\ub808\uc774\ub4dc V9 \ucd9c\uace0 \uc2dc \ud310\ub9e4 \uae09\uc99d \uc608\uc0c1'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\uc0c1\uc124 \ub77c\ucf13 50% \uc0c1\ud488\uc774 \uad6c\ub9e4 \uc758\uc0ac \uc5c6\ub358 \uace0\uac1d\ub3c4 \uad6c\ub9e4 \uc720\ub3c4'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ubb34\ub354\uc704\ub85c \ub3d9\ud638\ud68c \ub77c\ucf13 \uad6c\ub9e4 \uc218\uc694 \uc904\uc5b4\ub4e6'. \ube14\ub808\uc774\ub4dc V10 \uafb8\uc900 \ud310\ub9e4 \uc720\uc9c0."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc548\uc815\uc801 \ud310\ub9e4. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud559\uc0dd\ub4e4\uc774 \ub9e4\uc7a5\uc5d0\uc11c \ub18d\uad6c\uacf5 \ubb18\uae30 \ubd80\ub9ac\ub2e4 \ub300\ubd80\ubd84 \uad6c\ub9e4, \ub113\uc740 \uacf5\uac04\uacfc \uc811\uadfc\uc131\uc774 \ud575\uc2ec'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc2a4\ud14c\ud310\ucee4\ub9ac \uc0ac\uc778\ubcfc\u00b7\ud4e8\uc5b4\uc0f7 \uc704\uc8fc \ud310\ub9e4, \uc5d0\ubcfc\ub8e8\uc158 \ud130\uce58 \ub192\uc74c'. \uc544\uc774\ud30c\ud06c '\uc2e0\uc0c1 \ub18d\uad6c\uacf5 \uc785\uace0 \ud6c4 \ubcfc\ud0c0\uc6cc \ud658\uae30, \uc8fc\ub9d0 \uac00\uc871 \ub2e8\uc704 \ud310\ub9e4 \uc88b\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 \uc5d0\ubcfc\ub8e8\uc158\u00b7\ucee4\ub9ac \uc7ac\uace0 \ubd80\uc871** \u2192 \uc7ac\uace0 \ud655\uc778\u00b7\ubcf4\ucda9 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\ub3d9\ubd80\uc0b0 '\ub808\ud2b8\ub85c\uc2dc\ud2f0 \uc7ac\uace0 \uc788\uc73c\uba74 \uc88b\uaca0\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5d0\ubcfc\ub8e8\uc158 \ub2e4\uc591\ud55c \uceec\ub7ec \ud544\uc694'. \ub86f\ub370\uae30\ud765 '\uc88c\ud22c\uc6a9 \uae00\ub7ec\ube0c\u00b7\uc131\uc778 \uc800\uac00 \uae00\ub7ec\ube0c\u00b7A360 \uc785\uace0 \ubb38\uc758 \uafb8\uc900'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\uc0c1\uc124 \uae00\ub7ec\ube0c \uc785\uace0 \ud6c4 \ub300\uae30 \uace0\uac1d \uad6c\ub9e4'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud569\uc131\uac00\uc8fd \ub808\ud2b8\ub85c\ubcfc \uc788\uc744 \ub54c \ucda9\ub3d9\uad6c\ub9e4 \ub9ce\uc558\uc73c\ub098 \uace0\ubb34 \uc544\uc6c3\ub3c4\uc5b4 \ub808\ud2b8\ub85c\ubcfc\uc740 \ubc18\uc751 \ubbf8\ubbf8'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669 (25FW \uc2e0\uaddc \uc785\uace0 \ud6c4 \ubc18\uc751)","items":[{"tag":"25FW\uc785\uace0\ud6a8\uacfc","text":"**25FW \uc2e0\uaddc \uc785\uace0 \ud6c4 \ud310\ub9e4 \ud65c\uc131\ud654** \u2014 \ucee4\ub125\ud2b8\uccad\uc8fc '7\uc6d4 \uc0c1\uc124 TOP5 \uc804\ubd80 25FW, 25SS\ub294 \uc778\uae30 \uc0ac\uc774\uc988\u00b7\uceec\ub7ec \ubaa8\ub450 \uc18c\uc9c4'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '25FW \ubc18\ud314\u00b7\uc2a4\ucee4\ud2b8\u00b7\ubc18\ubc14\uc9c0 \ubc18\uc751 \ub9e4\uc6b0 \uc88b\uc74c, \ud310\ub9e4 \ub9ce\uc774 \uc774\uc5b4\uc9d0'. LF\uad11\uc591 '25FW \ub514\uc790\uc778 25SS \ub300\ube44 \uace0\uac1d \ubc18\uc751 \ub354 \uae0d\uc815\uc801, \uc0ac\uc774\uc988 \uad6c\uc131 \ub2e4\uc591'. \ub86f\ub370\uae30\ud765 '\uc77c\ubc18 \uace0\uac1d \ube44\uc911 \uc18c\ud3ed \uc0c1\uc2b9'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **25SS \uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31 \uc9c0\uc18d** (\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\uc0ac\uc774\uba3c\ubd80\uc0b0) \u2014 '\uc5ec\uc131 \ud2f0\uc154\uce20\u00b7\ub0a8\uc131 M\u00b7L\u00b7\ud558\ud504\ud32c\uce20 M\u00b7L \uc5ec\uc804\ud788 \ubd80\uc871' \u2192 \ucd94\uac00 \ubc30\ubd84 \ub610\ub294 25FW \uc720\ub3c4 \ub300\uc751"},{"tag":"\uc774\uc288","text":"\ud604\ub300\ub300\uc804 'FW\ub77c\uc778 \ud130\uce58 \uc544\uc9c1 \ub35c, SS\ub294 \uc0ac\uc774\uc988 \ud488\uc808\ub85c \ud310\ub9e4 \uc5b4\ub824\uc6c0'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '25FW \ub300\ubb3c\ub7c9 \uc785\uace0 \ud589\uc0ac \uc9c4\ud589, \uc644\ubd88 \uc8fc\ubb38 \ud6c4 \ubc29\ubb38 \uace0\uac1d\ub3c4 \uc788\uc74c'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\ud3ed\uc5fc\u00b7\ud734\uac00\ucca0 \ubcf5\ud569\uc73c\ub85c \uc804 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c** \u2014 \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 -30~40%, \ub86f\ub370\ucc3d\uc6d0 '39\ub3c4 \ud3ed\uc5fc\uc8fc\uc758\ubcf4\ub85c \ud3c9\uc77c\u00b7\uc8fc\ub9d0 \uc785\uc810 \uac10\uc18c', \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ube48\uc190 \ub77c\uc6b4\ub529 80% \uc774\uc0c1'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc80a\uc740 \ucee4\ud50c \ub9e4\uc7a5 \uc720\uc785\uc740 \uc788\uc73c\ub098 \uc18c\ube44 \uc804\ud600 \uc5c6\uc74c, \uc8fc\uc2dd\uc2dc\uc7a5 \uacf5\ud3ec\uc9c0\uc218 \uc608\uc0c1'."},{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc8 **\uc0c1\uc2b9 \ub9e4\uc7a5**: \ub86f\ub370\ubd80\uc0b0 '\ud3ec\ucf13\ubaac \ud31d\uc5c5\u00b7\ub7f0\ub358\ubca0\uc774\uae00 \uc624\ud508\uc73c\ub85c \ubc31\ud654\uc810 \uc785\uc810\u00b7\uc77c\ubc18 \uace0\uac1d \ubc29\ubb38 \uae09\uc99d'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc2a4\ud30c\uc774\ub354\ub9e8 \ud31d\uc5c5 + \uc9c0\ud558 \ud31d\uc5c5 \uc9c0\uc18d \uc5c5\ub370\uc774\ud2b8\ub85c \uafb8\uc900\ud55c \ubc29\ubb38 \uc720\ub3c4'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\uc7a5\ub9c8 \uc885\ub8cc\ub85c \uc785\uc810\u00b7\ud310\ub9e4 \uc804\uc8fc \ub300\ube44 \uc0c1\uc2b9'. \ub86f\ub370\uc778\ucc9c '\ud06c\ub8e8\uc988 \uc154\ud2c0\ubc84\uc2a4 8\uc6d4 \uc2dc\ubc94\uc6b4\ud589\uc73c\ub85c \uc678\uad6d\uc778 \uae09\uc99d'."},{"tag":"\ub3d9\ud5a5","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ub77c\ucf13 \uad6c\ub9e4 \uace0\uac1d \uc758\ub958\u00b7\uac00\ubc29 \uc5f0\uacc4 \uad6c\ub9e4 \u591a, \ud53c\ud305\ub8f8 \ud56d\uc0c1 \uaf49 \ucc28 \uace0\uac1d \ubd88\ub9cc'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '\uc7a5\ub9c8 \uc885\ub8cc \ud6c4 \ud2b8\ub798\ud53d \uc0c1\uc2b9, \ud310\ub9e4 \ubd84\uc704\uae30 \uac1c\uc120'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ubb34\ub354\uc704\u00b7\ud734\uac00\u00b7\uc8fc\uc2dd \ud558\ub77d \ubcf5\ud569, 3~40\ub300 \ub2e8\uace8 \uace0\uac1d \ud54f\u00b7\uceec\ub7ec \ubd80\ub2f4 \ub298\uc5b4\ub098\ub294 \ucd94\uc138'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ud0c0 \ube0c\ub79c\ub4dc \ud589\uc0ac\ub85c \ud560\uc778 \ubb38\uc758 \uc99d\uac00'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\ud14c\ub2c8\uc2a4\ud654 50~60% \ud560\uc778\uc728 \uacbd\uc7c1\uc0ac \ud589\uc0ac\ub85c \uad6c\ub9e4 \uc720\uc785'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc678\uad6d\uc778\ub3c4 \uc9c0\uac11 \uc548 \uc5ec\ub294 \uc0c1\ud669, \uc804\ubc18 \uc18c\ube44 \uc704\ucd95 \uc2ec\ud654'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc634\ube0c\ub808 \uc2a4\ucee4\ud2b8 \ub9e4\uce6d \uc544\uc774\ud15c \ubd80\uc871\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \uc14b\uc5c5 \uc5f0\uacc4 \uae30\ud68d \uac80\ud1a0","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uc14b\uc5c5 \uc5f0\uacc4 \uae30\ud68d \uac80\ud1a0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc2a4\ucee4\ud2b8 \uae30\uc7a5 \uc9e7\uc74c \ud53c\ub4dc\ubc31 \ubc18\ubcf5 \u2014 \uc5f0\ub839\ub300 \uc788\ub294 \uace0\uac1d \ubd80\ub2f4","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 \ub4f1","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucc28\uae30 \uae30\uc7a5 \ub2e4\uc591\ud654 \uae30\ud68d \ubc18\uc601"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ud074\ub798\uc2dc US\uc624\ud508 \ubbf8\uc785\uace0 \ub9e4\uc7a5 \ud310\ub9e4 \ub85c\uc2a4","\ub9e4\uc7a5":"\ub86f\ub370\uc778\ucc9c\u00b7\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc77c\uc815 \ud655\uc778\u00b7\ubc30\ubd84"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ubcfc\ud2b8\ud504\ub85c 1.5 \uadf8\ub9b0 \ubc18\ud488 \ud6c4 \ub0a8\uc131 \uadf8\ub9b0 \ub300\uccb4 \uc0c1\ud488 \ubd80\uc7ac","\ub9e4\uc7a5":"\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\ubcf4 \ud544\uc694"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ubcfc\ud2b8\ud504\ub85c \uadf8\ub9b0 \uc0ac\uc774\uc988 \uc5c6\uc5b4 \uad6c\ub9e4 \uc774\ud0c8","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399 \ubb38\uc758 \uae09\uc99d \u2014 \ucd9c\uc2dc \uc77c\uc815 \uacf5\uc720 \ud544\uc694","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\ub300\uc804\u00b7\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0 \ub4f1","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uc5ec\uc131 \uc2a4\ud399 \ucd9c\uc2dc \uc77c\uc815 \uc989\uc2dc \uacf5\uc720"},{"\uad6c\ubd84":"\ud300\uc2a4\ud3ec\uce20","\ub0b4\uc6a9":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ucee4\ub9ac \uc7ac\uace0 \ubd80\uc871","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778\u00b7\ubcf4\ucda9"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"25SS \uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31 \uc9c0\uc18d \u2014 \uc5ec\uc131\u00b7\ub0a8\uc131 M\u00b7L \ubd80\uc871","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\uc0ac\uc774\uba3c\ubd80\uc0b0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucd94\uac00 \ubc30\ubd84 \ub610\ub294 25FW \uc720\ub3c4 \ub300\uc751"}]}},"8\uc6d41W":{"date":"08/03~08/09","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \ubc18\ud314 \uc804 \ub9e4\uc7a5 1\uc704, \ub354\ube14\uba54\uc26c \uc634\ube0c\ub808\u00b7\uc0ac\uc774\ub4dc\uc154\ub9c1 \uc2e0\uc0c1 \ubc18\uc751 \uae0d\uc815\uc801. \ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8\u00b7\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504 \uc785\uace0\ub410\uc73c\ub098 \uc804\ubc18 \ubc18\uc751 \uc544\uc9c1 \uc9c0\ucf1c\ubd10\uc57c. \ub514\ud30c\uc774\uc5b4 100L\u00b7100UL \ucd9c\uc2dc\uc77c \uc55e\ub2f9\uaca8\uc9d0 \u2014 \uc608\uc57d \ubb38\uc758 \uae09\uc99d. \ud3ed\uc5fc+\ud734\uac00\ucca0+\uc18c\ube44\uc2ec\ub9ac \uc704\ucd95 \ubcf5\ud569 \uc785\uc810 \uac10\uc18c, \uc804\ub144 \uc774\uc288 \uc0c1\ud488(\uc0b0\ub9ac\uc624\u00b7\uc6b8\ud2b8\ub77c) \ubd80\uc7ac \uccb4\uac10 \u591a.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 1\uc704. \uc2e0\uc138\uacc4\ub300\uc804 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc2e0\uc0c1 \uc0ac\uc774\ub4dc\uc154\ub9c1 \ud130\uce58\uc728\u00b7\ud310\ub9e4\uc728 \uac00\uc7a5 \ub192\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329\uc774 \uc77c\ubc18 \uace0\uac1d(60%)\uae4c\uc9c0 \uad6c\ub9e4\uce35 \ud655\uc7a5'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5ec\uc131 \uc218\uc785\ub958 \uc2e0\uc0c1 \ubc18\uc751 \uad49\uc7a5\ud788 \uc88b\uc74c, \ud0d1\uc2a4\ud540\ud3f4\ub85c\u00b7\uc6d0\ud53c\uc2a4\u00b7US\uc624\ud508 \uc5d0\ub514\uc158 \ud3ed\ubc1c\uc801'."},{"tag":"\ud2b9\uc774","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5ec\uc131 \ub18d\uad6c \ub3d9\ud638\uc778\u00b7\ud559\uc0dd \ub18d\uad6c\ubd90\uc73c\ub85c \ud300\uc2a4\ud3ec\uce20 \uc218\uc694 \uae09\uc99d'. \ud604\ub300\ud310\uad50 '\uc5d0\uc5b4\ubaa8\uc158 \ucea0\ud504\ucea1 \uc9c0\uc18d \ud310\ub9e4, \ud5e4\uc5b4\ubc34\ub4dc\u00b7\uc190\ubaa9\ubcf4\ud638\ub300 \uc7ac\uad6c\ub9e4'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329 \uc77c\ubc18 \uace0\uac1d \uad6c\ub9e4 \ube44\uc911 60%\ub85c \uc5ed\uc804'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 \uc2e0\uc0c1 \uc785\uace0 \ud6a8\uacfc \u2014 \ub354\ube14\uba54\uc26c \uc634\ube0c\ub808\u00b7\uc0ac\uc774\ub4dc\uc154\ub9c1\u00b7\ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8\u00b7\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504 \ub3d9\uc2dc \uc785\uace0. \ud83d\udcc8 \ub514\ud30c\uc774\uc5b4 \ucd9c\uc2dc\uc77c \uc55e\ub2f9\uaca8\uc9d0 \u2014 \uc608\uc57d \ubb38\uc758 \uae09\uc99d. \ud83d\udcc9 \ud3ed\uc5fc+\ud734\uac00\ucca0+\uc18c\ube44\uc2ec\ub9ac \uc704\ucd95 \ubcf5\ud569 \uc804 \ub9e4\uc7a5 \uc785\uc810 \uac10\uc18c. \uc2e0\uc138\uacc4\ub300\uc804 '\uc804\ub144 \ub300\ube44 \uc785\uc810 30~40% \uac10\uc18c'. \ud83d\udcc9 \uc804\ub144 \uc774\uc288 \uc0c1\ud488 \ubd80\uc7ac \u2014 \ub86f\ub370\uc7a0\uc2e4\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc791\ub144 \uc0b0\ub9ac\uc624\u00b7\uc6b8\ud2b8\ub77c \ucf5c\ub77c\ubcf4 \uc774\uc288 \uc5c6\uc5b4 \uccb4\uac10 \ucc28\uc774 \ud07c'."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\uc2e0\uc0c1 \ubc18\uc751","text":"\ub354\ube14\uba54\uc26c \uc634\ube0c\ub808 \ube14\ub799\u00b7\ub77c\uc784 \ubc18\uc751 \uc88b\uc74c. \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \uc785\uace0 \uc989\uc2dc \ud130\uce58\uc728 \ub192\uc74c, \ub2e4\uc591\ud55c \uc5f0\ub839\ub300 \uc5b4\ud544. \uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\uc2e0\uc138\uacc4\ub300\uc804\u00b7\ub354\ud604\ub300\uc11c\uc6b8 \uacf5\ud1b5 \uae0d\uc815."},{"tag":"\uc774\uc288","text":"\uc5ec\uc131 \uc2a4\ucee4\ud2b8 \uae30\uc7a5 \uc9e7\uc74c \uc774\uc288 \uc9c0\uc18d. \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \uc5ec\uc131 \ubc18\uc751: \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac \uc120\ud638\ub85c \uc804\ud658. \ub0a8\uc131 \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\ub294 \uc804\ubc18 \ud638\ud3c9."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f \uc0ac\uc774\uba3c\ubd80\uc0b0\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc \ub0a8\uc131 M\u00b7L \uc0ac\uc774\uc988 \uacf5\ubc31 \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\uc548\ub0b4\ud544\uc694","text":"\ud83d\udccc \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758 \u2192 FW \uc2e0\uc0c1 S\u00b7M \uc0ac\uc774\uc988 \ud655\ub300 \uc608\uc815 \uc548\ub0b4"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\uc2e0\uc0c1\ubaa8\uc790","text":"\uc5d0\uc5b4\ubaa8\uc158 \ucea0\ud504\ucea1\u00b7\ub77c\uc774\ud2b8\ubaa8\uc158\ucea1 \uac15\uc138 \uc720\uc9c0. \uc2e0\uc0c1 \ubaa8\uc790\ub294 \uac00\uc744 \uceec\ub7ec\uac10\uc774\ub77c \ud14c\ub2c8\uc2a4 \uace0\uac1d \ubc18\uc751 \uc544\uc9c1 \ubbf8\ubbf8. \ud604\ub300\uc911\ub3d9 '\ube0c\ub77c\uc6b4 \uceec\ub7ec \ubc18\uc751 \ub728\uac70\uc6cc\uc9c0\ub294 \uc911'."},{"tag":"\ubc34\ub4dc","text":"\uc2e0\uc0c1 \ubc34\ub4dc\ub958 \uceec\ub7ec\u00b7\ub514\uc790\uc778 \ud638\ud3c9. \uc544\uc774\ud30c\ud06c\u00b7\uc2e0\uc138\uacc4\uad11\uc8fc\u00b7\ub86f\ub370\uae30\ud765 '\uceec\ub7ec \ub2e4\uc591\ud654\ub85c \uc758\ub958 \uc5f0\uacc4 \ud310\ub9e4 \uc218\uc6d4'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 \ub0a8\uc131 \ud22c\uc5b4\ubc31 \ubb38\uc758 \uc99d\uac00 \u2192 \uc7ac\uace0 \ud655\uc778 \ud544\uc694"}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8","text":"\uc785\uace0 \ucd08\ubc18 \uc9c0\ucf1c\ubd10\uc57c. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '2~30\ub300 \ud765\ubbf8, 30\ub300 \uc774\uc0c1 \ub0c9\uc18c\uc801'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\ucc29\uc6a9 \ud6c4 \uceec\ub7ec\uac10\u00b7\ud3b8\uc548\ud568 \ub9cc\uc871\ub3c4 \ub192\uc74c'."},{"tag":"\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504","text":"\ud074\ub808\uc774\u00b7\uc778\uc870\uc794\ub514 \uc218\uc694 \ucda9\uc871 \uae0d\uc815\uc801. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud074\ub808\uc774\ud654 \ubd80\uc7ac \ucc44\uc6cc\uc90c'. \uc2e0\uc138\uacc4\uc13c\ud140 '\ud074\ub808\uc774\ucf54\ud2b8\uc6a9 \ucd94\ucc9c\uc73c\ub85c \ud310\ub9e4'. \ub2e4\uc218 \ub9e4\uc7a5 '\uc544\uc9c1 \ud070 \ubc18\uc751 \uc5c6\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f \uc2e0\uc138\uacc4\uac15\ub0a8 \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ud310\ub9e4\uc728 \uc9c0\uc18d \ud558\ub77d \u2192 \ud310\ub9e4 \uc804\ub7b5 \uac80\ud1a0"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \ucd9c\uc2dc\uc77c \uc55e\ub2f9\uaca8\uc9d0)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4","text":"100L\u00b7100UL \ucd9c\uc2dc\uc77c \uc55e\ub2f9\uaca8\uc9d0 \u2014 \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ub86f\ub370\uae30\ud765\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \uc608\uc57d \uc5f0\ub77d\ucc98 \ub4f1\ub85d \u591a. \uc2e0\uc138\uacc4\ub300\uc804 '100L\u00b7100UL \uc785\uace0\uc77c\u00b7\uc608\uc57d \ubb38\uc758 \ub9e4\uc6b0 \ub9ce\uc74c'. US\uc624\ud508 \uc5d0\ub514\uc158 \uc2e0\uc138\uacc4\uac15\ub0a8 \ud3ed\ubc1c\uc801 \ubc18\uc751."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f \ub514\ud30c\uc774\uc5b4 \ucd9c\uc2dc \uc77c\uc815 \ubc0f \uc2a4\ud399 \uacf5\uc720 \ud544\uc694 \u2014 \uc5ec\uc131 \uc2a4\ud399 \ucd9c\uc2dc \uc77c\uc815 \uc989\uc2dc \uacf5\uc720"},{"tag":"\uc774\uc288","text":"\ube14\ub808\uc774\ub4dc V10 \uafb8\uc900 \ud310\ub9e4. \uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 290g \uc774\ud558 \uc7ac\uace0 \uc804\ubb34 \ud310\ub9e4 \ubd88\uac00 \u2192 \uc785\uace0 \uc2dc\uae09."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc548\uc815\uc801 \ud310\ub9e4. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5ec\uc131 \ub18d\uad6c \ub3d9\ud638\uc778\u00b7\ud559\uc0dd \ub18d\uad6c\ubd90, \uc5d0\ubcfc\ub8e8\uc158\ub9cc \uace0\uc9d1'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ub18d\uad6c\uacf5 \ud310\ub9e4 \uad49\uc7a5\ud788 \uc88b\uc74c'. \uc544\uc774\ud30c\ud06c '\uc778\uc2a4\ud0c0 \ub9b4\uc2a4 \ud1b5\ud55c DM \ubb38\uc758 \uc99d\uac00'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '\uac00\uaca9 \uc800\ud56d \uc5c6\uc74c, \ud560\uc778 \uba85\ubd84\ub9cc \uc788\uc73c\uba74 \uad6c\ub9e4'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc0ac\uc774\uc988 \ubd80\uc871\uc73c\ub85c \uc815\uc0c1 \uc0c1\ud488 \uc720\ub3c4'. \ub86f\ub370\uc758\uc655 '\uc758\ub958 \uad6c\ub9e4 \ud6c4 \uc0ac\uc774\uc988 \uc5c6\uc73c\uba74 \uc815\uc0c1 \uc5f0\uacc4 \uad6c\ub9e4'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ub86f\ub370\uae30\ud765\u00b7\ub86f\ub370\uc758\uc655 \uc0c1\uc124 \uc0ac\uc774\uc988 \uacf5\ubc31 \uc9c0\uc18d \u2192 \ucd94\uac00 \ubc30\ubd84 \uac80\ud1a0"}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 \ud3ed\uc5fc+\ud734\uac00\ucca0+\uc18c\ube44\uc2ec\ub9ac \uc704\ucd95 \ubcf5\ud569 \uac10\uc18c. \uc2e0\uc138\uacc4\ub300\uc804 '\uc804\ub144 \ub300\ube44 30~40% \uac10\uc18c'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc9c0\uac11 \uc548 \uc5f4\ub9ac\ub294 \uc0c1\ud669'. \ud83d\udcc8 \ub354\ud604\ub300\uc11c\uc6b8 '\uc804\ub144 \ub3d9\uae30 \ub300\ube44 \ubaa9\uc801\uad6c\ub9e4 \uc99d\uac00, \uc544\uc774\ub3cc \ucf58\uc11c\ud2b8 \ud6a8\uacfc'. \ub86f\ub370\ubd80\uc0b0 '\ud3ec\ucf13\ubaac\ud31d\uc5c5\u00b7\ub7f0\ub358\ubca0\uc774\uae00 \ud31d\uc5c5\uc73c\ub85c \uc77c\ubc18 \uace0\uac1d \uc720\uc785'. \ub86f\ub370\uc778\ucc9c '\ud06c\ub8e8\uc988 \uc154\ud2c0\ubc84\uc2a4 8\uc6d4 \uc2dc\ubc94\uc6b4\ud589\uc73c\ub85c \uc678\uad6d\uc778 \uae09\uc99d'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ud0c0 \ube0c\ub79c\ub4dc \ud589\uc0ac\ub85c \ud560\uc778 \ubb38\uc758 \uc99d\uac00'. \ub86f\ub370\uae30\ud765 '\uc0c1\uc124 \ud560\uc778\uc728 40~70%\ub85c \ub192\uc544\uc9c0\uba70 \uace0\uac1d \ucd94\uac00 \ud560\uc778 \uae30\ub2e4\ub9ac\uba70 \uad6c\ub9e4 \ubbf8\ub8f8'. \uc2e0\uc138\uacc4\ub300\uc804 '\uc774\uc288 \uc544\uc774\ud15c \ubd80\uc7ac\ub85c \uad6c\ub9e4 \ub3d9\uae30 \uc81c\uacf5 \uc5b4\ub824\uc6c0'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ub0a8\uc131 M\u00b7L \uc0ac\uc774\uc988 \uacf5\ubc31 \uc9c0\uc18d","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ubd80\uc0b0\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc5ec\uc131 \uc2a4\ucee4\ud2b8 \uae30\uc7a5 \uc9e7\uc74c \ud53c\ub4dc\ubc31 \ubc18\ubcf5","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucc28\uae30 \uae30\uc7a5 \ub2e4\uc591\ud654 \uae30\ud68d \ubc18\uc601"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub0a8\uc131 \ud22c\uc5b4\ubc31 \ubb38\uc758 \uc99d\uac00","\ub9e4\uc7a5":"\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ud310\ub9e4\uc728 \uc9c0\uc18d \ud558\ub77d","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\ud310\ub9e4 \uc804\ub7b5 \uac80\ud1a0"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\
