d6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc790\ucf13 \uc18c\ub9e4 \ub514\uc790\uc778 \ubd80\ub2f4 \u2014 \uc190\ub4f1 \uae34 \uc18c\ub9e4\u00b7\ub4f1\ud310 \uc808\uac1c \ubd80\ub2f4 \ud53c\ub4dc\ubc31","\ub9e4\uc7a5":"\ub86f\ub370\uc778\ucc9c\u00b7\ud604\ub300\uc911\ub3d9\u00b7\ub86f\ub370\uae30\ud765","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucc28\uae30 \ub514\uc790\uc778 \ubc18\uc601 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc5ec\uc131 \ud53c\uc2a4\ud14c \uc14b\uc5c5 \ud558\uc758 \ubd80\uc870\ud654","\ub9e4\uc7a5":"\ud604\ub300\ub300\uc804","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ud558\uc758 \uc5f0\uacc4 \uae30\ud68d \ud544\uc694"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2 WHT\u00b7IVY \ud488\uc808 \u2014 \ub9e4\ucd9c \ud0c0\uaca9\u00b7V3 \ucd9c\uc2dc \uc694\uccad","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uc785\uace0 \ub610\ub294 V3 \ucd9c\uc2dc \uc77c\uc815 \uacf5\uc720"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ud604\ub300\uc911\ub3d9 290 \uc0ac\uc774\uc988 \ubd80\uc7ac \uad6c\ub9e4 \uc774\ud0c8","\ub9e4\uc7a5":"\ud604\ub300\uc911\ub3d9","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ub300\uc0ac\uc774\uc988 \uc7ac\uace0 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc544\uc774\ud30c\ud06c 285\u00b7290 \uc0ac\uc774\uc988 \ubd80\uc7ac \uc678\uad6d\uc778 \uc774\ud0c8 \uc9c0\uc18d","\ub9e4\uc7a5":"\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778 \uc2dc\uae09"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8 \ubc18\uc751 \ubbf8\ubbf8 \u2014 \uc758\ub958 \uc5f0\uacc4 \uc804\ub7b5 \ubd80\uc7ac","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\ub2e4\uc218","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\ var STORE_DATA_RAW={"\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0":{"8\uc6d41W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\ud4e8\uc5b4\ub4dc\ub77c\uc774\ub294 \uae30\uc874 \uad6c\ub9e4\uc758 \uc7ac\uad6c\ub9e4\uac00 \uafb8\uc900\ud788 \uc774\uc5b4\uc9c0\uace0 \uc788\uc73c\uba70, \ub2e4\ub978 \ub514\uc790\uc778\uc73c\ub85c \ucd94\uac00 \uad6c\ub9e4\ud558\ub294 \uc0ac\ub840\ub3c4 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329, \ube14\ub808\uc774\ub4dc \uc288\ud37c\ud22c\uc5b4 \ubc31\ud329\uc740 \uae54\ub054\ud55c \ub514\uc790\uc778\uacfc \uceec\ub7ec \ub192\uc740 \uc2e4\uc6a9\uc131\uc73c\ub85c \uafb8\uc900\ud788 \ud310\ub9e4\ub97c \ubcf4\uc600\uc2b5\ub2c8\ub2e4"},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ubbfc\uc18c\ub9e4\ub97c \ucc3e\uc73c\uc2dc\ub294\ubd84\ub4e4\uc774 \ub9ce\uc73c\uc2e0\ub370, \ub300\ubd80\ubd84 \ucea1\uc774 \ubd99\uc5b4\uc788\uc5b4\uc11c \ub2f5\ub2f5\ud558\uace0 \ub365\ub2e4\ub294 \uc758\uacac\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uae38\uc774\uac10\uc774 \uc880 \uc788\ub294 \uc587\uc740\uc18c\uc7ac\uc758 \ubbfc\uc18c\ub9e4\uac00 \uc788\uc73c\uba74 \uc88b\uc744\uac83 \uac19\uc2b5\ub2c8\ub2e4. \ub610\ud55c, \uc0b4\uc9dd \uae38\uc774\uac10\uc774 \uc788\ub294 \uce58\ub9c8\uc640 \ubc14\uc9c0\ub97c \ub9ce\uc774 \ucc3e\uc73c\uc2ed\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2e0\uc0c1 \ucea1\ubaa8\uc790 \ud130\uce58\uac10\uc740 \uc788\uc73c\ub098, \uc5ec\uc131\ubd84\ub4e4\uc740 \ubc14\uc774\uc800 \uc704\uc8fc\ub85c \ucc3e\uc73c\uc2dc\uace0 \ub610\ud55c, \ub354\uc6b4 \ub0a0\uc528\uc758 \uc601\ud5a5\uc73c\ub85c \uac00\ubccd\uace0 \uba54\uc26c \uc18c\uc7ac\ub97c \uc801\uc6a9\ud574 \ud1b5\uae30\uc131\uc774 \uc6b0\uc218\ud55c \uc5d0\uc5b4\ubaa8\uc158 \ucea0\ud504\ucea1\uc744 \uc120\ud638\ub3c4\uac00 \ub192\uc558\uc2b5\ub2c8\ub2e4"},{"cat":"\uc2e0\ubc1c","topic":"2-1. \u 58\uc758 \uacbd\uc6b0 \ud074\ub798\uc2dc \ubc84\uc804\uc758 \ud310\ub9e4\uac00 \uc788\uc5c8\uc73c\uba70 \ube14\ub808\uc774\ub4dc \ubc84\uc804\uc758 \ud130\uce58\uc728\ub3c4 \ub9ce\uc558\uc74c \ub450\uac00\uc9c0\ubc84\uc804 \uc0c9\uac10 \ubaa8\ub450 \uae30\uc874\ubc84\uc804 \ub300\ube44 \ud6e8\uc52c \uae54\ub054\ud558\uace0 \uace0\uae09\uc2a4\ub7fd\ub2e4\ub294 \uc758\uacac\uc774 \ub9ce\uc558\uc74c."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uc778\uc218\uc778\uacc4\ub85c \uc778\ud574 \uc804\ub144 \uc810\ud3ec\uc758 \uc0c1\ud669\uc744 \uc804\ub2ec\ubc1b\uc558\uc744\ub54c \uc785\uc810\uac1d\uc218 \ubd80\ud130 \ub300\ud3ed \uc904\uc5c8\ub2e4\uace0\ud568 (\uc804\ub144\ub300\ube44 \ub3d9\uae30\uac04 \uc785\uc810\uac1d \ud3c9\uade0 3-40%\uc815\ub3c4 \uac10\uc18c ) \uacbd\uae30\uce68\uccb4 \ubc0f \uc545\ud654\ub85c \uc778\ud55c \uc18c\ube44\uc2ec\ub9ac \uc704\ucd95\uc758 \uc601\ud5a5\ub3c4 \uc5b4\ub290\uc815\ub3c4 \uc788\ub294\ub4ef\ud568. \uc785\uc810\uac1d \uc790\uccb4\ub3c4 \ub108\ubb34 \uc5c6\uc5c8\uc9c0\ub9cc \uc720\ub3c5 \uac00\uaca9\uc800\ud56d\uc774 \uc2ec\ud55c \ud55c\uc8fc\uc600\uc74c \ub610\ud55c \uc791\ub144\uc758 \uacbd\uc6b0 \uc774\uc288\uc544\uc774\ud15c (\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1\ubc31\ud329, \uc274\ub4dc\ubc31\ud329 \ub4f1) \ub4f1\uc758 \ub2e4\ub7c9\ud310\ub9e4\uac00 \uc788\uc5c8\uc9c0\ub9cc \uae08\ub144\uc758 \uacbd\uc6b0 \uc8fc\ub825\uc6a9\ud488\uc758 \ub514\uc790\uc778\uc774 \uc804\ub144\uacfc \ub108\ubb34 \ube44\uc2b7\ud558\uc5ec \ud53c\ub85c\uac10\uc744 \ub290\ub07c\ub294 \uace0\uac1d\ub4e4\uc774 \ub9ce\uc558\uc74c. \ub77c\ucf13\uc758 \uacbd\uc6b0\ub3c4 \ud604\uc2dc\uc810 \uac00\uc7a5 \uc774\uc288\uc778 \ub514\ud30c\uc774\uc5b4\uc758 \uc218\uc694\ub300\ube44 \ubb3c\ub7c9\ubd80\uc871\uc774 \uc774\uc5b4\uc838 \ub108\ubb34 \uc544\uc26c\uc6c0. \uc9c0\ubc29\uad8c\uc758 \uacbd\uc6b0 \ud14c\ub2c8\uc2a4 \uc778\uad6c\uac00 \ub9ce\uc9c0 \uc54a\uc544 \uadf9\uc5ec\ub984 \ube44\uc218\uae30\ub4f1\uc758 \ub9e4\ucd9c\uc744 \ucee4\ubc84\ud558\ub824\uba74 \uc5b4\ub290\uc815\ub3c4 \ub77c\uc774\ud504\uc758 \ube44\uc911\uc744 \uc880 \ub354 \ub298\ub9b4 \ud544\uc694\uac00 \uc788\ub2e4\uace0 \uc0dd\uac01\ud568. \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \ub354 \ud798\uc4f0\uaca0\uc74c."}],"8\uc6d42W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"1. \uc5ec\uc131 \uc0c1\uc758 : \ud4e8\uc5b4\ub4dc\ub77c\uc774\uc154\ub9c1\uc758 \ud130\uce58\uc728\uacfc \ud310\ub9e4\uc728\uc774 \uac00\uc7a5 \uc88b\uc558\uc74c, \ud14c\ub2c8\uc2a4\uac00 \uc544\ub2cc \uc77c\uc0c1\ubcf5\uc774\ub098, \ud0c0 \uc2a4\ud3ec\uce20 \uace0\uac1d\ub4e4\uc758 \uad6c\ub9e4\ub3c4 \ub9ce\uc558\uc74c \uc804\uc5f0\ub839\ub300 \ubaa8\ub450 \ubb34\ub09c\ud558\uac8c \uc785\uc744 \uc218 \uc788\uc5b4\uc11c \uc88b\ub2e4\uace0 \ud558\uc2dc\uba70 \uae30\uc874 \ub514\uc790\uc778\uc5d0\uc11c \ud3ec\uc778\ud2b8\uac00 \ub531 \uc7a1\ud600\uc788\uc5b4 \uace0\uac1d\ub4e4\uc758 \ubc18\uc751\uc774 \uc720\ub3c5 \uc88b\uc740\uac83 \uac19\uc74c. \ud2b9\ud788 WHT \uceec\ub7ec\uc758 \ubc18\uc751\uc774 \uac00\uc7a5 \uc88b\uc74c. \ub610\ud55c \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\uc7ac\ud0b7\uc758 \uc785\uace0\ub85c \ubc14\ub78c\ub9c9\uc774 \uc544\uc774\uce90\uce6d\uacfc \ud130\uce58\uc728\uc774 \uc0c1\uc2b9\ud568. \uae34\ud314\uc0c1\ud488 \ube60\ub978 \uc785\uace0\uac00 \ud544\uc694\ud560\uac83\uac19\uc74c. 2. \uc5ec\uc131 \ud558\uc758 : \ud558\uc758\uc758 \uacbd\uc6b0 \uace8\uace0\ub8e8 \ub2e4\uc591\ud558\uac8c \ud310\ub9e4\uac00 \ub418\uc5c8\uc74c. \ub354\ube14\uba54\uc26c\uc634\ube0c\ub808 \ube14\ub799\uceec\ub7ec\uc758 \ubc18\uc751\uc774 \ud2b9\ud788 \uc88b\uc558\uc73c\uba70 \uace8\ud504\ub098 \ub2e4\ub978 \uc2a4\ud3ec\uce20\ub4f1\uc758 \uace0\uac1d\ub4e4\uc5d0\uac8c\ub3c4 \ud310\ub9e4\uac00 \ub418\uc5c8\uc74c. \ub610\ud55c \uc77c\uad50\ucc28\uac00 \ucee4\uc9c0\ub2e4\ubcf4\ub2c8 \ub098\uc77c\ub860\uc18c\uc7ac\ub4f1\uc758 \uc587\uc740 \ub871\ud32c\uce20 \ubb38\uc758\uac00 \ub298\uc5b4\ub0a8 / 3.\ub0a8\uc131 \uc0c1\uc758 : \ub0a8\uc131\uc758 \uacbd\uc6b0 \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ud2f0\uc154\uce20\uac00 \uc544\uc774\uce90\uce6d\ub3c4 \ub9ce\uc558\uace0 \ud310\ub9e4\uc728\uc774 \uac00\uc7a5 \ub192\uc558\uc74c. 3-40\ub300 \uad6c\ub9e4\ub825\uc774 \ub192\uc740 \uace0\uac1d\ub4e4\uc758 \ubc18\uc751\uc774 \uac00\uc7a5 \uc88b\uc558\uc73c\uba70 \uc77c\uc0c1\uc6a9\uc73c\ub85c \uc785\uc73c\ub824 \uad6c\ub9e4\ud558\ub294 \uace0\uac1d\ub4e4\ub3c4 \uaf64 \ub9ce\uc558\uc74c, \uadf8 \uc678\uc5d4 \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\uc790\uac00\ub4dc\uc758 \ud130\uce58\uc728\uacfc \ud310\ub9e4\uc728\uc774 \uc0c1\uc2b9\ud558\uc600\uace0 \uc77c\uad50\ucc28\ub85c \uc778\ud574 \uc544\uce68\uacfc \uc800\ub141\uae30\uc628\uc774 \ud558\ub77d\ud558\uba70 \uac00\uc744\uae4c\uc9c0 \ucf54\ub514\ud558\uae30 \ud3b8\ud55c \uce74\ud0a4\uceec\ub7ec\uac00 \uac00\uc7a5 \ubc18\uc751\uc774 \uc88b\uc558\uc74c. +\ubc14\ub78c\ub9c9\uc774 \ud130\uce58\uc728\uacfc \ubb38\uc758\uac00 \ub298\uc5b4\ub0a8\uc5d0\ub530\ub77c \ud53c\uc2a4\ud14c\uc885\ub958\ub4f1\uc758 \ube60\ub978 \uc785\uace0\uac00 \ud544\uc694\ud560\uac83\uac19\uc74c. 4.\ub0a8\uc131\ud558\uc758 : \ucf54\ud2b8\ub77c\uc778 7\uc778\uce58 \uc1fc\uce20\uac00 \ub9e4\uc7a5 \ub0b4 \ubaa8\ub4e0 \uc0c1\ud488\uacfc \ucf54\ub514\ud558\uae30 \uc88b\uc544 \uac00\uc7a5 \ub9ce\uc774 \uc5f0\uacc4\ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc84c\uc74c \ub610\ud55c \ubcfc \ud3ec\uc778\ud2b8 7\uc778\uce58 \uc1fc\uce20\ub3c4 \ucc29\uc6a9\uc2dc \ub77c\uc778\uc774 \ub108\ubb34 \uae38\uc9c0\uc54a\uc544 \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\uc790\uac00\ub4dc\uc640 \uc5f0\uacc4\ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc84c\uc74c. / \uae08\uc8fc\ub294 \ub514\ud30c\uc774\uc5b4, \uc5d4\ucf54\ub4dc, \ud074\ub798\uc2dc USOPEN \ub4f1 \uc774\uc288\ub77c\ucf13\uc758\ud310\ub9e4\uac00 \uc6d0\ud65c\uc774 \uc774\ub8e8\uc5b4\uc84c\uc73c\uba70 \ubcfc\ud2b8\ud504\ub85c, \ub9ac\uc2a4\ud3f0\uc2a4 \ub4f1 \uc6a9\ud488\ub4f1\uc758 \ud310\ub9e4\ub3c4 \uc6d0\ud65c\ud558\uc600\uc74c \ub0a0\uc528\uac00 \uc880 \ub354 \ud480\ub9b0\ub2e4\uba74 \ub354 \ud310\ub9e4\uc728\uc774 \ub192\uc544\uc9c8\uac83\uac19\uc74c."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"1. \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\uc790\ucf13 \ubc18\uc751: \ub0a8/\ub140 \ub514\uc790\uc778 \ubaa8\ub450 \ud130\uce58\uc728\ub3c4 \ub192\uace0 \ud2b9\ud788 \uc5ec\uc131 \ud37c\ud50c\uceec\ub7ec\uc758 \uc544\uc774\uce90\uce6d\uc774 \ub9ce\uc558\uc74c. \uc77c\uad50\ucc28\uac00 \ucee4\uce58\uba70 \uc587\uc740\uc18c\uc7ac\uc758 \uae34\ud314\uc744 \ucc3e\ub294 \uace0\uac1d\ub4e4\uc774 \ub298\uc5b4\ub0ac\ub294\ub370 \ub514\uc790\uc778\ub3c4 \uae54\ub054\ud558\uc5ec \ud638\ubd88\ud638\uc5c6\uc774 \uc785\uae30\uc88b\uc544 \uc6d0\ud65c\ud788 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9d0. \ud2b9\ud788\ub098 \uc5ec\uc131\uc758 \uacbd\uc6b0 \uae30\uc874 \ube0c\ub77c\ud0d1\ub9cc \uc785\uae30 \ubd80\ub2f4\uc2a4\ub7ec\uc6e0\ub358 \uace0\uac1d\ub4e4\uc5d0\uac8c \ud568\uaed8 \ucf54\ub514\ud558\uc5ec \uc5b4\ud544\ud558\uace0 \uc788\uc74c. 2.FW\uc0c1\ud488\ubc18\uc751 : \uc544\uc9c1\uae4c\uc9c4 FW\uc0c1\ud488\ub4e4\uc774 \ubc18\ud314\uc774 \uc8fc\ub85c \ub9ce\uc740 \uc0c1\ud0dc\ub77c \uba85\ud655\ud55c \ubc18\uc751\uc740 \uc560\ub9e4\ud558\uc9c0\ub9cc \ud604\uc7ac \ucd9c\uc2dc\ub41c \ubc14\ub78c\ub9c9\uc774 \ub4f1 \ubcf4\uc558\uc744\ub54c \ub514\uc790\uc778\uc801\uc778 \uc694\uc18c\ub098 \ud54f\uac10, \uc6d0\ub2e8\uac10\uc5d0 \ub300\ud55c \ub9cc\uc871\ub3c4\uac00 \uad49\uc7a5\ud788 \ub192\uc73c\uba70 \uc774\ub85c\uc778\ud574 \ud0c0 \uc2a4\ud3ec\uce20 \uace0\uac1d\ub4e4\uc758 \uc720\uc785\uc774 \ub298\uc5b4\ub098\uace0 \uc788\uc74c (\ub304\uc2a4\uc2a4\ud3ec\uce20, \ub77c\uc778\ub304\uc2a4, \ud544\ub77c\ud14c\uc2a4, \ub7ec\ub2dd, \ud2b9\ud788 \uace8\ud504\uc758 \uacbd\uc6b0\uac00 \ub9ce\uc544\uc9d0 \ud0c0\uc0ac\ub300\ube44 \uc6d0\ub2e8\uac10\uc774\ub098 \uc0c9\uac10\uc5d0 \ub300\ud574 \ub9cc\uc871\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc74c. 3. \uac00\uc744\uc0c1\ud488\ud130\uce58 : \ud130\uce58\uc728 \ub9e4\uc6b0 \uc0c1\uc2b9\ud568. \ub300\uc804\uc810 \uace0\uac1d\uc758 \uacbd\uc6b0 \ub0a0\uc528\uc5d0 \ubbfc\uac10\ud558\uc5ec \uccb4\uac10\uae30\uc628\uc774 \ub0b4\ub824\uac00\uba74 \ubc14\ub85c \ubc14\ub78c\ub9c9\uc774\ub098 \uac00\uc744\uc0c1\ud488\uc744 \ucc3e\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc74c, \ub610\ud55c \uae34\ubc14\uc9c0\uc5d0 \ub300\ud55c \ubb38\uc758\uac00 \uad49\uc7a5\ud788 \ub9ce\uc558\uae30\uc5d0 \ube60\ub978 \uc785\uace0\uac00 \ud544\uc694\ud558\ub2e4\uace0 \uc0dd\uac01\ud568. 4. \ubd80\uc871\uac10 \uc788\ub294 \uc544\uc774\ud15c : \uc7ac\ud0b7\uc5d0 \ud568\uaed8 \ub9e4\uce58\ud560 \uc544\uc774\ud15c\uc774 \ubc18\ud314 \uc81c\uc678\ud558\uace0, \uc774\ub108\ud0d1\uc774 \ub2e4\uc18c \ubd80\uc871\ud558\ub2e4\ub294 \uc0dd\uac01\uc774 \ub4ec, \ube0c\ub77c\ud0d1\uc774 \uc544\ub2cc \uc54c\ub85c\uc758 \ub9ac\ube0c\ub4dc\ud0f1\ud06c\ud0d1\ucc98\ub7fc \uae30\ubcf8\uae38\uc774\ub098 \uace8\ubc18\uc704\uae4c\uc9c0 \ub0b4\ub824\uc624\ub294 \uae30\ubcf8 \uc774\ub108 \ub098\uc2dc\uac00 \uc788\uc73c\uba74 \ube0c\ub77c\ud0d1\uc774 \ubd80\ub2f4\uc2a4\ub7ec\uc6b4 \uace0\uac1d, \ub610\ub294 \ud14c\ub2c8\uc2a4\uac00 \uc544\ub2cc \uc77c\ubc18 \uc77c\uc0c1\uc6a9 \ub4f1\uc73c\ub85c \uad6c\ub9e4\ud558\ub294 \uace0\uac1d\uc5d0\uac8c \uc5f0\uacc4\ub85c \ud310\ub9e4\ud558\uac70\ub098 \ub2e8\ud488\ub4f1\uc73c\ub85c \ud310\ub9e4\ud558\uae30\uc5d0\ub3c4 \uc88b\uc744\uac83 \uac19\uc74c. \ud2b9\ud788\ub098 \uc5ec\ub984\uc5d0\uc11c \ucd08\uac00\uc744\ub85c \ub118\uc5b4\uac08\ub54c\ub294 \ubc18\ud314\uc744 \uc774\ub108\ub85c \uc785\uae30\ubcf4\ub2e8 \uae30\ubcf8 \ub098\uc2dc\ub97c \ub9e4\uce58\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc73c\ub2c8 \ucd94\ud6c4 \uaf2d \ucd9c\uc2dc\uac00 \ub41c\ub2e4\uba74 \ud310\ub9e4\uc5d0 \ub9ce\uc740 \ub3c4\uc6c0\uc774 \ub420\uac83\uac19\uc74c. \uc2a4\ucee4\ud2b8\uc758 \uacbd\uc6b0  \uc880 \ub354 \ub2e4\uc591\ud55c \uae30\uc7a5\uac10\uc774 \ucd9c\uc2dc\ub418\uc5c8\uc73c\uba74 \uc88b\uaca0\uc74c. FW\uc2dc\uc98c\uc5d4 \ub871\uc2a4\ucee4\ud2b8\uc758 \uc218\uc694\uac00 \uc5b4\ub290\uc815\ub3c4 \uc788\ub294\ub370 \uc804\ubc18\uc801\uc73c\ub85c \uae30\uc7a5\uac10\uc774 \uc9e7\ub2e4\ub294 \uc758\uacac\uc774 \ud56d\uc0c1 \uc788\uc5c8\uc74c \uae30\uc874 \ubc84\uc804\ub300\ube44 \uc880 \ub354 \ub2e4\uc591\ud558\uac8c \ucd9c\uc2dc\ub41c\ub2e4\uba74 \uc77c\uc0c1\uc6a9\ub4f1\uc5d0\ub3c4 \uc5b4\ud544\ud558\uae30 \uc88b\uc744\uac83 \uac19\uc74c. \ud14c\ub2c8\uc2a4\uc758 \uc720\uc785\uc774 \uc801\uc5b4\uc9c0\ub294 \ub9cc\ud07c \ub77c\uc774\ud504\uc6e8\uc5b4\uc758 \ube44\uc728\uc774 \uc5b4\ub290\uc815\ub3c4 \uaf2d \ud544\uc694\ud558\ub2e4\uace0 \uc0dd\uac01\ud568."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"1. \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 : \uc0c9\uac10\uacfc \ub514\uc790\uc778\uc73c\ub85c \uc5ec\uc131\uace0\uac1d \ubaa8\ub450 \ud130\uce58\uc728 \ubc0f \ubc18\uc751\uc774 \uad49\uc7a5\ud788 \uc88b\uc74c \ud551\ud06c,\uc544\uc774\ubcf4\ub9ac \ubaa8\ub450 \ubc18\uc751\uc740 \uc88b\uc73c\uba70 \ub3c4\ud2b8\ubc31\uc758 \uacbd\uc6b0 \uaf2d \ud14c\ub2c8\uc2a4\uac00 \uc544\ub2cc \ud0c0 \uc2a4\ud3ec\uce20 (\ud544\ub77c\ud14c\uc2a4\ub098 \uc694\uac00, \ubc1c\ub808 \ub4f1) \uace0\uac1d\ub4e4\uc5d0\uac8c \uc5b4\ud544\ud558\uae30\ub3c4 \uc88b\uc544 \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \uafb8\uc900\ud788 \uc5b4\ud544\uc911\uc784. \uc544\uc9c1\uae4c\uc9c4 \uc6d0\ub2e8\uac10\uc774 \ub2e4\uc18c \ubb34\uac70\uc6cc \ubcf4\uc77c\uc218\ub3c4 \uc788\uc5b4 \ub0a0\uc528\uac00 \ub354 \ud480\ub9b0\ub2e4\uba74 \ub354 \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9c8\uac83 \uac19\uc74c. 2. \ub2c8\uc0ad\uc2a4\ub958 : \ub2c8\uc0ad\uc2a4\uc758 \uacbd\uc6b0 \ud130\uce58\uc728\uc774 \ub9ce\uc9c0\ub294 \uc54a\uc74c. \ub514\uc790\uc778\uc801\uc73c\ub85c\ub294 \ub108\ubb34 \uc608\uc058\ub2e4\uba70 \ud130\uce58\ub3c4 \ud558\uc9c0\ub9cc \ub2c8\uc0ad\uc2a4\uac00 \ub2e4\uc18c \ubd80\ub2f4\uc2a4\ub7fd\ub2e4\uba70 \uc624\ud788\ub824 \uc77c\ubc18 \ud06c\ub8e8\uc0ad\uc2a4\uac00 \ud6e8\uc52c \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9d0. 3. \ubaa8\uc790: \uae08\uc8fc \ubaa8\uc790\uc758 \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9d0. \uc804 \ub77c\uc778 \uace8\uace0\ub8e8 \ud310\ub9e4\uac00 \uc774\uc5b4\uc84c\uc73c\uba70 \uc544\uc9c1\uae4c\uc9c4 \ub2e4\uc18c \ub354\uc6b4 \ub0a0\uc528\ub85c \uc778\ud574 \ub098\uc77c\ub860 \uc18c\uc7ac\uc758 \ucea1\uc885\ub958\uac00 \ubc18\uc751\uc774 \uc88b\uc558\uace0 \uc120\ubb3c\uc6a9\uc73c\ub85c \uad6c\ub9e4\ud558\uc2dc\ub294 \uace0\uac1d\ub4e4\ub3c4 \ub9ce\uc558\uc74c. \ub3c4\ud1b0\ud55c \uc18c\uc7ac\uc758 \ubaa8\uc790\ub4e4\ub3c4 \ud130\uce58\uac00 \ub9ce\uc558\uc73c\ub098 \ub0a0\uc528\ub85c \uc778\ud574 \ub9dd\uc124\uc784. \ud574\ub2f9\uc0ac\ud56d\ub3c4 \ub0a0\uc528\uac00 \ub354 \ud480\ub9ac\uba74 \uc77c\ubc18\uace0\uac1d\ub4f1\uc5d0\uac8c \uc6d0\ud65c\ud558\uac8c \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9c8\uac83\uc73c\ub85c \ubcf4\uc784. / \uae08\uc8fc\ub294 \uc62c\uc5b4\ub77c\uc6b4\ub4dc\uc9d0\ubc31L \uadf8\ub9b0, \ub808\ub4dc\ub4f1\uc758 \ud310\ub9e4\uac00 \ub9ce\uc558\uace0, \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329\uc740 \uace8\uace0\ub8e8 \ubb34\ub09c\ud558\uac8c \ud310\ub9e4\ub418\uc5c8\uc74c."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc218\uc785\ub77c\uc778 : \ub808\ub4dc\uceec\ub7ec \uc0c9\uac10\uc73c\ub85c \uc778\ud574 \uc544\uc774\uce90\uce6d\ub3c4 \uc798 \ub418\uace0 \ud130\uce58\uc728\ub3c4 \ub192\uc74c \ub7ec\uc26c\ud504\ub85c\uc758 \uacbd\uc6b0 \uafb8\uc900\ud788 \ub2e4\ub978\uceec\ub7ec\ub97c \ucc3e\uc73c\uc2dc\ub358 \uace0\uac1d\ub2d8\ub4e4\uc774 \uaf64 \uc788\uae30\uc5d0 \uc880 \ub354 \uc9c0\ucf1c\ubcf4\uba74 \ub354 \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9c8\uac83\uc73c\ub85c \uc608\uc0c1\ub428./ \ubcfc\ud2b8\ud504\ub85cW : \uc5ec\uc131\uace0\uac1d\ub4e4\uc774 \uae08\uc8fc\ub294 \ubcfc\ud2b8\ud504\ub85c\ubcf4\ub2e8 \uc5d0\uc5b4\ub9acW\uc758 \ud130\uce58\uc728\uc774 \ub9ce\uc558\uae30\uc5d0 \uc544\uc9c1\uae4c\uc9c0 \ud070 \ubc18\uc751\uc774 \uc788\uc9c0\uc54a\uc558\uc74c. \uc624\ud788\ub824 \ub0a8\uc131\uace0\uac1d\uc758 \ubb38\uc758\uac00 \ub354 \ub9ce\uc558\uc74c/ \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ud130\ud504: \ub0a0\uc528\uac00 \ud480\ub9ac\uba70 \ud074\ub808\uc774\ucf54\ud2b8\uc6a9\uc744 \ucc3e\ub294 \uace0\uac1d\ub4e4\uc774 \ub298\uc5b4\ub0a8 \ucc29\ud654\uc2dc \ubb34\uac8c\uac10\ub3c4 \uac00\ubccd\uace0 \ubc1c\ubaa9\uc744 \uc798 \uc7a1\uc544\uc8fc\ub294 \ub290\ub08c\uc73c\ub85c \uace0\uac1d\ub4e4\uc758 \ub9cc\uc871\ub3c4\uac00 \ub192\uc74c \ub0a0\uc528\uac00 \ub354 \ud480\ub9b0\ub2e4\uba74 \ub354\uc6b1 \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9c8\uac83\uc73c\ub85c \ubcf4\uc784."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub0a8\uc131 \uc2a4\ud399\uc758 \uacbd\uc6b0 \uc790\uccb4 \ubc14\uc774\ub7f4\uc774 \ucd9c\uc2dc\uc804\ubd80\ud130 \uc774\ub8e8\uc5b4\uc9c0\uae30\ub3c4 \ud588\uace0 \uc5ec\uc131\uace0\uac1d\ub4e4\uc758 \uacbd\uc6b0 \ud14c\ub9b0\uc774\uc758 \ube44\uc728\uc774 \ub354 \ub9ce\uae30\uc5d0 \uc5ec\uc131\uace0\uac1d\ub4e4\uc758 \ubc18\uc751\uc774 \ub354\ub51c\uc218 \ub3c4 \uc788\ub2e4\uace0 \uc0dd\uac01\ub4ec. \ub300\uc804\uc810\uc758 \uacbd\uc6b0 UL \ubaa8\ub378 1\uadf8\ub9bd\uc774 \uac00\uc7a5 \ub9ce\uc774 \ud310\ub9e4\ub418\uc5c8\uc73c\uba70 \uc0ac\uc804\uc608\uc57d \uace0\uac1d50% \uc6cc\ud06c\uc778\uace0\uac1d 50% \ube44\uc728\ub85c \ud310\ub9e4\ub418\uc5c8\uc74c. \ubc18\uc751\uc774 \uc88b\uae30\uc5d0 \ube60\ub978 \uc7ac\uc785\uace0\uac00 \ud544\uc694\ud568. 100L\ub3c4 \ub0a8\uc131\uace0\uac1d\ub4e4\uc758 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc84c\uc73c\ub098 \uc5ec\uc804\ud788 98PRO \uc640 100 \uc7ac\uc785\uace0\uc5d0 \ub300\ud55c \ubb38\uc758\uac00 \ub9ce\uc558\uc73c\uba70 \uc785\uace0\uc608\uc57d\uc744 \ud558\ub294 \uace0\uac1d\uc774 \ub9ce\uc558\uc74c./ US OPEN\uc758 \uacbd\uc6b0 \ud074\ub798\uc2dc 100UL 1\uadf8\ub9bd\uc758 \ud310\ub9e4\uac00 \uac00\uc7a5 \ub9ce\uc558\uc74c \uca0d\ud55c \uceec\ub7ec\ub97c \ucc3e\ub294 \uc5ec\uc131\uace0\uac1d\uc5d0\uac8c \uc5b4\ud544\ud558\uc600\uc744\ub54c \ubc18\uc751\uc774 \ubaa8\ub450 \uc88b\uc558\uc74c. \ub0a8\uc131\uace0\uac1d\uc758 \uacbd\uc6b0 \uae30\ubcf8\ubaa8\ub378\uc744 \uc120\ud638\ud558\ub294 \uacbd\ud5a5\uc774 \uc788\uc9c0\ub9cc \uc5ec\uc131\uace0\uac1d\uc758 \uacbd\uc6b0 \uae30\ubcf8\ud074\ub798\uc2dc\ubcf4\ub2e8 \uc5d0\ub514\uc158 \ubaa8\ub378\uc744 \ud6e8\uc52c \uc120\ud638\ud558\ub294\uac83 \uac19\uc74c. /\uc5d4\ucf54\ub4dc\uc758 \ud130\uce58\uc728\uc774 \ub9ce\uc558\uace0 \uc6d0\ud65c\ud558\uac8c \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9d0 \uc544\uc9c1 \ucd9c\uc2dc\ub41c\uc9c0 \ubaa8\ub974\ub294 \uace0\uac1d\ub4e4\ub3c4 \uaf64 \ub9ce\uc544\uc11c \ucc28\uc8fc\ucbe4 \ubcf8\uaca9\uc801\uc73c\ub85c \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\ub8e8\uc5b4\uc9c8\uac83\uc73c\ub85c \uc608\uc0c1\ub428./ \uae08\uc8fc\ub294 \uc774\uc288\ub77c\ucf13\ub4f1\uc758 \uc785\uace0\ub85c \uc778\ud574 \ub77c\ucf13\uc758 \ud310\ub9e4\uac00 \uc6d0\ud65c\ud558\uac8c \uc774\ub8e8\uc5b4\uc84c\uc74c. \uc2a4\ud2b8\ub9c1 \ub2f9\uc77c\uc791\uc5c5\uc744 \uc6d0\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc73c\ub098 \uc99d\uc815\ub4f1\uc73c\ub85c \ucee4\ubc84\ud558\uc600\uc74c."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud574\ub2f9\uc0ac\ud56d \uc5c6\uc74c"},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uc804\ub144\ub3d9\uae30\uac04 \ub300\ube44 \uace0\uac1d\uc720\uc785\uc740 \ud604\uc800\ud788 \uc801\uc740\ud3b8\uc784 \uae08\uc8fc\uc758 \uacbd\uc6b0 \ud3c9\uc77c \uc720\uc785\uace0\uac1d\uc774 \uc5b4\ub290\uc815\ub3c4 \uc788\uc5c8\uace0, \uac1d\ub2e8\uac00\uac00 \ub192\uc740\ud3b8\uc774\ub77c \uc5b4\ub290\uc815\ub3c4 \uc0c1\uc1c4\ub418\uc5c8\uc73c\ub098 \uc8fc\ub9d0\uc758 \uacbd\uc6b0 \ud3ed\uc6b0 \ub4f1\uc73c\ub85c \uc778\ud574 \uc785\uc810\uac1d\uc774 \ud604\uc800\ud788 \uac10\uc18c\ud558\uc600\uc74c."}],"8\uc6d43W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uc5ec\uc131 : \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0c1\uc758, \uc62c\ucf54\ud2b83\uc1fc\uce20 \uc758 \ud310\ub9e4\uac00 \uac00\uc7a5 \ub9ce\uc558\uc74c. \uc0c1\uc758\uc758 \uacbd\uc6b0 \ud3f4\ub85c\ud2f0\uac00 \uc804\uc5f0\ub839\uce35 \ubaa8\ub450 \uad6c\ub9e4\uc728\uc774 \ub192\uc558\uace0, \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\uc758 \uacbd\uc6b0 \uc544\uc774\uce90\uce6d\uacfc \ud130\uce58\ub294 \uad49\uc7a5\ud788 \ub9ce\uc558\uc73c\ub098 \uc804\uc8fc\ub300\ube44 \uac11\uc790\uae30 \ub365\uace0 \uc2b5\ud574\uc9c4 \ub0a0\uc528\ub85c \uc778\ud574 \uad6c\ub9e4\uae4c\uc9c0 \uc774\uc5b4\uc9c0\uc9c4 \uc54a\uc558\uc74c. \ub0a8\uc131 : \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ud3f4\ub85c\ud2f0, \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13, \ucf54\ud2b8\ub77c\uc778 \uc1fc\uce20\uac00 \uac00\uc7a5 \ub9ce\uc740 \ud310\ub9e4\uac00 \uc774\uc5b4\uc84c\uc74c. \uc5ec\uc131\uacfc \ub9c8\ucc2c\uac00\uc9c0\ub85c \uc804\uc8fc\ub300\ube44 \ub0a0\uc528\ub85c \uc778\ud574 \uc790\ucf13\ub958\uc758 \uc544\uc774\uce90\uce6d\uacfc \ud130\uce58\uac00 \ub9ce\uc558\uc9c0\ub9cc \uad6c\ub9e4\ub85c \uc774\uc5b4\uc9c0\uc9c4 \uc54a\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc74c \ub450\uac00\uc9c0 \ubaa8\ub450 \ub0a0\uc528\uac00 \uc880 \ub354 \ud480\ub9b0\ub2e4\uba74 \uad6c\ub9e4\uc728\uc774 \ud6e8\uc52c \uc0c1\uc2b9\ud560\uac83\uc73c\ub85c \ubcf4\uc784."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"1. \uc2e0\uaddc \uc0c1\ud488 \uad6c\ub9e4 \ube44\uc728\uc774 \ub354 \ub192\uc740 \ud3b8. \ud2b9\ud788 \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \ub77c\uc778. \uc544\ub178\ub77d\uc774\ub098 \ubc14\ub9c9\ub3c4 \ub9ce\uc774 \ubcf4\uae34 \ud558\ub098 \ub2e4\uc2dc \ub354\uc6cc\uc9c4 \ub0a0\uc528\ub85c \uad6c\ub9e4\ub97c \ub9dd\uc124\uc784 2. \uae30\uc8744:\uc2e0\uaddc6 \ube44\uc728\ub85c \ud14c\ub2c8\uc2a4\ub098 \uace8\ud504 \uace0\uac1d\ub4e4\uc774 \uc70c\uc2a8 \ube0c\ub79c\ub4dc\ub97c \uc54c\uac8c \ub418\uc5b4 \uad6c\ub9e4\ud558\uac70\ub098, \uae30\uc874 \uace0\uac1d\ub4e4\uc774 \uc2e0\uc0c1\ud488\uc744 \uad6c\ub9e4\ud558\uae30 \uc704\ud574 \ubc29\ubb38. \uc77c\ubc18 \uace0\uac1d\ub4e4\uc774 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c\ub85c \uad6c\ub9e4\ud558\ub294 \ube44\uc911\ub3c4 \uc810\uc810 \ub298\uc5b4\ub098\uace0 \uc788\uc74c. \uae30\uc874\uc5d0 \uc5c4\ube0c\ub85c\ub97c \uad6c\ub9e4\ud558\ub358 \uad6c\ub9e4\ub825\uc774 \uc788\ub294 30-40\ub300 \ub0a8\uc131 \uace0\uac1d\ub4e4\ub3c4 \uc785\uc810\uc774\ub098 \uad6c\ub9e4\uc728\uc774 \ub192\uc544\uc9c0\uace0 \uc788\uc74c. \ub77c\uc774\ud504\ub85c \uc785\ub354\ub77c\ub3c4 \uae30\ub2a5\uc131\uc774\uba74\uc11c \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c\ub85c \ud65c\uc6a9 \uac00\ub2a5\ud55c \ub514\uc790\uc778\uc744 \ub9ce\uc774 \ucc3e\uc73c\uc2dc\ub294 \ud3b8 3. \uc5ec\uc131\ub77c\uc778\uc758 \uacbd\uc6b0 \ubc14\uc9c0\ub098 \uce58\ub9c8 \uae38\uc774\uac00 \ub108\ubb34 \uc9e7\uc544 \ubd80\ub2f4\uc2a4\ub7ec\uc6cc \uad6c\ub9e4\ub85c \uc774\ub904\uc9c0\uc9c0 \uc54a\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc558\uc74c. \ub0a8\uc131\uc758 \uacbd\uc6b0 \uc544\uc774\ud15c\uc774 \ud55c\uc815\uc801\uc774\ub77c \uae30\uc874 \uace0\uc815 \uace0\uac1d\ub4e4\uc774 \ucd94\uac00\ub85c \uad6c\ub9e4\ud560\ub9cc\ud55c \uc2a4\ud0c0\uc77c \ubd80\uc871 4. \ub300\ubd80\ubd84 FW\uc2e0\uc0c1\ud488\uc744 \ucc3e\ub294 \uace0\uac1d\ub4e4\uc758 \ube44\uc911\uc774 \ub192\uc558\uc74c. \uc9c0\ub09c \uc8fc \ubc14\ub9c9\uc774\ub098 \uae34\ud314\uc744 \uad6c\ub9e4\ud558\ub824\ub294 \uace0\uac1d\uc774 \ub298\uc5b4\ub0ac\uc73c\ub098 \ub2e4\uc2dc \ub354\uc6cc\uc9c4 \ub0a0\uc528\ub85c \uc778\ud574 \uc904\uc5b4\ub4ec."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"1. \uc791\ub144\uc5d0 \ube44\ud574 \ubc31\ud329 \uc2a4\ud0c0\uc77c \ubcf4\ub2e8 \ub2e4\ub978 \ud615\ud0dc\uc758 \ud14c\ub2c8\uc2a4 \uac00\ubc29\uc744 7c\uc774\uc18c\uc7ac\ub85c \uae34\ud314\uc544\uc774\ud15c\uc774 \ub098\uc628\ub2e4\uba74 \uc88b\uc744\ub4ef\ud569\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ubc31\ud329\ub9e4\ucd9c\uc774 \uc870\uae08 \uc904\uc5c8\uc2b5\ub2c8\ub2e4. \ucd5c\uadfc \uc2a4\ud2b8\ub9c1\ubc31\ud329v2 ivy, blk\uceec\ub7ec\ub97c \ucc3e\ub294\ubd84\ub4e4\uc774 \ub9ce\uc558\uc9c0\ub9cc \uc880 \ub193\uce5c\uace0\uac1d\ub4e4\uc774 \uc788\uc5c8\uace0 \uc2a4\ud2b8\ub9c1\ubc31\ud329 \uc5d0\uc5b4\ub098 \ub4c0\uc624\ud50c\ub9bd\ubc31\ud329\uc73c\ub85c \uc804\ud658\ud574\uc11c \ud310\ub9e4\ud588\uc2b5\ub2c8\ub2e4! \ubc31\ud329\uc678\uc5d0\ub294 \ud1a0\ud2b8\ubc31\uc774\ub098 \uc9d0\ubc31\uc2a4\ud0c0\uc77c\ub85c \ud310\ub9e4\uac00 \ub418\uc5c8\uc9c0\ub9cc \uc2a4\ud2b8\ub9c1\ud1a0\ud2b8\ubc31\uc758 \ubc18\uc751\uc740 \uc804\ud600\uc5c6\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc5d0\uc5b4\ub9acW\ud551\ud06c\uceec\ub7ec\ub294 \uc544\uc9c1 \ud06c\uac8c \ubc18\uc751\uc740 \uc5c6\uc5c8\uc2b5\ub2c8\ub2e4. \ucc28\uc8fc\uae4c\uc9c0 \ud55c\ubc88 \ubc18\uc751\uc744 \uc9c0\ucf1c\ubd10\uc57c\ub420\ub4ef\ud569\ub2c8\ub2e4. \uadf8\ub9ac\uace0 \ub0a8\uc131\uc2e0\ubc1c\uac19\uc740\uacbd\uc6b0\ub294 \uacbd\ub825\uc790\ubd84\ub4e4\uc740 \ud655\uc2e4\ud788 \ub7ec\uc26c \uc218\uc785\ud654\ub97c \ub9ce\uc774 \uc120\ud0dd\ud558\uc2dc\ub294 \ubc18\uba74\uc5d0 \ud14c\ub9b0\uc774\ubd84\ub4e4\uc740 \ubcfc\ud2b8\ub098 \ub9ac\uc2a4\ud3f0\uc2a4\ub97c \uc120\ud0dd\ud558\ub294\ubd84\ub4e4\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uc791\ub144\ub3c4 \uadf8\ub7ac\uc9c0\ub9cc \uc62c\ud574\ub3c4 \ube44\uc2b7\ud588\uc2b5\ub2c8\ub2e4. \ubcfc\ud2b8\ud504\ub85c1.5w\ub294 \ucd08\ubc18\uc5d0 \uc2e0\uc0c1\uc73c\ub85c \ub098\uc654\uc744\ub54c \ubc18\uc751\uc740 \uad1c\ucc2e\uc558\uc9c0\ub9cc \ud604\uc7ac\ub294 \uac00\uc7a5 \ud130\uce58\uac00 \uc5c6\ub294 \uc81c\ud488\uc911\uc5d0 \ud558\ub098\uc785\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub77c\ucf13\ud310\ub9e4\uac00 \ub9ce\uc740 \ud55c\uc8fc\ub294 \uc544\ub2c8\uc600\uc9c0\ub9cc \ub2e4\uc591\ud55c \uc885\ub958\uc758 \ub77c\ucf13\uc774 \ud310\ub9e4\uac00 \ub418\uc5c8\ub358 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uc804\uc8fc\ub300\ube44 \uc678\uad6d\uc778\uad00\uad11\uac1d\uc758 \ube44\uc911\uc774 \ub192\uc558\uc2b5\ub2c8\ub2e4. \uc815\ud734\uac00 \ub07c\uc5ec\uc788\uc5c8\uc9c0\ub9cc \uc804\uc8fc\ubcf4\ub2e4 \ub9e4\ucd9c\uc774 \uc0c1\uc2b9\ud588\uace0 \uc804\uccb4\uc801\uc73c\ub85c \uc804\uc8fc\ub300\ube44 3~40\ud504\ub85c\uc815\ub3c4 \ubc31\ud654\uc810 \uc785\uc810\uac1d\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uacbd\uc7c1\uc0ac\ube0c\ub79c\ub4dc\ub4e4\uc740 \uc55e\uc11c \uacbd\ub7c9\ud328\ub529\uc774\ub098 \ub7f0\ub2dd\ud654\ub4f1 \uc2e0\ubc1c\ud310\ub9e4\uac00 \ub9ce\uc558\uc2b5\ub2c8\ub2e4."}]},"\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765":{},"\uc2e0\uc138\uacc4\uac15\ub0a8":{"8\uc6d41W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc\uc758 \uc0c1\ud488 \ubca0\uc2a4\ud2b8\ub294 \ub0a8\uc131 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc14b\uc5c5\uacfc \uc5ec\uc131\uc6a9 \ud0d1\uc2a4\ud540\ud3f4\ub85c(\uac19\uc740\uad6c\uc131\uc758 \uc6d0\ud53c\uc2a4) , \uc694\uc998\ub4e4\uc5b4 \ud0dc\ud48d\uc758 \uc601\ud5a5\uc73c\ub85c \uad49\uc7a5\ud788 \ub354\uc6b4\ub0a0\uc774 \uc9c0\uc18d\ub418\uc5b4 \uc5ec\uc131\uace0\uac1d\ub2d8\ub4e4\uacfc \ub0a8\uc131\uace0\uac1d\ub2d8\ub4e4 \ub9d0\ud560\uac83\ub3c4 \uc5c6\uc774 \ub9e4\uc7a5\uc5d0 \uc624\uc2dc\uba74 \"\uc2dc\uc6d0\ud55c\uac70 \uc788\uc5b4\uc694?\"\ub77c\uace0 \uc774\uc57c\uae30 \ud558\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uad49\uc7a5\ud788 \ub9ce\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 20\ub300~30\ub300 \ub0a8\uc131\uace0\uac1d\ub2d8\ub4e4\uc774 \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\uc18c\uc7ac\uc758 \ud2f0\uc154\uce20\uc0c1\ud488\uc744 \uacc4\uc18d\ud574\uc11c \uad6c\ub9e4\ud558\uc2dc\uace0 \uc88b\uc544\ud558\uc168\ub294\ub370 \uc774\ub294 \ud55c\uc5ec\ub984\uc5d0\ub294 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac\uac00 \uc8fc\ub294 \uc57d\uac04\uc758 \ub2f5\ub2f5\ud568\uc774 \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774\uc758 \ub77c\uc774\ud2b8\ud55c \uc7ac\ub8cc\uc5d0\uc11c \uc624\ub294 \uc2dc\uc6d0\ud55c \ub290\ub08c\uc774 \ub354 \uc88b\uc558\ub358 \uac83 \uac19\uc2b5\ub2c8\ub2e4. \uac00\uc7a5 \ub9e4\ucd9c\uc774 \ub9ce\uc774 \ubab0\ub838\ub358 \uc5ec\uc13130~40\ub300 \uace0\uac1d\ub2d8\ub4e4\uaed8\uc11c\ub294 \uc911\uae30\uc7a5\uc758 \ube0c\ub77c\ud0d1\uacfc \uceec\ub7ec\ub9e4\uce6d\uc774 \uc774\uc05c \ud558\uc758\ub958\ub97c \ub9ce\uc774 \ucc3e\uc73c\uc168\uace0, \uc2a4\ucee4\ud2b8\ub958\uc640 \ubc18\ubc14\uc9c0\ub974\uac00 ss\uc2dc\uc98c\uc774 \uac70\uc758 \uc885\ub8cc\ub418\uba74\uc11c fw\uc758 \uc2e0\uc0c1\uc774\ub77c\ub3c4 \uc788\ub0d0\uace0 \uacc4\uc18d\ud574\uc11c \ubb3c\uc5b4\ubcf4\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. fw\uc2dc\uc98c\uc758 \ube0c\ub77c\ud0d1\uc774\ub098 sl\uc885\ub958\ub294 \ub2e4\uc74c\uc8fc\ubd80\ud130\ub77c\ub3c4 \ube68\ub9ac \ub4e4\uc5b4\uc640\uc57c \ub420\uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc774\ubc88\uc8fc \uc5ec\uc131 \uc218\uc785\ub958\uc758 \uc2e0\uc0c1\ud488\uc758 \ubc18\uc751\uc774 \uad49\uc7a5\ud788 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \ubbf8\ub4dc\ud0c0\uc6b4\uc2a4\ucee4\ud2b8\ub958\uc758 \uc800\uc870\ud55c \ud310\ub9e4\ub960\ub85c \ubca8\ub85c\uc2dc\ud2f0\uc0c1\ud488\ub4e4\uc758 \ud310\ub9e4\uac00 \uae09\uc99d\ud588\uace0, \uc774\ub294 \ub354 \uc587\uace0 \uc2dc\uc6d0\ud55c \uc18c\uc7ac\ub97c \uc6d0\ud558\uc2dc\ub294 \"\uadf9\uc5ec\ub984 \ud14c\ub2c8\uc11c\"\ub4e4\uc758 \ud53d\uc774 \uc5c8\ub294\ub370 \uc774\ubc88\uc8fc\uc5d0 \ub4e4\uc5b4\uc628 \uc2e0\uc0c1 \ubbf8\ub4dc\ud0c0\uc6b4\uc2a4\ucee4\ud2b8\ub294 \uc0c1\uc758\uac00 \uac19\uc774 \uc5c4\uccad\uc587\uc740 \ub2c8\ud2b8?\uc18c\uc7ac\ub85c \uc785\uace0\ub418\uc5b4\uc11c \ud14c\ub2c8\uc2a4\uc785\ubb38\uc790\ubd84\ub4e4 \ubfd0\ub9cc \uc544\ub2c8\ub77c \uad6c\ub825\uc774 \ub192\uc740 \uace0\uac1d\ub2d8\ub4e4\uc5d0\uac8c \uad49\uc7a5\ud788 \uc778\uae30\uac00 \ub9ce\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc544\uc9c1\uae4c\uc9c0 \uc6a9\ud488\uc2e0\uc0c1\uc758 \ubc18\uc751\uc774 \ud655\uc62c\ub77c\uc624\uc9c0\ub294 \uc54a\ub294\uac83 \uac19\uc2b5\ub2c8\ub2e4. \uc774\ub294 \uc774\ubc88\uc8fc\ubd80\ud130 \ubcf8\uaca9\uc801\uc778 2\ucc28\ud734\uac00\ucca0\uc744 \ub9de\uc774\ud558\ub824 \ub9e4\uc7a5\uc5d0 \uc785\uc810\ud558\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc774 \uc801\uc5c8\uace0 \uc774\ub54c\ubb38\uc5d0 \ub9e4\uc7a5\uc5d0\uc11c \uc6a9\ud488\ub958\ub294 \uac70\uc758 \uac00\ubc29\ub958\ub9cc \ud310\ub9e4\uac00 \uc88b\uc558\uace0, \ub450\uaebc\uc6b4 \uc591\ub9d0\ub3c4 \uc0dd\uac01\ubcf4\ub2e4 \ud310\ub9e4\uac00 \uc870\uae08 \uc800\uc870 \ud588\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub9ac\uc2a4\ud3f0\uc2a4 \ud504\ub85c\uc758 \ud310\ub9e4\uc728\uc774 \uacc4\uc18d\ud574\uc11c \ub5a8\uc5b4\uc9c0\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc774\ub294 \uc2e0\ubc1c\ub958\uc758 \uac00\uc7a5 \uac15\uc138\uc778 \"\ub7ec\uc26c \uc2dc\ub9ac\uc988\"\uc640 \"\uc778\ud2b8\ub9ac\uadf8 \uc2dc\ub9ac\uc988\"\uc758 \ubc18\ud488\uc73c\ub85c \uace0\uac1d\ub2d8\ub4e4\uc740 \uc218\uc785\uc0c1\ud488\uacfc \uad6d\ub0b4 \uc0c1\ud488\uc758 \ube44\uad50\uad70\uc774 \ucd95\uc18c\ub418\uc5b4 \uc120\ud0dd\uc9c0\uac00 \uc904\uc5b4\ub4e0 \ud0d3\uc5d0 \uc815\uc791 \"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c\"\ub294 \"\ubcfc\ud2b8\ud504\ub85c\"\uc640 \uacbd\uc7c1\uc744 \ud574\uc57c \ud558\ub294 \ud310\ub9e4\uacfc\uc815\uc774 \uc0dd\uae30\uac8c \ub418\uc5c8\uc2b5\ub2c8\ub2e4. \uc774\ub294 \ub0b4\uad6c\uc131\uacfc \uc548\uc815\uc131 \uadf8\ub9ac\uace0 \uac00\uaca9\uc801\uc778 \ubd80\ubd84\uc5d0\uc11c \uc0c1\ub2f9\ud788 \ud310\ub9e4\uc728\uc774 \uc88b\uc740 \ub9ac\uc2a4\ud3f0\uc2a4 \ud504\ub85c\uc600\ub294\ub370 \uc774\uac74 \uc624\ud788\ub824 \uac00\uc7a5 \uace0\uac00\uae08\uc561\uc758 \"\ub7ec\uc26c\ud22c\uc5b4\"\uc640 \ube44\uad50\ud558\uc5ec \ub2e4\uc6b4\uc140\ub9c1\uc744 \ud558\ub294 \ubaa9\uc801\uc5d0\uc11c\ub3c4 \ud310\ub9e4\uc728\uc774 \uc544\uc8fc\uc88b\uc558\uc2b5\ub2c8\ub2e4. \ud558\uc9c0\ub9cc \"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c\"\uc640 \"\ubcfc\ud2b8\ud504\ub85c\"\ub97c \ucc29\ud654\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc740 1\ub9cc\uc6d0\uc744 \ub354 \uc9c0\ubd88\ud558\uace0 \ubcfc\ud2b8\ud504\ub85c\ub97c \uad6c\ub9e4\ud558\uc2dc\ub294\uac8c \ub354 \ub7ec\ub2dd\ud654\uac19\uc740 \ud3b8\uc548\ud55c \ucc29\uc6a9\uac10\uc774\ub77c\uace0 \ucc29\ub2e8\ud558\uace0 \ubcfc\ud2b8\ud504\ub85c\ub97c \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \ub354 \ub9ce\uc544\uc9c0\uace0 \uc788\uc2b5\ub2c8\ub2e4. \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c\uc758 \uceec\ub7ec\ub294 \uc9c0\uae08 \ucda9\ubd84\ud788 \uc88b\uc740\ub9ac\ubdf0\ub97c \ub4dc\ub9b4 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ud558\uc9c0\ub9cc \uc6b4\uc601\uc5d0 \uc788\uc5b4\uc11c \ucd94\uac00\uc801\uc778 \ube44\uad50\uad70\uae4c\uc9c0 \uac70\uc758\ubaa8\ub4e0 \uc218\uc785\uc0c1\ud488\uc774 \uac19\uc774 \uc6b4\uc601\ub418\uc9c0 \uc54a\ub294\ub2e4\uba74, \uc880 \ub354 \ub9ce\uc740 \ube44\uad50\uad70\uc744 \ub9cc\ub4e4\uc5b4 \uc8fc\uc2dc\ub294 \uac83\ub3c4 \uc88b\uc744\uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc694\uc998 us\uc5d0\ub514\uc158\uc0c1\ud488\uc758 \ud310\ub9e4\uac00 \uacc4\uc18d\ud574\uc11c \ud638\uc870\ub97c \ubcf4\uc774\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc774\ub294 us\uc624\ud508 \uc0c1\ud488\uc758 \ubc1d\uace0 \uc608\uc05c\ub514\uc790\uc778\uc73c\ub85c \uc5ec\uc131\uace0\uac1d\ub2d8\ub4e4\uc758 \uc544\uc774\uce90\uce6d\uc774 \uad49\uc7a5\ud788 \uc88b\uc73c\uba70, \ub0a8\uc131\ubd84\ub4e4\uc740 \ube14\ub808\uc774\ub4dcv10\uc744 \uad6c\ub9e4\ud558\ub7ec \uc624\uc168\uc9c0\ub9cc \ud76c\uc18c\uc131\uc73c\ub85c \uad6c\ub9e4\ud558\uc2dc\uace0 \uc2f6\ub2e4\uace0 \ud558\uc2dc\ub294\ubd84\ub4e4\uc774 \ud558\ub098\uc529 \uad6c\ub9e4\ud558\uc2dc\ub294 \uac83 \uac19\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \ube14\ub808\uc774\ub4dc\uc0c1\ud488\ub9cc\ud07c\uc758 \uc88b\uc740 \ub77c\ucf13\uc774 \uc5c6\ub2e4\ub294 \ubc18\uc751\uc774 \uc694\uc998 \ud14c\ub2c8\uc2a4\uace0\uac1d\ub2d8\ub4e4 \uc0ac\uc774\uc5d0\uc11c \uc88b\uc740 \ud3c9\uac00\ub97c \ubc1b\uace0 \uc788\uc5b4\uc11c \ube14\ub808\uc774\ub4dc\ub294 \uacc4\uc18d\ud574\uc11c \uafb8\uc900\ud558\uac8c \ubca0\uc2a4\ud2b8\uc140\ub7ec\ub85c \uc790\ub9ac\ub97c \uc7a1\uc544\uac00\uace0 \uc788\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \uc774\ubc88\uc8fc\uc5d0\ub294 rf\uc758 \ud310\ub9e4\uac00 \uad49\uc7a5\ud788 \uc800\uc870\ud55c\ub370 \uc774\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9e4\uc7a5\uc5d0 \uc624\uc154\uc11c \"rf\ub77c\ucf13 \uc5b4\ub824\uc6cc\uc694?\"\uc774\ub807\uac8c \ubb3c\uc5b4\ubcf4\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uc0dd\uae38\uc815\ub3c4\ub85c \uc694\uc998 rf\ub77c\ucf13\uc758 \uc0ac\uc6a9\ub09c\uc774\ub3c4\uac00 \ub192\ub2e4\ub294 \uc758\uacac\ub4e4\uc774 \ub9ce\uc2b5\ub2c8\ub2e4. \uc6b8\ud2b8\ub77c\uc640 \ud074\ub808\uc26c\ub294 \ub298 \ubca0\uc774\uc9c1\ud55c \ud310\ub9e4\ub97c \ubcf4\uc774\uace0 \uc788\uc73c\uba70, \ub514\ud30c\uc774\uc5b4\ub85c \uc778\ud574\uc11c \ub9e4\uc7a5\uc5d0 \ubb38\uc758 \uc8fc\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc758 \ub2f5\ubcc0\uc744 \ucd5c\ub300\ud55c \ube60\ub974\uac8c \ud574\ub4dc\ub9ac\uace0\ub294 \uc788\ub294\ub370 \uacc4\uc18d\ud574\uc11c \ub9e4\uc7a5\uc5d0 \uc5c4\uccad\ub098\uac8c \ubb38\uc758\uac00 \ub9ce\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc694\uc998\uc5d0 \uc5ec\uc131\ub18d\uad6c\ub3d9\ud638\uc778\ub4e4\uc774 \uad49\uc7a5\ud788 \ub9ce\uc774 \ub298\uc5b4\ub098\uace0 \uc788\ub294 \ucd94\uc138\uc785\ub2c8\ub2e4. \ucd5c\uadfc \ud559\uc0dd\ub4e4\uc0ac\uc774\uc5d0\uc11c \"\ub18d\uad6c \ubd90\"\uc774 \uc77c\uc5b4\ub0ab\uc744 \uc815\ub3c4\ub85c \ud559\uc0dd\ubd84\ub4e4\uc774 \ub18d\uad6c\ub97c \ub9ce\uc774 \ud558\uace0 \uc788\ub294\ub370 , \uc774\ub294 \uc694\uc998 \ub18d\uad6c\uc2dc\uc7a5\uc758 \uc811\uadfc\uc131\uc774 \uc0c1\ub2f9\ud788 \ub9ce\uc774 \ubc1c\ub2ec\ud588\ub2e4\uace0 \ubcfc \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \uc5ec\uc131\ubd84\ub4e4\uc774 \uc190\uc27d\uac8c \uc990\uae38 \uc218 \uc788\ub294 \uc2a4\ud3ec\uce20\ub85c \ub18d\uad6c\ub97c \ub9ce\uc774 \uc120\ud0dd\ud558\ub294\ub370 \uc774\ub294 \uc57c\uad6c\ub098 \ucd95\uad6c\ucc98\ub7fc \uaf2d \uba87\uba85\uc774\uc11c \ubaa8\uc774\uc9c0 \uc54a\uc544\ub3c4 1\ub3001\ub85c\ub3c4 \uc2a4\ud3ec\uce20\ub97c \ud560 \uc218 \uc788\ub2e4\ub294\uac8c \uac00\uc7a5 \uc7a5\uc810\uc774\uace0, \uc5b4\ub514\uc5d0\uc11c \uacf5\uc744 \uac00\uc9c0\uace0 \ub180\uc544\ub3c4 \ubaa8\ub4e0 \ucf54\ub4dc\uac00 \uac70\uc758 \uacf5\uc9dc\ub77c\ub294 \uc774\ubbf8\uc9c0\uac00 \uc798 \uc790\ub9ac\uc7a1\ud600\uc11c \uc55e\uc73c\ub85c\ub3c4 \uacc4\uc18d\ud574\uc11c \ub18d\uad6c\uc5d0 \ub300\ud55c \uc218\uc694\uac00 \ub298\uc5b4\ub0a0\uac83\uc73c\ub85c \uc804\ub9dd\ud569\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uc774\ubc88\uc8fc\uc5d0 \uc785\uc810\uac1d\ub4e4\uc758 \uc218\uc694\ub294 \uc9c0\ub09c\uc8fc\uc640 \ube44\uc2b7\ud558\uac70\ub098 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \ucd5c\uadfc \uc2e0\uc0c1\ud488\uc758 \uc785\uace0\uac00 \ub354\ub518\ub370\ub3c4 \ubd88\uad6c\ud558\uace0 8~9\uc6d4 \ud14c\ub2c8\uc2a4\ubcf5\uc744 \uad6c\uc785\ud558\uc2dc\ub824\ub294 \uace0\uac1d\ub2d8\ub4e4\uc758 \uc218\uc694\uac00 \uacc4\uc18d\ud574\uc11c \uae09\uc99d\ud558\uc600\uace0 \uc774\ucd94\uc138\uac00 \uacc4\uc18d \uc774\uc5b4\uc9c0\uba74\uc11c \uc8fc\ub9d0\uc5d0\ub294 \uad6d\ub0b4 \ud3c9\uc77c\uc5d0\ub294 \ud574\uc678\uace0\uac1d\ub2d8\ub4e4\uc758 \uc218\uc694\uac00 \ub9ce\uc774 \ub298\uc5b4\uc11c \uad49\uc7a5\ud788 \ub9e4\uc7a5\uc774 \ubd90\ube44\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uace7 \ucd9c\uc2dc\ub418\ub294 \ub514\ud30c\uc774\uc5b4 \ub77c\ucf13\uc73c\ub85c \uc544\uc9c1 \ub2f5\ubcc0\ub3c4 \ubabb\ub4dc\ub9b0 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc744 \uc815\ub3c4\ub85c \uc694\uc998 \uc70c\uc2a8\uc758 \uc778\uae30\uac00 \ub728\uac70\uc6b4\uac83 \uac19\uc2b5\ub2c8\ub2e4."}],"8\uc6d42W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc\uc758 \ubca0\uc2a4\ud2b8\ub3c4 \ub298 \ube0c\ub77c\ud0d1\uacfc \uc2a4\ucee4\ud2b8 \uc704\uc8fc\uc758 \uc14b\ud2b8\uad6c\uc131\uc774\uc5c8\uc2b5\ub2c8\ub2e4. \ub0a8\uc131\ubd84\ub4e4\uc740 \ub77c\ucf13\uc885\ub958\uc640 \uac00\ubc29\uc744 \uad6c\ub9e4\ud558\uba74\uc11c \ubb34\uc870\uac74 \uc758\ub958\ub97c \ub9ce\uc774 \uad6c\ub9e4\ud558\uc168\uc73c\uba74\uc11c \uc6a9\ud488\ub9e4\ucd9c\uc774 \uad49\uc7a5\ud788 \uc62c\ub78f\uc73c\uba70 \ud2b9\ud788 \uc2e0\ubc1c\ub958\uc758 \ud310\ub9e4\uac00 \uc6d4\ub4f1\ud558\uac8c \uc62c\ub77c\uac00\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc774\ub294 \uc778\uc0c1\uc73c\ub85c \ub4e4\uc5b4\uc628 \ud22c\uc5b4\uac00 \ubbf8\ub07c\uc0c1\ud488\uc774 \ub418\uc5b4\uc8fc\uba74\uc11c \ub2e4\ub978 \uc0c1\ud488\ub4e4\ub3c4 \ud310\ub9e4\uac00 \uc544\uc8fc \uc798\ub418\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc774\ubc88\uc8fc fw\uc0c1\ud488\ub4e4\uc740 \ud2b9\ud788 \uc154\ub9c1\uc774 \ub4e4\uc5b4\uac00\uc788\ub294 \uc0c1\ud488\uc774 \ub108\ubb34 \ub514\uc790\uc778\uc774 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \ucd5c\uadfc\uc5d0 \ub514\uc790\uc778\uc704\uc8fc\ub85c \ub098\uc628 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac\ub294 \ud310\ub9e4\uac00 \uacc4\uc18d \uc88b\uc740\ub370 \uc774\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uc88b\uc740 \uc6d0\ub2e8\uc740 \uba3c\uc800 \uc54c\uc544\ubcf4\uae30\ub54c\ubb38\uc5d0 \ud2b9\ud788\ud55c?\uac10\uc131\uc774\ub098 \ud1a1\ub4dd\ud55c \uac10\uc131\uc758 \uc81c\ud488\ub4e4\uc744 \ub9ce\uc774 \ucc3e\uc544\uc11c \uad6c\ub9e4\ud558\uc2e0\ub2e4\uace0 \ubcf4\uc2dc\uba74 \ub420\uac83 \uac19\uc2b5\ub2c8\ub2e4. \ub77c\ucf54\uc2a4\ud14c\uc5d0\uc11c \ub098\uc624\ub294 \ud53c\ucf00\ud2f0\uc154\uce20 \ucc98\ub7fc \ub85c\uace0\ub97c \uc640\ud39c\ud654 \ud558\uc5ec\uc11c \uc81c\ud488\uc774 \uc81c\uc791\ub420 \uc218 \uc788\uc73c\uba74 \uc88b\uaca0\uace0, \ub610\ud55c \ub514\uc544\ub3c4\ub77c\ucc98\ub7fc \uc608\ub2a5\uc774\ub098 \uc720\ud29c\ube0c\uc5d0 \ucd9c\uc5f0\ud558\ub294 \uc778\uae30\ubaa8\ub378\ub4e4\uc5d0\uac8c ppl\uc774 \ub9ce\uc774 \ub098\uac14\uc73c\uba74 \uc88b\uaca0\uc2b5\ub2c8\ub2e4. \uc911\uc694\ud55c\uac74 \ubd80\uc871\ud55c \uc544\uc774\ud15c\uc774\ub098 \uc0c1\ud488\ub825\uc774\uae30 \uc774\uc804\uc5d0 \ube0c\ub79c\ub4dc \ub178\ucd9c\uc5d0 \ub300\ud55c \uace0\ubbfc\ub3c4 \uc911\uc694\ud558\uac8c \uc0dd\uac01\ud574\uc8fc\uc2dc\uba74 \ub108\ubb34 \uc88b\uc744 \uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\uc740 \ub9e4\uc7a5 \uc804\uba74\uc758 \ub9c8\ub124\ud0a8 2\ub300\uac00 \ubaa8\ub450 \uc0c9\uc0c1\ubcc4\ub85c \ub4e4\uace0 \uc788\ub294\ub370 \uc678\uad6d\uc778\ub4e4\uacfc \uad6d\ub300 \uace0\uac1d\ub2d8\ub4e4\uaed8 \ubc18\uc751\uc774 \uad49\uc7a5\ud788 \uc88b\uc2b5\ub2c8\ub2e4. \uae30\uc874\uc5d0 \uc62c\uc5b4\ub77c\uc6b4\ub4dc\uc9d0\ubc31\uc774 \ud310\ub9e4\uac00 \uad49\uc7a5\ud788 \uc88b\uc558\ub294\ub370 \ud1a0\ud2b8\ubc31\uc774 \ucd9c\uc2dc\ub418\uace0 \ud310\ub9e4\uac00 \ub5a8\uc5b4\uc9c8 \uc815\ub3c4\ub85c \uc774\ubc88\uc8fc\uc5d0\ub294 \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\uc744 \uc815\ub9d0 \ub9ce\uc774 \ucc3e\uc73c\uc2ed\ub2c8\ub2e4. \ub2c8\uc0ad\uc2a4\uc640 \ubaa8\uc790\ub958\ub294 \uc2e0\uc0c1\uceec\ub7ec\uac00 \ub0b4\uce04\ub7f4\ud558\uac8c \uc81c\uc791\ub418\uc5b4\uc11c \uc9c0\ub09c\uc2dc\uc98c\uacfc \ub3d9\uc77c\ud558\uac8c \ud310\ub9e4\uac00 \uc798\ub418\uace0 \uc788\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc774\ubc88\uc8fc\uc5d0 \uc2e0\ubc1c \ud130\uce58\uc728\uc774 8\uc6d4\ub4e4\uc5b4\uc11c \uac00\uc7a5 \uc88b\uc558\uc2b5\ub2c8\ub2e4. \uc9c4\uc791\uc5d0 \uc2e0\uc0c1\uc774 \ube68\ub9ac \ucd9c\uc2dc\uac00 \ub418\uc5c8\uc5b4\uc57c \ud558\ub294\ub370 \uc2e0\ubc1c\uc740 \ucd9c\uc2dc\uc77c\uc774\ub098 \uc785\uace0\uc77c\uc774 \uc815\ud574\uc838\uc788\uc9c0\uc54a\uc544\uc11c \ub9e4\uc7a5\uc5d0\uc11c \uae09\ud558\uac8c \ub9ce\uc774 \ud544\uc694\ud588\ub294\ub370 fw\ud575\uc2ec\uc0c1\ud488\uc774 \ucd9c\uc2dc\ub418\uba74\uc11c \uac71\uc815\uc744 \ud55c\uc2dc\ub984 \ub35c\uc5c8\uace0 \uc2e4\uc81c \uc2e0\ubc1c\ud310\ub9e4\ub3c4 \uc6d4\ub4f1\ud788 \uc798\ub418\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub0a8\uc131\ubd84\ub4e4\uc774 \uad49\uc7a5\ud788 \ub514\ud30c\uc774\uc5b4\ub77c\ucf13\uc744 \ub9ce\uc774 \ucc3e\uc73c\uc2dc\ub294\uac74 \uc0ac\uc2e4\uc785\ub2c8\ub2e4. \uc5ec\uc131\ubd84\ub4e4\uac19\uc740\uacbd\uc6b0\uc5d0\ub3c4 \ub514\ud30c\uc774\uc5b4\uc640 \ub514\ud30c\uc774\uc5b4 \ubc94\ud37c?\uac19\uc740 \uac1c\uc870\ud488\uae4c\uc9c0 \uc138\uc138\ud558\uac8c \uc5c4\uccad \ubb3c\uc5b4\ubcf4\uc2dc\uba74\uc11c \ub514\uc544\ud30c\uc774\uc5b4\ub97c \uad6c\ub9e4\ud558\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uacc4\uc2e0\ub370, \uc0ac\uc2e4 100L\uac19\uc740 \uacbd\uc6b0\uc5d0\ub294 \ucd5c\uc18c 1\ub144\uc774\uc0c1\uad6c\ub825\uc774 \uc788\uc73c\uc2e0 \uace0\uac1d\ub2d8\ub4e4\uc774 \uc804\ubd80 \ub2e4 \uad6c\ub9e4\ud558\uc168\uace0, 100ul\uac19\uc740 \uacbd\uc6b0\uc5d0\ub294 \ub9e4\uc7a5\uc5d0 \ucc98\uc74c \uc624\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uad6c\ub9e4\ud574\uc8fc\uc2e0\uac70\ub77c\uc11c \ub9e4\uc7a5\uc5d0\uc11c \uc138\uc77c\uc988\ub85c \ud310\ub9e4\ud558\ub294 \uacbd\uc6b0\uac00 \ud6e8\uc52c \ub9ce\uc2b5\ub2c8\ub2e4. \ub0a8\uc131\uc2a4\ud329\uc774 \uc785\uace0\ub418\uba74 \uc77c\ub2e8 \uc9c0\uae08\ub3c4 \uc815\uc2e0\uc5c6\uc9c0\ub9cc \ub354\uc6b1\ub354 \uc815\uc2e0\uc5c6\uc744 \uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub18d\uad6c\uacf5\uc744 \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\ub4e4\uc740 \ubcf4\ud1b5 \ucd08~\uace0\ub4f1\ud559\uc0dd\ubd84\ub4e4\uc774 \ub9ce\uc558\ub294\ub370 \uc774\ubd84\ub4e4\uc740 \uc624\ub85c\uc9c0 \ub9e4\uc7a5\uc5d0 \uc624\uc2dc\uba74 \uc5d0\ubcfc\ub8e8\uc158\ub9cc \uace0\uc9d1\ud558\uc2dc\ub294\uac83 \uac19\uc2b5\ub2c8\ub2e4. \ub9e4\uc7a5\uc5d0 \uc788\ub294 \ubcfc\ud0c0\uc6cc\uc5d0 \uc9c4\uc5f4\ud560 \uc218 \uc788\ub294 \uc0c1\ud488\uc740 \ud55c\uacc4\uac00 \uc788\uc9c0\ub9cc, \uadf8 \ub9ce\uc740 \ub18d\uad6c\uacf5\uc911\uc5d0\uc11c\ub3c4 \uc5d0\ubcfc\ub8e8\uc158\ub9cc \ucc3e\uc73c\ub2c8, fw\uc5d0\ub294 \uc5d0\ubcfc\ub8e8\uc158\uc774 \uc7ac\uace0\uac00 \ud6e8\uc52c\ub354 \ub9ce\uc544\uc84c\uc73c\uba74 \uc88b\uaca0\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ud655\uc2e4\ud788 \uc774\ubc88\uc8fc\uc5d0 \uace0\uac1d\uc785\uc810\uc774 \uc5c4\uccad \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uc9c0\ub09c\uc8fc\uc5d0\ub294 \ub0a0\uc528\uac00 \ub108\ubb34 \ub365\uac70\ub098 \uc7a5\ub9c8\uac00 \uc2ec\ud588\ub294\ub370, \uc774\ubc88\uc8fc\ub294 \ub0a0\uc528\uac00 \uc88b\ub2e4\ubcf4\ub2c8 \ud14c\ub2c8\uc2a4\ubcf5\uc744 \uad6c\ub9e4\ud574\uc57c\ud55c\ub2e4\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uc778\uc2dd\uc774 \uc5c4\uccad \uac15\ud574\uc11c \ub9e4\uc7a5\uc5d0 \uc624\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc558\uace0, \ud2b9\ud788 \uc0e4\ub12c \uc545\uc138\ub77c\ub9ac , \ud2f0\ud30c\ub2c8\ud31d\uc5c5\uae4c\uc9c0 \uc9c0\uae08 \ud574\uc678 \uc678\uad6d\uc778\ub4e4\uc774 \uc2e0\uc138\uacc4\uac15\ub0a8\uc5d0 \uc624\uba74 \ubcfc\uac70\ub9ac \uc0b4\uac70\ub9ac\ub4e4\uc774 \ub9ce\uc544\uc11c \ubc31\ud654\uc810\uc5d0 \uc624\uc2dc\ub294 \ud14c\ub2c8\uc2a4\ub97c \uce58\ub294 \uc678\uad6d\uc778\uace0\uac1d\ub2d8\ub4e4\uc740 \uaf2d \uc70c\uc2a8\uc5d0 \ub4e4\ub824\uc11c \uc81c\ud488\uc744 \ub109\ub109\ud558\uac8c \uc0ac\uac00\uc2dc\ub294 \uac83 \uac19\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \uc774\ubc88\uc8fc\ub294 \ub0a8\uc131\uc678\uad6d\uc778\ub4e4\uc758 \ubc29\ubb38\uc774 \ub9ce\uc558\uace0 \ub0a8\uc131\uace0\uac1d\ub2d8\ub4e4\uc758 \uc120\ubb3c\uc744 \uc0ac\ub294 \uc5ec\uc131\uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc544\uc11c \ub118\uc131\uc81c\ud488\ub4e4\uc758 \ud310\ub9e4\uac00 \uc804\uc8fc\ub300\ube44 \ub9ce\uc774 \uc62c\ub790\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \ube0c\ub85c\ud070\ub09c \uc2f8\uc774\uc988\uc758 \uc81c\ud488\ub4e4\uc744 \ucc3e\uc73c\uc2dc\ub294 \ubd84\ub4e4\uc740 \uc608\uc804\ucc98\ub7fc \uadf8\ub0e5 \ub098\uac00\ub294\uac8c \uc544\ub2c8\ub77c \ubb34\uc870\uac74 \uac00\ubc29\uc740 \ud558\ub098\uc529 \uad6c\ub9e4\ud558\uc2dc\ub2c8\uae4c \ub9e4\uc7a5\uc5d0 \uc624\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc758 \ub2c8\uc988\ub294 \uc81c\ud488\uc774 \uc544\ub2c8\ub77c \uc70c\uc2a8\uc774\ub77c\uace0 \uc0dd\uac01\ub418\ub294 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4."}],"8\uc6d43W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uc9c0\ub09c\uc8fc\uc640 \ub3d9\uc77c\ud558\uac8c 20~40\ub300 \uace0\uac1d\ub2d8\ub4e4\uc758 \ube0c\ub77c\ud0d1\uacfc \uc2a4\ucee4\ud2b8\ub958\uc758 \uc14b\uc5c5\ud310\ub9e4\uac00 \uc815\ub9d0 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \uc544\uc9c1 \ub0a0\uc528\uac00 \ub365\uae30 \ub54c\ubb38\uc5d0 \uc5ec\uc131\uace0\uac1d\ub2d8\ub4e4\uc758 \ube0c\ub77c\ud0d1\ubb38\uc758\uac00 \uad49\uc7a5\ud788 \ub9ce\uc740\uc0c1\ud0dc\uc774\uba70, \ub0a8\uc13130~40\ub300 \uace0\uac1d\ub2d8\ub4e4\uc740 \uc544\ub178\ub77d\ub958\ub97c \uc5c4\uccad \ub9ce\uc774 \ucc3e\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \ud53c\uc2a4\ud14c\ubc18\ud314\uc6d0\ub2e8\uc778\ub370 \uad49\uc7a5\ud788 \uac00\ubccd\uace0 \uc2dc\uc6d0\ud55c \ud2b8\ub9ac\ucf54\ud2b8\ub97c \uc120\ud638\ud588\uc2b5\ub2c8\ub2e4. \ud4e8\uc5b4\ub4dc\ub77c\uc774\ub294 \uacc4\uc18d\ud574\uc11c \ud310\ub9e4\uc21c\uc704\uac00 1\ub4f1\uc774\ub77c\uace0 \ubcf4\uc2dc\uba74 \ub418\uba70, \uc5ec\uc131\uace0\uac1d\ub2d8\ub4e4\uc740 \uc2a4\ucee4\ud2b8\ub97c \uad6c\ub9e4\ud558\uba74\uc11c \ubb34\uc870\uac74 \uc14b\ud2b8\uc774\ub108\ub97c \uc0ac\uc57c\ud558\uae30\ub54c\ubb38\uc5d0 \uc774\uc810\uc744 \uace0\ub824 \ud588\uc744\ub54c \ub0b4\ub144\uc5d0\ub294 \ube0c\ub77c\ud0d1\uc758\uc218\uc785\uc774 \uad49\uc7a5\ud788 \uc911\uc694\ud560 \uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"1. \ud655\uc2e4\ud788 \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\uac19\uc740 \uc2e0\ud615\ub77c\uc778\uc5c5\uc744 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc774 \uc120\ud638\ud569\ub2c8\ub2e4. \uc774\uc720\ub294 \uc785\uc73c\uba74 \ubb54\uac00 \uc384\ubcf4\uc778\ub2e4?\ud14c\ub2c8\uc2a4\ub97c \uc798\uce60\uac83\uac19\uc544 \ubcf4\uc774\ub294 \ud37c\ud3ec\uba3c\uc2a4\ud55c \ub514\uc790\uc778\uc744 \ub9ce\uc774 \uc120\ud638\ud558\uba70 \ud601\uc2dc\ub098 \ube45\uc560\ud50c\ucc98\ub7fc \uba74\uc18c\uc7ac\ub85c \ub098\uc628\uc0c1\ud488\uc740 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c\uc6a9\uc73c\ub85c \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. 2. \uace0\ub9e4\ud558\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc740 \uad49\uc7a5\ud788 \ub2e4\uc591\ud55c\ub370 \uc5ec\uc131\uace0\uac1d\ub2d8\ub4e4\uc740 \ub0a8\uc131\uc6a9 \ud4e8\uc5b4\ub4dc\ub77c\uc774\uc18c\uc7ac\uc758 \ubc18\ud314\ud2f0 xs\ub97c \uad49\uc7a5\ud788 \ub9ce\uc774 \ubb3c\uc5b4\ubcf4\uc168\uace0 \uc694\uc998\uc740 \uc9c4\uc9dc \uac11\uc790\uae30 \uc2e0\uaddc\uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc774 \ub298\uc5b4\uc11c \ud55c\ubc88 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uc2dc\uba74 \ub300\ub7c9\uc73c\ub85c \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc2b5\ub2c8\ub2e4. 3. \ubbf8\uad6c\ub9e4\ud558\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\ubcf4\ub2e4 \uc2f8\uc774\uc988\uac00 \uc5c6\uac70\ub098 \uc0dd\uac01\ud588\ub358 \uc0c1\ud488\ub4e4\uc774 \uc5c6\uc73c\uba74 \uad6c\ub9e4\ub97c \ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \ub514\ud30c\uc774\uc5b4\ucc98\ub7fc \ub77c\ucf13\uc740 \ub108\ubb34 \ud655\uc2e4\ud788 \uad6c\ub9e4\uc758\uc0ac\uac00 \uba85\ud655\ud558\uace0, \uc758\ub958\ub294 \uc7ac\uace0\uc18c\uc9c4\uc774 \ube60\ub974\uae30\ub54c\ubb38\uc5d0 \uc88b\uc544\ud558\ub294 \uc0c9\uc0c1\uc774 \uc5c6\ub2e4\uba74 \ubbf8\ud0c8\ub418\ub294 \uacbd\uc6b0\uac00 \uc885\uc885 \uc788\uc2b5\ub2c8\ub2e4. \ud558\uc9c0\ub9cc \uc774\ubc88\uc8fc\uc5d0\ub294 \uc0c9\uc0c1\uc885\ub958\uac00 \uc6cc\ub099\ub9ce\uc558\uc5b4\uc11c \uc5ec\uc131\uace0\uac1d\ub2c8\ub4e4\uc758 \uc774\ud0c8\uc774 \uc5c6\uc5c8\uc2b5\ub2c8\ub2e4. 4. \ud604\uc7ac \uc544\uc9c1\ub3c4 \ub108\ubb34 \ub354\uc6b4\ub0a0\uc528\ub85c fw\uc0c1\ud488\uc744 \uace0\uac1d\ub2d8\ub4e4\uc774 \uad6c\ub9e4\ud560 \uc5c4\ub450\ub97c \ubabb\ub290\ub07c\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc774\uac74 \uc815\ud655\ud558\uac8c \ub0a0\uc528\ud480\ub9ac\uba74 \uc758\ub958\ub294 \ud6e8\uc52c \ucb49\ucb49 \uc798\ud314\ub9b4 \uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\uc740 \uc9c0\ub09c\ubc88 \"\uadf8\ub85c\ube0c\"\uc2dc\uc98c\ub54c \uad6c\ub9e4\ub97c \ubabb\ud588\ub358 \uace0\uac1d\ub2d8\ub4e4\uc774 \uc720\uc0ac \ube44\uc2b7\ud558\ub2e4\uace0 \uc774\ubbf8 \uc778\uc2a4\ud0c0\uc5d0\uc11c\ub098 \uacf5\ud648\uc5d0\uc11c \ubcf4\uace0 \uc624\uc2dc\ub294\ubd84\ub4e4\uc774 \uc5c4\uccad \ub9ce\uc558\uace0, \uc2e4\uc81c\ub85c \uace0\uac1d\ub2d8\ub4e4\uc774 \ud50c\ub9ac\uc5d0\uc0c1\ud488\uc744 \ubc31\ud329\uc744 \ud3ec\uae30\ud558\uace0 \uad6c\ub9e4\ud560 \uc815\ub3c4\ub85c \uc5c4\uccad \uc88b\uc544\ud558\ub294 \uc0c1\ud488\uc774\ub77c\ub294 \uac74 \ud655\uc2e4\ud569\ub2c8\ub2e4. \uc2e4\uc7ac \ud50c\ub9ac\uc5d0 \uc81c\ud488\ub355\uc5d0 \ud558\ub8e8\ub294 \ubc31\ud329\ubcf4\ub2e4 \ud06c\ub85c\uc2a4\ubc31\uc885\ub958\ub4e4\uc774 \ub354 \ub9ce\uc774 \ud314\ub9b0\ub0a0\ub3c4 \uc788\uc5c8\uace0 , \ub4dc\ub85c\uc6b0 \ud1a0\ud2b8\ubc31\uc740 \ub4dc\ub85c\uc6b0\uc2a4\ub4dc\ub9c1\ucc98\ub7fc \uadc0\uc5fd\uac8c \ub9cc\ub4e4\uc218 \uc788\ub294 \uc720\ub2c8\ud06c\ud55c \uc810 \ub54c\ubb38\uc5d0 \ub514\uc790\uc778\ud558\ub098\ub9cc \ubcf4\uace0 \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc2b5\ub2c8\ub2e4. \uc0ac\uc2e4 \uc81c\ud488\uc744 \uad6c\ub9e4\ud574\uc11c \ubcf4\uba74 \uc2e4\uc81c\ub85c \uc0ac\uc6a9\ud558\ub294 \ud3ec\ucf13\uc774 \ub9ce\uc9c0\uc54a\ub2e4\ub294\uac78\uc744 \uace0\uac1d\ub2d8\ub4e4\ub3c4 \uc778\uc9c0\ud558\uace0 \uc788\uc5b4\uc11c \ubb34\uc870\uac74 \"\uc678\uad00\"\ub9cc \uc774\uc05c \uc0c1\ud488\uc744 \uc120\ud0dd\ud55c\ub2e4\uace0 \ubcf4\uc2dc\uba74 \ub429\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2e0\uc0c1\uc73c\ub85c \ub4e4\uc5b4\uc628 \uc0c1\ud488\uc774 \uc0dd\uac01\ubcf4\ub2e4 \ud310\ub9e4\uac00 \ud655\uc62c\ub77c\uc624\uc9c0\ub294 \uc54a\ub294\uac83 \uac19\uc2b5\ub2c8\ub2e4. \uace0\uac1d\ub2d8\ub4e4\uc774 \uc774\ubc88 \uc5ec\ub984\uc5d0 \uc2e0\ubc1c\uc744 \ub108\ubb34 \ub9ce\uc774 \uad6c\ub9e4\ud558\uc168\ub2e4\uba74\uc11c , \uc624\ud788\ub824 fw\uc5d0 \ub098\uc628\uac8c \ub7ec\uc26c\ud22c\uc5b4/\uc778\ud2b8\ub9ac\uc2a4 1\uc885\ub958\uc2dd\ub9cc \ub098\uc640\uc11c \uc544\uc9c1\uae4c\uc9c0\ub294 \uc880\ub354 \uae30\ub2ec\ub838\ub2e4\uac00 \uc2e0\uc0c1\ud488\uc774 \ub098\uc624\uba74 \ub098\uc624\uba74 \uac19\uc774 \ud55c\ubc88\ub354 \uad6c\uacbd\ud558\uace0 \uad6c\uc785\ud558\uace0 \uc2f6\ub2e4\uace0 \ud558\uc168\uc2b5\ub2c8\ub2e4. 1\uc885\ub958\ub9cc \uc785\uace0\ub418\uc5b4\uc11c \uc2e0\uc0c1\ud488\uc758 \ubc18\uc751\uc744 \ubcf4\uae30 \uc5b4\ub835\uae30\ub54c\ubb38\uc5d0 \ube60\ub978 fw\uc2dc\uc98c\uc0c1\ud488\uc758 \uc785\uace0\uac00 \uc911\uc694\ud560 \uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub514\ud30c\uc774\uc5b4 \ub77c\ucf13 100L\ubb38\uc758\uac00 \ub04a\uc774\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc0ac\uc2e4\uc0c1 \ub514\ud30c\uc774\uc5b4\ub97c \uc0ac\uc6a9\ud558\uc2dc\ub824\uba74 \ud14c\ub2c8\uc2a4\ub97c \uc544\uc608 \ubaa8\ub974\ub294 \uc785\ubb38\uc790\ubd84\ub4e4\uc774 \uc0ac\uc6a9\ud558\uae30\uc5d0 \uc5b4\ub824\uc6b4\ub77c\ucf13\uc774\ub77c\uc11c \uad6c\ub825\uc774 \ub9ce\uc740 \uace0\uac1d\ub2d8\ub4e4\uc5d0\uac8c \ud310\ub9e4\uac00 \ub420\uc218\ubc16\uc5d0 \uc5c6\uace0 \ucd5c\uadfc \"\uc778\uc2a4\ud0c0 \uc2a4\ud1a0\ub9ac\"\uc5d0 \ubc14\uc774\ub7f4\uc744 \ud0dc\uc6b0\uba74 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9e4\uc7a5\uc73c\ub85c \ucc3e\uc544\uc624\uc2dc\uac70\ub098 \ud639\uc740 \uc804\ud654\ub97c \uad49\uc7a5\ud788 \ub9ce\uc774 \uc8fc\uc2ed\ub2c8\ub2e4. \ub9e4\uc7a5\uc5d0 \uc7ac\uace0\uac00 \uc788\uc73c\uba74 \uc0ac\uace0\uc2f6\ub2e4\uac70\ub098 \uc544\ub2c8\uba74 \uc2a4\ud2b8\ub9c1\uc791\uc5c5\uc744\ud574\uc11c \ud0dd\ubc30\uac00 \uac00\ub2a5\ud558\ub0d0 \ub77c\uace0 \ubb38\uc758\uac00 \ub9ce\uc740\ub370 \uc7ac\uace0\uac00 \uc5c6\uc5b4\uc11c \ud310\ub9e4 \ub85c\uc2a4\uac00 \ub418\ub294 \ubd80\ubd84\uc774 \uc815\ub9d0 \ub208\ubb3c\ub098\uac8c \uc544\uc27d\uace0.... \uc55e\uc73c\ub85c\ub3c4 \ub09c\uc774\ub3c4\uac00 \uc788\ub294 \uc0c1\ud488\uc774 \ub514\uc790\uc778\ud480\uccb4\uc778\uc9c0\uac00 \ub420\ub54c \uc2a4\ud329\uc218\uc785\uc5d0 \uc788\uc5b4\uc11c \uc870\uae08\ub354 \uc2e4\uad6c\ub9e4\uce35\uc758 \uc218\uc694\uc744 \uace0\ub824\ud574\uc11c \uc218\ub7c9\uc744 \uc218\uc785\ud558\uba74 \uc870\uae08\ub354 \ub9e4\uc7a5\uc5d0 \ub3c4\uc6c0\uc774 \ub420\uac83 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc624\ub298 \ub18d\uad6c\uacf5\uc744 \uad6c\ub9e4\ud558\uc2dc\ub7ec \uc624\uc2e0\ubd84\ub4e4\uc774 \ud14c\ub2c8\uc2a4\ub77c\ucf13\uc744 \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \uc788\uc5c8\ub294\ub370, \uc6d0\ub808 \uc5b4\ub9b4\ub54c\ud14c\ub2c8\uc2a4\ub97c \ucce4\ub294\ub370 \ub2e4\uc2dc\uc2dc\uc791\ud558\ub824\uace0 \ud14c\ub2c8\uc2a4 \ub77c\ucf13\uc744 \uad6c\ub9e4\ud558\uc2dc\ub294 \ubd84\uc774\ub77c\uace0 \ud588\uc2b5\ub2c8\ub2e4. \ub18d\uad6c\ub294 \ud3c9\uc18c\uc5d0\ub3c4 \ub9ce\uc774 \uc990\uaca8\ud558\uc9c0\ub9cc \uc774\uc81c \ud14c\ub2c8\uc2a4\ub77c\ub294 \uc6b4\ub3d9\uc740 \uc0ac\uad50\uc6b4\ub3d9\uc73c\ub85c \ub9ce\uc774 \ud558\uae30\ub54c\ubb38\uc5d0 \uc774\uc810\uc744 \uace0\ub824\ud588\uc744\ub54c \uc0dd\uac01\ubcf4\ub2e4 \ud14c\ub2c8\uc2a4\uace0\uac1d\ub2d8\ub4e4\uc758 \uc778\uc6d0\uc774 \ud655\ub300\ub418\uace0 \uc788\ub294 \uac83 \uac19\uc2b5\ub2c8\ub2e4. \uc55e\uc73c\ub85c\ub3c4 \ub354 \uc911\uc694\ud55c\uac74 \ud14c\ub2c8\uc2a4\uc785\ubb38\uc790\ub4e4\uc758 \uc218\uc694\ub97c \uc62c\ub9ac\uae30\uc704\ud574\uc11c \"\ud2b9\uc815 \uc2a4\ud3ec\uce20\uc6e8\uc5b4 \uc81c\uc791\"\uc758 \ud3ed\uc744 \uc880\ub354 \ub298\ub824\uc11c \uace0\uac1d\ub2d8\ub4e4\uc758 \uc778\uc2dd\uc5d0 \"\uc640~! \ud14c\ub2c8\uc2a4\ube0c\ub79c\ub4dc\uac00 \ub18d\uad6c,\ucd95\uad6c,\ubc30\uad6c,\uac19\uc740 \uc2a4\ud3ec\uce20\ub97c \ud560\ub54c \uc785\ub294 \uc0c1\ud488\ub3c4 \ub9cc\ub4e4\uace0 \uc788\uad6c\ub098!\"\ud558\ub294 \uc81c\ud488\ub4e4\uc744 \uacc4\uc18d\ud574\uc11c \ub9cc\ub4e4\uc5c8\uc73c\uba74 \uc88b\uaca0\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ub9e4\uc7a5\uc5d0 \uc815\ub9d0 \uc274\uc0c8\uc5c6\uc774 \uc804\ud654\ub97c \ud558\uace0 \uace0\uac1d\ub2d8\ub4e4\uc774 \ubc29\ubb38\ud569\ub2c8\ub2e4. \"\ub9e4\ub2c8\uc838\ub2d8 \uc624\ub298\uacc4\uc2e0\uac00\uc694?\"\ud558\uace0 \uc804\ud654\ub97c \ud558\uace0 \uc624\uc2dc\uac70\ub098 \uc778\uc2a4\ud0c0\ub85c dm\ub97c \uc8fc\uace0 \uc624\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 50%\uc774\uc0c1\uc778\ub370 \ud2b9\ud788 \uba85\ud568\uc744 \uc815\ub9d0 \ub9ce\uc774 \ubfcc\ub9ac\uae34 \ud55c\uac83 \uac19\uc2b5\ub2c8\ub2e4. 4~5\uc6d4\ubfd0\ub9cc\uc544\ub2c8\ub77c \uac15\ub118\uc810\uc744 \ucc3e\uc73c\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc740 \"\uc70c\uc2a8\ud648\ucf54\ud2b8\"\uc2dc\ub9ac\uc988\ub97c \ud1b5\ud574\uc11c \ub9e4\uc7a5\uc5d0 \uc785\uc810\ud558\uc2dc\ub294\ubd84\ub4e4\uc774 \uc9c4\uc9dc 70%\uc774\uc0c1\uc77c \uc815\ub3c4\ub85c \uc774\uc81c\ub294 \ub9e4\uc7a5\uc5d0 \ucc98\uc74c\uc624\uc154\ub3c4 \ub9e4\uc7a5\ubc16\uc5d0\uc11c \ub450\ubc88\uc774\uc0c1 \ub9c8\ucd94\ucce4\ub358\uace0\uac1d\ub2d8\ub4e4\uc774\uae30\uc5d0 \"\uc785\uc810\uc758 \ubcc0\ud654\"\uac00 \uc788\ub2e4\ub294 \uc774\uc57c\uae30\ubcf4\ub2e4\ub294 \uadf8\ub0e5 \ud14c\ub2c8\uc2a4\uc778\ub4e4\uc740 \"\uc70c\uc2a8\ub9e4\uc7a5\uc744 \uac00\uc57c\ud55c\ub2e4\"\ub77c\ub294 \uc778\uc2dd\uc774 \uc870\uae08\uc529 \uc0dd\uaca8\ub098\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc2e4\uc7ac \uad6c\ub9e4\uae4c\uc9c0 \ud574\uc8fc\uc2dc\uba74 \uc88b\uc9c0\ub9cc \uad73\uc774 \uad6c\ub9e4\ub97c \ud558\uc9c0\uc54a\uc544\ub3c4 \ub9e4\uc7a5\uc5d0 \uc624\uba74 \uc0ac\uc740\ud488\uc744 \ubc1b\uac70\ub098, \ucee4\ud53c\ub97c \uc0ac\uc8fc\uace0 \uc2f6\ub2e4\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uae30\ub54c\ubb38\uc5d0 \uac19\uc774 \ub3d9\ubc18\uace0\uac1d\uc73c\ub85c \uc624\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9e4\uc7a5\uc5d0\uc11c \uc81c\ud488\uc744 \uc624\ud788\ub824 \ub354 \ub9ce\uc774 \uad6c\ub9e4\ud558\uc2dc\ub294 \uacbd\uc6b0\ub3c4 \ub9ce\uc2b5\ub2c8\ub2e4. \uc678\uad6d\uc778\uace0\uac1d\ub2d8\ub4e4\uc740 \uc2e0\uaddc65%\uc7ac\ubc29\ubb3835%!! \uc7ac\ubc29\ubb38\uc774 \uc815\ub9d0 \uc0c1\ub2f9\ud788 \ub9ce\uc2b5\ub2c8\ub2e4. \uc694\uc998 \uc911\uad6d\uc5b4 \uacf5\ubd80\ub97c \ud558\uace0 \uc788\ub294\ub370 \ud574\uc678\uc5d0\uc11c \uc624\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \uc911\uad6d\uc5b4\uac00 \ub298\uc5c8\ub2e4\uba74\uc11c \uce6d\ucc2c\ub3c4\ud574\uc8fc\uc2dc\uace0 \ub610\ud55c \ub9e4\uc7a5\uc5d0 \uc624\uc2dc\ub294 \uc678\uad6d\ub2e8\uace8\uc190\ub2d8\ub4e4\uc774 \uce5c\uad6c\ub4e4\uae4c\u 88 \uc88b\uc544\uc9c4\uac74 \uc0ac\uc2e4\uc785\ub2c8\ub2e4. \ud558\uc9c0\ub9cc \ud3ed\ubc1c\uc801\uc73c\ub85c \ubc18\uc751\uc774 \uc62c\ub9cc\ud55c \uc0c1\ud488\ub4e4\uc774 1\uac00\uc9c0?2\uac00\uc9c0?\uc2a4\ud0c0\uc77c\uc774\ub77c\uace0 \ubcf4\uc2dc\uba74 \ub429\ub2c8\ub2e4. \ud2f0\uc154\uce20\ub85c \uc608\ub97c\ub4e4\uba74 \ub0a8\uc131\uc6a9 \ud4e8\uc5b4\ub4dc\ub77c\uc774\uc2a4\ud0c0\uc77c\uc774 \ub9ce\uc774 \ucd9c\uc774 \ub418\uc5c8\ub294\ub370, \uc55e\ud310\ub85c\uace0\uc2a4\ud0c0\uc77c\uc740 \uc791\ub144\uc2a4\ud0c0\uc77c\uacfc \ub9e4\uc6b0 \ud761\uc0ac\ud558\uace0 \ub514\uc790\uc778\uc774 \ud654\ub824\ud55c \uc2a4\ud0c0\uc77c\uc740\uc740 \ubaa8\ub450 \ub4f1\ud310\uc5d0\ub9cc \ub514\uc790\uc778\uc774 \ub4e4\uc5b4\uac00\uc788\uc5b4\uc11c \ud37c\ud3ec\uba3c\uc2a4\ud558\uac70\ub098 \uc2e0\uc120\ud558\uac8c \ub098\uc628 \uc2a4\ud0c0\uc77c\uc740 1~2\uac00\uc9c0 \uc2a4\ud0c0\uc77c\uc774\ub77c\uc11c \uc2a4\ud0c0\uc77c\uc744 \uace0\uac1d\ub2d8\ub4e4\uaed8 \uc81c\uc548\ub4dc\ub824\ub3c4 \uc778\uae30\uc0c1\ud488\ub9cc \uc798\ud314\ub9bd\ub2c8\ub2e4. \uae30\uc874\uc5d0 \ub0a8\uc131\uc6a9 \uc587\uc740 \uae34\ubc14\uc9c0\uc2a4\ud0c0\uc77c\uc740 \uc2ac\ub9bc\ud54f\uc73c\ub85c \ub098\uc624\uba74 \uc774\uc81c \uc815\ub9d0 \uc548\ud314\ub9ac\ub2c8\uae4c \uc640\uc774\ub4dc\ud615\uc2dd\uc73c\ub85c \ub2e4\uc2dc \ub9cc\ub4e4\uc5b4 \uc8fc\uc168\uc73c\uba74 \uc88b\uaca0\uc73c\uba70 , \ucca0\uc800\ud558\uac8c \ud544\uc694\ud55c \uc2a4\ud0c0\uc77c\uc740 \ub0a8\uc131\uc6a9 \ub808\uade4\ub7ec\ud54f \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac \uc785\ub2c8\ub2e4. \ud600\uc131\uc6a9\uc740 \uc774\uc81c \ud53c\ud0a4\uc2a4\ud0c0\uc77c\uc758 \ub125\uc2a4\ud2b8\ubc84\uc83c\uc774 \uc785\uace0\uac00 \ub418\uc5b4\uc57c \ud560\uac83 \uac19\uc2b5\ub2c8\ub2e4. \uace0\uac1d\ub2d8\ub4e4\uc774 \ucd5c\uadfc \ube0c\ub77c\ud0d1\uc744 \uad49\uc7a5\ud788 \ub9ce\uc774 \ucc3e\uc73c\uc168\ub294\ub370 \uc774\ubc88\uc8fc\uc5d0 \ucd94\uac00\ub85c 2\uc2a4\ud0c0\uc77c\uc815\ub3c4 \ub4e4\uc5b4\uc640\uc11c \uc228\ud1b5 785\uc810 \ub3d9\ud5a5","fb":"\ub0a0\uc528 \uc601\ud5a5\uc73c\ub85c \ud3c9\uc77c \uc804\uc8fc\ub300\ube44 \uac1d\uc218\ub294 \ub298\uc5b4\ub0ac\uace0 \uc8fc\ub9d0\uc740 \ud070\ucc28\uc774 \uc5c6\uc5c8\ub358\uac70 \uac19\uc2b5\ub2c8\ub2e4."}]},"\uc544\uc774\ud30c\ud06c":{"8\uc6d41W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc\ub3c4 \uc804\uc8fc\uc640 \ube44\uc2b7\ud558\uac8c \ud3ed\uc5fc\uc774 \uc774\uc5b4\uc9c0\uba74\uc11c \uc2dc\uc6d0\ud55c \uc18c\uc7ac\ub97c \ucc3e\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc774 \uacc4\uc168\uc2b5\ub2c8\ub2e4. \uc2dc\uc5b4\uc544\uc774\uc2a4 \ud310\ub9e4\uac00 \ub2e4\uc2dc \uc62c\ub77c\uc624\uace0 \ub0a8\uc131 \uace0\uac1d\ub4e4\uc740 \ud2b9\ud788\ub098 \uc5d8\ub9ac\ud2b8, \uc2a4\ud53c\ub4dc \ub77c\uc778 \ud130\uce58\uac00 \ub192\uc558\uc2b5\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc154\ub9c1 \ud130\uce58 \ubc0f \uad6c\ub9e4\uac00 \uc788\uc5c8\uc73c\uba70 1020 \uace0\uac1d\ub4e4\uc758 \ub192\uc740 \uc120\ud638\ub3c4\ub97c \ubcf4\uc600\uc2b5\ub2c8\ub2e4. \uc5ec\uc131 \uc2a4\ud53c\ub4dc \ub4dc\ub77c\uc774\ub294 \uae30\uc7a5\uc774 \ub2e4\uc18c \uae38\ub2e4\uac70\ub098 \uc560\ub9e4\ud558\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \uc788\uc5b4 \uae30\ubcf8 \ud4e8\uc5b4\ub4dc\ub77c\uc774\ub85c \uad6c\ub9e4\uc804\ud658 \uc774\ub8e8\uc5b4\uc9d1\ub2c8\ub2e4. \uc62c\ucf54\ud2b8 3\uc778\uce58 \uc20f\uce20& \ucee4\ube0c\ub77c\uc778 \ud2b8\ub799\uc2a4\ucee4\ud2b8 \ub4f1 \uc5ec\uc131 \uace0\uac1d\ub4e4 \ub450\uaed8\uac10\uc788\ub294 \ubc34\ub529 \ub514\uc790\uc778 \ubd88\ud638\uac00 \ub108\ubb34 \ub9ce\uc2b5\ub2c8\ub2e4. \ub123\uc5b4\uc785\ub294 \uac74 \ubb3c\ub860 \ube7c\uc785\uc5b4\ub3c4 \ud54f\uc774 \uc560\ub9e4\ud55c \uacbd\uc6b0\uac00 \uc815\ub9d0 \ub9ce\uc2b5\ub2c8\ub2e4. \uc62c\ub4dc\ud55c \ub290\ub08c\uc774 \uc788\uc5b4 \ub9e4\uce58\ud558\uae30\uac00 \uc5b4\ub835\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2e0\uc0c1\uc73c\ub85c \uc785\uace0\ub41c \uc544\ub300\uc640 \ud5e4\ub4dc\ubc34\ub4dc\uc758 \uceec\ub7ec\uac00 \uc138\uc77c\uc988 \ud3ec\uc778\ud2b8\uac00\ub418\uc5b4  \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc758 \ubc18\uc751\uc774 \uc88b\uc2b5\ub2c8\ub2e4. \uc591\ub9d0\ub3c4 \ub3d9\uc77c\ud55c \ubc18\uc751\uc73c\ub85c \uc6a9\ud488\uacfc \uc5f0\uacc4\ud558\uc5ec \ud310\ub9e4\ud558\uace0 \uc788\uc2b5\ub2c8\ub2e4. \uc5ec\ub984 \uc2dc\uc98c\uc778\ub9cc\ud07c \ubc14\uc774\uc800\uc758 \ud130\uce58\uac00 \ub9ce\uc73c\uba70, \uae30\ubcf8 \ubcfc\ucea1\ub3c4 \ub514\uc790\uc778\uc5d0\uc11c \ub9cc\uc871\ub3c4\uac00 \ub192\uc2b5\ub2c8\ub2e4."},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc2a4\uce74\uc774 \ube14\ub8e8 \ubc18\uc751 \uc800\uc870\ud558\uba70, \ub9ac\uc2a4\ud3f0\uc2a4 1.5 \ud130\ud504 \ub610\ud55c \uceec\ub7ec \uc120\ud638\ub3c4\uac00 \ub0ae\uc2b5\ub2c8\ub2e4.  \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 v2 \uc544\uc774\ubcf4\ub9ac\uc640 \uc5f0\uacc4\ud558\uc5ec \uc5b4\ud544\ud558\uace0 \uc788\uc9c0\ub9cc \uc778\ud2b8\ub9ac\uadf8,  \ubcfc\ud2b8\ud504\ub85c\ub85c \uc774\ud0c8\ub418\uace0 \uc788\uc5b4 \ud604\uc7a5\uc5d0\uc11c\ub3c4 \uc544\uc27d\uc2b5\ub2c8\ub2e4.  \ucd9c\uc2dc\ub41c\uc9c0 \uc5bc\ub9c8 \ub418\uc9c0 \uc54a\uc544 \uc870\uae08 \ub354 \uc9c0\ucf1c\ubd10\uc57c \ud560 \uac70 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uae08\uc8fc\ub294 \ub77c\ucf13 \ud310\ub9e4\uac00 \uc800\uc870\ud558\uc600\uc2b5\ub2c8\ub2e4. \uc544\uc9c1\uae4c\uc9c0 \ub0a8\uc131 \uace0\uac1d\ub4e4 \ub514\ud30c\uc774\uc5b4 \ubb38\uc758\uac00 \uc9c0\uc18d\uc801\uc73c\ub85c \uc788\uc73c\uba70, \uc5ec\uc131 \uc2a4\ud399 \ubb38\uc758\ub294 \uc5c6\uc5c8\uc2b5\ub2c8\ub2e4. \ub77c\ucf13\uc744 \ubcf4\ub7ec \uc624\uc2e0 \uace0\uac1d\ub4e4\uc774 \ud655\uc5f0\ud788 \uc904\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub0a0\uc528\uc5d0 \ub9de\uac8c \uc57c\uc678\ud65c\ub3d9\uc774 \uc904\uc5b4\ub4e4\uba74\uc11c \ub18d\uad6c\uacf5 \ud310\ub9e4\ub3c4 \uc800\uc870\ud569\ub2c8\ub2e4. \uad6c\uacbd\ub9cc \ud558\uc2dc\uace0 \ubc1c\uae38 \ub3cc\ub9ac\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub9ce\uc2b5\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\uae30\uc874 \uace0\uac1d\ub4e4\uc758 \ubc29\ubb38\uc774 \uc9c0\uc18d\uc801\uc73c\ub85c \uafb8\uc900\ud788 \uc788\uc73c\ub098 \ub9e4\ubc88 \ub9d0\uc500\uc8fc\uc2dc\ub294 \uac8c \uc0c1\ud488\uc774 \ube44\uc2b7\ud558\ub2e4 \ub77c\ub294 \uc758\uacac\uc774 \ub9ce\uace0, \uc778\uae30 \uc0c1\ud488\ub4e4\uc758 \uc7ac\uace0\ub294 \ube68\ub9ac \uae68\uc838 \ud310\ub9e4\ub85c\uc2a4\uac00 \ub108\ubb34 \uc544\uc27d\uc2b5\ub2c8\ub2e4. \ud734\uac00\uac00 \uae38\uac8c \uc774\uc5b4\uc9c0\uba74\uc11c \uc720\ub3d9\uc778\uad6c\ub294 \ub298\uc5c8\uc73c\ub098 \ub0b4\uc218 \uace0\uac1d\ub4e4\uc740 \uc18c\ube44\ud558\ub294 \uac78 \uaebc\ub824\ud558\uc2dc\uace0 \ube0c\ub79c\ub4dc \uc790\uccb4 \ud53c\ub85c\ub3c4\uac00 \ub192\uc544\ubcf4\uc784\uc744 \uccb4\uac10\ud560 \uc218 \uc788\ub294 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4. \uc678\uad6d\uc778\ub3c4 \uc904\uc5c8\uc73c\ub098 \uac04\ud639 \uc624\uc154\uc11c \ud55c\uad6d\uc758 \uc0c1\ud488\ub4e4\uc744 \uc88b\uc544\ud574\uc8fc\uc2dc\uace0 \uac1d\ub2e8\uac00 \ub192\uac8c \uad6c\ub9e4\ud574\uac00\uc2ed\ub2c8\ub2e4. \ub9e4\ubc88 \ub290\ub07c\ub294 \uac70\uc9c0\ub9cc \uc2e0\uc0c1\ud488 \uc785\uace0 \uc2dc\uae30\uac00 \uc544\uc26c\uc6b0\uba70 \ub9ac\uc624\ub354 \uc77c\uc815\uc774 \ub2a6\ucdb0\uc9d0\uc5d0 \ub530\ub77c \ud310\ub9e4\uac00 \uc800\uc870\ud55c \uac83\ub3c4 \ub2f9\uc5f0\ud55c \ubd80\ubd84\uc774\ub77c \uc544\uc27d\uac8c \uc0dd\uac01\ud569\ub2c8\ub2e4."}],"8\uc6d42W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\ud53c\ud0a4\uc14b\uc5c5& \uc2dc\uc5b4\uc544\uc774\uc2a4 \ud310\ub9e4\uc640 \ud130\uce58\uac00 \uc5ec\uc804\ud788 \ub192\uc2b5\ub2c8\ub2e4. \ub0ae\uc5d0\ub3c4 \ub354\uc6b4 \ub0a0\uc528\uc5d0 \uac00\ubcbc\uc6b4 \uc18c\uc7ac\ub97c \ucc3e\ub294 \uace0\uac1d\ub4e4\uc774 \ub300\ubd80\ubd84\uc774\uc168\uace0 \uc785\uc810 \uace0\uac1d\ub4e4 \uc5f0\ub839\ub300 \ub610\ud55c 2030\uc73c\ub85c \uc80a\uc740 \uace0\uac1d\ub4e4 \uc18c\ube44\uac00 \ub9ce\uc2b5\ub2c8\ub2e4. \uacf5\ud648\uc744 \ubcf4\uc2dc\uace0 \uc544\ub178\ub77d \ubb38\uc758\uc8fc\uc2dc\ub294 \ubd84\ub4e4\uc774 \uc99d\uac00\ud558\uc600\uace0 \uc5b8\uc81c \uc785\uace0\ub418\ub294\uc9c0 \uad81\uae08\ud574\ud558\uc2dc\ub294 \ubd84\ub4e4\uc774 \uacc4\uc2e0 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4. \ub0a8\uc131 \uace0\uac1d\ub4e4 \uc14b\uc5c5 \uc885\ub958\uac00 \ub108\ubb34 \uc801\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \uc788\uace0 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \ubc18\ubc14\uc9c0 \uad6c\ub9e4\ud574\uac00\uc2ed\ub2c8\ub2e4."},{"cat":"\uc758\ub958","topic":"2-1. \uc758\ub958 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud53c\uc2a4\ud14c \ubc0f \ubc18\uc9d1\uc5c5, \ud480\uc9d1\uc5c5 \uc2a4\ud0c0\uc77c\uc774 \uc801\uc2b5\ub2c8\ub2e4. \uc2a4\ud3ec\uce20 \ube0c\ub79c\ub4dc \ub300\ubd80\ubd84\uc774 \uac00\uc744 \uc14b\uc5c5\uc744 \ucc29\uc6a9\ud558\uace0 \uc788\uace0 \ubc14\ub78c\ub9c9\uc774 \ud6c4\ub4dc\uc9d1\uc5c5 \ub4f1 \ud310\ub9e4\ub418\uace0 \uc788\ub294\ub370, \ud310\ub9e4\ud638\uc870 \uc544\uc774\ud15c\ub4e4\uc740 \uc0ac\uc774\uc988\uac00 \ub300\ubd80\ubd84 \uae68\uc838\uc788\uc5b4 \uc751\ub300\ud558\uae30 \uc5b4\ub824\uc6b4 \ud55c\uc8fc\uc600\uc2b5\ub2c8\ub2e4. \ubc14\ub78c\ub9c9\uc774 \ud130\uce58\uac00 \uc804\uc8fc\ubcf4\ub2e4 \uc62c\ub77c\uc654\uace0 \uae30\uc874 \uace0\uac1d\ub4e4\uc774 \ubc29\ubb38\ud574\uc8fc\uc154\uc11c \uac00\uc744 \uc0c1\ud488 \uc785\uace0 \uc2dc\uae30\ub97c \ubb3c\uc5b4\ubcf4\uc2dc\ub294 \ubd84\ub4e4\uc774 \uacc4\uc168\uc2b5\ub2c8\ub2e4. \uc544\ub178\ub77d&\ud53c\uc2a4\ud14c \uc785\uace0 \uc2dc\uae30\ub97c \ub354 \ube68\ub9ac \ub2f9\uaca8\ub3c4 \ub300\uc751\ud574\ub4dc\ub9ac\uae30\uc5d0 \uc88b\uc744 \uac70 \uac19\uc2b5\ub2c8\ub2e4."},{"cat":"\uc6a9\ud488","topic":"2-1. \uc6a9\ud488 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \uceec\ub7ec\uac00 \uc608\uc058\ub2e4\uace0 \uad6c\ub9e4\ud574\uac00\uc2dc\ub294 20\uace0\uac1d\ub2d8\ub4e4\uc774 \uacc4\uc2dc\uba70 \uceec\ub7ec\ubcc4\ub85c \uc0ac\uace0 \uc2f6\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc744 \uc815\ub9d0 \ub9ce\uc774 \ub4e3\uc2b5\ub2c8\ub2e4. \uc5ec\uc131 \uace0\uac1d\ub2d8\ub4e4\uc774 \ub77c\ubca4\ub354(\uc5f0\ubcf4\ub77c) \uceec\ub7ec\ub3c4 \uc88b\uc544\ud574\uc8fc\uc154\uc11c \ucd94\uac00 \ub9ac\uc624\ub354 \uc9c4\ud589\ud558\uac8c \ub418\uba74 \uc88b\uc744 \uac70 \uac19\uc2b5\ub2c8\ub2e4. \ub2c8\uc0ad\uc2a4\ub294 \uafb8\uc900\ud788\ub294 \uc544\ub2c8\uc9c0\ub9cc \ucc3e\ub294 \ubd84\ub4e4\uc774 \uacc4\uc2dc\uba70, \ucea1\ubcf4\ub2e4\ub294 \ubc14\uc774\uc800 \uad6c\ub9e4\ub3c4\uac00 \ub354 \ub192\uc2b5\ub2c8\ub2e4.(80%\uc774\uc0c1 \uc5ec\uc131 \uace0\uac1d)"},{"cat":"\uc2e0\ubc1c","topic":"2-1. \uc2e0\ubc1c \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\uc778\ud2b8\ub9ac\uadf8 \ub77c\uc11c \uad6c\ub9e4\ud574\uac00\uc2dc\ub294 \uace0\uac1d\ub2d8\ub4e4 \uacc4\uc2dc\uba70, \ub514\uc790\uc778\uc5d0 \ub300\ud55c \ud53c\ub4dc\ubc31\uc774 \uc88b\uc2b5\ub2c8\ub2e4. \ubcfc\ud2b8\ud504\ub85c \uc5ec\uc131 \uceec\ub7ec\ub294 \ud130\uce58\ub294 \uc788\uc73c\ub098 \ub9e4\uce58\ud560 \uc758\ub958\uac00 \uc560\ub9e4\ud558\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \uc788\uc5b4 \uc778\ud2b8\ub9ac\uadf8\ub098 \uc5d0\uc5b4\ub9ac\ub85c \uad6c\ub9e4\uc804\ud658 \ub429\ub2c8\ub2e4. \ud130\ud504\ub3c4 \ud074\ub808\uc774&\uc778\uc870\uc794\ub514 \uc720\uc800\ubd84\ub4e4\uaed8 \ucd94\ucc9c\ub4dc\ub9ac\uace0 \uc788\uc73c\ub098 \uc62c\ucf54\ud2b8\ub85c \uad6c\ub9e4\ud574\uac00\uc2ed\ub2c8\ub2e4. \uceec\ub7ec\uac00 \uc544\uc27d\ub2e4\ub294 \ubc18\uc751\uc774 \uc788\uc5c8\uc2b5\ub2c8\ub2e4."},{"cat":"\ub77c\ucf13","topic":"2-2. \ub77c\ucf13 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399\uc740 \ud640\uc138\uc77c \ubfd0\ub9cc \uc544\ub2c8\ub77c \ub3d9\ub300\ubb38 \uc5b8\uae09\uc744 \ub9ce\uc774 \ud558\uc2dc\uba70 \uae08\uc561\uc774 \ub108\ubb34 \ube44\uc2f8\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc774 \ub9ce\uc558\uc2b5\ub2c8\ub2e4. \ud55c\uc815\ud310 \ub77c\ucf13\uc744 \ubb3c\uc5b4\ubcf4\uc2dc\ub294 \ubd84\ub4e4\uc774 \ub9ce\uc774 \uacc4\uc2ed\ub2c8\ub2e4. \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \uac00\ub2a5\ud55c \uc810\ud3ec \uc544\ub7ab\uce35 \ud14c\ub2c8\uc2a4 \ub9e4\ud2b8\ub85c\ub85c \uc774\ud0c8\uc774 \ub9ce\uc73c\uba70, \uae30\ubcf8 \ubaa8\ub378\uc740 \ud310\ub9e4 \uc800\uc870\ud569\ub2c8\ub2e4."},{"cat":"\ud300\uc2a4\ud3ec\uce20","topic":"2-2. \ud300\uc2a4\ud3ec\uce20 \ud310\ub9e4 \ud2b9\uc774\uc0ac\ud56d","fb":"\ub18d\uad6c\uacf5 \ud310\ub9e4\ub294 \uafb8\uc900\ud788 \uc88b\uc2b5\ub2c8\ub2e4. \uac00\uc871\ub2e8\uc704\ub098 \ud559\uc0dd \uace0\uac1d\ub4e4\uc774 \uad6c\ub9e4\ud574\uac00\uc2dc\uba70, \uc790\uc810 \uc778\uc2a4\ud0c0 \ub9b4\uc2a4\ub97c \ubcf4\uc2dc\uace0 \ub514\uc5e0\uc73c\ub85c \ubb38\uc758\uc8fc\uc2dc\ub294 \ubd84\ub4e4\ub3c4 \uacc4\uc2ed\ub2c8\ub2e4."},{"cat":"\uae30\ud0c0","topic":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","fb":"\ud328\uc158\ud30c\ud06c \ucabd\uc740 \ud55c\uac00\ud558\uba70 \ubd90\ube44\ub294 \ub290\ub08c\uc774 \uc5c6\uc2b5\ub2c8\ub2e4. \ud3c9\uc77c\uacfc \ube44\uc2b7\ud55c \uc785\uc810\uac1d\uc218\ub85c \uc624\ud788\ub824 \ud3c9\uc77c \ubaa9\uc801\uad6c\ub9e4\ub85c \uac1d\ub2e8\uac00\uac00 \ub354 \ub192\uc2b5\ub2c8\ub2e4. \uac00\uc871\ub2e8\uc704 \ubcf4\ub2e8 2030 \uc80a\uc740 \ucee4\ud50c/\ubd80\ubd80 \ub2e8\uc704\uac00 \ub9ce\uace0 \uc678\uad6d\uc778 \uace0\uac1d\uc774 \uc904\uc5c8\uc2b5\ub2c8\ub2e4."}],"8\uc6d43W":[{"cat":"\uacf5\ud1b5","topic":"1-1. \uae08\uc8fc \ud310\ub9e4\ubca0\uc2a4\ud2b8","fb":"\uae08\uc8fc\ub294 \uae30\uc628\uc774 \uc120\uc120\ud574\uc9c0\uba74\uc11c fw \uc544\uc774\ud 9c0\ub9cc \uae34\ud314\ud2f0\ub098 \uc587\uc740 \ubc14\ub78c\ub9c9\uc774\uc758 \ud130\uce58\uc728\uc774 \uc810\uc810 \uc62c\ub77c\uc624\uace0\uc788\uc2b5\ub2c8\ub2e4.  \uc2e0\uc0c1\uc790\ucf13\uc740 \uc544\uc9c1 \ub9ce\uc740 \uad6c\ub9e4\ub85c \uc774\uc5b4\uc9c0\uc9c4 \uc54a\uc9c0\ub9cc \ub300\ubd80\ubd84 \uc785\uc810\uace0\uac1d\uc740 \uc70c\uc2a8 \uc9c4\uc131\uace0\uac1d \ub610\ub294 \ud14c\ub2c8\uc2a4\uace0\uac1d\uc73c\ub85c \uc628\ub77c\uc778\uc774\ub098 \uac00\uc744\uc5d0 \ucc29\uc7a5\uc744 \ub300\ube44\ud558\uc5ec \uad6c\ub9e4\ud558\uc2dc\ub294 \uace0\uac1d\uc774 \uc788\uc5c8\uc73c\uba70 \uba54\uc778\ube44\uc96c\uc5bc \uceec\ub7ec\uc778 \ub808\ub4dc\uceec\ub7ec\ub97c \ub9ce\uc774 \ud130\uce58\ud558\uc168\uace0 \uace0\uac1d\ub2d8\ub4e4\uc758 \ub77c\ucf13 \uceec\ub7ec\uc640\ub3c4 \ub9e4\uce58\ud558\uc2dc\ub294 \uace0\uac1d\ub4e4\uc774 \uacc4\uc168\uc2b5\ub2c8\ub2e4. \ud654\uc774\ud2b8\uceec\ub7ec\uc758 \ud130\uce58\ub294 \uc544\ub354\uceec\ub7ec\uc5d0\ube44\ud574 \ud130\uce58\uc728\uc774 \ub0ae\uc558\uc2b5\ub2c8\ub2e4. \ucc29\uc7a5\uc744 \ud558\uc600\uc744\ub54c \ub4f1 \ub77c\uc778 \uc808\uac1c\uac00 \ub4e4\uc5b4\uac00 \ud1b5\uae30\uc131 \ubc0f \ud65c\ub3d9\uc131\uc740 \uc6b0\uc218 \ud560 \uc218 \uc788\uc73c\ub098 \uad6c\ubd80\ub9ac\uac70\ub098 \ud558\uc600\uc744\ub54c \ub4f1\uc774 \ubf48\ub85d \ud280\uc5b4\ub098\uc624\uac70\ub098 \ubaa8\uc591\uc774 \ubd80\uc790\uc5f0\uc2a4\ub7fd\ub2e4\ub294 \ud53c\ub4dc\ubc31\uc788\uc5c8\uc2b5\ub2c8\ub2e4. \ubd04, \uac00\uc744 \uc2dc\uc98c\uc5d0 \ud130\uce58\uc640 \uad6c\ub9e4\uac00 \ub9ce\uc740 \ud53c\uc2a4\ud14c\ub958\uc5d0\uc11c \uace0\uac1d\ub4e4\uc758 \ub540\ubc30\ucd9c\uc774 \uc88b\uc740\uc9c0 \ub4e4\ub7ec\ubd99\uc9c0\ub294 \uc54a\ub294\uc9c0\ub97c \ub9ce\uc774 \ubb3c\uc5b4\ubcf4\uc2dc\ub294\ub370 \ub4f1\ud310\uc774\ub098 \uaca8\ub4dc\ub791\uc774 \ub77c\uc778\uc5d0 \uba54\uc26c\uc6d0\ub2e8\uc73c\ub85c \ub4e4\uc5b4\uac04\ub2e4\uba74 \uace0\uac1d\ub4e4\uc774 \ubb3c\uc5b4\ubcf4\uc2dc\ub294 \uc810\uc744 \ub354 \ud3b8\ud558\ua
