하며 실착용 목적으로 학생들에게도 반응이 좋았습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"W263003TTS73 , W263003TTS72 모두 디자인도 좋아 일반 고객에게도 판매가 꾸준히 이뤄지고 있습니다. 신상 의류들 모두 터치는 꾸준히 일어나고 있고 상설 제품들 중 사이즈,컬러가 깨져있어 원하는게 없다면 정상 퓨어드라이 라인으로 터치가 많이 일어났습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"헤어밴드,아대의 경우 대부분 컬러를 맞춰 세트로 구매가 이뤄지고 있습니다. 다양하게 컬러가 입고되면서 다양한 의류에 맞출 수 있어 연계판매가 수월하게 이뤄졌습니다. 날이 더워서 열이 많이 오른다며 최근 모자 터치가 줄다보니 신상입고된 모자의 터치가 아직 많이 이뤄지지 않았습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"스카이블루 컬러가 아직 판매되지 않았지만 기존 화이트블루,화이트골드 와 비교대상이 되며 선택지가 추가된거라 긍정적인 영향을 끼쳤습니다. 리스폰스 프로 1.5 터프는 입고되지 않았지만 꾸준히 클레이,옴니 코트 전용화를 찾는 고객이 있다보니 입고된다면 수요가 꾸준하게 발생 할 것으로 예상됩니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"재방문 고객들은 디파이어 라켓 제품의 입고일이 앞당겨져 긍정적인 반응이였습니다. 아울렛이다보니 블레이드V9 과 전년도 에디션 라켓들의 입고 여부 문의가 종종 있었습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"실내에서 농구를 하는 고객도 많아 농구공은 선물,실사용 목적으로 주말마다 꾸준히 수요가 발생하고 있습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"의류의 경우 성별,연령대에 따라 가격저항,정상 상품으로 전환의 여부가 차이가 났습니다. 사이즈,컬러가 깨졌다면 2-30대 남성은 정상 상품과 같이 비교해 구매가 이뤄졌고 4-50대 고객은 다른 사이즈,컬러가 있는 상설 제품 위주로 구매가 이뤄졌습니다. 여성 고객은 연령대 상관 없이 70% 이상 디자인 위주로 가격이 있더라도 정상,상설 코디를 하여 구매가 이뤄졌습니다. 가방,모자 등의 용품은 가격부담이 적은 상설 상품을 더 선호했고 아대,양말 등은 가격이 높지 않아 디자인 위주로 구매가 이뤄졌습니다. 신발은 가격,디자인 위주 5:5 정도 비율이였는데 사이즈>가격,디자인 순서로 구매의사가 결정되었습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"전주 대비 입점은 큰 차이는 없었습니다. 전년 대비 경기 영향으로 고객 소비가 위축되며 구매 전환율이 낮게 유지되었습니다. 또한 작년은 상설 할인율이 30~50퍼 정도 였는데 현재 40~70% 정도로 높아지며 객단가가 낮아지고 기존 고객들은 이전에 추가 할인, 할인 프로모션을 기다리며 구매를 미루는 경우도 자주 발생했습니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"기온이 떨어질 기미가 보이며 다시 운동을 시작하려는 고객이 증가하며 기본 아이템 위주로 남성 고객은 코트라인 쇼츠와 매치하여 상의와 셋업으로 구매가 이뤄졌습니다. 여성고객도 단품보다 셋업 위주로 구매가 이뤄지고 매장 체류시간이 길어지며 의류,용품 모두 연결판매가 수월하게 이뤄졌습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 액티브 폴로 제품이 인기가 좋았습니다. 다른 얇은 의류들보다 비춤이 적어 연령대 상관 없이 긍정적인 반응이였습니다. 플레이 스테이트 자켓의 경우 디자인은 마음에 들어했지만 상설 추가할인이 들어가면서 가격저항이 커 구매까지 이뤄지지 않았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"여성고객은 토트백 보다 백팩류가 실용성,디자인의 선호도가 높았습니다. 남성고객은 대부분 수납공간 여유가 있는 백팩,더플백 위주로 구매가 이뤄지고 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"최근 여성 고객들은 입문 고객 비중이 더 높다보니 조금 더 저렴한 상설 제품 위주로 구매가 이뤄져 볼트프로 1.5 W가 판매가 이뤄지진 않았지만 꾸준히 터치가 발생하고 있어 꾸준히 수요가 발생 할 것으로 예상됩니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"여성 고객들은 신상 라켓이 나오더라도 확실히 비교 후 구매하는 성향이 있다보니  100, 98PRO 보다 구매가 더딘 것으로 예상됩니다. 남성 고객들은 장비 욕심이 커 런칭 후 바로 구매가 이뤄졌었습니다. 100 , 98PRO 는 1주일도 되지 않고 판매가 이뤄진 반면 L , UL은 아직 재고가 남아있습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"공휴일이 껴있어 가족 단위 입점이 많다보니 주말간에 농구공,글러브의 구매가 평소보다 수월하게 이뤄졌습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"추가 할인과 연휴 할인행사가 겹쳐 진행해 신규 고객,기존 방문고객 모두 만족하며 양말,모자,가방 등 다양하게 같이 구매하며 20만원을 채우더라도 선물용으로도 더 구매해가며 연결판매가 수월하게 진행됐습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"금년 조금 이른 휴가철이 끝남과 동시에 공휴일이 있어 가족단위 입점이 대부분이다보니 선물용으로 구매하는 비중이 소폭 증가했습니다. 전체적인 입점은 평일은 비슷했지만 주말의 경우 전주 대비 20%가량 증가했습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"아직 낮에 활동 할 때 , 운동 할 때는 덥다보니 기능성 반팔 위주로 가장 구매가 많이 이뤄지고 있습니다. 점차 일교차가 생길 조짐이 보이면서 재방문 고객들은 FW 상품들도 터치가 꾸준히 발생하며 구매까지 이뤄지고 있습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"기존 고객들은 신규 유형 상품 구매 4 베스트 상품 재구매 6 정도의 비율이였습니다. 현 시점 오전,초저녁부터 기온이 점차 내려가 운동하기 좋다보니 스피드 드라이 라인 같이 스포티한 상품보다 일상겸용해서 입기 좋은 퓨어드라이 라인의 구매율이 더 높아졌습니다. 신상입고된 긴팔,아우터류는 지금 입기엔 아직 더워 구매를 미뤘습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"가을로 넘어가기 직전이다보니 반팔,반바지와 아대,양말,모자의 구매가 꾸준히 이뤄지고 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"볼트 프로 1.5가 꾸준히 판매율 상위를 유지하고 있습니다. 조금 더 내구성과 안정감 있는 리스폰스 프로 1.5의 문의도 꾸준히 있지만 입고되지 않아 아쉬움이 있습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 100,98의 재입고 문의가 꾸준히 발생하고 있습니다. 기존 고객들은 디파이어,블레이드를 가장 선호하며두가지 중 비교하며 구매가 이뤄졌습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"점차 야외활동하기 좋은 날씨가 되며 농구공,글러브의 수요가 증가하고 있습니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"재방문 고객들은 구매했던 상품이 추가할인이 들어가면 아쉬워하지만 같은 사이즈 다른 컬러가 있다면 추가로 구매가 이뤄지기도 하고 있습니다. 구매를 고민하던 제품이 추가할인이 들어갈 경우 제품을 구매함과 동시에 다른 상품들과 코디하여 셋업으로도 연계되어 구매가 이뤄지고 있어 긍정적인 측면이 더 부각됐습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"최근 매장 방문 고객들 중 내국인 9 : 외국인 1 정도의 비중을 유지며 4,5월에 비해 외국인 고객의 유입이 적어졌습니다. 최근 입점 고객들은 재방문 고객 7 신규 유입 고객 3 정도의 비중이였습니다. 전주 금요일부터 금주 월요일까지 공휴일이 껴있어 방문이 몰려 금주 평일 입점이 적어졌습니다."}]},"롯데동부산":{"8월1W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"가을에 들어온 W263003TTS72 에이스 퓨어드라이 제품이 가장 판매가 많지만 전체적으로 퓨어드라이 제품의 터치율과 판매율은 많이 높습니다. 그리고 같이 입을 수 있는 남자 반바지가 터치율이 높습니다 시어아이스, 코트라인 7인치 26SS 라인들 위주가 판매율이 높습니다 원단의 우레탄도 좋아하고 테니스 칠 때의 길이감도 좋아하셔서 많이들 찾으십니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"퓨어드라이 제품이 가장 많이 팔리고 있습니다. 전체적으로 더워서 기능성이 되는 상품위주로 많이 팔립니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"밴드류도 많이 찾으시고 모자도 많이 보시는데 대부분 얇은 모자가 많이 팔립니다. 라이트 모션 캡 위주가 좀 많이 팔립니다. 남자 분들과 여자분들이 6패널에 대한 거부감이 없기 때문에 이 제품에 터치율이 높은듯해 보입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"스카이블루 여자분들에게 터치가 많이 되긴 하지만 WGN 컬러 만큼의 파급은 아닙니다 그리고 WBL 제품이 있어서 그런지 뭔가 두가지를 비교했을땐 WBL 쪽으로 터치가 높아집니다. 그라데이션인 퍼플 보다는 터치율이 높습니다  경남쪽 부산쪽은 인조잔디 테니스장이 너무너무 많기 때문에 클레이에 대한 수요가 되게 많았습니다 드디어 고객님들의 니즈에 만족하는 제품을 권해 드릴 수 있어서 터치율도 좋고 착화감에서도 문제가 없었습니다. 그리고 색상도 클레이코트나 잔디코트에 어울리는 흙 색상이여서 잘 더러워 지지도 않아서 뭔가 더 만족해 하는경우가 있었고 남자의 경우 검정색이 들어간 차콜 컬러감이 있는 그런형태의 제품을 좀 찾으셨습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어의 문의는 내국인 외국인을 막론하고 다 찾고 있습니다 없어서 아쉽습니다. 다른 제품에 대한 수요가 없는데 젊은 여성층의 중국인들이 블레이드 V10 100L 제품을 찾는데 드리지 못한 부분에 대해서 좀 아쉽습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"에볼루션 퓨어샷 계속 해서 잘 나가고 하이브리드형태의 제품을 많이 찾으시면 보통 커리,르브론 사인이 각인 되어있는 미드나잇 제품을 많이 사가십니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"외국인들의 경우도 같은 사람입니다 싸게 사러 온사람들은 할인에 대해서 민감하고 윌슨 자체를 좋아하고 예쁘면 된다는 기준의 사람들은 그냥 사가는 경우가 많습니다 아무래도 여행을 오는경우고 그리고 비싼거여도 우리나라에서 귀하게 산다는 기준으로써 가격이 높더라도 외국인들은 좀 사가는 경향이 많이 보입니다. 우리 나라 사람들이 가격저항이 굉장히 쌥니다 그래도 다른 복합매장보다는 또 덜하다고 보긴 하는 상황입니다. 그리고 라켓도 스펙이나 종류만 있다면 거의 사갈 경우가 많은데 종류가 많이 부족하여 판매로스가 굉장히 많이 나는 편입니다. 신발 같은경우는 대부분 예쁘면 사간다가 좀 더 높습니다. 할인 하는 상품의 종류가 많지도 않고 신상품들이 확실히 비교했을 떄 예쁘다는 생각을 많이 하시나 봅니다. 구력이 오래 되신 분들은 가격에 굉장히 비중을 높이는데 테린이 고객님 같은 경우에는 가격보단 디자인에 좀 더 많은 치중이 되어 있습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가기간이라서 굉장히 줄어든 느낌도 있지만 경기가 심상치 않은 부분도 많이 느껴집니다 현재 쇼핑몰에서 쇼핑하는 고객들은 대다수가 외국인이며 내국인은 가격과 디자인에 대해서 훨씬 까다롭게 체크 하고 있는것도 있습니다. 이번에는 전례가 없던 롯데월드에서 워터밤을 개최 하였어서 주말에는 여기가 붐빌거라는게 에측이 되었는지 쇼핑몰로 들어오는 손님이 정말 많이 없었습니다. 디파이어에 대한 문의도 찾아서 오시기보단 전화로 모든걸 해결 지어서 방문이 더 없어보입니다."}],"8월2W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"스피드 드라이 에이스 퓨어드라이 에이스 코트라인 7인치 남자분들의 제품들이 이번주는 유독 많았습니다. 반팔 반바지를 굉장히 많이 찾앗습니다. 유달리 사가신건 남자분들이 정상상품들을 많이 사가셨습니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"아래위로 입을수 있는 셋업 긴팔 자켓 긴바지 남여공용으로 입을 수 있는 제품들로 남자제품을 만들면서 여성용도 입을수 있는 S 사이즈부터 나오는 형태의 긴바지를 만들어서 아니면 XS 부터 만들어서 긴바지를 찾는 여성분들을 케어하면 좋을거 같고. 아직 크게 가을 상품을 크게 찾지는 않습니다. 플레이 스테이트 자켓 여자 분들것과 남자분들 예쁘다는 피드백을 받긴 했습니다만 구매로 이어지지는 않았습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"플리에 토트백 같은경우 공모양의 키링이 여자분들의 마음을 많이 건드리는 포인트라고 생각합니다만. 색감이 아직 가을로 접어들지 않아 크림과 핑크 컬러가 좀 더 어필이 되지는 않지만 가을에 좋은 반응이 있을 것으로 보입니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"CTC 상품의 흰색 레드 메탈실버 컬러감은 손님들의 터치율을 많이 일으킵니다 강해보이는 느낌이 강하고 멋있다는 느낌이 많은가 봅니다 남녀분들다 터치가 좋습니다. 볼트 프로는 여전히 좀 잔잔히 팔리는 상태고 터프는 계속해서 어필하고 있는 상태라 좀 더 지켜봐야겠지만 반응은 좋습니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어 남자분들이 굉장히 많이 찾다 보니 좋다는 평이 여자분들에게도 그대로 넘어져 가서 여성 분들도 디파이어 상품이 귀하다 라는 인식이 그대로 넘어가서 제품이 소량인것에 처음부터 구매 목적을 하고 있던 사람은 바로 구매하는 것으로 보여집니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"시티 레트로 제품이 없어지니 그 대비 고무공으로 나온 제품이 좀 더 잘나가고 에볼루션과 3X3 가 굉장히 잘나갑니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"추가 할인으로 인한 고객님의 구매유도를 이루긴 했지만 워낙 현 티셔츠 단가가 너무 낮아서 채우다 못해 포기 하시고 가는 경우가 많았고 저희는 25FW 상품이 없으니 자켓 종류 가격대가 나가는 상품들이 부족하여 가격을 채우시는데 지치다가 결국 혜택을 억지로 받고 가는 경우가 많았습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"휴가철에 소비가 많아서 그랬는지 쇼핑에 대한 유동 자체가 급격하게 줄어든 느낌입니다. 그리고 테니스를 하는 고객님들도 좀 쉬어간다는 느낌이기에 일반 고객님들을 많이 상대하는 하루 였고 관광객도 급격하게 줄어들어 매일 매일 매출에 대해 타격이 좀 큰 편이 였습니다."}],"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"계속 해서 남여 구분없이 퓨어드라이 반팔 티셔츠가 많이 팔립니다 종종 긴 맨투맨이나 자켓형태를 터치 하지만 판매로 이어지지는 않습니다. 남자 여자분 전부다 퓨어드라이 소재에 열광하고 있는 느낌입니다."},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"1. 보통 현재 새로운 신규고객님이 많습니다. 2.대부분 관광객이 많고 여름에 반팔 티셔츠를 많이 입을수 있으니 일상 손님들과 테니스를 치는 고객님들 그리고 관광객 고객님들도 테니스 관련인 느낌이 많이듭니다. 3.가격문제와 디자인 이 제일 큰 것 같습니다. 4.여름옷을 찾지만 뭔가 새로운게 없어서 전체적으로 많이 고민 하시는 듯합니다. 빅애플은 반팔 티셔츠이지만 일반적으로 입을 수도 있어서 일반 고객님들 그리고 테니스를 하는 고객님도 많이 찾으십니다 플레이스테이트 자켓류는 아직 입어는 보지만 판매로 크게 이어지지는 않습니다."},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"드로우 스트링 토트백은 외국인들이 유독 좋아합니다 특히 베트남 쪽 고객님들이 터치도 많고 팔리기도 합니다. 플리에는 좀 작다고 느끼고 색감이 파랗고 아이보리 2가지 있는것에 고객님들이 아쉬움을 느끼는 경우가 종종 있습니다."},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"CTC 같은경우 대부분 디자인이 예뻐서 많이들 터치는 하지만 가격대가 높아서 좀 포기하는 경우가 있습니다 아울렛 매장이다 보니 대부분 싼 제품을 찾아서 그런듯 합니다."},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"디파이어는 여성 고객님들을 위한 100UL 라인이 계속 해서 판매가 되고 있습니다 파격적으로 팔리진 않지만 그래도 한주에 1~2개씩 판매 되고 있습니다."},{"cat":"팀스포츠","topic":"2-2. 팀스포츠 판매 특이사항","fb":"갑자기 3X3 의 판매량이 늘어나고 스테판 커리 르브론 제임스 싸인볼이 잘 팔립니다."},{"cat":"상설","topic":"상설 판매 현황","fb":"추가 할인에 대해서 고객님들의 반응은 굉장히 좋습니다 가격이 좀 더 떨어져서 터치 해보시면서 구매하는 부분도 많이 올라갔습니다 티셔츠나 자켓류도 싸다는 인식이 있어서 더더욱 좋습니다."},{"cat":"기타","topic":"고객 입점 동향","fb":"8월 초에는 외국인과 내국인이 거의 6:4 정도로 평일에 들어오는게 압도적으로 외국인이 많았고 내국인은 주말에 많이 들러주는 형태가 많이 이루어졌었고 4~5월에 비해 관광객은 훨씬 더 늘었는데 내국인은 발이 좀 뜸한게 보였습니다. 대부분 새로운 고객님들의 구매가 높습니다. 재방문 하시는 분들은 크게 많지 않은듯합니다."}]},"현대울산":{"8월3W":[{"cat":"공통","topic":"1-1. 금주 판매베스트","fb":"퓨어드라이라인 반팔 / 여전히 습하고 더운날씨로 인하여 반팔을 찾으시는 분들이 많고 시원한 소재로 인하여 호감도가 높은 편입니다"},{"cat":"의류","topic":"2-1. 의류 판매 특이사항","fb":"울산에 윌슨이 오픈해서 좋다고 해주시는분들이 많은편 / 구매로 이어지는 경우는 새로운 테니스 브랜드에 대한 호기심과 기존에는 온라인이나 부산에 가서 구매하신 고객 / 미 구매 고객님들의 가장 큰 이탈원인은 계절감이 애매하다보니 여름옷을 구매하기엔 큰 돈을 쓰고싶어하지 않아하심 / FW의류에 관심을 가지시지만 날씨가 더 시원해지면 구매하시겠다고하심 / 플레이스테이는 퓨어드라이 제품 관심을 가지심"},{"cat":"용품","topic":"2-1. 용품 판매 특이사항","fb":"드로우 스트링백 구경하시고 관심을 가지는 분들은 계셨으나 구매까지 잘 이어지지 않았음 볼캡류들은 착화시 편하고 디자인도 이쁜게 많다고 하심"},{"cat":"신발","topic":"2-1. 신발 판매 특이사항","fb":"터치하는거에 비해 판매가 잘이루어지지 않음 금액대 들으시면 대해 살짝 망설여하시기도 함"},{"cat":"라켓","topic":"2-2. 라켓 판매 특이사항","fb":"테니스라켓이 들어와있는경우가 거의 처음이라 다들 많이 만져보시고 호기심을 가지시지만 구매로 이어지진않음 ,,"},{"cat":"기타","topic":"고객 입점 동향","fb":"새로운 브랜드 새로운 매장에대한 호기심으로 테니스를 하시는 분들이 아니라도 구경하시는분들이 늘어남 라이프스타일라인이 없어서 아쉬워하는 고객님들의 피드백을 많이 들어서 라이프라인이 늘어나면 좋을듯"},{"cat":"경쟁사","topic":"타 브랜드 프로모션","fb":"아디다스 , 젝시믹스 4대행사   if(!wd){main.innerHTML='<div style="text-align:center;padding:60px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">&#x1F4CA;</div><p style="font-size:15px;font-weight:600;color:var(--text)">\ub370\uc774\ud130\uac00 \uc5c6\uc2b5\ub2c8\ub2e4</p></div>';return;}
  var sm=wd.summary;
  var h='<div class="upsec" onclick="document.getElementById(\'finput\').click()"><span style="font-size:22px">&#x1F4C2;</span>'
    +'<div class="upsec-t"><strong>\uc0c8 \uc8fc\ucc28 \ud30c\uc77c \uc5c5\ub85c\ub4dc</strong> &mdash; \uc5d1\uc140 \ud30c\uc77c\uc744 \uc5c5\ub85c\ub4dc\ud558\uba74 AI\uac00 \uc790\ub3d9\uc73c\ub85c \uc694\uc57d\ud569\ub2c8\ub2e4</div></div>'
    +'<div class="whd"><span class="wpill">'+cur+'</span>'+(wd.date?'<span class="wdt">'+wd.date+'</span>':'')+'</div>';
  if(sm['전체요약']){
    h+='<div class="overall-top"><div class="overall-top-t">\uD83D\uDCCC \uC804\uCCB4 \uC694\uC57D</div><div class="overall-top-txt">'+esc(sm['전체요약'])+'</div></div>';
  }
  var chks=(sm['즉시체크']&&sm['즉시체크'].items)||[];
  if(chks.length){
    var grouped={};
    var catOrder=['의류','용품','신발','라켓','팀스포츠'];
    chks.forEach(function(c){
      var cat=c['구분']||'기타';
      if(!grouped[cat])grouped[cat]=[];
      grouped[cat].push(c);
    });
    var allCats=Object.keys(grouped).sort(function(a,b){
      var ai=catOrder.indexOf(a),bi=catOrder.indexOf(b);
      if(ai===-1)ai=99;if(bi===-1)bi=99;
      return ai-bi;
    });
    h+='<div class="warn-bar"><div class="warn-bar-t">&#x26A0;&#xFE0F; \uc774\ubc88 \uc8fc \uc989\uc2dc \uccb4\ud06c &mdash; \ud074\ub9ad\ud558\uba74 \ud574\ub2f9 \uc12d\uc158\uc73c\ub85c \uc774\ub3d9</div>';
    allCats.forEach(function(cat){
      h+='<div class="wchip-group"><span class="wchip-cat">'+esc(cat)+'</span><div class="wchips">';
      grouped[cat].forEach(function(c){
        h+='<span class="wchip" onclick="goSec(G_CHECK)">'+esc(c['내용']||'')+'</span>';
      });
      h+='</div></div>';
    });
    h+='</div>';
  }
  Object.keys(sm).forEach(function(key){
    if(key==='date'||key==='전체요약')return;
    var sec=sm[key];
    var m=CAT_META[key]||{icon:'&#x1F4CC;',color:'#374151',bg:'#f9fafb'};
    h+='<div class="csec open" id="sec-'+key+'">'
      +'<div class="chd" onclick="toggleSec(this)">'
      +'<div class="cicon" style="background:'+(m.bg||'#f9f9f9')+'">'+m.icon+'</div>'
      +'<span class="ctitle" style="color:'+m.color+'">'+esc(sec.title||key)+'</span>'
      +'<span class="cchev" style="transform:rotate(180deg)">&#x25BC;</span></div>'
      +'<div class="cbody">';
    if(key==='즉시체크'){
      h+='<div style="padding:16px 18px;overflow-x:auto"><table class="clt"><tr>'
        +'<th style="width:70px">\uad6c\ubd84</th><th>\ub0b4\uc6a9</th><th style="width:155px">\ud574\ub2f9 \ub9e4\uc7a5</th><th style="width:95px">\uc0c1\ud0dc</th><th>\uc870\uce58</th></tr>';
      (sec.items||[]).forEach(function(r){
        var st=r['\uc0c1\ud0dc']||'';
        var sc=st.indexOf('\u274c')>-1?'red':st.indexOf('\u2705')>-1?'green':st.indexOf('\ud83d\udccc')>-1?'blue':'gray';
        h+='<tr><td><strong>'+esc(r['\uad6c\ubd84']||'')+'</strong></td>'
          +'<td>'+esc(r['\ub0b4\uc6a9']||'')+'</td>'
          +'<td style="font-size:11px;color:var(--muted)">'+esc(r['\ub9e4\uc7a5']||'')+'</td>'
          +'<td><span class="st '+sc+'">'+esc(st)+'</span></td>'
          +'<td style="font-size:12px">'+esc(r['\uc870\uce58']||'')+'</td></tr>';
      });
      h+='</table></div>';
    }else{
      (sec.items||[]).forEach(function(item){
        var tag=item.tag||'';
        var isW=tag.indexOf('\u26a0')>-1||tag.indexOf('\uc989\uc2dc')>-1||tag==='warn';
        var tc=isW?'warn':tag.indexOf('\ubcc0\ud654')>-1?'change':tag.indexOf('\uc81c\uc548')>-1||tag.indexOf('\uae30\ud68d')>-1?'proposal':tag.indexOf('\ubca0\uc2a4\ud2b8')>-1?'best':tag.indexOf('\ud2b8\ub80c\ub4dc')>-1||tag.indexOf('\ub3d9\ud5a5')>-1?'insight':'normal';
        var tl=esc(tag).replace('warn','&#x26A0;&#xFE0F; \uc989\uc2dc \uccb4\ud06c');
        var txt=esc(item.text||'')
          .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
          .replace(/(&#x26A0;[^<]*)/g,'<span class="wt">$1</span>');
        h+='<div class="sitem">'+(tag?'<span class="stag '+tc+'">'+tl+'</span>':'')+'<div class="stxt">'+txt+'</div></div>';
      });
    }
    h+='</div></div>';
  });
  main.innerHTML=h;
}
function toggleSec(hd){
  var sec=hd.closest('.csec');sec.classList.toggle('open');
  hd.querySelector('.cchev').style.transform=sec.classList.contains('open')?'rotate(180deg)':'';
}
function renderStoreBtns(){
  var all={};
  Object.keys(STORE_DATA_RAW).forEach(function(s){all[s]=1;});
  Object.values(weekStore).forEach(function(w){Object.keys(w.storeData||{}).forEach(function(s){all[s]=1;});});
  document.getElementById('slist').innerHTML=Object.keys(all).sort().map(function(s){
    return '<button class="sbtn" onclick="showStore(\''+s+'\')">'+esc(s)+'</button>';
  }).join('');
}
function filterS(q){document.querySelectorAll('.sbtn').forEach(function(b){b.style.display=b.textContent.indexOf(q)>-1?'':'none';});}
function showStore(name){
  document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.sbtn').forEach(function(b){if(b.textContent===name)b.classList.add('on');});
  var r=document.getElementById('sres');r.className='sres on';
  var ch=STORE_CH[name]||'';
  var h='<div class="sres-name">&#x1F3EA; '+esc(name)+'<span class="sres-ch">'+esc(ch)+'</span></div>';
  var wks=WEEK_ORDER.filter(function(w){return weekStore[w]&&weekStore[w].storeData[name];});
  if(!wks.length){h+='<div class="no-s">\uc774 \ub9e4\uc7a5\uc758 \ud53c\ub4dc\ubc31\uc774 \uc5c6\uc2b5\ub2c8\ub2e4</div>';}
  else{
    wks.forEach(function(w){
      var fbs=(weekStore[w].storeData[name]||[]).filter(function(f){return f.topic.indexOf('\u203b')===-1;});
      if(!fbs.length)return;
      h+='<div class="swblock"><span class="swlabel">'+w+'</span>';
      fbs.forEach(function(f){h+='<div class="sfitem"><div class="sfcat">'+esc(f.cat)+'</div>'+esc(f.fb)+'</div>';});
      h+='</div>';
    });
  }
  r.innerHTML=h;
}
var bdCurWeek=null;
var ESC_STORE_LABEL='\uD83C\uDFEA \uB9E4\uC7A5\uBCC4';
var ESC_CAT_LABEL='\uD83D\uDCC1 \uCE74\uD14C\uACE0\uB9AC\uBCC4';
var ESC_NODATA='\uC6D0\uBCF8 \uB370\uC774\uD130\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4';
var ESC_RAWDATA_LABEL='\uC6D0\uBCF8 \uD53C\uB4DC\uBC31 \uBC31\uB370\uC774\uD130';
var ESC_NOCAT_SUFFIX=' \uCE74\uD14C\uACE0\uB9AC\uC758 \uD53C\uB4DC\uBC31\uC774 \uC5C6\uC2B5\uB2C8\uB2E4';
var ESC_STORE_COUNT_SUFFIX='\uAC1C \uB9E4\uC7A5 \uD53C\uB4DC\uBC31';
var bdViewMode='store';
var bdCurCat=null;
var BD_CATS=['\uC758\uB958','\uC6A9\uD488','\uC2E0\uBC1C','\uB77C\uCF13','\ud300\uc2a4\ud3ec\uce20'];
function bdSetView(mode){bdViewMode=mode;if(mode==='category'&&!bdCurCat)bdCurCat=BD_CATS[0];renderBD();}
function bdSetCat(cat){bdCurCat=cat;renderBD();}

function openBD(){
  bdCurWeek = WEEK_ORDER.filter(function(w){return weekStore[w];}).slice(-1)[0];
  renderBD();
  document.getElementById('bdMbg').classList.remove('hidden');
}
function renderBD(){
  var body=document.getElementById('bdBody');
  var weeks=WEEK_ORDER.filter(function(w){return weekStore[w];});
  var tabsHtml='<div class="bd-tabs">'+weeks.map(function(w){
    return '<button class="bd-tab '+(w===bdCurWeek?'on':'')+'" onclick="bdSwitchWeek(\''+w+'\')">'+w+'</button>';
  }).join('')+'</div>';

  var toggleHtml='<div class="bd-toggle">'
    +'<button class="bd-toggle-btn '+(bdViewMode==='store'?'on':'')+'" onclick="bdSetView(\'store\')">'+ESC_STORE_LABEL+'</button>'
    +'<button class="bd-toggle-btn '+(bdViewMode==='category'?'on':'')+'" onclick="bdSetView(\'category\')">'+ESC_CAT_LABEL+'</button>'
    +'</div>';

  if(bdViewMode==='category'){
    toggleHtml+='<div class="bd-cat-tabs">'+BD_CATS.map(function(c){
      return '<button class="bd-cat-tab '+(c===bdCurCat?'on':'')+'" onclick="bdSetCat(\''+c+'\')">'+c+'</button>';
    }).join('')+'</div>';
  }

  var wd=weekStore[bdCurWeek];
  var contentHtml='';
  if(!wd || !wd.storeData){
    contentHtml='<div class="no-s">'+ESC_NODATA+'</div>';
  } else {
    contentHtml+='<div class="bd-week-hd2"><span class="bd-week-pill">'+bdCurWeek+'</span>'+(wd.date?'<span class="bd-week-dt">'+esc(wd.date)+'</span>':'')+'<span style="font-size:11px;color:var(--muted);margin-left:auto">'+ESC_RAWDATA_LABEL+'</span></div>';

    if(bdViewMode==='store'){
      var storeNames=Object.keys(wd.storeData).sort();
      if(!storeNames.length){
        contentHtml+='<div class="no-s">'+ESC_NODATA+'</div>';
      } else {
        storeNames.forEach(function(store){
          var fbs=(wd.storeData[store]||[]).filter(function(f){return f.topic.indexOf('\u203b')===-1;});
          if(!fbs.length) return;
          contentHtml+='<div class="bd-store-block">';
          contentHtml+='<div class="bd-store-name">\uD83C\uDFEA '+esc(store)+'</div>';
          fbs.forEach(function(f){
            contentHtml+='<div class="bd-fb-item"><div class="bd-fb-cat">['+esc(f.cat)+'] '+esc(f.topic)+'</div><div class="bd-fb-text">'+esc(f.fb)+'</div></div>';
          });
          contentHtml+='</div>';
        });
      }
    } else {
      var catEntries=[];
      Object.keys(wd.storeData).sort().forEach(function(store){
        (wd.storeData[store]||[]).forEach(function(f){
          if(f.cat===bdCurCat) catEntries.push({store:store, f:f});
        });
      });
      if(!catEntries.length){
        contentHtml+='<div class="no-s">'+esc(bdCurCat)+ESC_NOCAT_SUFFIX+'</div>';
      } else {
        contentHtml+='<div class="bd-store-block">';
        contentHtml+='<div class="bd-store-name">\uD83D\uDCC1 '+esc(bdCurCat)+' &mdash; '+catEntries.length+ESC_STORE_COUNT_SUFFIX+'</div>';
        catEntries.forEach(function(e){
          contentHtml+='<div class="bd-fb-item"><div class="bd-fb-cat">\uD83C\uDFEA '+esc(e.store)+' &mdash; '+esc(e.f.topic)+'</div><div class="bd-fb-text">'+esc(e.f.fb)+'</div></div>';
        });
        contentHtml+='</div>';
      }
    }
  }
  body.innerHTML=tabsHtml+toggleHtml+'<div class="bd-content">'+contentHtml+'</div>';
}
function bdSwitchWeek(w){bdCurWeek=w;renderBD();}
function closeBD(e){
  if(!e||e.target===document.getElementById('bdMbg')){
    document.getElementById('bdMbg').classList.add('hidden');
  }
}
function openMod(){document.getElementById('mbg').classList.remove('hidden');document.getElementById('msrch').focus();}
function closeMod(e){
  if(!e||e.target===document.getElementById('mbg')){
    document.getElementById('mbg').classList.add('hidden');
    document.getElementById('sres').className='sres';
    document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on');});
  }
}
function handleUpload(input){
  var file=input.files[0];if(!file)return;
  document.getElementById('loverlay').classList.remove('hidden');
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var sn=wb.SheetNames[wb.SheetNames.length-1];
      var ws=wb.Sheets[sn];
      var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var hr=raw[2]||[];
      var stores={};
      for(var i=3;i<hr.length;i++){if(hr[i]&&String(hr[i]).trim())stores[i]=String(hr[i]).trim();}
      var sd={};var rows=[];
      for(var ri=3;ri<raw.length;ri++){
        var row=raw[ri];
        var topic=String(row[1]||'').trim();
        var cat=String(row[2]||'').trim();
        if(!topic&&!cat)continue;
        var fbs={};
        Object.keys(stores).forEach(function(ci){
          var v=String(row[parseInt(ci)]||'').trim().replace(/[\r\n]+/g,' ');
          if(v&&['x','X','-','\\'].indexOf(v)===-1){
            fbs[stores[ci]]=v;
            if(!sd[stores[ci]])sd[stores[ci]]=[];
            sd[stores[ci]].push({cat:cat,topic:topic.slice(0,80),fb:v});
          }
        });
        if(Object.keys(fbs).length)rows.push({topic:topic,cat:cat,feedbacks:fbs});
      }
      var txt='\uc8fc\ucc28: '+sn+'\n\n';
      rows.forEach(function(r){
        if(r.cat==='\uacf5\ud1b5'&&r.topic.indexOf('\u203b')>-1)return;
        txt+='['+r.cat+'] '+r.topic.slice(0,60)+'\n';
        Object.keys(r.feedbacks).forEach(function(st){txt+='  '+st+': '+r.feedbacks[st].slice(0,200)+'\n';});
        txt+='\n';
      });
      callAI(txt,function(summary){
        weekStore[sn]={date:summary.date||'',summary:summary,storeData:sd};
        Object.keys(sd).forEach(function(st){if(!STORE_DATA_RAW[st])STORE_DATA_RAW[st]={};STORE_DATA_RAW[st][sn]=sd[st];});
        cur=sn;renderAll();
        document.getElementById('loverlay').classList.add('hidden');
      });
    }catch(err){alert('\uc624\ub958: '+err.message);document.getElementById('loverlay').classList.add('hidden');}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
function callAI(text,cb){
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,system:_SYS,messages:[{role:'user',content:text}]})
  }).then(function(r){return r.json();}).then(function(d){
    var raw=(d.content||[]).map(function(c){return c.text||'';}).join('');
    var clean=raw.replace(/\u0060\u0060\u0060json/g,'').replace(/\u0060\u0060\u0060/g,'').trim();
    cb(JSON.parse(clean));
  }).catch(function(e){alert('AI \uc624\ub958: '+e.message);document.getElementById('loverlay').classList.add('hidden');});
}
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){
  e.preventDefault();
  var f=e.dataTransfer&&e.dataTransfer.files[0];
  if(f&&(f.name.endsWith('.xlsx')||f.name.endsWith('.xls')))handleUpload({files:[f],value:''});
});
renderAll();
</script>
