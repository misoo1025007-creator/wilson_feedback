ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399 \ucd9c\uc2dc \uc77c\uc815 \uc989\uc2dc \uacf5\uc720 \ud544\uc694","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uc5ec\uc131 100L\u00b7100UL \ucd9c\uc2dc \uc77c\uc815 \uacf5\uc720"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \ub77c\ucf13 \uc7ac\uace0 \uc804\ubb34","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc2dc\uae09"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"\uc0c1\uc124 \uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31 \uc9c0\uc18d","\ub9e4\uc7a5":"\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ub86f\ub370\uae30\ud765\u00b7\ub86f\ub370\uc758\uc655","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucd94\uac00 \ubc30\ubd84 \uac80\ud1a0"}]}},"8\uc6d42W":{"date":"08/10~08/16","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \ubc18\ud314 \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 1\uc704, \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \uc2e0\uaddc \uc785\uace0 \uc5ec\uc131 \ubc18\uc751 \ud3ed\ubc1c\uc801. \ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399(100L\u00b7100UL) \ub7f0\uce6d \u2014 \ub9e4\uc7a5\ubcc4 \ud3b8\ucc28 \uc788\uc73c\ub098 \uc0ac\uc804\uc608\uc57d \uace0\uac1d \uc911\uc2ec \ud310\ub9e4 \ud638\uc870. \ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13 \ucd08\ubc18 \ud130\uce58\uc728 \uc0c1\uc2b9, \uac00\uc744 \uc804\ud658 \uae30\ub300\uac10 \uc2dc\uc791. \uc0c1\uc124 \ucd94\uac00 \ud560\uc778 \ud6a8\uacfc\ub85c \uc5f0\uacc4\ud310\ub9e4\u00b7\uac1d\ub2e8\uac00 \uc0c1\uc2b9. \uc5f0\ud734\u00b7\ud3ed\uc6b0\u00b7\ud734\uac00 \ub9c9\ubc14\uc9c0 \ubcf5\ud569\uc73c\ub85c \uc785\uc810 \ud63c\uc7ac, \ud14c\ub2c8\uc2a4 \uace0\uac1d \uc218\uc694 \ub454\ud654 \uc9c0\uc18d.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 1\uc704. \uc2e0\uc138\uacc4\ub300\uc804 '\uc804\uc5f0\ub839\ub300 \ubb34\ub09c\ud558\uac8c \uc785\uc744 \uc218 \uc788\uc5b4 \ubc18\uc751 \uc720\ub3c5 \uc88b\uc74c, WHT \uceec\ub7ec \uac00\uc7a5 \uc778\uae30'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uae30\uc7a5 \uae38\uace0 \uc154\ub9c1 \ud3ec\uc778\ud2b8\ub85c \uc606 \ub77c\uc778 \uc870\uc808 \uac00\ub2a5 \u2014 \ub9cc\uc871\ub3c4 \ucd5c\uace0'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc154\ub9c1 \ud3ec\uc778\ud2b8 FW \uc0c1\ud488 \uc911 \ud310\ub9e4 \ub2e8\uc5f0 1\uc704'."},{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 W** \uc2e0\uaddc \uc785\uace0 \ud3ed\ubc1c\uc801 \ubc18\uc751. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ud310\ub9e4 \ub5a8\uc5b4\uc9c8 \uc815\ub3c4\ub85c \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \ub3c5\uc8fc, \uc678\uad6d\uc778\u00b7\ub0b4\uad6d\uc778 \ubaa8\ub450 \ud3ed\ubc1c\uc801'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ubcf4\ub0c9\uae30\ub2a5\u00b7\uc218\ub0a9\uacf5\uac04\u00b7\uc5ec\uc131\uc2a4\ub7ec\uc6b4 \ub514\uc790\uc778 \uc0bc\ubc15\uc790'. \uc2e0\uc138\uacc4\ub300\uc804 '\ud544\ub77c\ud14c\uc2a4\u00b7\uc694\uac00\u00b7\ubc1c\ub808 \uace0\uac1d\uae4c\uc9c0 \uc5b4\ud544 \uc131\uacf5'."},{"tag":"\ud2b9\uc774","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399 + \ud22c\uc5b4\uac00 \ubbf8\ub07c\uc0c1\ud488 \uc5ed\ud560 \u2192 \uc758\ub958\u00b7\uc2e0\ubc1c \uc5f0\uacc4 \ud310\ub9e4 \uc6d4\ub4f1\ud788 \uc0c1\uc2b9'. \ub86f\ub370\uc7a0\uc2e4 '\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \ud551\ud06c\u00b7\uc544\uc774\ubcf4\ub9ac \ucee4\ud50c \uad6c\ub9e4 \ubc18\uc751 \uc88b\uc74c, FW \uc2e0\uc0c1\ud488 \uc804\ubc18 \ud310\ub9e4 \uc88b\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uc5f0\ud734 \uae00\ub7ec\ube0c\u00b7\ub18d\uad6c\uacf5 \uc120\ubb3c\uc6a9 \uad6c\ub9e4 \uc99d\uac00, \uac00\uc871\ub2e8\uc704 \uad6c\ub9e4 \ud65c\uc131\ud654'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \uc2e0\uaddc \uc785\uace0** \u2014 \uc5ec\uc131 \uace0\uac1d \ubc18\uc751 \ud3ed\ubc1c\uc801. \uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \uc218\uc694\ub97c \ub118\uc5b4\uc11c\ub294 \ub9e4\uc7a5\ub3c4 \ub4f1\uc7a5. \ud83d\udcc8 **\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399(100L\u00b7100UL) \ub7f0\uce6d** \u2014 \uc0ac\uc804\uc608\uc57d \uace0\uac1d \ubc29\ubb38 \ud65c\uc131\ud654. \ud83d\udcc8 **\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13 \ucd08\ubc18 \ud130\uce58 \uc0c1\uc2b9** \u2014 \uc77c\uad50\ucc28 \uc2dc\uc791\uc73c\ub85c \uac00\uc744 \uc804\ud658 \uae30\ub300\uac10. \ud83d\udcc8 **\uc0c1\uc124 \ucd94\uac00 \ud560\uc778** \u2014 \uc5f0\uacc4\ud310\ub9e4\u00b7\uac1d\ub2e8\uac00 \uc0c1\uc2b9 \ud6a8\uacfc. \ud83d\udcc9 **\uc5f0\ud734\u00b7\ud3ed\uc6b0\u00b7\ud734\uac00 \ub9c9\ubc14\uc9c0** \ubcf5\ud569\uc73c\ub85c \ud14c\ub2c8\uc2a4 \ubaa9\uc801 \uc785\uc810 \uac10\uc18c. \uc2e0\uc138\uacc4\ub300\uc804 '\uc8fc\ub9d0 \ud3ed\uc6b0\ub85c \uc785\uc810 \ud604\uc800\ud788 \uac10\uc18c'."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (FW \uc2e0\uc0c1\u00b7\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13 \ubc18\uc751)","items":[{"tag":"\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13","text":"**\ud604\ub300\ud310\uad50 '\ucd08\ubc18 \ubc18\uc751 \ub108\ubb34 \uc88b\uc74c \u2014 \uc5ec\uc131 \uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13 \ud310\ub9e4 \uac15\uc138'**. \uc2e0\uc138\uacc4\ub300\uc804 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13 \ud130\uce58\u00b7\ubc18\uc751 \uc88b\uc74c, \uc5ec\uc131 \ud37c\ud50c \uc544\uc774\uce90\uce6d \u591a'. \ub86f\ub370\ubd80\uc0b0 '\uc8fc\ub9d0 \ubc14\ub78c\ub9c9\uc774 \ud310\ub9e4 \uc774\ub8e8\uc5b4\uc9d0'. \ubc18\uba74 \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc544\uc9c1 \ud130\uce58 \uc804\ud600 \uc5c6\uc74c, \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc740 10\uc6d4\uae4c\uc9c0 \ubc18\ud314', \ucee4\ub125\ud2b8\uccad\uc8fc '\uc2a4\ud0e0\ub2e4\ub4dc \uc81c\ud488\uc774\ub77c \uae30\uc628 \ub0b4\ub824\uac00\uc57c \uad6c\ub9e4 \ubc1c\uc0dd'."},{"tag":"FW \uc804\ud658 \uae30\ub300\uac10","text":"\uae34\ubc14\uc9c0\u00b7\ubc14\ub78c\ub9c9\uc774\u00b7\ud53c\uc2a4\ud14c \ubb38\uc758 \uc804\ubc18\uc801 \uc0c1\uc2b9 \u2014 \uc544\uc774\ud30c\ud06c '\uacf5\ud648 \uc544\ub178\ub77d \ubb38\uc758 \uc99d\uac00, \uc785\uace0 \uc2dc\uae30 \ubb38\uc758'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc587\uc740 \ud480\uc9d1\uc5c5\u00b7\ubc14\ub78c\ub9c9\uc774, \uc5ec\uc720 \uc77c\uc790\ud615 \uae34\ubc14\uc9c0 \ubb38\uc758 \ub9ce\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ud06c\ub8e8 \ud558\ud504\uc9d1\uc5c5 \ud130\uce58 \ub9ce\uc73c\ub098 \ud480\uc9d1\uc5c5 \uc694\uccad'. \ub86f\ub370\uc758\uc655 '\uc587\uc740 \ubc14\ub78c\ub9c9\uc774\ub85c \ud130\uce58 \ub118\uc5b4\uc634'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub0a8\uc131 \uc14b\uc5c5 \uc544\uc774\ud15c \ubd80\uc871** (\uc544\uc774\ud30c\ud06c) \u2014 '\ub0a8\uc131 \uc14b\uc5c5 \uc885\ub958 \ub108\ubb34 \uc801\ub2e4\ub294 \ud53c\ub4dc\ubc31' \u2192 \ucc28\uae30 \uae30\ud68d \ubc18\uc601 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **SS \uc544\uc774\ud15c \uc0ac\uc774\uc988 \uacf5\ubc31\uc73c\ub85c \uc2e0\uc0c1 \uc720\ub3c4 \uc804\ud658** (\ub86f\ub370\uc7a0\uc2e4\u00b7\uc544\uc774\ud30c\ud06c) \u2014 '\uc778\uae30 \uc0c1\ud488 \uc0ac\uc774\uc988 \uae68\uc838 \uc2e0\uc0c1\uc73c\ub85c \uc548\ub0b4, \uc2e0\uc0c1 \uc7ac\uace0 \uc801\uadf9 \ud65c\uc6a9 \uc911' \u2192 \uc2e0\uc0c1 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \uc77c\uc0c1\ubcf5 \uacb8\uc6a9 \uad6c\ub9e4 \uae09\uc99d \u2014 \uc2e0\uc138\uacc4\ub300\uc804 '\ud0c0 \uc2a4\ud3ec\uce20 \uace0\uac1d \uad6c\ub9e4\ub3c4 \ub9ce\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc218\uc785\uc81c\ud488 \ud53c\ud305 \ud6c4 \uc0ac\uc774\uc988 \uc774\uc288\ub85c \uad6d\ub0b4 \uc81c\ud488\uc73c\ub85c \uc2a4\uc704\uce58'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub77c\ucf54\uc2a4\ud14c\uc2dd \ud53c\ucf00\ud2f0\uc154\uce20\u00b7\uc640\ud39c \ub85c\uace0 \uc544\uc774\ud15c \uc81c\uc548'."},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uad11\uc8fc '\ucd08\uac00\uc744 \uc587\uc740 \uae34\ubc14\uc9c0 \ubb38\uc758 \uae09\uc99d, \ud0c0 \ube0c\ub79c\ub4dc \uac00\uc744 \uad6c\uc131 \uc99d\uac00 \uc911'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc5ec\uc131\uc6a9 XS\u00b7S \uc0ac\uc774\uc988 \uae34\ubc14\uc9c0 \uae30\ud68d \ud544\uc694'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '\ub8e8\uc988\ud54f \ud32c\uce20 \uc120\ud638\ub3c4 \ub192\uc74c \u2014 \uc870\uac70 \uc678 \uc640\uc774\ub4dc\u00b7\ub8e8\uc988\ud54f \uae30\ud68d \ud544\uc694'."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\u00b7\ub2c8\uc0ad\uc2a4 \ubc18\uc751)","items":[{"tag":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31","text":"**\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \ud3ed\ubc1c\uc801 \ubc18\uc751** \u2014 \uc131\uacf5 \uc694\uc778: \u2460 \uc5ec\uc131\uc2a4\ub7ec\uc6b4 \uceec\ub7ec(\ud551\ud06c\u00b7\ud06c\ub9bc\u00b7\ub77c\ubca4\ub354) \u2461 \ubcf4\ub0c9\uae30\ub2a5 \uc218\ub0a9 \uacf5\uac04 \u2462 \uacf5 \ud0a4\ub9c1 \ud3ec\uc778\ud2b8 \u2463 \ube44\ud14c\ub2c8\uc2a4 \uace0\uac1d\uae4c\uc9c0 \uc5b4\ud544. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ub3c5\uc8fc \ub05d\ub0b4\uace0 \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\uc774 \uc8fc\uc778\uacf5'. \ub86f\ub370\uc7a0\uc2e4 '\ubc1c\ub808 \ub3d9\ud638\uc778 \uc9d1\ub2e8 \uad6c\ub9e4 \ubc1c\uc0dd'. \uad6c\ub9e4 \uc804\ud658\uc740 \uc544\uc9c1 \uc9c0\ucf1c\ubd10\uc57c \ud558\ub294 \ub9e4\uc7a5\ub3c4 \uc788\uc73c\ub098 \uc804\ubc18 \uae0d\uc815."},{"tag":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31","text":"\ud55c\uacc4: \ub86f\ub370\ubd80\uc0b0 '\ud06c\uae30 \ubd80\ub2f4\uc2a4\ub7fd\ub2e4\ub294 \uc758\uacac \u591a'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc9d0\ubc31 \ub77c\uc778(\ub77c\ucf13 \uc218\ub0a9) \uc120\ud638\ub85c \uc804\ud658'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc544\uc9c1 \uac00\uc744 \ubd84\uc704\uae30 \uc544\ub2c8\ub77c \ud06c\ub9bc\u00b7\ud551\ud06c \uceec\ub7ec \uc5b4\ud544 \uc81c\ud55c\uc801, \uac00\uc744\uc5d0 \ub354 \ubc18\uc751 \uae30\ub300'. \uc544\uc774\ud30c\ud06c '\ub77c\ubca4\ub354 \ucd94\uac00 \ub9ac\uc624\ub354 \uc694\uccad'."},{"tag":"\ub2c8\uc0ad\uc2a4","text":"\uc2e0\uc0c1 \ub2c8\uc0ad\uc2a4 \ubc18\uc751 \uae0d\uc815\uc801\uc774\ub098 \ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 \uba54\uc26c \ub0b4\uad6c\uc131 \ud074\ub808\uc784 \u2014 \ub86f\ub370\uc7a0\uc2e4 '\uba54\uc26c \ubd80\ubd84 \ub108\ubb34 \ube68\ub9ac \ub5a8\uc5b4\uc9c4\ub2e4\ub294 \uc758\uacac'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ub0a0\uc528 \uc120\uc120\ud574\uc9c0\uba70 \ubaa8\uc790\u00b7\ub2c8\uc0ad\uc2a4 \ud130\uce58\u00b7\ud310\ub9e4 \ub3d9\ubc18 \uc0c1\uc2b9'. \ud604\ub300\uc911\ub3d9 '\ub450\uaebc\uc6b4 \ub2c8\uc0ad\uc2a4 \uc120\ud638'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 \uba54\uc26c \ub0b4\uad6c\uc131 \ud074\ub808\uc784** (\ub86f\ub370\uc7a0\uc2e4) \u2014 '\ub108\ubb34 \ube68\ub9ac \ub5a8\uc5b4\uc9c4\ub2e4' \u2192 \ud488\uc9c8 \ud655\uc778 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uc778\ucc9c '\ud50c\ub808\uc774 \ud1a0\ud2b8\ubc31 \uc785\uace0 \uc989\uc2dc \ud3ed\ubc1c\uc801 \ubc18\uc751, \uae30\uc874 \uc2a4\ud018\uc5b4 \uc9d0\ubc31\uacfc \ub2e4\ub978 \uc5ec\uc131 \ub2c8\uc988 \ucda9\uc871'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ucea1 \ubaa8\uc790 \uae30\ub2a5\uc131 \uc704\uc8fc \ud310\ub9e4, \ubc14\uc774\uc800 \uac70\uc758 \ud310\ub9e4 \uc5c6\uc74c'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\uc5d8\ub9ac\ud2b8 \ubaa8\uc158 \ubc14\uc774\uc800 \uc774\ubc88 \uc8fc \ud310\ub9e4 1\uc704'."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\uc218\uc785\ud654 \uc2e0\uc0c1\u00b7\ubcfc\ud2b8\ud504\ub85c \ub3d9\ud5a5)","items":[{"tag":"\uc218\uc785\ud654 \uc2e0\uc0c1","text":"**\ub7ec\uc26c\ud22c\uc5b45\u00b7\uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4 \ud654\uc774\ud2b8+\ub808\ub4dc \uceec\ub7ec \uc544\uc774\uce90\uce6d \uae0d\uc815\uc801** \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc2e0\ubc1c \ud130\uce58\uc728 8\uc6d4 \uc911 \ucd5c\uace0, \uc2e0\uc0c1 \ucd9c\uc2dc\ub85c \ud310\ub9e4 \uc6d4\ub4f1\ud788 \uc0c1\uc2b9'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ub7ec\uc26c\ud22c\uc5b4\u00b7\uc778\ud2b8\ub9ac\uadf8 \ud130\uce58 \uac00\uc7a5 \ub9ce\uc74c'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ub0a8\ub140 \ucee4\ud50c\ub85c \uc2e0\uae30 \uc88b\uc740 \ud770+\ube68 \uc870\ud569'. \ub2e8, \ub2e4\uc218 \ub9e4\uc7a5 '\ucc29\ud654 \ud6c4 \ubcfc\ud2b8\ud504\ub85c\u00b7\uc5d0\uc5b4\ub9ac\ub85c \uc804\ud658'."},{"tag":"\ubcfc\ud2b8\ud504\ub85c","text":"**\ubcfc\ud2b8\ud504\ub85c \uc5ec\uc804\ud788 \ud310\ub9e4 \uac15\uc138** \u2014 \uc544\uc774\ud30c\ud06c '\ubcfc\ud2b8\ud504\ub85c W \uceec\ub7ec \uc5b4\uc6b8\ub9b4 \uc758\ub958 \uc560\ub9e4\ud574 \uc778\ud2b8\ub9ac\uadf8\u00b7\uc5d0\uc5b4\ub9ac\ub85c \uc804\ud658'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ubcfc\ud2b8\ud504\ub85c\u00b7\ud130\ud504 \ubaa8\ub450 \ubc18\uc751 \ud06c\uc9c0 \uc54a\uc74c \u2014 \ub514\uc790\uc778 \ud53c\ub85c\uac10'. \ud604\ub300\ud310\uad50 '\ub9ac\uc2a4\ud3f0\uc2a4 \ud310\ub9e4 \ub2e4\uc18c \uc800\uc870'. \ub86f\ub370\ubd80\uc0b0 '\ubcfc\ud2b8\ud504\ub85c \uafb8\uc900\ud55c \ud310\ub9e4, \ud130\ud504\ub294 \uceec\ub7ec \uc5b4\ub450\uc6cc \uc120\ud638 \ub0ae\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\ubb34\uc5ed \uc785\uace0 \uc2a4\ud0c0\uc77c \uc790\uccb4 \uc801\uc5b4 \uc2e0\ubc1c \ub2e4\uc591\uc131 \ubd80\uc871** \u2014 '\ub9ac\uc2a4\ud3f0\uc2a4 \ube7c\uace0 \ud310\ub9e4 \ub098\uc058\uc9c0 \uc54a\uc73c\ub098 \uad6c\uc131 \ubd80\uc871' \u2192 \uc785\uace0 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub0b4\uc218 \ud14c\ub9b0\uc774 \uace0\uac1d \uc138\ud2b8 \uad6c\ub9e4\ub85c \uc2e0\ubc1c \ub2e8\uac00 \ub192\uc558\uc74c'. \uc2e0\uc138\uacc4\uc13c\ud140 '\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504 \ud074\ub808\uc774\u00b7\uc778\uc870\uc794\ub514 \uace0\uac1d \ub2c8\uc988 \uc815\ud655\ud788 \ucda9\uc871'. \ub86f\ub370\ub3d9\ubd80\uc0b0 'CTC \ud770+\ub808\ub4dc+\uba54\ud0c8\uc2e4\ubc84 \uceec\ub7ec \ub0a8\ub140 \ubaa8\ub450 \ud130\uce58 \uc720\ubc1c'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131 \uc2a4\ud399 100L\u00b7100UL \ub7f0\uce6d)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131\uc2a4\ud399","text":"**\uc804\ubc18 \uae0d\uc815\uc801\uc774\ub098 \ub0a8\uc131 \uc2a4\ud399 \ub300\ube44 \ud655\uc2e4\ud788 \ub290\ub9b0 \ubc18\uc751** \u2014 \uc131\uacf5 \ub9e4\uc7a5: \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ud558\ub0a8\uc2a4\ud0c0\uc988 \uc120\uc218 \uc0ac\uc804\uc608\uc57d + \uc785\uc810 \uace0\uac1d \uc5b4\ud544 \uc131\uacf5, \uc5ec\uc131 \uc2a4\ud399\uc774 \ub0a8\uc131\ubcf4\ub2e4 \ud310\ub9e4 \ub9ce\uc558\uc74c'. \uc2e0\uc138\uacc4\ub300\uc804 '100UL 1\uadf8\ub9bd \uac00\uc7a5 \ub9ce\uc774 \ud310\ub9e4, \uc0ac\uc804\uc608\uc57d:\uc6cc\ud06c\uc778 5:5'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ub7f0\uce6d \uccab\ub0a0 \ud310\ub9e4 \ub192\uc558\uc73c\ub098 \uad00\uc2ec \uc788\ub294 \ubd84 \uc704\uc8fc'."},{"tag":"\ub514\ud30c\uc774\uc5b4 \uc5ec\uc131\uc2a4\ud399","text":"\ub290\ub9b0 \ub9e4\uc7a5 \uc6d0\uc778: \u2460 \ub0a8\uc131 \ubc14\uc774\ub7f4 \uc704\uc8fc \uc815\ubcf4 \ud655\uc0b0 \u2192 \uc5ec\uc131 \uc778\uc9c0\ub3c4 \ub0ae\uc74c \u2461 \uc5ec\uc131 \uace0\uac1d \uc2e0\uc911\ud55c \uad6c\ub9e4 \uc131\ud5a5 \u2462 \uceec\ub7ec \uca0d\ud568 \ubd80\ub2f4 (\ub354\ud604\ub300\uc11c\uc6b8 '\uceec\ub7ec \ub108\ubb34 \uca0d\ud574\uc11c \ub2e4\ub978 \ub77c\ucf13 \uc120\ud0dd'). \uc544\uc774\ud30c\ud06c '\ud640\uc138\uc77c\u00b7\ub3d9\ub300\ubb38 \ub300\ube44 \uac00\uaca9 \ube44\uc2f8\ub2e4\ub294 \ud53c\ub4dc\ubc31 \u591a'. \ub86f\ub370\uc7a0\uc2e4 '\uac00\ubcbc\uc6b4 \ubb34\uac8c\uac00 \ud640\uc138\uc77c\uacfc \uac19\uc740 \ub0a0 \ucd9c\uc2dc\ub3fc \ud640\uc138\uc77c\ub85c \uc3e0\ub9bc'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc544\uc774\ud30c\ud06c \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \ubd88\uac00 \u2192 \uc544\ub7ab\uce35 \ud14c\ub2c8\uc2a4 \ub9e4\ud2b8\ub85c \uc774\ud0c8 \uc9c0\uc18d** \u2014 \uadfc\ubcf8 \ud574\uacb0 \ud544\uc694"},{"tag":"\uc774\uc288","text":"US\uc624\ud508 \uc5d0\ub514\uc158 \uafb8\uc900\ud55c \ud310\ub9e4 \u2014 \ub098\uc778\uc6d0\ud55c\ub0a8 '\uc5ec\uc131 \ud074\ub798\uc2dc\u00b7\uc6b8\ud2b8\ub77c US\uc624\ud508 \uc778\uae30'. \ube14\ub808\uc774\ub4dc V10 \uafb8\uc900 \uac15\uc138 \u2014 \ud604\ub300\ud310\uad50 '\uc774\ubc88 \uc8fc \ube14\ub808\uc774\ub4dc \ud310\ub9e4 \uc6d4\ub4f1\ud788 \uc88b\uc74c'. \uc0c1\uc124 \ub77c\ucf13 \u2014 \uc0ac\uc774\uba3c\ubd80\uc0b0 '\uc0c1\uc124 \ub77c\ucf13 \uc785\uace0 \ubb38\uc758 \u591a, \uc5ec\uc131 \ubb38\uc758 \uc99d\uac00'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158 \uc218\uc694 \uac15\uc138 \uc720\uc9c0 \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud559\uc0dd\ub4e4 \uc5d0\ubcfc\ub8e8\uc158\ub9cc \uace0\uc9d1, FW\uc5d0 \uc5d0\ubcfc\ub8e8\uc158 \uc7ac\uace0 \ub354 \ub9ce\uc774 \ud544\uc694'. \uc544\uc774\ud30c\ud06c '\uc778\uc2a4\ud0c0 \ub9b4\uc2a4 \ud1b5\ud55c DM \ubb38\uc758 \uc99d\uac00, \uac00\uc871\u00b7\ud559\uc0dd \uad6c\ub9e4 \uafb8\uc900'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc5d0\ubcfc\ub8e8\uc158\u00b7\ucee4\ub9ac\u00b7\ud4e8\uc5b4\uc0f7 \uc21c \ubb38\uc758'."},{"tag":"\uc774\uc288","text":"\uc5f0\ud734 \ud6a8\uacfc \u2014 \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ub86f\ub370\uae30\ud765 '\uacf5\ud734\uc77c \uac00\uc871\ub2e8\uc704 \uae00\ub7ec\ube0c\u00b7\ub18d\uad6c\uacf5 \uc120\ubb3c\uc6a9 \uad6c\ub9e4 \uc99d\uac00'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc5d0\ubcfc\ub8e8\uc158\u00b7\uc0ac\uc778\ubcfc \ud310\ub9e4\uc728 \ub192\uc74c'. \ucee4\ub125\ud2b8\uccad\uc8fc '\uc57c\uad6c\uae00\ub7ec\ube0c \ubb38\uc758 \uc99d\uac00, \ub0ae\uc544\uc9c4 \ud2b8\ub798\ud53d\uc5d0 \ube44\ud574 \uae00\ub7ec\ube0c \ucc3e\ub294 \uace0\uac1d \u591a'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ub808\ud2b8\ub85c \uc544\uc6c3\ub3c4\uc5b4 \ub18d\uad6c\uacf5 \uc774\ubc88 \uc8fc \ud310\ub9e4 \uc8fc\ub3c4'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669 (\ucd94\uac00 \ud560\uc778 \ud6a8\uacfc)","items":[{"tag":"\ucd94\uac00\ud560\uc778\ud6a8\uacfc","text":"**\ucd94\uac00 10% \ud560\uc778 \ud6a8\uacfc \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uae0d\uc815\uc801** \u2014 \ucee4\ub125\ud2b8\uccad\uc8fc '\ubca0\uc774\uc9c1 NJK71 60% \ud560\uc778 \ud6c4 \ud638\ubd88\ud638 \uc5c6\uc774 \ud130\uce58 \uc99d\uac00'. \ub86f\ub370\uae30\ud765 '\uc5f0\ud734 \ud560\uc778 \uacb9\uccd0 \uc591\ub9d0\u00b7\ubaa8\uc790\u00b7\uac00\ubc29 \uc5f0\uacc4 \uad6c\ub9e4 \ud65c\uc131\ud654, \uc120\ubb3c\uc6a9 \ucd94\uac00 \uad6c\ub9e4\uae4c\uc9c0'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uba38\ubb34\ub294 \uc2dc\uac04 \uc99d\uac00 \u2192 \ubaa8\uc790\u00b7\uc591\ub9d0 \ud310\ub9e4 \uc0c1\uc2b9'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '\ucd94\uac00 \uae08\uc561 \ud560\uc778\uc774 \uace0\uac1d \ubc18\uc751 \uac00\uc7a5 \uc88b\uc74c, \uac1d\ub2e8\uac00 \uc0c1\uc2b9'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 \ucd94\uac00 \ud560\uc778 \ub355 \uc5f0\uacc4\ud310\ub9e4 \uc218\uc6d4** \u2192 \ucea0\ud504\u00b7\ucee8\ubc84\uc83c \ub192\uc774\uae30 \uc131\uacf5 \uc0ac\ub840 \uacf5\uc720 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\ub3d9\ubd80\uc0b0 '\ud604\uc7ac 25FW \uc0c1\ud488 \uc5c6\uc5b4 \ud2f0\uc154\uce20 \ub2e8\uac00 \ub0ae\uc544 20\ub9cc\uc6d0 \ucc44\uc6b0\uae30 \uc9c0\uccd0 \ud3ec\uae30\ud558\ub294 \uace0\uac1d \u591a, \uc790\ucf13\ub958 \ubd80\uc871'. \ud604\ub300\ub300\uc804 '\ucd94\uac00 \ud560\uc778 \uc9c4\ud589 \uc911\uc774\ub098 \ud589\uc0ac\uc7a5\uc73c\ub85c \uc785\uc810 \uac10\uc18c'. \ub86f\ub370\uc758\uc655 '\ucd94\uac00 \ud560\uc778\uc5d0 FW \uc0c1\uc124 \uc0c1\ud488\ub3c4 \uc6d0\ud65c \ud310\ub9e4'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcca **\ud63c\uc7ac** \u2014 \uc5f0\ud734\u00b7\ud3ed\uc6b0\ub85c \uc8fc\ub9d0 \uac10\uc18c / \ub354\ud604\ub300\uc11c\uc6b8\u00b7\uc2e0\uc138\uacc4\uac15\ub0a8 \ud31d\uc5c5 \ud6a8\uacfc\ub85c \uc0c1\uc2b9. \ub354\ud604\ub300\uc11c\uc6b8 '\ub77c\uc774\uc5c7\uac8c\uc784\uc988\u00b7K\ub9ac\uadf8 \ud31d\uc5c5\uc73c\ub85c \uc678\uad6d\uc778\u00b7\ub0b4\uad6d\uc778 \ubaa8\ub450 \uae09\uc99d, \uc0ac\uc774\uc988 \uae68\uc9c4 \uc0c1\ud488 \uc785\uace0\ub85c \ud310\ub9e4 \ud65c\uc131\ud654'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub0a0\uc528 \uc88b\uc544\uc9c0\uba70 \ud14c\ub2c8\uc2a4\ubcf5 \uad6c\ub9e4 \ubaa9\uc801 \ubc29\ubb38 \uae09\uc99d, \uc0e4\ub12c\u00b7\ud2f0\ud30c\ub2c8 \ud31d\uc5c5 \uc678\uad6d\uc778 \uc720\uc785'."},{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 \uac10\uc18c \ub9e4\uc7a5: \uc2e0\uc138\uacc4\ub300\uc804 '\uc804\ub144 \ub3d9\uae30 \ub300\ube44 30~40% \uac10\uc18c, \uc8fc\ub9d0 \ud3ed\uc6b0'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc804\ub144 \ud5ec\ub85c\ud0a4\ud2f0 \ucf5c\ub77c\ubcf4 \uc774\uc288 \ub300\ube44 \uc62c\ud574 \uc784\ud329\ud2b8 \ubd80\uc871'. \ub86f\ub370\uc7a0\uc2e4 '\uc5f0\ud734\ub85c \uc804\uccb4 \ub9e4\ucd9c \uac10\uc18c, \uacf5\ub3d9 \uc0ac\uc740 \ubbf8\uc9c4\ud589'. \ud604\ub300\ubb34\uc5ed '\uc678\uad6d\uc778(\uc911\uad6d\u00b7\uc778\ub3c4\ub124\uc2dc\uc544) \uc720\uc785 \uae09\uc99d \u2014 \ud55c\uad6d\ub9d0 \ubabb\ud558\ub294 \ub0a0\ub3c4'."},{"tag":"\ub3d9\ud5a5","text":"\ub098\uc778\uc6d0\ud55c\ub0a8 '\uc804\uc8fc \ub300\ube44 \uc785\uc810\u00b7\uad6c\ub9e4 \ubaa8\ub450 \uc99d\uac00'. \ud604\ub300\ud310\uad50 '\uc5ec\ud589\u00b7\uc6b4\ub3d9 \ubaa9\uc801 \uad6c\ub9e4 \uace0\uac1d \u591a'. \ub86f\ub370\uae30\ud765 '\uc8fc\ub9d0 \uc804\uc8fc \ub300\ube44 +20% \uc99d\uac00'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ub0b4\uad6d\uc778 \uc785\uac1d \uc99d\uac00, \uc678\uad6d\uc778 \uad6c\ub9e4\uc728 \uc0c1\uc2b9'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uc2e0\uc138\uacc4\uad11\uc8fc '\ud0c0 \ube0c\ub79c\ub4dc \uac00\uc744 \uc0c1\ud488\uc73c\ub85c \ub9e4\uc7a5 \uad6c\uc131 \uc804\ud658 \uac00\uc18d'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ubb34\uc2e0\uc0ac\uc2a4\ud0e0\ub2e4\ub4dc\u00b7HDEX \ub4f1 20\ub300 \uc120\ud638 \ube0c\ub79c\ub4dc \uc81c\uc678 \uc804\ubc18 \uc785\uc810 \ubd80\uc9c4'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ud0c0 \ube0c\ub79c\ub4dc \ub300\ube44 \uac00\uc744 \uc637 \uad6c\uc131 \ube60\ub978 \ub9e4\uc7a5\uc774 \uc785\uc810 \uc720\ub9ac'. \ub86f\ub370\uae30\ud765 '\uc0c1\uc124 \ud560\uc778\uc728 40~70%\ub85c \ub192\uc544\uc9c0\uba70 \uae30\uc874 \uace0\uac1d \ucd94\uac00 \ud560\uc778 \uae30\ub2e4\ub9ac\uba70 \uad6c\ub9e4 \ubbf8\ub8f8'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ub0a8\uc131 \uc14b\uc5c5 \uc544\uc774\ud15c \uc885\ub958 \ubd80\uc871","\ub9e4\uc7a5":"\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucc28\uae30 \uae30\ud68d \ubc18\uc601"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"SS \uc0ac\uc774\uc988 \uacf5\ubc31 \u2014 \uc2e0\uc0c1 \uc7ac\uace0\ub85c \uc720\ub3c4 \uc804\ud658 \uc911","\ub9e4\uc7a5":"\ub86f\ub370\uc7a0\uc2e4\u00b7\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\uc2e0\uc0c1 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 \uba54\uc26c \ub0b4\uad6c\uc131 \ud074\ub808\uc784","\ub9e4\uc7a5":"\ub86f\ub370\uc7a0\uc2e4","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ud488\uc9c8 \ud655\uc778 \ud544\uc694"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \ub77c\ubca4\ub354 \ucd94\uac00 \ub9ac\uc624\ub354 \uc694\uccad","\ub9e4\uc7a5":"\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ub9ac\uc624\ub354 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc785\uace0 \uc2a4\ud0c0\uc77c \uc801\uc5b4 \uc2e0\ubc1c \ub2e4\uc591\uc131 \ubd80\uc871","\ub9e4\uc7a5":"\ud604\ub300\ubb34\uc5ed","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \ud655\uc778"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\uc544\uc774\ud30c\ud06c \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \ubd88\uac00 \u2192 \uc544\ub7ab\uce35 \uc774\ud0c8 \uc9c0\uc18d","\ub9e4\uc7a5":"\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uadfc\ubcf8 \ud574\uacb0 \ud544\uc694"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ud640\uc138\uc77c \ub3d9\uc2dc \ucd9c\uc2dc\ub85c \uc5ec\uc131 \uc2a4\ud399 \uc628\ub77c\uc778 \uc774\ud0c8 \ubc1c\uc0dd","\ub9e4\uc7a5":"\ub86f\ub370\uc7a0\uc2e4","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucc44\ub110 \ucd9c\uc2dc \uc815\ucc45 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"\ub86f\ub370\ub3d9\ubd80\uc0b0 25FW \uc790\ucf13 \ubd80\uc7ac\ub85c 20\ub9cc\uc6d0 \ucc44\uc6b0\uae30 \uc5b4\ub824\uc6c0","\ub9e4\uc7a5":"\ub86f\ub370\ub3d9\ubd80\uc0b0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"25FW \uc790\ucf13 \ubc30\ubd84 \uac80\ud1a0"}]}},"8\uc6d43W":{"date":"08/17~08/23","\uc804\uccb4\uc694\uc57d":"\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\u00b7\ud30c\uc778\ucf54\ud2bc FW \ub77c\uc778 \ud130\uce58\uc728\u00b7\ud310\ub9e4\uc728 \uc0c1\uc2b9, \uac04\uc808\uae30 \uc804\ud658 \uc2e0\ud638 \ubcf8\uaca9\ud654. \ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 W \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \ud3ed\ubc1c\uc801 \ubc18\uc751 \uc9c0\uc18d \u2014 \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31\uacfc \ube44\uad50 \uc2dc \uc555\ub3c4\uc801 \uc6b0\uc704. \ub514\ud30c\uc774\uc5b4 98\u00b7100 \ub0a8\uc131 \uc2a4\ud399 \uc7ac\uc785\uace0 \ubb38\uc758 \uc9c0\uc18d, \uc5ec\uc131 \uc2a4\ud399\uc740 \uad00\uc2ec\ub3c4 \ub2e4\uc18c \ud558\ub77d. \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ud130\ud504 \ud074\ub808\uc774\ucf54\ud2b8\uc6a9 \uae0d\uc815\uc801 \ubc18\uc751, \ub7ec\uc26c\ud22c\uc5b4\u00b7\uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4 \ub808\ub4dc \ud310\ub9e4 \uac15\uc138. \ucd94\uc11d \uc5f0\ud734 \uc55e\ub450\uace0 \uc18c\ube44 \uad00\ub9dd\uc138 \uc2ec\ud654, \uc678\uad6d\uc778 \ube44\uc911 \uac10\uc18c\u00b7\ub0b4\uad6d\uc778 \uc785\uc810 \uac10\uc18c \ucd94\uc138.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \ubc18\ud314** \uc5ec\uc804\ud788 \uc804 \ub9e4\uc7a5 1\uc704. \uc154\ub9c1\uc73c\ub85c \uccb4\ud615 \uc870\uc808 \uac00\ub2a5\ud55c \uae30\ub2a5\uc131 + \uc774\ub108\uc6e8\uc5b4 \uacb8\uc6a9 \uc7a5\uc810\uc73c\ub85c \uac04\uc808\uae30\uc5d0\ub3c4 \uc218\uc694 \uc720\uc9c0. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uccb4\ud615\ub9c8\ub2e4 \ub9de\ucdb0 \uc785\uc744 \uc218 \uc788\uc5b4 \ub2e4\uc591\ud55c \uace0\uac1d \ub9cc\uc871\ub3c4 \ub192\uc74c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ud310\ub9e4\uc21c\uc704 \uacc4\uc18d 1\ub4f1'. \uc2e0\uc138\uacc4\ub300\uc804 '\uc5ec\uc131 \ud3f4\ub85c\ud2f0 \uc804\uc5f0\ub839 \uad6c\ub9e4\uc728 \ub192\uc74c'."},{"tag":"FW\uc804\ud658","text":"\ud83d\udcc8 **\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\u00b7\ud30c\uc778\ucf54\ud2bc\u00b7\uc544\ub178\ub77d FW \ub77c\uc778 \ud130\uce58\u00b7\ud310\ub9e4 \uc0c1\uc2b9** \u2014 \uc544\uc774\ud30c\ud06c '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc14b\uc5c5 \ud310\ub9e4 \uc88b\uc74c, \ucee4\ud50c \ub2e8\uc704 \ubc29\ubb38 \uae34\ud314 \uc704\uc8fc \ud2b8\ub798\ud53d \uc99d\uac00'. \ub354\ud604\ub300\uc11c\uc6b8 'TJK \uc790\ucf13\ub958 \ud310\ub9e4 \ub192\uc74c'. \ud604\ub300\ud310\uad50 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ubc18\uc751 \uad49\uc7a5\ud788 \uc88b\uc74c'. LF\uad11\uc591 '\ud53c\uc2a4\ud14c \ud130\uce58\uc728 \ub192\uac8c \ub098\ud0c0\ub0a8'. \uc2e0\uc138\uacc4\ub300\uc804 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ud130\uce58\u00b7\uc544\uc774\uce90\uce6d \ub9ce\uc73c\ub098 \uac11\uc790\uae30 \ub354\uc6cc\uc9c4 \ub0a0\uc528\ub85c \uad6c\ub9e4 \uc774\uc5b4\uc9c0\uc9c0 \uc54a\uc74c'."},{"tag":"\uc6a9\ud488","text":"**\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 W** \uc804 \ub9e4\uc7a5 \ud3ed\ubc1c\uc801 \ubc18\uc751 \uc9c0\uc18d. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud50c\ub9ac\uc5d0 \ub355\uc5d0 \ud558\ub8e8\ub294 \ubc31\ud329\ubcf4\ub2e4 \ud06c\ub85c\uc2a4\ubc31\ub958\uac00 \ub354 \ub9ce\uc774 \ud314\ub9b0 \ub0a0\ub3c4 \uc788\uc74c'. \uc2e0\uc138\uacc4\uad11\uc8fc '\uc555\ub3c4\uc801 \uc778\uae30, \uc5ec\uc131 \ub2c8\uc988 \ud30c\uc545 \uc798 \ub41c \uc0c1\ud488'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ucda9\ub3d9\uad6c\ub9e4 \ub300\ub2e4\uc218 \u2014 \ub514\uc790\uc778\uc5d0 \ud639\ud574\uc11c \uad6c\ub9e4'. \ud604\ub300\ubb34\uc5ed '\ud310\ub9e4 \uc544\uc8fc \uc798\ub428'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uac04\uc808\uae30 \uc804\ud658 \uc2e0\ud638** \u2014 FW \uc544\ub178\ub77d\u00b7\uc790\ucf13\u00b7\uae34\ud314 \ud130\uce58 \ubc0f \ud310\ub9e4 \uc18c\ud3ed \uc0c1\uc2b9. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc544\ub178\ub77d\u00b7\ud2b8\ub799\uc790\ucf13 \ud130\uce58\u00b7\uad6c\ub9e4 \uc99d\uac00'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '\uc587\uc740 \uc7ac\ud0b7\u00b7\ub450\uaed8\uac10 \uc788\ub294 \uc2a4\ucee4\ud2b8 \ucc3e\ub294 \ubd84 \uc810\ucc28 \uc99d\uac00'. \ud83d\udcc9 **\ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd\uc138** \u2014 \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uace0\uac1d\ub4e4\uc774 \ucd94\uc11d \uc5f0\ud734\ub97c \uc704\ud55c \uc9c0\ucd9c \uba48\ucd98 \ub290\ub08c'. \ud83d\udcc9 **\uc678\uad6d\uc778 \ube44\uc911 \uac10\uc18c** \u2014 \ub2e4\uc218 \ub9e4\uc7a5 '4~5\uc6d4 \ub300\ube44 \uc678\uad6d\uc778 \ud604\uc800\ud788 \uac10\uc18c'. \ud83d\udcc8 **\ud604\ub300\uc6b8\uc0b0 \uc2e0\uaddc \uc624\ud508** \u2014 \ub9e4\uc7a5 \ucc98\uc74c\uc774\ub77c \ud638\uae30\uc2ec \ubc29\ubb38 \u591a."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (FW \uc2e0\uc0c1\u00b7\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\u00b7\ud30c\uc778\ucf54\ud2bc \ubc18\uc751)","items":[{"tag":"FW \uc2e0\uc0c1 \ubc18\uc751","text":"**\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc790\ucf13\u00b7\uc14b\uc5c5** \uc804\ubc18 \uae0d\uc815 \ubc18\uc751. \uc544\uc774\ud30c\ud06c '\ub450\uaed8\uac00 \uc5ec\ub984\uc5d0\ub3c4 \ucc29\uc6a9 \uac00\ub2a5 \u2014 \ud070 \uba54\ub9ac\ud2b8, \uceec\ub7ec\u00b7\ub514\uc790\uc778 \uc608\uc058\ub2e4\ub294 \ud53c\ub4dc\ubc31'. \ud604\ub300\ud310\uad50 '\ubc18\uc751 \uad49\uc7a5\ud788 \uc88b\uc74c'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ub808\ub4dc\ub77c\uc778 \uc785\uace0 \uc989\uc2dc \ubc18\uc751'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud30c\uc778\ucf54\ud2bc \ub77c\uc778 \ud310\ub9e4\ub7c9 \ub192\uc74c, 3\ubd84\uae30 \uc2e0\uc0c1\ud488 \ub300\ubd80\ubd84 \ubc18\uc751 \uc88b\uc74c'. \ub2e8, \uc2e0\uc138\uacc4\ub300\uc804 '\uac11\uc790\uae30 \ub354\uc6cc\uc9c4 \ub0a0\uc528\ub85c \uad6c\ub9e4\uae4c\uc9c0 \uc774\uc5b4\uc9c0\uc9c0 \uc54a\uc74c'."},{"tag":"\uace0\uac1d \ubd84\uc11d","text":"\uc804\ubc18\uc801\uc73c\ub85c \uc2e0\uaddc \uc720\ud615 \uc0c1\ud488 \uad6c\ub9e4 \ube44\uc728\uc774 \ubca0\uc2a4\ud2b8 \uc7ac\uad6c\ub9e4\ubcf4\ub2e4 \ub192\uc740 \ub9e4\uc7a5 \u591a. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uac19\uc740 \ud37c\ud3ec\uba3c\uc2a4 \ub514\uc790\uc778 \uc120\ud638, \ube45\uc560\ud50c\uc740 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c\uc6a9'. \uc2e0\uc138\uacc4\ub300\uc804 '\uae30\uc8744:\uc2e0\uaddc6 \ube44\uc728, \uc77c\ubc18 \uace0\uac1d \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uad6c\ub9e4 \uc810\uc810 \ub298\uc5b4'. AK\uc6d0\uc8fc '90% \uae30\uc874 \uc7ac\ubc29\ubb38 \uace0\uac1d, \uc2e0\uaddc \uc720\uc785 \uc880\ucc98\ub7fc \ub298\uc9c0 \uc54a\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\ubd80\uc0b0 \ub0a8\uc131 M\u00b7L \uc0ac\uc774\uc988 \ubd80\uc7ac \ud310\ub9e4 \ub85c\uc2a4** \u2014 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 M\u00b7L \uc5c6\uc5b4 \ud310\ub9e4 \ub85c\uc2a4 \uc885\uc885 \ubc1c\uc0dd' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \uae34\uae30\uc7a5 \uc0c1\ud488\u00b7\uc0ac\uc774\uc988 \uacb0\ud488 \uad6c\ub9e4 \ubbf8\uc5f0\uacb0** \u2014 '\uc0ac\uc774\uc988 \uacb0\ud488\uc774\ub098 \uc6d0\ud558\ub294 \uc0c1\ud488 \ubd80\uc7ac\ub85c \uad6c\ub9e4 \uc548 \uc774\ub8e8\uc5b4\uc9d0' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uc758\uc655 '\uc5ec\uc131 \uae34\uae30\uc7a5 \uc0c1\ud488 \ubd80\uc7ac\ub85c \uc774\ud0c8 \uc9c0\uc18d'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc758\ub958 \ud130\uce58\ub294 \ub9ce\uc9c0\ub9cc \ubd80\ub2f4\uc2a4\ub7fd\ub2e4\u00b7\uac00\uaca9 \ubd80\ub2f4 \ud53c\ub4dc\ubc31 \ubc18\ubcf5'. \ud604\ub300\uc6b8\uc0b0 '\ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \ub77c\uc778 \uc5c6\uc5b4\uc11c \uc544\uc26c\uc6cc\ud558\ub294 \ud53c\ub4dc\ubc31 \u591a \u2014 \ub77c\uc774\ud504\ub77c\uc778 \ud655\ub300 \uc694\uccad'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5ec\ub984 \uc0c1\ud488 \ud53c\ub85c\uac10 \uc2ec\ud654'."},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ub0a8\uc131\uc6a9 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac \ubc18\ud314\ud2f0 XS \ubb38\uc758 \ub9ce\uc74c \u2014 \uc5ec\uc131 \uace0\uac1d\uc774 \ub0a8\uc131 XS \uad6c\ub9e4 \ub2c8\uc988'. \ub86f\ub370\ucc3d\uc6d0 '\ud1b5\ud1b5\ud55c \ubd84\ub4e4 \uc0ac\uc774\uc988 \uc544\uc26c\uc6c0\uc73c\ub85c \uc774\ud0c8'. AK\uc6d0\uc8fc '\ud14c\ub2c8\uc2a4 \uc758\ub958\uac00 \uc544\ub2d8\uc744 \uc124\uba85\ud574\ub3c4 \uc778\uc2dd \uc804\ud658 \uc5b4\ub824\uc6c0 \u2014 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uc811\uadfc \ud544\uc694'."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 W vs \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31 \ubc18\uc751)","items":[{"tag":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31","text":"**\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \ud3ed\ubc1c\uc801 \ubc18\uc751** \u2014 \uc131\uacf5 \uc694\uc778: \u2460 \uc5ec\uc131\uc2a4\ub7ec\uc6b4 \ub514\uc790\uc778\u00b7\uceec\ub7ec \u2461 \ub113\uc740 \uc218\ub0a9\uacf5\uac04(\ub77c\ucf13 2\uc790\ub8e8) \u2462 \uc77c\uc0c1+\ud14c\ub2c8\uc2a4 \uacb8\uc6a9 \u2463 \ubcf4\ub0c9\uae30\ub2a5. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uadf8\ub85c\ube0c \uc2dc\uc98c \ub54c \ubabb \uc0b0 \uace0\uac1d\ub4e4\uc774 \uc720\uc0ac\ud558\ub2e4\uba70 \uc774\ubbf8 \uc54c\uace0 \uc634, \ubc31\ud329 \ud3ec\uae30\ud558\uace0 \uad6c\ub9e4\ud560 \uc815\ub3c4'. \uc2e0\uc138\uacc4\uc13c\ud140 '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1\ud1a0\ud2b8\ubcf4\ub2e4 \ubc18\uc751 \uc555\ub3c4\uc801 \uc6b0\uc138'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ucda9\ub3d9\uad6c\ub9e4 \ub300\ub2e4\uc218'."},{"tag":"\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31","text":"\ud50c\ub9ac\uc5d0 \uc785\uace0 \ud6c4 \uad00\uc2ec\ub3c4 \ud558\ub77d \ucd94\uc138 \u2014 \uc0ac\uc774\uba3c\ud30c\uc8fc '\ud50c\ub9ac\uc5d0 \uc785\uace0 \ud6c4 \uad00\uc2ec\ub3c4 \ub0ae\uc544\uc9d0'. \uc544\uc774\ud30c\ud06c '\ub4dc\ub85c\uc6b0 \ud1a0\ud2b8\ubc31 \ubc18\uc751 \uc544\uc608 \uc5c6\uc74c \u2014 \uc815\uc0ac\uac01\ud615 \ub514\uc790\uc778 \ud22c\ubc15\ud574 \ubcf4\uc778\ub2e4\ub294 \ud53c\ub4dc\ubc31'. \ud604\ub300\ud310\uad50 '\ud14c\ub2c8\uc2a4 \ud2b8\ub801\ud06c\ubc31 \uc81c\ud488\uc73c\ub85c \uc751\ub300 \uc2dc \uc2e0\uc120\ud568\uc73c\ub85c \ubc18\uc751 \uc88b\uc74c'. \uc678\uad6d\uc778 \uc120\ud638: \ub354\ud604\ub300\uc11c\uc6b8 '\uc678\uad6d \uace0\uac1d\uc740 \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ubc31\ud329 \uc778\uae30'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 \ud50c\ub9ac\uc5d0\u00b7\ub4dc\ub85c\uc6b0 \ud1a0\ud2b8\ubc31 \uad6c\ub9e4 \ubbf8\uc5f0\uacb0** \u2014 '\uc62c\uc778\uc6d0\uc73c\ub85c \ub4e4\uace0\ub2e4\ub2c8\uae30\uc5d4 \ubb34\ub9ac\ub77c \uc0dd\uac01\ud558\ub294 \ubd84 \u591a' \u2192 \uc0ac\uc6a9 \ud3b8\uc758\uc131 \uc124\uba85 \uac15\ud654 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ub86f\ub370\ub3d9\ubd80\uc0b0 '\ud50c\ub9ac\uc5d0 \uc0c9\uc0c1 2\uac00\uc9c0(\ud30c\ub791\u00b7\uc544\uc774\ubcf4\ub9ac)\uc5d0 \uc544\uc26c\uc6c0 \u2014 \uceec\ub7ec \ub2e4\uc591\ud654 \uc694\uccad'. \ud604\ub300\uc6b8\uc0b0 '\ub4dc\ub85c\uc6b0 \uc2a4\ud2b8\ub9c1\ubc31 \uad00\uc2ec\uc740 \uc788\uc73c\ub098 \uad6c\ub9e4 \ubbf8\uc5f0\uacb0'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc544\uc774\ubcf4\ub9ac \uceec\ub7ec \ub9ce\uc774 \ucc3e\uc74c'. \ub86f\ub370\uc7a0\uc2e4 '\ud1a0\ud2b8\u00b7\uc9d0\ubc31 \ubc18\uc751 \uc88b\uc558\uc73c\ub098 \ubc31\ud329 \ud310\ub9e4 \uc800\uc870'."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\ub7ec\uc26c\ud22c\uc5b4\u00b7\uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4\u00b7\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504 \ubc18\uc751)","items":[{"tag":"\uc218\uc785\ud654 \uac15\uc138","text":"**\ub7ec\uc26c\ud22c\uc5b4\u00b7\uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4 \ud310\ub9e4 \uac15\uc138** \u2014 \ucee4\ub125\ud2b8\uccad\uc8fc '\ub7ec\uc26c\u00b7\uc778\ud2b8\ub9ac\uadf8 \ud310\ub9e4\uc728 \ub192\uc74c, \uc70c\uc2a8 \uace0\uac1d \ub808\ub4dc \ud638\ubd88\ud638 \uc5c6\uc774 \uc88b\uc544\ud568, \uc778\ud2b8\ub9ac\uadf8\ud22c\uc5b4 \ub808\ub4dc \ub450\uac01'. \uc2e0\uc138\uacc4\ub300\uc804 '\ub7ec\uc26c\ud22c\uc5b4\u00b7\ud504\ub85c \ud130\uce58\uc728 \uc804\uc8fc \ub300\ube44 \uc0c1\uc2b9'. \ub354\ud604\ub300\uc11c\uc6b8 '\ub7ec\uc26c\ud504\ub85c\u00b7\ud22c\uc5b4, \uc778\ud2b8\ub9ac\uadf8 \ub9ce\uc774 \ucc3e\uc74c'."},{"tag":"\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504","text":"**\ud074\ub808\uc774\u00b7\uc778\uc870\uc794\ub514 \uace0\uac1d \ub2c8\uc988 \ucda9\uc871** \u2014 \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ub9ac\uc2a4\ud3f0\uc2a4 \ud130\ud504 \ud074\ub808\uc774\ub77c\uc778 \uac00\uaca9 \ub9cc\uc871\u00b7\uceec\ub7ec\uac10 \uc88b\uc544 \ub0a8\ub140 \ubd88\ubb38 \ubc18\uc751 \uc88b\uc74c'. \uc2e0\uc138\uacc4\ub300\uc804 '\uc778\ud2b8\ub9ac\uadf8 \ud22c\uc5b4 \ucc29\ud654 \uc548\uc815\uac10 \ub9cc\uc871\uc73c\ub85c \uc5ec\uc131 \uad6c\ub9e4'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc544\uc774\uce90\uce6d \uc88b\uc73c\ub098 \uac00\uc131\ube44 \uc6d0\ud558\ub294 \uace0\uac1d\uc5d0\uac8c \ub192\uc740 \uac00\uaca9 \uc7a5\ubcbd'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc544\uc774\ud30c\ud06c 285\u00b7290 \uc0ac\uc774\uc988 \ubd80\uc7ac \uc678\uad6d\uc778 \uc774\ud0c8** \u2014 '\uc810\ud3ec \ud2b9\uc131\uc0c1 \uc678\uad6d\uc778 \uc720\uc785 \uc788\uc5b4 \ud070 \uc0ac\uc774\uc988 \ud544\uc218, \uc5ec\uc720 \uc218\ub7c9 \ud544\uc694' \u2192 \uc7ac\uace0 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\uae30\ud765 \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \ubbf8\uc785\uace0 \ubb38\uc758 \uc9c0\uc18d** \u2014 '\uafb8\uc900\ud55c \ubb38\uc758\uc778\ub370 \uc785\uace0 \uc548 \ub428' \u2192 \uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc62c\uc5ec\ub984 \uc2e0\ubc1c \ub108\ubb34 \ub9ce\uc774 \uad6c\ub9e4\ud558\uc168\ub2e4\uba70 FW \uc2e0\uc0c1 \uae30\ub2e4\ub9ac\uaca0\ub2e4\ub294 \uace0\uac1d \u591a \u2014 1\uc885\ub958 \uc785\uace0\ub77c \uc2e0\uc0c1 \ubc18\uc751 \ubcf4\uae30 \uc5b4\ub824\uc6c0, \ube60\ub978 FW \uc2dc\uc98c \uc0c1\ud488 \uc785\uace0 \uc694\uccad'. \ub86f\ub370\ub3d9\ubd80\uc0b0 'CTC \ud130\uce58 \ub9ce\uc73c\ub098 \uac00\uaca9\ub300 \ub192\uc544 \ud3ec\uae30 \u591a \u2014 \uc544\uc6b8\ub81b \ud2b9\uc131'. \ub86f\ub370\uc758\uc655 '\uc815\uc0c1\ubcf4\ub2e4 \uc0c1\uc124 \ud310\ub9e4 \ube44\uc911 \ub192\uc74c'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \uc7ac\uc785\uace0 \ubb38\uc758\u00b7\ud0c0\uc774\uac70 \uc5d0\ub514\uc158\u00b7US\uc624\ud508 \ubc18\uc751)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4","text":"**\ub0a8\uc131 \uc2a4\ud399 \uc7ac\uc785\uace0 \ubb38\uc758 \uc9c0\uc18d** \u2014 \ub86f\ub370\uc7a0\uc2e4 '\ub514\ud30c\uc774\uc5b4 98PRO 10\uc6d4 \uc785\uace0 \uc548\ub0b4 \uc911'. \ub86f\ub370\ucc3d\uc6d0 '\ub514\ud30c\uc774\uc5b4 \ud130\uce58\u00b7\ubb38\uc758 \uac00\uc7a5 \ub9ce\uc73c\ub098 \uc7ac\uace0 \uc5c6\uc5b4 \uadf8\ub0e5 \ub3cc\uc544\uac00\ub294 \uace0\uac1d \u591a'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ub514\ud30c\uc774\uc5b4 100\u00b798PRO \ubb38\uc758 \uafb8\uc900'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '7\uc6d4 \ucd08 \ub300\ube44 \uad00\uc2ec \uc904\uc5b4\ub4dc\ub294 \ucd94\uc138 \u2014 \uc18c\ub7c9 \ubb3c\ub7c9\uc73c\ub85c \uad6c\ub9e4 \ub85c\uc2a4 \ubc1c\uc0dd\uc774 \uc6d0\uc778'."},{"tag":"\uc5ec\uc131 \uc2a4\ud399","text":"**\uc5ec\uc131 \uc2a4\ud399 100L\u00b7100UL \ubc18\uc751 \uc0c1\ub300\uc801 \ud558\ub77d** \u2014 AK\uc6d0\uc8fc '\uc5ec\uc131 \uc2a4\ud399 \uad00\uc2ec\ub3c4 \ub9ce\uc774 \ub5a8\uc5b4\uc9d0'. \ud604\ub300\ubb34\uc5ed '\ub0a8\uc131 \uc2a4\ud399 \ub300\ube44 \uc5ec\uc131 \ubb38\uc758 \uc801\uc74c'. \ud604\ub300\uc911\ub3d9 '\uc7ac\uc785\uace0 \ud6c4 \ubc18\uc751 \uc904\uc5b4\ub4e6'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '100UL \ud55c\uc8fc 1~2\uac1c \uafb8\uc900 \ud310\ub9e4'."},{"tag":"\ud0c0\uc774\uac70 \uc5d0\ub514\uc158","text":"**\ud0c0\uc774\uac70 \uc5d0\ub514\uc158 \ud130\uce58 \uc544\uc9c1 \ubbf8\ubbf8** \u2014 \ub354\ud604\ub300\uc11c\uc6b8 '\ud130\uce58\uac10 \uc544\uc9c1 \ub9ce\uc9c0 \uc54a\uc74c'. \uc2e0\uc138\uacc4\ub300\uc804 '\uc18c\ud3ed \ud130\uce58 \uc788\uc73c\ub098 \ubc18\uc751 \ud06c\uc9c0 \uc54a\uc74c, \uc9c0\ucf1c\ubd10\uc57c'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\uc2e0\uaddc \ub77c\ucf13 \ubb38\uc758\ub9cc \ub9ce\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\uc5ec\uc8fc \ub77c\ucf13 \uc885\ub958\u00b7\ubb34\uac8c\u00b7\uadf8\ub9bd \uc120\ud0dd\uc9c0 \uc804\ubb34** \u2014 '\uc5ec\uc131 \ubb38\uc758 \ub9ce\uc9c0\ub9cc \uc801\ud569\ud55c \uc81c\ud488 \uc5c6\uc5b4 \uc0c1\ub2f4 \uc790\uccb4 \uc5b4\ub835\uace0 \ud310\ub9e4 \uc804\ud600 \ubbf8\uc5f0\uacb0' \u2192 \ub77c\ucf13 \uc785\uace0 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\ubd80\uc0b0 \uc0c1\uc124 \ub77c\ucf13 3\uadf8\ub9bd\ub9cc \ub0a8\uc544 \uc2e4\uad6c\ub9e4 \ubd88\uac00** \u2014 '\ubb34\ub2ac\ub9cc \uc0c1\uc124\ub77c\ucf13, \uc2e4 \uad6c\ub9e4 \uac00\ub2a5\ud55c \uc2a4\ud399 \uc798 \uc5c6\uc74c' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ub514\ud30c\uc774\uc5b4 100L \ubb38\uc758 \ub04a\uc774\uc9c0 \uc54a\uc74c \u2014 \uc778\uc2a4\ud0c0 \uc2a4\ud1a0\ub9ac \ubc14\uc774\ub7f4 \ud6a8\uacfc\ub85c \uc804\ud654\u00b7\ubc29\ubb38 \uae09\uc99d'. \ub86f\ub370\uc7a0\uc2e4 '280g \uc218\uc694 \uc810\ucc28 \uc99d\uac00 \u2014 \uc218\uc8fc \uc2dc 260g\ubcf4\ub2e4 280g \ube44\uc911 \ud655\ub300 \uac80\ud1a0 \ud544\uc694'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub864\ub791\uac00\ub85c\uc2a4 \ud074\ub798\uc2dc \ubb38\uc758 \ub9ce\uc74c'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc548\uc815\uc801 \ud310\ub9e4 \uc720\uc9c0. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc62c\ud300 \uc778\ub3c4\uc5b4 \ubb38\uc758 \ub9ce\uc74c, \ucee4\ub9ac \ud310\ub9e4 \uc88b\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5d0\ubcf4\ub125\uc2a4\ud2b8\u00b7\uc5d0\ubcfc\ub8e8\uc158\u00b73\ud638\ubcfc\u00b7\uc8fc\ub2c8\uc5b4\ubcfc \ud310\ub9e4 \uc88b\uc74c'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ub808\ud2b8\ub85c \ub18d\uad6c\uacf5 \uc785\uace0 \ud6c4 \ud310\ub9e4 \uc99d\uac00'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '3X3\u00b7\uc2a4\ud14c\ud310\ucee4\ub9ac\u00b7\ub974\ube0c\ub860 \uc0ac\uc778\ubcfc \ud310\ub9e4 \uc99d\uac00'."},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ub18d\uad6c\ud654\u00b7\uc57c\uad6c\ubc30\ud2b8 \uae30\ud0c0 \uc6a9\ud488 \ubb38\uc758 \ubc1c\uc0dd'. \uc544\uc774\ud30c\ud06c '\uc778\uc2a4\ud0c0 \ub9b4\uc2a4 \ud1b5\ud55c \uc7ac\uace0 \ubb38\uc758\u00b7\uad6c\ub9e4 \uc99d\uac00'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\ucd08\ub4f1\uc0dd \uace0\ubb34\uacf5 \ud310\ub9e4 \uc88b\uc74c'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ub18d\uad6c\uacf5 \ud310\ub9e4 \uc800\uc870, \ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcfc\ub8e8\uc158 \ud130\uce58 \uafb8\uc900'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub18d\uad6c\uacf5 \uc0ac\ub7ec \uc654\ub2e4\uac00 \ud14c\ub2c8\uc2a4 \ub77c\ucf13 \uad6c\ub9e4 \uc804\ud658 \uc0ac\ub840'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669 (\ucd94\uac00 \ud560\uc778 \ud6a8\uacfc\u00b7\uc5f0\ub3c4\ubcc4 \ud560\uc778\uc728 \uc774\uc288)","items":[{"tag":"\ucd94\uac00\ud560\uc778 \ud6a8\uacfc","text":"**\ucd94\uac00 \ud560\uc778 \ud6a8\uacfc \uc804\ubc18 \uae0d\uc815\uc801** \u2014 \ub86f\ub370\uae30\ud765 '\uad6c\ub9e4 \uace0\ubbfc \uc81c\ud488\uc5d0 \ucd94\uac00\ud560\uc778 \uc2dc \uc14b\uc5c5 \uc5f0\uacc4 \uad6c\ub9e4\uae4c\uc9c0 \uc774\uc5b4\uc838 \uae0d\uc815\uc801'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\ucd94\uac00 \ud560\uc778\uc5d0 \ud130\uce58\u00b7\uad6c\ub9e4 \uc62c\ub77c\uac10'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ud589\uc0ac \uc2dc\uae30\uc640 \ub9de\ubb3c\ub824 \uc8fc\ub9d0 \uad6c\ub9e4\uc728 \ub9ce\uc774 \uc62c\ub77c\uac10'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ubbf8\ub07c\uc0c1\ud488\uc73c\ub85c \uc811\uadfc\ud558\uae30 \uc88b\uc74c \u2014 \uc18c\ub7c9\uc529 \ub098\ub220 \ucd94\uac00 \uc138\uc77c\ud558\ub294 \ubc29\uc2dd \uc81c\uc548'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5f0\ub3c4\ubcc4 \ud560\uc778\uc728 \uc5ed\uc804 \uc774\uc288** (\uc0ac\uc774\uba3c\ubd80\uc0b0\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc) \u2014 '24FW\uac00 25FW\ubcf4\ub2e4 \ud560\uc778 \uc548 \ub418\ub294 \uc5ed\uc804 \ud604\uc0c1\uc73c\ub85c \uc870\ub2dd \uc5b4\ub835\uace0 \uace0\uac1d \ud63c\ub780' \u2192 \ud560\uc778\uc728 \uc815\ucc45 \uc7ac\uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ud604\ub300\ub300\uc804 '\uc545\uc131\uc7ac\uace0 \ucd94\uac00\ud560\uc778\ubcf4\ub2e4 \uade0\uc77c\uac00 \ud310\ub9e4 \uc694\uccad'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ucd94\uac00\ud560\uc778 \uc81c\ud488\uc73c\ub85c\ub9cc \uc2dc\uc120 \uc3e0\ub9bc, \uc815\uc0c1 \uc0c1\ud488 \ud310\ub9e4 \uc704\ucd95'. LF\uad11\uc591 '\ud560\uc778\uc728 \ub192\uc740 \uc0c1\ud488\uc5d0 \uae0d\uc815 \ubc18\uc751, \uae08\uc561\ubcf4\ub2e4 \ud560\uc778\uc728\uc5d0 \ubbfc\uac10'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5 (\uc678\uad6d\uc778 \uac10\uc18c\u00b7\ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd)","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd\uc138 \uc2ec\ud654** \u2014 \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc9c0\ucd9c \uba48\ucd98 \ub290\ub08c, \uac1d\ub2e8\uac00 \uc27d\uac8c \uc62c\ub77c\uac00\uc9c0 \uc54a\uc74c'. \ub86f\ub370\uc7a0\uc2e4 '\uc785\uc810\uac1d \ubab8\uc18c \ub290\uaef4\uc9c8 \uc815\ub3c4\ub85c \uc904\uc5b4\ub4e6, \ud2b9\ud788 \ub0b4\uad6d\uc778'. \uc2e0\uc138\uacc4\ub300\uc804 '\ud734\uac00 \ub9c9\ubc14\uc9c0\u00b7\uae30\uc628 \uc0c1\uc2b9\uc73c\ub85c \uc785\uc810 \ub354\ub354\uc6b1 \uac10\uc18c'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ud14c\ub2c8\uc2a4 \ud65c\ub3d9 \ud65c\ubc1c\ud574\uc9c0\uba70 \uad6c\ub9e4\uc728 \uc18c\ud3ed \uc0c1\uc2b9'."},{"tag":"\uc678\uad6d\uc778 \uac10\uc18c","text":"**4~5\uc6d4 \ub300\ube44 \uc678\uad6d\uc778 \ud604\uc800\ud788 \uac10\uc18c** \u2014 \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '4~5\uc6d4 \uc678\uad6d\uc7786:\ub0b4\uad6d\uc7784 \u2192 7\uc6d4 \uc774\ud6c4 \ub0b4\uad6d\uc778 \ube44\uc911\uc774 \ub354 \ub9ce\uc544\uc9d0'. \ub098\uc778\uc6d0\ud55c\ub0a8 '4~5\uc6d4 \ub300\ube44 \uc785\uc810\u00b7\uad6c\ub9e4 \ubaa8\ub450 \uc6d4\ub4f1\ud788 \uc904\uc5c8\uc74c'. \ub86f\ub370\uc778\ucc9c '\ud06c\ub8e8\uc988 \uc154\ud2c0\ubc84\uc2a4 \uc6b4\ud589\uc73c\ub85c \uc678\uad6d\uc778 \uc99d\uac00'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub9e4\uc7a5 \ubc29\ubb38 \uc808\ubc18 \uc774\uc0c1\uc774 \uc778\uc2a4\ud0c0\u00b7DM\uc73c\ub85c \uc608\uc57d \ud6c4 \ubc29\ubb38'."},{"tag":"\ud604\ub300\uc6b8\uc0b0 \uc2e0\uaddc","text":"\ud604\ub300\uc6b8\uc0b0 \uc2e0\uaddc \uc624\ud508 \u2014 '\uc70c\uc2a8\uc774 \uc624\ud508\ud574\uc11c \uc88b\ub2e4\ub294 \uace0\uac1d \ub9ce\uc74c, \uae30\uc874\uc5d0 \uc628\ub77c\uc778\u00b7\ubd80\uc0b0 \uac00\uc11c \uad6c\ub9e4\ud558\ub358 \uace0\uac1d \ubc29\ubb38'. \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \ub77c\uc778 \uc5c6\uc5b4 \uc544\uc26c\uc6cc\ud558\ub294 \ud53c\ub4dc\ubc31 \u591a. \ud14c\ub2c8\uc2a4 \ubaa9\uc801 \uace0\uac1d \uc678 \uc77c\uc0c1\ubcf5 \ubaa9\uc801 \ubc29\ubb38\ub3c4 \uc788\uc73c\ub098 \uad6c\ub9e4\uae4c\uc9c0 \uc774\uc5b4\uc9c0\uc9c0 \uc54a\uc74c."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"LF\uad11\uc591 '\ud0c0 \ube0c\ub79c\ub4dc \uc5ed\uc2dc \uc804\ubc18 \ub9e4\ucd9c \ud558\ub77d'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5ec\ub984 \uc0c1\ud488 \ud53c\ub85c\uac10, \uc0c9\uac10\ub9cc \ubc14\ub010 \uc0c1\ud488 \ud53c\ud558\ub294 \uacbd\ud5a5'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uac00\uaca9 \ubd80\ub2f4\u00b7\ud0c0 \ube0c\ub79c\ub4dc \ube44\uad50\ub85c \uad6c\ub9e4 \ubbf8\uc5f0\uacb0'. \ub86f\ub370\uae30\ud765 '\ucd94\uc11d \uc5f0\ud734 \uc55e\ub450\uace0 \uc18c\ube44 \uad00\ub9dd, \uc0c1\uc124 \ud560\uc778 \uae30\ub2e4\ub9ac\ub294 \uace0\uac1d \uc99d\uac00'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\ubd80\uc0b0 \ub0a8\uc131 M\u00b7L \uc0ac\uc774\uc988 \ubd80\uc7ac \ud310\ub9e4 \ub85c\uc2a4","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ubd80\uc0b0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \uc0ac\uc774\uc988 \uacb0\ud488\u00b7\uc6d0\ud558\ub294 \uc0c1\ud488 \ubd80\uc7ac\ub85c \uad6c\ub9e4 \ubbf8\uc5f0\uacb0","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31 \uceec\ub7ec \ub2e4\uc591\ud654 \uc694\uccad (\ud604\uc7ac 2\uac00\uc9c0 \uc0c9\uc0c1 \uc544\uc26c\uc6c0)","\ub9e4\uc7a5":"\ub86f\ub370\ub3d9\ubd80\uc0b0\u00b7\ub2e4\uc218","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uae30\ud68d \uac80\ud1a0"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc544\uc774\ud30c\ud06c 285\u00b7290 \uc0ac\uc774\uc988 \ubd80\uc7ac\ub85c \uc678\uad6d\uc778 \uc774\ud0c8","\ub9e4\uc7a5":"\uc544\uc774\ud30c\ud06c","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub86f\ub370\uae30\ud765 \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \ubbf8\uc785\uace0 \ubb38\uc758 \uc9c0\uc18d","\ub9e4\uc7a5":"\ub86f\ub370\uae30\ud765","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"FW \uc2dc\uc98c \uc2e0\ubc1c 1\uc885\ub958\ub9cc \uc785\uace0\ub85c \ubc18\uc751 \ud30c\uc545 \uc5b4\ub824\uc6c0","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ube60\ub978 FW \uc2dc\uc98c \uc2e0\ubc1c \uc785\uace0 \uc694\uccad"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\uc5ec\uc8fc \ub77c\ucf13 \uc885\ub958\u00b7\ubb34\uac8c\u00b7\uadf8\ub9bd \uc120\ud0dd\uc9c0 \uc804\ubb34 \u2014 \ud310\ub9e4 \ubbf8\uc5f0\uacb0","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ub77c\ucf13 \uc785\uace0 \uc2dc\uae09"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\ubd80\uc0b0 \uc0c1\uc124 \ub77c\ucf13 3\uadf8\ub9bd\ub9cc \ub0a8\uc544 \uc2e4\uad6c\ub9e4 \ubd88\uac00","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ubd80\uc0b0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"24FW vs 25FW \uc5f0\ub3c4\ubcc4 \ud560\uc778\uc728 \uc5ed\uc804 \uace0\uac1d \ud63c\ub780","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ubd80\uc0b0\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ud560\uc778\uc728 \uc815\ucc45 \uc7ac\uac80\ud1a0"}]}},"8\uc6d44W":{"date":"08/24~08/30","\uc804\uccb4\uc694\uc57d":"\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8\u00b7\uc544\ub178\ub77d FW \ubc18\uc751 \ubcf8\uaca9\ud654, \ub808\ub4dc \uceec\ub7ec \uc555\ub3c4\uc801 \uc120\ud638. \ubc18\ud314 \uc218\uc694 \uc544\uc9c1 \uc0c1\uc704\uc774\ub098 \uae34\ud314\u00b7\uc790\ucf13 \ud130\uce58\uc728 \uc0c1\uc2b9 \u2014 \uac04\uc808\uae30 \uc804\ud658 \uac00\uc18d. \uc790\ucf13 \uc18c\ub9e4 \ub514\uc790\uc778 \ubd80\ub2f4 \ud53c\ub4dc\ubc31 \ub2e4\uc218, \uae34\ubc14\uc9c0 \uc218\uc694 \uc804 \ub9e4\uc7a5 \uacf5\ud1b5. \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2 WHT\u00b7IVY \ud488\uc808\ub85c \ub9e4\ucd9c \ud0c0\uaca9, \ub4c0\uc624\ud50c\ub7a9\u00b7\ucf54\ud2b8\ub77c\uc774\ud2b8\ub85c \uc804\ud658. \uc5d0\uc5b4\ub9ac \ud551\ud06c \uc785\uace0 \u2014 \ud638\ubd88\ud638 \uac08\ub9bc(\uc678\uad6d\uc778\u00b7\uc5f0\ub839\ub192\uc740 \uace0\uac1d \uc120\ud638). \ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8 \ubc18\uc751 \ubbf8\ubbf8. \ub514\ud30c\uc774\uc5b4 98\u00b7100 \ub0a8\uc131 \uc7ac\uc785\uace0 \ubb38\uc758 \uc9c0\uc18d. \ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd\u00b7\uc785\uc810 \uac10\uc18c, \uacbd\uc7c1\uc0ac \uacbd\ub7c9\ud328\ub529 \uc120\ucd9c\uc2dc.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0ac\uc774\ub4dc\uc154\ub9c1 \ubc18\ud314** \uc5ec\uc804\ud788 \ud310\ub9e4 1\uc704 \uc720\uc9c0. \uc2e0\uc138\uacc4\uc13c\ud140 '\uc804\uc8fc\uc5d0 \uc774\uc5b4 \uacc4\uc18d \uc88b\uc740 \ubc18\uc751, \uc544\uc774\ucf54\ub2c9 \ubc18\ubc14\uc9c0\uc640\ub3c4 \uc14b\uc5c5 \uac00\ub2a5'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc774\ubc88\uc8fc\ubd80\ud130 \uae34\ud314\ub958\ub3c4 \uad49\uc7a5\ud788 \uc88b\uc74c, VDM \uc131\uacf5\uc801\uc73c\ub85c \uc608\uc058\uac8c \ub418\uc5b4 \ub2e4\uc591\ud55c \uc0c9\uc0c1 \uad6c\ub9e4 \uac00\ub2a5\ud558\ub2e4\ub294 \uace0\uac1d \ub9ce\uc544\uc9d0'."},{"tag":"FW \uc804\ud658","text":"**\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc544\ub178\ub77d\u00b7\uc790\ucf13 \ud310\ub9e4 \ubcf8\uaca9\ud654** \u2014 \uc544\uc774\ud30c\ud06c '\uc544\ub178\ub77d \uc14b\uc5c5 \uc2e0\uaddc \uace0\uac1d\uc5d0\uac8c\ub3c4 \ud310\ub9e4 \uc88b\uc74c'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\uc2e0\uc0c1 \uae34\ud314 \ub2e8\uace8\uace0\uac1d \ubc18\uc751 \uc88b\uc74c'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ud2b8\ub799\uc790\ucf13\u00b7\ud53c\uc2a4\ud14c \ud310\ub9e4\ub7c9 \ub208\uc5d0 \ub744\uac8c \uc99d\uac00'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \ubc18\ud314 \ud310\ub9e4\ub7c9 \uc88b\uc74c, FW \uc2e0\uc0c1 \ud130\uce58\uc728 \uc88b\uc74c'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '\uc790\ucf13\u00b7\uc6b0\ube10 \uae34\ud314 \uc785\uace0 \uc9c1\ud6c4\ubd80\ud130 \ud130\uce58\uc728 \ub192\uace0 \ud310\ub9e4 \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\uc6a9\ud488","text":"**\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \ud1a0\ud2b8\ubc31(TBO83)** \u2014 \ub86f\ub370\uc778\ucc9c '\uc5ec\uc131\ubd84\ub4e4 \ubc18\uc751 \uc815\ub9d0 \uc88b\uc74c, \uc204\ub354 \ub354\ud50c\ubc31 \uc5ec\uc131\uc804\uc6a9 \ub77c\uc778 \ub098\uc624\uba74 \ubc18\uc751 \uc5c4\uccad\ub0a0 \uac83'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud22c\uc5b4\ubc31 3~6PK \uc5ec\uc131\uc6a9 \ubb38\uc758 \ud558\ub8e8 5\ubc88 \uc774\uc0c1'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\u00b7\ucf54\ud2b8\ub77c\uc774\ud2b8 \ub3c4\ud2b8\ubc31 \ud310\ub9e4\uc728 \uc88b\uc74c'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **FW \uc804\ud658 \uac00\uc18d** \u2014 \uae34\ud314\u00b7\uc544\ub178\ub77d\u00b7\uc790\ucf13 \ud130\uce58\u00b7\ud310\ub9e4 \uc18c\ud3ed \uc0c1\uc2b9. \ub0a0\uc528 \uc120\uc120\ud574\uc9c0\uba70 \uac04\uc808\uae30 \uad6c\ub9e4 \uc2dc\uc791. \ud83d\udcc8 **\uc5d0\uc5b4\ub9ac W \ud551\ud06c \uc2e0\uaddc \uc785\uace0** \u2014 \ud638\ubd88\ud638 \uac08\ub9ac\ub098 \uc678\uad6d\uc778\u00b7\uace0\uc5f0\ub839 \uc5ec\uc131 \uc120\ud638. \ud83d\udcc9 **\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2 WHT\u00b7IVY \ud488\uc808** \u2014 \ub2e4\uc218 \ub9e4\uc7a5 \ub9e4\ucd9c 15~20% \uac10\uc18c. \ud0c0 \uceec\ub7ec \uc804\ud658 \uc5b4\ub824\uc6c0. \ud83d\udcc9 **\ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd** \u2014 \uc785\uc810 \uac10\uc18c\u00b7\uac1d\ub2e8\uac00 \ud558\ub77d \uc9c0\uc18d. \ud83d\udcc9 \uacbd\uc7c1\uc0ac \uacbd\ub7c9\ud328\ub529 \uc120\ucd9c\uc2dc\ub85c FW \uace0\uac1d \uc77c\ubd80 \uc774\ud0c8."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (FW \uc2e0\uc0c1\u00b7\uc790\ucf13 \ubc18\uc751\u00b7\uae34\ubc14\uc9c0 \uc218\uc694)","items":[{"tag":"FW \uc790\ucf13 \ubc18\uc751","text":"\uc804\ubc18 \uae0d\uc815\uc774\ub098 \uad6c\ub9e4 \uc804\ud658 \uc544\uc9c1 \ub354\ub524. \ud604\ub300\ud310\uad50 '\uc544\ub178\ub77d \uc790\ucf13 \ubc18\uc751 \uc88b\uc74c, \ub2e4\uc591\ud55c \uc2dc\ub3c4 \ud638\ud3c9'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ud50c\ub808\uc774\uc2a4\ud14c\uc774\ud2b8 \uc544\ub178\ub77d W \uac00\uc744\uc2e0\uc0c1 \uc911 \ubc18\uc751 \ucd5c\uace0 \u2014 \ubc31 \ub514\ud14c\uc77c \uae30\ub2a5\u00b7\ub514\ud14c\uc77c \ub9cc\uc871\ub3c4 \ub192\uc74c'. \ub86f\ub370\uae30\ud765 '\ucc29\uc6a9\uac10 \ubaa8\ub450 \ub9cc\uc871\ud558\ub098 \uc2dc\uae30\uc0c1 \uad6c\ub9e4 \ubbf8\ub8e8\uac70\ub098 \ubbf8\ub9ac \uad6c\ub9e4\ud558\ub294 \ub290\ub08c'. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\uc6b0\ube10 \uc18c\uc7ac \uc544\ub178\ub77d\u00b7\ubc14\ub78c\ub9c9\uc774 \ud130\uce58 \uc99d\uac00'."},{"tag":"\ub808\ub4dc \uceec\ub7ec \uc555\ub3c4\uc801","text":"**\ub808\ub4dc \uceec\ub7ec \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uc120\ud638** \u2014 AK\uc6d0\uc8fc '\ub808\ub4dc \uceec\ub7ec \uc555\ub3c4\uc801 \ubc18\uc751, \ub77c\ubca4\ub354\u00b7\ud654\uc774\ud2b8\ubcf4\ub2e4 \uc555\ub3c4'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ub0a8\ub140 \uacf5\ud1b5 \ub808\ub4dc \uceec\ub7ec \uc81c\uc77c \uc88b\uc74c'. \ub86f\ub370\uc758\uc655 '\uba54\uc778 \ube44\uc8fc\uc5bc \ub808\ub4dc \uceec\ub7ec \ud130\uce58 \ub9ce\uc74c'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud654\uc774\ud2b8+\ub808\ub4dc \uc870\ud569 \uc120\ud638 (\ub808\ub4dc+\ub808\ub4dc\ubcf4\ub2e4 \ud654\uc774\ud2b8 \ub85c\uace0+\ub808\ub4dc \ubc14\ub514 \uc120\ud638)'."},{"tag":"\uc790\ucf13 \uc18c\ub9e4 \ub514\uc790\uc778 \uc774\uc288","text":"**\uc18c\ub9e4 \ub514\uc790\uc778 \ubd80\ub2f4 \ud53c\ub4dc\ubc31 \ub2e4\uc218** \u2014 \ub86f\ub370\uc778\ucc9c '2TJA81 \uc18c\ub9e4(\uc190\ub4f1 \uae34 \ubd80\ubd84) \ubd80\uc815\uc801 \ubc18\uc751 \ub108\ubb34 \uac15\ud574 \ud310\ub9e4 \ub85c\uc2a4'. \ud604\ub300\uc911\ub3d9 '\uc790\ucf13 \uceec\ub7ec\u00b7\ub450\uaed8 \uc88b\uc9c0\ub9cc \uc18c\ub9e4 \ub514\uc790\uc778 \ubd80\ub2f4\uc2a4\ub7fd\ub2e4\ub294 \uc758\uacac'. \ub86f\ub370\uae30\ud765 '\ub0a8\uc131 \uc790\ucf13 \ub4f1\ud310 \uc808\uac1c \ubd80\ubd84 \ub514\uc790\uc778\uc801 \ubd80\ub2f4 \ud53c\ub4dc\ubc31'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uc544\ub178\ub77d W \ubc11\ub2e8 \uc2a4\ud2b8\ub9c1 \uc18c\uc7ac \uc544\uc27d\ub2e4\ub294 \ud53c\ub4dc\ubc31'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uae34\ubc14\uc9c0 \uc218\uc694 \ud3ed\ubc1c** \u2014 \ub86f\ub370\ucc3d\uc6d0\u00b7\ub86f\ub370\ub3d9\ubd80\uc0b0\u00b7\uc2e0\uc138\uacc4\uad11\uc8fc\u00b7\uc2e0\uc138\uacc4\uc758\uc815\ubd80\u00b7AK\uc6d0\uc8fc\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 \ub4f1 \ub2e4\uc218 '\uae34\ubc14\uc9c0 \uaf2d \ub4e4\uc5b4\uc654\uc73c\uba74', '\uc587\uc740 \uae34\ubc14\uc9c0 \ub2c8\uc988', '\uc5ec\uc131 \uae34\ubc14\uc9c0 \uae30\ud68d \ud544\uc694' \u2192 \uae34\ubc14\uc9c0 \ub77c\uc778\uc5c5 \ud655\ub300 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\ub300\uc804 \uc5ec\uc131 \ud53c\uc2a4\ud14c \uc14b\uc5c5 \ud558\uc758 \ubd80\uc870\ud654** \u2014 '\uc5ec\uc131 \ub77c\uc778 \uc14b\uc5c5 \uad6c\uc131 \uc5b4\ub824\uc6cc \uc138\ud2b8 \ud310\ub9e4 \ud798\ub4e6' \u2192 \ud558\uc758 \uc5f0\uacc4 \uae30\ud68d \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc55e\ud310 \ub85c\uace0 \uc2a4\ud0c0\uc77c \uc791\ub144\uacfc \ud761\uc0ac, \ub4f1\ud310 \ub514\uc790\uc778\ub9cc \uc788\uc5b4 \ucc29\uc6a9 \uc2dc \ud3ec\uc778\ud2b8 \ubc18\uac10'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc790\ucf13 FW\ub77c\uae30\uc5d4 \uc560\ub9e4\ud55c \ub450\uaed8\u00b7\ubd04 \uceec\ub7ec\uac10, \uae34\ubc14\uc9c0 \ubd80\uc871\uc73c\ub85c \uc14b\uc5c5 \uc5f0\uacc4 \uc5b4\ub824\uc6c0'. \ud604\ub300\uc6b8\uc0b0 '\uc587\uace0 \uac00\ubcbc\uc6b4 \ub450\uaed8\ub85c FW \uc2e0\uc0c1 \uc778\uc9c0 \ubabb\ud558\ub294 \uace0\uac1d \u591a'. \ub86f\ub370\ubd80\uc0b0 '\uc587\uc740 \ubc14\ub78c\ub9c9\uc774\u00b7\ub0a8\uc131 \ud654\uc774\ud2b8 \ubc14\uc9c0 \ub354 \ud544\uc694'."},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uc13c\ud140 '\uc5ec\uc131 \ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc587\uc740 \uc2a4\ud53c\ub4dc\ub4dc\ub77c\uc774 \uc18c\uc7ac \uae34\ud314 \ud544\uc694'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ud3f4\ub85c\ud2f0\uc154\uce20 \ub514\uc790\uc778 \ub2e4\uc591\ud654 \ud544\uc694, \uc791\ub144\ubcf4\ub2e4 \ucc3e\ub294 \uace0\uac1d \ub9ce\uc544\uc9d0'. \uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0 '\uae30\ubcf8 \uc5ec\uc131 \uc587\uc740 \uae34\ud314 \ubd80\uc871, \ud480\uc9d1\uc5c5 \ube14\ub799 \ubb38\uc758'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uae30\ubcf8 \uceec\ub7ec \uc587\uc740 \uae34\ud314\u00b7\uae38\uc774\uac10 \uc788\ub294 \ud558\uc758 \ubcf4\uac15 \ud544\uc694'."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2 WHT\u00b7IVY \ud488\uc808 \uc601\ud5a5)","items":[{"tag":"\ud488\uc808 \uc601\ud5a5","text":"**WHT\u00b7IVY \ud488\uc808\ub85c \ub9e4\ucd9c \ud0c0\uaca9** \u2014 \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ub9e4\ucd9c \uac10\uc18c 15% \ubc1c\uc0dd'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 'IVY \ud488\uc808 \ud0c0\uaca9\uc774 \ub354 \ud07c \u2014 \uc804\ud654 \ubb38\uc758 1\uc704'. \ub86f\ub370\ubd80\uc0b0 '\uc7ac\uace0\uc18c\uc9c4 \ud6c4 \uac00\ubc29 \ud310\ub9e4 \ub208\uc5d0 \ub744\uac8c \uc904\uc5b4\ub4e6, \ub2e4\ub978 \uceec\ub7ec\ub85c \uc720\ub3c4\ud574\ub3c4 \uc804\ud658 \uc548 \ub428'. \ub354\ud604\ub300\uc11c\uc6b8 '\ub9e4\uc77c 100\ud300 \uc911 20\ud300\uc774 \ud574\ub2f9 \uac00\ubc29 \ucc3e\uc74c \u2014 \uc8fc\ub85c \uc678\uad6d\uc778'."},{"tag":"\ud0c0 \uceec\ub7ec \uc804\ud658 \ud55c\uacc4","text":"\ub77c\uc774\ud2b8\uadf8\ub808\uc774\ub294 \uc77c\ubd80 \uc804\ud658 \uac00\ub2a5\ud558\ub098 \ud551\ud06c\u00b7\ub808\ub4dc\ub294 \uc804\ud658 \uc5b4\ub824\uc6c0. \ub098\uc778\uc6d0\ud55c\ub0a8 'WHT\u00b7IVY \ucc3e\ub294 \uc678\uad6d\uc778 \ub9ce\uace0 LGR\ub85c \uc2dc\uc120 \ub3cc\ub824\ub3c4 \ubd88\ub9cc\uc871 \uc774\ud0c8'. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\ud0c0 \uceec\ub7ec \uc804\ud658 \uc548 \ub428, \uc77c\ubd80 \ub808\ub4dc \uad00\uc2ec\uc740 \uc788\uc74c'. \ub86f\ub370\ucc3d\uc6d0 '\ub2e4\ub978 \uc0c9\uc0c1 \uc5c6\uc5b4 \uadf8\ub0e5 \ub3cc\uc544\uac00\ub294 \uace0\uac1d'."},{"tag":"\ub300\uccb4 \uc544\uc774\ud15c","text":"\ub4c0\uc624\ud50c\ub7a9 \ubc31\ud329\u00b7\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8\ubc31\u00b7\ucf54\ud2b8\ub77c\uc774\ud2b8 \ub3c4\ud2b8\ubc31\uc73c\ub85c \uc804\ud658 \uc911. \ub86f\ub370\uc778\ucc9c 'TBO83 \uc5ec\uc131 \ubc18\uc751 \uc5c4\uccad \uc88b\uc74c \u2014 \uc204\ub354 \ub354\ud50c\ubc31 \uc5ec\uc131\uc804\uc6a9 \ub77c\uc778 \uc694\uccad'. \uc2e0\uc138\uacc4\uac15\ub0a8 'IVY\u00b7WHT \uc5c6\uc5b4\ub3c4 \ub300\uccb4 \uc0c1\ud488 \u591a\ub77c \ud06c\uac8c \uc9c0\uc7a5 \uc5c6\uc74c \u2014 \ub2e4\uc591\ud55c \uac00\ubc29 \uc0ac\uc774\uc988 \ud310\ub9e4\ub85c \uc5f0\uacb0'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2 WHT\u00b7IVY \ud488\uc808 \uc9c0\uc18d** \u2014 V3 \ucd9c\uc2dc \uc694\uccad \u591a (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5b4\uc11c V3 \uc785\uace0 \ud544\uc694, V2 \uc778\uae30 \ud55c\ubb3c \uac10') \u2192 \uc7ac\uc785\uace0 \ub610\ub294 V3 \ucd9c\uc2dc \uc77c\uc815 \uacf5\uc720 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc9d0\ubc31 L\uc0ac\uc774\uc988 \ubc18\uc751 \uc88b\uc74c, \ub4dc\ub85c\uc6b0 \ud1a0\ud2b8\ubc31\uc740 \uceec\ub7ec(\uc544\uc774\ubcf4\ub9ac\u00b7\ube14\ub8e8) \uc560\ub9e4\ud558\ub2e4\ub294 \ubc18\uc751 \u2014 \uae30\ubcf8 \uceec\ub7ec\uc600\uc73c\uba74 \uc88b\uc558\uc744 \uac83'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ub77c\uc9c0 \uc0ac\uc774\uc988\uc5d0 \ub77c\ucf13 \uc218\ub0a9 \uc548 \ub3fc \uc544\uc26c\uc6c0'. \uc544\uc774\ud30c\ud06c '\ud50c\ub9ac\uc5d0 \ud1a0\ud2b8 \uccb4\uad6c \uc791\uc740 \uace0\uac1d\uc5d0\uac90 \ud06c\ub2e4\ub294 \ud53c\ub4dc\ubc31'."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\uc5d0\uc5b4\ub9ac W \ud551\ud06c \uc785\uace0\u00b7\ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8 \ubc18\uc751)","items":[{"tag":"\uc5d0\uc5b4\ub9ac \ud551\ud06c","text":"**\ud638\ubd88\ud638 \ud655\uc2e4\ud788 \uac08\ub9bc** \u2014 \u597d: \uc678\uad6d\uc778(\ub3d9\ub0a8\uc544\u00b7\ubca0\ud2b8\ub0a8 \ud2b9\ud788)\u00b740\ub300 \uc774\uc0c1\u00b7\ud30c\uc2a4\ud154 \uc120\ud638 \uc5ec\uc131. \ub86f\ub370\ucc3d\uc6d0 '\ubca0\ud2b8\ub0a8 \uace0\uac1d\uc774 \uc785\uace0 \uc804\ubd80\ud130 \ubb38\uc758'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc8fc\ub85c \uc678\uad6d\uc778 \ubc18\uc751 \ub192\uc74c'. \uc2e0\uc138\uacc4\ub300\uc804 '\ud30c\uc2a4\ud154 \uceec\ub7ec \uc758\ub958 \ub9e4\uce58 \uc88b\ub2e4\ub294 \uc758\uacac, \uae30\ub2a5\uc801 \ub9cc\uc871\ub3c4 \ub192\uc74c'. \u4e0d\u597d: \ub108\ubb34 \ud654\ub824\ud558\ub2e4\u00b7\uc720\uc544\ud2f1\ud574\ubcf4\uc778\ub2e4\u00b7\ub9ac\ubcf8 \ubd88\ud638."},{"tag":"\ubcfc\ud2b8\ud504\ub85c \uc2a4\uce74\uc774\ube14\ub8e8","text":"**\uc804\ubc18 \ubc18\uc751 \ubbf8\ubbf8** \u2014 \ub86f\ub370\uc7a0\uc2e4\u00b7\uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \uacf5\ud1b5 '\ubc18\uc751 \uc5c6\uc74c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud558\ub298\uc0c9 \uc758\ub958 \uc5f0\uacc4 \uc5c6\uc5b4 \ucf54\ub514 \uc790\uccb4\uac00 \uc548 \ub428, \ub77c\ubca4\ub354 \uceec\ub7ec \ubb38\uc758'. \ud604\ub300\uc911\ub3d9 '\ud654\uc774\ud2b8\ube14\ub8e8 \uceec\ub7ec\uac00 \ub354 \ubc18\uc751'. \ub2e8, \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\uc5ec\uc131 \uace0\uac1d \uc81c\uc77c \uba3c\uc800 \ud130\uce58\ud558\ub294 \uceec\ub7ec' \uc608\uc678\uc801 \uae0d\uc815."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\uc911\ub3d9 290 \uc0ac\uc774\uc988 \ubd80\uc7ac \uad6c\ub9e4 \uc774\ud0c8** \u2014 '\ub7ec\uc26c\ud22c\uc5b4 290 \uc5c6\uc5b4 \uad6c\ub9e4 \ubabb\ud55c \uacbd\uc6b0' \u2192 \ub300\uc0ac\uc774\uc988 \uc7ac\uace0 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc544\uc774\ud30c\ud06c \ud070 \uc0ac\uc774\uc988(285\u00b7290) \ubd80\uc7ac \uc678\uad6d\uc778 \uc774\ud0c8 \uc9c0\uc18d** \u2192 \uc7ac\uace0 \ud655\uc778 \uc2dc\uae09"},{"tag":"\ub0a8\uc131 \uc2e0\ubc1c","text":"\ud14c\ub9b0\uc774\ub294 \ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4, \uad6c\ub825\uc790\ub294 \ub7ec\uc26c\ud22c\uc5b4\u00b7\uc778\ud2b8\ub9ac\uadf8 \uc120\ud638. \uac00\uaca9 \uc778\uc0c1\uc73c\ub85c \ub7ec\uc26c\ud504\ub85c5 \uad6c\ub9e4 \ub9dd\uc124\uc784 \u2014 \ub86f\ub370\uae30\ud765 '\uc791\ub144 \ub7ec\uc26c\ud504\ub85c4.5 10\ub9cc\uc6d0\ub300 \uc218\uc694 \ub9ce\uc558\uc73c\ub098 5\ub294 \uac00\uaca9 \uc62c\ub77c \ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ub85c \uc774\ub3d9'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ub0a8\uc131 \uc2e0\ubc1c SKU \ubd80\uc871, \ubcfc\ud2b8\ud504\ub85c \ub0a8\uc131 \uceec\ub7ec \ud655\ub300 \ud544\uc694'."},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\ud558\ub298\uc0c9 \uc2e0\ubc1c\uacfc \uc758\ub958 \uc5f0\uacc4 \uc804\ub7b5 \ubd80\uc7ac\ub85c \ud310\ub9e4 \uc804\ud658 \ud0c0\uc774\ubc0d \ubabb \uc7a1\uc74c'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\ubc1c\ubcfc \uc881\ub2e4\ub294 \ud53c\ub4dc\ubc31 \ubc18\ubcf5'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc678\uad6d\uc778\uc740 \uc815\uc0c1 \uc2e0\ubc1c \uad6c\ub9e4, \ub0b4\uad6d\uc778\uc740 \uc0c1\uc124 \uc0c1\ud488 \uc120\ud638 \u2014 \uc544\uc6b8\ub81b \ud2b9\uc131'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \ub0a8\uc131 \uc7ac\uc785\uace0 \ubb38\uc758\u00b7RF\u00b7\ud0c0\uc774\uac70 \ube14\ub808\uc774\ub4dc \uc2e0\uaddc)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4 \ub0a8\uc131 \uc7ac\uc785\uace0","text":"**\ub0a8\uc131 98PRO\u00b7100 \uc7ac\uc785\uace0 \ubb38\uc758 \uc9c0\uc18d** \u2014 \ub86f\ub370\ucc3d\uc6d0 '\ub514\ud30c\uc774\uc5b4 \ud130\uce58\u00b7\ubb38\uc758 \uac00\uc7a5 \ub9ce\uc73c\ub098 \uc7ac\uace0 \uc5c6\uc5b4 \uc774\ud0c8'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ub0a8\uc131 \uc2a4\ud399 \ubb38\uc758 \uafb8\uc900'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc8fc\ub9c8\ub2e4 1~3\ud300 \uc5f0\ub77d \uc9c0\uc18d'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub0a8\uc131\ubd84\ub4e4 \ub108\ubb34 \ub9ce\uc774 \ucc3e\uc74c, \ube68\ub9ac \uc785\uace0 \ud544\uc694'."},{"tag":"RF\u00b7\ud0c0\uc774\uac70 \ube14\ub808\uc774\ub4dc \uc2e0\uaddc","text":"**\ud55c\uc815\ud310 \uc5d0\ub514\uc158 \ub7f0\uce6d \ud6a8\uacfc** \u2014 \ub354\ud604\ub300\uc11c\uc6b8 '\ub7f0\uce6d \uc989\uc2dc \uad6c\ub9e4 \ubc1c\uc0dd'. \uc2e0\uc138\uacc4\ub300\uc804 'RF \ud640\uc624\ud504\ud398\uc784 \uc785\uace0 \ub2f9\uc77c\ubd80\ud130 \ud130\uce58\u00b7\uad00\uc2ec \uc774\uc5b4\uc9d0'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\ud0c0\uc774\uac70 \ube14\ub808\uc774\ub4dc\u00b7\uc0ac\ubca8\ub780\uce74 \ubb38\uc758 \ub9ce\uc74c'. \uc544\uc774\ud30c\ud06c 'Pro Staff\u00b7Tiger Blade \uc678\uad6d\uc778 \ubb38\uc758 \u591a \u2014 \uac00\uae4c\uc6b4 \ub9e4\uc7a5 \uc548\ub0b4 \uc911'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\uc7a0\uc2e4 \ud55c\uc815\ud310 \ub77c\ucf13 \uc5c6\uc5b4 \ud310\ub9e4 \uc5b4\ub824\uc6c0** \u2014 '\uaf64 \ub9ce\uc774 \uc8fc\uc2dc\ub294\ub370 \uc5c6\uc5b4\uc11c \uc5b4\ub824\uc6c0, \ube14\ub808\uc774\ub4dc \uc778\uae30 \uc2a4\ud399 \uc7ac\uace0 \ubd80\uc871' \u2192 \uc7ac\uace0 \ubc30\ubd84 \uac80\ud1a0"},{"tag":"\uc5ec\uc131 \uc2a4\ud399","text":"\uc5ec\uc131 \ub514\ud30c\uc774\uc5b4 \ubc18\uc751 \uc0c1\ub300\uc801 \ud558\ub77d \uc9c0\uc18d \u2014 \uc2e0\uc138\uacc4\uad11\uc8fc '\uc5ec\uc131 \uace0\uac1d \uc0dd\uac01\ubcf4\ub2e4 \ub9ce\uc9c0 \uc54a\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5ec\uc131 270~275g \uc218\uc694 \uc788\uc73c\ub098 265~285g \uc2a4\ud399 \uc2eb\uc5b4\ud558\ub294 \ud0c0\ube0c\ub79c\ub4dc \uc5ec\uc131 \uace0\uac1d \uc774\ud0c8'. LF\uad11\uc591 '\uc5ec\uc131 \uc2a4\ud399 \uad00\uc2ec\ub3c4 \ub0ae\uc74c'."},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uc7a0\uc2e4 '280g \uc218\uc694 \uc810\ucc28 \uc99d\uac00 \u2014 \uc218\uc8fc \uc2dc 260g \ub300\ube44 280g \ube44\uc911 \ud655\ub300 \uac80\ud1a0 \uc81c\uc548'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ub514\ud30c\uc774\uc5b4 \ubb38\uc758 7\uc6d4 \ucd08 \ub300\ube44 \uc904\uc5b4\ub4dc\ub294 \ucd94\uc138 \u2014 \uc18c\ub7c9 \ubb3c\ub7c9\uc73c\ub85c \uad6c\ub9e4 \ub85c\uc2a4\uac00 \uc6d0\uc778'. \uc544\uc774\ud30c\ud06c '\uc5d0\ub514\uc158 \ub77c\uc778\ub9cc \ubcf4\ub7ec \uc624\ub294 \ub0b4\uc678\uad6d\uc778 8~90%'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc548\uc815\uc801 \ud310\ub9e4. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5d0\ubcfc\ub8e8\uc158 \ub300\ub7c9 \uc785\uace0\ub85c \uc120\ubb3c\uc6a9 \ud310\ub9e4 \uae09\uc99d \u2014 \ub9e4\uc7a5 \uc120\ubb3c=\ub18d\uad6c\uacf5 \uc778\uc2dd \uc815\ucc29'. \ucee4\ub125\ud2b8\uccad\uc8fc '\uc5d0\ubcfc\ub8e8\uc158 \uc7ac\uc785\uace0\ub85c \ud310\ub9e4\ub7c9 \uc99d\uac00'. \ub86f\ub370\uc758\uc655 '8~13\uc138 \uc5b4\ub9b0\uc774 3\ud638\u00b76\ud638 \ub18d\uad6c\uacf5 \uad6c\ub9e4 \u591a'. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '10~20\ub300 \ub0a8\uc131\u00b7\ub0a8\uc131 \uc678\uad6d\uc778 \ub18d\uad6c\uacf5 \ud130\uce58 \ub9ce\uc74c'."},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uce90\uc2a4\ud2b8\uc5b4\uc6e8\uc774 \ubc30\uad6c\uacf5 \ubb38\uc758 \u591a'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ubbf8\uc2dd\ucd95\uad6c\uacf5 \ucc3e\ub294 \uace0\uac1d \ub298\uc5b4\ub0a8'. \uc0ac\uc774\uba3c\ud30c\uc8fc '3\ud638\uacf5 \ub2e4\uc591\ud654\u00b7\ud48b\ubcfc \uc2a4\ud0c0\uc77c\u00b7\ub4dc\ub9ac\ube14\ub7ec\uacf5 \uc7ac\uc785\uace0 \uc694\uccad'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\ud3ec\uc9c0\u00b7\ubbf8\ub4dc\ub098\uc787 \ud558\uc774\ube0c\ub9ac\ub4dc \ud615\ud0dc \uc720\ub2ec\ub9ac \uc120\ud638'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub0b4\uc218 \ub18d\uad6c\uacf5 \ubc18\uc751 \uc5ec\uc804, \uc720\ub7fd\uc778 \ubc18\uc751 \uac10\uc18c'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \ud310\ub9e4 \ud604\ud669 (\ucd94\uac00 \ud560\uc778 \uce74\ud14c\uace0\ub9ac\ubcc4 \ud6a8\uacfc \ucc28\uc774)","items":[{"tag":"\uc758\ub958 \ud6a8\uacfc \uae0d\uc815","text":"\uc758\ub958 \ucd94\uac00 \ud560\uc778 \ud6a8\uacfc \uae0d\uc815\uc801 \u2014 LF\uad11\uc591\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc '\uc758\ub958 \ucd94\uac00\ud560\uc778 \uc2dc \uac1d\ub2e8\uac00 \uc0c1\uc2b9'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\uc758\ub958 \uade0\uc77c\uac00 \ubbf8\ub07c\uc0c1\ud488\uc73c\ub85c \uc785\uac1d \uc720\ub3c4 \ud6a8\uacfc'. \ub86f\ub370\uae30\ud765 '\uc7ac\ubc29\ubb38 \uace0\uac1d \uad6c\ub9e4 \ubbf8\ub918\ub358 \uc0c1\ud488 \uad6c\ub9e4 \uc804\ud658'."},{"tag":"\uc2e0\ubc1c\u00b7\uc6a9\ud488 \ud6a8\uacfc \ub0ae\uc74c","text":"\uc2e0\ubc1c\u00b7\uc6a9\ud488 \ucd94\uac00 \ud560\uc778 \ubc18\uc751 \uc758\ub958 \ub300\ube44 \ub0ae\uc74c \u2014 \uc0ac\uc774\uba3c\uc5ec\uc8fc '\uc2e0\ubc1c\u00b7\uc6a9\ud488 \uae08\uc561 \ub9de\ucd94\uae30 \ud798\ub4e4\uc5b4 \uc5ed\ud6a8\uacfc'. \ud604\ub300\ub300\uc804 '\uc2e0\ubc1c\uc740 \ucd94\uac00 \ud560\uc778 \uc2dc \ucd94\uac00 \uad6c\ub9e4\ud558\ub098 \uc758\ub958\ub294 \uadf8\ub807\uc9c0 \uc54a\uc74c'. LF\uad11\uc591 '\uc2e0\ubc1c\uc740 \ucc29\ud654\uac10 \uc6b0\uc120, \uac00\uaca9 \uba54\ub9ac\ud2b8 \ubc18\uc751 \ub0ae\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 \ucd94\uac00 \ud560\uc778 \ud6c4 \ub2e8\uac00 \ud558\ub77d\uc73c\ub85c \uc804\ubc18 \ub9e4\ucd9c \uac10\uc18c** \u2014 '\ud130\uce58\uac10\u00b7\ud310\ub9e4\ub7c9 \uc99d\uac00\ud588\uc9c0\ub9cc \ub2e8\uac00 \ub0ae\uc544\uc838 \ub9e4\ucd9c \ucd94\uc774 \ud558\uac15' \u2192 \ud560\uc778\uc728 \uc870\uc815 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ud604\ub300\ub300\uc804 '\ubd80\uc9c4 \uc0c1\ud488\uc740 \uade0\uc77c\uac00 \uc7ac\uace0 \uc815\ub9ac \ubc29\uc2dd \uc81c\uc548'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '25FW \uc544\uc6b8\ub81b \uc0c1\ud488 \ubd80\uc871 \u2014 \ub354 \ub9ce\uc774 \ub4e4\uc5b4\uc654\uc73c\uba74 \ud310\ub9e4 \uc798 \ub410\uc744 \uac83'. \ub86f\ub370\uc758\uc655 '\ud14c\ub2c8\uc2a4\ud654 \uc0ac\uc774\uc988 \uae68\uc9d0\uc73c\ub85c \ub2c8\uc988 \ucda9\uc871 \uc810\uc810 \uc5b4\ub824\uc6cc\uc9d0'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5 (\ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd\u00b7\uacbd\uc7c1\uc0ac \uacbd\ub7c9\ud328\ub529)","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\ucd94\uc11d \uc5f0\ud734 \uc55e \uc18c\ube44 \uad00\ub9dd \uc2ec\ud654** \u2014 \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc804\uc8fc \ub300\ube44 \uc810\uc810 \uac10\uc18c, \uc6d4\u00b7SS \ub300\ube44 20~30% \uace0\uac1d \uc720\uc785 \uac10\uc18c'. \ub86f\ub370\uc7a0\uc2e4 '\uc804\uc8fc \ub300\ube44 10% \ucd94\uac00 \uac10\uc18c'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uad00\uad11\uac1d\u00b7\ub0b4\uad6d\uc778 \ubaa8\ub450 \ud604\uc800\ud788 \uac10\uc18c, \ube44 \uc601\ud5a5\uc73c\ub85c 30% \uc774\uc0c1 \uac10\uc18c'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uae08\uc8fc \ud589\uc0ac \uc5c6\uc5c8\uc73c\uba74 \ub9e4\ucd9c \uc5b4\ub824\uc6e0\uc744 \uac83'."},{"tag":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","text":"**\uacbd\uc7c1\uc0ac \uacbd\ub7c9\ud328\ub529 \uc120\ucd9c\uc2dc** \u2014 \ub86f\ub370\ucc3d\uc6d0\u00b7\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uacbd\uc7c1\uc0ac \uacbd\ub7c9\ud328\ub529\u00b7\uc544\uc6c3\ub3c4\uc5b4 \uad6c\ub9e4 \uace0\uac1d \u591a'. \ud604\ub300\uc6b8\uc0b0 '\ud0c0 \ube0c\ub79c\ub4dc FW \ub2e4\uc591\ud558\uac8c \uc785\uace0 \u2014 \ud53c\uc2a4\ud14c\u00b7\ubc14\ub78c\ub9c9\uc774\u00b7\ub9e8\ud22c\ub9e8 \uad6c\ub9e4 \uc774\ud0c8'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uacbd\ub7c9\ud328\ub529 \ub9ac\uc624\ub354 \uad6c\ub9e4 \ub9ce\uc74c'."},{"tag":"\uc0c1\uc2b9 \ub9e4\uc7a5","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc804\uc8fc \ub300\ube44 \ud655\uc2e4\ud788 \ub298\uc5b4\ub0a8 \u2014 \ub0a0\uc528 \ud480\ub9ac\uba70 \ud14c\ub2c8\uc2a4 \uc7ac\uac1c \ubaa9\uc801 \ubc29\ubb38 \uc99d\uac00'. \ud604\ub300\ud310\uad50 '\uc804\uc8fc \ub300\ube44 \uc785\uc810 \uc99d\uac00'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\uc810\ud3ec \uc0ac\uc740\ud589\uc0ac\ub85c \uad6c\ub9e4 \uace0\uac1d \uc99d\uac00'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc2e0\uaddc \ud14c\ub9b0\uc774 \ubc29\ubb38\u00b7\ubb38\uc758 \uc18c\ud3ed \uc99d\uac00 \u2014 9\uc6d4 \ub0a0\uc528 \ud480\ub9ac\uba74 \uae30\ub300'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uacbd\uc7c1\uc0ac \uacbd\ub7c9\ud328\ub529\u00b7\uc544\uc6c3\ub3c4\uc5b4 \uc120\ucd9c\uc2dc\ub85c \uac00\uc744 \uc804\ud658 \uace0\uac1d \uc774\ud0c8. AK\uc6d0\uc8fc '\uc9c0\ubc29 \ud2b9\uc131\uc0c1 \uc798 \uc54c\ub824\uc9c4 \ube0c\ub79c\ub4dc+\ud560\uc778 \ud504\ub85c\ubaa8\uc158 \uc704\uc8fc \uad6c\ub9e4'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ubcc4\ub9c8\ub2f9 \uacf5\uc0ac\ub85c \uc720\ub3d9\uc778\uad6c \uac10\uc18c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uacbd\uc7c1\uc0ac\ub3c4 \uc790\ucf13\u00b7\uc2a4\ucee4\ud2b8 \uc14b\uc5c5 \ud310\ub9e4 \uc798 \ub41c\ub2e4\uace0 \ud568 \u2014 \ub7ec\ub2dd\ud654 \ud310\ub9e4 \ub9ce\ub2e4\ub294 \uc815\ubcf4 \uc218\uc9d1'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uae34\ubc14\uc9c0 \uc218\uc694 \u2014 '\uae34\ubc14\uc9c0 \uaf2d \ud544\uc694' \ub2e4\uc218 \uc5b8\uae09","\ub9e4\uc7a5":"\uc804 \ub9e4\uc7a5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uae34\ubc14\uc9c0 \ub77c\uc778\uc5c5 \ud655\ub300 \uae30\ud68d \uc2dc\uae09"},{"\ua
