0\ub9e4 \ube44\uc911 \ucc98\uc74c\uc73c\ub85c \uadfc\uc18c\ud558\uac8c \uc81c\uce68'. \ud30c\uc774\uc36c \ub77c\ucf13 \uc0ac\uc804 \ubb38\uc758 \uae09\uc99d \u2014 SNS\u00b7\ube14\ub85c\uadf8 \ud1b5\ud574 \ub0b4\uad6d\uc778 \uc911\uc2ec \ud655\uc0b0."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uc714\ube14\ub358 \ud6a8\uacfc** \u2014 \uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc\u00b7\uc120\uc14b\ub9e4\uce58 \ud310\ub9e4 \uc804\uc8fc \ub300\ube44 \ud655\uc5f0\ud788 \uc0c1\uc2b9. \ud83d\udcc8 **\ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec\u00b7\uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec \uc785\uace0** \u2014 \uc989\uac01 \ubc18\uc751. \ud83d\udcc9 **\ube44\uc218\uae30 \uc870\uae30 \uc9c4\uc785 \uc2ec\ud654** \u2014 '\uc791\ub144\ubcf4\ub2e4 \ud55c \ub2ec \ube60\ub984' (LF\uad11\uc591), \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub9e4\uc7a5 \uc720\uc785 \uace0\uac1d \uac70\uc758 \uc808\ubc18 \uc218\uc900 \uac10\uc18c'."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc2dc\uc5b4\uc544\uc774\uc2a4\u00b7\uba5c\ub85c\uc6b0 3\uac15 \uad6c\ub3c4 \uc548\ucc29. **FW \uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uc555\ub3c4\uc801 1\uc704. \uc714\ube14\ub358 \uc601\ud5a5\uc73c\ub85c **\uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc \ub77c\uc778 \ud310\ub9e4 \uae09\ub4f1** (\uc2e0\uc138\uacc4\uac15\ub0a8 '\ud655\ud655 \uc62c\ub77c\uc654\ub2e4'). \ub0a8\ub140\uacf5\uc6a9 \ucee4\ud50c \ucf54\ub514 \uad6c\ub9e4 \uc99d\uac00 (\ub86f\ub370\ubd80\uc0b0\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131). \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub0a8\uc131 \ubc18\ubc14\uc9c0 2~3\uac1c \ub2e4\ub7c9 \uad6c\ub9e4 \uae09\uc99d'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \uc758\ub958 \uc7ac\uace0 \uc804\ubb34** \u2014 '\uc785\uace0 \uc0c1\ud488 \uc808\uc2e4\ud558\uac8c \ud544\uc694, \uc7ac\uace0 \uc5c6\uc5b4 \uace0\uac1d \uc751\ub300 \ubd88\uac00' \u2192 \uae34\uae09 \ubc30\ubd84 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \ud4e8\uc5b4\ub4dc\ub77c\uc774 L \uc0ac\uc774\uc988 \uc7ac\uace0 \ubd80\uc871** \u2014 '\uae30\ud68c \ub85c\uc2a4 \ub9ce\uc544 \uc544\uc26c\uc6c0' \u2192 \uc7ac\uace0 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ucd08\uacbd\ub7c9 \uae34\ud314 \uc790\ucf13\u00b7\ub0c9\uac10 \ub8e8\uc988\ud54f \uae34\ud314 \uc774\ub108 \ubbf8\ucd9c\uc2dc** (\uc2e0\uc138\uacc4\ub300\uc804, \uc218\uc8fc \uc5f0\uc18d \ubc18\ubcf5) \u2014 \ucc28\uae30 \uc2dc\uc98c \uae30\ud68d \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"**\uc5ec\uc131 \uae34\uae30\uc7a5 \ubc18\ubc14\uc9c0\u00b7\uae34\ubc14\uc9c0 \uc218\uc694 \uc9c0\uc18d** (AK\uc6d0\uc8fc\u00b7\uc2e0\uc138\uacc4\uc758\uc815\ubd80) \u2014 AK\uc6d0\uc8fc '40~50\ub300 \uc8fc \uace0\uac1d\uce35, \uae30\uc7a5 \uc9e7\uc544 \uc2a4\ucee4\ud2b8\u00b7\uc1fc\uce20 \ud310\ub9e4 \uc5b4\ub824\uc6c0'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uae34 \uae30\uc7a5 \ubc18\ubc14\uc9c0 \ubc0f \uc5ec\uc131\uc6a9 \uacf5\uc6a9 \uadf8\ub798\ud53d \ub77c\uc778 \uc694\uccad' \u2192 \ucc28\uae30 \uae30\ud68d \ubc18\uc601 \ud544\uc694"},{"tag":"\uc774\uc288","text":"**\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 \ud654\uc774\ud2b8 \uc2a4\ucee4\ud2b8 \ubc34\ub4dc \uc5c6\ub294 \ubc84\uc804 \uc218\uc694** \u2014 '\ubc34\ub4dc \uc788\ub294 \ud654\uc774\ud2b8 \uce58\ub9c8 \ube44\uc120\ud638 \uace0\uac1d \u591a' \u2192 \uae30\ud68d \ucc38\uace0"},{"tag":"\uc774\uc288","text":"**\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \uc6d0\ud53c\uc2a4 \uad6c\ub9e4 \uc804\ud658 \uc800\uc870** \u2014 '\uc0ac\uc774\uc988 \uc560\ub9e4\u00b7\ub178\ucd9c \ub9ce\uc544 \uad6c\ub9e4 \ub9dd\uc124\uc784, \uc2dc\uc5b4\uc11c\ucee4 \ubcfc\ub808\ub85c \uac19\uc740 \uac89\uc637 \uc5f0\uacc4 \uc544\uc774\ud15c \uc81c\uc548'. **\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc18c\uc7ac \uc5f0\ub839 \ubd88\uc77c\uce58** \u2014 '\uc18c\uc7ac \ud130\uce58\ub294 \uc80a\uc740\uce35\uc778\ub370 \ub514\uc790\uc778 \uc5f0\ub839\ub300\uac00 \ub192\uc544 \ubd88\uc77c\uce58'"},{"tag":"\uc774\uc288","text":"**\ucee4\ub125\ud2b8\uccad\uc8fc \ud551\ud06c \ub77c\uc778 \ubd80\ub2f4\uac10** \u2014 '\ud551\ud06c \uc2a4\ud399\ud2b8\ub7fc \ub113\uc5b4\uc84c\uc73c\ub098 \uc2e4\uc81c \uad6c\ub9e4\uae4c\uc9c0 \ubd80\ub2f4 \ub290\ub07c\ub294 \uace0\uac1d \u591a'. **\uc0ac\uc774\uba3c\ubd80\uc0b0 \uac00\uc744 FW \uc0c1\ud488 \uc785\uace0 \ubb38\uc758 \uc99d\uac00** \u2014 '\uae30\ub2e4\ub9ac\ub294 \ubd84\ub4e4 \ub9ce\uc74c' \u2192 \uc785\uace0 \uc77c\uc815 \uc548\ub0b4 \ud544\uc694"},{"tag":"\uc774\uc288","text":"**\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \ube60\ub978 FW \uc2e0\uc0c1 \ub9ac\uc624\ub354 \uc694\uccad** \u2014 '\ube60\ub978 \ub9ac\uc624\ub354\ub85c \uae30\ub2e4\ub9bc \uc5c6\uc774 \ud310\ub9e4 \uac00\ub2a5\ud558\ub3c4\ub85d'. **\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765 \uc18c\ube44\uc2ec\ub9ac \uc704\ucd95** \u2014 '\uc0c1\uc124\u00b7\uc815\uc0c1 \uad6c\ub9e4 \uace0\uac1d \ubaa8\ub450 \uac1d\ub2e8\uac00 \ub0ae\uc544\uc9c0\ub294 \uc911'"},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uac15\ub0a8: '\uc5d8\ub9ac\ud2b8 \ub77c\uc778 4\uacc4\uc808 \uc2e0\uc0c1 \uc9c0\uc18d \ucd9c\uc2dc \uc694\uccad', 'FW\uc5d0\ub3c4 \uadf8\ub79c\ub4dc\uc2ac\ub7a8 \uce74\ud14c\uace0\ub9ac \ub514\uc790\uc778 \uad6c\uc131 \uc81c\uc548 (\uc714\ube14\ub358 \ud6a8\uacfc \uadfc\uac70)'. \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0: '\uc5ec\uc131 \uae34 \uae30\uc7a5 \uc758\ub958 \uc885\ub958 \ub298\uc5b4\ub098\uba70 \ubc18\uc751 \uc88b\uc558\uc74c'. **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758** \u2192 FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \uc548\ub0b4 \ud544\uc694"},{"tag":"\uc548\ub0b4\ud544\uc694","text":"\ud83d\udccc **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758 \ub9e4\uc7a5** \u2014 FW \uc2e0\uc0c1\uc5d0 S\u00b7M \uc0ac\uc774\uc988 \ud655\ub300 \ubc18\uc601 \uc608\uc815. \ub9e4\uc7a5 \ubb38\uc758 \uc2dc \uc548\ub0b4 \ud544\uc694 (\ub9ac\uc624\ub354 \ubd88\uac00)"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751)","items":[{"tag":"\uc2e0\uaddc\uceec\ub7ec \ubc18\uc751","text":"\ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec(LGR\u00b7PNK\u00b7RED) \uc785\uace0 \uc989\uac01 \ubc18\uc751. **LGR(\ub77c\uc774\ud2b8\uadf8\ub808\uc774)**: \uc804 \ub9e4\uc7a5 1\uc704 \u2014 '\ubb34\ub09c\ud558\uace0 \uce90\uc8fc\uc5bc \ucf54\ub514 \uc6a9\uc774', \ub0a8\uc131\u00b7\ub0b4\uad6d\uc778 \uc120\ud638. \uc2e0\uc138\uacc4\uac15\ub0a8 'LGR+PNK\uac00 WHT \ud310\ub9e4 \ube44\uc911 \ucc98\uc74c\uc73c\ub85c \uadfc\uc18c\ud558\uac8c \uc81c\uce68'. \uc678\uad6d\uc778\uc5d0\uac8c '\uc2e0\uc0c1\ud488'\uc73c\ub85c \uc18c\uac1c \uc2dc \uc989\uc2dc \uad6c\ub9e4 \uacb0\uc815 \uc0ac\ub840 \u591a."},{"tag":"\uc2e0\uaddc\uceec\ub7ec \ubc18\uc751","text":"**PNK(\ud551\ud06c)**: 2030 \uc5ec\uc131\u00b7\uc678\uad6d\uc778(\uc911\uad6d\u00b7\ub3d9\ub0a8\uc544) \uc120\ud638, \ud654\uc0ac\ud55c \uceec\ub7ec\uac10 \uae0d\uc815. \uc0ac\uc774\uba3c\ud30c\uc8fc\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ud130\uce58\ub294 \uc88b\uc73c\ub098 \ubc1d\uc740 \uceec\ub7ec \uad00\ub9ac \uac71\uc815\uc73c\ub85c \uad6c\ub9e4 \ub9dd\uc124\uc784'. **RED(\ub808\ub4dc)**: \uc804\ubc18 \ubc18\uc751 \ubbf8\ubbf8, \ud638\ubd88\ud638 \uac15\ud568. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uac00\uc7a5 \ubd88\ud638 \uc2ec\ud568'. \ub2e8, \ub86f\ub370\uc7a0\uc2e4\ub9cc \uc608\uc678\uc801\uc73c\ub85c '\ub808\ub4dc \ud130\uce58\u00b7\ubc18\uc751 \uac00\uc7a5 \ub9ce\uc558\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 LGR\u00b7PNK \uc7ac\uace0 \ube60\ub978 \uc18c\uc9c4 \uc6b0\ub824** (\uc2e0\uc138\uacc4\uac15\ub0a8) \u2014 '\uc774\ubc88 \uc8fc \ub9e4\ucd9c\uc758 \ud070 \uc5ed\ud560, \uc9c0\uc18d \uc7ac\uace0 \uad00\ub9ac \ud544\uc694' \u2192 \uc7ac\uace0 \ud604\ud669 \ubaa8\ub2c8\ud130\ub9c1"},{"tag":"\uc774\uc288","text":"**AK\uc6d0\uc8fc \ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec \uad00\uc2ec\ub3c4 \ubbf8\ubbf8** \u2014 \uc678\uad6d\uc778 \uc5c6\ub294 \ub9e4\uc7a5 \ud2b9\uc131, \uae30\uc874 \uceec\ub7ec \uc704\uc8fc \uad6c\ub9e4. **\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751 \uc544\uc9c1 \ubbf8\uc57d** \u2014 '\uac00\ubc29 \ud310\ub9e4\ub294 \ub9ce\uc73c\ub098 \uc2e0\uaddc \uceec\ub7ec\ub294 \uc870\uae08 \ub354 \uc9c0\ucf1c\ubd10\uc57c'"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 \uc5d0\uc5b4 YEL\u00b7GBL \uc7ac\uace0 \ubd80\uc871 \uc9c0\uc18d** (\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ud604\ub300\ud310\uad50) \u2014 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubaa8\uc790\u00b7\uc591\ub9d0 \uae30\ubcf8 \uc7ac\uace0 \ube60\ub978 \uc18c\uc9c4** (\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) \u2014 '\uc778\uae30 \ud488\ubaa9 \uae30\ubcf8 \uc2a4\ud0c0\uc77c \uc7ac\uace0 \ubd80\uc871\uc73c\ub85c \ud310\ub9e4 \uc544\uc26c\uc6c0' \u2192 \uc7ac\uace0 \ubcf4\ucda9"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubca0\uc77c \ub4dc\ub808\uc774\ud504 \ucea1(\ubca0\uc77c\ucea1) \ub9ac\uc624\ub354 \uc785\uace0 \uc77c\uc815 \ubb38\uc758** (\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 \ubc18\ubcf5 \uc5b8\uae09) \u2014 \uc785\uace0 \uc77c\uc815 \ud655\uc778 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ud22c\uc5b4\ubc31\u00b7\uc5ec\uc131 \uc18c\ud615 \ud22c\uc5b4\ubc31 \ubb38\uc758 \uc99d\uac00 (\ub098\uc778\uc6d0\ud55c\ub0a8) '\uc62c\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ud310\ub9e4 \ub9ce\uace0 \uc2ec\ud50c\ud55c \uc5ec\uc131\uc6a9 \ud22c\uc5b4\ubc31 \ubb38\uc758 \ub298\uc5b4' \u2192 \uae30\ud68d \ucc38\uace0"}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751)","items":[{"tag":"\uc5d0\uc5b4\ub9acW \uc2e0\uaddc\uceec\ub7ec","text":"\uc5d0\uc5b4\ub9ac W \ud654\uc774\ud2b8 \ub9ac\uc624\ub354 + \uc2e0\uaddc \uceec\ub7ec(\uc610\ub85c\uc6b0\u00b7\ubc84\uac74\ub514 \ub4f1) \uc785\uace0 \ubc18\uc751. 20~30\ub300 \uc5ec\uc131 \uc911\uc2ec \uae0d\uc815 \ubc18\uc751. \uc610\ub85c\uc6b0 > \ubc84\uac74\ub514 \uc21c. \ub86f\ub370\uc778\ucc9c '\ub808\ubaac\uc0c9 \uc720\ud589'. \uc678\uad6d\uc778(\uc911\uad6d\u00b7\ub3d9\ub0a8\uc544) \ubc18\uc751 \ud2b9\ud788 \uc88b\uc74c. \ud654\uc774\ud2b8 \ub9ac\uc624\ub354 \uafb8\uc900\ud55c \uc778\uae30 \uc720\uc9c0."},{"tag":"\ub9e4\uc7a5\ubcc4 \ubc18\uc751","text":"\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0: '\ud654\uc774\ud2b8 \ub9ac\uc624\ub354 \uace0\uac1d\uc774 \uc2e0\uaddc \uceec\ub7ec\ub85c \ubcc0\uacbd \u591a, 30~40\ub300 \uc8fc \uad6c\ub9e4\uce35'. \ud604\ub300\ud310\uad50: '\uc774\ubc88 \uc8fc \uc2e0\ubc1c \ud310\ub9e4 \uc911 \uc5d0\uc5b4\ub9ac 1\uc704, 30\ub300 \uad6c\ub9e4 \uc8fc\ub3c4'. \ub86f\ub370\uc7a0\uc2e4: '\uc2e0\uaddc \uceec\ub7ec \uc785\uace0\ub85c \ubc18\uc751 \uc88b\uc74c, \ubcfc\ud2b8\ud504\ub85c\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ubcf4\ub2e4\uac00 \uc5d0\uc5b4\ub9ac\ub85c \uc804\ud658 \uad6c\ub9e4 \u591a'. \uc2e0\uc138\uacc4\uac15\ub0a8: '\ud654\uc774\ud2b8 \uafb8\uc900 \ud310\ub9e4, \uc2e0\uaddc \uceec\ub7ec\ub294 \ub9e4\uce6d \uc758\ub958 \ubd80\uc7ac\ub85c \uc989\uac01 \ud310\ub9e4 \uc804\ud658 \ub0ae\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \uc5d0\uc5b4\ub9ac \ud37c\ud50c \uc7ac\uc785\uace0 \uae30\ub300 \uace0\uac1d \u591a** \u2014 '\ud654\uc774\ud2b8\u00b7\uc2e0\uaddc \uceec\ub7ec\ubcf4\ub2e4 \ud37c\ud50c \uc7ac\uc785\uace0 \ub354 \uae30\ub300' \u2192 \uc785\uace0 \uc5ec\ubd80 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2e0\uc138\uacc4\uac15\ub0a8 \uc5d0\uc5b4\ub9ac \uc2e0\uaddc \uceec\ub7ec \ub9e4\uce6d \uc758\ub958 \ubd80\uc7ac** \u2014 '\uc758\ub958 \uc2e0\uc0c1 \ube60\ub978 \uc785\uace0\uac00 \uc5d0\uc5b4\ub9ac \ud310\ub9e4 \uc804\ud658\uc728 \ub192\uc774\ub294 \ud575\uc2ec' \u2192 \uc758\ub958 \uc785\uace0 \uc5f0\uacc4 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\ud30c\uc8fc \ubcfc\ud2b8\ud504\ub85c 230mm \uc0ac\uc774\uc988 \ubd80\uc7ac** \u2014 '\uadf8\ub77c\ub370\uc774\uc158 \uceec\ub7ec \uc791\uc740 \uc0ac\uc774\uc988 \ucc3e\ub294 \uace0\uac1d \ub9ce\uc740\ub370 \uc5c6\uc5b4 \uc544\uc26c\uc6c0' \u2192 \uc7ac\uace0 \ubcf4\ucda9"},{"tag":"\uc774\uc288","text":"\uc544\uc774\ud30c\ud06c: '\uac00\uaca9 \uc800\ud56d\uc73c\ub85c \uc778\ud2b8\ub9ac\uadf8 \uc804\ud658 \ubc1c\uc0dd'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80: '\uc5d0\uc5b4\ubca8 \uad6c\ub9e4\uc728 \uac10\uc18c \ucd94\uc138 \u2014 \uba87 \uc8fc \uc804\ubcf4\ub2e4 \ud655\uc5f0\ud788 \ub0ae\uc544\uc9d0' \u2192 \ucd94\uc774 \ubaa8\ub2c8\ud130\ub9c1. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0: '\uc2e0\uaddc \ubcfc\ud2b8\ud504\ub85c \uc5ec\uc131 225 \uc0ac\uc774\uc988 \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\uc774\uc288","text":"**\uc218\uc785 \uc2e0\ubc1c \uc0ac\uc774\uc988 \ubd80\uc871 \uc678\uad6d\uc778 \uc774\ud0c8** (\uc2e0\uc138\uacc4\uc758\uc815\ubd80 \ubc18\ubcf5) \u2014 '\uc678\uad6d\uc778\uc740 \uc0ac\uc774\uc988 \uc5c6\uc73c\uba74 \uc8fc\ubb38 \uc548 \ud558\uace0 \uc989\uc2dc \uc774\ud0c8, 280\u00b7285\u00b7290\u00b7295 \ubd80\uc7ac \uc2ec\uac01' \u2192 \uc6b0\uc120 \ud655\ubcf4 \ud544\uc694"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ube14\ub808\uc774\ub4dc V10 + \ub864\ub791\uac00\ub85c\uc2a4 \ud074\ub798\uc2dc \ud22c\ud0d1 \uc720\uc9c0. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc714\ube14\ub358\uc73c\ub85c \uc624\ud508 \uc774\ub798 \uc5d0\ub514\uc158 \ub77c\ucf13 \ucd5c\uace0 \ud310\ub9e4 \uc8fc\uac04'. V9\u2192V10 \uad50\uccb4 \uc218\uc694 \uc911\uc0c1\uae09\uc790 \uc911\uc2ec \uc9c0\uc18d. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 'BNA \uac19\uc740 \ud55c\uc815\ud310 \uc608\uc05c \ub77c\ucf13\uc774 \uc5ec\uc131 \ub9c8\uc74c\uc5d0 \ubd88 \uc9c0\ud54c, \ucd9c\uc2dc \uc2dc \uc5ec\uc131 \uadf8\ub7a8\uc218\uae4c\uc9c0 \ub300\ub7c9 \uc218\uc785 \ud544\uc694'."},{"tag":"\ud30c\uc774\uc36c \ubb38\uc758","text":"\ud83d\udccc **\ud30c\uc774\uc36c \ub77c\ucf13 \uc0ac\uc804 \ubb38\uc758 \uae09\uc99d** \u2014 SNS\u00b7\ube14\ub85c\uadf8 \ud1b5\ud574 \ub0b4\uad6d\uc778 \uc911\uc2ec \ud655\uc0b0. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\ubb38\uc758 \uae09\uc99d', \ucee4\ub125\ud2b8\uccad\uc8fc '\uc124\uba85 \ub4dc\ub9ac\uba70 \uc7a0\uc7ac \uace0\uac1d \ud655\ubcf4 \uc911', \ub354\ud604\ub300\uc11c\uc6b8 'SNS\u00b7\ube14\ub85c\uadf8 \ud1b5\ud574 \ub0b4\uad6d\uc778 \uc911\uc2ec \ud655\uc0b0' \u2192 **\ucd9c\uc2dc \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720 \ud544\uc694**"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \ub77c\ucf13 \uc7ac\uace0 \uc804\ubb34** \u2014 '\ube14\ub808\uc774\ub4dc V9\uc774\ub77c\ub3c4 \uc788\uc73c\uba74 \ud310\ub9e4\uc5d0 \ud070 \ub3c4\uc6c0' \u2192 \uc785\uace0 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub864\ub791\uac00\ub85c\uc2a4 \ud074\ub798\uc2dc \uc7ac\uace0 \uc18c\uc9c4 \uc784\ubc15** (\ub86f\ub370\ucc3d\uc6d0\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8) \u2014 \ub86f\ub370\ucc3d\uc6d0 '\ucc3e\ub294 \uc5ec\uc131 \uace0\uac1d \ub9ce\uc740\ub370 \uc7ac\uace0 \uc5c6\uc74c', \ub098\uc778\uc6d0\ud55c\ub0a8 '\ucd94\uac00 \ubb3c\ub7c9 \ud655\ubcf4 \ud544\uc694' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **BNA 265g \ubbf8\ucd9c\uc2dc \uc774\ud0c8** (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591) \u2014 '\uc5ec\uc131\uc6a9 \ub514\uc790\uc778\uc778\ub370 265g \uc5c6\uc5b4 \uc774\ud0c8 \uace0\uac1d \ubc1c\uc0dd' \u2192 \uae30\ud68d \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\uc758\uc655 \uc0c1\uc124 \ub77c\ucf13 \ucd94\uac00 \uc785\uace0 \ubb38\uc758 \uc99d\uac00** \u2014 '\uc0c1\uc124 \ub77c\ucf13 \uc5b8\uc81c \ucd94\uac00 \uc785\uace0\ub418\ub0d0 \ubb38\uc758' \u2192 \uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"tag":"\uc774\uc288","text":"**\uac00\uaca9 \uc800\ud56d \uac15\ud654** (\uc2e0\uc138\uacc4\ub300\uc804\u00b7AK\uc6d0\uc8fc) \u2014 '\ud640\uc138\uc77c\u00b7\uc778\ud130\ub137 \ube44\uad50 \ud6c4 \uc774\ud0c8 \uace0\uac1d, \ud560\uc778 \uae30\ub300 \uace0\uac1d \uc99d\uac00'. \uc544\uc774\ud30c\ud06c '\ub864\ub791\uac00\ub85c\uc2a4 100L \ub9ac\uc624\ub354 \ubb38\uc758 2~3\uac74'. **\uc5ec\uc131 \uc678\uad6d\uc778 \ub77c\ucf13 \uad6c\ub9e4 \ubb38\uc758** \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc678\uad6d\uc778 \ud14c\ub2c8\uc2a4 \uc2e0\uaddc \uc720\uc785 \uc99d\uac00 \uc911'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uc7ac\uc785\uace0 \ud6a8\uacfc\ub85c \ud310\ub9e4 \uc18c\ud3ed \uc0c1\uc2b9. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc7ac\uace0\ub9cc \uc788\uc73c\uba74 \ubb34\uc870\uac74 \uad6c\ub9e4\ud558\ub294 \ucda9\uc131 \uace0\uac1d \u591a, \uceec\ub7ec\ubcfc\u00b7\uc5d0\ubcf4 NXT \ud504\ub9ac\ubbf8\uc5c4 \ubaa8\ub378 \ud310\ub9e4 \uac15\uc138'. \ub808\ud2b8\ub85c\ubcfc \uc218\uc694 \ud655\uc778 (\ub86f\ub370\uc758\uc655)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \uc88c\ud22c \uae00\ub7ec\ube0c \ubb38\uc758 \u591a** \u2014 \uc7ac\uace0 \ud604\ud669 \ud655\uc778 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 \uc62c\ud300 \uc7ac\uace0 \ubd80\uc871** \u2014 '\uc62c\ud300 \uc880 \ubd80\uc871\ud569\ub2c8\ub2e4' \u2192 \uc7ac\uace0 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc7ac\uace0 \uc18c\uc9c4 \uc18d\ub3c4 \ube60\ub984** (\ub2e4\uc218 \ub9e4\uc7a5) \u2014 \uc7ac\uc785\uace0\ub410\uc73c\ub098 \ube60\ub974\uac8c \uc18c\uc9c4 \uc911 \u2192 \uc7ac\uace0 \ud604\ud669 \uc9c0\uc18d \ubaa8\ub2c8\ud130\ub9c1"},{"tag":"\uc774\uc288","text":"**\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 6\ud638 \ub18d\uad6c\uacf5 \uc218\uc694** \u2014 '\uc608\uc05c 6\ud638\uacf5 \ucc3e\ub294 \uace0\uac1d \u591a' \u2192 \uae30\ud68d \ucc38\uace0. **\ub86f\ub370\uc778\ucc9c \ud3ec\uc9c0 \ube0c\ub77c\uc6b4 \uceec\ub7ec \uc218\uc694** \u2014 '\uc6b4\uc601 \ub2f9\uc2dc \ubc18\uc751 \uc88b\uc558\uc74c, \ubb3c\ub7c9 \uc788\uc73c\uba74 \uc6b4\uc601 \ud76c\ub9dd' \u2192 \uc7ac\uace0 \ud655\uc778. **\ub86f\ub370\uc758\uc655 \ubcfc\ud0c0\uc6cc \uad00\uc2ec\ub3c4 \ub192\uc73c\ub098 \ud310\ub9e4 \uc804\ud658 \uc800\uc870** \u2014 '\ubcfc\ud0c0\uc6cc \ud130\uce58\ub9cc \uc788\uace0 \uc2e4 \uad6c\ub9e4 \uc548 \uc774\ub8e8\uc5b4\uc9d0'."},{"tag":"\uc774\uc288","text":"\uc0ac\uc774\uba3c\ud30c\uc8fc '\ubb34\uc2e0\uc0ac \uc785\uc810 \ud6c4 \uc911\uace0\ub4f1\ud559\uc0dd \uc720\uc785 \uc99d\uac00, \uc885\ub958 \ub9ce\uc9c0 \uc54a\ub2e4\ub294 \uc544\uc26c\uc6c0 \ubc18\ubcf5, SKU \ub2e4\uc591\ud654 \ud544\uc694'. \uc628\ub77c\uc778 \uac00\uaca9 \ube44\uad50 \uace0\uac1d \uc99d\uac00 \ucd94\uc138 (\uc0ac\uc774\uba3c\ud30c\uc8fc\u00b7\uc0ac\uc774\uba3c\ubd80\uc0b0)."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\ube44\uc218\uae30 \uc870\uae30 \uc9c4\uc785 \uc2ec\ud654** \u2014 LF\uad11\uc591 '\uc791\ub144\ubcf4\ub2e4 \ud55c \ub2ec \ube60\ub984', \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub9e4\uc7a5 \uc720\uc785 \uace0\uac1d \uac70\uc758 \uc808\ubc18 \uc218\uc900 \uac10\uc18c'. \ud604\ub300\ub300\uc804 30% \uc774\uc0c1 \uac10\uc18c. \uc2e0\uc138\uacc4\ub300\uc804 '\ub9e4\uc7a5 \uc55e \uc81d\uc2dc\ubbf9\uc2a4 70% \ub300\ud589\uc0ac\uc7a5\uc73c\ub85c \uc785\uc810 \uac10\uc18c\u00b7\uac00\uaca9 \uc800\ud56d \uc2ec\ud654'. \ub86f\ub370\uc778\ucc9c '15% \uc774\uc0c1 \uac10\uc18c, 2\uce35 MUJI\u00b7\uc62c\ub9ac\ube0c\uc601 \uc624\ud508 \uc601\ud5a5'."},{"tag":"\ub3d9\ud5a5","text":"\ud83d\udccc **\uc0c1\uc2b9 \ub9e4\uc7a5**: \ub86f\ub370\ubd80\uc0b0 '\uc9c0\ud558 \ud31d\uc5c5 \ud589\uc0ac\ub85c \uc77c\ubc18 \uace0\uac1d \uc720\uc785 \uae09\uc99d, \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uc758\ub958 \uc77c\ubc18 \uace0\uac1d \ubc18\uc751 \uc88b\uc544 \ub9e4\ucd9c \ub3c4\uc6c0'. \ub354\ud604\ub300\uc11c\uc6b8 '\ud1a0\uc774\uc2a4\ud1a0\ub9ac\u00b7\ubaac\uce58\uce58 \ud31d\uc5c5\uc73c\ub85c \uc678\uad6d\uc778 \uae09\uc99d'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uae30\uc874 \uace0\uac1d \uc7ac\ubc29\ubb38 \ub192\uc544 \ub9e4\ucd9c \uc548\uc815\uc801'. \ud604\ub300\ubb34\uc5ed \ub0b4\uad6d\uc778 20%:\uc678\uad6d\uc778 80% \uc5ed\uc804."},{"tag":"\ub3d9\ud5a5","text":"\uc678\uad6d\uc778: \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc911\uad6d\u00b7\uc77c\ubcf8\u00b7\ud64d\ucf69\u00b7\ub300\ub9cc \uc99d\uac00, \ub3d9\ub0a8\uc544\ub294 \uc791\ub144 \uc218\uc900 \uc720\uc9c0'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\ub0b4\uad6d\uc778 20%:\uc678\uad6d\uc778 80%'. \ub098\uc778\uc6d0\ud55c\ub0a8 '\uc785\uc810\uc740 \uc804\uc8fc\uc640 \uc720\uc0ac\ud558\ub098 \uad6c\ub9e4 \uc804\ud658\uc728 \uac10\uc18c'. AK\uc6d0\uc8fc '\ub298 \uac00\ub358 \ube0c\ub79c\ub4dc\ub9cc \uac00\ub294 \uace0\ucc29\ud654\ub41c \uc6c0\uc9c1\uc784\uc73c\ub85c \ub9e4\uc7a5 \uc720\uc785 \ub5a8\uc5b4\uc9d0'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"**HDEX \ubcf4\uc774\ub4dc \ud589\uc0ac 60%** (2\ub9cc\uc6d0\ub300 \ubc18\ud314 \uc8fc\ub825) / **\ub974\uaf2c\ub044\u00b7\ud720\ub77c 50~60% \ud560\uc778** / **\ubb34\uc2e0\uc0ac\uc2a4\ud0e0\ub2e4\ub4dc \ucd5c\ub300 80% \ud560\uc778**. \ud604\ub300\ub300\uc804 '\uc5b8\ub354\uc544\uba38\u00b7\ud720\ub77c\u00b7\ub974\uaf2c\ub044 3\ube0c\ub79c\ub4dc 2\uc8fc\uc9f8 \uade0\uc77c\uac00 \ud589\uc0ac (1.9\ub9cc~3\ub9cc\uc6d0\ub300 \uc758\ub958)'. \ube44\uc218\uae30 \ud0c0\uc0ac \ud560\uc778 \uacf5\uc138\ub85c \uac00\uaca9 \uc800\ud56d \uc99d\uac00 \ucd94\uc138 \u2014 \ucd94\uc774 \ubaa8\ub2c8\ud130\ub9c1 \ud544\uc694."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \u2014 \ub3d9\uc5c5\uacc4 FW \uc785\uace0 \ud604\ud669","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"**\uc804 \ub9e4\uc7a5 \uacf5\ud1b5: FW \ubcf8\uaca9 \uc785\uace0 \ube0c\ub79c\ub4dc \uc5c6\uc74c** \u2014 \ubc18\ud314\u00b7\ubc18\ubc14\uc9c0\uac00 \uc5ec\uc804\ud788 \uc8fc\ub825. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\ub9cc '\uc11c\uc11c\ud788 \uc708\ub4dc\uc2e4\ub4dc\u00b7\ub871\uc2ac\ub9ac\ube0c \uc720\ub2db \ub208\uc5d0 \ub744\uae30 \uc2dc\uc791'. \uc0ac\uc774\uba3c\ud30c\uc8fc\ub294 '\ubc18\ud314 \ub77c\uc778 \uc2e0\uc0c1\ud488 2~3\uc885 \uc785\uace0 \uc218\uc900'."},{"tag":"\uacbd\uc7c1\uc0ac \ud589\uc0ac","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '**HDEX \ubcf4\uc774\ub4dc \ud589\uc0ac 60%, 2\ub9cc\uc6d0\ub300 \ubc18\ud314 \uc8fc\ub825** / \ub974\uaf2c\ub044\u00b7\ud720\ub77c 50~60% \ud560\uc778'. \ud604\ub300\ub300\uc804 '**\uc5b8\ub354\uc544\uba38\u00b7\ud720\ub77c\u00b7\ub974\uaf2c\ub044 3\ube0c\ub79c\ub4dc 2\uc8fc\uc9f8 \uade0\uc77c\uac00 \ud589\uc0ac** (1.9\ub9cc~3\ub9cc\uc6d0\ub300)'. \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 '\uc5b8\ub354\uc544\uba38 12~3\uc2dc 3\uac1c \uc774\uc0c1 \uad6c\ub9e4 \uc2dc 20~40% \ucd94\uac00 \ud560\uc778, \uc544\ub514\ub2e4\uc2a4\ub3c4 \ucd94\uac00 \ud560\uc778 \uc2dc\uac04\ub300 \uc6b4\uc601'."},{"tag":"\uc18c\ube44\uc2ec\ub9ac","text":"\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765 '**\uc18c\ube44\uc2ec\ub9ac \uc704\ucd95\uc73c\ub85c \uc0c1\uc124\u00b7\uc815\uc0c1 \uad6c\ub9e4 \uace0\uac1d \ubaa8\ub450 \uac1d\ub2e8\uac00 \ud558\ub77d** \uc911'. \uc0ac\uc774\uba3c\uc5ec\uc8fc '\uc2a4\ucee4\ud2b8\u00b7\ubc18\ubc14\uc9c0\uc2a4\ucee4\ud2b8\u00b7\ub098\uc2dc \uc885\ub958 \uafb8\uc900\ud788 \ud310\ub9e4 \uc644\ub8cc'. \ub86f\ub370\uc758\uc655 'FW \uc120\uad6c\ub9e4 \ubaa9\uc801 \uace0\uac1d \uc5c6\uc74c \u2014 \uc544\uc9c1 \uc5ec\ub984 \uc2dc\uc98c \uc544\uc774\ud15c \uc704\uc8fc \ud310\ub9e4'."}]},"\uc0c1\ud488\uad50\uc721\ubd81":{"title":"26FW \uc0c1\ud488\uad50\uc721\ubd81 \ub9e4\uc7a5 \uc758\uacac","items":[{"tag":"\uae0d\uc815","text":"\uc804 \ub9e4\uc7a5 **\ub9e4\uc6b0 \uae0d\uc815\uc801** \ubc18\uc751. \uacf5\ud1b5 \ud638\ud3c9 \ud3ec\uc778\ud2b8: \u2460 \ud488\ubc88\u00b7\uc0c1\ud488\uba85 \uac80\uc0c9 \uc989\uc2dc \uc138\uc77c\uc988 \ud3ec\uc778\ud2b8 \ud655\uc778 \uac00\ub2a5 \u2461 \uc2e0\uc785 \uc9c1\uc6d0 \uc790\uae30 \ud559\uc2b5 \uac00\ub2a5 \u2462 \uc5f0\uacc4 \ud310\ub9e4\u00b7\uc14b\uc5c5 \ucf54\ub514 \uc548\ub0b4 \uc218\uc6d4 \u2463 \uc5b8\uc81c\ub4e0 \uaebc\ub0b4\ubcfc \uc218 \uc788\ub294 \uc811\uadfc\uc131. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uc544\uc8fc \ubcf4\uae30 \uc88b\uace0 \uae30\ub2e4\ub9ac\ub358 \uc2dc\uc2a4\ud15c', \ucee4\ub125\ud2b8\uccad\uc8fc '\ud604\uc7a5\uc5d0\uc11c \uc815\ub9d0 \ub9ce\uc740 \ub3c4\uc6c0'."},{"tag":"\uac1c\uc120 \uc81c\uc548","text":"\uc2e0\uc138\uacc4\uac15\ub0a8: **'\ucc29\uc7a5 \uc774\ubbf8\uc9c0\u00b7\uc720\uc0ac \uc0c1\ud488 \ucc28\uc774\uc810\u00b7\uad6d\uac00\ubcc4 \uc678\uad6d\uc778 \uc751\ub300 \ud3ec\uc778\ud2b8 \ucd94\uac00 \uc2dc \ud65c\uc6a9\ub3c4 \uadf9\ub300\ud654'** \uad6c\uccb4\uc801 \uc81c\uc548. \ub86f\ub370\uc7a0\uc2e4: '**\uc139\uc158 \uad6c\uc131\uc744 \uacf5\uc2dd \ud648\ud398\uc774\uc9c0\ucc98\ub7fc** \ub098\ub204\uba74 \uc88b\uaca0\uc74c'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80: '**\uc138\uc77c\uc988 \ud3ec\uc778\ud2b8\uac00 \uc81c\ud488\uba85\ub9cc \ub2e4\ub974\uace0 \ub0b4\uc6a9 \uc720\uc0ac** \u2014 \ucc28\ubcc4\ud654 \ud544\uc694'. \ud604\ub300\ubb34\uc5ed: '\ubcf4\uae30 \uc5b4\ub835\uace0 \ub530\ubd84\ud55c \uad50\uc721\uc790\ub8cc\ub97c \uc27d\uac8c \uc774\ud574\ud560 \uc218 \uc788\uac8c \uc124\uba85\ud574\uc918\uc11c \uac10\uc0ac'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \uc758\ub958 \uc7ac\uace0 \uc804\ubb34","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uae34\uae09 \ubc30\ubd84 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 L \uc0ac\uc774\uc988 \ubd80\uc871","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ucd08\uacbd\ub7c9 \uae34\ud314 \uc790\ucf13\u00b7\ub0c9\uac10 \uc774\ub108 \ubbf8\ucd9c\uc2dc (\uc218\uc8fc)","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\ub300\uc804","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucc28\uae30 \uae30\ud68d \uac80\ud1a0"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0 V2 LGR\u00b7PNK \uc7ac\uace0 \uc18c\uc9c4 \uc6b0\ub824","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\uc7ac\uace0 \ubaa8\ub2c8\ud130\ub9c1"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ubca0\uc77c\ucea1 \ub9ac\uc624\ub354 \uc785\uace0 \uc77c\uc815","\ub9e4\uc7a5":"\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ud655\uc778 \ud544\uc694"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc5d0\uc5b4\ub9ac \ud37c\ud50c \uc7ac\uc785\uace0 \uae30\ub300 \uace0\uac1d","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc5ec\ubd80 \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ubcfc\ud2b8\ud504\ub85c 230mm \uc0ac\uc774\uc988 \ubd80\uc7ac","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ud30c\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc5d0\uc5b4\ub9ac \uc2e0\uaddc \uceec\ub7ec \ub9e4\uce6d \uc758\ub958 \ubd80\uc7ac","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc758\ub958 \uc785\uace0 \uc5f0\uacc4 \uac80\ud1a0"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \ub77c\ucf13 \uc7ac\uace0 \uc804\ubb34","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc2dc\uae09"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ud30c\uc774\uc36c \ucd9c\uc2dc \uc77c\uc815 \ubb38\uc758 \uae09\uc99d","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ucee4\ub125\ud2b8\uccad\uc8fc\u00b7\ub354\ud604\ub300\uc11c\uc6b8","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucd9c\uc2dc \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ub864\ub791\uac00\ub85c\uc2a4 \ud074\ub798\uc2dc \uc7ac\uace0 \uc18c\uc9c4 \uc784\ubc15","\ub9e4\uc7a5":"\ub86f\ub370\ucc3d\uc6d0\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0\u00b7\ucd94\uac00 \ubb3c\ub7c9 \ud655\ubcf4"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"BNA 265g \ubbf8\ucd9c\uc2dc \uc774\ud0c8","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uae30\ud68d \uac80\ud1a0"},{"\uad6c\ubd84":"\ud300\uc2a4\ud3ec\uce20","\ub0b4\uc6a9":"\uc88c\ud22c \uae00\ub7ec\ube0c \ubb38\uc758 \u591a","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"\uad6c\ubd84":"\ud300\uc2a4\ud3ec\uce20","\ub0b4\uc6a9":"\uc62c\ud300 \uc7ac\uace0 \ubd80\uc871","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778"}]}},"7\uc6d41W":{"date":"06/29~07/05","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \uc804 \ub9e4\uc7a5 \uc555\ub3c4\uc801 1\uc704\ub85c \ubcf8\uaca9 \uc5ec\ub984 \uc2dc\uc98c \uc9c4\uc785. \ub514\ud30c\uc774\uc5b4 \uc2e0\uaddc \ub77c\ucf13 \uc2a4\ud399\u00b7\ucd9c\uc2dc\uc77c \ubb38\uc758 \uae09\uc99d, \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ub354\ud604\ub300\uc11c\uc6b8 \ub4f1 \ubc18\uc751 \ub728\uac70\uc6c0. \uc5ec\uc131 \uae34\uae30\uc7a5 \ud558\uc758(\uae34\ubc14\uc9c0\u00b7\ub871\uc2a4\ucee4\ud2b8) \uc218\uc694\uac00 \uc804 \ub9e4\uc7a5 \uacf5\ud1b5\uc73c\ub85c \ud655\uc778\ub3fc \ucc28\uae30 \uae30\ud68d \ubc18\uc601 \ud544\uc694. \ub4dc\ub85c\uc6b0 V1 \uc2e0\uaddc \uceec\ub7ec\u00b7\uc70c\ubca0\uc5b4 \ud0a4\ub9c1 \uc785\uace0\ub85c \uc6a9\ud488 \ubd84\uc704\uae30 \uc804\ud658, \ucd08\ubc18 \ubc18\uc751 \ub300\uccb4\ub85c \uae0d\uc815\uc801. \ud734\uac00\ucca0 \uc2dc\uc791 + \ub0a0\uc528 \uc601\ud5a5\uc73c\ub85c \uc785\uc810\uac1d \uc804\ubc18 \uac10\uc18c, \uc77c\ubd80 \ub9e4\uc7a5 20~40% \ud558\ub77d.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8 \ubc0f \uc2e0\uc0c1 \uc758\ub958 \ubc18\uc751","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uc555\ub3c4\uc801 1\uc704. \uae30\ub2a5\uc131\u00b7\uc18d\uac74 \uc18c\uc7ac \uc218\uc694 \ubcf8\uaca9\ud654. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc0c9\uc0c1 \ubc1d\uace0 \uac00\ubccd\uace0 \uc2dc\uc6d0\ud55c \uc18c\uc7ac \ud310\ub9e4 \ud655 \uc62c\ub77c\uc634'. \uc7ac\uad6c\ub9e4\uc728\ub3c4 \ub192\uc544 \ub2e8\uace8 \uace0\uac1d\uc774 \uac19\uc740 \uc6d0\ub2e8 \ub2e4\ub978 \uceec\ub7ec\u00b7\ub514\uc790\uc778\uc73c\ub85c \uc7ac\uad6c\ub9e4 \uc774\uc5b4\uc9d0."},{"tag":"\ubca0\uc2a4\ud2b8","text":"\uc5ec\uc131: **\uba5c\ub85c\uc6b0 \ud06c\ub86d \ud2f0\uc154\uce20** \ubc18\uc751 \uc88b\uc74c (\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0\u00b7\ub86f\ub370\ucc3d\uc6d0\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591). \ub0a8\uc131: **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ucf54\uc5b4 7\uc778\uce58 \uc1fc\uce20** (\ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 '\ub531 \ud544\uc694\ud55c \uc0c9\uc0c1\ub9cc \ub098\uc640\uc11c \uc798 \ud314\ub9bc'). \uacf5\ud1b5: \uc2dc\uc5b4\uc544\uc774\uc2a4 + \ud53c\ud0a4\uc2a4\ud29c\ub514\uc624 \uc14b\uc5c5 \uafb8\uc900\ud55c \uc218\uc694."},{"tag":"FW\uc2e0\uc0c1 \ubc18\uc751","text":"26FW \uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ucd94\uac00 \uc785\uace0 \ubc18\uc751 \uae0d\uc815\uc801 \u2014 \uc2e0\uc138\uacc4\ub300\uc804 '\uc5d0\uc774\uc2a4 \ub77c\uc778\uc774 \uac00\uc7a5 \ubc18\uc751 \uc88b\uc74c, FW\ub77c\uc778 \uc0c9\uac10 \uc608\uc058\ub2e4\ub294 \uc758\uacac \u591a'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uc5d0\uc774\uc2a4 \ud2f0\uc154\uce20 \uc2dc\ucc29\uc728 \uc88b\uc73c\ub098 \ud551\ud06c \uadf8\ub77c\ub370\uc774\uc158\ubcf4\ub2e4 \ud06c\ub9bc \uceec\ub7ec \uad6c\ub9e4\uc728 \ub192\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ud310\ub9e4 \uac00\uc7a5 \uc88b\uc74c'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc218\uc694 \uc9c0\uc18d \uc0c1\uc2b9** \u2014 7\uc6d4 \ubcf8\uaca9 \ub354\uc704 \uc9c4\uc785\uc73c\ub85c \uae30\ub2a5\uc131 \uc18c\uc7ac \uc218\uc694 \ucd5c\uace0\uc870. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc758\ub958 \uc0c1\uc2b9\uc138 \uacc4\uc18d'. \ud83d\udcc9 **\uc804\ubc18 \uc785\uc810 \uac10\uc18c** \u2014 \uc5ec\ub984 \ud734\uac00\ucca0 \uc2dc\uc791 + \ube44/\ud750\ub9b0 \ub0a0\uc528 \ubcf5\ud569 \uc601\ud5a5. \ud604\ub300\ud310\uad50 -40%, \uc544\uc774\ud30c\ud06c -20%, \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 -20~30%, \uc2e0\uc138\uacc4\uad11\uc8fc\u00b7\ub86f\ub370\uc778\ucc9c -20%. \ud83d\udcc8 **\ub18d\uad6c\uacf5 \ud310\ub9e4 \uc0c1\uc2b9** \u2014 \uc5ec\ub984\ubc29\ud559 \ud2b9\uc218 \uc2dc\uc791, \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 \uc7ac\uc785\uace0 \ud6c4 \ud310\ub9e4 \ud638\uc870."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (\ud604\uc2dc\uc810 \ucd94\uac00 \uad6c\uc131 \ud544\uc694 \uc544\uc774\ud15c\u00b7\uacbd\uc7c1\uc0ac \ub300\ube44 \ubd80\uc871 \uc544\uc774\ud15c)","items":[{"tag":"\uacf5\ud1b5 \uc218\uc694","text":"**\uc5ec\uc131 \uae34\uae30\uc7a5 \ud558\uc758 \uc218\uc694 \uc804 \ub9e4\uc7a5 \uacf5\ud1b5** \u2014 '\ubc18\ubc14\uc9c0 \uae30\uc7a5 \ub108\ubb34 \uc9e7\uc544 \uc5f0\ub839\ub300 \uc788\ub294 \uace0\uac1d \uad6c\ub9e4 \uc774\ud0c8'. \uc694\uccad \uc2a4\ud0c0\uc77c: \ubb34\ub98e\uae4c\uc9c0 \uc624\ub294 5\ubd80\ubc14\uc9c0\u00b7\uc138\ubbf8\uc640\uc774\ub4dc\u00b7\uc2ac\ub9bc \uc870\uac70. \uc2e0\uc138\uacc4\uc13c\ud140 '\ubc30\ub4dc\ubbfc\ud134\u00b7\ud0c1\uad6c \uc0dd\ud65c\uccb4\uc721 \uace0\uac1d \uc99d\uac00\ub85c 5~60\ub300 \ube44\uc911 \ub192\uc544\uc838 \uc9e7\uc740 \uae30\uc7a5 \ubd80\ub2f4'. \ud604\ub300\ud310\uad50 '\ub9e4\uc7a5\uc5d0 \uae34\ubc14\uc9c0 \ud55c \uc885\ub958\ub3c4 \uc5c6\uc5b4 \uc544\uc26c\uc6c0'."},{"tag":"\uacf5\ud1b5 \uc218\uc694","text":"**\uc587\uc740 \uac89\uc637 \ubd80\uc871** \u2014 \uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0 '\uc2e4\ub0b4 \uc774\ub3d9 \uc2dc \ubc14\ub78c\ub9c9\uc774 \uc587\uc740 \uac89\uc637 \ub2c8\uc988 \uc788\ub294\ub370 \uc0c1\ud488 \ubd80\uc871, \ub0a8\uc131 \ud6c4\ub4dc \uae30\ubcf8 \uceec\ub7ec \u591a \ucc3e\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc5ec\uc131\uc6a9 UV \uacbd\ub7c9 \uc790\ucf13 + \uc2a4\ud2b8\ub808\uce58 \uc18c\uc7ac \uc14b\uc5c5 \ud544\uc694, \ub450\uaed8 \uc788\ub294 \ud604 \uc790\ucf13 \ud130\uce58 \uc5c6\uc74c'. \uc544\uc774\ud30c\ud06c '\uc5ec\ub984\uc6a9 \ud480\uc9d1\uc5c5 \uc790\ucf13(\ubcfc\ub808\ub85c \ub300\uc6a9)'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc14b\uc5c5 \uceec\ub7ec \ub9e4\uce6d \uad6c\uc131 \ubd80\uc871** (\uc2e0\uc138\uacc4\uac15\ub0a8) \u2014 '\uc0c1\uc758\u00b7\ud558\uc758 \ubbf9\uc2a4\ub9e4\uce58 \uac00\ub2a5\ud55c \uad6c\uc131 \uc5c6\uc74c, \uc14b\uc5c5 \ub9e4\uce6d \uac00\ub2a5\ud558\ub3c4\ub85d \uae30\ud68d \ud544\uc694'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud575\uc2ec \uc0ac\uc774\uc988 S\u00b7M 3\ud488\ubc88 \ubd80\uc7ac' \u2192 FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \uc548\ub0b4"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 PK\ud2f0\uc154\uce20 \ubb3c\ub7c9 \ubd80\uc871** \u2014 '\ud130\uce58 \ub9ce\uc740\ub370 \ubb3c\ub7c9 \ubd80\uc871\uc73c\ub85c \uad6c\ub9e4 \uc5f0\uacb0 \uc5b4\ub824\uc6c0' \u2192 \uc7ac\uace0 \ud655\uc778 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ub0a8\uc131 \ub77c\uc778 \ubd80\uc871 (\ucee4\ub125\ud2b8\uccad\uc8fc) '\uc5ec\uc131\uc740 SKU \ub2e4\uc591\ud558\ub098 \ub0a8\uc131\uc740 \uc587\uc740 \uae34\ud314\ub3c4 \uc5c6\uace0 \uc6d0\ub2e8 \ud55c\uc815\uc801'. \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 '\ub370\uc77c\ub9ac \uc14b\uc5c5 \ub77c\uc778 \ubd80\uc871, \uc5ec\uc131 \uae30\ubcf8 \ubc18\ubc14\uc9c0 2~3 SKU \ub354 \ud544\uc694'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ubb34\ub98e\uae4c\uc9c0 \uc624\ub294 5\ubd80 \ubc14\uc9c0 \uc2a4\ud0c0\uc77c \uaf64 \ub9ce\uc774 \ucc3e\uc74c'."},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uac15\ub0a8: '\uc2e4\ub0b4 \ud14c\ub2c8\uc2a4 \ube44\uc911 \ub192\uc544\uc9c0\uba74\uc11c \uc14b\uc5c5\ub958 \uad6c\ub9e4 \uae09\uc99d, \uc758\ub958\u00b7\uc2e0\ubc1c\u00b7\uc6a9\ud488 \uc5f0\uacc4\uc131 \uae30\ud68d \ud544\uc218'. \ub354\ud604\ub300\uc11c\uc6b8: 'UV \ucfe8 \uae30\ub2a5 \uae34\ud314\u00b7\uae34\ubc14\uc9c0\u00b7\ucfe8\uac10 \uc774\ub108(\uace8\ud504\uc5d0\uc11c \ub9ce\uc774 \uc4f0\uc784) \ub610\ub294 \uc2ac\ub9ac\ubc0d \ub808\uae45\uc2a4 \ud544\uc694'."},{"tag":"\uc548\ub0b4\ud544\uc694","text":"\ud83d\udccc \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758 \u2192 FW \uc2e0\uc0c1 S\u00b7M \uc0ac\uc774\uc988 \ud655\ub300 \uc608\uc815 \uc548\ub0b4"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc2e0\uaddc \uceec\ub7ec\u00b7\uc70c\ubca0\uc5b4 \ud0a4\ub9c1\u00b7\ubc14\uc774\uc800 \ubc18\uc751)","items":[{"tag":"\ub4dc\ub85c\uc6b0V1 \uc2e0\uaddc\uceec\ub7ec","text":"**\ub4dc\ub85c\uc6b0 V1 \uc2e0\uaddc \uceec\ub7ec** \uc785\uace0 \ucd08\ubc18 \ubc18\uc751 \uae0d\uc815\uc801. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uc2e0\uaddc \uceec\ub7ec \uad00\uc2ec\ub3c4\u00b7\uad6c\ub9e4\ub3c4 \ub192\uc544 \uc6a9\ud488 \ud310\ub9e4\uc728 \uc0c1\uc2b9'. \ub098\uc778\uc6d0\ud55c\ub0a8 'V1 \uc2e0\uaddc \uceec\ub7ec \ubaa8\ub450 \uc778\uae30, V2\uae4c\uc9c0 \ub3d9\ubc18 \uc218\uc694'. \ub2e8, \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 'V1\u00b7V2 \uc0c1\ud488 \ud53c\ub85c\uac10 \uc2ec\ud568, V3 \uac19\uc740 \uc2e0\uaddc \ub514\uc790\uc778 \ud544\uc694' \uac15\ud55c \uc758\uacac."},{"tag":"\uc70c\ubca0\uc5b4 \ud0a4\ub9c1","text":"**\uc70c\ubca0\uc5b4 \ud0a4\ub9c1** \uc785\uace0 \ucd08\ubc18 \ubc18\uc751. \uc544\uc774\ud30c\ud06c '\ubc18\uc751 \ub108\ubb34 \uc88b\uc74c, \uce74\uc6b4\ud130 \ube44\uce58 \ud6c4 \uacb0\uc81c \uc804 \ucd94\uac00 \uad6c\ub9e4 \uc5f0\uacb0, \uae30\uc874 \uace0\uac1d \uc65c \uc774\uc81c\uc11c\uc57c \ub098\uc654\ub0d0 \ubc18\uc751'. \uc2e0\uc138\uacc4\uac15\ub0a8 '20~30\ub300 \uc5ec\uc131\u00b7\uc678\uad6d\uc778 \ubc18\uc751 \uc88b\uc74c, \uac00\ubc29 \uad6c\ub9e4 \uace0\uac1d \uc5f0\uacc4\ud310\ub9e4 \uc6a9\uc774'. \ud604\ub300\ubb34\uc5ed '\uc785\uace0\ubd84 \uc804\ub7c9 \uc18c\uc9c4, \ubb3c\ub7c9 \ud544\uc694' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\ubb34\uc5ed \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1\u00b7\uc70c\ubca0\uc5b4 \uc785\uace0\ubd84 \uc804\ub7c9 \uc18c\uc9c4** \u2014 '\ubb3c\ub7c9 \ud544\uc694' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \uc2dc\uae09"},{"tag":"\ubc14\uc774\uc800","text":"**\uc2ec\ub9ac\uc2a4 \ud37c\ud3ec\uba3c\uc2a4 \ubc14\uc774\uc800**: \ub300\ubd80\ubd84 \ub9e4\uc7a5 \ubc18\uc751 \ubbf8\ubbf8. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4\ub9cc '\uae00\ub85c\uc6b0 \ubca0\uc77c \ubc14\uc774\uc800 W \ubc18\uc751 \uc88b\uc74c \u2014 \ubc34\ub4dc \uc870\uc808 \uae30\ub2a5\u00b7\ub113\uc740 \ubc34\ub4dc \uc2e4\uc6a9\uc131 \uae0d\uc815'. \uc2e0\uc138\uacc4\ub300\uc804 '\ucc29\uc6a9 \uc2dc \uc548\uc815\uac10 \uc5c6\uc774 \uc62c\ub77c\uc624\uac70\ub098 \ubc97\uaca8\uc9c8 \uac83 \uac19\ub2e4\ub294 \uc758\uacac, \ubc18\ubcf5 \ucc29\uc6a9 \uc2dc \uc18c\uc7ac \uc57d\ud574\uc9c8 \uc6b0\ub824'."},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 'V1 \uc544\uc774\ubcf4\ub9ac \uceec\ub7ec\ub9cc \ubb3c\ud1b5 \uc218\ub0a9\uc774 \ucc0d\ucc0d\uc774 \ubc29\uc2dd, \uace0\uac1d \uc758\ubb38 \ub2e4\uc218'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ub4dc\ub85c\uc6b0 V1\u00b7V2 \uc0c1\ud488 \ud53c\ub85c\uac10 \ub9e4\uc6b0 \uc2ec\ud568, \uc2e0\uaddc \ub514\uc790\uc778(V3) \ud544\uc694 \uac15\ub825 \uc694\uccad'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uae30\ubcf8 \ubcfc\ucea1(\uc5ec\ub984\uc6a9 \uc587\uc740 \uc18c\uc7ac) \ubd80\uc871, \uc5ec\uc131\uc774 \uc4f8 \ub9cc\ud55c \ucea1 \ubaa8\uc790 \uc5c6\ub2e4\ub294 \ud53c\ub4dc\ubc31 \u591a'."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751)","items":[{"tag":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c1.5 \uc2e0\uaddc","text":"\uc2e0\uaddc \uceec\ub7ec \uc785\uace0 \ucd08\ubc18 \ubc18\uc751 \ub300\uccb4\ub85c \uae0d\uc815\uc801\uc774\ub098 \uad6c\ub9e4 \uc804\ud658\uc740 \uc9c0\ucf1c\ubd10\uc57c. \uc2e0\uc138\uacc4\ub300\uc804 '\uc0c8 \uceec\ub7ec \ubaa8\ub450 \ubc18\uc751 \uc88b\uc74c, \uae30\uc874 WGN\ub3c4 \uafb8\uc900 \ud310\ub9e4'. \ub86f\ub370\ucc3d\uc6d0 '\ub2e8\uace8\uc740 \uc774\ubbf8 \ubcf4\uc720, \uc0c8 \uceec\ub7ec\ub85c \ucd94\uac00 \uad6c\ub9e4 \uace0\ubbfc'. \uc5d0\uc774\ub9ac \uc2e0\uaddc \uceec\ub7ec\ub3c4 \ub3d9\ubc18 \ubc18\uc751 \uc88b\uc74c (\ub86f\ub370\uc778\ucc9c '\uc5d0\uc5b4\ub9ac 225 \uc0ac\uc774\uc988 \uc804\uac1c \ub9cc\uc871\ub3c4 \ub192\uc74c')."},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ub9ac\uc2a4\ud3f0\uc2a4 \uc2e0\uc0c1 \ubc1c\uc774 \ucee4\ubcf4\uc778\ub2e4\ub294 \ud53c\ub4dc\ubc31 \ub108\ubb34 \ub9ce\uc74c, \ubcfc\ud2b8\ud504\ub85c \ub300\ube44 \ube44\uad50\ub420 \uc218 \uc788\uc74c'. \ub86f\ub370\uc7a0\uc2e4 '\ub4b7\ucd95 \ub192\uc544\uc11c \ubd88\ud3b8\ud558\ub2e4\ub294 \uc758\uacac, \uae30\uc874 \ub9ac\uc2a4\ud3f0\uc2a4 \ub300\ube44 \ud53c\ud305\uac10 \ub2ec\ub77c\uc9c4 \uac83 \uac19\uc74c'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ubcfc\uc774 \ub113\uc740 \uc7a5\uc810\uc73c\ub85c \uacbd\uae30\u00b7\ub808\uc2a8\uc6a9\uc73c\ub85c \uc88b\ub2e4\ub294 \uc758\uacac, \ub7ec\uc26c\ud504\ub85c \uad6c\ub9e4\uc790 \uc774\ud0c8 \ud761\uc218'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 \ubcfc\ud2b8\ud504\ub85c \uc2e0\uaddc \uceec\ub7ec \ub0a8\uc131 \uc0ac\uc774\uc988 \ubd80\uc871** \u2014 '\uc778\uae30 \ub9ce\uc740\ub370 \ub0a8\uc131 \uc0ac\uc774\uc988 \uc5c6\uc5b4 \uc544\uc26c\uc6c0' \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc0ac\uc774\uba3c\ud30c\uc8fc '\ubcfc\ud2b8\ud504\ub85c1.5 \uad00\uc2ec\ub3c4 \ub192\uc73c\ub098 \uc628\ub77c\uc778 \uac00\uaca9 \ube44\uad50 \ud6c4 \uc2dc\ucc29\ub9cc \ud558\uace0 \uc628\ub77c\uc778 \uad6c\ub9e4 \uc774\ud0c8 \uc99d\uac00'. \ub354\ud604\ub300\uc11c\uc6b8 '\uc5ec\uc131 \uc778\uc794 \ucf54\ud2b8 \uc2e0\ubc1c \ucd9c\uc2dc \ud6c4 \ub0a8\uc131 \uc778\uc794 \ucf54\ud2b8 \uc2e0\ubc1c \ubb38\uc758 \uc99d\uac00'. \ubbf8\uc785\uace0 \ub9e4\uc7a5: \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ucee4\ub125\ud2b8\uccad\uc8fc \ub4f1."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \ub77c\ucf13 \ucd08\uae30 \ubc18\uc751)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4 \ucd08\uae30\ubc18\uc751","text":"**\ub514\ud30c\uc774\uc5b4 \ub77c\ucf13 \uc778\uc9c0\ub3c4\u00b7\ubb38\uc758 \uc218\uc900**: \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765 '\ud558\ub8e8 2~3\uac74 \ubb38\uc758'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ubc18\uc751 \ub728\uac70\uc6c0 \u2014 \ubc14\ubcfc\ub78f \ud4e8\uc5b4\uc5d0\uc5b4\ub85c \ub300\ube44 \uc2a4\ud540 \uc131\ub2a5\u00b7\uc2dc\ud0c0 \uac00\ub2a5 \uc5ec\ubd80 \uc9d1\uc911 \ubb38\uc758'. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ub354\ud604\ub300\uc11c\uc6b8 '\ucd9c\uc2dc\uc77c\u00b7\uc608\uc57d \ubb38\uc758 \u591a, \uc2dc\ud0c0\ud68c \uc694\uccad'. \ub2e8, \ub86f\ub370\uc7a0\uc2e4\u00b7\ud604\ub300\uc911\ub3d9 \ub4f1 \uc9c0\ubc29\u00b7\ube44\ud14c\ub2c8\uc2a4 \ub9e4\uc7a5\uc740 '\ubaa8\ub974\uc2dc\ub294 \ubd84 \ub300\ubd80\ubd84'."},{"tag":"\ub514\ud30c\uc774\uc5b4 \uc8fc\uc694 \ubb38\uc758","text":"\ubb38\uc758 \uc720\ud615 1\uc704: **\ucd9c\uc2dc\uc77c\u00b7\uc785\uace0 \uc77c\uc815** (\ub354\ud604\ub300\uc11c\uc6b8\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \ub4f1). 2\uc704: **\uc2a4\ud399\u00b7\uadf8\ub7a8\uc218** (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc5ec\uc131 \uadf8\ub7a8\uc218\uae4c\uc9c0 \ubb3c\ub7c9 \uac16\ucdb0 \ucd9c\uc2dc \ud544\uc694'). 3\uc704: **\uceec\ub7ec** (\uc0ac\uc774\uba3c\ubd80\uc0b0 '\ube14\ub799\uc778\uc9c0 \ub808\ub4dc\uc778\uc9c0 \ubb38\uc758'). 4\uc704: **\uc2dc\ud0c0 \uac00\ub2a5 \uc5ec\ubd80**. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ub514\ud14c\uc77c\ud55c \uc2a4\ud399\u00b7\uc131\ub2a5 \uad50\uc721 \ud544\uc694 (\uc6b8\ud2b8\ub77c V5 \ucd9c\uc2dc \ub54c\ucc98\ub7fc)'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub514\ud30c\uc774\uc5b4 \ucd9c\uc2dc \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720 \ud544\uc694** \u2014 \ub2e4\uc218 \ub9e4\uc7a5 \ucd9c\uc2dc\uc77c\u00b7\uc608\uc57d \ubb38\uc758 \u6025\uc99d, \uc815\ud655\ud55c \uc77c\uc815 \uacf5\uc720 \uc694\uccad"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \ub77c\ucf13 \uadf8\ub9bd \uc7ac\uace0 \ubd80\uc871** \u2014 '4/3, 4/4 \uadf8\ub9bd\ub9cc \ubcf4\uc720, \uc5ec\uc131 \uc120\ud638 \uadf8\ub9bd \uc5c6\uc5b4 \ud310\ub9e4 \ubd88\uac00, \ucee4\ud50c \ub3d9\uc2dc \uad6c\ub9e4 \uc720\ub3c4 \uc5b4\ub824\uc6c0' \u2192 \uc785\uace0 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc0ac\uc774\uba3c\ud30c\uc8fc \ube14\ub808\uc774\ub4dc V9 \uc0c1\uc124 \uc785\uace0 \ub300\uae30** \u2014 '\uc785\uace0 \ub300\uae30 \uace0\uac1d \uc0dd\uae30\ub294 \uc911, \uc785\uace0 \uc2dc\uae30 \ubb38\uc758' \u2192 \uc77c\uc815 \uacf5\uc720 \ud544\uc694"},{"tag":"\ud2b8\ub80c\ub4dc","text":"\ube14\ub808\uc774\ub4dc V10 + \ud074\ub798\uc2dc V3 \ud22c\ud0d1 \uc720\uc9c0. \ud30c\uc774\uc36c \uc774\ub984\uc73c\ub85c \ud63c\ub3d9\ud558\ub294 \uace0\uac1d \ub2e4\uc218 (\ub86f\ub370\uc778\ucc9c '\ub514\ud30c\uc774\uc5b4 \uba85\uce6d \ubaa8\ub974\uace0 \ud30c\uc774\uc36c\uc73c\ub85c \ubb3c\uc5b4\ubd04'). \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\uc2e0\uaddc \uc720\uc785 \uace0\uac1d \uc99d\uac00, \ud074\ub798\uc2dc \ud130\uce58\uc728 \uc0c1\uc2b9'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"**\uc5ec\ub984\ubc29\ud559 \ud2b9\uc218 \uc2dc\uc791** \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub0a8\ud559\uc0dd \uc5ec\ub984\ubc29\ud559 \uc2dc\uc98c \ud2b9\uc218, \uc5d0\ubcfc\ub8e8\uc158\u00b7\uc5d0\ubcf4NXT \ud310\ub9e4 \uc548\uc815\uc801'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc774\ubc88 \uc8fc \ub18d\uad6c\uacf5 \ud310\ub9e4 \uad49\uc7a5\ud788 \uc88b\uc74c'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ub808\ud2b8\ub85c\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8\u00b7\ud4e8\uc5b4\uc0f7 \ub4f1 \ub2e4\uc591\ud558\uac8c \ud310\ub9e4, \uc57c\uad6c\uae00\ub7ec\ube0c \ubb38\uc758\ub3c4 \uc99d\uac00'."},{"tag":"\uc774\uc288","text":"\ud604\ub300\ud310\uad50 '\uc5d0\ubcfc\ub8e8\uc158 \uc7ac\uace0 \uc5c6\uc5b4 \ubcf4\uc5ec\ub4dc\ub9ac\uc9c0 \ubabb\ud568, \uc5ec\uc720\ub86d\uac8c \uc785\uace0 \ud544\uc694'. \uc2e0\uc138\uacc4\uad11\uc8fc '\ub18d\uad6c\uacf5 \ub2c8\uc988 \uc788\uc73c\ub098 \ub2e8\uc21c\ud654\ub41c \uceec\ub7ec\uc5d0 \uad6c\ub9e4 \uc774\ud0c8'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\uc0c8\ub85c\uc6b4 \ub18d\uad6c\uacf5 \ud544\uc694'. \uc544\uc774\ud30c\ud06c '\ubcfc\ud0c0\uc6cc \ud53c\ub85c\ub3c4 \ub192\uc74c, 10\ub300 \ud559\uc0dd \uc2e0\uc0c1 \ubb38\uc758 \uc788\uc74c'."},{"tag":"\uc774\uc288","text":"\ub354\ud604\ub300\uc11c\uc6b8 '\uae00\ub7ec\ube0c \ud130\uce58\u00b7\ud310\ub9e4 \uc18c\ud3ed \uc99d\uac00, \uce90\uce58\ubcfc \ubaa9\uc801 \uac00\uc871 \ub2e8\uc704 \uad6c\ub9e4 + \uc18c\ud504\ud2b8 \uc57c\uad6c\uacf5 \uc5f0\uacc4 \uad6c\ub9e4'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '\uc131\uc778\uc6a9 \uae00\ub7ec\ube0c \ubb38\uc758 \uace0\uac1d \ub9ce\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 '\uc774\ubc88 \uc8fc \uae00\ub7ec\ube0c \ud130\uce58 \ub298\uc5b4 \uad00\uc2ec \ub192\uc544\uc9c0\ub294 \ubaa8\uc2b5'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \u2014 25FW \uc2e0\uc0c1\ud488 \uc785\uace0 \ud6c4 \ud604\uc7a5 \ubc18\uc751","items":[{"tag":"\uae0d\uc815","text":"25FW \uc0c1\uc124 \uc2e0\uc0c1\ud488 \uc785\uace0 \ud6c4 \uc804\ubc18 \uae0d\uc815\uc801 \ubc18\uc751. \ucee4\ub125\ud2b8\uccad\uc8fc '\ub2e8\uace8 \uace0\uac1d\ub4e4\uc774 \uae30\ub2e4\ub9b0 \ub9cc\ud07c \ud310\ub9e4\uc728 \ub9e4\uc6b0 \ub192\uc74c, Airveil \uc804 \ub77c\uc778 \ubc18\uc751 \uc88b\uc74c, \uac00\uaca9 \uc800\ud56d \uc5c6\uc774 \ud310\ub9e4'. \ub86f\ub370\uc758\uc655 '\uc0ac\uc774\uc988 \uae68\uc9d0 \uc0c1\ud669\uc5d0\uc11c FW \uc0c1\ud488 \uc785\uace0\ub85c \ubd84\uc704\uae30 \uc804\ud658'. LF\uad11\uc591 'SKU \ub2e4\uc591\ud574\uc9c0\uba70 \uace0\uac1d \uccb4\ub958\uc2dc\uac04 \uc99d\uac00'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc785\uace0 \uc218\ub7c9 \ubd80\uc871** (\ub86f\ub370\uc758\uc655\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc) \u2014 '\uc2e0\uc0c1\ud488 \uc785\uace0\uac00 \ub9ce\uc9c0 \uc54a\uc544 \uc544\uc26c\uc6c0, \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc18c\uc7ac \uc0c1\uc124 \uc785\uace0 \uc788\uc73c\uba74 \ub9e4\ucd9c \ub3c4\uc6c0' \u2192 \ucd94\uac00 \ubc30\ubd84 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ud604\ub300\ub300\uc804 '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0c1\uc124 \ud560\uc778\uc728\uc774 \uc815\uc0c1 \ub300\ube44 \ud06c\uac8c \ucc28\uc774\uc5c6\ub2e4\uace0 \ub290\uaef4 \uc815\uc0c1 \ucabd\uc5d0\uc11c \uad6c\ub9e4 \ub9ce\uc74c'. \uc0ac\uc774\uba3c\ubd80\uc0b0 '24FW\ub294 \ub514\uc790\uc778 \ub300\ube44 \uac00\uaca9 \ubcf4\uace0 \uad6c\ub9e4 \ub9dd\uc124\uc774\ub294 \ubd84 \u591a'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ubc18\ud314 \uc791\uc740 \uc0ac\uc774\uc988 \ucc3e\ub294 \uace0\uac1d\u591a, \uc2e0\uc0c1 \uc785\uace0\ub85c \ubc18\uc751 \uc88b\uc74c'."}]},"\uc0ac\uc740\ud488":{"title":"\ud558\ubc18\uae30 \uc815\uae30\uc0ac\uc740\ud488 \ucf00\uc774\ud504\ub2f4\uc694 \uc218\ub7c9 \ucde8\ud569","items":[{"tag":"\uc218\ub7c9\ucde8\ud569","text":"**\ucf00\uc774\ud504\ub2f4\uc694 \uc2e0\uccad \ud604\ud669** (1\ubc15\uc2a4=30\uac1c, 18\ub9cc\uc6d0/\ubc15\uc2a4): \uc2e0\uc138\uacc4\uac15\ub0a8 **20\ubc15\uc2a4**, \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 **10\ubc15\uc2a4**, \ub354\ud604\ub300\uc11c\uc6b8\u00b7\ub86f\ub370\uc7a0\uc2e4 **5\ubc15\uc2a4**, \uc0ac\uc774\uba3c\ud30c\uc8fc **4\ubc15\uc2a4**, \uc2e0\uc138\uacc4\uad11\uc8fc\u00b7\ud604\ub300\ud310\uad50 **3\ubc15\uc2a4**, \uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0\u00b7\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765\u00b7\ub86f\ub370\uc778\ucc9c\u00b7\uc0ac\uc774\uba3c\ubd80\uc0b0\u00b7\ub86f\ub370\ucc3d\uc6d0\u00b7\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4\u00b7\ucee4\ub125\ud2b8\uccad\uc8fc\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ud604\ub300\ub300\uc804\u00b7\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 **2\ubc15\uc2a4**, \uadf8 \uc678 \ub9e4\uc7a5 **1\ubc15\uc2a4**."}]},"\ub514\ud30c\uc774\uc5b4\uc2dc\ud0c0\ud68c":{"title":"\ub514\ud30c\uc774\uc5b4 \uc2dc\ud0c0\ud68c \ucc38\uc11d \ud604\ud669 (7/24 15~18\uc2dc)","items":[{"tag":"\ucc38\uc11d","text":"**\ucc38\uc11d \uc608\uc815 (\ub9e4\ub2c8\uc800 1\uba85)**: \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0, \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0, \ud604\ub300\ud310\uad50, \ub86f\ub370\uc778\ucc9c, \ub86f\ub370\uc758\uc655, \uc0ac\uc774\uba3c\ud30c\uc8fc, \ub86f\ub370\ucc3d\uc6d0, \ub354\ud604\ub300\uc11c\uc6b8, \ub86f\ub370\uc7a0\uc2e4, \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591. **\uc870\uc728 \uc911**: \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4. **\ubbf8\ucc38\uc11d**: \uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0\u00b7\uc2e0\uc138\uacc4\ub300\uc804\u00b7\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765 \ub4f1 \ub2e4\uc218 (\ud734\uac00\u00b7\ud589\uc0ac \ub4f1 \uc774\uc720)."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\uc804\ubc18 \uac10\uc18c** \u2014 \uc5ec\ub984 \ud734\uac00\ucca0 \uc2dc\uc791 + \ube44/\ud750\ub9b0 \ub0a0\uc528 \ubcf5\ud569 \uc601\ud5a5. \ud604\ub300\ud310\uad50 -40%, \uc544\uc774\ud30c\ud06c -20%, \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 -20~30%, \uc2e0\uc138\uacc4\uad11\uc8fc\u00b7\ub86f\ub370\uc778\ucc9c -20% \uba85\uc2dc. \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\uc2a4\ud0c0\ud544\ub4dc \uc790\uccb4 \uc785\uc810 \ud655 \uc904\uc5b4 \ub2e4\uc74c \uc8fc \uc9c0\ucf1c\ubd10\uc57c'."},{"tag":"\ub3d9\ud5a5","text":"\uc678\uad6d\uc778: \uc2e0\uc138\uacc4\uc13c\ud140 '\ud3c9\uc77c \uc678\uad6d\uc778 \ube44\uc911 \ud07c', \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 '\uc678\uad6d\uc778 \ud300\ub2f9 50~80\ub9cc\uc6d0 \uace0\uc561 \uad6c\ub9e4'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc804\uc2dc\ud68c \uc774\uc288\ub85c \uc720\ub7fd \uace0\uac1d + \ub0b4\uad6d\uc778 \uc720\uc785 \uc18c\ud3ed \uc99d\uac00'. \ud604\ub300\ubb34\uc5ed '\ud14c\ub2c8\uc2a4 \uc785\uc810 \uace0\uac1d \ud604\uc800\ud788 \uac10\uc18c, \uc678\uad6d\uc778\ub9cc \uc720\uc785 \uc911'."},{"tag":"\ub3d9\ud5a5","text":"LF\uad11\uc591\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131\uc740 \ube44 \uc601\ud5a5\uc73c\ub85c \uac00\uc871 \ub2e8\uc704 \uc2e4\ub0b4 \uc785\uc810 \uc99d\uac00. \ucee4\ub125\ud2b8\uccad\uc8fc '\uc11c\uc6b8 \uace0\uac1d \ub9e4\ucd9c \uae30\uc5ec, 30\ub300 \uc8fc \uc5f0\ub839'. AK\uc6d0\uc8fc '\ud3c9\uc77c \ube44\uc2b7, \uc8fc\ub9d0 \uace0\uac1d \uc99d\uac00'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\ub77c\ucf54\uc2a4\ud14c 30% \ud560\uc778 + \ubaa9\uc694\uc77c\ubd80\ud130 \ud589\uc0ac\uc7a5 \ub9e4\ub300 \ud06c\uac8c \uc124\uce58, \uac00\uaca9 \ube44\uad50 \uace0\uac1d \uc99d\uac00'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ud0c0 \ube0c\ub79c\ub4dc \ud560\uc778 \ud589\uc0ac\ub85c \uac00\uaca9 \ube44\uad50 \ud6c4 \ube44\uad6c\ub9e4 \u591a'. \ub86f\ub370\uc7a0\uc2e4 '\ubc31\ud654\uc810 \uc138\uc77c \uae30\uac04\uc5d0\ub3c4 \uc804\ub144 \ub300\ube44 \uc785\uc810\u00b7\ub9e4\ucd9c \ud558\ub77d'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc14b\uc5c5 \uceec\ub7ec \ub9e4\uce6d \uad6c\uc131 \ubd80\uc871\u00b7S\u00b7M \ud575\uc2ec \uc0ac\uc774\uc988 \ubd80\uc7ac","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uac15\ub0a8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \uc548\ub0b4 + \uae30\ud68d \uac80\ud1a0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"PK\ud2f0\uc154\uce20 \ubb3c\ub7c9 \ubd80\uc871 \ud310\ub9e4 \ub85c\uc2a4","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778 \ud544\uc694"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc5ec\uc131 \uae34\uae30\uc7a5 \ud558\uc758(\uae34\ubc14\uc9c0\u00b7\ub871\uc2a4\ucee4\ud2b8) \uc804 \ub9e4\uc7a5 \uc218\uc694","\ub9e4\uc7a5":"\uc804 \ub9e4\uc7a5 \uacf5\ud1b5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucc28\uae30 \uc2dc\uc98c \uae30\ud68d \ubc18\uc601 \uc2dc\uae09"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1\u00b7\uc70c\ubca0\uc5b4 \ud0a4\ub9c1 \uc785\uace0\ubd84 \uc804\ub7c9 \uc18c\uc9c4","\ub9e4\uc7a5":"\ud604\ub300\ubb34\uc5ed","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \uc2dc\uae09"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0 V1\u00b7V2 \uc0c1\ud488 \ud53c\ub85c\uac10 \u2014 \uc2e0\uaddc \ub514\uc790\uc778(V3) \uc694\uccad","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uae30\ud68d \uac80\ud1a0"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ubcfc\ud2b8\ud504\ub85c \uc2e0\uaddc \uceec\ub7ec \ub0a8\uc131 \uc0ac\uc774\uc988 \ubd80\uc871","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\uc628\ub77c\uc778 \uac00\uaca9 \ube44\uad50 \ud6c4 \uc2dc\ucc29\ub9cc \ud558\uace0 \uc774\ud0c8 \uc99d\uac00","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ud30c\uc8fc","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\ucc44\ub110 \uac00\uaca9 \uc815\ucc45 \ucc38\uace0"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ub514\ud30c\uc774\uc5b4 \ucd9c\uc2dc \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720 \ud544\uc694","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\ucd9c\uc2dc \uc77c\uc815 \uc989\uc2dc \uacf5\uc720"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\uc0ac\uc774\uba3c\uc5ec\uc8fc \uc5ec\uc131 \ub77c\ucf13 \uadf8\ub9bd \uc7ac\uace0 \ubd80\uc871","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc2dc\uae09"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ube14\ub808\uc774\ub4dc V9 \uc0c1\uc124 \uc785\uace0 \ub300\uae30 \uace0\uac1d \ubc1c\uc0dd","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\ud30c\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc77c\uc815 \uacf5\uc720"},{"\uad6c\ubd84":"\ud300\uc2a4\ud3ec\uce20","\ub0b4\uc6a9":"\uc5d0\ubcfc\ub8e8\uc158 \uc7ac\uace0 \ubd80\uc871 \u2014 \uc5ec\uc720\ub86d\uac8c \uc785\uace0 \ud544\uc694","\ub9e4\uc7a5":"\ud604\ub300\ud310\uad50","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\uc778"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"25FW \uc0c1\uc124 \uc2e0\uc0c1\ud488 \uc785\uace0 \uc218\ub7c9 \ubd80\uc871","\ub9e4\uc7a5":"\ub86f\ub370\uc758\uc655\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucd94\uac00 \ubc30\ubd84 \uac80\ud1a0"}]}},"7\uc6d42W":{"date":"07/06~07/12","\uc804\uccb4\uc694\uc57d":"**\ub514\ud30c\uc774\uc5b4 \ub77c\ucf13 \ub7f0\uce6d \uc8fc** \u2014 \uc0ac\uc804\uc608\uc57d + \ub7f0\uce6d \ub2f9\uc77c \ubc29\ubb38 \uad6c\ub9e4 \ub3d9\uc2dc \ubc1c\uc0dd, \uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ud604\ub300\ud310\uad50 \ub4f1 \ucd08\ubc18 \ubc18\uc751 \ub728\uac70\uc6c0. \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \uc5ec\uc804\ud788 \uc804 \ub9e4\uc7a5 \ud310\ub9e4 1\uc704, \uc5ec\ub984 \uae30\ub2a5\uc131 \uc218\uc694 \uc815\uc810. \uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec \ubc18\uc751 \uae0d\uc815\uc801, \ubcfc\ud2b8\ud504\ub85c \ud310\ub9e4 \uac15\uc138 \uc9c0\uc18d. \ub4c0\uc624\ud50c\ub7a9 \ubc31\ud329 \uc2e0\uaddc \uc785\uace0\ub85c \uc6a9\ud488 \ub77c\uc778\uc5c5 \ub2e4\uc591\ud654, \ub4dc\ub85c\uc6b0 V2 \ud654\uc774\ud2b8 \uc5ec\uc804\ud788 \uac15\uc138. \uc5ec\ub984 \ud734\uac00\ucca0 + \ub0a0\uc528 \uc601\ud5a5\uc73c\ub85c \uc785\uc810 \uc804\ubc18 \uac10\uc18c, \uc77c\ubd80 \ub9e4\uc7a5 30~40% \ud558\ub77d.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 1\uc704 \uc720\uc9c0. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc5ec\uc131 \uc758\ub958 \uc555\ub3c4\uc801 \ud310\ub9e4\uac00 \ub9e4\uc7a5 \ub9e4\ucd9c \ud575\uc2ec \uc5ed\ud560, \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc804 \ub77c\uc778 \uc0c1\uc2b9\uc138'. \ub86f\ub370\uc7a0\uc2e4 '\ub808\uc774\ucee4\uc2a4 \uc120\uc218 \ubc29\ubb38 \ud6c4 \ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 \ucee4\ud50c \uad6c\ub9e4'. \ub86f\ub370\ucc3d\uc6d0 '\ud074\ub7fd \ub2e8\uccb4 NTS51 \uc120\uc14b \ubc18\ud314\ud2f0 \uad6c\ub9e4 \ubc1c\uc0dd'."},{"tag":"\ub514\ud30c\uc774\uc5b4\ub7f0\uce6d","text":"\ud83d\udccc **\ub514\ud30c\uc774\uc5b4 \ub77c\ucf13 \ub7f0\uce6d** \uc774\ubc88 \uc8fc \ucd5c\ub300 \uc774\uc288. \uc0ac\uc804 \uc608\uc57d + \ub7f0\uce6d \ub2f9\uc77c \ubc29\ubb38 \uad6c\ub9e4 \ub3d9\uc2dc \ubc1c\uc0dd. \ud604\ub300\uc911\ub3d9 '\uc7ac\uace0 \ub2f9\uc77c \uc18c\uc9c4'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc0ac\uc804\uc608\uc57d\u00b7\ub2f9\uc77c \ubc29\ubb38 \uad6c\ub9e4 \ube44\uc911 \uc0c1\ub2f9'. \ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 V2\u00b7\uc2e0\uaddc \uceec\ub7ec \ub3d9\ubc18 \ud310\ub9e4 \ud638\uc870."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\ub514\ud30c\uc774\uc5b4 \ub7f0\uce6d \ud6a8\uacfc** \u2014 \ub77c\ucf13 \ubb38\uc758\u00b7\ud310\ub9e4 \uae09\uc99d, \uc77c\ubd80 \ub9e4\uc7a5 \ub2f9\uc77c \uc7ac\uace0 \uc18c\uc9c4. \ud83d\udcc8 **\uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec \uc785\uace0** \u2014 \uc5ec\uc131 \uc120\ud0dd\ud3ed \ud655\ub300, \ud310\ub9e4 \uc18c\ud3ed \uc99d\uac00. \ud83d\udcc9 **\uc785\uc810 \uc804\ubc18 \uac10\uc18c** \u2014 \uc5ec\ub984 \ud734\uac00\ucca0 + \ube44/\ub354\uc704 \ubcf5\ud569. \uc2e0\uc138\uacc4\uad11\uc8fc -30~40%, LF\uad11\uc591 -40~50%, \uc0ac\uc774\uba3c\uc5ec\uc8fc\u00b7\ud604\ub300\ub300\uc804 30% \uc774\uc0c1 \uac10\uc18c. \ud83d\udcc9 \uc2e0\uc138\uacc4\ub300\uc804 '\uacbd\uc7c1 \ube0c\ub79c\ub4dc \uc2dc\uc98c\uc624\ud504 + \ub9e4\uc7a5 \uc55e \ud06c\ub85d\uc2a4 \ub300\ud615 \ud589\uc0ac\ub85c \uc785\uc810 \uac10\uc18c'."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (\uc2e0\uc0c1 \uc804\ubc18 \uace0\uac1d \ud130\uce58\u00b7\ud53c\ub4dc\ubc31)","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc2e0\uc0c1 \uc804\ubc18 \ubc18\uc751 \uc88b\uc74c. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc774\ubc88 \uc8fc \uc70c\uc2a8\ucf54\ub9ac\uc544 \uc81c\ud488\ubcf4\ub2e4 \uc218\uc785 \uc0c1\ud488 \uc704\uc8fc \uc2e0\uc0c1 \ucd9c\uc2dc \u2014 \uc218\uc785 \uc0c1\ud488 \ud310\ub9e4 \uac15\uc138'. \ucee4\ub125\ud2b8\uccad\uc8fc '26FW \uc544\uc774\ud15c \ub300\ubd80\ubd84 \ubc18\uc751 \uc88b\uace0 \ud53c\ud305 \ud6c4 \ud310\ub9e4\uc728 \ub192\uc74c'. \ud558\ud37c \ud06c\ub86d \ub77c\uc778 \ucd08\ubc18 \ubc18\uc751 \uae0d\uc815\uc801 (\ucee4\ub125\ud2b8\uccad\uc8fc\u00b7\ub86f\ub370\uae30\ud765)."},{"tag":"\uc774\uc288","text":"**S\u00b7M \uc0ac\uc774\uc988 \ud488\uc808 \uc9c0\uc18d** (\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 \ub4f1) '\uc5ec\uc131 S\u00b7M \uc0ac\uc774\uc988 \uae68\uc838 \uc544\uc26c\uc6c0'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc758\ub958\ubcf4\ub2e4 \ud14c\ub2c8\uc2a4\ud654 \ubcf4\ub7ec \uc624\ub294 \uace0\uac1d \ub9ce\uc74c \u2014 \uc758\ub958 \uc14b\uc5c5 \uc7ac\uace0 \uae68\uc9d0\uc73c\ub85c \uc8fc\ubb38 \ub300\uc751 \ud544\uc694'. \uc2e0\uc138\uacc4\ub300\uc804 '\uc9c0\ubc29\uad8c \ud2b9\uc131\uc0c1 \uc5ec\uc131 \ube0c\ub77c\ud0d1\u00b7\uc2a4\ucee4\ud2b8 \uc785\uace0 \ud6c4 \ud310\ub9e4 \uc18c\ud3ed \uc0c1\uc2b9'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 S\u00b7M \uc0ac\uc774\uc988 \ud488\uc808 \ub2e4\uc218 \ub9e4\uc7a5** (\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 \ub4f1) \u2192 FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \uc548\ub0b4"},{"tag":"\uc774\uc288","text":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\ud53c\ud0a4\uc1fc\uce20\u00b7\uc2a4\ucee4\ud2b8\u00b7\uc5ec\uc131 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc678 \ud310\ub9e4\uc728 \ub0ae\uc74c, \uc758\ub958 \ud130\uce58\uac10 \uc804\ubc18 \uc800\ud558'. \ud604\ub300\uc911\ub3d9 'TTS71 \ud654\uc774\ud2b8 \uc5ec\uc804\ud788 \ud130\uce58 \u591a'. \ub86f\ub370\uc758\uc655 '\uc2e0\uc0c1 \uc785\uace0\ub85c \uc0ac\uc774\uc988 \uae68\uc9d0 \ub35c\ud574 \uace0\uac1d \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\uc548\ub0b4\ud544\uc694","text":"\ud83d\udccc \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758 \u2192 FW \uc2e0\uc0c1 S\u00b7M \uc0ac\uc774\uc988 \ud655\ub300 \uc608\uc815 \uc548\ub0b4"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ub4dc\ub85c\uc6b0\uc2e0\uaddc","text":"**\ub4dc\ub85c\uc6b0 V2 \ud654\uc774\ud2b8** \uc5ec\uc804\ud788 \ud310\ub9e4 \uac15\uc138. \uc2e0\uc138\uacc4\uac15\ub0a8 'GBL \uceec\ub7ec \uacc4\uc18d \ud310\ub9e4'. \uc2e0\uc138\uacc4\uad11\uc8fc 'V2 \ud551\ud06c \uceec\ub7ec \ubc18\uc751 \uc88b\uc74c'. \ub098\uc778\uc6d0\ud55c\ub0a8 'V1\u00b7V2\u00b7\uc5d0\uc5b4\uc18c\ud504\ud2b8\u00b7\ub4c0\uc624\ud50c\ub7a9\ubc31\ud329 \ubaa8\ub450 \ubc18\uc751 \uc88b\uc74c'."},{"tag":"\ub4c0\uc624\ud50c\ub7a9\ubc31\ud329","text":"**\ub4c0\uc624\ud50c\ub7a9 \ubc31\ud329** \uc2e0\uaddc \uc785\uace0 \ubc18\uc751 \uae0d\uc815\uc801. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\uc610\ub85c\uc6b0 \uceec\ub7ec \uc778\uae30, \uc2e0\ubc1c \uc8fc\uba38\ub2c8 \ucd94\uac00 \ud6c4 \ubc18\uc751 \ub354 \uc88b\uc74c'. \ub86f\ub370\uc7a0\uc2e4 '\uc0c8 \ubc31\ud329 \ub77c\uc778\uc5c5 \ubc18\uc751 \uc88b\uc74c'. \ub86f\ub370\uae30\ud765 '\uceec\ub7ec \ucd94\uac00\ub85c \uc218\uc694 \ubc1c\uc0dd \uae30\ub300'."},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 'V1\u00b7V2 \uc0c1\ud488 \ud53c\ub85c\uac10 \uc2ec\ud568, V3 \uac19\uc740 \uc2e0\uaddc \ub514\uc790\uc778 \ud544\uc694' \ubc18\ubcf5 \uc5b8\uae09. \ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0 'V1 \uc544\uc774\ubcf4\ub9ac \ubb3c\ud1b5 \uc218\ub0a9 \ucc0d\ucc0d\uc774 \ubc29\uc2dd \uace0\uac1d \uc758\ubb38'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uae30\ubcf8 \ubcfc\ucea1 \uc5ec\ub984 \uc18c\uc7ac \ubd80\uc871, \uc5ec\uc131 \ucea1 \ubaa8\uc790 \uc5c6\ub2e4\ub294 \ud53c\ub4dc\ubc31 \u591a'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\ub300\uc804 \uc0ac\uc774\uc988 \uae68\uc9d0 + \uc624\uc5fc \uc0c1\ud488 \uc785\uace0** \u2014 '\uc624\uc5fc \uc788\ub294 \uc0c1\ud488 \ub9ce\uc544 \uad6c\ub9e4 \ubabb\ud558\ub294 \uacbd\uc6b0 \u591a' \u2192 \ud488\uc9c8 \uad00\ub9ac \ud655\uc778"}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\uc5d0\uc5b4\ub9acW \uc2e0\uaddc\uceec\ub7ec","text":"**\uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec** \uc5ec\uc131 \uc120\ud638\ub3c4 \ub192\uc74c. \uc2e0\uc138\uacc4\ub300\uc804 '\uc610\ub85c\uc6b0 20~30\ub300, \ubc84\uac74\ub514 40\ub300 \uc120\ud638'. \ub86f\ub370\uc7a0\uc2e4 '\uc2e0\uaddc \uceec\ub7ec \ubc18\uc751 \uc88b\uc74c, \ubc0b\ubc0b\ud55c \ud654\uc774\ud2b8\ubcf4\ub2e4 \ud3ec\uc778\ud2b8 \uceec\ub7ec \uad6c\ub9e4'. \ud604\ub300\ud310\uad50 '\uadc0\uc5ec\uc6b4 \ud14c\ub2c8\uc2a4\ud654 \uc6d0\ud558\ub294 \uc5ec\uc131 \uace0\uac1d \uc5b4\ud544 \uc88b\uc544\uc9d0'. \ub2e8, \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc5d0\uc5b4\ub9ac \uac89\uba74 \ub531\ub531\ud55c \ucc29\ud654\uac10, \ubc1c \ucee4\ubcf4\uc774\ub294 \ub290\ub08c \ud53c\ub4dc\ubc31'."},{"tag":"\ubcfc\ud2b8\ud504\ub85c \uac15\uc138","text":"**\ubcfc\ud2b8\ud504\ub85c 1.5** \uc9c0\uc18d \uac15\uc138. \ucee4\ub125\ud2b8\uccad\uc8fc '\uc5d0\uc5b4\ub9ac\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ub300\ube44 \ubcfc\ud2b8\ud504\ub85c \ubc18\uc751 \uc555\ub3c4\uc801'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ubcfc\ud2b8\ud504\ub85c \ud310\ub9e4 \uc0c1\ub2f9\ud788 \uc88b\uc74c, \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ud310\ub9e4 \uc904\uc5b4\ub4dc\ub294 \ucd94\uc138'. \ub86f\ub370\uae30\ud765 '\ucc29\uc6a9\uac10 \uc704\uc8fc \uad6c\ub9e4, \ubcfc\ud2b8\ud504\ub85c \uc120\ud0dd \ub9ce\uc74c'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc2e0\uaddc \uceec\ub7ec \ubbf8\uc785\uace0 \ub9e4\uc7a5** (\ub86f\ub370\uc758\uc655 \ub4f1) \u2014 \uc785\uace0 \uc77c\uc815 \ud655\uc778 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ucf54\ud2b8\uae00\ub77c\uc774\ub4dc \uac00\uaca9 \uba54\ub9ac\ud2b8\ub85c \uc120\ud0dd\ud558\ub294 \uace0\uac1d \ub2e4\uc218 \ubc1c\uacac'. \ub86f\ub370\ucc3d\uc6d0 '\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c1.5 \ub2e8\uace8\uc774 \uc774\ubbf8 \ubcf4\uc720, \uc0c8 \uceec\ub7ec \ucd94\uac00 \uad6c\ub9e4 \uace0\ubbfc'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\uc5d0\uc5b4\ub9ac \ud06c\uac8c \uc778\uae30 \uc5c6\uc74c, \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \ubc18\uc751 \uc9c0\ucf1c\ubd10\uc57c'."}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub514\ud30c\uc774\uc5b4 \ub7f0\uce6d \ud310\ub9e4 \ubc18\uc751)","items":[{"tag":"\ub514\ud30c\uc774\uc5b4\ub7f0\uce6d\ubc18\uc751","text":"**\ub514\ud30c\uc774\uc5b4 \ub7f0\uce6d \uc0c1\uc138 \ubc18\uc751**: \uc2e0\uc138\uacc4\uac15\ub0a8 '\ud0c0\uc0ac \ub77c\ucf13 \uc0ac\uc6a9\uc790 70% + \uae30\uc874 \ube14\ub808\uc774\ub4dc \uc0ac\uc6a9\uc790 30% \uad6c\ub9e4'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc0ac\uc804\uc608\uc57d:\ubc29\ubb38 = 5:5, \uae30\uc874 \uc70c\uc2a8 \ucda9\uc131 \uace0\uac1d + \uc2e0\uaddc \uc720\uc785'. \ub86f\ub370\uc7a0\uc2e4 '\uc70c\uc2a8\ub9ac\uadf8 \uc120\uc218 4\uba85 \ub7f0\uce6d \ub2f9\uc77c \ubc29\ubb38, PRO 98 \uad6c\ub9e4'. \ud604\ub300\uc911\ub3d9 '\ub7f0\uce6d \ud6c4 \uc804\ud654 \uc608\uc57d\u2192\ubc29\ubb38 \uad6c\ub9e4, \uc7ac\uace0 \ub2f9\uc77c \uc18c\uc9c4'."},{"tag":"\ub514\ud30c\uc774\uc5b4\ub7f0\uce6d\ubc18\uc751","text":"\ub86f\ub370\uc758\uc655 '98PRO \ubaa8\ub378 \uc0ac\uc804\uc608\uc57d \uc8fc\ub3c4, \uc7ac\uace0 \ube60\ub978 \uc18c\uc9c4 \u2192 \uad6c\ub9e4 \uc6d0\ud558\ub294 \uace0\uac1d \ub300\uae30 \ubc1c\uc0dd'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\ub7f0\uce6d \ub0a0\uc9dc \uad6c\ub9e4 \ubb38\uc758 \uc804\ud654 \u2192 \ub2f9\uc77c \ubc29\ubb38 \uad6c\ub9e4 \uc5f0\uacb0'. LF\uad11\uc591 '\ub0a8\uc131 \uace0\uac1d \uad00\uc2ec\ub3c4 \ub192\uace0 \ud130\uce58\uc728 \ub192\uc74c'. \uc2a4\ud0c0\ud544\ub4dc\uc544\uc774\ud30c\ud06c '\uc790\uc810 \uc778\uc2a4\ud0c0 \ubcf4\uace0 \uc8fc\ubb38\ud558\ub294 \ub0b4\uc218 \uace0\uac1d \ube44\uc911 \ub192\uc74c."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub514\ud30c\uc774\uc5b4 \uc7ac\uace0 \uc18c\uc9c4 \ub9e4\uc7a5 \ubc1c\uc0dd** (\ud604\ub300\uc911\ub3d9\u00b7\ub86f\ub370\uc758\uc655 \ub4f1) \u2014 \ucd94\uac00 \ubc30\ubd84 \uac80\ud1a0 \ud544\uc694"},{"tag":"\uc774\uc288","text":"AK\uc6d0\uc8fc '\uac00\uaca9 \ubb38\uc758 \ud6c4 \uad6c\ub9e4 \uc804\ud658 \uc548 \ub428, \uc6d0\uc8fc \uc9c0\uc5ed \ub3d9\ud638\uc778 \ub9ce\uc544 \uace0\uc0ac\uc591 \ub77c\ucf13 \uc695\uc2ec \ub0ae\uc74c'. \uc2e0\uc138\uacc4\ub300\uc804 '\ub514\ud30c\uc774\uc5b4 \ubb38\uc758 \ub9ce\uc9c0 \uc54a\uc74c, \ucd9c\uc2dc\uc77c\u00b7\uc2a4\ud399 \uc18c\ub7c9 \ubb38\uc758'. \ub86f\ub370\ubd80\uc0b0 '\uad6c\ub825\uc790 \uc704\uc8fc \uad6c\ub9e4, \uc678\uad6d\uc778 \ubc18\uc751 \uc88b\uc74c'. \uc0ac\uc774\uba3c\ud30c\uc8fc '\ucda9\ub3d9 \uad6c\ub9e4\ub85c \ud310\ub9e4\ub41c \uace0\uac1d\ub3c4 \uc788\uc5c8\uc74c'."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uafb8\uc900\ud55c \ud310\ub9e4 \uc720\uc9c0. \uc2e0\uc138\uacc4\uac15\ub0a8 'EVO \uc2dc\ub9ac\uc988 \ud310\ub9e4 \uac00\uc7a5 \uc548\uc815\uc801'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc5d0\ubcfc\ub8e8\uc158\u00b7\uc62c\ud300 \ud310\ub9e4 \uc88b\uc74c'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc774\ubc88 \uc8fc \ud3ec\uc9c0 \uc2dc\ub9ac\uc988 \ud130\uce58\u00b7\ud310\ub9e4 \ub192\uc558\uc74c'."},{"tag":"\uc774\uc288","text":"\ub86f\ub370\uae30\ud765 '\uc88c\ud22c\uc6a9 \uae00\ub7ec\ube0c \ubb38\uc758 \uafb8\uc900, \uc785\uace0 \uc2dc \uc218\uc694 \ubd84\uba85'. \ucee4\ub125\ud2b8\uccad\uc8fc '\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc704\uc8fc, \uc0c8\ub85c\uc6b4 \ub77c\uc778 \uc5c6\ub0d0\ub294 \uace0\uac1d \ubb38\uc758'. \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0 '\ub18d\uad6c\uacf5 \uc8fc\ub9d0 \ud310\ub9e4 \uc800\uc870, \uc678\uad6d\uc778 \uad6c\ub9e4 \uc788\uc5c8\uc74c'."}]},"\uc0c1\uc124":{"title":"\uc0c1\uc124 \u2014 \ud310\ub9e4 \uc5b4\ub824\uc6b4 \uc810\u00b7\uc81c\uc548","items":[{"tag":"\uc774\uc288","text":"\ucee4\ub125\ud2b8\uccad\uc8fc '25FW \uc18c\ub7c9 \uc785\uace0 \uc0c1\ud488\uc774 \uae30\uc874 \uc0c1\uc124\ub77c\uc778\ubcf4\ub2e4 \ud310\ub9e4 \ub192\uc74c, \uc7ac\ubc29\ubb38 \ub2e8\uace8 \uc911\uc2ec'. \ub86f\ub370\uc758\uc655 '\uc5ec\ub984 \uc2dc\uc98c\uc5d0 FW \uc0c1\ud488 \uc785\uace0\ub3fc \uace0\uac1d \ub2c8\uc988 \ubd88\uc77c\uce58'. \ub86f\ub370\uae30\ud765 '\uceec\ub7ec\u00b7\uc0ac\uc774\uc988 \uae68\uc9d0 + \uc624\uc5fc \uc0c1\ud488 \u591a \u2192 \uad6c\ub9e4 \ubabb\ud558\ub294 \uacbd\uc6b0 \ubc1c\uc0dd'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud604\ub300\ub300\uc804 \uc5f0\ub3c4\ubcc4 \ud560\uc778\uc728 \uc774\uc288** \u2014 '24\ub144\ub3c4 \uc0c1\ud488\uc774 25\ub144\ub3c4 \uc0c1\ud488\ubcf4\ub2e4 \ud560\uc778 \uc548 \ub418\ub294 \uacbd\uc6b0 \uace0\uac1d \ud63c\ub780' \u2192 \ud560\uc778\uc728 \uc815\ucc45 \ud655\uc778 \ud544\uc694"},{"tag":"\uc774\uc288","text":"LF\uad11\uc591 '\uc815\uc0c1\u00b7\uc0c1\uc124 \uc0c1\ud488 \ube44\uad50 \uad6c\ub9e4 \uace0\uac1d \uc904\uc5b4 \uc0c1\uc124 \uad6c\ub9e4 \uac10\uc18c \uccb4\uac10'. \ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 '\uc0ac\uc774\uc988 \ucc44\uc6cc\uc9c4 SKU \uc801\uc5b4 \uc6d0\ud65c\ud55c \ud310\ub9e4 \uc5b4\ub824\uc6c0'."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 **\uc804\ubc18 \uac10\uc18c** \u2014 \uc5ec\ub984 \ud734\uac00\ucca0 + \ub0a0\uc528 \uc601\ud5a5. LF\uad11\uc591 -40~50%, \ud604\ub300\ub300\uc804\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc -30% \uc774\uc0c1, \uc2e0\uc138\uacc4\uad11\uc8fc -30~40% \uba85\uc2dc. \ub86f\ub370\ucc3d\uc6d0 '\uacf5\ub3d9\uc0ac\uc740\u00b7\uc0ac\uc740 \ud589\uc0ac \uc5c6\uc5b4 \uc785\uc810 \uac10\uc18c, \ub9e4\ucd9c\uc740 \uc804\uc8fc\uc640 \ube44\uc2b7'."},{"tag":"\ub3d9\ud5a5","text":"\ub098\uc778\uc6d0\ud55c\ub0a8 '\uc804\uc8fc \ub300\ube44 \ub0a0\uc528 \uc601\ud5a5\uc73c\ub85c \uc785\uc810\u00b7\ud310\ub9e4 \ubaa8\ub450 \uc99d\uac00 (\uc0c1\ub300\uc801)'. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\uc804\uc2dc\ud68c \uc774\uc288\ub85c \uc720\ub7fd\u00b7\ub0b4\uad6d\uc778 \uc720\uc785 \uc18c\ud3ed'. \ucee4\ub125\ud2b8\uccad\uc8fc '\ud2b8\ub798\ud53d \ud070 \ubcc0\ud654 \uc5c6\uc74c, \uac15\ub989\uae38\uac10\uc790 \ud31d\uc5c5\uc73c\ub85c 1~20\ub300 \uc720\uc785'. \uc2e0\uc138\uacc4\uac15\ub0a8 '7\uc6d4 2\uc8fc \uae30\ub2a5\uc131 \uc758\ub958\u00b7\uc2e0\uc0c1\ud488 \ud310\ub9e4 \ub9e4\uc6b0 \uc88b\uc74c, \ub514\ud30c\uc774\uc5b4 \uc5d0\ub108\uc9c0 \ud544\uc694'."},{"tag":"\ub3d9\ud5a5","text":"\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\uc8fc\ub9d0 \uc544\uc774\uc1fc\ud551\u00b7\uc5f0\ub839\ub300 \ub192\uc740 \uace0\uac1d \ube44\uc911 \ub192\uc74c, \ub77c\ucf54\uc2a4\ud14c 30% \ud560\uc778 \ud589\uc0ac \ub9e4\ub300\ub85c \uac00\uaca9 \ube44\uad50 \uace0\uac1d \uc99d\uac00'. \ub86f\ub370\ub3d9\ubd80\uc0b0 '\ud734\uac00\ucca0\u00b7\uacbd\uc81c \uaddc\uc81c \uc601\ud5a5\uc73c\ub85c \uadfc\ub798 \uac00\uc7a5 \uc801\uc740 \uc720\ub3d9\uc778\uad6c'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uc2e0\uc138\uacc4\ub300\uc804 '\uacbd\uc7c1 \ube0c\ub79c\ub4dc \uc2dc\uc98c\uc624\ud504 + \ud06c\ub85d\uc2a4 \ub300\ud615 \ud589\uc0ac\ub85c \uc785\uc810 \uac10\uc18c'. \uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\ub77c\ucf54\uc2a4\ud14c 30% \ud560\uc778 \ud589\uc0ac \ub9e4\ub300 \uc124\uce58 \uc9c0\uc18d'. \uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0 '\ud0c0 \ube0c\ub79c\ub4dc \ud560\uc778 \ud589\uc0ac\ub85c \uac00\uaca9 \ube44\uad50 \ud6c4 \ube44\uad6c\ub9e4 \uc99d\uac00'."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc5ec\uc131 S\u00b7M \uc0ac\uc774\uc988 \ud488\uc808 \ub2e4\uc218 \ub9e4\uc7a5","\ub9e4\uc7a5":"\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 \ub4f1","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \uc548\ub0b4"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\uc624\uc5fc \uc0c1\ud488 \uc785\uace0 \u2014 \uad6c\ub9e4 \ubabb\ud558\ub294 \uacbd\uc6b0 \u591a","\ub9e4\uc7a5":"\ub86f\ub370\uae30\ud765","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ud488\uc9c8 \uad00\ub9ac \ud655\uc778"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc2e0\uaddc \uceec\ub7ec \ubbf8\uc785\uace0 \ub9e4\uc7a5","\ub9e4\uc7a5":"\ub86f\ub370\uc758\uc655","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ub514\ud30c\uc774\uc5b4 \uc7ac\uace0 \uc18c\uc9c4 \ub9e4\uc7a5 \ubc1c\uc0dd","\ub9e4\uc7a5":"\ud604\ub300\uc911\ub3d9\u00b7\ub86f\ub370\uc758\uc655","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucd94\uac00 \ubc30\ubd84 \uac80\ud1a0"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ub514\ud30c\uc774\uc5b4 \uc7ac\uace0 \ub300\uae30 \uace0\uac1d \ubc1c\uc0dd","\ub9e4\uc7a5":"\ub86f\ub370\uc758\uc655","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\uc7ac\uc785\uace0 \uc77c\uc815 \uc548\ub0b4"},{"\uad6c\ubd84":"\uc0c1\uc124","\ub0b4\uc6a9":"24\ub144\ub3c4 \uc0c1\ud488 \ud560\uc778\uc728 \uc774\uc288 (\uace0\uac1d \ud63c\ub780)","\ub9e4\uc7a5":"\ud604\ub300\ub300\uc804","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ud560\uc778\uc728 \uc815\ucc45 \ud655\uc778"}]}},"7\uc6d43W":{"date":"07/13~07/19","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314 \uc804 \ub9e4\uc7a5 1\uc704 \uc720\uc9c0, \ub354\uc704\u00b7\uc7a5\ub9c8\ub85c \uae30\ub2a5\uc131 \uc18c\uc7ac \uc218\uc694 \ucd5c\uace0\uc870. \ub514\ud30c\uc774\uc5b4 \uc7ac\uace0 \uc18c\uc9c4 \ud6c4\uc5d0\ub3c4 \ubb38\uc758\u00b7\uc7ac\uc785\uace0 \ub300\uae30 \uace0\uac1d \uc9c0\uc18d \uae09\uc99d \u2014 10\uc6d4 \uc7ac\ucd9c\uc2dc\uae4c\uc9c0 \uc5f4\uae30 \uc720\uc9c0 \uc6b0\ub824. \uc62c\uc5b4\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \uc2e0\uaddc \uceec\ub7ec(\ubbfc\ud2b8\u00b7\ub77c\ubca4\ub354) \uc5ec\uc131 \ubc18\uc751 \uc88b\uc73c\ub098 \uad6c\ub9e4 \uc804\ud658\uc740 \uc9c0\ucf1c\ubd10\uc57c. \ubc14\uc774\uc800 SKU \ub2e4\uc591\ud654 \uae0d\uc815 \ubc18\uc751, \ub4dc\ub85c\uc6b0 V2 WHT \uc5ec\uc804\ud788 \uac15\uc138. \uc81c\ud5cc\uc808 \uc5f0\ud734\u00b7\ud734\uac00\ucca0\ub85c \uc785\uc810 \ud63c\uc7ac, \uc0c1\uc124 \uc778\uae30 \uc0ac\uc774\uc988 \uacf5\ubc31\uc73c\ub85c \ud310\ub9e4 \ub85c\uc2a4 \uc9c0\uc18d.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uc555\ub3c4\uc801 1\uc704 \uc720\uc9c0. \ub354\uc704\u00b7\uc7a5\ub9c8\ub85c \uae30\ub2a5\uc131\u00b7\uc18d\uac74 \uc18c\uc7ac \uc218\uc694 \ucd5c\uace0\uc870. \ub86f\ub370\ubd80\uc0b0 '\ub0a8\ub140 \ubd88\ubb38 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uac00\uc7a5 \uae30\ubcf8\uc73c\ub85c \ud310\ub9e4'. \uc2e0\uc138\uacc4\uad11\uc8fc '\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc
