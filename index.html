<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WILSON 주간현장피드백</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{
  --navy:#1B3A6B;--navy-dk:#122a52;--gold:#F5C400;--red:#c0392b;
  --red-bg:#fff5f5;--red-bd:#fcc;--green:#1a7a4a;--green-bg:#f0faf5;
  --bg:#f4f5f8;--border:#e2e6ed;--text:#1c1c2e;--muted:#6b7280;
  --card:#fff;--navy-rgb:27,58,107;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#2a4f8a;--navy-dk:#1a3560;--gold:#F5C400;
  --red:#e05c5c;--red-bg:#2d1a1a;--red-bd:#5a2828;
  --green:#2a9a5a;--green-bg:#1a2d23;
  --bg:#0f1623;--border:#2a3648;--text:#e8eaf0;--muted:#8a9ab5;
  --card:#1a2540;--navy-rgb:42,79,138;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#2a4f8a;--navy-dk:#1a3560;--gold:#F5C400;
  --red:#e05c5c;--red-bg:#2d1a1a;--red-bd:#5a2828;
  --green:#2a9a5a;--green-bg:#1a2d23;
  --bg:#0f1623;--border:#2a3648;--text:#e8eaf0;--muted:#8a9ab5;
  --card:#1a2540;--navy-rgb:42,79,138;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;}
header{background:var(--navy);height:56px;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.logo{font-size:18px;font-weight:700;color:#fff;letter-spacing:.03em;}.logo em{color:var(--gold);font-style:normal;}
.hbtns{display:flex;gap:6px;}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 13px;border-radius:18px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
.hbtn:hover{background:rgba(255,255,255,.22);}
.wtabs-wrap{background:var(--navy-dk);display:flex;padding:0 16px;overflow-x:auto;scrollbar-width:none;gap:1px;border-bottom:1px solid rgba(255,255,255,.08);}
.wtabs-wrap::-webkit-scrollbar{display:none;}
.wtab{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.45);font-size:12.5px;font-weight:500;padding:9px 14px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .18s;}
.wtab:hover{color:rgba(255,255,255,.8);}
.wtab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700;}
.layout{display:flex;max-width:1360px;margin:0 auto;}
.sidebar{width:185px;flex-shrink:0;padding:14px 0 14px 14px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow-y:auto;scrollbar-width:thin;}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;padding:0 7px;margin-bottom:7px;}
.sb-item{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 7px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .12s;margin-bottom:1px;line-height:1.35;}
.sb-item:hover{background:var(--border);color:var(--text);}
.sb-item.on{background:var(--navy);color:#fff;font-weight:600;}
.sb-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.main{flex:1;padding:18px 16px 80px;min-width:0;}
.whd{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.wpill{background:var(--navy);color:var(--gold);font-size:13px;font-weight:700;padding:4px 16px;border-radius:20px;}
.wdt{font-size:13px;color:var(--muted);}
.warn-bar{background:var(--red-bg);border:1.5px solid var(--red-bd);border-radius:10px;padding:12px 16px;margin-bottom:16px;}
.warn-bar-t{font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px;}
.wchips{display:flex;flex-wrap:wrap;gap:5px;}
.wchip{background:var(--card);border:1px solid var(--red-bd);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--red);font-weight:500;cursor:pointer;}
.wchip-group{margin-bottom:8px;}.wchip-group:last-child{margin-bottom:0;}
.wchip-cat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--navy);background:var(--card);border:1px solid var(--navy);border-radius:4px;padding:1px 7px;margin-bottom:5px;}
.csec{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden;scroll-margin-top:110px;}
.chd{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;}
.chd:hover{background:rgba(var(--navy-rgb),.04);}
.cicon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.ctitle{font-size:14px;font-weight:700;flex:1;}
.cchev{font-size:11px;color:var(--muted);margin-left:auto;transition:transform .2s;}
.csec.open .cchev{transform:rotate(180deg);}
.cbody{display:none;border-top:1px solid var(--border);}.csec.open .cbody{display:block;}
.sitem{padding:12px 17px;border-bottom:1px solid #f0f2f5;}.sitem:last-child{border-bottom:none;}
.stag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:5px;}
.stag.best{background:#fff9e0;color:#92400e;}.stag.change{background:#eff6ff;color:#1d4ed8;}
.stag.warn{background:var(--red-bg);color:var(--red);}.stag.proposal{background:#f5f3ff;color:#6d28d9;}
.stag.default{background:var(--bg);color:var(--muted);}
.stxt{font-size:13px;line-height:1.75;}.wt{color:var(--red);font-weight:600;}
.clt{width:100%;border-collapse:collapse;font-size:12.5px;}
.clt th{background:var(--bg);padding:8px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);}
.clt td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
.clt tr:last-child td{border-bottom:none;}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;}
.st.red{background:var(--red-bg);color:var(--red);}.st.green{background:var(--green-bg);color:var(--green);}
.st.blue{background:#eff6ff;color:#1d4ed8;}.st.gray{background:var(--bg);color:var(--muted);}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.mbg.hidden{display:none;}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-h{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;}
.modal-h h3{font-size:16px;font-weight:700;flex:1;}
.msrch{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 12px;color:#fff;font-family:inherit;font-size:13px;}
.msrch::placeholder{color:rgba(255,255,255,.5);}
.modal-cl{background:none;border:none;color:rgba(255,255,255,.7);font-size:20px;cursor:pointer;padding:0 4px;font-family:inherit;}
.sbtn-wrap{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px;max-height:200px;overflow-y:auto;}
.sbtn{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);}
.sbtn:hover{border-color:var(--navy);color:var(--navy);}
.sbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.sres{display:none;flex:1;overflow-y:auto;padding:0;}
.sres.on{display:block;}
.sres-name{font-size:16px;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--border);}
.sres-ch{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;}
.swblock{margin:0;padding:12px 18px;border-bottom:1px solid var(--border);}
.swlabel{display:inline-block;background:var(--navy);color:var(--gold);font-size:11px;font-weight:700;padding:2px 10px;border-radius:12px;margin-bottom:8px;}
.sfitem{padding:6px 0;border-bottom:1px dotted var(--border);font-size:12.5px;line-height:1.65;}
.sfitem:last-child{border-bottom:none;}
.sfcat{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:2px;}
.no-s{padding:20px 18px;color:var(--muted);font-size:13px;}
.bdmbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.bdmbg.hidden{display:none;}
.bdmodal{background:var(--card);border-radius:16px;width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
.bdmodal-h{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;}
.bdmodal-h h3{flex:1;font-size:15px;font-weight:700;}
.bd-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border);}
.bd-tab{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--muted);}
.bd-tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.bd-toggle{display:flex;gap:6px;padding:10px 14px 4px;}
.bd-toggle-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted);}
.bd-toggle-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.bd-cat-tabs{display:flex;flex-wrap:wrap;gap:5px;padding:6px 14px 10px;border-bottom:1px solid var(--border);}
.bd-cat-tab{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);}
.bd-cat-tab.on{background:#eff6ff;border-color:#1d4ed8;color:#1d4ed8;font-weight:700;}
.bd-content{flex:1;overflow-y:auto;padding:14px;}
.bd-store-block{margin-bottom:14px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.bd-store-name{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:7px 13px;}
.bd-fb-item{padding:9px 13px;border-bottom:1px solid var(--border);}
.bd-fb-item:last-child{border-bottom:none;}
.bd-fb-cat{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.bd-fb-text{font-size:12.5px;line-height:1.65;}
.loverlay{position:fixed;inset:0;background:rgba(27,58,107,.82);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.loverlay.hidden{display:none;}
.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.lmsg{color:#fff;font-size:15px;font-weight:600;}
.lsub{color:rgba(255,255,255,.65);font-size:12px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state-icon{font-size:52px;margin-bottom:16px;}
.empty-state h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}
.empty-state p{font-size:13px;line-height:1.7;max-width:360px;margin:0 auto;}
@media(max-width:700px){.sidebar{display:none;}.main{padding:14px 12px 60px;}}
</style>
</head><body>
<div id="loverlay" class="loverlay">
  <div class="spinner"></div>
  <div class="lmsg">📊 데이터 로딩 중...</div>
  <div class="lsub" id="lsub-msg">잠시만 기다려 주세요</div>
</div>

<header>
  <div class="logo">WILSON <em>주간현장피드백</em></div>
  <div class="hbtns">
    <button class="hbtn" onclick="openMod()">🏪 매장별 보기</button>
    <button class="hbtn" onclick="openBD()">📋 주차별BD</button>
  </div>
</header>

<div class="wtabs-wrap" id="wtabs"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<!-- STORE MODAL -->
<div class="mbg hidden" id="mbg" onclick="closeMod(event)">
  <div class="modal">
    <div class="modal-h">
      <h3>🏪 매장별 보기</h3>
      <input class="msrch" id="msrch" placeholder="매장 검색..." oninput="filterS(this.value)">
      <button class="modal-cl" onclick="closeMod()">✕</button>
    </div>
    <div class="sbtn-wrap" id="slist"></div>
    <div class="sres" id="sres"></div>
  </div>
</div>

<!-- BD MODAL -->
<div class="bdmbg hidden" id="bdMbg" onclick="closeBD(event)">
  <div class="bdmodal">
    <div class="bdmodal-h">
      <h3>📋 주차별 BD (원본 피드백)</h3>
      <button class="modal-cl" onclick="closeBD()">✕</button>
    </div>
    <div id="bdBody" style="display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0;"></div>
  </div>
</div>

<script>
var CAT_META={"판매베스트":{"icon":"🏆","color":"#92400e","bg":"#fff9e0"},"전주대비":{"icon":"📈","color":"#1d4ed8","bg":"#eff6ff"},"의류":{"icon":"👗","color":"#2563eb","bg":"#eff6ff"},"용품":{"icon":"🎒","color":"#7c3aed","bg":"#f5f3ff"},"신발":{"icon":"👟","color":"#d97706","bg":"#fffbeb"},"라켓":{"icon":"🎾","color":"#059669","bg":"#ecfdf5"},"팀스포츠":{"icon":"🏀","color":"#dc2626","bg":"#fef2f2"},"고객동향":{"icon":"👥","color":"#0369a1","bg":"#f0f9ff"},"경쟁사":{"icon":"🏷","color":"#475569","bg":"#f8fafc"},"상설":{"icon":"💰","color":"#64748b","bg":"#f8fafc"},"즉시체크":{"icon":"⚠","color":"#b91c1c","bg":"#fff5f5"}};
var STORE_CH={"스타필드수원":"쇼핑몰","신세계사우스시티":"백화점","더현대서울":"백화점","신세계강남":"백화점","더현대대구":"백화점","롯데월드몰":"쇼핑몰","현대판교":"백화점","현대천호":"백화점","롯데인천터미널":"백화점","사이먼여주":"아울렛","롯데의왕":"아울렛","신세계의정부":"백화점","롯데부산본점":"백화점","갤러리아광교":"백화점","신세계부산":"백화점","현대울산":"백화점","롯데동래":"백화점","김포공항롯데":"백화점","갤러리아수원":"백화점","현대킨텍스":"백화점","파르나스몰":"쇼핑몰","롯데본점":"백화점","신세계충청":"백화점","현대대구":"백화점","스타필드하남":"쇼핑몰","롯데잠실":"백화점","현대목동":"백화점","신세계경기":"백화점","스타필드고양":"쇼핑몰","현대미아":"백화점","롯데강남":"백화점","갤러리아명품관":"백화점","현대울산동구":"백화점","한양수자인":"기타","롯데대구":"백화점","신세계천안":"백화점"};

var WEEK_ORDER=[];
var SUMMARIES={};
var STORE_DATA_RAW={};
var weekStore={};
var cur=null;
var G_CHECK='즉시체크';
var bdCurWeek=null;
var bdViewMode='store';
var bdCurCat=null;
var BD_CATS=['의류','용품','신발','라켓','팀스포츠'];

// ─── GitHub Pages용 데이터 로드 ───────────────────────────
var DATA_BASE = '';  // 같은 경로

async function loadData(){
  try{
    var [metaRes, sumsRes, sdrARes, sdrBRes, sdrCRes] = await Promise.all([
      fetch(DATA_BASE+'data/meta.json?v='+Date.now()),
      fetch(DATA_BASE+'data/recent_sums.json?v='+Date.now()),
      fetch(DATA_BASE+'data/sdr_a.json?v='+Date.now()),
      fetch(DATA_BASE+'data/sdr_b.json?v='+Date.now()),
      fetch(DATA_BASE+'data/sdr_c.json?v='+Date.now())
    ]);
    var meta = await metaRes.json();
    var sums = await sumsRes.json();
    var sdrA = await sdrARes.json();
    var sdrB = await sdrBRes.json();
    var sdrC = await sdrCRes.json();

    if(meta.WEEK_ORDER) WEEK_ORDER = meta.WEEK_ORDER;
    if(sums.SUMMARIES) Object.assign(SUMMARIES, sums.SUMMARIES);
    [sdrA,sdrB,sdrC].forEach(function(s){
      if(s.STORE_DATA_RAW) Object.assign(STORE_DATA_RAW, s.STORE_DATA_RAW);
    });
  }catch(e){console.error('데이터 로드 오류',e);}
  rebuildWeekStore();
  renderAll();
  document.getElementById('loverlay').classList.add('hidden');
}

function rebuildWeekStore(){
  weekStore={};
  WEEK_ORDER.forEach(function(w){
    if(SUMMARIES[w]){
      weekStore[w]={date:SUMMARIES[w].date||'',summary:SUMMARIES[w],storeData:buildSD(w)};
    }
  });
  if(!cur||!weekStore[cur]){
    var wks=Object.keys(weekStore);
    cur=wks.length?wks[wks.length-1]:null;
  }
}

function buildSD(week){
  var out={};
  Object.keys(STORE_DATA_RAW).forEach(function(s){if(STORE_DATA_RAW[s][week])out[s]=STORE_DATA_RAW[s][week];});
  return out;
}

function renderAll(){renderTabs();renderSidebar();renderMain();renderStoreBtns();}

function renderTabs(){
  var wks=Object.keys(weekStore).sort(function(a,b){return WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b);});
  var MAX_RECENT=5;
  var html=wks.map(function(w,i){
    var isOld=(wks.length-1-i)>=MAX_RECENT;
    if(isOld) return '';
    return '<button class="wtab '+(w===cur?'on':'')+'" onclick="sw(\''+w+'\')">'+w+'</button>';
  }).join('');
  var oldWks=wks.slice(0,Math.max(0,wks.length-MAX_RECENT));
  if(oldWks.length){
    html='<button class="wtab" style="color:rgba(255,255,255,.3);font-size:12px" onclick="toggleOldTabs()">◀ 이전 '+oldWks.length+'주</button>'+html;
  }
  document.getElementById('wtabs').innerHTML=html;
}

var _oldTabsOpen=false;
function toggleOldTabs(){
  _oldTabsOpen=!_oldTabsOpen;
  var wks=Object.keys(weekStore).sort(function(a,b){return WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b);});
  var MAX_RECENT=5;
  var html='';
  if(_oldTabsOpen){
    wks.forEach(function(w,i){
      var isOld=(wks.length-1-i)>=MAX_RECENT;
      if(isOld) html+='<button class="wtab '+(w===cur?'on':'')+'" onclick="sw(\''+w+'\')">'+w+'</button>';
    });
  }
  html+='<button class="wtab" style="color:rgba(255,255,255,.3);font-size:12px" onclick="toggleOldTabs()">'+(_oldTabsOpen?'▶ 접기':'◀ 이전 '+(wks.length-MAX_RECENT)+'주')+'</button>';
  var recent=wks.slice(Math.max(0,wks.length-MAX_RECENT));
  recent.forEach(function(w){html+='<button class="wtab '+(w===cur?'on':'')+'" onclick="sw(\''+w+'\')">'+w+'</button>';});
  document.getElementById('wtabs').innerHTML=html;
}

function sw(w){cur=w;renderSidebar();renderMain();}

function renderSidebar(){
  var s=weekStore[cur]&&weekStore[cur].summary;
  if(!s){document.getElementById('sidebar').innerHTML='';return;}
  var h='<div class="sb-lbl">섹션 이동</div>';
  var SB_ORDER=['판매베스트','전주대비','의류','용품','신발','라켓','팀스포츠','상설','경쟁사','고객동향','즉시체크'];
  SB_ORDER.forEach(function(k){
    if(!s[k]||!CAT_META[k])return;
    var m=CAT_META[k];
    h+='<button class="sb-item" id="sb-'+k+'" onclick="goSec(\''+k+'\')"><span class="sb-dot" style="background:'+m.color+'"></span>'+esc(s[k].title||k)+'</button>';
  });
  document.getElementById('sidebar').innerHTML=h;
}

function goSec(k){
  var el=document.getElementById('sec-'+k);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.sb-item').forEach(function(b){b.classList.remove('on');});
  var sb=document.getElementById('sb-'+k);if(sb)sb.classList.add('on');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderMain(){
  var main=document.getElementById('main');
  if(!cur||!weekStore[cur]){
    main.innerHTML='<div class="empty-state"><div class="empty-state-icon">🎾</div><h2>윌슨 코리아 MD 대시보드</h2><p>데이터를 불러오는 중입니다...</p></div>';
    return;
  }
  var wd=weekStore[cur];var sm=wd.summary;
  var h='<div class="whd"><span class="wpill">'+cur+'</span>'+(wd.date?'<span class="wdt">'+wd.date+'</span>':'')+'</div>';
  var chks=(sm['즉시체크']&&sm['즉시체크'].items)||[];
  if(chks.length){
    var grouped={};
    var catOrder=['의류','용품','신발','라켓','팀스포츠'];
    chks.forEach(function(c){var cat=c['구분']||'기타';if(!grouped[cat])grouped[cat]=[];grouped[cat].push(c);});
    var allCats=Object.keys(grouped).sort(function(a,b){var ai=catOrder.indexOf(a),bi=catOrder.indexOf(b);if(ai===-1)ai=99;if(bi===-1)bi=99;return ai-bi;});
    h+='<div class="warn-bar"><div class="warn-bar-t">⚠️ 이번 주 즉시 체크</div>';
    allCats.forEach(function(cat){
      h+='<div class="wchip-group"><span class="wchip-cat">'+esc(cat)+'</span><div class="wchips">';
      grouped[cat].forEach(function(c){h+='<span class="wchip" onclick="goSec(G_CHECK)">'+esc(c['내용']||'')+'</span>';});
      h+='</div></div>';
    });
    h+='</div>';
  }
  var SEC_ORDER=['판매베스트','전주대비','의류','용품','신발','라켓','팀스포츠','상설','경쟁사','고객동향','즉시체크'];
  SEC_ORDER.forEach(function(key){
    if(!sm[key]||!CAT_META[key])return;
    var sec=sm[key];var m=CAT_META[key];
    h+='<div class="csec open" id="sec-'+key+'">'
      +'<div class="chd" onclick="toggleSec(this)">'
      +'<div class="cicon" style="background:'+m.bg+'">'+m.icon+'</div>'
      +'<span class="ctitle" style="color:'+m.color+'">'+esc(sec.title||key)+'</span>'
      +'<span class="cchev">▼</span></div>'
      +'<div class="cbody">';
    if(key==='즉시체크'){
      h+='<div style="padding:14px 16px;overflow-x:auto"><table class="clt"><tr><th style="width:65px">구분</th><th>내용</th><th style="width:150px">매장</th><th style="width:110px">상태</th><th>조치</th></tr>';
      (sec.items||[]).forEach(function(r){
        var st=r['상태']||'';
        var sc=st.indexOf('❌')>-1?'red':st.indexOf('✅')>-1?'green':st.indexOf('📌')>-1?'blue':'gray';
        h+='<tr><td><strong>'+esc(r['구분']||'')+'</strong></td><td>'+esc(r['내용']||'')+'</td><td style="font-size:11px;color:var(--muted)">'+esc(r['매장']||'')+'</td><td><span class="st '+sc+'">'+esc(st)+'</span></td><td style="font-size:12px">'+esc(r['조치']||'')+'</td></tr>';
      });
      h+='</table></div>';
    }else{
      (sec.items||[]).forEach(function(item){
        var tag=item.tag||'';
        var isW=tag.indexOf('⚠')>-1||tag.indexOf('즉시')>-1;
        var tc=isW?'warn':tag.indexOf('변화')>-1||tag.indexOf('상승')>-1||tag.indexOf('하락')>-1?'change':tag.indexOf('제안')>-1||tag.indexOf('기대')>-1||tag.indexOf('추천')>-1?'proposal':tag.indexOf('베스트')>-1||tag.indexOf('핵심')>-1||tag.indexOf('요약')>-1?'best':'default';
        var txt=esc(item.text||'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/(⚠[^<]*)/g,'<span class="wt">$1</span>');
        h+='<div class="sitem">'+(tag?'<span class="stag '+tc+'">'+esc(tag)+'</span>':'')+'<div class="stxt">'+txt+'</div></div>';
      });
    }
    h+='</div></div>';
  });
  main.innerHTML=h;
}

function toggleSec(hd){var sec=hd.closest('.csec');sec.classList.toggle('open');}

function renderStoreBtns(){
  var all={};
  Object.keys(STORE_DATA_RAW).forEach(function(s){all[s]=1;});
  document.getElementById('slist').innerHTML=Object.keys(all).sort().map(function(s){
    return '<button class="sbtn" onclick="showStore(\''+s+'\')">'+esc(s)+'</button>';
  }).join('');
}

function filterS(q){document.querySelectorAll('.sbtn').forEach(function(b){b.style.display=b.textContent.indexOf(q)>-1?'':'none';});}

function showStore(name){
  document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on');});
  document.querySelectorAll('.sbtn').forEach(function(b){if(b.textContent===name)b.classList.add('on');});
  var r=document.getElementById('sres');r.className='sres on';
  var ch=STORE_CH[name]||'';
  var h='<div class="sres-name">🏪 '+esc(name)+'<span class="sres-ch">'+esc(ch)+'</span></div>';
  var wks=WEEK_ORDER.filter(function(w){return weekStore[w]&&weekStore[w].storeData[name];});
  if(!wks.length){h+='<div class="no-s">이 매장의 피드백이 없습니다</div>';}
  else{
    wks.forEach(function(w){
      var fbs=(weekStore[w].storeData[name]||[]).filter(function(f){return f.topic.indexOf('※')===-1;});
      if(!fbs.length)return;
      h+='<div class="swblock"><span class="swlabel">'+w+'</span>';
      fbs.forEach(function(f){h+='<div class="sfitem"><div class="sfcat">'+esc(f.cat)+'</div>'+esc(f.fb)+'</div>';});
      h+='</div>';
    });
  }
  r.innerHTML=h;
}

function openMod(){document.getElementById('mbg').classList.remove('hidden');document.getElementById('msrch').focus();}
function closeMod(e){if(!e||e.target===document.getElementById('mbg')){document.getElementById('mbg').classList.add('hidden');document.getElementById('sres').className='sres';document.querySelectorAll('.sbtn').forEach(function(b){b.classList.remove('on');});}}

function openBD(){
  bdCurWeek=WEEK_ORDER.filter(function(w){return weekStore[w];}).slice(-1)[0]||null;
  renderBD();
  document.getElementById('bdMbg').classList.remove('hidden');
}
function closeBD(e){if(!e||e.target===document.getElementById('bdMbg')){document.getElementById('bdMbg').classList.add('hidden');}}

function renderBD(){
  var body=document.getElementById('bdBody');
  var weeks=WEEK_ORDER.filter(function(w){return weekStore[w];});
  var tabsHtml='<div class="bd-tabs">'+weeks.map(function(w){
    return '<button class="bd-tab '+(w===bdCurWeek?'on':'')+'" onclick="bdSwitchWeek(\''+w+'\')">'+w+'</button>';
  }).join('')+'</div>';
  var toggleHtml='<div class="bd-toggle"><button class="bd-toggle-btn '+(bdViewMode==='store'?'on':'')+'" onclick="bdSetView(\'store\')">🏪 매장별</button><button class="bd-toggle-btn '+(bdViewMode==='category'?'on':'')+'" onclick="bdSetView(\'category\')">📁 카테고리별</button></div>';
  if(bdViewMode==='category'){
    toggleHtml+='<div class="bd-cat-tabs">'+BD_CATS.map(function(c){return '<button class="bd-cat-tab '+(c===bdCurCat?'on':'')+'" onclick="bdSetCat(\''+c+'\')">'+c+'</button>';}).join('')+'</div>';
  }
  var wd=weekStore[bdCurWeek];
  var contentHtml='';
  if(!wd||!wd.storeData){contentHtml='<div class="no-s">데이터 없음</div>';}
  else{
    contentHtml+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span class="swlabel">'+bdCurWeek+'</span>'+(wd.date?'<span style="font-size:12px;color:var(--muted)">'+wd.date+'</span>':'')+'</div>';
    if(bdViewMode==='store'){
      var stores=Object.keys(wd.storeData).sort();
      if(!stores.length){contentHtml+='<div class="no-s">데이터 없음</div>';}
      else{stores.forEach(function(store){
        var fbs=(wd.storeData[store]||[]).filter(function(f){return f.topic.indexOf('※')===-1;});
        if(!fbs.length)return;
        contentHtml+='<div class="bd-store-block"><div class="bd-store-name">🏪 '+esc(store)+'</div>';
        fbs.forEach(function(f){
          contentHtml+='<div class="bd-fb-item"><div class="bd-fb-cat">['+esc(f.cat)+'] '+esc(f.topic)+'</div><div class="bd-fb-text">'+esc(f.fb)+'</div></div>';
        });
        contentHtml+='</div>';
      });}
    }else{
      var catEntries=[];
      Object.keys(wd.storeData).sort().forEach(function(store){
        (wd.storeData[store]||[]).forEach(function(f){if(f.cat===bdCurCat)catEntries.push({store:store,f:f});});
      });
      if(!catEntries.length){contentHtml+='<div class="no-s">'+esc(bdCurCat)+' 카테고리 피드백 없음</div>';}
      else{
        contentHtml+='<div class="bd-store-block"><div class="bd-store-name">📁 '+esc(bdCurCat)+' — '+catEntries.length+'개 매장</div>';
        catEntries.forEach(function(e){
          contentHtml+='<div class="bd-fb-item"><div class="bd-fb-cat">🏪 '+esc(e.store)+' — '+esc(e.f.topic)+'</div><div class="bd-fb-text">'+esc(e.f.fb)+'</div></div>';
        });
        contentHtml+='</div>';
      }
    }
  }
  body.innerHTML=tabsHtml+toggleHtml+'<div class="bd-content">'+contentHtml+'</div>';
}
function bdSwitchWeek(w){bdCurWeek=w;renderBD();}
function bdSetView(mode){bdViewMode=mode;if(mode==='category'&&!bdCurCat)bdCurCat=BD_CATS[0];renderBD();}
function bdSetCat(cat){bdCurCat=cat;renderBD();}

// 시작
loadData();
</script>
</body></html>
