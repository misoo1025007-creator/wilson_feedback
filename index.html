<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>윌슨 주간 현장 피드백</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root{--navy:#1B3A6B;--navy-dark:#122a52;--yellow:#F5C400;--red:#c0392b;--red-bg:#fff5f5;--red-bd:#fcc;--green:#1a7a4a;--green-bg:#f0faf5;--gray:#f4f5f8;--border:#e2e6ed;--text:#1c1c2e;--muted:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray);color:var(--text);font-size:14px;line-height:1.7;}
header{background:var(--navy);height:60px;display:flex;align-items:center;padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.logo{font-size:22px;font-weight:700;color:#fff;letter-spacing:.03em;}.logo em{color:var(--yellow);font-style:normal;}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}
.hbtn:hover{background:rgba(255,255,255,.22);}
.wtabs{background:var(--navy-dark);display:flex;padding:0 24px;overflow-x:auto;scrollbar-width:none;gap:2px;}
.wtabs::-webkit-scrollbar{display:none;}
.wtab{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.5);font-size:13px;font-weight:500;padding:10px 16px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;}
.wtab:hover{color:rgba(255,255,255,.85);}.wtab.on{color:var(--yellow);border-bottom-color:var(--yellow);font-weight:700;}.wtab.add{color:rgba(255,255,255,.35);font-size:12px;}
.layout{display:flex;max-width:1360px;margin:0 auto;}
.sidebar{width:190px;flex-shrink:0;padding:18px 0 18px 18px;position:sticky;top:100px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin;}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;padding:0 8px;margin-bottom:8px;}
.sb-item{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 8px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;margin-bottom:1px;line-height:1.35;}
.sb-item:hover{background:var(--border);color:var(--text);}.sb-item.on{background:var(--navy);color:#fff;font-weight:600;}
.sb-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.main{flex:1;padding:22px 18px 80px;min-width:0;}
.whd{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.wpill{background:var(--navy);color:var(--yellow);font-size:13px;font-weight:700;padding:4px 16px;border-radius:20px;}
.wdt{font-size:13px;color:var(--muted);}
.warn-bar{background:var(--red-bg);border:1.5px solid var(--red-bd);border-radius:10px;padding:13px 16px;margin-bottom:18px;}
.warn-bar-t{font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px;}
.wchips{display:flex;flex-wrap:wrap;gap:6px;}
.wchip{background:#fff;border:1px solid var(--red-bd);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--red);font-weight:500;cursor:pointer;}
.wchip:hover{background:#ffe5e5;}
.wchip-group{margin-top:8px;}
.wchip-group:first-of-type{margin-top:0;}
.wchip-cat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--navy);background:#fff;border:1px solid var(--navy);border-radius:4px;padding:1px 7px;margin-bottom:5px;}
.overall-box{background:#eef2ff;border:1.5px solid #c7d2fe;border-radius:10px;padding:13px 16px;margin-bottom:14px;}
.overall-t{font-size:12px;font-weight:700;color:#3730a3;margin-bottom:6px;}
.overall-txt{font-size:13px;line-height:1.75;color:#1e1b4b;}
.overall-inline{margin-top:12px;padding-top:12px;border-top:1px dashed var(--red-bd);}
.overall-inline-t{font-size:11.5px;font-weight:700;color:#3730a3;margin-bottom:6px;}
.overall-inline-txt{font-size:12.5px;line-height:1.75;color:#1e1b4b;}
.overall-top{background:#e0f2fe;border:2px solid #7dd3fc;border-radius:12px;padding:18px 22px;margin-bottom:18px;}
.overall-top-t{font-size:15px;font-weight:800;color:#075985;margin-bottom:8px;}
.overall-top-txt{font-size:15.5px;line-height:1.85;color:#0c4a6e;font-weight:500;}
.bd-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.bd-toggle{display:flex;gap:6px;margin-bottom:10px;}
.bd-toggle-btn{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted);}
.bd-toggle-btn:hover{border-color:var(--navy);}
.bd-toggle-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.bd-cat-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--border);}
.bd-cat-tab{background:#fff;border:1px solid var(--border);border-radius:16px;padding:5px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--text);}
.bd-cat-tab:hover{border-color:var(--navy);color:var(--navy);}
.bd-cat-tab.on{background:#eff6ff;border-color:#1d4ed8;color:#1d4ed8;font-weight:700;}
.bd-tab{background:var(--gray);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--muted);}
.bd-tab:hover{border-color:var(--navy);color:var(--navy);}
.bd-tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.bd-week-hd2{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.bd-week-pill{background:var(--navy);color:var(--yellow);font-size:12px;font-weight:700;padding:3px 12px;border-radius:16px;}
.bd-week-dt{font-size:12px;color:var(--muted);}
.bd-content{max-height:60vh;overflow-y:auto;}
.bd-store-block{margin-bottom:16px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.bd-store-name{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;}
.bd-fb-item{padding:10px 14px;border-bottom:1px solid #f0f2f5;}
.bd-fb-item:last-child{border-bottom:none;}
.bd-fb-cat{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.bd-fb-text{font-size:12.5px;line-height:1.7;color:var(--text);}
.csec{background:#fff;border-radius:12px;border:1px solid var(--border);margin-bottom:13px;overflow:hidden;scroll-margin-top:106px;}
.chd{display:flex;align-items:center;gap:10px;padding:13px 17px;cursor:pointer;user-select:none;}
.chd:hover{background:#fafbfd;}
.cicon{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.ctitle{font-size:14px;font-weight:700;flex:1;}
.cchev{font-size:11px;color:var(--muted);margin-left:auto;transition:transform .2s;}
.csec.open .cchev{transform:rotate(180deg);}
.cbody{display:none;border-top:1px solid var(--border);}.csec.open .cbody{display:block;}
.sitem{padding:13px 18px;border-bottom:1px solid #f0f2f5;}.sitem:last-child{border-bottom:none;}
.stag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:5px;}
.stag.best{background:#fff9e0;color:#92400e;}.stag.change{background:#eff6ff;color:#1d4ed8;}
.stag.warn{background:var(--red-bg);color:var(--red);}.stag.proposal{background:#f5f3ff;color:#6d28d9;}
.stag.insight{background:#f0fdf4;color:#166534;}.stag.normal{background:#f0f0f0;color:#444;}
.stxt{font-size:13.5px;line-height:1.8;color:var(--text);}.stxt strong{color:var(--navy);}.stxt .wt{color:var(--red);font-weight:600;}
.clt{width:100%;border-collapse:collapse;font-size:13px;}
.clt th{background:var(--navy);color:#fff;padding:8px 11px;text-align:left;font-size:11px;font-weight:600;}
.clt td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top;}
.clt tr:last-child td{border-bottom:none;}.clt tr:nth-child(even) td{background:#fafbfc;}
.st{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.st.red{background:#fdecea;color:var(--red);}.st.green{background:var(--green-bg);color:var(--green);}
.st.blue{background:#eff6ff;color:#1d4ed8;}.st.gray{background:#f0f0f0;color:#555;}
.upsec{display:flex;align-items:center;gap:10px;background:#fff;border:2px dashed var(--border);border-radius:10px;padding:14px 18px;margin-bottom:18px;cursor:pointer;}
.upsec:hover{border-color:var(--navy);}.upsec-t{font-size:13px;color:var(--muted);}.upsec-t strong{color:var(--navy);}
.loverlay{position:fixed;inset:0;background:rgba(27,58,107,.93);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.loverlay.hidden{display:none;}
.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ltxt{color:#fff;font-size:15px;font-weight:500;}.lsub{color:rgba(255,255,255,.6);font-size:12px;}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:56px;}
.mbg.hidden{display:none;}
.modal{background:#fff;border-radius:14px;width:92%;max-width:700px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.mhd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.msrch{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;outline:none;}
.msrch:focus{border-color:var(--navy);}
.mclose{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:4px;}
.mbody{overflow-y:auto;padding:14px 18px;flex:1;}
.slist{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.sbtn{border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;background:#fff;font-family:inherit;color:var(--text);}
.sbtn:hover{border-color:var(--navy);color:var(--navy);}.sbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.sres{display:none;}.sres.on{display:block;}
.sres-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sres-ch{font-size:12px;color:var(--muted);font-weight:400;}
.swblock{margin-bottom:16px;}
.swlabel{font-size:11px;font-weight:700;color:var(--muted);background:var(--gray);padding:3px 9px;border-radius:4px;display:inline-block;margin-bottom:7px;}
.sfitem{margin-bottom:7px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;line-height:1.65;}
.sfcat{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.no-s{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}
@media(max-width:768px){.sidebar{display:none;}.main{padding:14px 12px 60px;}.clt th,.clt td{padding:6px 8px;font-size:11px;}}
</style>
</head>
<body>
<div class="loverlay hidden" id="loverlay">
  <div class="spinner"></div>
  <div class="ltxt">AI가 피드백을 분석 중입니다</div>
  <div class="lsub">카테고리별로 요약하고 있어요...</div>
</div>
<div class="mbg hidden" id="mbg" onclick="closeMod(event)">
  <div class="modal">
    <div class="mhd">
      <input class="msrch" type="text" placeholder="매장명 검색..." id="msrch" oninput="filterS(this.value)">
      <button class="mclose" onclick="closeMod()">&#x2715;</button>
    </div>
    <div class="mbody">
      <div class="slist" id="slist"></div>
      <div class="sres" id="sres"></div>
    </div>
  </div>
</div>
<div class="mbg hidden" id="bdMbg" onclick="closeBD(event)">
  <div class="modal" style="max-width:760px;max-height:88vh;">
    <div class="mhd">
      <div style="font-size:16px;font-weight:700;color:var(--navy);flex:1;">&#x1F4CB; 주차별 BD (원본 피드백 백데이터)</div>
      <button class="mclose" onclick="closeBD()">&#x2715;</button>
    </div>
    <div class="mbody" id="bdBody" style="padding:18px 22px;"></div>
  </div>
</div>
<header>
  <div class="logo">WILSON <em>현장 피드백</em></div>
  <div style="display:flex;gap:8px;">
    <button class="hbtn" onclick="openBD()">&#x1F4CB; 주차별BD</button>
    <button class="hbtn" onclick="openMod()">&#x1F3EA; 매장별 보기</button>
  </div>
</header>
<div class="wtabs" id="wtabs"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

8\ub0b4"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uad11\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"\uad6c\ubd84":"\ub77c\ucf13","\ub0b4\uc6a9":"\ud640\uc138\uc77c \uac00\uaca9 \uc5ed\uc804 \uc774\uc288","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ub86f\ub370\uc7a0\uc2e4","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucc44\ub110 \uac00\uaca9 \uad00\ub9ac \uac80\ud1a0"},{"\uad6c\ubd84":"\ub9e4\uc7a5\uc624\uae30\uc785","\ub0b4\uc6a9":"\ucee4\ub125\ud2b8\uccad\uc8fc \ud300\uc2a4\ud3ec\uce20 \uce78\uc5d0 \ub77c\ucf13 \ub0b4\uc6a9 \uae30\uc785","\ub9e4\uc7a5":"\ucee4\ub125\ud2b8\uccad\uc8fc","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uc7ac\uc791\uc131 \uc694\uccad"}]}},"5\uc6d42W":{"date":"05/11~05/17","\uc804\uccb4\uc694\uc57d":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 W \uc7ac\uc785\uace0\ub85c \ud488\uc808 \ub85c\uc2a4 \ud574\uc18c, \uc5ec\uc131 \uace0\uac1d \uc989\uac01 \ud638\uc751. \ub4dc\ub85c\uc6b0 V2 \uc7ac\uc785\uace0 \ud3ed\ubc1c\uc801 \ubc18\uc751\uc73c\ub85c '\ud14c\ub2c8\uc2a4 \ud544\uc218 \uac00\ubc29' \uc785\uc9c0 \ud655\uace0. \uc2dc\uc5b4\uc544\uc774\uc2a4 \uc774\uc5fc \ubd88\ub7c9\uc774 2\uc8fc \uc5f0\uc18d \uc811\uc218\ub3fc \uc989\uc2dc \ub300\uc751 \ud544\uc694\ud55c \ud575\uc2ec \uc774\uc288\ub85c \ubd80\uc0c1. \ub18d\uad6c\uacf5\u00b7\uae00\ub7ec\ube0c \uc7ac\uace0\uac00 DP\ub9cc \ub0a8\ub294 \ub9e4\uc7a5 \ub2e4\uc218, \ubcfc\ud0c0\uc6cc \uc815\ucc45 \uc7ac\uac80\ud1a0 \ubaa9\uc18c\ub9ac. \uac00\uc815\uc758 \ub2ec \uc18c\ube44 \ubc18\ub3d9\uc73c\ub85c \uc785\uc810 20~40% \uac10\uc18c\ud588\uc73c\ub098 \ud14c\ub2c8\uc2a4 \ubaa9\uc801 \uace0\uac1d\uc740 \uc99d\uac00\uc138 \uc720\uc9c0.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 W \uc7ac\uc785\uace0 \ud6a8\uacfc** \uc989\uac01 \ubc18\uc601 \u2014 \ud488\uc808\ub85c \ub85c\uc2a4 \ubc1c\uc0dd\ud558\ub358 \ub9e4\uc7a5\ub4e4\uc774 \uc5ec\uc131 \uace0\uac1d \ud638\uc751\uc73c\ub85c \uc8fc\ub825 \ud310\ub9e4 \uc5f0\uacb0. \uc2dc\uc5b4\uc544\uc774\uc2a4 \uc218\uc694 \uc9c0\uc18d \uac15\uc138. \ub86f\ub370\uc7a0\uc2e4\uc740 \uc774\ubc88 \uc8fc \uc5ec\uc131 60:\ub0a8\uc131 40\uc73c\ub85c \ub0a8\uc131 \ube44\uc911 \uc18c\ud3ed \uc99d\uac00."},{"tag":"\ud2b9\uc774","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc758\ub958 \ud480\ucc29 \u2192 \uc2e0\ubc1c\u00b7\uac00\ubc29 \uc5f0\uacc4 \uad6c\ub9e4 \uace0\uac1d \ub298\uc5b4\ub098\ub294 \ud328\ud134' \uc8fc\ubaa9\ud560 \ubcc0\ud654. \ud4e8\uc5b4\ub4dc\ub77c\uc774\u00b7\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc591\uac15 \uad6c\ub3c4 \ud655\uace0."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 W \uc7ac\uc785\uace0** \ud6a8\uacfc \uc804\ub9e4\uc7a5 \uc989\uac01 \ubc18\uc601. \ud83d\udcc9 \uac00\uc815\uc758 \ub2ec \uc5f0\ud734 \uc18c\ube44 \ubc18\ub3d9\uc73c\ub85c \uc804\ubc18 \uc785\uc810 20~40% \uac10\uc18c (\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 -40%, \uc544\uc774\ud30c\ud06c -20%). \ud83d\udcc8 \ud14c\ub2c8\uc2a4 \uc2dc\uc98c \ubcf8\uaca9\ud654\ub85c \ud14c\ub2c8\uc2a4 \ubaa9\uc801 \uace0\uac1d\uc740 \ub86f\ub370\uc758\uc655\u00b7\uc2e0\uc138\uacc4\uad11\uc8fc +20%."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc218\uc694 \uc804\uc8fc\uc5d0 \uc774\uc5b4 \uc9c0\uc18d. \uae30\uc628 \uc0c1\uc2b9\uc73c\ub85c \uad00\uc2ec\ub3c4 \ub354 \uc62c\ub77c\uac00\ub294 \ud750\ub984. \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 W \uc7ac\uc785\uace0\ub85c \uc5ec\uc131 \uace0\uac1d \uc989\uac01 \ubc18\uc751."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2dc\uc5b4\uc544\uc774\uc2a4 ORG \uceec\ub7ec \uc0c9 \ubb3c\ube60\uc9d0(\uc774\uc5fc) \ubd88\ub7c9** (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591) \u2014 \uc804\uc8fc\uc5d0 \uc774\uc5b4 2\uc8fc \uc5f0\uc18d \uc811\uc218, \uc989\uc2dc \ud655\uc778\u00b7\ub9e4\uc7a5 \uacf5\uc2dd \ub2f5\ubcc0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \uc0ac\uc774\uc988 \uc9c0\uc18d \ud488\uc808** \u2014 \ub86f\ub370\uc778\ucc9c\u00b7\ub86f\ub370\uc758\uc655\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 \ub4f1 \ub2e4\uc218 \u2014 **FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \u2014 \ub9e4\uc7a5 \uc548\ub0b4 \ud544\uc694**"},{"tag":"\uc81c\uc548","text":"\ud53c\ud0a4\uc2a4\ud29c\ub514\uc624 \ubc18\ud314 \ubc84\uc804 \uc694\uccad \uc9c0\uc18d. \uc5ec\uc131 V\ub125\u00b7\ud5e8\ub9ac\ub125 \ud0d1 \uc694\uccad (\ud604\ub300\uc911\ub3d9). \ub0a8\uc131 \uc2ac\ub9ac\ube0c\ub9ac\uc2a4 \uceec\ub7ec \ub2e4\uc591\ud654 \uc694\uccad \ub2e4\uc218. \uc587\uc740 \ubc14\ub78c\ub9c9\uc774 \ube14\ub799 \uceec\ub7ec \ub2e4\uc591\ud654 (\uc2e0\uc138\uacc4\uc0ac\uc6b0\uc2a4\uc2dc\ud2f0)."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\uc5ec\ub984 \uc544\uc774\ud15c \ubc18\uc751)","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"**\ubc14\uc774\uc800** \uc804\ub9e4\uc7a5 \uc218\uc694 \uae09\uc99d, \ud654\uc774\ud2b8 \uceec\ub7ec \uc555\ub3c4\uc801 \uc120\ud638. **\uc554\uc2ac\ub9ac\ube0c** \ubcf8\uaca9 \uc218\uc694 \uc2dc\uc791. **\ub4dc\ub85c\uc6b0 V2 \uc7ac\uc785\uace0** \ubc18\uc751 \ud3ed\ubc1c\uc801 \u2014 \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 '\ud14c\ub2c8\uc2a4 \ud544\uc218 \uac00\ubc29\uc73c\ub85c \uc790\ub9ac\uc7a1\uc558\ub2e4'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 \uc218\ub7c9 \uc5ec\uc804\ud788 \ubd80\uc871** (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0) \u2014 \uadf8\ub808\uc774 \uceec\ub7ec \ubb38\uc758 \ub9ce\uc74c, \uc9c0\uc18d \ubaa8\ub2c8\ud130\ub9c1 \ubc0f \ub9ac\uc624\ub354 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubca0\uc77c \ub4dc\ub808\uc774\ud504 \ucea1 \ub9ac\uc624\ub354 \ud544\uc694** (\ud604\ub300\ubb34\uc5ed) \u2014 \uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc554\uc2ac\ub9ac\ube0c \uc6d0\uc0ac\uc774\uc988 \uc774\uc288 (\uc2e0\uc138\uacc4\ub300\uc804) '\ub0a8\ub140 \uc0ac\uc774\uc988 \uad6c\ubd84 \ucd9c\uc2dc \ud544\uc694'. \uc0c1\uc124 \ub9c8\uc2a4\ud06c \ub450\uaed8 \uc774\uc288 \u2014 \uc5ec\ub984\uc5d0 \ub450\uaecd\ub2e4\ub294 \uc758\uacac \ub2e4\uc218."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\uc5d0\uc5b4\ubca8 W 2\uc8fc\ucc28)","items":[{"tag":"\uc5d0\uc5b4\ubca8W","text":"\ub514\uc790\uc778 \ud638\uac10\ub3c4 \uc720\uc9c0\ub418\ub098 \uad6c\ub9e4 \uc804\ud658 \uc5ec\uc804\ud788 \uc800\uc870. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 \ubcfc\ud2b8\ud504\ub85c \uc785\uace0 \uc989\uc2dc \uc18c\uc9c4. \ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5\u00b7\ubcfc\ud2b8\ud504\ub85c 1.5 \uc591\uac15 \uc548\uc815\uc801 \uc720\uc9c0."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 2\uc8fc \uc5f0\uc18d** \u2014 \ub2e4\uc218 \ub9e4\uc7a5, \ub0a8\uc131 \uad6c\ub9e4 \uc774\ud0c8 \ubc18\ubcf5 \u2192 \uae34\uae09 \uc7ac\uc785\uace0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc5ec\uc131 \uc0ac\uc774\uc988 \ubd80\uc871** (\ud604\ub300\ub300\uc804) \u2014 \ud310\ub9e4 \ub85c\uc2a4 \ubc1c\uc0dd"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub7ec\uc26c\ud22c\uc5b4 \ubd88\ub7c9 \ud074\ub808\uc784 \uc9c0\uc18d** \u2014 \ube60\ub978 \uacf5\uc2dd \ub300\uc751 \uc548\ub0b4 \ud544\uc694"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d (\ub864\ub791\uac00\ub85c\uc2a4 \uc5d0\ub514\uc158)","items":[{"tag":"\ub864\ub791\uac00\ub85c\uc2a4","text":"\ub514\uc790\uc778 \uc694\uc18c: \ud758\ub9bc\uccb4\u00b7\ubb38\uc591 \uc804\ubc18 \uae0d\uc815. \ub0b4/\uc678\uad6d\uc778: \ub0b4\uad6d\uc778 90%+. \uc5ec/\ub0a8: \uc5ec\uc131 70~90%. \uc5f0\uacc4 \uc544\uc774\ud15c: \ub4dc\ub85c\uc6b0 V2 IVY\u00b7\ub864\ub791 \ub354\ud50c\ubc31\u00b7\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc14b\uc5c5 \uc21c."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud640\uc138\uc77c \uac00\uaca9 \uc5ed\uc804 \uc774\uc288 \uc9c0\uc18d** \u2014 \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \uac15\ud55c \uc6b0\ub824. \ub2e8 \ub098\uc778\uc6d0\ud55c\ub0a8\uc740 \ud640\uc138\uc77c \ud488\uc808 \ud6c4 \uc815\uc0c1 \ucc44\ub110 \uc720\uc785 \ub298\uae30 \uc2dc\uc791 (\uae0d\uc815 \uc2e0\ud638)"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 2\uc8fc** \u2014 \uae34\uae09 \uc7ac\uc785\uace0 \ud544\uc694"}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uafb8\uc900\ud55c \ud310\ub9e4. 10~20\ub300 \ud559\uc0dd\uce35 \uc8fc\ub825 \uace0\uac1d. \uac00\uc871 \ub2e8\uc704 \uad6c\ub9e4 \uc9c0\uc18d."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\ud3ec\uc9c0 DP \uc7ac\uace0\ub9cc \ub0a8\uc740 \ub9e4\uc7a5 \ub2e4\uc218** (\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ub354\ud604\ub300\uc11c\uc6b8) \u2014 '\ubcfc\ud0c0\uc6cc \uacf5 \uad6c\ub9e4 \uaebc\ub9ac\ub294 \uace0\uac1d\uc73c\ub85c \ud310\ub9e4 \ub85c\uc2a4' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \ubcfc\ud0c0\uc6cc \ucca0\uac70 \ub610\ub294 \ubcf4\uac15 \uc2dc\uae09** \u2014 \ubcfc\ud0c0\uc6cc \uc815\ucc45 \uac80\ud1a0 \ud544\uc694"}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 \uc804\ubc18 \uac10\uc18c. \uc2e0\uc138\uacc4\uad11\uc8fc -20%, \uc0ac\uc774\uba3c\ubd80\uc0b0 -20%. \uae30\uc628 \uc0c1\uc2b9\uc73c\ub85c \uc8fc\ub9d0 \ubc31\ud654\uc810 \uc785\uc810 \uc790\uccb4 \uac10\uc18c \ucd94\uc138. \ud14c\ub2c8\uc2a4 \uc2e0\uaddc \uc720\uc785\uc740 \uc9c0\uc18d (\ub86f\ub370\uc758\uc655 '\uc785\ubb38\uc790 \uc810\uc810 \ub298\uc5b4\ub098\ub294 \uc911'). \uc2e0\uc138\uacc4\uc13c\ud140 \ud06c\ub8e8\uc988 \uc785\ud56d\uc73c\ub85c \uc678\uad6d\uc778 \uc720\uc785."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uc5b8\ub354\uc544\uba38 \uc678\uad6d\uc778 \uc5ec\uad8c 20% / \ub098\uc774\ud0a4 \uc678\uad6d\uc778 10% / \ub9ac\ubcf5 10~20% / \uc544\ub514\ub2e4\uc2a4 \ub450\uc0b0\ubca0\uc5b4\uc2a4 \uc720\ub2c8\ud3fc \ud31d\uc5c5 \uc9c4\ud589 \uc911"}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc2dc\uc5b4\uc544\uc774\uc2a4 ORG \uc774\uc5fc \ubd88\ub7c9 2\uc8fc \uc5f0\uc18d","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc989\uc2dc \ud655\uc778\u00b7\ub9e4\uc7a5 \ub2f5\ubcc0"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uacf5\uc6a9 S\u00b7M \ubb38\uc758","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"FW \uc2e0\uc0c1 S\u00b7M \ud655\ub300 \uc608\uc815 \uc548\ub0b4"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ub4dc\ub85c\uc6b0 V2 \uc218\ub7c9 \ubd80\uc871 \uc9c0\uc18d","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0 \ub4f1","\uc0c1\ud0dc":"\ud83d\udd04 \ubaa8\ub2c8\ud130\ub9c1","\uc870\uce58":"\ucd94\uac00 \ub9ac\uc624\ub354 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc6a9\ud488","\ub0b4\uc6a9":"\ubca0\uc77c \ub4dc\ub808\uc774\ud504 \ucea1 \ub9ac\uc624\ub354","\ub9e4\uc7a5":"\ud604\ub300\ubb34\uc5ed","\uc0c1\ud0dc":"\u274c \ubbf8\uc9c4\ud589","\uc870\uce58":"\ub9ac\uc624\ub354 \uac80\ud1a0"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 2\uc8fc","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uae34\uae09 \uc7ac\uc785\uace0 \ud544\uc694"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \uc5ec\uc131 \uc0ac\uc774\uc988 \ubd80\uc871","\ub9e4\uc7a5":"\ud604\ub300\ub300\uc804","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ubcf4\ucda9"},{"\uad6c\ubd84":"\uc2e0\ubc1c","\ub0b4\uc6a9":"\ub7ec\uc26c\ud22c\uc5b4 \ubd88\ub7c9 \ud074\ub808\uc784 \uc9c0\uc18d","\ub9e4\uc7a5":"\ub2e4\uc218 \ub9e4\uc7a5","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uacf5\uc2dd \ub300\uc751 \uc548\ub0b4"},{"\uad6c\ubd84":"\ud300\uc2a4\ud3ec\uce20","\ub0b4\uc6a9":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 DP \uc7ac\uace0\ub9cc \ub0a8\uc74c","\ub9e4\uc7a5":"\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ub354\ud604\ub300\uc11c\uc6b8","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"\uad6c\ubd84":"\ud300\uc2a4\ud3ec\uce20","\ub0b4\uc6a9":"\ubcfc\ud0c0\uc6cc \uc815\ucc45 \uac80\ud1a0 \ud544\uc694","\ub9e4\uc7a5":"\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ucca0\uac70\u00b7\ubcf4\uac15 \ub17c\uc758"}]}},"5\uc6d43W":{"date":"05/18~05/24","\uc804\uccb4\uc694\uc57d":"\uc120\uc14b\ub9e4\uce58 \ub7f0\uce6d(5/22)\uc73c\ub85c \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uad6c\ub9e4 \ubb34\ub4dc \ud655\uc0b0, \uae30\ub2a5\uc131 \uc911\uc2ec\uc5d0\uc11c \ubd84\uc704\uae30 \uc804\ud658. \ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 \uc7ac\uc785\uace0 \uc989\uac01 \ubc18\uc751, \ub4dc\ub85c\uc6b0 V2 \uc7ac\uace0 \ubd80\uc871\uc740 \uacc4\uc18d \ubc1c\ubaa9. \ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 3\uc8fc\uc9f8, \uc5ec\uc131 \ud14c\ub9b0\uc774 1\uadf8\ub9bd \uc7ac\uace0\ub3c4 \ub3d9\ubc18 \ubd80\uc871 \uc2ec\ud654. \ubc1c\ubcfc \ub113\uc740 \uc218\uc785\ud654 \ubd80\uc7ac \ub4f1 \uc2e0\ubc1c \uc0ac\uc774\uc988\u00b7\ud54f \uc774\uc288 \ub2e4\uc218 \ub9e4\uc7a5 \uacf5\ud1b5 \uc81c\uae30. \ub300\uccb4 \uc5f0\ud734 \ud6a8\uacfc\ub85c \uc785\uc810 \ud63c\uc7ac, \uc804\ubc18 \uc18c\ube44 \uc704\ucd95\uc740 \uc9c0\uc18d.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\uc120\uc14b\ub9e4\uce58 \ub7f0\uce6d(5/22)** \ud6a8\uacfc\ub85c \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uad6c\ub9e4 \uace0\uac1d \uae09\uc99d. \ub0a8\uc131 \uc785\uc810 \ube44\uc911 \uc804\uc8fc \ub300\ube44 \uc0c1\uc2b9 (\uc2e0\uc138\uacc4\uac15\ub0a8 \uac15\ud55c \uc5b8\uae09). \ubca0\uc2a4\ud2b8: **\uc120\uc14b\ub9e4\uce58 \uc378\uba38 \ud2f0\uc154\uce20** > **\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5d0\uc774\uc2a4 W** > **\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc14b\uc5c5** \uc21c."},{"tag":"\ud2b9\uc774","text":"\uc2e0\uc138\uacc4\uad11\uc8fc \uc0ac\ud68c\uc801 \uc774\uc288\ub85c \ud3c9\uc77c \uc785\uc810 40% \uac10\uc18c, \uc8fc\ub9d0 \ud14c\ub2c8\uc2a4 \uace0\uac1d\uc73c\ub85c \uc120\ubc29. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc758\ub958 \uc81c\uc791 \uc2dc \uc2e0\ubc1c \uceec\ub7ec\ub97c 1\ucc28 \uae30\uc900\uc73c\ub85c \ud611\uc5c5' \uc81c\uc548 (\uc2e0\ubc1c\u2192\uc758\ub958 \ucf54\ub514 \uc21c\uc11c \uad6c\ub9e4 \uace0\uac1d \uc99d\uac00)."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uc120\uc14b\ub9e4\uce58 \ub7f0\uce6d** \u2014 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uad6c\ub9e4 \ubb34\ub4dc\ub85c \uc804\ud658, \uae30\ub2a5\uc131 \uad6c\ub9e4 \uc911\uc2ec\uc774\ub358 \uc804\uc8fc \ub300\ube44 \ubd84\uc704\uae30 \ud655\uc5f0\ud788 \ub2ec\ub77c\uc9d0. \ud83d\udcc8 **\ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 W \uc7ac\uc785\uace0** \u2014 \uae30\ub2e4\ub9ac\ub358 \uace0\uac1d \uc989\uac01 \ubc18\uc751, \uc7ac\uace0 \ube60\ub974\uac8c \uc18c\uc9c4 (\uc2e0\uc138\uacc4\uc13c\ud140). \ud83d\udcc9 \ub300\uccb4 \uc5f0\ud734 \ud6c4 \uc804\ubc18 \ud63c\uc7ac \u2014 \uc77c\ubd80 \uc99d\uac00, \uc804\ubc18 \uc18c\ube44 \uc704\ucd95 \uc9c0\uc18d."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (\uc120\uc14b\ub9e4\uce58\u00b7\uc5d8\ub9ac\ud2b8\ud37c\ud3ec\uba3c\uc2a4 \ub7f0\uce6d)","items":[{"tag":"\uc120\uc14b\ub9e4\uce58","text":"\uc774\ubc88 \uc8fc \uac00\uc7a5 \uc778\uae30. '\ud14c\ub2c8\uc2a4 \uadf8\ub798\ud53d\uc774 \uc544\ub2cc \uc5ec\ub984\u00b7\ud734\uac00 \uac10\uc131' \uc798 \uc804\ub2ec\ub428. 20~40\ub300 \ub0a8\ub140 \uacf5\ud1b5, \ucee4\ud50c \uad6c\ub9e4. \uc678\uad6d\uc778 \ub0a8\ub140\uc5d0\uac8c\ub3c4 \uc778\uae30 (\ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0)."},{"tag":"\uc5d8\ub9ac\ud2b8\ud37c\ud3ec\uba3c\uc2a4","text":"\uc9c4\uc131 \ud14c\ub2c8\uc2a4 \uace0\uac1d \uc911\uc2ec. '\ud0c0\uc774\ud2b8\ud55c \ud54f\u00b7\ub354\uc6cc \ubcf4\uc774\ub294 \uc18c\uc7ac' \uc778\uc2dd\uc774 \uc77c\ubd80 \uad6c\ub9e4 \uc7a5\ubcbd. \ub0a8\uc131 \ub0b4\uc7a5 \ubc18\ubc14\uc9c0 \uae30\ub2a5 \uae0d\uc815 \ud3c9\uac00 (\ud604\ub300\ud310\uad50)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc120\uc14b\ub9e4\uce58 NTS51 XS \uc0ac\uc774\uc988 \ubbf8\ucd9c\uc2dc** (\uc2e0\uc138\uacc4\ub300\uc804) \u2014 \uacf5\uc6a9 S\uac00 \ub9c8\ub978 \uc5ec\uc131\uc5d0\uac8c \ucee4\uc11c \uad6c\ub9e4 \ubbf8\uc5f0\uacb0 \u2192 \uc0ac\uc774\uc988 \uae30\ud68d \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc640\uc774\ub4dc\ud32c\uce20 \ub124\uc774\ube44 \ud488\uc808\u00b7\ube14\ub799 \ubbf8\ucd9c\uc2dc** (\uc2e0\uc138\uacc4\ub300\uc804) \u2014 \uc218\uc694 \ub192\uc740\ub370 \ub450 \uceec\ub7ec \ubaa8\ub450 \uc5c6\uc5b4 \uc544\uc26c\uc6c0 \u2192 \uc785\uace0 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub86f\ub370\uc778\ucc9c \ud0c0 \ub9e4\uc7a5 \uc785\uace0 \uc0c1\ud488 \ubbf8\uc785\uace0** \u2014 \ud648\ud398\uc774\uc9c0 \ubcf4\uace0 \ubc29\ubb38\ud55c \uace0\uac1d \uc751\ub300 \ubd88\uac00, \ud310\ub9e4 \ub85c\uc2a4 \u2192 \uc785\uace0 \ubc30\ubd84 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc120\uc14b\ub9e4\uce58 \uc785\uace0 \ub2f9\uc77c \uc0ac\uc774\uc988 \uc18c\uc9c4** (\uc544\uc774\ud30c\ud06c) \u2014 \ucd08\uae30 \ubb3c\ub7c9 \ud655\ubcf4 \ud544\uc694"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\uc120\uc14b\ub9e4\uce58 \ubcfc\ucea1\u00b7\ud06c\ub8e8\uc0ad\uc2a4\u00b7\ub9ac\ubcf8\ub2c8\uc0ad\uc2a4 \ubc18\uc751)","items":[{"tag":"\ub9ac\ubcf8\ub2c8\uc0ad\uc2a4","text":"\uc7ac\uc785\uace0 \uc989\uac01 \ubc18\uc751, \uc2e0\uc138\uacc4\uc13c\ud140 '\uc7ac\uace0 \ube60\ub974\uac8c \uc18c\uc9c4'. \uafb8\uc900\ud55c \uc218\uc694 \ud655\uc778."},{"tag":"\uc120\uc14b\ub9e4\uce58 \uc6a9\ud488","text":"\ubcfc\ucea1: \ud130\uce58 \uc788\uc73c\ub098 \uad6c\ub9e4 \uc804\ud658 \ub0ae\uc74c '\uc5ec\ub984\uc5d0 \ub354\uc6b8 \uac83'. \ud06c\ub8e8\uc0ad\uc2a4: \ub300\ubd80\ubd84 \ub9e4\uc7a5 \ubc18\uc751 \ubbf8\ubbf8, \uc870\uae08 \ub354 \uc9c0\ucf1c\ubcfc \ud544\uc694."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 WHT\u00b7IVY \uc7ac\uace0 \ubd80\uc871 \uc9c0\uc18d** (\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\uc0ac\uc774\uba3c\ud30c\uc8fc \ub4f1) \u2014 V2 WHT\u00b7IVY \ub2e4\uc218 \ubb38\uc758, \uc7ac\uace0 \uc5c6\uc5b4 \ud0c0 \uc0c1\ud488 \uc720\ub3c4 \uc911"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc81c\uc870\uad6d \ud45c\uae30 \uc774\uc288** (\ud604\ub300\ubb34\uc5ed) \u2014 \uc81c\uc870\uad6d \ub54c\ubb38\uc5d0 \uad6c\ub9e4 \ubabb\ud558\ub294 \uace0\uac1d \ubc1c\uc0dd \u2192 \ud655\uc778 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub9ac\ubcf8 \ub2c8\uc0ad\uc2a4 \ub124\uc774\ube44 \uceec\ub7ec \ub9ac\uc624\ub354 \uc694\uccad** (\ud604\ub300\ud310\uad50\u00b7\ub86f\ub370\uc778\ucc9c) \u2014 \ub9ac\uc624\ub354 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\uc790\uc678\uc120 \ucc28\ub2e8 \uc2a4\ud0c0\ud0b9 \uc218\uc694 (AK\uc6d0\uc8fc) '\ub2c8\uc0ad\uc2a4\ubcf4\ub2e4 \uc2a4\ud0c0\ud0b9 \ucc3e\ub294 \uace0\uac1d \ub354 \ub9ce\uc74c'. \uc624\uc194\ub77c\uc774\ud2b8 \uc778\uc194 \ub2e8\ud488 \ud310\ub9e4 \ubb38\uc758 (\uc2e0\uc138\uacc4\ub300\uc804)."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ubcfc\ud2b8\ud504\ub85c 1.5\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc591\uac15 \uc720\uc9c0. \uae30\uc628 \uc0c1\uc2b9\uc73c\ub85c \uacbd\ub7c9 \ud14c\ub2c8\uc2a4\ud654 \uc218\uc694 \ubcf8\uaca9 \uc0c1\uc2b9. \ud074\ub808\uc774 \ucf54\ud2b8\uc6a9 \uc2e0\ubc1c \ud310\ub9e4 \uc99d\uac00 (\ub86f\ub370\uc7a0\uc2e4)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubc1c\ubcfc \ub113\uc740 \uc218\uc785\ud654 \ubd80\uc7ac** (\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0) \u2014 '\ub7ec\uc26c \uacc4\uc5f4 \ubc1c\ubcfc \ub113\uc740 \uc218\uc785\ud654 \ud544\uc694, \ub9ac\uc2a4\ud3f0\uc2a4\ub85c \ub300\uccb4\ud558\ub098 \ubd88\ub9cc\uc871'"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\uc5b4\ub9ac W \uc0ac\uc774\uc988 \ubd80\uc871 \ud310\ub9e4 \ub85c\uc2a4** (\ub86f\ub370\ubd80\uc0b0) \u2014 \u2705 6/29 \uc785\uace0 \uc608\uc815, \ub9e4\uc7a5 \uc548\ub0b4 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc624\uc194\ub77c\uc774\ud2b8 \uc778\uc194 \ub2e8\ud488 \ud310\ub9e4 \ubb38\uc758 \uae09\uc99d** (\uc2e0\uc138\uacc4\ub300\uc804) '\uad49\uc7a5\ud788 \ub9ce\uc740 \ubb38\uc758' \u2192 \ub2e8\ud488 \ud310\ub9e4 \uac00\ub2a5 \uc5ec\ubd80 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub7ec\uc26c\ud22c\uc5b4 \ub0b4\uad6c\uc131 \uc774\uc288\ub85c \uc801\uadf9 \ucd94\ucc9c \uc5b4\ub824\uc6b4 \uc0c1\ud669** (\ucee4\ub125\ud2b8\uccad\uc8fc) '\uc0ac\uc804\uc5d0 \ub0b4\uad6c\uc131 \uc774\uc288 \uace0\uc9c0 \uc911' \u2192 \uacf5\uc2dd \uc548\ub0b4 \uc9c0\uc18d \ud544\uc694"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ub864\ub791\uac00\ub85c\uc2a4 \uc5d0\ub514\uc158 \uc804\uc8fc \ub300\ube44 \uc0c1\uc2b9\uc138 (\ub86f\ub370\uc758\uc655 '\uc804\uc8fc \ub300\ube44 \ud655\uc2e4\ud788 \ud130\uce58\u00b7\ud310\ub9e4 \uc62c\ub77c\uc634'). \ube14\ub808\uc774\ub4dc V10 \uafb8\uc900\ud558\ub098 \ucd08\ubc18 \ub300\ube44 \uc548\uc815\ud654 \ub2e8\uacc4. \ud14c\ub9b0\uc774 \uc785\ubb38 \uace0\uac1d \ub77c\ucf13 \uad6c\ub9e4 \uc99d\uac00."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 3\uc8fc \uc5f0\uc18d** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\ucee4\ub125\ud2b8\uccad\uc8fc\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \ub4f1) \u2014 \ub0a8\uc131 \uad6c\ub9e4 \uc774\ud0c8 \ubc1c\uc0dd \u2192 \uae34\uae09 \uc7ac\uc785\uace0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 \ud14c\ub9b0\uc774 1\uadf8\ub9bd \uc7ac\uace0 \ubd80\uc871** (\uc0ac\uc774\uba3c\uc5ec\uc8fc) '\ucee4\ud50c \ud14c\ub9b0\uc774 \uace0\uac1d \ub9ce\uc774 \ub193\uce58\ub294 \uc911' \u2192 \uc785\uace0 \uac80\ud1a0"},{"tag":"\ud2b8\ub80c\ub4dc","text":"\ud83d\udccc **\ud53c\ud074\ubcfc \ub77c\ucf13 \ubb38\uc758 \uc99d\uac00** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0) '\uc774\ubc88 \uc8fc \uc720\ub3c5 \ub9ce\uc558\uc74c' \u2192 \uc218\uc694 \ud2b8\ub80c\ub4dc \ubaa8\ub2c8\ud130\ub9c1"}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uafb8\uc900\ud55c \ud310\ub9e4. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc70c\uc2a8 \ub18d\uad6c\uacf5\uc774 \ud328\uc154\ub108\ube14 \ube0c\ub79c\ub4dc\ub85c \uc778\uc2dd\ub418\uba70 \uc778\ud14c\ub9ac\uc5b4\u00b7\uc778\uc99d\uc0f7 \ubaa9\uc801 \uad6c\ub9e4\ub3c4 \uc99d\uac00' \uc8fc\ubaa9."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uc7ac\uace0 \ubd80\uc871 \ub2e4\uc218** (\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8\u00b7\ub354\ud604\ub300\uc11c\uc6b8\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) '\uc8fc\ub825 \uc0c1\ud488 DP\ub9cc \ub0a8\uac70\ub098 \uc7ac\uace0 \uac70\uc758 \uc5c6\uc74c' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc0ac\uc774\uba3c\ud30c\uc8fc \ubb34\uc2e0\uc0ac \uc785\uc810 \ud6c4 \uc911\uace0\ub4f1\ud559\uc0dd \uc720\uc785 \uc99d\uac00. '\uc885\ub958 \ub9ce\uc9c0 \uc54a\ub2e4\ub294 \uc544\uc26c\uc6c0 \ubc18\ubcf5, SKU \ub2e4\uc591\ud654 \ud544\uc694'. \uc628\ub77c\uc778 \uac00\uaca9 \ube44\uad50 \uace0\uac1d \uc99d\uac00 (\uc0ac\uc774\uba3c\ud30c\uc8fc\u00b7\uc0ac\uc774\uba3c\ubd80\uc0b0)."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ub300\uccb4 \uc5f0\ud734(\uc6d4\uc694\uc77c) \ud6a8\uacfc\ub85c \uc77c\ubd80 \ub9e4\uc7a5 \uc99d\uac00, \uc804\ubc18\uc801\uc73c\ub85c \uc18c\ube44 \uc704\ucd95 \uc9c0\uc18d. \ub354\ud604\ub300\uc11c\uc6b8 \ud53c\ud06c\ubbfc\u00b7\ucf00\ub370\ud5cc \ud589\uc0ac\ub85c \uac00\uc871 \ub2e8\uc704 \uc720\uc785 \uc99d\uac00. \uc2e0\uc138\uacc4\uc13c\ud140 \ud06c\ub8e8\uc988 \uc785\ud56d \uc9c0\uc18d."}]},"\uacbd\uc7c1\uc0ac": '\uc624\ud508 \uc774\ub798 \uac00\uc7a5 \ub77c\ucf13 \ud310\ub9e4 \uc88b\uc740 \ub2ec' \u2014 \ube14\ub808\uc774\ub4dc V9\u2192V10 \uad50\uccb4 \uc218\uc694 + \ub864\ub791\uac00\ub85c\uc2a4 \ub7f0\uce6d \uc2dc\ub108\uc9c0 \uc808\uc815."},{"tag":"\ud2b9\uc774","text":"\ud640\uc138\uc77c \uc7ac\uace0 \uc18c\uc9c4 \uc2dc\uc791 \u2192 \uc2a4\ud0c0\ud544\ub4dc\uace0\uc591\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8 '\ud640\uc138\uc77c \ud488\uc808 \uc774\ud6c4 \uc815\uc0c1 \ucc44\ub110 \uc720\uc785 \uc99d\uac00' \uc804\uc8fc \uc608\uace0 \ud604\uc2e4\ud654. \uc120\uc14b\ub9e4\uce58 \ub9c1\uac70 \uc2ac\ub9bc \ud2f0\uc154\uce20 (\uc5ec\uc131) \ud310\ub9e4 \uac15\uc138 \u2014 '\ud06c\ub86d\ud558\uc9c0 \uc54a\uc740 \uc801\ub2f9\ud55c \uae30\uc7a5\uac10\u00b7\uc2ac\ub9bc\ud54f\u00b7\uc77c\uc0c1 \uacb8\uc6a9'."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uc120\uc14b\ub9e4\uce58 \uad6c\ub9e4 \ubcf8\uaca9\ud654** \u2014 \uc804\uc8fc \ub300\ube44 \uc2e4\uad6c\ub9e4 \uc5f0\uacb0 \ub208\uc5d0 \ub744\uac8c \uc99d\uac00. \ud83d\udcc8 **\ud640\uc138\uc77c \uc7ac\uace0 \uc18c\uc9c4 \u2192 \uc815\uc0c1 \ucc44\ub110 \uc720\uc785 \uc99d\uac00** \u2014 \ub098\uc778\uc6d0\ud55c\ub0a8\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591 \uae0d\uc815 \uc2e0\ud638. \ud83d\udcc9 \uc6d4\ub9d0 \uc18c\ube44 \uc9d1\uc911 \ud6c4 \ub454\ud654, \ub354\uc6cc\uc9c4 \ub0a0\uc528\ub85c \uc8fc\ub9d0 \uc544\uc774\uc1fc\ud551 \uace0\uac1d \uc99d\uac00 / \uad6c\ub9e4 \uace0\uac1d \uac10\uc18c."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (\uc120\uc14b\ub9e4\uce58 \uc2ec\uce35 \ud53c\ub4dc\ubc31)","items":[{"tag":"\uc120\uc14b\ub9e4\uce58 \uad6c\ub9e4\uce35","text":"\ud14c\ub2c8\uc2a4:\uc77c\ubc18 = 50~70%:30~50%. \uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8\ucc98\ub7fc \uc720\ub3d9 \uace0\uac1d \ub9ce\uc740 \ub9e4\uc7a5\uc740 \uc77c\ubc18 60%\uae4c\uc9c0. \ub9c1\uac70 \uc2ac\ub9bc \ud2f0\uc154\uce20 \uacf5\ud648 \ub8e9 \uadf8\ub300\ub85c \uad6c\ub9e4\ud558\ub294 \uace0\uac1d \u591a (\ub098\uc778\uc6d0\ud55c\ub0a8)."},{"tag":"\ud0c0\uc774\ub2e4\uc789","text":"\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \ubc18\uc751 \uac70\uc758 \uc5c6\uc74c \u2014 '\uba74 \uc18c\uc7ac \ub450\uaecd\uac8c \ub290\uaef4\uc9d0, \ucde8\ud5a5 \ud0c0\ub294 \ub514\uc790\uc778'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc120\uc14b\ub9e4\uce58 NTS52 \ubc11\ub2e8 \uc6cc\uc2f1 \ubd80\uc815 \ubc18\uc751** (\uc2e0\uc138\uacc4\uad11\uc8fc) \u2014 '\uc6cc\uc2f1 \ucc98\ub9ac \uace0\uac1d \ud638\uc751 \ub0ae\uc74c, \ubc31\uadf8\ub798\ud53d \uc720\uc9c0 \uad8c\uc7a5' \u2192 \ub514\uc790\uc778 \ud53c\ub4dc\ubc31 \uc804\ub2ec"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub0a8\uc131 \uc1fc\uce20 \uae30\uc7a5 \uc9e7\uc74c\u00b7\ubca8\ud06c\ub85c\u2192\uc9c0\ud37c \uc120\ud638** (\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8) \u2014 '\ubc84\ubba4\ub2e4 \ud54f \uc694\uccad, \ud3ec\ucf13 \ubc29\uc2dd \ubcc0\uacbd \ud544\uc694' \u2192 \ucc28\uae30 \uc2dc\uc98c \uae30\ud68d"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc120\uc14b\ub9e4\uce58 \uc1fc\uce20 S \uc0ac\uc774\uc988 \ubbf8\ucd9c\uc2dc** (\uc2e0\uc138\uacc4\ub300\uc804) \u2014 '\uc8fc\ub2c8\uc5b4\u00b7\ub9c8\ub978 \uc5ec\uc131\u00b7\ub9c8\ub978 \ub0a8\uc131 \uc218\uc694 \ub9ce\uc73c\ub098 \ub300\uc751 \ubd88\uac00' \u2192 \uc0ac\uc774\uc988 \uae30\ud68d \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 \ubca0\uc774\uc2a4\ub77c\uc778 \uc1fc\uce20 \uc774\ub108 \ub808\uae45\uc2a4 \uc5c6\uc5b4 \uc785\uae30 \ubd80\ub2f4** (\ub098\uc778\uc6d0\ud55c\ub0a8\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8) \u2014 \uc774\ub108 \ud3ec\ud568 \ub610\ub294 \uc548\uac10 \ubcf4\uc644 \uc694\uccad"},{"tag":"\uc81c\uc548","text":"\uc2e0\uc138\uacc4\uac15\ub0a8: '\ud37c\ud3ec\uba3c\uc2a4 \uc0c1\ud488\uc758 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \ubb34\ub4dc\ud654 \uac00\uc18d \ud544\uc694, \uce74\ud14c\uace0\ub9ac \uac04 \uc5f0\uacc4 \ud310\ub9e4 \uac15\ud654'. \uc2ec\ud50c \uadf8\ub798\ud53d 20~50\ub300 \ud1b5\uc6a9 \ub514\uc790\uc778 \ucd94\uac00 \uc694\uccad."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\uc120\uc14b\ub9e4\uce58 \ubcfc\ucea1\u00b7\ud06c\ub8e8\uc0ad\uc2a4)","items":[{"tag":"\uc120\uc14b\ub9e4\uce58 \uc6a9\ud488","text":"\ubcfc\ucea1: \ud551\ud06c \uceec\ub7ec \ubc18\uc751 \uadf8\ub098\ub9c8 \ub098\uc740 \ud3b8. '\uae4a\uc774\uac10 \uc5c6\ub2e4' (\uc0ac\uc774\uba3c\ubd80\uc0b0). \ud06c\ub8e8\uc0ad\uc2a4: \uc804\ubc18 \ubc18\uc751 \ubbf8\ubbf8, \ud551\ud06c \ub2e8\ub3c5 \uc18c\ud3ed \uad6c\ub9e4. \uc758\ub958 \uc5f0\uacc4 \ud310\ub9e4: \uc628\ub77c\uc778 \ubcf4\uace0 \ud480\uc14b \uad6c\ub9e4 \uace0\uac1d\uc5d0\uac8c\ub9cc \uc131\uc0ac."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 \uc7ac\uc785\uace0 \ub300\uae30 \uace0\uac1d \ub2e4\uc218** (\ud604\ub300\ub300\uc804\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) \u2014 '\ub9ac\uc624\ub354 \uae30\ub2e4\ub9ac\uaca0\ub2e4\ub294 \uace0\uac1d' \u2192 \uc785\uace0 \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc591\ub9d0 \uc7ac\uace0 \uc18c\uc9c4 \ube60\ub984** (\ud604\ub300\ub300\uc804) \u2014 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\uc774\uc288","text":"\ud22c\uc5b4\ubc31\u00b7\uc5ec\uc131 \uc18c\ud615 \ud22c\uc5b4\ubc31 \ubb38\uc758 \uc99d\uac00 (\ub098\uc778\uc6d0\ud55c\ub0a8) '\uc62c\ub77c\uc6b4\ub4dc \uc9d0\ubc31 \ud310\ub9e4 \ub9ce\uace0 \uc2ec\ud50c\ud55c \uc5ec\uc131\uc6a9 \ud22c\uc5b4\ubc31 \ubb38\uc758 \ub298\uc5b4' \u2192 \uae30\ud68d \ucc38\uace0. \uac00\ucc9c\ub300 \ud0c0\uc774\ube0c\ub808\uc774\ud06c \ub3d9\uc544\ub9ac \uc18c\ub2e8\uccb4 \uad6c\ub9e4 (\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131)."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\uc5d0\uc5b4\ubca8 W \ub7f0\uce6d 1\uac1c\uc6d4 \uc885\ud569)","items":[{"tag":"\uc5d0\uc5b4\ubca8W 1\uac1c\uc6d4","text":"\ub0b4/\uc678\uad6d\uc778: \ub0b4\uad6d\uc778 50~60%:\uc678\uad6d\uc778 40~50% (\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ub86f\ub370\uc758\uc655\uc740 \uc678\uad6d\uc778 60~70%). \uc8fc \uad6c\ub9e4 \uc5f0\ub839: 20~40\ub300 \uc5ec\uc131. \uad6c\ub9e4 \ubaa9\uc801: \uc77c\uc0c1\ud654\u00b7\uc5ec\ub984 \uac00\ubccd\uac8c \uc2e0\uae30 \uc555\ub3c4\uc801."},{"tag":"\uae0d\uc815","text":"\uba54\ub9ac\uc81c\uc778 \ub514\uc790\uc778\u00b7\ucc29\ud654\uac10\u00b7\ucfe0\uc158\uac10 \uae0d\uc815. '\ubc1c\ub808\ucf54\uc5b4 \uc2a4\ud0c0\uc77c\ub9c1 \uc6d0\ud558\ub294 20~30\ub300 \uc5ec\uc131 \uad6c\ub9e4'. \uc0ac\uc774\uc988 10\ub2e8\uc704 \ucd9c\uc2dc\ub85c \uc560\ub9e4\ud55c \uc0ac\uc774\uc988 \uc774\ud0c8\uc740 \uacc4\uc18d \ubc1c\uc0dd."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\uc5b4\ubca8 \uc5f0\uacb0 \uba54\uc26c\ub9dd \ub0b4\uad6c\uc131 \uc57d\ud558\ub2e4\ub294 \ud074\ub808\uc784** (\uc544\uc774\ud30c\ud06c) '\ub108\ubb34 \uc57d\ud574\uc11c \ub0b4\uad6c\uc131 \ubb38\uc81c \uc81c\uae30 \uace0\uac1d' \u2192 \ud488\uc9c8 \ud655\uc778 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub7ec\uc26c\ud22c\uc5b4 \uc55e\ubc1c \ubcfc \ubc8c\uc5b4\uc9c0\ub294 \ud604\uc0c1 A/S 3\uac74 \ub3d9\uc2dc \uc811\uc218** (\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) '\ucc29\uc6a9 \ud69f\uc218 \ub9ce\uc9c0 \uc54a\uc740\ub370 \ub3d9\uc77c \ud604\uc0c1 \ubc18\ubcf5, \uac00\uaca9 \ub300\ube44 \ub0b4\uad6c\uc131 \ubb38\uc81c \uac15\ud558\uac8c \uc81c\uae30' \u2192 \uc989\uc2dc \ud655\uc778\u00b7\ub300\uc751 \ud544\uc694"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 '\uc624\ud508 \uc774\ub798 \uac00\uc7a5 \ub77c\ucf13 \ud310\ub9e4 \uc88b\uc740 \ub2ec'. \ub864\ub791\uac00\ub85c\uc2a4 \ud074\ub798\uc2dc UL 1\uadf8\ub9bd \uc5ec\uc131 1\uc704 \uc720\uc9c0. \ud14c\ub9b0\uc774 \uc785\ubb38\uce35: \uc6b8\ud2b8\ub77c\u00b7\ud074\ub798\uc2dc \uc120\ud638 \uc9c0\uc18d."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 4\uc8fc \uc5f0\uc18d** (\ucee4\ub125\ud2b8\uccad\uc8fc\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \ub4f1) \u2014 \ub0a8\uc131 \uace0\uac1d \uc774\ud0c8 \ubc18\ubcf5 \u2192 \uae34\uae09 \uc7ac\uc785\uace0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc989\uc2dc \uc2a4\ud2b8\ub9c1 \ubd88\uac00 \ub9e4\uc7a5 \uad6c\ub9e4 \uc774\ud0c8** (\ub86f\ub370\ubd80\uc0b0\u00b7\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4) '\uc18c\uc694 1~2\uc77c\uc774\uba74 \uc778\uadfc \ud640\uc138\uc77c\ub85c \uc774\ud0c8' \u2192 \uc2a4\ud2b8\ub9c1 \uc11c\ube44\uc2a4 \ubc29\uc548 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 \ud14c\ub9b0\uc774 1\uadf8\ub9bd \uc7ac\uace0 \ubd80\uc871 3\uc8fc \uc5f0\uc18d** (\uc0ac\uc774\uba3c\uc5ec\uc8fc) \u2192 \uc785\uace0 \uc2dc\uae09"},{"tag":"\uc774\uc288","text":"V9 \ud560\uc778 \ubb38\uc758 \uc99d\uac00 (\uc0ac\uc774\uba3c\ud30c\uc8fc\u00b7\ucee4\ub125\ud2b8\uccad\uc8fc) \u2014 \uc7ac\uace0 \uc815\ub9ac \ubc29\ud5a5 \uac80\ud1a0."}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc218\uc694 \uc548\uc815\uc801\uc774\ub098 \uc7ac\uace0 \ud55c\uacc4 \uadfc\uc811. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc7ac\uace0\ub9cc \uc788\uc73c\uba74 \ubb34\uc870\uac74 \uad6c\ub9e4\ud558\ub294 \ucda9\uc131 \uace0\uac1d \u591a, \uceec\ub7ec\ubcfc\u00b7\uc5d0\ubcf4 NXT \ud504\ub9ac\ubbf8\uc5c4 \ubaa8\ub378 \ud310\ub9e4 \uac15\uc138'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7\u00b7\uc5d0\ubcf4\ub125\uc2a4\ud2b8 \uc7ac\uace0 \ud55c\uacc4** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131\u00b7\ub354\ud604\ub300\uc11c\uc6b8) 'DP\ub9cc \ub0a8\uac70\ub098 \ub9e4\uc7a5 \uc218\ub7c9 \uac70\uc758 \uc5c6\uc74c' \u2192 \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\uc774\uc288","text":"\uc720\uc18c\ub144 \uae00\ub7ec\ube0c A360 \ucd08\ub4f1 \uc800\ud559\ub144\uc6a9 \ubb38\uc758 (\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765). \ucd95\uad6c\uacf5\u00b7\ubbf8\uc2dd\ucd95\uad6c\uacf5 \ubb38\uc758 \uc9c0\uc18d (\uc544\uc774\ud30c\ud06c)."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcc9 \uc804\ubc18 \uac10\uc18c \u2014 \uc6d4\ub9d0 \uc18c\ube44 \ub454\ud654, \uae30\uc628 \uae09\uc0c1\uc2b9\uc73c\ub85c \uc8fc\ub9d0 \uc544\uc774\uc1fc\ud551 \ube44\uc911 \uc99d\uac00. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\ub7ec\ub2dd \uace0\uac1d \uc99d\uac00' \u2014 \uae30\uc874 \ud14c\ub2c8\uc2a4 \uc911\uc2ec\uc5d0\uc11c \ub7ec\ub2dd \uace0\uac1d \uc720\uc785 \uc0c8 \ud2b8\ub80c\ub4dc. \uc2e0\uc138\uacc4\uad11\uc8fc \uc2a4\ubc85 \uad00\ub828 \uc774\uc288 \uc601\ud5a5 \uc9c0\uc18d."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\uc5b8\ub354\uc544\uba38 2\uac1c\u2191 \ucd94\uac00 40% / \ub098\uc774\ud0a4\u00b7\uc544\ub514\ub2e4\uc2a4 2\uac1c\u2191 \ucd94\uac00 30% / \ud0c0\ubbf8\ud790\ud53c\uac70 80% / \uc2a4\ub178\uc6b0\ud53c\ud06c 60% / \ud720\ub77c \uc0c1\uc124 \ucd5c\ub300 80%"}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\uc120\uc14b\ub9e4\uce58 NTS52 \ubc11\ub2e8 \uc6cc\uc2f1 \ubd80\uc815 \ubc18\uc751","\ub9e4\uc7a5":"\uc2e0\uc138\uacc4\uad11\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\ub514\uc790\uc778 \ud53c\ub4dc\ubc31 \uc804\ub2ec"},{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"\ub0a8\uc131 \uc1fc\uc b4\ub4dc\ub77c\uc774 \ud130\uce58\ub97c \uc5ed\uc804, \uc5ec\ub984 \uc2dc\uc98c \ubcf8\uaca9\ud654. \ub864\ub791\uac00\ub85c\uc2a4 TV \uc911\uacc4 \ud6a8\uacfc\ub85c \uc2e0\uc138\uacc4\uac15\ub0a8 \uc5ed\ub300 \ucd5c\uace0 \ub77c\ucf13 \ub9e4\ucd9c(4\uc77c 60\uac1c). \ub4dc\ub85c\uc6b0 V2 \uc544\uc774\ubcf4\ub9ac\u00b7\ud654\uc774\ud2b8 \uc7ac\uc785\uace0 \uc804\ub9e4\uc7a5 \ud3ed\ubc1c\uc801 \ubc18\uc751. \ub18d\uad6c\uacf5 \uc7ac\uace0 \uace0\uac08\uc774 6\uc8fc \uc5f0\uc18d \ub204\uc801\ub418\uba70 \ub9e4\ucd9c \uc190\uc2e4 \ubcf8\uaca9\ud654, \uae34\uae09 \uc785\uace0 \ud544\uc694\uc131 \ucd5c\uace0\uc870. \ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 5\uc8fc\uc9f8, \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \ubd88\uac00\ub85c \uc778\ud55c \ub9e4\uc7a5 \uc774\ud0c8\ub3c4 \uc2ec\uac01 \ub2e8\uacc4 \uc9c4\uc785.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc18c\uc7ac \uc218\uc694 \ud3ed\ubc1c** \u2014 \uae30\uc628 30\ub3c4 \uc9c4\uc785\uc73c\ub85c \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ud130\uce58\ub97c \ucc98\uc74c\uc73c\ub85c \uc5ed\uc804\ud55c \ub9e4\uc7a5 \ub2e4\uc218 (\ud604\ub300\uc911\ub3d9). \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc758\ub958+\ub77c\ucf13+\uc6a9\ud488 \uc5f0\uacc4 \uad6c\ub9e4 \uc9d1\uc911, \ub77c\ucf13\uc774 \ud575\uc2ec\uc774\uace0 \uc758\ub958 \ub9e4\ucd9c\uc774 \ud3ed\ub4f1\ud55c \ud55c \uc8fc'. \ub864\ub791\uac00\ub85c\uc2a4 TV \uc911\uacc4 \ud6c4 \ub77c\ucf13 \uc720\uc785 \uace0\uac1d \uc18c\ud3ed \uc99d\uac00."},{"tag":"\ud2b9\uc774","text":"\uc0c1\uc124 \ucd94\uac00 10% \ud560\uc778 \ud504\ub85c\ubaa8\uc158 \ud6a8\uacfc \u2014 \uac1d\ub2e8\uac00 \uc0c1\uc2b9, \uc5f0\uacc4 \uad6c\ub9e4 \uc720\ub3c4 \uc804 \ub9e4\uc7a5 \uae0d\uc815 \ubc18\uc751. \ub7ec\uc26c\ud504\ub85c 2~3\ucf24\ub808 \ub2e4\ub7c9 \uad6c\ub9e4 \uace0\uac1d \ubc1c\uc0dd (\ub86f\ub370\ucc3d\uc6d0)."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc218\uc694 \uae09\uaca9\ud788 \uc0c1\uc2b9** \u2014 \ucc98\uc74c\uc73c\ub85c \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ud130\uce58 \uc5ed\uc804 \ub9e4\uc7a5 \ubc1c\uc0dd. \ud83d\udcc8 **\ub864\ub791\uac00\ub85c\uc2a4 TV \uc911\uacc4 \uc774\ud6c4 \ub77c\ucf13 \uc720\uc785 \uc99d\uac00** \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 \uc5ed\ub300 \ub864\ub791\uac00\ub85c\uc2a4 \ub77c\ucf13 \ucd5c\uace0 \ub9e4\ucd9c \uac31\uc2e0 (\ubaa9~\uc77c 4\uc77c 60\uac1c \ud310\ub9e4). \ud83d\udcc9 \ub0a0\uc528 \ub354\uc6cc\uc9c0\uba70 \uc8fc\ub9d0 \uc544\uc774\uc1fc\ud551 \uc804\ubc18 \uac10\uc18c, \ubaa9\uc801 \uad6c\ub9e4 \uace0\uac1d \ube44\uc911 \ub192\uc544\uc9c0\ub294 \ucd94\uc138."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc2dc\uc5b4\uc544\uc774\uc2a4\u00b7\uc120\uc14b\ub9e4\uce58\u00b7\ud4e8\uc5b4\ub4dc\ub77c\uc774 3\uac15 \uad6c\ub3c4 \uc548\ucc29. \ud3f4\ub85c \ud2f0\uc154\uce20 \uc218\uc694 \uac15\uc138 (\uc2e0\uc138\uacc4\uc13c\ud140 '2NPS41\u00b7\uc2dc\uc5b4\uc544\uc774\uc2a4 \ud3f4\ub85c \ubc18\uc751 \uad49\uc7a5\ud788 \uc88b\uc74c')."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc640\uc774\ub4dc\ud32c\uce20 \ube14\ub799 \ubbf8\ucd9c\uc2dc 4\uc8fc \uc5f0\uc18d** (\uc2e0\uc138\uacc4\ub300\uc804\u00b7\uc2e0\uc138\uacc4\uc758\uc815\ubd80) \u2014 '\uc77c\uc0c1\ubcf5\uc73c\ub85c \ube14\ub799 \uceec\ub7ec \ud544\uc694' \u2192 \uae30\ud68d \ubc18\uc601 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc120\uc14b\ub9e4\uce58 \ub9c1\uac70 \uc2ac\ub9bc W \uc7ac\uace0 \ubd80\uc871** (\ub86f\ub370\uc778\ucc9c\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) \u2014 8\uc6d4\uae4c\uc9c0 \ud310\ub9e4 \uac00\ub2a5 \uc544\uc774\ud15c \u2192 \uc7ac\uc785\uace0 \uac80\ud1a0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\ube0c\ub9ac\ub370\uc774 \ucf54\ud2b8 \ub4dc\ub808\uc2a4 W \ubcfc \uc218\ub0a9 \uc8fc\uba38\ub2c8 \uc5c6\ub2e4\ub294 \ud53c\ub4dc\ubc31** (\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0) \u2014 \ucc28\uae30 \uae30\ud68d \ubc18\uc601 \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc804\ub144 \ub300\ube44 \ub514\uc790\uc778 \uc720\uc0ac \ud53c\ub85c\uac10 (\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765). \uc587\uc740 \uae34\ubc14\uc9c0 SKU \ubd80\uc871 (\ud604\ub300\ubb34\uc5ed\u00b7\uc2e0\uc138\uacc4\uc758\uc815\ubd80) \u2014 \uc5ec\ub984 \uc790\uc678\uc120 \ucc28\ub2e8\uc6a9 \uae34\ubc14\uc9c0 \ubb38\uc758 \ub9ce\uc73c\ub098 \uad6c\uc131 \ubd80\uc871."}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d (\ub4dc\ub85c\uc6b0 V2 \uc544\uc774\ubcf4\ub9ac\u00b7\ud654\uc774\ud2b8 \uc7ac\uc785\uace0)","items":[{"tag":"\ub4dc\ub85c\uc6b0V2 \uc7ac\uc785\uace0","text":"\uc804 \ub9e4\uc7a5 \uc989\uac01\uc801\u00b7\uae0d\uc815\uc801 \ubc18\uc751 \u2014 \ub300\uae30 \uace0\uac1d \uc989\uc2dc \uad6c\ub9e4, \ub77c\ucf13\u00b7\uc2e0\ubc1c \uc5f0\uacc4 \ud310\ub9e4 \uc99d\uac00. \uc544\uc774\ubcf4\ub9ac > \ud654\uc774\ud2b8 > \uadf8\ub9b0 \uc778\uae30 \uc21c\uc11c (\ucee4\ub125\ud2b8\uccad\uc8fc)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0 V2 \uae30\ud0c0 \uceec\ub7ec \uc7ac\uace0 \ubd80\uc871** (\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591) '\uc544\uc774\ubcf4\ub9ac \uc678 \uceec\ub7ec \uc7ac\uace0 \uac70\uc758 \uc5c6\uc5b4' \u2192 \uc804\uccb4 \uceec\ub7ec \uc7ac\uace0 \ud604\ud669 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub0a8\uc131 \ud22c\uc5b4\ubc31\u00b7\ub354\ud50c\ubc31 \ubb38\uc758 \uc99d\uac00** (\ud604\ub300\ubb34\uc5ed\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8) '\ubc31\ud329\ub9cc\uc73c\ub85c \uc751\ub300 \ud55c\uacc4' \u2192 \uae30\ud68d \uac80\ud1a0"},{"tag":"\uc774\uc288","text":"\uc554\uc2ac\ub9ac\ube0c\u00b7\ubc14\uc774\uc800 \uc218\uc694 \uae09\uc99d \uc804 \ub9e4\uc7a5 \uacf5\ud1b5. \uc591\ub9d0 \uc18c\uc9c4 \ube60\ub984 \uc9c0\uc18d \u2014 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694."}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ubcfc\ud2b8\ud504\ub85c 1.5\u00b7\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c 1.5 \uc591\uac15 \uc720\uc9c0. \uc0c1\uc124 \ucd94\uac00 10% \ud560\uc778 \ud6a8\uacfc\ub85c \ub7ec\uc26c\ud504\ub85c \ub2e4\ub7c9 \uad6c\ub9e4 \ubc1c\uc0dd."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c\u00b7\ubcfc\ud2b8\ud504\ub85c \uc0ac\uc774\uc988 \uc7ac\uace0 \ubd80\uc871 \uc804 \ub9e4\uc7a5** \u2014 '\ub0a8\uc131 290\u00b7295mm \uc785\uace0 \uc5c6\uc5b4 \uc774\ud0c8 \uc2ec\uac01' (\ud604\ub300\ubb34\uc5ed\u00b7\uc2e0\uc138\uacc4\ub300\uc804) \u2192 \uc0ac\uc774\uc988 \ubcf4\ucda9 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub9ac\uc2a4\ud3f0\uc2a4\ud504\ub85c \ud654\uc774\ud2b8 \uc804\uccb4 \ud488\uc808** (\uc2e0\uc138\uacc4\ub300\uc804) '\uc5ec\uc131 \uc62c\ud654\uc774\ud2b8 \uc9d1\ucc29\uc801 \uc218\uc694' \u2192 \uc785\uace0 \uc77c\uc815 \ud655\uc778"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\uc5b4\ubca8 W \uc18c\ud615 \uc0ac\uc774\uc988(220\u00b7225mm) \ubb38\uc758 \uae09\uc99d** (\uc2e0\uc138\uacc4\uac15\ub0a8\u00b7\ub86f\ub370\uc758\uc655) '\uc791\uc740 \uc0ac\uc774\uc988 \uc5c6\uc5b4 \uc774\ud0c8' \u2192 \uc0ac\uc774\uc988 \uac80\ud1a0"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\uc5ed\ub300\ucd5c\uace0","text":"\uc2e0\uc138\uacc4\uac15\ub0a8 \uc5ed\ub300 \ub864\ub791\uac00\ub85c\uc2a4 \ub77c\ucf13 \ucd5c\uace0 \ub9e4\ucd9c \uac31\uc2e0 \u2014 \ubaa9~\uc77c 4\uc77c\uac04 60\uac1c \ud310\ub9e4. TV \uc911\uacc4 \uc2dc\uccad \ud6c4 \ubc29\ubb38 \uace0\uac1d \uc99d\uac00 \ud655\uc778. \uc5d0\uace0\ub2c8(\ubdf0\ud2f0&\uc5d0\uace0\ub2c8) \uc2e0\uaddc \uc785\uace0 \ubc18\uc751 \uae0d\uc815\uc801."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ube14\ub808\uc774\ub4dc 100 PRO \ud488\uc808 5\uc8fc \uc5f0\uc18d** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\ub86f\ub370\uc544\uc6b8\ub81b\uae30\ud765\u00b7\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8 \ub4f1) \u2014 \ub0a8\uc131 \uace0\uac1d \uc774\ud0c8 \uc9c0\uc18d \u2192 \uae34\uae09 \uc7ac\uc785\uace0 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc989\uc2dc \uc2a4\ud2b8\ub9c1 \ubd88\uac00 \ub9e4\uc7a5 \uc774\ud0c8 \uc2ec\uac01** (\uc544\uc774\ud30c\ud06c\u00b7\ub86f\ub370\ucc3d\uc6d0\u00b7\ub098\uc778\uc6d0\ud55c\ub0a8) '2\ud300 \ubaa8\ub450 \uc989\uc2dc \uc2a4\ud2b8\ub9c1 \uc6d0\ud574 \ud14c\ub2c8\uc2a4\uba54\ud2b8\ub85c\ub85c \uc774\ud0c8' \u2192 \uae34\uae09 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ud14c\ub2c8\uc2a4\uba54\ud2b8\ub85c \ud504\ub85c\ubaa8\uc158 \uacbd\uc7c1** (\uc544\uc774\ud30c\ud06c) '10\ub9cc\u2191 \ud314\ud1a0\uc2dc, 40\ub9cc\u2191 \uc804\ubd80 \uc99d\uc815' \u2192 \ub2f9\uc0ac \ub300\uc751 \ubc29\uc548 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 \ud14c\ub9b0\uc774 1\uadf8\ub9bd \uc7ac\uace0 \ubd80\uc871 4\uc8fc \uc5f0\uc18d** (\uc0ac\uc774\uba3c\uc5ec\uc8fc) \u2192 \uc785\uace0 \uc2dc\uae09"}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub18d\uad6c\uacf5 \uc7ac\uace0 \uace0\uac08 6\uc8fc \uc5f0\uc18d \uc2ec\ud654** \u2014 \uac70\uc758 \uc804 \ub9e4\uc7a5 '\uc7ac\uace0 \uc5c6\uc5b4 \ud310\ub9e4 \ubd88\uac00, \uc644\ubd88 \uc8fc\ubb38\uc73c\ub85c\ub9cc \ub300\uc751' \u2192 \uae34\uae09 \uc785\uace0 \ud544\uc694, \ub9e4\ucd9c \uc190\uc2e4 \ub204\uc801"},{"tag":"\ud2b8\ub80c\ub4dc","text":"\ub18d\uad6c \ud2b8\ub80c\ub4dc \ud655\uc0b0 \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub18d\uad6c\uac00 \uc591\ud654 \ud6a8\uacfc, \ub2e8 \uc0ac\uc774\uc988 \uae68\uc9d0 \ubb38\uc81c \ub3d9\ubc18. \ub18d\uad6c\uacf5 \uc7ac\uace0 \uace0\uac08 \uc9c0\uc18d, \uc5ec\uc131 \uc120\ud638 \ub77c\ucf13 \uc911\ub7c9\u00b7\uadf8\ub9bd \ubd80\uc871\ub3c4 2\uc8fc\uc9f8 \ubbf8\ud574\uacb0. \uc0ac\uc740\ud488(\uadf8\ub9bd\ucee4\ubc84\u00b7\uc2a4\ud06c\ub7f0\uce58) \uac1c\uc120 \uc694\uccad\uacfc \ucc28\uae30 \uc591\ub9d0 \uc0ac\uc740\ud488 \uc694\uccad \ub2e4\uc218 \uc811\uc218.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314+\uc14b\uc5c5** \uc804 \uc5f0\ub839\u00b7\uc131\ubcc4 \uacf5\ud1b5 \ubca0\uc2a4\ud2b8. \uc2e0\uc138\uacc4\uac15\ub0a8 '\ub77c\ucf13+\uc758\ub958+\uc6a9\ud488 \uc804\uccb4\uc801\uc73c\ub85c \uade0\ub4f1\ud558\uac8c \uc798 \ud314\ub9b0 \ud55c \uc8fc, \ub0a8\uc131 \uace0\uac1d \uc758\ub958 \uad6c\ub9e4 2\uc8fc \uc5f0\uc18d \uc99d\uac00'. 2030 \uc5ec\uc131: \uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc(\ud53c\ud0a4 \ud37c\ud50c), 3040 \uc5ec\uc131: \uc218\uc785\ub77c\uc778(TSK42), 2030 \ub0a8\uc131: \uc120\uc14b\ub9e4\uce58\u00b7\ucf54\ud2b8\ub77c\uc778 \uc1fc\uce20."},{"tag":"\ud2b9\uc774","text":"**\uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc \uceec\ub809\uc158 \ub7f0\uce6d** \u2014 \ud130\uce58\ub294 \uc788\uc73c\ub098 \uad6c\ub9e4 \uc804\ud658\uc740 \ub9e4\uc7a5\ubcc4 \uc628\ub3c4\ucc28 \ud07c. \ubcfc\ud2b8\ud504\ub85c \uc2e0\uaddc \uceec\ub7ec \uc785\uace0 \u2014 \ud654\uc774\ud2b8\u00b7\ube14\ub8e8 \ubc18\uc751 \uc88b\uc73c\ub098 \uc804\ud658\uc740 \uc9c0\ucf1c\ubd10\uc57c."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc9 **\uc804\ubc18 \ud070 \ud3ed \uac10\uc18c** \u2014 \ub2e4\uc218 \ub9e4\uc7a5 '\uc804\uc8fc \ub300\ube44 20~60% \uac10\uc18c'. \uc6d0\uc778: \ud734\ubb34\uc77c\u00b7\uc120\uac70\u00b7\uc6d4\ub4dc\ucef5 \uacbd\uae30\u00b7\uc88b\uc740 \ub0a0\uc528 \uc678\ubd80\ud65c\ub3d9 \uc99d\uac00. \ud83d\udcc8 \uc2dc\uc5b4\uc544\uc774\uc2a4 \uac15\uc138 \uc9c0\uc18d\ub418\ub098 \uc77c\ubd80 \ub9e4\uc7a5 \ub2e4\uc2dc \ud4e8\uc5b4\ub4dc\ub77c\uc774\ub85c \ud68c\uadc0 (\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4). \ub86f\ub370\ubd80\uc0b0 BTS \uacf5\uc5f0+\ud06c\ub8e8\uc988 \uc678\uad6d\uc778 \uae09\uc99d."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (\uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc \ubc18\uc751)","items":[{"tag":"\uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc","text":"\uad6c\ub9e4 \ubaa9\uc801: \ub9e4\uc7a5\ubcc4 \ud3b8\ucc28 \ud07c \u2014 \uc2e0\uc138\uacc4\ub300\uc804 '\ud14c\ub2c8\uc2a4 60:\ub77c\uc774\ud504 40', \ud604\ub300\uc911\ub3d9\u00b7\ub86f\ub370\uc778\ucc9c '\ub77c\uc774\ud504 \ube44\uc911 \ub354 \ub192\uc74c'. \uc5f0\ub839: 20~30\ub300 \uc9d1\uc911. 50\ub300 \uc774\uc0c1 \ud130\uce58\uc870\ucc28 \uc5c6\uc74c (\uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4)."},{"tag":"\uc774\uc288","text":"'\uadf8\ub798\ud53d\uc774 \ub108\ubb34 \ud06c\uace0 \uc911\uc559\uc5d0 \uc788\uc5b4 \ubd80\ub2f4\uc2a4\ub7fd\ub2e4' (\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8). TTS76 \uc624\ubc84\ud54f \uc0ac\uc774\uc988 \uc791\uc740 \uc0ac\uc774\uc988\ub85c \uc3e0\ub9bc (\ud604\ub300\ubb34\uc5ed)."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\ub984 \uc587\uc740 \uae34\ubc14\uc9c0\u00b7\uc790\uc678\uc120 \ucc28\ub2e8 \uae34\ud314 \uc774\ub108 \ubbf8\ucd9c\uc2dc** (\uc2e0\uc138\uacc4\ub300\uc804) \u2014 \uc218\uc8fc \ubc18\ubcf5 \u2192 \ucc28\uae30 \uc2dc\uc98c \uae30\ud68d \uac15\ub825 \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub0a8\uc131 \ud3f4\ub85c\ud2f0 \ub77c\uc778\uc5c5 \ubd80\uc871\u00b7NPS43 \uc6d0\ub2e8 \ub450\uaebc\uc6c0** (\uc2e0\uc138\uacc4\ub300\uc804\u00b7\uc2e0\uc138\uacc4\uad11\uc8fc) \u2014 \ub354 \uc587\uc740 \ud3f4\ub85c\ud2f0 \ub2e4\uc591\ud654 \ud544\uc694"}]},"\uc6a9\ud488":{"title":"\uc6a9\u 5\ud1b5\uc73c\ub85c \ud655\uc778\ub3fc \ucc28\uae30 \uc2dc\uc98c \uae30\ud68d \ud544\uc694\uc131 \uba85\ud655\ud654. \uc5d0\uc5b4\ub9ac W \ub9ac\uc624\ub354\ub294 '\uc785\uace0 \uc2dc\uae30 \ub2a6\uc74c'\uc73c\ub85c \ub300\uae30 \uace0\uac1d \uc0c1\ub2f9\uc218 \uc774\ud0c8. \uc5ec\uc131 260~280g 1\uadf8\ub9bd \ub77c\ucf13 \uc7ac\uace0 \ubd80\uc871\uc774 \uc218\uc8fc\uc9f8 \ub204\uc801, \ud575\uc2ec \ubbf8\ud574\uacb0 \uc774\uc288\ub85c \uace0\ucc29. \uc57c\uad6c\uae00\ub7ec\ube0c \ubb38\uc758 \uae09\uc99d(\uc57c\uad6c \uc2dc\uc98c), \uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc7ac\uc785\uace0\ub410\uc73c\ub098 \uc18c\ub7c9\uc774\ub77c \ube60\ub978 \uc7ac\uc18c\uc9c4 \uc6b0\ub824.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**\uc120\uc14b\ub9e4\uce58 \ub7f0\uce6d \uc774\ud6c4 \ub77c\uc774\ud504\uc2a4\ud0c0\uc77c \uace0\uac1d \uc99d\uac00** \ub69c\ub837. \uc774\ubc88 \uc8fc \uac00\uc7a5 \ud070 \ubcc0\ud654\ub294 **FW \uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc785\uace0 \ud6a8\uacfc** \u2014 '\uc2e4\ubb3c \ubcf4\uace0 \uc2f6\uc5b4 \ub0b4\ubc29' \uace0\uac1d \uae09\uc99d. \uba5c\ub85c\uc6b0 \ud06c\ub86d \uc7ac\uc785\uace0 \ud6c4 \uc989\uac01 \ubc18\uc751, \ub098\uc778\uc6d0\ud55c\ub0a8 '\uc678\uad6d\uc778 \ub300\ub7c9 \uad6c\ub9e4'. \ub2e8\uccb4\u00b7\uc18c\uaddc\ubaa8 \ud074\ub7fd \ubb38\uc758 \uc99d\uac00 (\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\uc0ac\uc774\uba3c\uc5ec\uc8fc)."},{"tag":"\ud2b9\uc774","text":"\uc120\uc14b\ub9e4\uce58 \uad6c\ub9e4 \uc758\ub3c4: **\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uc6b4\ub3d9 \ubaa9\uc801 \uad6c\ub9e4 \uc555\ub3c4\uc801** \u2014 '\ud734\uac00 \ubaa9\uc801 \uac70\uc758 \uc5c6\uc74c'. \uadf9\ud788 \uc77c\ubd80\ub9cc \ub370\uc77c\ub9ac\u00b7\uc5ec\ud589\uc6a9 \uad6c\ub9e4."}]},"\uc804\uc8fc\ub300\ube44":{"title":"\uc804\uc8fc \ub300\ube44 \ubcc0\ud654","items":[{"tag":"\ubcc0\ud654","text":"\ud83d\udcc8 **FW \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc2e0\uc0c1 \uc785\uace0** \u2014 \uc7ac\uad6c\ub9e4\uc728 \ub192\uc740 \ub2e8\uace8 \uace0\uac1d \uc2e0\uc0c1 \uad6c\ub9e4 \uc5f0\uacb0. \ud83d\udcc8 **\uba5c\ub85c\uc6b0 \uc2dc\ub9ac\uc988 \uc7ac\uc785\uace0** \uc989\uac01 \ubc18\uc751, \ud654\uc774\ud2b8 \uceec\ub7ec \ud130\uce58 \uc555\ub3c4\uc801. \ud83d\udcc9 \ud55c\uc5ec\ub984 \uc9c4\uc785\uc73c\ub85c \uc804\ubc18 \uc785\uc810 \ube44\uc2b7\ud558\uac70\ub098 \uc18c\ud3ed \uac10\uc18c. \uc2a4\ud0c0\ud544\ub4dc\ucf54\uc5d1\uc2a4 '\ud3c9\uc77c \uc720\ub3d9\uc778\uad6c \ud06c\uac8c \uac10\uc18c \uccb4\uac10'."}]},"\uc758\ub958":{"title":"\uc758\ub958 \ud2b9\uc774\uc0ac\ud56d (FW \uc2e0\uc0c1\u00b7\uc5ec\uc131 \uc5ec\ub984 \uae34\ubc14\uc9c0 \uc218\uc694 \uc870\uc0ac)","items":[{"tag":"FW \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\uc751","text":"\uc804\ubc18 \ub9e4\uc6b0 \uae0d\uc815\uc801. '\uae30\uc874 \ub300\ube44 \ucc28\ubd84\ud558\uace0 \uace0\uae09\uc2a4\ub7ec\uc6b4 \uceec\ub7ec\uac10' (\uc2e0\uc138\uacc4\ub300\uc804). \ud551\ud06c \uceec\ub7ec \uac00\uc7a5 \uc778\uae30 (\uc2e0\uc138\uacc4\uc758\uc815\ubd80 '\ud310\ub9e4 1\ub4f1'). \ub2e8, \uc77c\ubd80 '\uae30\uc874\uacfc \ub514\uc790\uc778 \uc720\uc0ac\ud574 \ub2e8\uace8 \ud53c\ub85c\uac10' (\ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0)."},{"tag":"\uc5ec\uc131 \uc5ec\ub984 \uae34\ubc14\uc9c0 \uc218\uc694","text":"**\uc804 \ub9e4\uc7a5 \uacf5\ud1b5 \uc218\uc694 \ud655\uc778** \u2014 '\uc870\uac70\ubcf4\ub2e4 \uc2dc\uc5b4\uc544\uc774\uc2a4\ucc98\ub7fc \ub0c9\uac10\u00b7\uc587\uc740 \uc18c\uc7ac\uc758 \uc640\uc774\ub4dc/\uc138\ubbf8\uc640\uc774\ub4dc \uc120\ud638', 'UV \ucc28\ub2e8 \ubaa9\uc801 \uad6c\ub9e4 \ubd84\uba85\ud788 \uc874\uc7ac', '\uc54c\ub85c \ube0c\ub79c\ub4dc \uc2a4\ud0c0\uc77c \uc6d0\ud568'. \u2192 **\ucc28\uae30 \uc2dc\uc98c \uae30\ud68d \ubc18\uc601 \uc2dc\uae09**"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **FW \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5ec\uc131 \uc7ac\uace0 \ubd80\uc871** (\uc0ac\uc774\uba3c\uc5ec\uc8fc) '\uc5ec\uc131 \uc0ac\uc774\uc988 \uc804\ud600 \uc5c6\uc5b4 \ud310\ub9e4 \uae30\ud68c \ube48\ubc88\ud788 \ub85c\uc2a4' \u2192 \uc7ac\uace0 \ud655\ubcf4 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc2e0\uc0c1 \uc2a4\ucee4\ud2b8 \ubbf8\uc785\uace0\ub85c \uc14b\uc5c5 \ud310\ub9e4 \uc5b4\ub824\uc6c0** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0) '\uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc0c1\uc758 \uc785\uace0\ub410\ub294\ub370 \ub9e4\uce58\ud560 \uc2a4\ucee4\ud2b8 \uc5c6\uc5b4 \uc14b\uc5c5 \ud310\ub9e4 \uc81c\ud55c' \u2192 \uc785\uace0 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\uc5b4\ubaa8\uc158\ucea0\ud504\ucea1 \uc138\ud0c1 \ubd88\uac00 \uc774\uc288** (\uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0) '\uc5ec\ub984 \ubaa8\uc790\uc778\ub370 \uc190\uc138\ud0c1\ub3c4 \uc548 \ub3fc \ud310\ub9e4 \uc5b4\ub824\uc6c0' \u2192 \ucf00\uc5b4 \uc548\ub0b4 \ub610\ub294 \uc18c\uc7ac \uac80\ud1a0"}]},"\uc6a9\ud488":{"title":"\uc6a9\ud488 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ub4dc\ub85c\uc6b0 V2 \uafb8\uc900\ud55c \ud310\ub9e4 \uc720\uc9c0. \uc678\uad6d\uc778 \uace0\uac1d \ub4dc\ub85c\uc6b0 V2 \uc778\uae30 \uc9c0\uc18d (\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ub86f\ub370\uc544\uc6b8\ub81b\ub3d9\ubd80\uc0b0). \ubaa8\uc790\u00b7\uc554\uc2ac\ub9ac\ube0c\u00b7\ub9c8\uc2a4\ud06c \uc5ec\ub984 \uc6a9\ud488 \uc218\uc694 \uae09\uc99d."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ub4dc\ub85c\uc6b0\uc2a4\ud2b8\ub9c1 \uc5d0\uc5b4 YEL\u00b7GBL \uc7ac\uace0 \ubd80\uc871** (\uc2e0\uc138\uacc4\ub300\uc804\u00b7\ud604\ub300\ud310\uad50) '\ud574\ub2f9 \uceec\ub7ec \ubb38\uc758 \ub9ce\uc740\ub370 \uc7ac\uace0 \uc5c6\uc74c'"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubaa8\uc790\u00b7\uc591\ub9d0 \uae30\ubcf8 \uc7ac\uace0 \ubd80\uc871** (\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) \u2192 \uc7ac\uace0 \ubcf4\ucda9 \ud544\uc694"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubca0\uc77c \ub4dc\ub808\uc774\ud504 \ucea1 \ub9ac\uc624\ub354 \ubb38\uc758** (\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0) \u2014 \uc785\uace0 \uc77c\uc815 \ud655\uc778"}]},"\uc2e0\ubc1c":{"title":"\uc2e0\ubc1c \ud2b9\uc774\uc0ac\ud56d (\uc5d0\uc5b4\ub9ac W \ub9ac\uc624\ub354 \uc785\uace0 \ubc18\uc751)","items":[{"tag":"\uc5d0\uc5b4\ub9acW \ub9ac\uc624\ub354","text":"**\uc885\ud569: '\uc785\uace0 \uc2dc\uae30\uac00 \ub2e4\uc18c \ub2a6\uc74c'** \u2014 \uae30\ub2e4\ub9ac\ub2e4 \ud0c0 \uc81c\ud488 \uad6c\ub9e4\ud55c \uace0\uac1d \ub2e4\uc218 \ubc1c\uc0dd. \uae30\ub2e4\ub9ac\ub358 \uace0\uac1d \uc989\uc2dc \uad6c\ub9e4 (\uc2e0\uc138\uacc4\uc13c\ud140\u00b7\ub86f\ub370\uc758\uc655\u00b7\uc2a4\ud0c0\ud544\ub4dc\uace0\uc591). \uc2a4\ud0c0\ud544\ub4dc\uc218\uc6d0\u00b7\uc0ac\uc774\uba3c\ubd80\uc0b0 '\uc774\ubbf8 \ud0c0 \uc81c\ud488 \uad6c\ub9e4\ud55c \uace0\uac1d \u591a'."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ubcfc\ud2b8\ud504\ub85c \uadf8\ub9b0 \uc0ac\uc774\uc988 \ubd80\uc7ac \uc9c0\uc18d** (\uc2e0\uc138\uacc4\uc758\uc815\ubd80) '\uc804\uc0ac\uc774\uc988 \uc788\ub294 \uceec\ub7ec\ub85c\ub9cc \ud310\ub9e4 \uc911' \u2192 \uc7ac\uace0 \ubcf4\ucda9"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc218\uc785 \uc2e0\ubc1c \uc678\uad6d\uc778\ud5a5 \uc0ac\uc774\uc988 \ubd80\uc7ac \uc9c0\uc18d** (\uc2e0\uc138\uacc4\uc758\uc815\ubd80) '280\u00b7285\u00b7290\u00b7295 \ubd80\uc7ac \uc2ec\uac01' \u2192 \uc6b0\uc120 \ud655\ubcf4"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ucf54\ud2b8\uae00\ub77c\uc774\ub4dc \uc288\ud2b8\ub9ac\uc2a4\ud2f0\ucee4\u00b7\uc790\uc11d \ubbf8\uc785\uace0** (\ub86f\ub370\uc758\uc655) \u2014 \ud655\uc778 \ud544\uc694"}]},"\ub77c\ucf13":{"title":"\ub77c\ucf13 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\ud2b8\ub80c\ub4dc","text":"\ube14\ub808\uc774\ub4dc V10 + \ub864\ub791\uac00\ub85c\uc2a4 \uc5d0\ub514\uc158 \ud22c\ud0d1 \uc720\uc9c0. \ubdf0\ud2f0\uc5d0\uace0\ub2c8 \ub9e4\uc7a5 \ub0b4 \ube60\ub974\uac8c \uc18c\uc9c4 (\uc2a4\ud0c0\ud544\ub4dc\ud558\ub0a8). \ube14\ub808\uc774\ub4dc V10 \ubc14\uc774\ub7f4 \ud6a8\uacfc \u2014 'SNS \ubcf4\uace0 \uc654\ub2e4' \uace0\uac1d \ub2e4\uc218."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5ec\uc131 260~280g 1\uadf8\ub9bd \uc7ac\uace0 \ubd80\uc871 \uc218\uc8fc \uc5f0\uc18d** (\uc0ac\uc774\uba3c\uc5ec\uc8fc\u00b7\ud604\ub300\uc2a4\ud398\uc774\uc2a4\uc6d0\u00b7\uc544\uc774\ud30c\ud06c) '\ub9e4\uc8fc \ud310\ub9e4 \uae30\ud68c \ub193\uce58\ub294 \uc911, \uc5ec\uc131 \uace0\uac1d \uc751\ub300 \ubd88\uac00' \u2192 \uc785\uace0 \uc2dc\uae09"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **BNA 265g \ubbf8\ucd9c\uc2dc \uc774\ud0c8** (\ub098\uc778\uc6d0\ud55c\ub0a8) '\ub514\uc790\uc778\uc740 \uc5ec\uc131\uc6a9\uc778\ub370 265g \uc5c6\uc5b4 \uc774\ud0c8 \uace0\uac1d \ubc1c\uc0dd' \u2192 \uae30\ud68d \uac80\ud1a0"},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\ube14\ub808\uc774\ub4dc 100 PRO \uc785\uace0 \ub300\uae30 \uc9c0\uc18d** (\uac24\ub7ec\ub9ac\uc544\uc13c\ud130\uc2dc\ud2f0\u00b7\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131) \u2192 \uc785\uace0 \uc77c\uc815 \ub9e4\uc7a5 \uacf5\uc720"}]},"\ud300\uc2a4\ud3ec\uce20":{"title":"\ud300\uc2a4\ud3ec\uce20 \ud2b9\uc774\uc0ac\ud56d","items":[{"tag":"\uc7ac\uc785\uace0 \ud6a8\uacfc","text":"\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc7ac\uc785\uace0 \ud6c4 \uc989\uac01 \ud310\ub9e4 \ubc18\uc751. '\uac10\uc0ac\ud558\ub2e4'\ub294 \ub9e4\uc7a5 \ud53c\ub4dc\ubc31 \ub2e4\uc218 \u2014 \uc7ac\uace0 \uacf5\ubc31 \uae30\uac04\uc774 \uae38\uc5c8\uc74c\uc744 \ubc18\uc99d."},{"tag":"\u26a0\ufe0f\uc989\uc2dc\uccb4\ud06c","text":"\u26a0\ufe0f **\uc5d0\ubcfc\ub8e8\uc158\u00b7\ud4e8\uc5b4\uc0f7 \uc7ac\uc785\uace0 \uc218\ub7c9 \uc18c\ub7c9** \u2014 \ub2e4\uc218 \ub9e4\uc7a5 '\uc18c\ub7c9 \uc785\uace0\ub85c \ub2e4\uc2dc \ube60\ub974\uac8c \uc18c\uc9c4 \uc6b0\ub824' \u2192 \uc7ac\uace0 \ud604\ud669 \uc9c0\uc18d \ubaa8\ub2c8\ud130\ub9c1"},{"tag":"\ud2b8\ub80c\ub4dc","text":"\uc57c\uad6c\uae00\ub7ec\ube0c \ubb38\uc758 \uae09\uc99d (\ub86f\ub370\uc7a0\uc2e4\u00b7\uc2e0\uc138\uacc4\uac15\ub0a8) '\uc57c\uad6c \uc2dc\uc98c \ub9de\uc544 \ud074\ub7fd \ubb38\uc758 \uc99d\uac00, \uc628\ub77c\uc778 \ubcf4\uace0 \uc2e4\ubb3c \ud655\uc778 \ubc29\ubb38'. \ubbf8\uc2dd\ucd95\uad6c\uacf5 \ubb38\uc758 \uc18c\ud3ed \uc99d\uac00 (\uc2a4\ud0c0\ud544\ub4dc\uc548\uc131\u00b7\ud604\ub300\ud310\uad50)."}]},"\uace0\uac1d\ub3d9\ud5a5":{"title":"\uace0\uac1d \uc785\uc810 \ub3d9\ud5a5","items":[{"tag":"\ub3d9\ud5a5","text":"\ud83d\udcca \uc804\ubc18 \ube44\uc2b7\ud558\uac70\ub098 \uc18c\ud3ed \uac10\uc18c. \ube44 \uc624\ub294 \ub0a0 \uc624\ud788\ub824 \ubc31\ud654\uc810 \uc720\uc785 \uc99d\uac00 \ub9e4\uc7a5 \ub2e4\uc218. \ub354\ud604\ub300\uc11c\uc6b8 \uc2a4\ud30c\uc624\u00b7\ud1a0\uc774\uc2a4\ud1a0\ub9ac \ud31d\uc5c5\uc73c\ub85c \uc678\uad6d\uc778\u00b7\ub0b4\uad6d\uc778 \ub3d9\uc2dc \uae09\uc99d. \uc2a4\ud0c0\ud544\ub4dc\uc548\uc131 '\ucd08\ub871\ud504\ub85c \ubc29\ubb38 \ud6c4 VM \uac1c\uc120, \uace0\uac1d \ud130\uce58 \uc99d\uac00'. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc678\uad6d\uc778 \ud14c\ub2c8\uc2a4 \uc2e0\uaddc \uc720\uc785 \uae09\uc99d\u00b7\ud53c\ud074\ubcfc \ubb38\uc758 \uc99d\uac00'."}]},"\uacbd\uc7c1\uc0ac":{"title":"\uacbd\uc7c1\uc0ac \ub3d9\ud5a5","items":[{"tag":"\uacbd\uc7c1\uc0ac","text":"\ud0c0\uc0ac \uc2dc\uc98c\uc624\ud504 \ud560\uc778 \uc2dc\uc791\uc73c\ub85c \uac00\uaca9 \uc800\ud56d \ubc1c\uc0dd (\uc2e0\uc138\uacc4\ub300\uc804). \ucd94\uc774 \ubaa8\ub2c8\ud130\ub9c1 \ud544\uc694."}]},"\uc989\uc2dc\uccb4\ud06c":{"title":"\u26a0\ufe0f \uc989\uc2dc \uccb4\ud06c \ub9ac\uc2a4\ud2b8","items":[{"\uad6c\ubd84":"\uc758\ub958","\ub0b4\uc6a9":"FW \ud4e8\uc5b4\ub4dc\ub77c\uc774 \uc5ec\uc131 \uc7ac\uace0 \ubd80\uc871","\ub9e4\uc7a5":"\uc0ac\uc774\uba3c\uc5ec\uc8fc","\uc0c1\ud0dc":"\u274c \ubbf8\ud574\uacb0","\uc870\uce58":"\uc7ac\uace0 \ud655\ubcf4 \u \ud83d\udccc \uc548\ub0b4\ud544\uc694","\uc870\uce58":"\uc0ac\uc804 \uc900\ube44 \uac80\ud1a0"}]}},"6\uc6d44W":{"date":"06/22~06/28","\uc804\uccb4\uc694\uc57d":"\uc714\ube14\ub358 \ud6a8\uacfc\ub85c \uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc\u00b7\ub77c\ucf13 \uc5d0\ub514\uc158 \ud310\ub9e4 \uae09\ub4f1, FW \uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314\uc774 \uc804\ub9e4\uc7a5 \uc555\ub3c4\uc801 1\uc704. \ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec(LGR\u00b7PNK\u00b7RED), \uc5d0\uc5b4\ub9ac W \uc2e0\uaddc \uceec\ub7ec \ubaa8\ub450 \uc989\uac01 \uae0d\uc815 \ubc18\uc751. \ud30c\uc774\uc36c \ub77c\ucf13 \uc0ac\uc804 \ubb38\uc758\uac00 SNS\u00b7\ube14\ub85c\uadf8 \ud1b5\ud574 \uae09\uc99d, \ucd9c\uc2dc \uc77c\uc815 \uacf5\uc720 \ud544\uc694\uc131 \ub300\ub450. \ube44\uc218\uae30\uac00 \uc791\ub144\ubcf4\ub2e4 \ud55c \ub2ec \ube60\ub974\uac8c \uc2dc\uc791\ub3fc \ub2e4\uc218 \ub9e4\uc7a5 \uc785\uc810 \ud070 \ud3ed \uac10\uc18c. \uc0ac\uc774\uba3c\uc5ec\uc8fc\ub294 \uc5ec\uc131 \uc758\ub958\u00b7\ub77c\ucf13 \uc7ac\uace0\uac00 \ubaa8\ub450 \uc804\ubb34\ud55c \uc0c1\ud0dc\ub85c \uae34\uae09 \ubc30\ubd84\uc774 \uc2dc\uae09\ud55c \ub9e4\uc7a5\uc73c\ub85c \ubd80\uac01.","\ud310\ub9e4\ubca0\uc2a4\ud2b8":{"title":"\uae08\uc8fc \ud310\ub9e4 \ubca0\uc2a4\ud2b8","items":[{"tag":"\ubca0\uc2a4\ud2b8","text":"**FW \uc2e0\uc0c1 \ud4e8\uc5b4\ub4dc\ub77c\uc774 \ubc18\ud314** \uc804 \ub9e4\uc7a5 \uc555\ub3c4\uc801 1\uc704. \uc2e0\uc138\uacc4\uac15\ub0a8 '\uc714\ube14\ub358 \uc601\ud5a5\uc73c\ub85c \uc2a4\ud2b8\ub85c\ubca0\ub9ac\uc564\ud06c\ub9bc \ud310\ub9e4 \uae09\ub4f1, \uadf8\ub79c\ub4dc\uc2ac\ub7a8 \uc6d4\ub9c8\ub2e4 \ub9e4\ucd9c \uc99d\uac00 \uccb4\uac10'. \uba5c\ub85c\uc6b0 \ud06c\ub86d\u00b7\uc2dc\uc5b4\uc544\uc774\uc2a4 \uc14b\uc5c5 \ub3d9\ubc18 \uac15\uc138."},{"tag":"\ud2b9\uc774","text":"\ub4dc\ub85c\uc6b0 V2 \uc2e0\uaddc \uceec\ub7ec(LGR\u00b7PNK\u00b7RED) \uc785\uace0 \uc989\uac01 \ubc18\uc751 \u2014 \uc2e0\uc138\uacc4\uac15\ub0a8 'LGR+PNK\uac00 WHT \ud31
